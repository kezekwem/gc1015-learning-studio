<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Make reasoning inspectable"><rect width="900" height="470" rx="15" fill="#f4eef9"/><rect width="900" height="100" rx="15" fill="#330662"/><text x="35" y="40" font-family="sans-serif" font-size="14" fill="white">GC1015 · SESSION 01 · BRANCH 4</text><text x="35" y="77" font-family="sans-serif" font-size="27" fill="white">Make reasoning inspectable</text><text x="35" y="150" font-family="sans-serif" font-size="20" fill="#006d68">Observation → inference → assumption → next action</text><text x="35" y="207" font-family="sans-serif" font-size="18" fill="#3a3245">Software calculates. People judge whether evidence supports a</text><text x="35" y="235" font-family="sans-serif" font-size="18" fill="#3a3245">recommendation. Keep observed facts separate from claims about causes or</text><text x="35" y="263" font-family="sans-serif" font-size="18" fill="#3a3245">the future.</text><text x="35" y="429" font-family="sans-serif" font-size="15" fill="#57068c">Explain the connection. Name the evidence. State a limitation.</text></svg>
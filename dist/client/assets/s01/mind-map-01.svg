<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Start with the decision"><rect width="900" height="470" rx="15" fill="#f4eef9"/><rect width="900" height="100" rx="15" fill="#330662"/><text x="35" y="40" font-family="sans-serif" font-size="14" fill="white">GC1015 · SESSION 01 · BRANCH 1</text><text x="35" y="77" font-family="sans-serif" font-size="27" fill="white">Start with the decision</text><text x="35" y="150" font-family="sans-serif" font-size="20" fill="#006d68">Concern → stakeholder → action → evidence</text><text x="35" y="207" font-family="sans-serif" font-size="18" fill="#3a3245">A business problem describes a condition. A decision names a choice. An</text><text x="35" y="235" font-family="sans-serif" font-size="18" fill="#3a3245">analytic question identifies evidence that could inform that choice.</text><text x="35" y="429" font-family="sans-serif" font-size="15" fill="#57068c">Explain the connection. Name the evidence. State a limitation.</text></svg>
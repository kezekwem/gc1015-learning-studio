<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Choose across uncertain states"><rect width="900" height="470" rx="15" fill="#f4eef9"/><rect width="900" height="100" rx="15" fill="#330662"/><text x="35" y="40" font-family="sans-serif" font-size="14" fill="white">GC1015 · SESSION 04 · BRANCH 2</text><text x="35" y="77" font-family="sans-serif" font-size="27" fill="white">Choose across uncertain states</text><text x="35" y="150" font-family="sans-serif" font-size="20" fill="#006d68">States → probabilities → payoffs → expected value</text><text x="35" y="207" font-family="sans-serif" font-size="18" fill="#3a3245">Expected value weights outcomes by probability. Probabilities sum to one,</text><text x="35" y="235" font-family="sans-serif" font-size="18" fill="#3a3245">and payoffs use compatible units and horizons.</text><text x="35" y="429" font-family="sans-serif" font-size="15" fill="#57068c">Explain the connection. Name the evidence. State a limitation.</text></svg>
:"Media de Hub C","The running total reaches 1,661 in the 22-minute row, so both middle orders took 22 minutes.":"El total acumulado llega a 1,661 en la fila de 22 minutos, así que los dos pedidos centrales tardaron 22 minutos.","Hub C median":"Mediana de Hub C","Mean minus median":"Media menos mediana","Hub C: mean 29.94, median 22 minutes":"Hub C: media 29.94, mediana 22 minutos","Drag one order":"Arrastra un pedido","Here are ten real Hub C orders. Drag the longest one, then press the button to turn it into the 999 code.":"Aquí tienes diez pedidos reales de Hub C. Arrastra el más largo y luego presiona el botón para convertirlo en el código 999.","Which summary never moves, wherever the longest order goes?":"¿Qué resumen nunca se mueve, vaya a donde vaya el pedido más largo?","<p>The median needs only the middle positions, the 5th and 6th of ten. Moving the longest order never changes which orders sit in the middle, so the median stays 22.</p>\n          <p>The mean adds every minute: it moves 0.1 minute for each minute the order moves, from 34.1 at 124 minutes to 121.6 with the 999 code. The SD squares distances, so it reacts even more, from 33.5 to 308.5 minutes.</p>":"<p>La mediana solo necesita las posiciones centrales, la 5.ª y la 6.ª de diez. Mover el pedido más largo nunca cambia qué pedidos quedan en el centro, así que la mediana se queda en 22.</p>\n          <p>La media suma cada minuto: se mueve 0.1 minuto por cada minuto que se mueve el pedido, de 34.1 con 124 minutos a 121.6 con el código 999. La desviación estándar (SD) eleva las distancias al cuadrado, así que reacciona aún más, de 33.5 a 308.5 minutos.</p>","The median: it stays at 22 minutes.":"La mediana: se queda en 22 minutos.","The mean: one order out of ten cannot move it.":"La media: un pedido de diez no puede moverla.","Watch the readout: with the 999 code the mean jumps from 34.1 to 121.6 minutes.":"Mira la lectura: con el código 999, la media salta de 34.1 a 121.6 minutos.","The SD: spread ignores a single order.":"La SD: la dispersión ignora un solo pedido.","The SD grows fast, because the long order’s distance from the mean is squared.":"La SD crece rápido, porque la distancia del pedido largo a la media se eleva al cuadrado.","A rule one order can break":"Una regla que un solo pedido puede romper","Suppose a draft contract fined a hub whenever its mean latency topped 30 minutes. Use the same ten Hub C orders.":"Supón que un borrador de contrato multara a un hub cada vez que su latencia media pasara de 30 minutos. Usa los mismos diez pedidos de Hub C.","Drag the longest order. What is the highest whole-minute time that keeps the mean at or below 30?":"Arrastra el pedido más largo. ¿Cuál es el mayor tiempo, en minutos enteros, que mantiene la media en 30 o menos?","<p>The other nine orders total 217 minutes. The mean stays at or below 30 while 217 + x ≤ 300, so x ≤ 83 minutes. The median is 22 throughout.</p>\n          <p>The full file is just as fragile. Hub C’s real mean is 29.94 minutes, just under 30. One leaked 999 code would lift it to 30.23. A rule built on the mean can flip on a single record.</p>":"<p>Los otros nueve pedidos suman 217 minutos. La media se mantiene en 30 o menos mientras 217 + x ≤ 300, así que x ≤ 83 minutos. La mediana es 22 todo el tiempo.</p>\n          <p>El archivo completo es igual de frágil. La media real de Hub C es 29.94 minutos, justo por debajo de 30. Un solo código 999 que se colara la subiría a 30.23. Una regla basada en la media puede cambiar de resultado por un solo registro.</p>","What a leaked code does":"Qué hace un código que se coló","All hubs together have 9,958 valid orders totaling 282,807.2 minutes. Suppose a formula forgets to filter out the 42 codes of 999.":"Todos los hubs juntos tienen 9,958 pedidos válidos que suman 282,807.2 minutos. Supón que una fórmula olvida filtrar los 42 códigos 999.","Compute both means, then the median.":"Calcula ambas medias y luego la mediana.","<p>The leak adds 4.08 minutes, about 14%, to the mean. The median does not move. The SD jumps from 13.5 to 64.2 minutes.</p>\n          <p>Resistant is not immune. Here even the IQR jumps, from 12 to 25.5 minutes, because the quartiles sit at the edges of big blocks of tied values. Filter first, then summarize.</p>\n          <p>That is why Lab Part B filters <code>Latency_Minutes&lt;&gt;999</code> inside <code>AVERAGE</code>, <code>MEDIAN</code> and <code>STDEV.S</code>.</p>":"<p>Los códigos que se colaron suman 4.08 minutos, cerca del 14%, a la media. La mediana no se mueve. La SD salta de 13.5 a 64.2 minutos.</p>\n          <p>Resistente no es lo mismo que inmune. Aquí hasta el IQR salta, de 12 a 25.5 minutos, porque los cuartiles caen en los bordes de grandes bloques de valores empatados. Primero filtra, luego resume.</p>\n          <p>Por eso Lab Part B filtra <code>Latency_Minutes&lt;&gt;999</code> dentro de <code>AVERAGE</code>, <code>MEDIAN</code> y <code>STDEV.S</code>.</p>","valid mean = 282,807.2 / 9,958 = {{m1}} minutes":"media válida = 282,807.2 / 9,958 = {{m1}} minutos","with the codes = (282,807.2 + 42 × 999) / 10,000 = {{m2}} minutes":"con los códigos = (282,807.2 + 42 × 999) / 10,000 = {{m2}} minutos","median, with or without the codes = {{med}} minutes":"mediana, con o sin los códigos = {{med}} minutos","Valid mean":"Media válida","42 × 999 = 41,958. Add it to 282,807.2, then divide by all 10,000 rows.":"42 × 999 = 41,958. Súmalo a 282,807.2 y luego divide entre las 10,000 filas.","Mean with codes":"Media con códigos","The middle of 10,000 sorted values is deep inside the 22-minute block. 42 values at the top cannot reach it.":"El centro de 10,000 valores ordenados está muy dentro del bloque de 22 minutos. 42 valores en la parte de arriba no pueden alcanzarlo.","Median":"Mediana","Mean 28.40 → 32.48; median stays 22":"Media 28.40 → 32.48; la mediana se queda en 22","Which pair should Metro report?":"¿Qué par debería reportar Metro?","Valid latency, all hubs: mean 28.4 and SD 13.5 minutes; median 22 and IQR 12 minutes. The mean sits above the median.":"Latencia válida, todos los hubs: media 28.4 y SD 13.5 minutos; mediana 22 e IQR 12 minutos. La media está por encima de la mediana.","Which pair best describes a typical order and its spread here?":"¿Qué par describe mejor aquí un pedido típico y su dispersión?","<p>A mean above the median signals a long right tail. A third of valid orders (33.3%) take longer than the 28.4-minute mean, so the mean is not what a typical customer waits. The median and IQR describe the typical order without being pulled by the tail.</p>\n          <p>Still report the mean when total burden matters. The gap fits a right tail; it does not say why the tail exists.</p>":"<p>Una media por encima de la mediana indica una cola derecha larga. Un tercio de los pedidos válidos (33.3%) tarda más que la media de 28.4 minutos, así que la media no es lo que espera un cliente típico. La mediana y el IQR describen el pedido típico sin que la cola los arrastre.</p>\n          <p>Aun así, reporta la media cuando importa la carga total. La diferencia es coherente con una cola derecha; no dice por qué existe la cola.</p>","Median 22 and IQR 12: both resist the long right tail.":"Mediana 22 e IQR 12: ambos resisten la cola derecha larga.","Mean 28.4 and SD 13.5: they use every order, so they always win.":"Media 28.4 y SD 13.5: usan todos los pedidos, así que siempre ganan.","Using every order also means long delays pull them up. For a typical order in a skewed metric, the resistant pair fits better.":"Usar todos los pedidos también significa que los retrasos largos las empujan hacia arriba. Para un pedido típico en una métrica asimétrica, el par resistente encaja mejor.","Mean 28.4 and IQR 12: one of each covers both views.":"Media 28.4 e IQR 12: uno de cada tipo cubre ambas visiones.","Mixed pairs confuse readers. The mean goes with the SD; the median goes with the IQR.":"Los pares mezclados confunden a los lectores. La media va con la SD; la mediana va con el IQR.","Median 22 alone: spread does not matter for an SLA.":"Solo la mediana 22: la dispersión no importa para un SLA.","Hubs can share a median and differ a lot in spread. Always pair a center with a spread.":"Los hubs pueden compartir una mediana y diferir mucho en dispersión. Siempre combina un centro con una dispersión.","Quartiles, the Excel way":"Cuartiles al estilo de Excel","QUARTILE.EXC finds Q1 at position (n + 1) × 0.25 in the sorted list, and Q3 at (n + 1) × 0.75. Hub C has n = 3,320.":"QUARTILE.EXC encuentra Q1 en la posición (n + 1) × 0.25 de la lista ordenada, y Q3 en (n + 1) × 0.75. Hub C tiene n = 3,320.","Find Hub C’s quartiles and IQR.":"Encuentra los cuartiles y el IQR de Hub C.","<p>Position 830.25 sits between the 830th and 831st orders. Both took 14 minutes, so Q1 = 14. Position 2,490.75 sits between two 31-minute orders, so Q3 = 31. The middle half of Hub C’s orders spans 14 to 31 minutes: an IQR of 17.</p>\n          <p>Hubs A and B each have Q1 = 19 and Q3 = 26, an IQR of 7. All three medians are 22, but Hub C’s middle half is more than twice as wide.</p>":"<p>La posición 830.25 está entre los pedidos 830.º y 831.º. Ambos tardaron 14 minutos, así que Q1 = 14. La posición 2,490.75 está entre dos pedidos de 31 minutos, así que Q3 = 31. La mitad central de los pedidos de Hub C va de 14 a 31 minutos: un IQR de 17.</p>\n          <p>Hub A y Hub B tienen cada uno Q1 = 19 y Q3 = 26, un IQR de 7. Las tres medianas son 22, pero la mitad central de Hub C es más del doble de ancha.</p>","Q1 position = 3,321 × 0.25 = {{p1}}":"Posición de Q1 = 3,321 × 0.25 = {{p1}}","Q1 = {{q1}} minutes":"Q1 = {{q1}} minutos","Q3 position = 3,321 × 0.75 = {{p3}}":"Posición de Q3 = 3,321 × 0.75 = {{p3}}","Q3 = {{q3}} minutes":"Q3 = {{q3}} minutos","IQR = Q3 − Q1 = {{iqr}} minutes":"IQR = Q3 − Q1 = {{iqr}} minutos","Q1 position":"Posición de Q1","Orders 830 and 831 both fall in the 14-minute row: its running total goes from 830 to 831.":"Los pedidos 830 y 831 caen en la fila de 14 minutos: su total acumulado va de 830 a 831.","Q1":"Q1","Q3 position":"Posición de Q3","Orders 2,490 and 2,491 are both in the 31-minute row, which runs from 1,662 to 2,491.":"Los pedidos 2,490 y 2,491 están en la fila de 31 minutos, que va de 1,662 a 2,491.","Q3":"Q3","IQR":"IQR","IQR: A 7, B 7, C 17 minutes (median 22 at all three)":"IQR: A 7, B 7, C 17 minutos (mediana 22 en los tres)","Set an SLA guardrail":"Define una salvaguarda del SLA","An SLA guardrail can use the 95th percentile: a time that about 95% of valid orders meet. Drag the threshold across Hub C’s orders.":"Una salvaguarda del SLA puede usar el percentil 95: un tiempo que cumple alrededor del 95% de los pedidos válidos. Arrastra el umbral sobre los pedidos de Hub C.","What is the smallest whole-minute threshold that at least 95% of Hub C’s valid orders meet?":"¿Cuál es el umbral más pequeño, en minutos enteros, que cumple al menos el 95% de los pedidos válidos de Hub C?","<p>At 49 minutes only 2,491 of 3,320 orders (75.0%) qualify. At 50, the 700 orders that took exactly 50 minutes join, and the share jumps to 96.1%. Excel’s <code>PERCENTILE.EXC(..., 0.95)</code> also gives 50, for Hub C and for all hubs together.</p>\n          <p>So 3.9% of Hub C’s valid orders sit above the all-hubs P95. A threshold describes the data. Whether it is a fair contract term is a business decision.</p>":"<p>Con 49 minutos, solo 2,491 de 3,320 pedidos (75.0%) cumplen. Con 50, se suman los 700 pedidos que tardaron exactamente 50 minutos, y la proporción salta a 96.1%. <code>PERCENTILE.EXC(..., 0.95)</code> de Excel también da 50, para Hub C y para todos los hubs juntos.</p>\n          <p>Así que el 3.9% de los pedidos válidos de Hub C queda por encima del P95 de todos los hubs. Un umbral describe los datos. Si es un término justo para un contrato, eso es una decisión de negocio.</p>","P95 = 50 min; 3.9% of Hub C orders above it":"P95 = 50 min; 3.9% de los pedidos de Hub C por encima","Match the chart to the question":"Relaciona el gráfico con la pregunta","The VP will see one slide per question. Each question needs its own kind of display.":"El VP verá una diapositiva por pregunta. Cada pregunta necesita su propio tipo de visualización.","Drag a display to each question. Two displays do not belong.":"Arrastra una visualización a cada pregunta. Dos visualizaciones no van en ninguna.","<p>Bars compare category counts and must start at zero. A histogram shows one numeric variable’s shape. Box plots compare a numeric variable across three or more groups side by side. A small table gives exact counts, such as 14 coded rows per hub.</p>":"<p>Las barras comparan conteos por categoría y deben empezar en cero. Un histograma muestra la forma de una variable numérica. Los diagramas de caja comparan una variable numérica entre tres o más grupos, uno al lado del otro. Una tabla pequeña da conteos exactos, como 14 filas codificadas por hub.</p>","Line chart joining Hub A, B and C":"Gráfico de líneas que une Hub A, B y C","Side-by-side box plots on one scale":"Diagramas de caja lado a lado en una escala","Bar chart with a zero baseline":"Gráfico de barras con línea base en cero","3-D pie of latency minutes":"Gráfico circular 3-D de minutos de latencia","Small table":"Tabla pequeña","Histogram with stated bin edges":"Histograma con los límites de los intervalos indicados","How many valid orders did each hub handle?":"¿Cuántos pedidos válidos atendió cada hub?","How are Hub C’s latencies distributed?":"¿Cómo se distribuyen las latencias de Hub C?","How do the three hubs’ latencies compare?":"¿Cómo se comparan las latencias de los tres hubs?","Exactly how many coded rows does each hub have?":"¿Cuántas filas codificadas tiene exactamente cada hub?","A line implies an ordered path, like time. Hubs are categories, so joining them invents a trend.":"Una línea implica un recorrido ordenado, como el tiempo. Los hubs son categorías, así que unirlos inventa una tendencia.","A pie shows parts of a whole, and 3-D tilts distort the slices. Minutes per order are not parts of a whole.":"Un gráfico circular muestra partes de un todo, y la inclinación en 3-D distorsiona las porciones. Los minutos por pedido no son partes de un todo.","A histogram bins a numeric variable. Hub is a category, so counts per hub need bars.":"Un histograma agrupa una variable numérica en intervalos. Hub es una categoría, así que los conteos por hub necesitan barras.","Bars compare categories. The shape of one numeric variable needs a histogram.":"Las barras comparan categorías. La forma de una variable numérica necesita un histograma.","Bin width changes the story":"El ancho de intervalo cambia la historia","This histogram shows Hub C’s 3,320 valid orders, with bins starting at 0. Look for the empty stretch before the 29 orders at 124 minutes.":"Este histograma muestra los 3,320 pedidos válidos de Hub C, con intervalos que empiezan en 0. Busca el tramo vacío antes de los 29 pedidos de 124 minutos.","Widen the bins. What is the smallest bin width that hides the empty gap before the 124-minute orders?":"Ensancha los intervalos. ¿Cuál es el ancho de intervalo más pequeño que oculta el hueco vacío antes de los pedidos de 124 minutos?","<p>Up to 41-minute bins, at least one empty bin separates the 60-minute orders from the 124-minute ones. At 42 minutes they land in neighboring bins, and the long delays look like a smooth tail.</p>\n          <p>Neither picture is false, but they tell different stories. Try more than one bin width, state the bin edges, and keep the same bins when you compare hubs.</p>":"<p>Con intervalos de hasta 41 minutos, al menos un intervalo vacío separa los pedidos de 60 minutos de los de 124 minutos. Con 42 minutos caen en intervalos vecinos, y los retrasos largos parecen una cola suave.</p>\n          <p>Ninguna imagen es falsa, pero cuentan historias distintas. Prueba más de un ancho de intervalo, indica los límites de los intervalos y usa los mismos intervalos cuando compares hubs.</p>","Same median, different hubs":"Misma mediana, hubs distintos","These box plots show all 9,958 valid orders on one scale. Each box runs from Q1 to Q3, and the line inside is the median.":"Estos diagramas de caja muestran los 9,958 pedidos válidos en una sola escala. Cada caja va de Q1 a Q3, y la línea interior es la mediana.","A manager sees a 22-minute median at every hub and says service is the same. What does the chart add?":"Un gerente ve una mediana de 22 minutos en cada hub y dice que el servicio es igual. ¿Qué aporta el gráfico?","<p>All three medians are 22 minutes. Hubs A and B have Q1 = 19 and Q3 = 26, an IQR of 7. Hub C has Q1 = 14 and Q3 = 31, an IQR of 17. Some Hub C orders are faster than any at A or B, and some are much slower.</p>\n          <p>Equal centers can hide unequal consistency. That is evidence to investigate, not proof of fault.</p>":"<p>Las tres medianas son de 22 minutos. Hub A y Hub B tienen Q1 = 19 y Q3 = 26, un IQR de 7. Hub C tiene Q1 = 14 y Q3 = 31, un IQR de 17. Algunos pedidos de Hub C son más rápidos que cualquiera de A o B, y otros son mucho más lentos.</p>\n          <p>Centros iguales pueden ocultar una consistencia desigual. Eso es evidencia para investigar, no prueba de culpa.</p>","Hub C’s middle half spans 17 minutes, against 7 at Hubs A and B.":"La mitad central de Hub C abarca 17 minutos, frente a 7 en Hub A y Hub B.","Nothing. Equal medians mean equal service.":"Nada. Medianas iguales significan un servicio igual.","The median is one position. The boxes show how spread out the middle half is, and Hub C’s is far wider.":"La mediana es una sola posición. Las cajas muestran qué tan dispersa está la mitad central, y la de Hub C es mucho más ancha.","Hub C is slower for a typical order.":"Hub C es más lento en un pedido típico.","The typical order takes 22 minutes at all three hubs. The difference is in spread and tail, not center.":"El pedido típico tarda 22 minutos en los tres hubs. La diferencia está en la dispersión y la cola, no en el centro.","Hub C’s carrier causes the extra spread.":"El transportista de Hub C causa la dispersión adicional.","A box plot describes spread. Route mix, demand or recording practice could also explain it.":"Un diagrama de caja describe la dispersión. La combinación de rutas, la demanda o las prácticas de registro también podrían explicarla.","Flag the long orders":"Marca los pedidos largos","Tukey’s rule flags values above Q3 + 1.5 × IQR or below Q1 − 1.5 × IQR. For Hub C, Q1 = 14, Q3 = 31 and IQR = 17 minutes.":"La regla de Tukey marca los valores por encima de Q3 + 1.5 × IQR o por debajo de Q1 − 1.5 × IQR. Para Hub C, Q1 = 14, Q3 = 31 e IQR = 17 minutos.","Compute the fences, then use the explorer to count Hub C orders above the upper fence.":"Calcula las vallas y luego usa el explorador para contar los pedidos de Hub C por encima de la valla superior.","<p>Hub C’s fences are −11.5 and 56.5 minutes. No order falls below −11.5. Above 56.5 sit 100 orders at 60 minutes and 29 at 124 minutes: 129 flags, 3.9% of Hub C’s valid orders.</p>\n          <p>Keep the computed −11.5. Zero is a physical limit on time, not a replacement for the rule.</p>":"<p>Las vallas de Hub C son −11.5 y 56.5 minutos. Ningún pedido cae por debajo de −11.5. Por encima de 56.5 hay 100 pedidos de 60 minutos y 29 de 124 minutos: 129 señales, el 3.9% de los pedidos válidos de Hub C.</p>\n          <p>Conserva el −11.5 calculado. El cero es un límite físico del tiempo, no un reemplazo de la regla.</p>","upper fence = 31 + 1.5 × 17 = {{uf}} minutes":"valla superior = 31 + 1.5 × 17 = {{uf}} minutos","lower fence = 14 − 1.5 × 17 = {{lf}} minutes":"valla inferior = 14 − 1.5 × 17 = {{lf}} minutos","Hub C orders above the upper fence = {{n}}":"Pedidos de Hub C por encima de la valla superior = {{n}}","1.5 × 17 = 25.5, and 31 + 25.5 = 56.5.":"1.5 × 17 = 25.5, y 31 + 25.5 = 56.5.","Upper fence":"Valla superior","14 − 25.5 = −11.5. Keep the negative value; it just means no low flags.":"14 − 25.5 = −11.5. Conserva el valor negativo; solo significa que no hay señales bajas.","Lower fence":"Valla inferior","Hub C values above 56.5 are 60 and 124 minutes. Filter Hub C with each value: 100 + 29.":"Los valores de Hub C por encima de 56.5 son 60 y 124 minutos. Filtra Hub C con cada valor: 100 + 29.","Flagged Hub C orders":"Pedidos marcados de Hub C","Hub C fence 56.5 min: 129 orders flagged; longest 124 min":"Valla de Hub C 56.5 min: 129 pedidos marcados; el más largo 124 min","A flag is a question":"Una señal es una pregunta","The 129 flagged Hub C orders make the box plot look messy. A teammate has some ideas.":"Los 129 pedidos marcados de Hub C hacen que el diagrama de caja se vea desordenado. Un compañero de equipo tiene algunas ideas.","What should Metro do with the 129 flagged orders?":"¿Qué debería hacer Metro con los 129 pedidos marcados?","<p>A Tukey flag marks an observation to inspect. It does not prove an error, and it does not prove a breach. Check the source timestamps, routes and contract terms for the 129 orders, report how much they move the mean, and keep them in the record.</p>":"<p>Una señal de Tukey marca una observación para inspeccionar. No prueba un error ni prueba un incumplimiento. Revisa las marcas de tiempo de origen, las rutas y los términos del contrato de los 129 pedidos, informa cuánto mueven la media y mantenlos en el registro.</p>","Keep them, label them, and check each against source records and the contract.":"Consérvalos, etiquétalos y coteja cada uno con los registros de origen y el contrato.","Delete them so the chart looks cleaner.":"Elimínalos para que el gráfico se vea más limpio.","They are recorded deliveries. Deleting real delays hides the very problem the VP asked about.":"Son entregas registradas. Eliminar retrasos reales oculta justo el problema por el que preguntó el VP.","Fine the carrier once for each flagged order.":"Multa al transportista una vez por cada pedido marcado.","A Tukey flag is a statistical label, not a contract breach. Check the agreed terms first.":"Una señal de Tukey es una etiqueta estadística, no un incumplimiento del contrato. Revisa primero los términos acordados.","Replace them with the median, 22 minutes.":"Reemplázalos con la mediana, 22 minutos.","That invents data and shrinks the tail. Keep the recorded values.":"Eso inventa datos y encoge la cola. Conserva los valores registrados.","Whose fence is it?":"¿De quién es la valla?","With its own quartiles, Hub A’s fence is 36.5 minutes and flags 829 orders, all at 47.5 minutes. Hub C’s own fence is 56.5 and flags 129.":"Con sus propios cuartiles, la valla de Hub A está en 36.5 minutos y marca 829 pedidos, todos de 47.5 minutos. La valla propia de Hub C está en 56.5 y marca 129.","Does Hub A have the bigger outlier problem?":"¿Tiene Hub A el mayor problema de valores atípicos?","<p>A fence is relative: Q3 + 1.5 × IQR for that group. Hub A’s middle half is tight (IQR 7), so its fence sits at 36.5 minutes and every 47.5-minute order is flagged. Hub C’s wider IQR (17) puts its fence at 56.5.</p>\n          <p>So flag counts are not comparable across groups. Compare the minutes: Hub A’s longest valid order is 47.5 minutes, Hub C’s is 124. On one shared all-hubs fence of 49 minutes, all 829 flagged orders are at Hub C.</p>":"<p>Una valla es relativa: Q3 + 1.5 × IQR para ese grupo. La mitad central de Hub A es estrecha (IQR 7), así que su valla queda en 36.5 minutos y se marca cada pedido de 47.5 minutos. El IQR más amplio de Hub C (17) pone su valla en 56.5.</p>\n          <p>Por eso, los conteos de señales no son comparables entre grupos. Compara los minutos: el pedido válido más largo de Hub A es de 47.5 minutos, y el de Hub C es de 124. Con una sola valla compartida por todos los hubs, de 49 minutos, los 829 pedidos marcados están en Hub C.</p>","No. Each fence measures distance from its own hub’s middle; compare minutes too.":"No. Cada valla mide la distancia desde la mitad central de su propio hub; compara también los minutos.","Yes. 829 flags is more than 129 flags.":"Sí. 829 señales son más que 129 señales.","Hub A’s narrow IQR makes a tight fence. Its flagged orders take 47.5 minutes; Hub C’s take 60 to 124.":"El IQR estrecho de Hub A crea una valla ajustada. Sus pedidos marcados tardan 47.5 minutos; los de Hub C tardan de 60 a 124.","No. One of the two counts must be a formula error.":"No. Uno de los dos conteos debe ser un error de fórmula.","Both counts are correct. They use different quartiles, so they answer different questions.":"Ambos conteos son correctos. Usan cuartiles distintos, así que responden preguntas distintas.","Use whichever fence gives the count that supports the penalty.":"Usa la valla que dé el conteo que respalde la penalización.","Choosing the rule after seeing the result is moving the goalposts. State the rule first.":"Elegir la regla después de ver el resultado es cambiar las reglas del juego. Declara la regla primero.","Name your quartile rule":"Nombra tu regla de cuartiles","For Hub A, QUARTILE.EXC gives Q1 = 19 and Q3 = 26, an IQR of 7. QUARTILE.INC gives 20.5 and 24, an IQR of 3.5.":"Para Hub A, QUARTILE.EXC da Q1 = 19 y Q3 = 26, un IQR de 7. QUARTILE.INC da 20.5 y 24, un IQR de 3.5.","A colleague reports Hub A’s IQR as 3.5. What is the best response?":"Un colega informa que el IQR de Hub A es 3.5. ¿Cuál es la mejor respuesta?","<p>Quartile methods differ when the cut falls between blocks of tied values. Hub A has 830 orders at 19 minutes and 1,659 at 22, so the INC position lands halfway between 19 and 22. Hub C’s quartiles are 14 and 31 under both rules.</p>\n          <p>State the rule in the report and use it in every tool: Excel EXC, SPSS HAVERAGE, Python and R. SPSS box plots use Tukey hinges, which can differ again.</p>":"<p>Los métodos de cuartiles difieren cuando el corte cae entre bloques de valores empatados. Hub A tiene 830 pedidos de 19 minutos y 1,659 de 22, así que la posición INC cae a mitad de camino entre 19 y 22. Los cuartiles de Hub C son 14 y 31 con ambas reglas.</p>\n          <p>Indica la regla en el informe y úsala en todas las herramientas: Excel EXC, SPSS HAVERAGE, Python y R. Los diagramas de caja de SPSS usan las bisagras de Tukey, que pueden diferir otra vez.</p>","Both follow a rule. Use the lab’s EXC rule everywhere and name it.":"Ambos siguen una regla. Usa la regla EXC del laboratorio en todas partes y nómbrala.","Their 3.5 is simply wrong; 7 is the true IQR.":"Su 3.5 simplemente está mal; 7 es el IQR verdadero.","INC is a valid convention. It is wrong here only because the lab declared EXC.":"INC es una convención válida. Aquí es incorrecta solo porque el laboratorio declaró EXC.","Average the two results and report 5.25.":"Promedia los dos resultados e informa 5.25.","Averaging two conventions creates a number no tool reproduces.":"Promediar dos convenciones crea un número que ninguna herramienta reproduce.","Pick whichever IQR makes Hub C look worse.":"Elige el IQR que haga ver peor a Hub C.","Choosing a method for its result biases the report. Declare the method first.":"Elegir un método por su resultado sesga el informe. Declara el método primero.","Where should the axis start?":"¿Dónde debe empezar el eje?","Mean latency is 27.6 minutes at Hubs A and B and 29.9 at Hub C. Drag the axis start and watch the bars.":"La latencia media es de 27.6 minutos en Hub A y Hub B, y de 29.9 en Hub C. Arrastra el inicio del eje y observa las barras.","An analyst starts the axis at 27 minutes. What does the VP see?":"Un analista empieza el eje en 27 minutos. ¿Qué ve el VP?","<p>Bars encode values by length from a shared zero. With the axis at 27, Hub C’s bar is 2.94 minutes tall and Hub A’s is 0.63, so C looks 4.7 times as long. With a zero baseline the ratio is 1.08.</p>\n          <p>Bars must start at zero. A dot plot can use a narrower range if the scale is clearly marked. For this decision, show the distribution anyway, because the means hide Hub C’s spread.</p>":"<p>Las barras codifican los valores con su longitud desde un cero común. Con el eje en 27, la barra de Hub C mide 2.94 minutos y la de Hub A, 0.63, así que C parece 4.7 veces más larga. Con una línea base en cero, la razón es 1.08.</p>\n          <p>Las barras deben empezar en cero. Un diagrama de puntos puede usar un rango más estrecho si la escala está claramente marcada. Para esta decisión, muestra de todos modos la distribución, porque las medias ocultan la dispersión de Hub C.</p>","Hub C’s bar looks over four times as tall, though its mean is 8% higher.":"La barra de Hub C parece más de cuatro veces más alta, aunque su media es un 8% mayor.","An honest close-up: small differences deserve a zoom.":"Un acercamiento honesto: las diferencias pequeñas merecen un zoom.","Bar length encodes the value from zero. Cutting the axis breaks that, so the picture overstates the gap.":"La longitud de la barra codifica el valor desde cero. Cortar el eje rompe eso, así que la imagen exagera la diferencia.","The same picture as with a zero baseline.":"La misma imagen que con una línea base en cero.","Drag to 27 and compare: the drawn ratio jumps from 1.08 to about 4.7.":"Arrastra hasta 27 y compara: la razón dibujada salta de 1.08 a cerca de 4.7.","Nothing changes, because the bars are labeled.":"Nada cambia, porque las barras tienen etiquetas.","Readers judge bar length before they read labels. The shape sends the message.":"Los lectores juzgan la longitud de las barras antes de leer las etiquetas. La forma envía el mensaje.","Stacked or unstacked?":"¿Apilado o no apilado?","Layout 1 has a Hub column and a Latency_Minutes column, one row per order. Layout 2 has three columns: Hub_A_Latency, Hub_B_Latency and Hub_C_Latency.":"El diseño 1 tiene una columna Hub y una columna Latency_Minutes, con una fila por pedido. El diseño 2 tiene tres columnas: Hub_A_Latency, Hub_B_Latency y Hub_C_Latency.","Which layout lets one filtered formula serve every hub, as in Lab Part D?":"¿Qué diseño permite que una sola fórmula filtrada sirva para todos los hubs, como en Lab Part D?","<p>Stacked data keeps group membership in a column. Lab Part D filters <code>Orders[Hub]=$A7</code> and fills down to every hub, and SPSS can split the file by Hub. Unstacked data stores the group in the column name, so every hub needs its own formula, and unequal counts leave ragged columns.</p>":"<p>Los datos apilados guardan la pertenencia al grupo en una columna. Lab Part D filtra <code>Orders[Hub]=$A7</code> y copia la fórmula hacia abajo para cada hub, y SPSS puede dividir el archivo por Hub. Los datos no apilados guardan el grupo en el nombre de la columna, así que cada hub necesita su propia fórmula, y los conteos desiguales dejan columnas disparejas.</p>","Layout 1, stacked: the hub is a value you can filter on.":"Diseño 1, apilado: el hub es un valor por el que puedes filtrar.","Layout 2, unstacked: each hub already has its own column.":"Diseño 2, no apilado: cada hub ya tiene su propia columna.","Then each hub needs its own formula, and a new hub means a new column. A stacked table just gains rows.":"Entonces cada hub necesita su propia fórmula, y un hub nuevo implica una columna nueva. Una tabla apilada solo gana filas.","Either one; layout never affects formulas or SPSS.":"Cualquiera; el diseño nunca afecta las fórmulas ni SPSS.","Excel FILTER and SPSS split-file both need one grouping column. Layout matters.":"Tanto FILTER de Excel como split-file de SPSS necesitan una columna de agrupación. El diseño importa.","Make the totals agree":"Haz que los totales cuadren","Before any chart goes to the VP, the counts must reconcile. A mismatch means a filter or a formula is wrong.":"Antes de que cualquier gráfico llegue al VP, los conteos deben cuadrar. Una discrepancia significa que un filtro o una fórmula está mal.","Complete the check.":"Completa la verificación.","<p>The three hub counts add to 9,958, and 9,958 + 42 = 10,000. If a tool shows 10,000 valid latencies, the 999 codes leaked in. If it shows fewer than 9,958, a filter dropped real orders.</p>\n          <p>Save these totals with the formulas and the code rule, so another analyst can repeat the result.</p>":"<p>Los conteos de los tres hubs suman 9,958, y 9,958 + 42 = 10,000. Si una herramienta muestra 10,000 latencias válidas, los códigos 999 se colaron. Si muestra menos de 9,958, un filtro eliminó pedidos reales.</p>\n          <p>Guarda estos totales con las fórmulas y la regla de los códigos, para que otro analista pueda repetir el resultado.</p>","valid orders = 3,319 + 3,319 + 3,320 = {{valid}}":"pedidos válidos = 3,319 + 3,319 + 3,320 = {{valid}}","coded rows = 10,000 − valid orders = {{codes}}":"filas codificadas = 10,000 − pedidos válidos = {{codes}}","coded share of the file = {{share}} %":"proporción codificada del archivo = {{share}} %","Valid orders":"Pedidos válidos","10,000 − 9,958 = 42, which matches your count of 999 codes.":"10,000 − 9,958 = 42, que coincide con tu conteo de códigos 999.","Coded rows":"Filas codificadas","42 ÷ 10,000 = 0.0042, which is 0.42%.":"42 ÷ 10,000 = 0.0042, es decir, 0.42%.","Coded share in percent":"Proporción codificada en porcentaje","3,319 + 3,319 + 3,320 = 9,958 valid; + 42 coded = 10,000":"3,319 + 3,319 + 3,320 = 9,958 válidos; + 42 codificados = 10,000","Observation, limit, recommendation":"Observación, limitación, recomendación","A good memo keeps three kinds of sentence apart.":"Un buen memorando separa tres tipos de oración.","Drag each sentence to its role. One sentence does not belong.":"Arrastra cada oración a su función. Una oración no encaja.","<p>An observation reports these records. A limit says what they cannot establish. A recommendation states an action given both. Keeping them apart stops a descriptive gap from turning into a blame claim.</p>\n          <p>Route mix, demand, weather, handoffs and recording practice could all contribute to Hub C’s spread.</p>":"<p>Una observación informa sobre estos registros. Una limitación dice lo que no pueden establecer. Una recomendación propone una acción tomando en cuenta ambas. Mantenerlas separadas evita que una diferencia descriptiva se convierta en una atribución de culpa.</p>\n          <p>La combinación de rutas, la demanda, el clima, los traspasos y las prácticas de registro podrían contribuir a la dispersión de Hub C.</p>","Hold one cycle and audit Hub C’s 129 flagged orders against the contract.":"Espera un ciclo y audita los 129 pedidos marcados de Hub C frente al contrato.","Hub C’s carrier caused the long delays.":"El transportista de Hub C causó los retrasos largos.","All three hubs have a 22-minute median; Hub C’s IQR is 17, not 7.":"Los tres hubs tienen una mediana de 22 minutos; el IQR de Hub C es 17, no 7.","These records cannot show that Hub C’s carrier caused the delays.":"Estos registros no pueden demostrar que el transportista de Hub C haya causado los retrasos.","Observation<br><small>what the records show</small>":"Observación<br><small>lo que muestran los registros</small>","Limit<br><small>what they cannot show</small>":"Limitación<br><small>lo que no pueden mostrar</small>","Recommendation<br><small>what to do next</small>":"Recomendación<br><small>qué hacer después</small>","That is a causal claim. Descriptive summaries show an association between hub and latency, not its cause.":"Esa es una afirmación causal. Los resúmenes descriptivos muestran una asociación entre hub y latencia, no su causa.","Make the call":"Toma la decisión","You are the analyst. The VP wants one recommendation for the carrier review.":"Tú eres el analista. El VP quiere una recomendación para la revisión del transportista.","What does the evidence support?":"¿Qué respalda la evidencia?","<p>The records support a clear observation: the same typical time at every hub, far less consistency at Hub C, and a tail of 129 orders above its fence. They do not show the cause. A penalty now risks blaming the carrier for route mix, demand or recording issues.</p>\n          <p>Holding one cycle has a cost too: customers may keep facing delays, so Metro keeps supporting them during the audit. If the audit confirms a breach of the agreed terms, a penalty then rests on evidence.</p>":"<p>Los registros respaldan una observación clara: el mismo tiempo típico en cada hub, mucha menos consistencia en Hub C y una cola de 129 pedidos por encima de su valla. No muestran la causa. Penalizar ahora corre el riesgo de culpar al transportista por la combinación de rutas, la demanda o problemas de registro.</p>\n          <p>Esperar un ciclo también tiene un costo: los clientes pueden seguir sufriendo retrasos, así que Metro sigue apoyándolos durante la auditoría. Si la auditoría confirma un incumplimiento de los términos acordados, entonces la penalización se basa en evidencia.</p>","Hold one cycle: audit Hub C’s long orders; penalize only on a verified breach.":"Espera un ciclo: audita los pedidos largos de Hub C; penaliza solo ante un incumplimiento verificado.","Penalize now: Hub C’s wider IQR proves the carrier is at fault.":"Penaliza ahora: el IQR más amplio de Hub C demuestra que el transportista tiene la culpa.","The IQR describes spread. It cannot say who or what caused it.":"El IQR describe la dispersión. No puede decir quién o qué la causó.","Close the review: every hub has the same 22-minute median.":"Cierra la revisión: todos los hubs tienen la misma mediana de 22 minutos.","Equal medians hide Hub C’s wider spread and its 129 long orders. Customers still feel those delays.":"Las medianas iguales ocultan la mayor dispersión de Hub C y sus 129 pedidos largos. Los clientes siguen sintiendo esos retrasos.","Penalize now: 129 orders sit beyond the Tukey fence.":"Penaliza ahora: 129 pedidos están más allá de la valla de Tukey.","A Tukey flag is a statistical label, not a contract breach. Check the terms and the records first.":"Una señal de Tukey es una etiqueta estadística, no un incumplimiento del contrato. Revisa primero los términos y los registros.","Hold one cycle and audit; penalize only on a verified breach":"Esperar un ciclo y auditar; penalizar solo ante un incumplimiento verificado","Your evidence bench":"Tu mesa de evidencia","Screen the codes before you count. Pair the median with the IQR and the mean with the SD. A flag or a gap is a question, not a verdict.":"Detecta los códigos antes de contar. Combina la mediana con el IQR y la media con la desviación estándar (SD). Una señal o un hueco es una pregunta, no un veredicto.","Pick a hub and move the controls. Every number comes from the lab file’s valid orders.":"Elige un hub y mueve los controles. Cada número sale de los pedidos válidos del archivo del laboratorio.","Open this page from the class site to see the dataset.":"Abre esta página desde el sitio de la clase para ver el conjunto de datos.","Total":"Total","minutes":"minutos","Hub C valid orders by latency, with running totals":"Pedidos válidos de Hub C por latencia, con totales acumulados","Minutes":"Minutos","Orders":"Pedidos","Running total":"Total acumulado","Dot plot of ten Hub C orders with one draggable order":"Diagrama de puntos de diez pedidos de Hub C con un pedido arrastrable","latency (minutes)":"latencia (minutos)","draft rule: mean at most 30":"regla preliminar: media de 30 como máximo","999 code, off the scale":"código 999, fuera de escala","median":"mediana","mean":"media","Longest order":"Pedido más largo","min":"min","Mean":"Media","SD":"SD","Draft rule":"Regla preliminar","Within 30":"Hasta 30","Over 30":"Más de 30","Longest order, minutes":"Pedido más largo, minutos","Make it the 999 code":"Conviértelo en el código 999","Histogram of latency":"Histograma de latencia","latency (minutes), bins start at 0":"latencia (minutos), los intervalos empiezan en 0","orders":"pedidos","Side-by-side box plots of valid latency for Hubs A, B and C":"Diagramas de caja lado a lado de la <script>
/* GC1015 Session 3 interactive lesson: data quality, distributions and descriptive evidence.
   Case: Metro E-Commerce Logistics (fictional), the LAB01 file orders_story.csv, as used in the deck, PNP and lab.
   Post-class review (session ran 16 Sept 2026). Every number is checked by verify_S03.py against the CSV.
   Quartiles and percentiles follow Excel QUARTILE.EXC / PERCENTILE.EXC, as in the lab.
   Build with --data orders=<orders_story.csv> so the explorer screens can read the rows. */
(function () {
  'use strict';
  const K = LessonKit;
  const St = K.Stats;

  // Lesson-local layout fix: the engine's .lk-sheet-body grid column grows to the Toolkit tab bar's full width,
  // so long toolkit text is clipped on the right. Pin the column to the sheet width. Remove once the engine has it.
  if (typeof document !== 'undefined' && !document.getElementById('lk-s03-sheetfix')) {
    const fix = document.createElement('style');
    fix.id = 'lk-s03-sheetfix';
    fix.textContent = '.lk-sheet-body { grid-template-columns: minmax(0, 1fr); }';
    document.head.append(fix);
  }

  /* ---------- Case data ---------- */
  // Valid-latency frequency tables from orders_story.csv (minutes: orders), plus 14 coded rows (999) per hub.
  const FREQ = {"A": {"19": 830, "22": 1659, "26": 1, "47.544": 829}, "B": {"19": 830, "22": 1659, "26": 1, "47.544": 828, "47.792": 1}, "C": {"13": 829, "14": 2, "22": 830, "31": 830, "50": 700, "60": 100, "124": 29}, "codes": 14}; // END FREQ
  const HUBS = ['A', 'B', 'C'];
  // Ten real Hub C orders: ORD06639-41 (13), ORD07470-72 (22), ORD08300-01 (31), ORD09130 (50), ORD09930 (124).
  const TEN_OTHERS = [13, 13, 13, 22, 22, 22, 31, 31, 50];

  const num = (v) => Math.round(v).toLocaleString('en-US');
  const f1 = (v) => St.fmt(v, 1);
  const f2 = (v) => St.fmt(v, 2);
  const pct = (v, d = 1) => `${(v * 100).toFixed(d)}%`;

  // Sorted [value, count] pairs for one hub or 'All', optionally with the 999 codes left in.
  function pairs(h, withCodes) {
    const m = new Map();
    for (const k of h === 'All' ? HUBS : [h]) {
      for (const [v, c] of Object.entries(FREQ[k])) m.set(+v, (m.get(+v) || 0) + c);
      if (withCodes) m.set(999, (m.get(999) || 0) + FREQ.codes);
    }
    return [...m.entries()].sort((x, y) => x[0] - y[0]);
  }
  const fromList = (xs) => { const m = new Map(); xs.forEach((v) => m.set(v, (m.get(v) || 0) + 1)); return [...m.entries()].sort((x, y) => x[0] - y[0]); };
  // Descriptive statistics on [value, count] pairs. Quartiles and P95 use the exclusive rule (QUARTILE.EXC).
  function describe(p) {
    const n = p.reduce((s, [, c]) => s + c, 0);
    const sum = p.reduce((s, [v, c]) => s + v * c, 0);
    const mean = sum / n;
    const sd = Math.sqrt(p.reduce((s, [v, c]) => s + c * (v - mean) ** 2, 0) / (n - 1));
    const kth = (k) => { let run = 0; for (const [v, c] of p) { run += c; if (k <= run) return v; } return p[p.length - 1][0]; };
    const exc = (q) => { const r = (n + 1) * q, lo = Math.floor(r), f = r - lo; return f === 0 ? kth(lo) : kth(lo) + f * (kth(lo + 1) - kth(lo)); };
    const med = n % 2 ? kth((n + 1) / 2) : (kth(n / 2) + kth(n / 2 + 1)) / 2;
    const q1 = exc(0.25), q3 = exc(0.75), iqr = q3 - q1, uf = q3 + 1.5 * iqr, lf = q1 - 1.5 * iqr;
    const count = (fn) => p.reduce((s, [v, c]) => s + (fn(v) ? c : 0), 0);
    return { n, sum, mean, sd, med, q1, q3, iqr, uf, lf, p95: exc(0.95), max: p[p.length - 1][0], flags: count((v) => v > uf || v < lf), count };
  }
  // A share typed as 0.42, 0.42% or 0.0042 (for percents below 1).
  const smallPct = (ans) => (v) => Math.abs(v - ans) <= 0.01 || Math.abs(v * 100 - ans) <= 0.01;

  /* ---------- Figures ---------- */
  function dataExplorer(el, a, opts = {}) {
    const data = a.data('orders');
    if (!data) { el.append(a.h('p', { class: 'lk-caption' }, K.tr('Open this page from the class site to see the dataset.'))); return null; }
    return a.explorer(el, { data, show: opts.show || ['OrderID', 'CustomerID', 'OrderTier', 'Hub', 'Age_Years', 'Latency_Minutes'], filters: opts.filters || ['Hub', 'Age_Years', 'Latency_Minutes'], pageSize: 6, label: 'orders_story.csv', onChange: opts.onChange });
  }

  function hubCTable(el, a) {
    const p = pairs('C');
    const D = describe(p);
    let run = 0;
    const body = p.map(([v, c]) => { run += c; return a.h('tr', null, a.h('td', null, f1(v).replace(/\.0$/, '')), a.h('td', null, num(c)), a.h('td', null, num(run))); });
    body.push(a.h('tr', null, a.h('td', null, a.h('b', null, K.tr('Total'))), a.h('td', null, a.h('b', null, num(D.n))), a.h('td', null, `${num(D.sum)} ${K.tr('minutes')}`)));
    el.append(a.h('table', { class: 'lk-facts', 'aria-label': K.tr('Hub C valid orders by latency, with running totals') },
      a.h('thead', null, a.h('tr', null, a.h('th', null, K.tr('Minutes')), a.h('th', null, K.tr('Orders')), a.h('th', null, K.tr('Running total')))),
      a.h('tbody', null, body)));
  }

  // Ten Hub C orders on a dot plot. The longest one is draggable; mean, median and SD update live.
  function tenOrders(el, a, opts = {}) {
    const C = a.Charts;
    const st = { x: 124, code: false };
    const f = C.frame(el, { x: [0, 200], y: [0, 5], h: 250, pad: { l: 18, r: 26, t: 50, b: 40 }, label: K.tr('Dot plot of ten Hub C orders with one draggable order') });
    C.axisX(f, [0, 25, 50, 75, 100, 125, 150, 175, 200], (v) => v, K.tr('latency (minutes)'));
    if (opts.rule != null) {
      f.add('grid', 'line', { x1: f.X(opts.rule), x2: f.X(opts.rule), y1: f.Y(0), y2: f.Y(4.75), class: 's-guard' });
      f.add('grid', 'text', { x: f.X(opts.rule) + 6, y: f.Y(4.6), class: 't-guard' }, K.tr('draft rule: mean at most 30'));
    }
    const seen = {};
    for (const v of TEN_OTHERS) { const k = (seen[v] = (seen[v] || 0) + 1); f.add('data', 'circle', { cx: f.X(v), cy: f.Y(0.45 + (k - 1) * 0.8), r: 7, class: 'f-a pop', style: { animationDelay: `${v * 6}ms` } }); }
    const marks = f.add('data', 'g');
    const dot = f.add('data', 'circle', { r: 8, cy: f.Y(0.45), class: 'f-b' });
    const codeTag = f.add('data', 'text', { y: f.Y(1.05), 'text-anchor': 'end', class: 't-violet' });
    const out = a.readout(el);
    const draw = () => {
      const xs = [...TEN_OTHERS, st.x];
      const D = describe(fromList(xs));
      dot.setAttribute('cx', f.X(Math.min(st.x, 200)));
      codeTag.setAttribute('x', f.X(200));
      codeTag.textContent = st.code ? K.tr('999 code, off the scale') : '';
      // Summary markers: triangles above the dots, labels pushed apart (median left, mean right, or the reverse).
      const mark = (v, cls, txt, side) => [
        a.s('path', { d: `M${f.X(v) - 6},${f.Y(3.1)} L${f.X(v) + 6},${f.Y(3.1)} L${f.X(v)},${f.Y(2.7)} Z`, class: cls }),
        a.s('text', { x: f.X(v) + side * 9, y: f.Y(3.1) + 4, 'text-anchor': side < 0 ? 'end' : 'start', class: cls === 'f-ink' ? 'strong' : 't-violet' }, txt)];
      const meanRight = D.mean >= D.med ? 1 : -1;
      marks.replaceChildren(...mark(D.med, 'f-ink', `${K.tr('median')} ${f1(D.med)}`, -meanRight), ...mark(Math.min(D.mean, 200), 'f-b', `${K.tr('mean')} ${f1(D.mean)}`, meanRight));
      const items = [
        [K.tr('Longest order'), st.code ? '999' : `${st.x} ${K.tr('min')}`],

      ];

      out(items);
    };
    const hd = C.handle(f, { value: 124, min: 0, max: 200, step: 1, label: (v) => (st.code ? '999' : `${v} ${K.tr('min')}`), aria: K.tr('Longest order, minutes'), knobY: f.P.t - 10,

    }
    draw();
    return { st, set(v) { st.code = false; hd.set(v); } };
  }

  // Histogram with bins that start at 0. Returns the bin counts.
  const stepFor = (m) => [50, 100, 200, 250, 500, 1000, 2000].find((s) => m / s <= 5) || 2500;
  function histogram(box, a, p, w, o = {}) {
    const C = a.Charts;
    const top = o.top ?? 130;
    const nb = Math.floor(top / w) + 1;
    const counts = Array(nb).fill(0);
    for (const [v, c] of p) if (v <= top) counts[Math.floor(v / w)] += c;
    const step = stepFor(Math.max(...counts));
    const ymax = Math.ceil((Math.max(...counts) * 1.12) / step) * step;
    const f = C.frame(box, { x: [0, nb * w], y: [0, ymax], h: o.h || 230, pad: { l: 52, r: 16, t: 26, b: 40 }, label: o.label || K.tr('Histogram of latency') });
    const tickStep = Math.max(1, Math.ceil(nb / 8));
    const ticks = [];
    for (let i = 0; i <= nb; i += tickStep) ticks.push(i * w);
    C.axisX(f, ticks, (v) => v, K.tr('latency (minutes), bins start at 0'));
    const yt = [];
    for (let v = 0; v <= ymax; v += step) yt.push(v);
    C.axisY(f, yt, (v) => num(v), K.tr('orders'));
    const lastFull = counts.reduce((k, c, i) => (c ? i : k), 0);
    counts.forEach((c, i) => {
      if (!c) return;
      const x0 = f.X(i * w) + 1, x1 = f.X((i + 1) * w) - 1;
      const hpx = Math.max(3, f.Y(0) - f.Y(c));
      f.add('data', 'rect', { x: x0, width: Math.max(1, x1 - x0), y: f.Y(0) - hpx, height: hpx, rx: 2, class: o.cls ? o.cls(i * w, (i + 1) * w) : 'f-b' });
      if (nb <= 16 || i === lastFull) f.add('data', 'text', { x: (x0 + x1) / 2, y: f.Y(0) - hpx - 5, 'text-anchor': 'middle', class: 'strong' }, num(c));
    });
    return { f, counts, nb };
  }

  function boxPlots(el, a) {
    const C = a.Charts;
    const f = C.frame(el, { x: [0, 130], y: [0, 3], h: 230, pad: { l: 58, r: 22, t: 18, b: 40 }, label: K.tr('Side-by-side box plots of valid latency for Hubs A, B and C') });
    C.axisX(f, [0, 20, 40, 60, 80, 100, 120], (v) => v, K.tr('latency (minutes)'));
    HUBS.forEach((h, i) => {
      const p = pairs(h);
      const D = describe(p);
      const y = f.Y(2.5 - i);
      const inside = p.filter(([v]) => v >= D.lf && v <= D.uf).map(([v]) => v);
      const lo = Math.min(...inside), hi = Math.max(...inside);
      f.add('grid', 'text', { x: f.P.l - 10, y: y + 4, 'text-anchor': 'end', class: 'strong' }, `${K.tr('Hub')} ${h}`);
      f.add('data', 'line', { x1: f.X(lo), x2: f.X(D.q1), y1: y, y2: y, class: 's-ink' });
      f.add('data', 'line', { x1: f.X(D.q3), x2: f.X(hi), y1: y, y2: y, class: 's-ink' });
      for (const x of [lo, hi]) f.add('data', 'line', { x1: f.X(x), x2: f.X(x), y1: y - 8, y2: y + 8, class: 's-ink' });
      f.add('data', 'rect', { x: f.X(D.q1), width: f.X(D.q3) - f.X(D.q1), y: y - 15, height: 30, rx: 4, class: 'f-soft' });
      f.add('data', 'line', { x1: f.X(D.med), x2: f.X(D.med), y1: y - 15, y2: y + 15, class: 's-violet' });
      f.add('data', 'text', { x: f.X(D.q3) + 4, y: y - 19, class: 'strong' }, `IQR ${f1(D.iqr).replace(/\.0$/, '')}`);
      const groups = new Map();
      for (const [v, c] of p) if (v > D.uf || v < D.lf) { const k = Math.round(v); const g = groups.get(k) || { v, c: 0 }; g.c += c; groups.set(k, g); }
      for (const g of groups.values()) {
        f.add('data', 'circle', { cx: f.X(g.v), cy: y, r: 5, class: 'f-warn-solid' });
        f.add('data', 'text', { x: f.X(g.v), y: y + 22, 'text-anchor': 'middle' }, `×${num(g.c)}`);
      }
    });
    C.legend(el, [[K.tr('Box: Q1 to Q3'), 'var(--violet-soft)'], [K.tr('Median'), 'var(--violet)'], [K.tr('Beyond the hub’s own fence'), 'var(--warn)']]);
  }

  function axisBars(el, a) {
    let base = 0;
    const box = a.h('div');
    el.append(box);
    const ctrls = a.h('div', { class: 'lk-controls' });
    el.append(ctrls);
    const out = a.readout(el);
    const means = HUBS.map((h) => describe(pairs(h)).mean);
    const draw = () => {
      box.replaceChildren();
      const C = a.Charts;
      const f = C.frame(box, { x: [0, 3], y: [base, 31], h: 220, pad: { l: 50, t: 22, b: 40 }, label: K.tr('Bar chart of mean latency by hub with an adjustable axis start') });
      const s = 31 - base > 12 ? 5 : 1;
      const t = [];
      for (let v = base; v <= 31; v += s) t.push(v);
      C.axisY(f, t, (v) => v, K.tr('mean latency (minutes)'));
      means.forEach((m, i) => {
        f.add('data', 'rect', { x: f.X(i + 0.22), width: f.X(0.56) - f.X(0), y: f.Y(m), height: Math.max(1, f.Y(base) - f.Y(m)), rx: 4, class: i === 2 ? 'f-b' : 'f-a' });
        f.add('data', 'text', { x: f.X(i + 0.5), y: f.Y(m) - 6, 'text-anchor': 'middle', class: 'strong' }, f1(m));
        f.add('grid', 'text', { x: f.X(i + 0.5), y: f.H - f.P.b + 18, 'text-anchor': 'middle', class: 'strong' }, `${K.tr('Hub')} ${HUBS[i]}`);
      });
      const drawn = (means[2] - base) / (means[0] - base);
      out([[K.tr('Axis starts at'), `${base} ${K.tr('min')}`], [K.tr('Hub C bar ÷ Hub A bar, as drawn'), `${drawn.toFixed(2)}×`, drawn > 1.5 ? 'warn' : 'ok'], [K.tr('Hub C mean ÷ Hub A mean'), `${(means[2] / means[0]).toFixed(2)}×`]]);
    };
    a.slider(ctrls, { label: K.tr('Axis starts at'), min: 0, max: 27, step: 1, value: 0, fmt: (v) => `${v} ${K.tr('min')}`, onInput: (v) => { base = v; draw(); } });
    draw();
  }

        render(q, a) {
          const C = a.Charts;
          const p = pairs('C');
          const n = describe(p).n;
          let t = 30;
          const f = C.frame(q, { x: [0, 130], y: [0, 1000], h: 250, pad: { l: 50, r: 18, t: 50, b: 40 }, label: K.tr('Hub C orders by latency with a draggable SLA threshold') });

          const bars = p.map(([v, c]) => {
            const hpx = Math.max(3, f.Y(0) - f.Y(c));
            const r = f.add('data', 'rect', { x: f.X(v) - 4, width: 8, y: f.Y(0) - hpx, height: hpx, rx: 2 });

          });

          const upd = (v) => {
            t = v;
            const k = p.reduce((s, [x, c]) => s + (x <= t ? c : 0), 0);

          { id: 'limit', label: 'Limit<br><small>what they cannot show</small>' },
          { id: 'rec', label: 'Recommendation<br><small>what to do next</small>' },
        ],
        tiles: [
          { id: 't_rec', t: 'Hold one cycle and audit Hub C’s 129 flagged orders against the contract.' },
          { id: 't_cause', t: 'Hub C’s carrier caused the long delays.' },
          { id: 't_obs', t: 'All three hubs have a 22-minute median; Hub C’s IQR is 17, not 7.' },
          { id: 't_lim', t: 'These records cannot show that Hub C’s carrier caused the delays.' },
        ],
        want: { obs: 't_obs', limit: 't_lim', rec: 't_rec' },
        hints: {
          t_cause: 'That is a causal claim. Descriptive summaries show an association between hub and latency, not its cause.',
        },
        why: `<p>An observation reports these records. A limit says what they cannot establish. A recommendation states an action given both. Keeping them apart stops a descriptive gap from turning into a blame claim.</p>
          <p>Route mix, demand, weather, handoffs and recording practice could all contribute to Hub C’s spread.</p>`,
      },
      {
        id: 'decision', part: 2, type: 'choice', refs: ['5.2'],
        title: 'Make the call',
        figure(el, a) {
          const rows = [
            [K.tr('Records screened; codes left out of latency only'), K.tr('9,958 valid of 10,000'), true],
            [K.tr('A typical order takes longer at Hub C'), K.tr('median 22 at all three'), false],
            [K.tr('Hub C is less consistent'), K.tr('IQR 17 vs 7'), true],
            [K.tr('Hub C has a long upper tail'), K.tr('129 orders above 56.5 min; max 124'), true],
            [K.tr('The records show who caused the delays'), K.tr('descriptive only'), false],
          ];
          el.append(a.h('ul', { class: 'lk-checklist', 'aria-label': K.tr('What the evidence shows') },
            rows.map(([t, ev, ok]) => a.h('li', null, a.h('span', null, t, a.h('small', null, ev)), a.chip(ok ? K.tr('Shown') : K.tr('Not shown'), ok ? 'ok' : 'warn')))));
        },
        scene: 'You are the analyst. The VP wants one recommendation for the carrier review.',
        prompt: 'What does the evidence support?',
        options: [
          { t: 'Hold one cycle: audit Hub C’s long orders; penalize only on a verified breach.', ok: true },
          { t: 'Penalize now: Hub C’s wider IQR proves the carrier is at fault.', hint: 'The IQR describes spread. It cannot say who or what caused it.' },
          { t: 'Close the review: every hub has the same 22-minute median.', hint: 'Equal medians hide Hub C’s wider spread and its 129 long orders. Customers still feel those delays.' },
          { t: 'Penalize now: 129 orders sit beyond the Tukey fence.', hint: 'A Tukey flag is a statistical label, not a contract breach. Check the terms and the records first.' },
        ],
        praise: (S) => {
          const calls = ['Penalize the Hub C carrier now', 'Hold one cycle and investigate first', 'I need more information'];
          const g = S.polls.hook;
          return g == null ? K.tr('Right call.') : K.tr('Right call. Your gut call at the start was “{call}”. Now you can back your answer with evidence.').replace('{call}', K.tr(calls[g]));
        },
        why: `<p>The records support a clear observation: the same typical time at every hub, far less consistency at Hub C, and a tail of 129 orders above its fence. They do not show the cause. A penalty now risks blaming the carrier for route mix, demand or recording issues.</p>
          <p>Holding one cycle has a cost too: customers may keep facing delays, so Metro keeps supporting them during the audit. If the audit confirms a breach of the agreed terms, a penalty then rests on evidence.</p>`,
        ledger: { id: 'decision', value: 'Hold one cycle and audit; penalize only on a verified breach' },
      },
      {
        id: 'bench', part: 2, type: 'read', refs: ['3.1', '3.2'],
        title: 'Your evidence bench',
        callout: 'Screen the codes before you count. Pair the median with the IQR and the mean with the SD. A flag or a gap is a question, not a verdict.',
        body: ['Pick a hub and move the controls. Every number comes from the lab file’s valid orders.'],
        figure(el, a) {
          const st = { hub: 'C', codes: false, w: 10, t: 50 };
          const ctrls = a.h('div', { class: 'lk-controls' });
          const sel = a.h('select', { id: 'lk-bench-hub', onchange: () => { st.hub = sel.value; draw(); } },
            [['All', K.tr('All hubs')], ['A', `${K.tr('Hub')} A`], ['B', `${K.tr('Hub')} B`], ['C', `${K.tr('Hub')} C`]].map(([v, t]) => a.h('option', { value: v, selected: v === 'C' }, t)));
          const chk = a.h('input', { type: 'checkbox', id: 'lk-bench-codes', onchange: () => { st.codes = chk.checked; draw(); } });
          ctrls.append(a.h('div', { class: 'lk-x-filter' }, a.h('label', { for: 'lk-bench-hub' }, K.tr('Hub')), sel),
            a.h('label', { class: 'lk-caption', for: 'lk-bench-codes' }, chk, ' ', K.tr('Count the 999 codes as minutes (a leak)')));
          el.append(ctrls);
          const box = a.h('div');
          el.append(box);
          const sliders = a.h('div', { class: 'lk-controls' });
          el.append(sliders);
          const out = a.readout(el);
          const note = a.h('p', { class: 'lk-caption' });
          el.append(note);
          const draw = () => {
            const p = pairs(st.hub, st.codes);
            const D = describe(p);
            box.replaceChildren();
            histogram(box, a, p, st.w, { label: K.tr('Histogram of latency for the chosen hub'), cls: (x0, x1) => {
              const inBin = p.filter(([v]) => v >= x0 && v < x1);
              return inBin.every(([v]) => v <= st.t) ? 'f-ok-solid' : inBin.every(([v]) => v > st.t) ? 'f-warn-solid' : 'f-b';
            } });
            const share = D.count((v) => v <= st.t) / D.n;
            out([
              ['n', num(D.n)], [K.tr('Mean'), `${f1(D.mean)} ${K.tr('min')}`], [K.tr('Median'), `${f1(D.med)} ${K.tr('min')}`], [K.tr('SD'), `${f1(D.sd)} ${K.tr('min')}`],
              ['Q1', f1(D.q1)], ['Q3', f1(D.q3)], ['IQR', f1(D.iqr)], [K.tr('Upper fence'), f1(D.uf)], [K.tr('Flagged'), num(D.flags)],
              ['P95', `${f1(D.p95)} ${K.tr('min')}`], [K.tr('At or below threshold'), pct(share), share >= 0.95 ? 'ok' : 'warn'],
            ]);
            note.textContent = st.codes ? K.tr('The 999 codes sit far off this chart, but they still pull the mean and SD.') : K.tr('Green bins: every order meets the threshold. Amber: none do. Violet: some do.');
          };
          a.slider(sliders, { label: K.tr('Bin width'), min: 2, max: 50, step: 1, value: 10, fmt: (v) => `${v} ${K.tr('min')}`, onInput: (v) => { st.w = v; draw(); } });
          a.slider(sliders, { label: K.tr('SLA threshold'), min: 10, max: 130, step: 1, value: 50, fmt: (v) => `${v} ${K.tr('min')}`, onInput: (v) => { st.t = v; draw(); } });
          draw();
        },
      },
    ],
    onFinish(S, a) {
      const graded = Object.keys(S.res).length;
      const firsts = Object.values(S.res).filter((v) => v === 'first').length;
      K.confetti();
      K.sheet(K.tr('Lesson complete'), [
        a.h('p', null, K.tr('You earned {pts} points: {firsts} first-try answers across {graded} questions.').replace('{pts}', S.pts).replace('{firsts}', firsts).replace('{graded}', graded)),
        a.h('p', null, K.tr('Your evidence file stays in the case panel. Next, open the LAB01 checkpoints page to check your workbook cells.')),
      ]);
    },
  });
})();

</script>

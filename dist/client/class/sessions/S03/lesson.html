g the unusual one easy to inspect. If individual visit IDs should not be shared outside the team, replace the ID column in the managerial version with anonymous row labels; retain the restricted audit table separately. Aesthetics must not override privacy or accuracy.</p>\n<p>Points suit individual observations; lines suit ordered sequences; bars suit category comparisons; area can suggest totals over a continuous axis and is unnecessary here. Avoid 3-D effects, decorative contrast, or a cropped bar-chart axis that exaggerates a difference. A scatterplot needs two quantitative variables measured on the same visits: this extract has only one such variable, wait. Do not manufacture an x-variable to make a relationship graph.</p>\n<p><b>Failure mode:</b> Removing the 31-minute point because the revised chart looks cleaner.</p>\n<p><b>Try it — ungraded.</b> A slide shows “87.5% met target” in large type and hides “1 wait missing” in a footnote. What single edit most improves honesty?\n<b>Explained answer:</b> Place <b>“7/8 recorded waits; 1/9 visits missing” beside the percentage</b>. Viewers can then identify both the numerator and the evidence gap.</p>"},{"id":"5","level":2,"title":"5. Validate and communicate a bounded decision","short":"5. Validate and communicate a bo…","html":""},{"id":"5.1","level":3,"title":"5.1 Independent checks and a reproducible record","short":"5.1. Independent checks and a re…","html":"<p>A <b>reproducible analysis</b> preserves the input, the rule used to change it, and the outputs another analyst should obtain. Here, keep the untouched 10-row export; document that duplicate 104 was confirmed as a repeated export; save the nine-visit analysis table; and retain a short data dictionary defining <code>WaitMin</code> in minutes and a blank as unknown. Sorting or filtering for inspection must not quietly redefine the analysis population. Excel Tables make the included rows easier to see, but their formulas still need a denominator check (Microsoft, n.d.-a; Microsoft, n.d.-b).</p>\n<p><b>Worked validation ledger.</b> Before making a recommendation, independently confirm:</p>\n<div class=\"tbl\"><table><thead><tr><th>Check</th><th>Expected result</th></tr></thead><tbody><tr><td>Raw export rows / distinct verified visits</td><td>10 / 9</td></tr><tr><td>Numeric waits / missing waits</td><td>8 / 1</td></tr><tr><td>Channel counts</td><td>5 walk-in + 4 scheduled = 9</td></tr><tr><td>Sum of numeric waits</td><td>80 minutes</td></tr><tr><td>Waits meeting <code>&lt;=10</code> / valid waits</td><td>7 / 8</td></tr><tr><td>Mean / median</td><td>10 / 7.5 minutes</td></tr></tbody></table></div>\n<p>Recount the waits by hand, then compare with Excel and SPSS. If a tool shows <b>9 valid waits</b>, investigate whether blank 109 was converted to zero. If it shows <b>10 visits</b>, revisit the duplicate. If an AI assistant suggests a formula or chart, test its output against this ledger and inspect its missing-value rule; fluent prose is not an independent check.</p>\n<p><b>Failure mode:</b> Sharing only a chart. Without the retained rows, inclusion rule, and definitions, a colleague cannot explain a changed KPI.</p>\n<p><b>Try it — ungraded.</b> A colleague obtains a mean of <b>80/9 = 8.89</b> minutes from the current table. What went wrong?\n<b>Explained answer:</b> The sum <b>80</b> covers <b>eight measured waits</b>, not nine measured waits. The known visit with missing wait belongs in a visit count, but it contributes no numeric value to the mean; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>80</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">80/8=10</annotation></semantics></math></span> minutes.</p>"},{"id":"5.2","level":3,"title":"5.2 Separate observation, assumption, and recommendation","short":"5.2. Separate observation, assum…","html":"<p><b>Descriptive observation</b> reports these records. An <b>inference</b> extends beyond them and needs a defensible sampling basis. An <b>assumption</b> fills a gap openly. A <b>recommendation</b> states what to do given the evidence and limits. Keeping those sentences distinct prevents a short convenience extract from becoming a claim about next week’s demand. Penn State notes that representativeness matters when generalizing from observed cases to a population (Pennsylvania State University, n.d.-a).</p>\n<p><b>Worked manager note.</b>\n<b>Observation:</b> “In the nine distinct visits recorded September 7–11, eight have waits. Seven of those eight met 10 minutes (<b>87.5%</b>), and one wait is missing (<b>11.1%</b> of visits). The recorded median is <b>7.5 minutes</b>; one recorded wait is <b>31 minutes</b>.”\n<b>Assumption and limit:</b> “The 31-minute value is provisionally retained until timestamp verification. These few convenience observations do not establish next week’s rate or the effect of staffing.”\n<b>Recommendation:</b> “Do <b>not</b> authorize an extended staffing schedule solely from this extract. Verify visits 108 and 109, repair wait capture, and collect a defined period covering busy and quiet desk hours. Reassess staffing against the service target and missingness guardrail with the fuller record.”</p>\n<p>This recommendation does not say the desk is performing well. Even the favorable missing-wait scenario yields <b>8/9 = 88.9%</b>, below the fictional 90% target for these visits. It says the proposed staffing change has not yet been evaluated with adequate evidence. Later sessions introduce sampling intervals, comparisons, and tests; a descriptive percentage alone does not establish a causal staffing benefit.</p>\n<p><b>Failure mode:</b> “The target was missed, so extending hours will fix it.” The first clause describes a small extract; the second asserts an untested intervention.</p>\n<p><b>Try it — ungraded.</b> Rewrite “Scheduled pickups cause long waits” as a supportable observation using this case.\n<b>Explained answer:</b> “The <b>31-minute recorded wait</b> was for one scheduled pickup.” One observation identifies a case for investigation; it does not establish a channel effect or causality.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>[KEY] <b>Count cases at the declared grain before calculating a KPI.</b> Ten export rows represented nine verified visits.</li><li>Report both a metric’s <b>numerator and denominator</b>: seven of eight recorded waits met 10 minutes.</li><li>Keep a known visit with a missing wait in visit counts; do not turn its wait into zero.</li><li>Inspect an unusual value against its source. A statistical flag does not prove a recording error.</li><li>Show <b>center and spread together</b>: mean 10, median 7.5, and one recorded wait of 31 minutes.</li><li>State bin boundaries and quartile conventions so another analyst can reproduce a chart.</li><li>Choose a table for exact small counts, bars for categories, and a histogram or boxplot for numeric shape.</li><li>[KEY] <b>Separate what these records show from what might happen next week.</b> This extract cannot establish a staffing effect.</li><li>Preserve the raw file, reconciliation decision, definitions, formulas, and independent check totals.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<ul><li><b>Bias:</b> A systematic distortion, such as long waits being recorded less often.</li><li><b>Categorical variable:</b> A label such as pickup channel, summarized with counts.</li><li><b>Convenience extract:</b> Available records not selected to represent the intended population.</li><li><b>Denominator:</b> The cases a fraction is based on; the observed KPI uses eight recorded waits.</li><li><b>Distribution:</b> The pattern of values, including their center, spread, and unusual observations.</li><li><b>Grain:</b> What one data row represents; here, one pickup visit.</li><li><b>Interquartile range (IQR):</b> Third quartile minus first quartile, describing the middle portion’s spread.</li><li><b>KPI:</b> A measure tied to a decision, such as the share meeting a wait-time rule.</li><li><b>Mean:</b> Sum of numeric values divided by their numeric count.</li><li><b>Median:</b> Middle value, or average of the two middle values, after sorting.</li><li><b>Missing value:</b> An unavailable measurement for a case known to exist.</li><li><b>Outlier:</b> An unusually distant observed value that merits investigation.</li><li><b>Population:</b> The full set of cases relevant to a question; here, next week’s desk visits.</li><li><b>Provenance:</b> Where records and values originated and how they were handled.</li><li><b>Sensitivity check:</b> Recalculating under a stated alternative to see what changes.</li></ul>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>IBM. (n.d.-a). <i>Setting general options</i>. IBM SPSS Statistics documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=charts-setting-general-options\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=charts-setting-general-options</a></p>\n<p>IBM. (n.d.-b). <i>Running an analysis</i>. IBM SPSS Statistics documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=introduction-running-analysis\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=introduction-running-analysis</a></p>\n<p>IBM. (n.d.-c). <i>Running the analysis</i>. IBM SPSS Statistics documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=distributions-running-analysis\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=distributions-running-analysis</a></p>\n<p>IBM. (n.d.-d). <i>Boxplots</i>. IBM SPSS Statistics documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=types-boxplots\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=types-boxplots</a></p>\n<p>Microsoft. (n.d.-a). <i>Using structured references with Excel tables</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/using-structured-references-with-excel-tables\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/using-structured-references-with-excel-tables</a></p>\n<p>Microsoft. (n.d.-b). <i>Sort data in a range or table in Excel</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-US/Excel/sort-data-in-a-range-or-table-in-excel\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-US/Excel/sort-data-in-a-range-or-table-in-excel</a></p>\n<p>Microsoft. (n.d.-c). <i>Ways to count values in a worksheet</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/ways-to-count-values-in-a-worksheet\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/ways-to-count-values-in-a-worksheet</a></p>\n<p>Microsoft. (n.d.-d). <i>STDEV.S function</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/stdev-s-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/stdev-s-function</a></p>\n<p>National Institute of Standards and Technology. (n.d.). <i>What is EDA?</i> NIST/SEMATECH e-Handbook of Statistical Methods. <a href=\"https://www.itl.nist.gov/div898/handbook/eda/section1/eda11.htm\" target=\"_blank\" rel=\"noopener\">https://www.itl.nist.gov/div898/handbook/eda/section1/eda11.htm</a></p>\n<p>Pennsylvania State University. (n.d.-a). <i>Lesson 1: Collecting data</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson01\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson01</a></p>\n<p>Pennsylvania State University. (n.d.-b). <i>Lesson 2: Describing data, part 1</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson02\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson02</a></p>\n<p>World Wide Web Consortium. (n.d.). <i>Complex images</i>. Web Accessibility Initiative. <a href=\"https://www.w3.org/WAI/tutorials/images/complex/\" target=\"_blank\" rel=\"noopener\">https://www.w3.org/WAI/tutorials/images/complex/</a></p>"}]};
globalThis.LESSON_I18N = {"zh":{"Should Metro Penalize Hub C?":"Metro 该处罚 Hub C 吗？","GC1015 · Session 3 · Data quality, distributions, descriptive evidence":"GC1015 · 第 3 节课 · 数据质量、分布、描述性证据","Finish":"完成","Evidence so far":"目前的证据","Data quality and missingness":"数据质量与缺失","Center, spread and shape":"中心、离散程度和形状","Visual evidence and outliers":"可视化证据与离群值","Case file: Metro E-Commerce Logistics":"案例资料：Metro E-Commerce Logistics","Fictional delivery company with three hubs. File: <code>orders_story.csv</code>, 10,000 rows, one row per recorded order. Latency is fulfillment time in minutes.":"一家虚构的配送公司，有三个枢纽。文件：<code>orders_story.csv</code>，共 10,000 行，每行是一笔已记录的订单。履约时长指履约所需的时间，单位为分钟。","Column":"列","Meaning":"含义","Missing code":"缺失值代码","OrderID":"OrderID","Order identifier":"订单标识符","none":"无","CustomerID":"CustomerID","Customer identifier":"客户标识符","OrderTier":"OrderTier","1 Standard, 2 Priority, 3 Premium":"1 Standard，2 Priority，3 Premium","Hub":"Hub","Hub A, Hub B or Hub C":"Hub A、Hub B 或 Hub C","Age_Years":"Age_Years","Customer age in years":"客户年龄（岁）","Latency_Minutes":"Latency_Minutes","Fulfillment time in minutes":"履约时间（分钟）","Decision: penalize the Hub C carrier now, or hold one reporting cycle and investigate?":"决策：现在就处罚 Hub C 的承运商，还是暂缓一个报告周期，先调查？","Quartiles and percentiles use Excel’s exclusive rule (QUARTILE.EXC), as in LAB01.":"四分位数和百分位数采用 Excel 的不含端点规则（QUARTILE.EXC），与 LAB01 相同。","The Toolkit reader’s worked examples use a smaller practice case, Cedar Lane Repair. Same methods, different numbers.":"Toolkit 阅读材料中的例题用的是一个更小的练习案例：Cedar Lane Repair。方法相同，数字不同。","Grain":"粒度","Screen 2":"第 2 屏","Scales":"测量尺度","Missing-value codes":"缺失值代码","Hub C center":"Hub C 的中心","If codes leak":"如果代码混入","Spread by hub":"各枢纽的离散程度","SLA threshold (P95)":"SLA 阈值（P95）","Tukey flags":"Tukey 标记","Reconciled totals":"核对后的总数","Recommendation":"建议","Should Metro penalize Hub C?":"Metro 该处罚 Hub C 吗？","Your gut call, before any numbers: what should Metro do?":"先别看数字，凭直觉判断：Metro 该怎么做？","Metro E-Commerce Logistics, a fictional company, ships online orders through three hubs: A, B and C.":"Metro E-Commerce Logistics 是一家虚构的公司，通过三个枢纽配送网上订单：A、B 和 C。","Customers report delays. The VP of Supply Chain is thinking about a penalty for the carrier at Hub C. You have the order file: 10,000 rows.":"客户反映配送延迟。供应链副总裁正在考虑处罚 Hub C 的承运商。你手上有订单文件：共 10,000 行。","Noted. We will test your call against the evidence at the end.":"记下了。最后我们会用证据来检验你的判断。","Penalize the Hub C carrier now":"现在就处罚 Hub C 的承运商","Hold one cycle and investigate first":"暂缓一个周期，先调查","I need more information":"我需要更多信息","One row, one what?":"一行代表一个什么？","The file has 10,000 rows, and every OrderID is different. CustomerID C0001 appears on four rows, and so does every other customer.":"文件有 10,000 行，每个 OrderID 都不同。CustomerID C0001 出现在四行中，其他每位客户也是如此。","A teammate wants to delete repeated customers before counting orders. What do you say?":"一位队友想在统计订单数之前，先删掉重复的客户。你会怎么说？","<p>Grain is what one row records. Here it is one order: OrderID is unique on all 10,000 rows. The 2,500 customers each placed four orders.</p>\n          <p>A repeated OrderID would need a source check. A repeated CustomerID is normal. Count at the grain the decision needs, and the latency question is about orders.</p>":"<p>粒度是指一行记录的是什么。这里一行是一笔订单：OrderID 在全部 10,000 行中都是唯一的。2,500 位客户每人下了四笔订单。</p>\n          <p>如果 OrderID 重复，就需要回到数据源核查。CustomerID 重复是正常的。要按决策所需的粒度来计数，而履约时长的问题关心的是订单。</p>","Keep every row. One row is one order, and customers can order again.":"保留每一行。一行就是一笔订单，客户可以再次下单。","Delete the repeats so each customer counts once.":"删掉重复项，让每位客户只算一次。","That changes the grain from orders to customers. It would throw away 7,500 real orders.":"这会把粒度从订单变成客户。它会丢掉 7,500 笔真实的订单。","Delete repeats only when the hub is also the same.":"只有在枢纽也相同时，才删掉重复项。","A repeat customer at the same hub is still a separate order with its own OrderID.":"同一枢纽的回头客下的仍是另一笔订单，有自己的 OrderID。","Average the CustomerID codes to check for errors.":"对 CustomerID 代码求平均值，以检查错误。","IDs are labels. An average of labels has no meaning.":"ID 只是标签。标签的平均值没有意义。","One row = one order: 10,000 orders from 2,500 customers":"一行 = 一笔订单：10,000 笔订单，来自 2,500 位客户","Which arithmetic is allowed?":"哪些运算是允许的？","A number in a cell is not always an amount. OrderTier stores 1, 2 or 3 for Standard, Priority and Premium.":"单元格里的数字不一定代表数量。OrderTier 用 1、2 或 3 分别表示 Standard、Priority 和 Premium。","Drag one valid summary to each column. Two tiles do not belong anywhere.":"为每一列拖入一个有效的汇总方式。有两个卡片不属于任何一列。","<p>The scale decides the arithmetic. OrderID and CustomerID are labels: count them, never average them. Hub is nominal: counts, shares and the mode. OrderTier is ordinal: frequencies and the median tier work, but a mean of the codes assumes equal steps that nobody measured.</p>\n          <p>Latency is a ratio measure in minutes with a true zero, so means, SDs and ratios are allowed.</p>":"<p>尺度决定了能做哪些运算。OrderID 和 CustomerID 是标签：可以计数，但绝不能求平均。Hub 是定类变量：可以用计数、占比和众数。OrderTier 是定序变量：频数和中位等级都可以用，但对代码求均值，等于假设各级之间的间隔相等，而这一点没有人测量过。</p>\n          <p>履约时长是以分钟计的定比测量，有真正的零点，所以可以用均值、标准差（SD）和比率。</p>","Mean, median and SD in minutes":"以分钟计的均值、中位数和标准差（SD）","Mean tier code: 2.0":"等级代码的均值：2.0","Count rows and check each ID is unique":"统计行数，并检查每个 ID 是否唯一","Tier frequencies and the median tier":"各等级的频数和中位等级","Average OrderID number":"OrderID 编号的平均值","Order count and share for each hub":"各枢纽的订单数和占比","OrderID<br><small>identifier</small>":"OrderID<br><small>标识符</small>","Hub<br><small>nominal category</small>":"Hub<br><small>定类类别</small>","OrderTier<br><small>ordinal rank</small>":"OrderTier<br><small>定序等级</small>","Latency_Minutes<br><small>ratio measure</small>":"Latency_Minutes<br><small>定比测量</small>","Tier codes show rank only. The step from Standard to Priority need not equal the step from Priority to Premium, so a mean of the codes is not admissible.":"等级代码只表示顺序。从 Standard 到 Priority 的间隔，不一定等于从 Priority 到 Premium 的间隔，所以不能对代码求均值。","An ID only tells rows apart. Averaging IDs counts nothing and measures nothing.":"ID 只用来区分各行。对 ID 求平均，既不计数，也不测量任何东西。","Hubs have no natural order, so a median hub means nothing. Use counts and shares for Hub.":"枢纽没有天然的顺序，所以“中位枢纽”没有意义。对 Hub 请使用计数和占比。","Tier: ordinal, no mean. Latency: ratio, in minutes.":"等级：定序，不求均值。履约时长：定比，单位为分钟。","Find the hidden missing values":"找出隐藏的缺失值","The file has no blank cells. The data dictionary says missing values hide as codes: Age_Years = -1 and Latency_Minutes = 999.":"文件中没有空白单元格。数据字典说明，缺失值以代码的形式隐藏：Age_Years = -1，Latency_Minutes = 999。","Use the filters to count the coded rows.":"用筛选器数一数带代码的行。","<p>42 rows carry -1 for age and 999 for latency: the same 42 rows, 0.42% of the file. They are codes, not a 999-minute delivery or a customer aged -1.</p>\n          <p>Keep the rows in the source. Exclude a code only from its own variable, so latency summaries use 9,958 valid orders. Excel: <code>=COUNTIF(Orders[Latency_Minutes],999)</code>. A <code>COUNTBLANK</code> would return 0 here, because nothing is blank.</p>":"<p>有 42 行的年龄是 -1，履约时长是 999：而且正是同样的 42 行，占文件的 0.42%。它们是代码，并不是一次 999 分钟的配送，也不是一位 -1 岁的客户。</p>\n          <p>在源数据中保留这些行。只在代码所属的那个变量里排除它，所以履约时长的汇总使用 9,958 笔有效订单。Excel：<code>=COUNTIF(Orders[Latency_Minutes],999)</code>。这里用 <code>COUNTBLANK</code> 会返回 0，因为没有任何单元格是空白的。</p>","rows with Age_Years = -1: {{age}}":"Age_Years = -1 的行数：{{age}}","rows with Latency_Minutes = 999: {{lat}}":"Latency_Minutes = 999 的行数：{{lat}}","rows with both codes at once: {{both}}":"同时带有两种代码的行数：{{both}}","valid latency records = 10,000 − coded rows = {{valid}}":"有效履约时长记录数 = 10,000 − 带代码的行数 = {{valid}}","Set Age_Years to -1 and read the row count.":"把 Age_Years 设为 -1，然后读出行数。","Rows with age code -1":"年龄代码为 -1 的行数","Set Age_Years back to (Any), then set Latency_Minutes to 999.0.":"把 Age_Years 改回 (Any)，再把 Latency_Minutes 设为 999.0。","Rows with latency code 999":"履约时长代码为 999 的行数","Set both filters at the same time. The count does not drop, so the codes sit on the same rows.":"同时设置两个筛选器。计数没有减少，说明两种代码在同样的行上。","Rows with both codes":"同时带有两种代码的行数","10,000 rows minus the 42 latency codes.":"10,000 行减去 42 个履约时长代码。","Valid latency records":"有效履约时长记录数","42 rows coded -1 and 999 (0.42%); 9,958 valid latencies":"42 行带有代码 -1 和 999（0.42%）；9,958 个有效履约时长","Where do the codes fall?":"这些代码落在哪里？","Missing values can bias a summary if they cluster in one group. Check whether the 999 codes favor one hub.":"如果缺失值集中在某一组，就可能让汇总产生偏差。检查 999 代码是否偏向某个枢纽。","Set Latency_Minutes to 999.0, then try each hub. What do you find?":"把 Latency_Minutes 设为 999.0，然后逐个试试每个枢纽。你发现了什么？","<p>Each hub has 14 coded rows, and so does each tier. The codes do not cluster, and they touch 0.42% of rows. With under 2% coded and no group pattern, leaving them out of latency summaries is reasonable, if you document it.</p>\n          <p>The file cannot prove the codes are random. If the longest deliveries were the ones not logged, the codes would hide exactly the delays you care about. Ask the data owner how a 999 gets written.</p>":"<p>每个枢纽都有 14 行带代码，每个等级也是如此。这些代码没有扎堆，只涉及 0.42% 的行。代码不到 2%，也没有分组规律，所以在履约时长的汇总中排除它们是合理的，前提是你要把这一点记录下来。</p>\n          <p>这个文件无法证明这些代码是随机的。如果没被记录的恰好是耗时最长的那些配送，这些代码就会把你最关心的延迟藏起来。去问问数据负责人，999 是怎么被写进去的。</p>","Each hub has 14 codes, so missing latency does not favor one hub.":"每个枢纽都有 14 个代码，所以履约时长的缺失并不偏向某个枢纽。","Hub C has most of the codes, so it hides its delays.":"大部分代码都在 Hub C，所以它在隐藏自己的延迟。","Filter Hub C with 999.0. It has 14, the same as Hubs A and B.":"用 999.0 筛选 Hub C。它有 14 个，和 Hub A、Hub B 一样。","The even split proves the codes are missing completely at random.":"分布均匀，证明这些代码是完全随机缺失的。","An even split is a good sign, not proof. The codes could still depend on the unseen latency.":"分布均匀是个好迹象，但不是证明。这些代码仍可能取决于看不到的履约时长。","Too much is missing to use this file.":"缺失太多，这个文件不能用。","42 of 10,000 rows is 0.42%. That is small, and it is spread evenly.":"10,000 行中有 42 行，即 0.42%。这个比例很小，而且分布均匀。","Why is a value missing?":"值为什么会缺失？","The reason a value is missing matters more than the count. Three standard labels describe the reason.":"值缺失的原因比缺失的数量更重要。有三个标准标签可以描述原因。","Drag each Metro scenario to its label. One tile does not belong.":"把每个 Metro 情境拖到对应的标签下。有一个卡片不属于任何标签。","<p><b>MCAR:</b> missingness is unrelated to anything, so the remaining values still represent the whole, just with fewer of them.</p>\n          <p><b>MAR:</b> a recorded column, such as hub, explains the gap. You can compare or adjust within that column.</p>\n          <p><b>MNAR:</b> the missing value itself drives the gap. If long deliveries go unlogged, the median and the tail both look better than reality, and no formula on the observed rows can fix that.</p>":"<p><b>MCAR（完全随机缺失）：</b>缺失与任何因素都无关，所以剩下的值仍能代表整体，只是数量少了一些。</p>\n          <p><b>MAR（随机缺失）：</b>某个已记录的列（比如枢纽）能解释这些空缺。你可以在该列内部进行比较或调整。</p>\n          <p><b>MNAR（非随机缺失）：</b>缺失的值本身导致了空缺。如果耗时长的配送没被记录，中位数和尾部都会显得比实际更好，而对已观测到的行，任何公式都无法修正这一点。</p>","Drivers skip logging their longest deliveries":"司机不记录他们耗时最长的配送","A recorded 124-minute delivery":"一次已记录的 124 分钟配送","A scanner glitch drops times at random moments":"扫描仪故障在随机时刻丢失时间记录","One hub’s older app never records customer age":"某个枢纽的旧版应用从不记录客户年龄","MCAR<br><small>missing completely at random</small>":"MCAR<br><small>完全随机缺失</small>","MAR<br><small>explained by another recorded column</small>":"MAR<br><small>可由另一个已记录的列解释</small>","MNAR<br><small>depends on the missing value itself</small>":"MNAR<br><small>取决于缺失值本身</small>","A 124-minute time was recorded. It is an unusual value, not a missing one.":"这个 124 分钟的时间是有记录的。它是一个不寻常的值，而不是缺失值。","Long deliveries go missing more often, so it is not random. The unseen time drives it: MNAR.":"耗时长的配送更常缺失，所以这不是随机的。是看不到的时间本身在起作用：MNAR。","No recorded column explains it. The unseen time itself drives the gap: MNAR.":"没有任何已记录的列能解释它。是看不到的时间本身导致了空缺：MNAR。","It is not random: the hub, which you can see, explains it. That is MAR.":"这不是随机的：你能看到的枢纽解释了它。这就是 MAR。","The hub column explains the gap, and you can see the hub. That is MAR.":"枢纽这一列解释了空缺，而你能看到枢纽。这就是 MAR。","No column explains a random glitch. Missingness unrelated to anything is MCAR.":"没有哪一列能解释随机故障。与任何因素都无关的缺失就是 MCAR。","A random glitch does not depend on how long the delivery took. That is MCAR.":"随机故障与配送花了多长时间无关。这就是 MCAR。","One code, one column":"一个代码，只管一列","Suppose next month’s file has an order with Age_Years = -1 and a recorded latency of 31 minutes.":"假设下个月的文件里有一笔订单，Age_Years = -1，已记录的履约时长是 31 分钟。","Does this order belong in the latency summary?":"这笔订单应该计入履约时长的汇总吗？","<p>A code makes one variable missing for that row. The row stays in the file, and its other valid values still count. In this month’s file the 42 coded rows carry both codes, but the rule is still written per column.</p>\n          <p>Deleting every incomplete row can bias a summary if those rows differ from the rest.</p>":"<p>一个代码只让该行的一个变量缺失。这一行仍留在文件中，它的其他有效值照样计入。在本月的文件里，42 个带代码的行同时带有两种代码，但规则仍然是按列来写的。</p>\n          <p>如果不完整的行与其他行不同，删掉所有不完整的行就可能让汇总产生偏差。</p>","Yes. The -1 makes only the age missing; the 31 minutes is valid.":"是。-1 只让年龄缺失；31 分钟是有效的。","No. Drop any row that has a code anywhere.":"否。只要某一行任何地方有代码，就删掉它。","That throws away a valid latency and shrinks the denominator. Apply each code only to its own column.":"这会丢掉一个有效的履约时长，还会缩小分母。每个代码只作用于它自己的那一列。","Yes, and count the customer’s age as 0.":"是，并把客户的年龄算作 0。","An unknown age is not zero. Leave it missing for age analysis.":"未知的年龄不等于零。做年龄分析时，把它保留为缺失。","No. Replace its latency with the mean.":"否。用均值替换它的履约时长。","The 31 minutes was recorded. Nothing needs replacing.":"这 31 分钟是有记录的。不需要替换任何东西。","The center of Hub C":"Hub C 的中心","Hub C has 3,320 valid orders. The table counts how many took each time, with a running total.":"Hub C 有 3,320 笔有效订单。表格统计了每种时长各有多少笔订单，并附有累计数。","Fill in the mean and the median.":"填入均值和中位数。","<p>The mean is 29.94 minutes and the median is 22. The mean sits 7.94 minutes higher because a few long orders, at 60 and 124 minutes, add many minutes to the sum but do not move the middle position.</p>\n          <p>Excel: <code>AVERAGE</code> and <code>MEDIAN</code> on the filtered Hub C latencies, as in Take Home 1, cells B10 and B11.</p>":"<p>均值是 29.94 分钟，中位数是 22 分钟。均值高出 7.94 分钟，是因为少数耗时长的订单（60 分钟和 124 分钟）给总和加了很多分钟，却不会移动中间的位置。</p>\n          <p>Excel：对筛选后的 Hub C 履约时长使用 <code>AVERAGE</code> 和 <code>MEDIAN</code>，做法同 Take Home 1 的单元格 B10 和 B11。</p>","mean = 99,391 / 3,320 = {{mean}} minutes":"均值 = 99,391 / 3,320 = {{mean}} 分钟","median = average of the 1,660th and 1,661st orders = {{med}} minutes":"中位数 = 第 1,660 笔与第 1,661 笔订单的平均值 = {{med}} 分钟","mean − median = {{gap}} minutes":"均值 − 中位数 = {{gap}} 分钟","Hub C mean":"Hub C 均值","The running total reaches 1,661 in the 22-minute row, so both middle orders took 22 minutes.":"累计数在 22 分钟这一行达到 1,661，所以中间的两笔订单都用了 22 分钟。","Hub C median":"Hub C 中位数","Mean minus median":"均值减中位数","Hub C: mean 29.94, median 22 minutes":"Hub C：均值 29.94，中位数 22 分钟","Drag one order":"拖动一笔订单","Here are ten real Hub C orders. Drag the longest one, then press the button to turn it into the 999 code.":"这里有十笔真实的 Hub C 订单。拖动耗时最长的那一笔，然后按下按钮，把它变成 999 代码。","Which summary never moves, wherever the longest order goes?":"无论最长的那笔订单移到哪里，哪个汇总指标都不会变？","<p>The median needs only the middle positions, the 5th and 6th of ten. Moving the longest order never changes which orders sit in the middle, so the median stays 22.</p>\n          <p>The mean adds every minute: it moves 0.1 minute for each minute the order moves, from 34.1 at 124 minutes to 121.6 with the 999 code. The SD squares distances, so it reacts even more, from 33.5 to 308.5 minutes.</p>":"<p>中位数只需要中间的位置，也就是十笔中的第 5 笔和第 6 笔。移动最长的订单，不会改变哪些订单处在中间，所以中位数始终是 22。</p>\n          <p>均值要把每一分钟都加进去：订单每移动一分钟，均值就移动 0.1 分钟，从 124 分钟时的 34.1 变成 999 代码时的 121.6。标准差（SD）要把距离平方，所以反应更大，从 33.5 分钟变成 308.5 分钟。</p>","The median: it stays at 22 minutes.":"中位数：它保持在 22 分钟。","The mean: one order out of ten cannot move it.":"均值：十笔中的一笔订单动不了它。","Watch the readout: with the 999 code the mean jumps from 34.1 to 121.6 minutes.":"看读数：换成 999 代码后，均值从 34.1 分钟跳到 121.6 分钟。","The SD: spread ignores a single order.":"标准差（SD）：离散程度不受单笔订单影响。","The SD grows fast, because the long order’s distance from the mean is squared.":"标准差（SD）增长很快，因为那笔长订单与均值的距离被平方了。","A rule one order can break":"一笔订单就能打破的规则","Suppose a draft contract fined a hub whenever its mean latency topped 30 minutes. Use the same ten Hub C orders.":"假设一份合同草案规定：只要某个枢纽的履约时长均值超过 30 分钟，就对它罚款。使用同样的十笔 Hub C 订单。","Drag the longest order. What is the highest whole-minute time that keeps the mean at or below 30?":"拖动最长的那笔订单。能让均值保持在 30 或以下的最大整数分钟是多少？","<p>The other nine orders total 217 minutes. The mean stays at or below 30 while 217 + x ≤ 300, so x ≤ 83 minutes. The median is 22 throughout.</p>\n          <p>The full file is just as fragile. Hub C’s real mean is 29.94 minutes, just under 30. One leaked 999 code would lift it to 30.23. A rule built on the mean can flip on a single record.</p>":"<p>其他九笔订单共 217 分钟。只要 217 + x ≤ 300，均值就保持在 30 或以下，所以 x ≤ 83 分钟。中位数始终是 22。</p>\n          <p>完整文件也一样脆弱。Hub C 的真实均值是 29.94 分钟，刚好低于 30。只要混入一个 999 代码，它就会升到 30.23。建立在均值上的规则，可能因一条记录而翻转。</p>","What a leaked code does":"混入的代码会造成什么","All hubs together have 9,958 valid orders totaling 282,807.2 minutes. Suppose a formula forgets to filter out the 42 codes of 999.":"所有枢纽合计有 9,958 笔有效订单，共 282,807.2 分钟。假设某个公式忘了筛掉 42 个 999 代码。","Compute both means, then the median.":"先算出两个均值，再算中位数。","<p>The leak adds 4.08 minutes, about 14%, to the mean. The median does not move. The SD jumps from 13.5 to 64.2 minutes.</p>\n          <p>Resistant is not immune. Here even the IQR jumps, from 12 to 25.5 minutes, because the quartiles sit at the edges of big blocks of tied values. Filter first, then summarize.</p>\n          <p>That is why Lab Part B filters <code>Latency_Minutes&lt;&gt;999</code> inside <code>AVERAGE</code>, <code>MEDIAN</code> and <code>STDEV.S</code>.</p>":"<p>混入的代码让均值增加了 4.08 分钟，约 14%。中位数不变。标准差（SD）从 13.5 分钟跳到 64.2 分钟。</p>\n          <p>稳健（不易被极端值拉动）不等于免疫。这里连 IQR 也从 12 分钟跳到了 25.5 分钟，因为四分位数正好落在大块相同值的边缘。先筛选，再汇总。</p>\n          <p>这就是为什么 Lab Part B 要在 <code>AVERAGE</code>、<code>MEDIAN</code> 和 <code>STDEV.S</code> 里用 <code>Latency_Minutes&lt;&gt;999</code> 进行筛选。</p>","valid mean = 282,807.2 / 9,958 = {{m1}} minutes":"有效均值 = 282,807.2 / 9,958 = {{m1}} 分钟","with the codes = (282,807.2 + 42 × 999) / 10,000 = {{m2}} minutes":"含代码 = (282,807.2 + 42 × 999) / 10,000 = {{m2}} 分钟","median, with or without the codes = {{med}} minutes":"中位数（含或不含代码）= {{med}} 分钟","Valid mean":"有效均值","42 × 999 = 41,958. Add it to 282,807.2, then divide by all 10,000 rows.":"42 × 999 = 41,958。把它加到 282,807.2 上，再除以全部 10,000 行。","Mean with codes":"含代码的均值","The middle of 10,000 sorted values is deep inside the 22-minute block. 42 values at the top cannot reach it.":"10,000 个排好序的值，中间位置深埋在 22 分钟那一块里。顶端的 42 个值够不着它。","Median":"中位数","Mean 28.40 → 32.48; median stays 22":"均值 28.40 → 32.48；中位数仍为 22","Which pair should Metro report?":"Metro 应该报告哪一对指标？","Valid latency, all hubs: mean 28.4 and SD 13.5 minutes; median 22 and IQR 12 minutes. The mean sits above the median.":"全部枢纽的有效履约时长：均值 28.4 分钟，标准差（SD）13.5 分钟；中位数 22 分钟，IQR 12 分钟。均值高于中位数。","Which pair best describes a typical order and its spread here?":"在这里，哪一对指标最能描述典型订单及其离散程度？","<p>A mean above the median signals a long right tail. A third of valid orders (33.3%) take longer than the 28.4-minute mean, so the mean is not what a typical customer waits. The median and IQR describe the typical order without being pulled by the tail.</p>\n          <p>Still report the mean when total burden matters. The gap fits a right tail; it does not say why the tail exists.</p>":"<p>均值高于中位数，说明有一条长长的右尾。三分之一的有效订单（33.3%）耗时超过 28.4 分钟的均值，所以均值并不是典型客户的等待时间。中位数和 IQR 能描述典型订单，又不会被尾部拉动。</p>\n          <p>当总负担很重要时，仍要报告均值。这个差距符合右尾的特征；但它说明不了尾部为什么存在。</p>","Median 22 and IQR 12: both resist the long right tail.":"中位数 22 和 IQR 12：两者都不易被长右尾拉动。","Mean 28.4 and SD 13.5: they use every order, so they always win.":"均值 28.4 和标准差（SD）13.5：它们用到了每一笔订单，所以总是更好。","Using every order also means long delays pull them up. For a typical order in a skewed metric, the resistant pair fits better.":"用到每一笔订单，也意味着长延迟会把它们拉高。对于偏斜指标中的典型订单，稳健的那一对更合适。","Mean 28.4 and IQR 12: one of each covers both views.":"均值 28.4 和 IQR 12：各取一个，两种视角都兼顾。","Mixed pairs confuse readers. The mean goes with the SD; the median goes with the IQR.":"混搭的组合会让读者困惑。均值配标准差（SD）；中位数配 IQR。","Median 22 alone: spread does not matter for an SLA.":"只用中位数 22：对 SLA 来说，离散程度无关紧要。","Hubs can share a median and differ a lot in spread. Always pair a center with a spread.":"各枢纽可能中位数相同，离散程度却差别很大。中心一定要和离散程度搭配报告。","Quartiles, the Excel way":"用 Excel 的方式求四分位数","QUARTILE.EXC finds Q1 at position (n + 1) × 0.25 in the sorted list, and Q3 at (n + 1) × 0.75. Hub C has n = 3,320.":"QUARTILE.EXC 在排好序的列表中，把 Q1 定在位置 (n + 1) × 0.25，把 Q3 定在 (n + 1) × 0.75。Hub C 的 n = 3,320。","Find Hub C’s quartiles and IQR.":"求出 Hub C 的四分位数和 IQR。","<p>Position 830.25 sits between the 830th and 831st orders. Both took 14 minutes, so Q1 = 14. Position 2,490.75 sits between two 31-minute orders, so Q3 = 31. The middle half of Hub C’s orders spans 14 to 31 minutes: an IQR of 17.</p>\n          <p>Hubs A and B each have Q1 = 19 and Q3 = 26, an IQR of 7. All three medians are 22, but Hub C’s middle half is more than twice as wide.</p>":"<p>位置 830.25 位于第 830 笔和第 831 笔订单之间。这两笔都用了 14 分钟，所以 Q1 = 14。位置 2,490.75 位于两笔 31 分钟的订单之间，所以 Q3 = 31。Hub C 中间一半的订单分布在 14 到 31 分钟之间：IQR 为 17。</p>\n          <p>Hub A 和 Hub B 都是 Q1 = 19、Q3 = 26，IQR 为 7。三个中位数都是 22，但 Hub C 中间一半的宽度是它们的两倍多。</p>","Q1 position = 3,321 × 0.25 = {{p1}}":"Q1 位置 = 3,321 × 0.25 = {{p1}}","Q1 = {{q1}} minutes":"Q1 = {{q1}} 分钟","Q3 position = 3,321 × 0.75 = {{p3}}":"Q3 位置 = 3,321 × 0.75 = {{p3}}","Q3 = {{q3}} minutes":"Q3 = {{q3}} 分钟","IQR = Q3 − Q1 = {{iqr}} minutes":"IQR = Q3 − Q1 = {{iqr}} 分钟","Q1 position":"Q1 位置","Orders 830 and 831 both fall in the 14-minute row: its running total goes from 830 to 831.":"第 830 笔和第 831 笔订单都落在 14 分钟这一行：这一行的累计数从 830 到 831。","Q1":"Q1","Q3 position":"Q3 位置","Orders 2,490 and 2,491 are both in the 31-minute row, which runs from 1,662 to 2,491.":"第 2,490 笔和第 2,491 笔订单都在 31 分钟这一行，这一行从 1,662 排到 2,491。","Q3":"Q3","IQR":"IQR","IQR: A 7, B 7, C 17 minutes (median 22 at all three)":"IQR：A 7，B 7，C 17 分钟（三者的中位数都是 22）","Set an SLA guardrail":"设定 SLA 护栏","An SLA guardrail can use the 95th percentile: a time that about 95% of valid orders meet. Drag the threshold across Hub C’s orders.":"SLA 护栏可以用第 95 百分位数：大约 95% 的有效订单都能达到的时间。在 Hub C 的订单上拖动阈值。","What is the smallest whole-minute threshold that at least 95% of Hub C’s valid orders meet?":"至少 95% 的 Hub C 有效订单都能达到的最小整数分钟阈值是多少？","<p>At 49 minutes only 2,491 of 3,320 orders (75.0%) qualify. At 50, the 700 orders that took exactly 50 minutes join, and the share jumps to 96.1%. Excel’s <code>PERCENTILE.EXC(..., 0.95)</code> also gives 50, for Hub C and for all hubs together.</p>\n          <p>So 3.9% of Hub C’s valid orders sit above the all-hubs P95. A threshold describes the data. Whether it is a fair contract term is a business decision.</p>":"<p>在 49 分钟时，3,320 笔订单中只有 2,491 笔（75.0%）达标。到 50 分钟时，耗时恰好 50 分钟的 700 笔订单也加进来，占比跃升到 96.1%。Excel 的 <code>PERCENTILE.EXC(..., 0.95)</code> 也得出 50，无论是对 Hub C 还是对全部枢纽合计。</p>\n          <p>所以 Hub C 有 3.9% 的有效订单高于全部枢纽的 P95。阈值只是描述数据。它是否算公平的合同条款，是一个业务决策。</p>","P95 = 50 min; 3.9% of Hub C orders above it":"P95 = 50 分钟；3.9% 的 Hub C 订单高于它","Match the chart to the question":"为问题匹配合适的图表","The VP will see one slide per question. Each question needs its own kind of display.":"VP 每个问题看一张幻灯片。每个问题都需要适合它的展示方式。","Drag a display to each question. Two displays do not belong.":"为每个问题拖入一种展示方式。有两种展示方式不属于任何问题。","<p>Bars compare category counts and must start at zero. A histogram shows one numeric variable’s shape. Box plots compare a numeric variable across three or more groups side by side. A small table gives exact counts, such as 14 coded rows per hub.</p>":"<p>条形图用于比较各类别的计数，必须从零开始。直方图展示一个数值变量分布的形状。箱线图把一个数值变量在三个或更多组之间并排比较。小表格给出精确的计数，比如每个枢纽有 14 行带代码。</p>","Line chart joining Hub A, B and C":"连接 Hub A、B 和 C 的折线图","Side-by-side box plots on one scale":"同一刻度上并排的箱线图","Bar chart with a zero baseline":"带零基线的条形图","3-D pie of latency minutes":"履约时长分钟数的 3-D 饼图","Small table":"小表格","Histogram with stated bin edges":"标明组边界的直方图","How many valid orders did each hub handle?":"每个枢纽处理了多少有效订单？","How are Hub C’s latencies distributed?":"Hub C 的履约时长是怎样分布的？","How do the three hubs’ latencies compare?":"三个枢纽的履约时长相比如何？","Exactly how many coded rows does each hub have?":"每个枢纽到底有多少带代码的行？","A line implies an ordered path, like time. Hubs are categories, so joining them invents a trend.":"折线意味着一条有顺序的路径，比如时间。枢纽是类别，把它们连起来就凭空造出了趋势。","A pie shows parts of a whole, and 3-D tilts distort the slices. Minutes per order are not parts of a whole.":"饼图展示整体中的各个部分，而 3-D 倾斜会让扇区变形。每个订单的分钟数并不是整体的一部分。","A histogram bins a numeric variable. Hub is a category, so counts per hub need bars.":"直方图把一个数值变量分组。Hub 是类别，所以每个枢纽的计数要用条形图。","Bars compare categories. The shape of one numeric variable needs a histogram.":"条形图用来比较类别。一个数值变量的形状要用直方图来看。","Bin width changes the story":"组距会改变故事","This histogram shows Hub C’s 3,320 valid orders, with bins starting at 0. Look for the empty stretch before the 29 orders at 124 minutes.":"这个直方图展示了 Hub C 的 3,320 个有效订单，组从 0 开始。找一找 124 分钟那 29 个订单之前的空白区段。","Widen the bins. What is the smallest bin width that hides the empty gap before the 124-minute orders?":"把组调宽。能让 124 分钟订单之前的空隙消失的最小组距是多少？","<p>Up to 41-minute bins, at least one empty bin separates the 60-minute orders from the 124-minute ones. At 42 minutes they land in neighboring bins, and the long delays look like a smooth tail.</p>\n          <p>Neither picture is false, but they tell different stories. Try more than one bin width, state the bin edges, and keep the same bins when you compare hubs.</p>":"<p>组距不超过 41 分钟时，60 分钟的订单和 124 分钟的订单之间至少隔着一个空组。组距到 42 分钟时，它们落进相邻的组，长时间延误看起来就像一条平滑的尾巴。</p>\n          <p>两幅图都不算错，但讲的是不同的故事。多试几种组距，标明组边界，比较枢纽时使用相同的组。</p>","Same median, different hubs":"中位数相同，枢纽不同","These box plots show all 9,958 valid orders on one scale. Each box runs from Q1 to Q3, and the line inside is the median.":"这些箱线图在同一刻度上展示全部 9,958 个有效订单。每个箱子从 Q1 延伸到 Q3，箱内的线是中位数。","A manager sees a 22-minute median at every hub and says service is the same. What does the chart add?":"一位经理看到每个枢纽的中位数都是 22 分钟，就说服务水平一样。这张图还告诉了你什么？","<p>All three medians are 22 minutes. Hubs A and B have Q1 = 19 and Q3 = 26, an IQR of 7. Hub C has Q1 = 14 and Q3 = 31, an IQR of 17. Some Hub C orders are faster than any at A or B, and some are much slower.</p>\n          <p>Equal centers can hide unequal consistency. That is evidence to investigate, not proof of fault.</p>":"<p>三个中位数都是 22 分钟。Hub A 和 Hub B 的 Q1 = 19，Q3 = 26，IQR 为 7。Hub C 的 Q1 = 14，Q3 = 31，IQR 为 17。Hub C 有些订单比 A 或 B 的任何订单都快，也有些慢得多。</p>\n          <p>中心相同，可能掩盖了稳定性的不同。这是值得调查的证据，不是过错的证明。</p>","Hub C’s middle half spans 17 minutes, against 7 at Hubs A and B.":"Hub C 中间一半订单的跨度是 17 分钟，而 Hub A 和 Hub B 只有 7 分钟。","Nothing. Equal medians mean equal service.":"没什么。中位数相同就说明服务相同。","The median is one position. The boxes show how spread out the middle half is, and Hub C’s is far wider.":"中位数只是一个位置。箱子显示中间一半有多分散，而 Hub C 的箱子宽得多。","Hub C is slower for a typical order.":"对典型订单来说，Hub C 更慢。","The typical order takes 22 minutes at all three hubs. The difference is in spread and tail, not center.":"在三个枢纽，典型订单都要 22 分钟。差别在离散程度和尾部，不在中心。","Hub C’s carrier causes the extra spread.":"Hub C 的承运商造成了额外的离散。","A box plot describes spread. Route mix, demand or recording practice could also explain it.":"箱线图描述的是离散程度。路线构成、需求或记录方式也可能解释这一点。","Flag the long orders":"标记出耗时长的订单","Tukey’s rule flags values above Q3 + 1.5 × IQR or below Q1 − 1.5 × IQR. For Hub C, Q1 = 14, Q3 = 31 and IQR = 17 minutes.":"Tukey 规则会标记出高于 Q3 + 1.5 × IQR 或低于 Q1 − 1.5 × IQR 的值。对 Hub C 来说，Q1 = 14，Q3 = 31，IQR = 17 分钟。","Compute the fences, then use the explorer to count Hub C orders above the upper fence.":"先算出围栏，再用数据浏览器数一数 Hub C 有多少订单高于上围栏。","<p>Hub C’s fences are −11.5 and 56.5 minutes. No order falls below −11.5. Above 56.5 sit 100 orders at 60 minutes and 29 at 124 minutes: 129 flags, 3.9% of Hub C’s valid orders.</p>\n          <p>Keep the computed −11.5. Zero is a physical limit on time, not a replacement for the rule.</p>":"<p>Hub C 的围栏是 −11.5 分钟和 56.5 分钟。没有订单低于 −11.5。高于 56.5 的有 100 个 60 分钟的订单和 29 个 124 分钟的订单：共 129 个标记，占 Hub C 有效订单的 3.9%。</p>\n          <p>保留算出来的 −11.5。零是时间的物理下限，不能拿来替代这条规则。</p>","upper fence = 31 + 1.5 × 17 = {{uf}} minutes":"上围栏 = 31 + 1.5 × 17 = {{uf}} 分钟","lower fence = 14 − 1.5 × 17 = {{lf}} minutes":"下围栏 = 14 − 1.5 × 17 = {{lf}} 分钟","Hub C orders above the upper fence = {{n}}":"Hub C 高于上围栏的订单数 = {{n}}","1.5 × 17 = 25.5, and 31 + 25.5 = 56.5.":"1.5 × 17 = 25.5，而 31 + 25.5 = 56.5。","Upper fence":"上围栏","14 − 25.5 = −11.5. Keep the negative value; it just means no low flags.":"14 − 25.5 = −11.5。保留这个负值，它只说明低端没有标记。","Lower fence":"下围栏","Hub C values above 56.5 are 60 and 124 minutes. Filter Hub C with each value: 100 + 29.":"Hub C 高于 56.5 的值是 60 分钟和 124 分钟。筛选 Hub C，再分别按这两个值筛选：100 + 29。","Flagged Hub C orders":"Hub C 被标记的订单","Hub C fence 56.5 min: 129 orders flagged; longest 124 min":"Hub C 围栏 56.5 分钟：129 个订单被标记；最长 124 分钟","A flag is a question":"标记是一个问题","The 129 flagged Hub C orders make the box plot look messy. A teammate has some ideas.":"Hub C 被标记的 129 个订单让箱线图看起来很乱。一位队友提了几个想法。","What should Metro do with the 129 flagged orders?":"Metro 应该怎样处理这 129 个被标记的订单？","<p>A Tukey flag marks an observation to inspect. It does not prove an error, and it does not prove a breach. Check the source timestamps, routes and contract terms for the 129 orders, report how much they move the mean, and keep them in the record.</p>":"<p>Tukey 标记只是指出一个需要检查的观测值。它不能证明有错误，也不能证明违约。核对这 129 个订单的原始时间戳、路线和合同条款，报告它们让均值移动了多少，并把它们留在记录中。</p>","Keep them, label them, and check each against source records and the contract.":"保留它们，加上标注，并逐一对照原始记录和合同核对。","Delete them so the chart looks cleaner.":"删掉它们，让图表看起来更整洁。","They are recorded deliveries. Deleting real delays hides the very problem the VP asked about.":"它们是真实记录下来的配送。删掉真实的延误，恰恰掩盖了 VP 想了解的问题。","Fine the carrier once for each flagged order.":"每有一个被标记的订单，就对承运商罚款一次。","A Tukey flag is a statistical label, not a contract breach. Check the agreed terms first.":"Tukey 标记是统计上的标签，不是合同违约。先查看双方约定的条款。","Replace them with the median, 22 minutes.":"用中位数 22 分钟替换它们。","That invents data and shrinks the tail. Keep the recorded values.":"这等于编造数据，还会让尾部缩短。保留记录下来的值。","Whose fence is it?":"这是谁的围栏？","With its own quartiles, Hub A’s fence is 36.5 minutes and flags 829 orders, all at 47.5 minutes. Hub C’s own fence is 56.5 and flags 129.":"按各自的四分位数计算，Hub A 的围栏是 36.5 分钟，标记出 829 个订单，全都是 47.5 分钟。Hub C 自己的围栏是 56.5，标记出 129 个。","Does Hub A have the bigger outlier problem?":"Hub A 的离群值问题更大吗？","<p>A fence is relative: Q3 + 1.5 × IQR for that group. Hub A’s middle half is tight (IQR 7), so its fence sits at 36.5 minutes and every 47.5-minute order is flagged. Hub C’s wider IQR (17) puts its fence at 56.5.</p>\n          <p>So flag counts are not comparable across groups. Compare the minutes: Hub A’s longest valid order is 47.5 minutes, Hub C’s is 124. On one shared all-hubs fence of 49 minutes, all 829 flagged orders are at Hub C.</p>":"<p>围栏是相对的：它是该组的 Q3 + 1.5 × IQR。Hub A 中间一半很集中（IQR 7），所以它的围栏在 36.5 分钟，每个 47.5 分钟的订单都被标记出来。Hub C 的 IQR 更宽（17），围栏就落在 56.5。</p>\n          <p>所以不同组之间的标记数不能直接比较。要比较分钟数：Hub A 最长的有效订单是 47.5 分钟，Hub C 是 124 分钟。如果所有枢纽共用一个 49 分钟的围栏，被标记的 829 个订单全都在 Hub C。</p>","No. Each fence measures distance from its own hub’s middle; compare minutes too.":"不是。每个围栏衡量的是离本枢纽中间部分的距离，还要比较分钟数。","Yes. 829 flags is more than 129 flags.":"是的。829 个标记比 129 个多。","Hub A’s narrow IQR makes a tight fence. Its flagged orders take 47.5 minutes; Hub C’s take 60 to 124.":"Hub A 的 IQR 窄，围栏就紧。它被标记的订单用时 47.5 分钟，而 Hub C 的用时 60 到 124 分钟。","No. One of the two counts must be a formula error.":"不是。两个计数中一定有一个是公式错误。","Both counts are correct. They use different quartiles, so they answer different questions.":"两个计数都对。它们用的是不同的四分位数，所以回答的是不同的问题。","Use whichever fence gives the count that supports the penalty.":"哪个围栏得出的计数支持处罚，就用哪个。","Choosing the rule after seeing the result is moving the goalposts. State the rule first.":"看到结果再选规则，就是在临时改标准。先说明规则。","Name your quartile rule":"说明你的四分位数规则","For Hub A, QUARTILE.EXC gives Q1 = 19 and Q3 = 26, an IQR of 7. QUARTILE.INC gives 20.5 and 24, an IQR of 3.5.":"对 Hub A，QUARTILE.EXC 得出 Q1 = 19，Q3 = 26，IQR 为 7。QUARTILE.INC 得出 20.5 和 24，IQR 为 3.5。","A colleague reports Hub A’s IQR as 3.5. What is the best response?":"一位同事报告 Hub A 的 IQR 是 3.5。最好怎样回应？","<p>Quartile methods differ when the cut falls between blocks of tied values. Hub A has 830 orders at 19 minutes and 1,659 at 22, so the INC position lands halfway between 19 and 22. Hub C’s quartiles are 14 and 31 under both rules.</p>\n          <p>State the rule in the report and use it in every tool: Excel EXC, SPSS HAVERAGE, Python and R. SPSS box plots use Tukey hinges, which can differ again.</p>":"<p>当分界点落在成块的相同值之间时，不同的四分位数方法结果会不同。Hub A 有 830 个订单是 19 分钟，1,659 个是 22 分钟，所以 INC 的位置正好落在 19 和 22 的中间。Hub C 的四分位数在两种规则下都是 14 和 31。</p>\n          <p>在报告里说明规则，并在每个工具中都使用它：Excel EXC、SPSS HAVERAGE、Python 和 R。SPSS 箱线图使用 Tukey 铰链（hinges），结果可能又不一样。</p>","Both follow a rule. Use the lab’s EXC rule everywhere and name it.":"两者都遵循某种规则。所有地方都用实验课的 EXC 规则，并写明它。","Their 3.5 is simply wrong; 7 is the true IQR.":"他们的 3.5 就是错的，7 才是真正的 IQR。","INC is a valid convention. It is wrong here only because the lab declared EXC.":"INC 是一种有效的约定。它在这里不对，只是因为实验课规定了 EXC。","Average the two results and report 5.25.":"把两个结果取平均，报告 5.25。","Averaging two conventions creates a number no tool reproduces.":"把两种约定取平均，得到的数字没有任何工具能复现。","Pick whichever IQR makes Hub C look worse.":"哪个 IQR 让 Hub C 看起来更差，就选哪个。","Choosing a method for its result biases the report. Declare the method first.":"按结果挑方法会让报告产生偏差。先声明方法。","Where should the axis start?":"坐标轴应该从哪里开始？","Mean latency is 27.6 minutes at Hubs A and B and 29.9 at Hub C. Drag the axis start and watch the bars.":"Hub A 和 Hub B 的履约时长均值是 27.6 分钟，Hub C 是 29.9 分钟。拖动坐标轴起点，观察条形的变化。","An analyst starts the axis at 27 minutes. What does the VP see?":"一位分析师让坐标轴从 27 分钟开始。VP 会看到什么？","<p>Bars encode values by length from a shared zero. With the axis at 27, Hub C’s bar is 2.94 minutes tall and Hub A’s is 0.63, so C looks 4.7 times as long. With a zero baseline the ratio is 1.08.</p>\n          <p>Bars must start at zero. A dot plot can use a narrower range if the scale is clearly marked. For this decision, show the distribution anyway, because the means hide Hub C’s spread.</p>":"<p>条形图用从共同零点起算的长度来表示数值。坐标轴从 27 开始时，Hub C 的条形高 2.94 分钟，Hub A 的只有 0.63，所以 C 看起来有 A 的 4.7 倍长。用零基线时，这个比值是 1.08。</p>\n          <p>条形图必须从零开始。点图可以用更窄的范围，只要刻度标得清楚。对这个决策来说，无论如何都要展示分布，因为均值掩盖了 Hub C 的离散程度。</p>","Hub C’s bar looks over four times as tall, though its mean is 8% higher.":"Hub C 的条形看起来有四倍多高，而它的均值只高出 8%。","An honest close-up: small differences deserve a zoom.":"诚实的特写：小差异值得放大来看。","Bar length encodes the value from zero. Cutting the axis breaks that, so the picture overstates the gap.":"条形长度表示从零算起的数值。截断坐标轴就破坏了这一点，所以图会夸大差距。","The same picture as with a zero baseline.":"和用零基线时看到的一样。","Drag to 27 and compare: the drawn ratio jumps from 1.08 to about 4.7.":"拖到 27 再比较：画出来的比值从 1.08 跳到约 4.7。","Nothing changes, because the bars are labeled.":"没有变化，因为条形上有标签。","Readers judge bar length before they read labels. The shape sends the message.":"读者先判断条形长度，然后才读标签。传递信息的是形状。","Stacked or unstacked?":"堆叠还是非堆叠？","Layout 1 has a Hub column and a Latency_Minutes column, one row per order. Layout 2 has three columns: Hub_A_Latency, Hub_B_Latency and Hub_C_Latency.":"布局 1 有一个 Hub 列和一个 Latency_Minutes 列，每个订单一行。布局 2 有三列：Hub_A_Latency、Hub_B_Latency 和 Hub_C_Latency。","Which layout lets one filtered formula serve every hub, as in Lab Part D?":"哪种布局能让一个带筛选的公式适用于所有枢纽，就像 Lab Part D 那样？","<p>Stacked data keeps group membership in a column. Lab Part D filters <code>Orders[Hub]=$A7</code> and fills down to every hub, and SPSS can split the file by Hub. Unstacked data stores the group in the column name, so every hub needs its own formula, and unequal counts leave ragged columns.</p>":"<p>堆叠（长格式）数据把组别放在一列里。Lab Part D 按 <code>Orders[Hub]=$A7</code> 筛选，再向下填充到每个枢纽，SPSS 也可以按 Hub 拆分文件。非堆叠（宽格式）数据把组别存在列名里，所以每个枢纽都要单独写公式，而且各组数量不同会让列长短不齐。</p>","Layout 1, stacked: the hub is a value you can filter on.":"布局 1，堆叠：枢纽是一个可以用来筛选的值。","Layout 2, unstacked: each hub already has its own column.":"布局 2，非堆叠：每个枢纽已经有自己的列。","Then each hub needs its own formula, and a new hub means a new column. A stacked table just gains rows.":"那样每个枢纽都需要自己的公式，新增一个枢纽就要新增一列。堆叠的表只需增加行。","Either one; layout never affects formulas or SPSS.":"哪个都行，布局从不影响公式或 SPSS。","Excel FILTER and SPSS split-file both need one grouping column. Layout matters.":"Excel 的 FILTER 和 SPSS 的拆分文件（split-file）都需要一个分组列。布局很重要。","Make the totals agree":"让总数对得上","Before any chart goes to the VP, the counts must reconcile. A mismatch means a filter or a formula is wrong.":"任何图表交给 VP 之前，计数都必须对得上。对不上就说明某个筛选或公式出错了。","Complete the check.":"完成核对。","<p>The three hub counts add to 9,958, and 9,958 + 42 = 10,000. If a tool shows 10,000 valid latencies, the 999 codes leaked in. If it shows fewer than 9,958, a filter dropped real orders.</p>\n          <p>Save these totals with the formulas and the code rule, so another analyst can repeat the result.</p>":"<p>三个枢纽的计数加起来是 9,958，而 9,958 + 42 = 10,000。如果某个工具显示有 10,000 个有效履约时长，说明 999 代码混入了。如果显示少于 9,958，说明某个筛选漏掉了真实订单。</p>\n          <p>把这些总数和公式、代码规则一起保存，这样其他分析师也能重现结果。</p>","valid orders = 3,319 + 3,319 + 3,320 = {{valid}}":"有效订单 = 3,319 + 3,319 + 3,320 = {{valid}}","coded rows = 10,000 − valid orders = {{codes}}":"带代码的行 = 10,000 − 有效订单 = {{codes}}","coded share of the file = {{share}} %":"带代码的行占文件的比例 = {{share}} %","Valid orders":"有效订单","10,000 − 9,958 = 42, which matches your count of 999 codes.":"10,000 − 9,958 = 42，与你数出的 999 代码个数一致。","Coded rows":"带代码的行","42 ÷ 10,000 = 0.0042, which is 0.42%.":"42 ÷ 10,000 = 0.0042，也就是 0.42%。","Coded share in percent":"带代码的行占比（百分比）","3,319 + 3,319 + 3,320 = 9,958 valid; + 42 coded = 10,000":"3,319 + 3,319 + 3,320 = 9,958 个有效；+ 42 个带代码 = 10,000","Observation, limit, recommendation":"观察、局限、建议","A good memo keeps three kinds of sentence apart.":"一份好的备忘录会把三类句子分开。","Drag each sentence to its role. One sentence does not belong.":"把每个句子拖到对应的角色。有一个句子不属于任何角色。","<p>An observation reports these records. A limit says what they cannot establish. A recommendation states an action given both. Keeping them apart stops a descriptive gap from turning into a blame claim.</p>\n          <p>Route mix, demand, weather, handoffs and recording practice could all contribute to Hub C’s spread.</p>":"<p>观察报告这些记录显示了什么。局限说明它们无法证实什么。建议在兼顾这两者的基础上提出行动。把三者分开，就能防止一个描述性的差距变成归咎于谁的论断。</p>\n          <p>路线构成、需求、天气、交接环节和记录方式都可能造成 Hub C 的离散。</p>","Hold one cycle and audit Hub C’s 129 flagged orders against the contract.":"暂缓一个周期，对照合同审核 Hub C 被标记的 129 个订单。","Hub C’s carrier caused the long delays.":"Hub C 的承运商造成了长时间延误。","All three hubs have a 22-minute median; Hub C’s IQR is 17, not 7.":"三个枢纽的中位数都是 22 分钟；Hub C 的 IQR 是 17，不是 7。","These records cannot show that Hub C’s carrier caused the delays.":"这些记录无法证明是 Hub C 的承运商造成了延误。","Observation<br><small>what the records show</small>":"观察<br><small>记录显示了什么</small>","Limit<br><small>what they cannot show</small>":"局限<br><small>记录无法说明什么</small>","Recommendation<br><small>what to do next</small>":"建议<br><small>下一步做什么</small>","That is a causal claim. Descriptive summaries show an association between hub and latency, not its cause.":"这是因果论断。描述性汇总只显示枢纽与履约时长之间的关联，不显示原因。","Make the call":"做出判断","You are the analyst. The VP wants one recommendation for the carrier review.":"你是分析师。VP 想要你为承运商审查给出一条建议。","What does the evidence support?":"证据支持什么？","<p>The records support a clear observation: the same typical time at every hub, far less consistency at Hub C, and a tail of 129 orders above its fence. They do not show the cause. A penalty now risks blaming the carrier for route mix, demand or recording issues.</p>\n          <p>Holding one cycle has a cost too: customers may keep facing delays, so Metro keeps supporting them during the audit. If the audit confirms a breach of the agreed terms, a penalty then rests on evidence.</p>":"<p>这些记录支持一个清楚的观察：每个枢纽的典型用时相同，Hub C 的稳定性差得多，还有一条由 129 个高于围栏的订单构成的尾部。记录没有显示原因。现在就处罚，可能会把路线构成、需求或记录问题归咎于承运商。</p>\n          <p>暂缓一个周期也有代价：客户可能继续遇到延误，所以 Metro 在审核期间要继续为他们提供支持。如果审核证实违反了约定条款，那时的处罚就有证据支撑。</p>","Hold one cycle: audit Hub C’s long orders; penalize only on a verified breach.":"暂缓一个周期：审核 Hub C 耗时长的订单；只有核实违约后才处罚。","Penalize now: Hub C’s wider IQR proves the carrier is at fault.":"立即处罚：Hub C 更宽的 IQR 证明承运商有过错。","The IQR describes spread. It cannot say who or what caused it.":"IQR 描述的是离散程度。它无法说明是谁或什么造成的。","Close the review: every hub has the same 22-minute median.":"结束审查：每个枢纽的中位数都是 22 分钟。","Equal medians hide Hub C’s wider spread and its 129 long orders. Customers still feel those delays.":"相同的中位数掩盖了 Hub C 更大的离散程度和那 129 个耗时长的订单。客户仍然能感受到这些延误。","Penalize now: 129 orders sit beyond the Tukey fence.":"立即处罚：有 129 个订单超出了 Tukey 围栏。","A Tukey flag is a statistical label, not a contract breach. Check the terms and the records first.":"Tukey 标记是统计上的标签，不是合同违约。先查看条款和记录。","Hold one cycle and audit; penalize only on a verified breach":"暂缓一个周期并审核；只有核实违约后才处罚","Your evidence bench":"你的证据工作台","Screen the codes before you count. Pair the median with the IQR and the mean with the SD. A flag or a gap is a question, not a verdict.":"先筛查代码，再计数。中位数搭配 IQR，均值搭配标准差（SD）。标记或空隙是一个问题，不是结论。","Pick a hub and move the controls. Every number comes from the lab file’s valid orders.":"选一个枢纽，调整控件。每个数字都来自实验文件中的有效订单。","Open this page from the class site to see the dataset.":"请从课程网站打开此页面以查看数据集。","Total":"合计","minutes":"分钟","Hub C valid orders by latency, with running totals":"按履约时长排列的 Hub C 有效订单及累计数","Minutes":"分钟","Orders":"订单数","Running total":"累计数","Dot plot of ten Hub C orders with one draggable order":"Hub C 十个订单的点图，其中一个订单可拖动","latency (minutes)":"履约时长（分钟）","draft rule: mean at most 30":"规则草案：均值不超过 30","999 code, off the scale":"999 代码，超出刻度","median":"中位数","mean":"均值","Longest order":"最长订单","min":"分钟","Mean":"均值","SD":"SD","Draft rule":"规则草案","Within 30":"不超过 30","Over 30":"超过 30","Longest order, minutes":"最长订单（分钟）","Make it the 999 code":"改成 999 代码","Histogram of latency":"履约时长直方图","latency (minutes), bins start at 0":"履约时长（分钟），组从 0 开始","orders":"订单数","Side-by-side box plots of valid latency for Hubs A, B and C":"Hub A、Hub B 和 Hub C 有效履约时长的并排箱线图","Box: Q1 to Q3":"箱子：Q1 到 Q3","Beyond the hub’s own fence":"超出本枢纽自己的围栏","Bar chart of mean latency by hub with an adjustable axis start":"各枢纽履约时长均值的条形图，坐标轴起点可调","mean latency (minutes)":"履约时长均值（分钟）","Axis starts at":"坐标轴起点","Hub C bar ÷ Hub A bar, as drawn":"图中 Hub C 条形 ÷ Hub A 条形","Hub C mean ÷ Hub A mean":"Hub C 均值 ÷ Hub A 均值","Hub C orders by latency with a draggable SLA threshold":"按履约时长排列的 Hub C 订单，SLA 阈值可拖动","Threshold":"阈值","Orders at or below":"不超过阈值的订单","Share":"占比","SLA threshold, minutes":"SLA 阈值（分钟）","Histogram of Hub C latency with adjustable bin width":"Hub C 履约时长直方图，组距可调","Bin width":"组距","Bins":"组数","Empty bins between 60 and 124 min":"60 到 124 分钟之间的空组","Gap before the 124-minute orders":"124 分钟订单之前的空隙","Visible":"可见","Hidden":"已隐藏","Records screened; codes left out of latency only":"记录已筛查；代码只从履约时长中剔除","9,958 valid of 10,000":"10,000 个中有 9,958 个有效","A typical order takes longer at Hub C":"在 Hub C，典型订单用时更长","median 22 at all three":"三个枢纽的中位数都是 22","Hub C is less consistent":"Hub C 稳定性较差","IQR 17 vs 7":"IQR 17 对 7","Hub C has a long upper tail":"Hub C 有一条长长的上尾","129 orders above 56.5 min; max 124":"129 个订单高于 56.5 分钟；最大值 124","The records show who caused the delays":"记录显示了是谁造成了延误","descriptive only":"仅为描述性","What the evidence shows":"证据显示了什么","Shown":"已显示","Not shown":"未显示","Right call.":"判断正确。","Right call. Your gut call at the start was “{call}”. Now you can back your answer with evidence.":"判断正确。你一开始的直觉判断是“{call}”。现在你可以用证据支持你的答案了。","All hubs":"所有枢纽","Count the 999 codes as minutes (a leak)":"把 999 代码当作分钟数计算（混入）","Histogram of latency for the chosen hub":"所选枢纽的履约时长直方图","Flagged":"被标记","At or below threshold":"不超过阈值","The 999 codes sit far off this chart, but they still pull the mean and SD.":"999 代码远在这张图之外，但它们仍会拉动均值和标准差（SD）。","Green bins: every order meets the threshold. Amber: none do. Violet: some do.":"绿色的组：每个订单都达到阈值。橙色：没有一个达到。紫色：部分达到。","SLA threshold":"SLA 阈值","Lesson complete":"课程完成","You earned {pts} points: {firsts} first-try answers across {graded} questions.":"你获得了 {pts} 分：{graded} 道题中有 {firsts} 道一次答对。","Your evidence file stays in the case panel. Next, open the LAB01 checkpoints page to check your workbook cells.":"你的证据文件会保留在案例面板中。接下来，打开 LAB01 检查点页面，核对你的工作簿单元格。","Exactly: (217 + 83) / 10 = 30.0. One more minute breaks the rule.":"完全正确：(217 + 83) / 10 = 30.0。再多一分钟就违反规则了。","Still within 30, but the order could take a few more minutes. Find the highest value.":"仍然不超过 30，但这个订单还可以再多几分钟。找出最大的值。","The mean is over 30. Bring the longest order down.":"均值超过 30 了。把最长的订单往下调。","Yes: 50 minutes covers 96.1% of Hub C’s orders, and 49 covers only 75.0%.":"对：50 分钟覆盖了 Hub C 96.1% 的订单，而 49 分钟只覆盖 75.0%。","Fewer than 95% of Hub C’s orders meet that threshold. Raise it.":"Hub C 达到这个阈值的订单不到 95%。把它调高。","At least 95% meet it, but a lower threshold does too. Find the smallest one.":"至少 95% 达到了，但更低的阈值也可以。找出最小的那个。","Right. At 42 minutes the 60- and 124-minute orders land in neighboring bins.":"对。组距为 42 分钟时，60 分钟和 124 分钟的订单落进相邻的组。","There is still an empty bin before the 124-minute orders. Keep widening.":"124 分钟订单之前仍有一个空组。继续调宽。","The gap is hidden here, but it disappeared at a narrower width. Find the first width that hides it.":"这里空隙被隐藏了，但在更窄的组距时它就已经消失了。找出第一个能隐藏它的组距。"},"es":{"Should Metro Penalize Hub C?":"¿Debería Metro penalizar a Hub C?","GC1015 · Session 3 · Data quality, distributions, descriptive evidence":"GC1015 · Sesión 3 · Calidad de datos, distribuciones, evidencia descriptiva","Finish":"Terminar","Evidence so far":"Evidencia hasta ahora","Data quality and missingness":"Calidad de datos y valores faltantes","Center, spread and shape":"Centro, dispersión y forma","Visual evidence and outliers":"Evidencia visual y valores atípicos","Case file: Metro E-Commerce Logistics":"Expediente del caso: Metro E-Commerce Logistics","Fictional delivery company with three hubs. File: <code>orders_story.csv</code>, 10,000 rows, one row per recorded order. Latency is fulfillment time in minutes.":"Empresa de entregas ficticia con tres hubs. Archivo: <code>orders_story.csv</code>, 10,000 filas, una fila por cada pedido registrado. La latencia es el tiempo de cumplimiento en minutos.","Column":"Columna","Meaning":"Significado","Missing code":"Código de valor faltante","OrderID":"OrderID","Order identifier":"Identificador del pedido","none":"ninguno","CustomerID":"CustomerID","Customer identifier":"Identificador del cliente","OrderTier":"OrderTier","1 Standard, 2 Priority, 3 Premium":"1 Standard, 2 Priority, 3 Premium","Hub":"Hub","Hub A, Hub B or Hub C":"Hub A, Hub B o Hub C","Age_Years":"Age_Years","Customer age in years":"Edad del cliente en años","Latency_Minutes":"Latency_Minutes","Fulfillment time in minutes":"Tiempo de cumplimiento en minutos","Decision: penalize the Hub C carrier now, or hold one reporting cycle and investigate?":"Decisión: ¿penalizar ahora al transportista de Hub C, o esperar un ciclo de reporte e investigar?","Quartiles and percentiles use Excel’s exclusive rule (QUARTILE.EXC), as in LAB01.":"Los cuartiles y percentiles usan la regla exclusiva de Excel (QUARTILE.EXC), como en LAB01.","The Toolkit reader’s worked examples use a smaller practice case, Cedar Lane Repair. Same methods, different numbers.":"Los ejemplos resueltos del lector del Toolkit usan un caso de práctica más pequeño, Cedar Lane Repair. Mismos métodos, números distintos.","Grain":"Granularidad","Screen 2":"Pantalla 2","Scales":"Escalas","Missing-value codes":"Códigos de valor faltante","Hub C center":"Centro de Hub C","If codes leak":"Si se cuelan códigos","Spread by hub":"Dispersión por hub","SLA threshold (P95)":"Umbral del SLA (P95)","Tukey flags":"Señales de Tukey","Reconciled totals":"Totales conciliados","Recommendation":"Recomendación","Should Metro penalize Hub C?":"¿Debería Metro penalizar a Hub C?","Your gut call, before any numbers: what should Metro do?":"Tu intuición, antes de ver cualquier número: ¿qué debería hacer Metro?","Metro E-Commerce Logistics, a fictional company, ships online orders through three hubs: A, B and C.":"Metro E-Commerce Logistics, una empresa ficticia, envía pedidos en línea a través de tres hubs: A, B y C.","Customers report delays. The VP of Supply Chain is thinking about a penalty for the carrier at Hub C. You have the order file: 10,000 rows.":"Los clientes reportan retrasos. El vicepresidente de Cadena de Suministro está pensando en una penalización para el transportista de Hub C. Tienes el archivo de pedidos: 10,000 filas.","Noted. We will test your call against the evidence at the end.":"Anotado. Al final pondremos a prueba tu decisión con la evidencia.","Penalize the Hub C carrier now":"Penalizar ahora al transportista de Hub C","Hold one cycle and investigate first":"Esperar un ciclo e investigar primero","I need more information":"Necesito más información","One row, one what?":"Una fila, ¿un qué?","The file has 10,000 rows, and every OrderID is different. CustomerID C0001 appears on four rows, and so does every other customer.":"El archivo tiene 10,000 filas, y cada OrderID es distinto. El CustomerID C0001 aparece en cuatro filas, y lo mismo pasa con cada uno de los demás clientes.","A teammate wants to delete repeated customers before counting orders. What do you say?":"Un compañero de equipo quiere eliminar los clientes repetidos antes de contar los pedidos. ¿Qué le dices?","<p>Grain is what one row records. Here it is one order: OrderID is unique on all 10,000 rows. The 2,500 customers each placed four orders.</p>\n          <p>A repeated OrderID would need a source check. A repeated CustomerID is normal. Count at the grain the decision needs, and the latency question is about orders.</p>":"<p>La granularidad es lo que registra una fila. Aquí es un pedido: OrderID es único en las 10,000 filas. Cada uno de los 2,500 clientes hizo cuatro pedidos.</p>\n          <p>Un OrderID repetido requeriría revisar la fuente. Un CustomerID repetido es normal. Cuenta con la granularidad que necesita la decisión, y la pregunta sobre la latencia trata de pedidos.</p>","Keep every row. One row is one order, and customers can order again.":"Conserva todas las filas. Una fila es un pedido, y los clientes pueden volver a pedir.","Delete the repeats so each customer counts once.":"Elimina los repetidos para que cada cliente cuente una sola vez.","That changes the grain from orders to customers. It would throw away 7,500 real orders.":"Eso cambia la granularidad de pedidos a clientes. Descartaría 7,500 pedidos reales.","Delete repeats only when the hub is also the same.":"Elimina los repetidos solo cuando el hub también es el mismo.","A repeat customer at the same hub is still a separate order with its own OrderID.":"Un cliente que repite en el mismo hub sigue siendo un pedido aparte, con su propio OrderID.","Average the CustomerID codes to check for errors.":"Promedia los códigos de CustomerID para buscar errores.","IDs are labels. An average of labels has no meaning.":"Los ID son etiquetas. Un promedio de etiquetas no tiene sentido.","One row = one order: 10,000 orders from 2,500 customers":"Una fila = un pedido: 10,000 pedidos de 2,500 clientes","Which arithmetic is allowed?":"¿Qué aritmética está permitida?","A number in a cell is not always an amount. OrderTier stores 1, 2 or 3 for Standard, Priority and Premium.":"Un número en una celda no siempre es una cantidad. OrderTier guarda 1, 2 o 3 para Standard, Priority y Premium.","Drag one valid summary to each column. Two tiles do not belong anywhere.":"Arrastra un resumen válido a cada columna. Dos fichas no van en ninguna parte.","<p>The scale decides the arithmetic. OrderID and CustomerID are labels: count them, never average them. Hub is nominal: counts, shares and the mode. OrderTier is ordinal: frequencies and the median tier work, but a mean of the codes assumes equal steps that nobody measured.</p>\n          <p>Latency is a ratio measure in minutes with a true zero, so means, SDs and ratios are allowed.</p>":"<p>La escala decide la aritmética. OrderID y CustomerID son etiquetas: cuéntalas, nunca las promedies. Hub es nominal: conteos, proporciones y la moda. OrderTier es ordinal: las frecuencias y el nivel mediano funcionan, pero una media de los códigos supone pasos iguales que nadie midió.</p>\n          <p>La latencia es una medida de razón en minutos con un cero verdadero, así que se permiten medias, desviaciones estándar (SD) y razones.</p>","Mean, median and SD in minutes":"Media, mediana y SD en minutos","Mean tier code: 2.0":"Media del código de nivel: 2.0","Count rows and check each ID is unique":"Cuenta las filas y verifica que cada ID sea único","Tier frequencies and the median tier":"Frecuencias de nivel y el nivel mediano","Average OrderID number":"Número promedio de OrderID","Order count and share for each hub":"Conteo y proporción de pedidos por hub","OrderID<br><small>identifier</small>":"OrderID<br><small>identificador</small>","Hub<br><small>nominal category</small>":"Hub<br><small>categoría nominal</small>","OrderTier<br><small>ordinal rank</small>":"OrderTier<br><small>rango ordinal</small>","Latency_Minutes<br><small>ratio measure</small>":"Latency_Minutes<br><small>medida de razón</small>","Tier codes show rank only. The step from Standard to Priority need not equal the step from Priority to Premium, so a mean of the codes is not admissible.":"Los códigos de nivel solo muestran el orden. El paso de Standard a Priority no tiene por qué ser igual al paso de Priority a Premium, así que una media de los códigos no es admisible.","An ID only tells rows apart. Averaging IDs counts nothing and measures nothing.":"Un ID solo distingue una fila de otra. Promediar ID no cuenta nada ni mide nada.","Hubs have no natural order, so a median hub means nothing. Use counts and shares for Hub.":"Los hubs no tienen un orden natural, así que un hub mediano no significa nada. Usa conteos y proporciones para Hub.","Tier: ordinal, no mean. Latency: ratio, in minutes.":"Nivel: ordinal, sin media. Latencia: de razón, en minutos.","Find the hidden missing values":"Encuentra los valores faltantes ocultos","The file has no blank cells. The data dictionary says missing values hide as codes: Age_Years = -1 and Latency_Minutes = 999.":"El archivo no tiene celdas en blanco. El diccionario de datos dice que los valores faltantes se esconden como códigos: Age_Years = -1 y Latency_Minutes = 999.","Use the filters to count the coded rows.":"Usa los filtros para contar las filas codificadas.","<p>42 rows carry -1 for age and 999 for latency: the same 42 rows, 0.42% of the file. They are codes, not a 999-minute delivery or a customer aged -1.</p>\n          <p>Keep the rows in the source. Exclude a code only from its own variable, so latency summaries use 9,958 valid orders. Excel: <code>=COUNTIF(Orders[Latency_Minutes],999)</code>. A <code>COUNTBLANK</code> would return 0 here, because nothing is blank.</p>":"<p>42 filas tienen -1 en la edad y 999 en la latencia: las mismas 42 filas, el 0.42% del archivo. Son códigos, no una entrega de 999 minutos ni un cliente de -1 años.</p>\n          <p>Conserva las filas en la fuente. Excluye un código solo de su propia variable, así que los resúmenes de latencia usan 9,958 pedidos válidos. Excel: <code>=COUNTIF(Orders[Latency_Minutes],999)</code>. Un <code>COUNTBLANK</code> devolvería 0 aquí, porque nada está en blanco.</p>","rows with Age_Years = -1: {{age}}":"filas con Age_Years = -1: {{age}}","rows with Latency_Minutes = 999: {{lat}}":"filas con Latency_Minutes = 999: {{lat}}","rows with both codes at once: {{both}}":"filas con ambos códigos a la vez: {{both}}","valid latency records = 10,000 − coded rows = {{valid}}":"registros de latencia válidos = 10,000 − filas codificadas = {{valid}}","Set Age_Years to -1 and read the row count.":"Pon Age_Years en -1 y lee el conteo de filas.","Rows with age code -1":"Filas con código de edad -1","Set Age_Years back to (Any), then set Latency_Minutes to 999.0.":"Regresa Age_Years a (Any) y luego pon Latency_Minutes en 999.0.","Rows with latency code 999":"Filas con código de latencia 999","Set both filters at the same time. The count does not drop, so the codes sit on the same rows.":"Activa ambos filtros al mismo tiempo. El conteo no baja, así que los códigos están en las mismas filas.","Rows with both codes":"Filas con ambos códigos","10,000 rows minus the 42 latency codes.":"10,000 filas menos los 42 códigos de latencia.","Valid latency records":"Registros de latencia válidos","42 rows coded -1 and 999 (0.42%); 9,958 valid latencies":"42 filas con códigos -1 y 999 (0.42%); 9,958 latencias válidas","Where do the codes fall?":"¿Dónde caen los códigos?","Missing values can bias a summary if they cluster in one group. Check whether the 999 codes favor one hub.":"Los valores faltantes pueden sesgar un resumen si se concentran en un grupo. Revisa si los códigos 999 se concentran más en un hub.","Set Latency_Minutes to 999.0, then try each hub. What do you find?":"Pon Latency_Minutes en 999.0 y luego prueba cada hub. ¿Qué encuentras?","<p>Each hub has 14 coded rows, and so does each tier. The codes do not cluster, and they touch 0.42% of rows. With under 2% coded and no group pattern, leaving them out of latency summaries is reasonable, if you document it.</p>\n          <p>The file cannot prove the codes are random. If the longest deliveries were the ones not logged, the codes would hide exactly the delays you care about. Ask the data owner how a 999 gets written.</p>":"<p>Cada hub tiene 14 filas codificadas, y cada nivel también. Los códigos no se concentran y afectan al 0.42% de las filas. Con menos del 2% codificado y sin un patrón por grupo, es razonable dejarlos fuera de los resúmenes de latencia, si lo documentas.</p>\n          <p>El archivo no puede probar que los códigos sean aleatorios. Si las entregas más largas fueran las que no se registraron, los códigos ocultarían justo los retrasos que te importan. Pregúntale al responsable de los datos cómo se llega a escribir un 999.</p>","Each hub has 14 codes, so missing latency does not favor one hub.":"Cada hub tiene 14 códigos, así que la latencia faltante no se concentra en un hub.","Hub C has most of the codes, so it hides its delays.":"Hub C tiene la mayoría de los códigos, así que oculta sus retrasos.","Filter Hub C with 999.0. It has 14, the same as Hubs A and B.":"Filtra Hub C con 999.0. Tiene 14, igual que Hub A y Hub B.","The even split proves the codes are missing completely at random.":"El reparto parejo prueba que los códigos faltan completamente al azar.","An even split is a good sign, not proof. The codes could still depend on the unseen latency.":"Un reparto parejo es un buen indicio, no una prueba. Los códigos aún podrían depender de la latencia que no se ve.","Too much is missing to use this file.":"Falta demasiado para usar este archivo.","42 of 10,000 rows is 0.42%. That is small, and it is spread evenly.":"42 de 10,000 filas es el 0.42%. Es poco, y está repartido de forma pareja.","Why is a value missing?":"¿Por qué falta un valor?","The reason a value is missing matters more than the count. Three standard labels describe the reason.":"La razón por la que falta un valor importa más que el conteo. Tres etiquetas estándar describen la razón.","Drag each Metro scenario to its label. One tile does not belong.":"Arrastra cada escenario de Metro a su etiqueta. Una ficha no va en ninguna.","<p><b>MCAR:</b> missingness is unrelated to anything, so the remaining values still represent the whole, just with fewer of them.</p>\n          <p><b>MAR:</b> a recorded column, such as hub, explains the gap. You can compare or adjust within that column.</p>\n          <p><b>MNAR:</b> the missing value itself drives the gap. If long deliveries go unlogged, the median and the tail both look better than reality, and no formula on the observed rows can fix that.</p>":"<p><b>MCAR:</b> la falta de datos no se relaciona con nada, así que los valores restantes siguen representando al total, solo que son menos.</p>\n          <p><b>MAR:</b> una columna registrada, como el hub, explica el hueco. Puedes comparar o ajustar dentro de esa columna.</p>\n          <p><b>MNAR:</b> el propio valor faltante causa el hueco. Si las entregas largas no se registran, la mediana y la cola se ven mejor que la realidad, y ninguna fórmula sobre las filas observadas puede corregirlo.</p>","Drivers skip logging their longest deliveries":"Los conductores no registran sus entregas más largas","A recorded 124-minute delivery":"Una entrega registrada de 124 minutos","A scanner glitch drops times at random moments":"Una falla del escáner pierde tiempos en momentos al azar","One hub’s older app never records customer age":"La app antigua de un hub nunca registra la edad del cliente","MCAR<br><small>missing completely at random</small>":"MCAR<br><small>faltante completamente al azar</small>","MAR<br><small>explained by another recorded column</small>":"MAR<br><small>explicado por otra columna registrada</small>","MNAR<br><small>depends on the missing value itself</small>":"MNAR<br><small>depende del propio valor faltante</small>","A 124-minute time was recorded. It is an unusual value, not a missing one.":"Se registró un tiempo de 124 minutos. Es un valor inusual, no un valor faltante.","Long deliveries go missing more often, so it is not random. The unseen time drives it: MNAR.":"Las entregas largas faltan más a menudo, así que no es al azar. El tiempo que no se ve lo causa: MNAR.","No recorded column explains it. The unseen time itself drives the gap: MNAR.":"Ninguna columna registrada lo explica. El propio tiempo que no se ve causa el hueco: MNAR.","It is not random: the hub, which you can see, explains it. That is MAR.":"No es al azar: el hub, que sí puedes ver, lo explica. Eso es MAR.","The hub column explains the gap, and you can see the hub. That is MAR.":"La columna del hub explica el hueco, y puedes ver el hub. Eso es MAR.","No column explains a random glitch. Missingness unrelated to anything is MCAR.":"Ninguna columna explica una falla al azar. La falta de datos que no se relaciona con nada es MCAR.","A random glitch does not depend on how long the delivery took. That is MCAR.":"Una falla al azar no depende de cuánto tardó la entrega. Eso es MCAR.","One code, one column":"Un código, una columna","Suppose next month’s file has an order with Age_Years = -1 and a recorded latency of 31 minutes.":"Supón que el archivo del próximo mes tiene un pedido con Age_Years = -1 y una latencia registrada de 31 minutos.","Does this order belong in the latency summary?":"¿Este pedido debe entrar en el resumen de latencia?","<p>A code makes one variable missing for that row. The row stays in the file, and its other valid values still count. In this month’s file the 42 coded rows carry both codes, but the rule is still written per column.</p>\n          <p>Deleting every incomplete row can bias a summary if those rows differ from the rest.</p>":"<p>Un código hace que falte una variable en esa fila. La fila se queda en el archivo, y sus otros valores válidos siguen contando. En el archivo de este mes, las 42 filas codificadas tienen ambos códigos, pero la regla se sigue escribiendo por columna.</p>\n          <p>Eliminar todas las filas incompletas puede sesgar un resumen si esas filas son distintas del resto.</p>","Yes. The -1 makes only the age missing; the 31 minutes is valid.":"Sí. El -1 solo hace que falte la edad; los 31 minutos son válidos.","No. Drop any row that has a code anywhere.":"No. Descarta cualquier fila que tenga un código en cualquier parte.","That throws away a valid latency and shrinks the denominator. Apply each code only to its own column.":"Eso descarta una latencia válida y reduce el denominador. Aplica cada código solo a su propia columna.","Yes, and count the customer’s age as 0.":"Sí, y cuenta la edad del cliente como 0.","An unknown age is not zero. Leave it missing for age analysis.":"Una edad desconocida no es cero. Déjala como faltante para el análisis de edad.","No. Replace its latency with the mean.":"No. Reemplaza su latencia con la media.","The 31 minutes was recorded. Nothing needs replacing.":"Los 31 minutos se registraron. No hay nada que reemplazar.","The center of Hub C":"El centro de Hub C","Hub C has 3,320 valid orders. The table counts how many took each time, with a running total.":"Hub C tiene 3,320 pedidos válidos. La tabla cuenta cuántos pedidos tardaron cada tiempo, con un total acumulado.","Fill in the mean and the median.":"Completa la media y la mediana.","<p>The mean is 29.94 minutes and the median is 22. The mean sits 7.94 minutes higher because a few long orders, at 60 and 124 minutes, add many minutes to the sum but do not move the middle position.</p>\n          <p>Excel: <code>AVERAGE</code> and <code>MEDIAN</code> on the filtered Hub C latencies, as in Take Home 1, cells B10 and B11.</p>":"<p>La media es 29.94 minutos y la mediana es 22. La media está 7.94 minutos más arriba porque unos pocos pedidos largos, de 60 y 124 minutos, suman muchos minutos al total pero no mueven la posición central.</p>\n          <p>Excel: <code>AVERAGE</code> y <code>MEDIAN</code> sobre las latencias filtradas de Hub C, como en Take Home 1, celdas B10 y B11.</p>","mean = 99,391 / 3,320 = {{mean}} minutes":"media = 99,391 / 3,320 = {{mean}} minutos","median = average of the 1,660th and 1,661st orders = {{med}} minutes":"mediana = promedio de los pedidos 1,660.º y 1,661.º = {{med}} minutos","mean − median = {{gap}} minutes":"media − mediana = {{gap}} minutos","Hub C mean"

span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mi mathvariant=\"normal\">/</mi><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">3/6</annotation></semantics></math></span> unreminded orders were on time. This is directly countable.</li><li><b>Inference:</b> Whether a similar gap holds for all future eligible orders is unknown. The selected extract cannot establish it.</li><li><b>Assumption:</b> The recorded “On time” and “Reminder sent” fields follow the operational definitions and contain no unexamined missing cases. That assumption still needs verification.</li><li><b>Recommendation:</b> Do not scale reminders from this table alone. Ask the data owner to audit timestamps, excluded orders, and mode-specific denominators; then plan a limited comparison with guardrail monitoring.</li></ul>\n<p>The ethical boundary is practical: use order-level data with minimal identifiers, restrict access, and avoid presenting staff-selected reminders as proof of staff performance or customer behavior. Later sessions provide sampling uncertainty, A/B guardrails, association analysis, and model diagnostics. None should be smuggled into today’s descriptive result.</p>\n<p><b>Failure mode:</b> A recommendation can be appropriately cautious yet still fail if nobody owns its next step. Here the operations manager can request the audit, while the data owner must document definitions and exclusions.</p>\n<p><b>Try it — ungraded.</b> Label this statement: “All eligible orders next month will show the same 33.3-point gap.”</p>\n<p><b>Explained answer:</b> It is an unsupported <b>inference</b>, not an observation. The observed gap describes only the displayed orders; the extract’s selection and group imbalance make that forecast especially fragile.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>Start with a stakeholder’s decision and the action the analysis might enable.</li><li>Write a KPI contract: eligible population, time window, grain, numerator, denominator, exclusions, and units.</li><li>Pair an improvement target with a defined guardrail; label invented thresholds as provisional.</li><li>One order per row does not mean one row per customer or per message.</li><li>Check measurement rules and provenance before trusting a correct-looking calculation.</li><li>Compare groups using their own denominators; show counts beside percentages.</li><li>Describe an observed gap as a gap, not as causal impact or a forecast.</li><li>Validate software output against a hand count and source-quality checks.</li><li>Use a chart whose title, scale, labels, table, and accessibility support its claim.</li><li>End with a bounded recommendation, the unresolved limits, an owner, and a next action.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<ul><li><b>Basket:</b> Dollar value of one order; $32 for order 101.</li><li><b>Categorical variable:</b> A label defining a group; “Pickup” is a mode category.</li><li><b>Convenience extract:</b> Records selected because they were readily available; the first 12 completed orders here.</li><li><b>Denominator:</b> The eligible cases beneath a rate; six reminder-Yes orders in that group’s rate.</li><li><b>Grain:</b> What one row represents; one completed order in this table.</li><li><b>Guardrail:</b> A measure that watches for possible harm while pursuing a target; the share with prep over 40 minutes.</li><li><b>Inference:</b> A conclusion extending beyond directly observed records; a claim about next month would be one.</li><li><b>KPI:</b> A defined measure for monitoring a decision; the on-time handoff rate.</li><li><b>Key:</b> A field intended to identify a case uniquely; Order ID at order grain.</li><li><b>Numerator:</b> Cases meeting the rate’s condition; eight on-time orders overall.</li><li><b>Observation:</b> A recorded case or a directly supported description of cases; order 101 is a case.</li><li><b>Operational definition:</b> The rule turning a concept into a field; “at or before recorded promise time” defines on time here.</li><li><b>Population:</b> All cases the decision is meant to address; next month’s eligible orders.</li><li><b>Provenance:</b> The record of data origins and transformations; which system supplied handoff time and how “On time” was derived.</li><li><b>Quantitative variable:</b> A measured amount with meaningful numeric differences; prep minutes.</li><li><b>Target:</b> A proposed performance threshold; at least 80% on time in this fictional case.</li><li><b>Unit of analysis:</b> The entity counted or compared; an order, not a message.</li><li><b>Variable:</b> A characteristic that can differ between cases; reminder status differs between orders.</li></ul>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>Heckert, N. A., &amp; Filliben, J. J. (2003). <i>NIST/SEMATECH e-handbook of statistical methods: Chapter 1, exploratory data analysis</i>. National Institute of Standards and Technology. <a href=\"https://www.nist.gov/publications/nistsematech-e-handbook-statistical-methods-chapter-1-exploratory-data-analysis\" target=\"_blank\" rel=\"noopener\">https://www.nist.gov/publications/nistsematech-e-handbook-statistical-methods-chapter-1-exploratory-data-analysis</a></p>\n<p>IBM. (n.d.-a). <i>CELLS subcommand (CROSSTABS command): IBM SPSS Statistics 31.0.0</i>. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=crosstabs-cells-subcommand-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=crosstabs-cells-subcommand-command</a></p>\n<p>IBM. (n.d.-b). <i>Overview (MEANS command): IBM SPSS Statistics 31.0.0</i>. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=means-overview-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=means-overview-command</a></p>\n<p>Microsoft. (n.d.-a). <i>SUMIFS function</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/functions/sumifs-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/functions/sumifs-function</a></p>\n<p>Microsoft. (n.d.-b). <i>Ways to count values in a worksheet</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/ways-to-count-values-in-a-worksheet\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/ways-to-count-values-in-a-worksheet</a></p>\n<p>OpenStax. (2023). <i>1.2 Data, sampling, and variation in data and sampling</i>. In <i>Introductory business statistics 2e</i>. <a href=\"https://openstax.org/books/introductory-business-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/introductory-business-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling</a></p>\n<p>Penn State Department of Statistics. (n.d.-a). <i>1 Collecting data</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson01\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson01</a></p>\n<p>Penn State Department of Statistics. (n.d.-b). <i>2 Describing data, part 1</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson02\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson02</a></p>\n<p>World Wide Web Consortium. (n.d.). <i>Complex images</i>. Web Accessibility Initiative. <a href=\"https://www.w3.org/WAI/tutorials/images/complex/\" target=\"_blank\" rel=\"noopener\">https://www.w3.org/WAI/tutorials/images/complex/</a></p>"}]};
globalThis.LESSON_I18N = {"zh":{"Is MetroMeal Slipping?":"MetroMeal 在下滑吗？","GC1015 · Session 2 · KPIs, variables, grain and chart critique":"GC1015 · 第 2 课 · KPI、变量、粒度与图表评析","Finish":"完成","Evidence so far":"目前的证据","Variable types and scales":"变量类型与测量尺度","Grain and unit of analysis":"粒度与分析单位","Chart critique":"图表评析","Case file: MetroMeal Delivery":"案例资料：MetroMeal Delivery","Fictional food-delivery company. One row per eligible completed delivery, August 3 to 30, 2026: 2,000 rows in <code>orders_story.csv</code>.":"一家虚构的外卖配送公司。每行是一次符合条件的已完成配送，时间为 2026 年 8 月 3 日至 30 日：<code>orders_story.csv</code> 中共 2,000 行。","Decision: should the regional operations director investigate, and possibly adjust, weekend staffing before the next scheduling cycle?":"决策：区域运营总监是否应该在下一个排班周期之前调查周末人员配置，并可能做出调整？","Week of":"周起始日","Eligible":"符合条件","On time":"准时","Complaints":"投诉","Aug 3":"8 月 3 日","Aug 10":"8 月 10 日","Aug 17":"8 月 17 日","Aug 24":"8 月 24 日","KPI: on-time eligible deliveries ÷ eligible deliveries, each week. Target: at least 85%.":"KPI：每周准时的符合条件配送 ÷ 符合条件的配送。目标：至少 85%。","Guardrail: complaint rate no greater than 3%.":"护栏指标：投诉率不超过 3%。","Latest week, 108 late deliveries: mean 12.4 minutes late, median 7, 90th percentile 31.":"最近一周有 108 次延误配送：延误时长的均值为 12.4 分钟，中位数为 7 分钟，第 90 百分位数为 31 分钟。","Toolkit links explain each rule with a second fictional example, Mosaic Pantry. The rules are the same.":"工具包链接会用第二个虚构案例 Mosaic Pantry 来解释每条规则。规则是一样的。","KPI contract":"KPI 契约","Set on screen 2":"在第 2 屏设定","Variable types":"变量类型","Latest week KPI":"最近一周的 KPI","Complaint guardrail":"投诉护栏指标","Gap to target":"与目标的差距","Grain of the file":"文件的粒度","Mixed-grain risk":"混合粒度风险","Four-week rate":"四周合并比率","Honest chart":"诚实的图表","Chart title":"图表标题","Recommendation":"建议","Is weekend staffing the problem?":"问题出在周末人员配置吗？","Your gut call, before any checks: what should the director do?":"在做任何核查之前，先凭直觉判断：总监应该怎么做？","MetroMeal Delivery, a fictional food-delivery company, aims for at least 85% of deliveries on time. A dashboard chart now says “Delivery performance collapses.”":"MetroMeal Delivery 是一家虚构的外卖配送公司，目标是至少 85% 的配送准时送达。现在，仪表板上的一张图表写着“配送表现崩盘”。","Weekend staffing has been suggested as the reason. The regional operations director must decide what to do before the next scheduling cycle.":"有人认为原因是周末人员配置。区域运营总监必须在下一个排班周期之前决定怎么做。","Noted. You will test this call against checked evidence at the end.":"已记下。最后你会用核查过的证据来检验这个判断。","Change weekend staffing now":"立即调整周末人员配置","Leave staffing as it is":"人员配置保持不变","Investigate first, then decide":"先调查，再决定","Write the KPI contract":"写出 KPI 契约","Before any chart, you write down exactly what the weekly on-time KPI counts.":"在画任何图表之前，你要先写清楚每周准时 KPI 到底统计什么。","Drag each piece into its place. Two tiles do not belong.":"把每一块拖到它的位置。有两张卡片不属于这里。","<p>A KPI is a definition another analyst can reproduce. It names the population, the time window, the grain, the numerator and the denominator.</p>\n          <ul><li><b>Numerator:</b> on-time eligible deliveries in the week.</li>\n          <li><b>Denominator:</b> all eligible completed deliveries in the same week.</li>\n          <li><b>Target:</b> at least 85%, a management benchmark, not a statistical finding.</li>\n          <li><b>Guardrail:</b> complaint rate no greater than 3%, a harm to watch while chasing the target.</li></ul>":"<p>KPI 是一个其他分析师也能复现的定义。它要写明总体、时间窗口、粒度、分子和分母。</p><ul><li><b>分子：</b>该周准时的符合条件配送。</li><li><b>分母：</b>同一周所有符合条件的已完成配送。</li><li><b>目标：</b>至少 85%，这是管理层设定的基准，不是统计发现。</li><li><b>护栏指标：</b>投诉率不超过 3%，这是在追求目标时需要盯住的一种损害。</li></ul>","Deliveries made by weekend staff":"由周末员工完成的配送","Complaint rate no greater than 3%":"投诉率不超过 3%","On-time eligible deliveries in the week":"该周准时的符合条件配送","On-time rate of at least 85%":"准时率至少 85%","Item rows delivered on time":"准时送达的商品行","All eligible completed deliveries in the week":"该周所有符合条件的已完成配送","Numerator":"分子","Denominator":"分母","Target":"目标","Guardrail":"护栏指标","That filters by the suspected cause. The KPI covers every eligible completed delivery, weekday or weekend.":"这是按怀疑的原因做了筛选。KPI 涵盖每一次符合条件的已完成配送，不管是工作日还是周末。","Items are a different grain. The KPI counts each delivery once, however many items it holds.":"商品是另一种粒度。不管一次配送包含多少件商品，KPI 都只把这次配送算一次。","The numerator is the part that meets the condition: deliveries that were on time.":"分子是满足条件的那一部分：准时的配送。","The denominator is every eligible delivery in the same week, whether on time or late.":"分母是同一周每一次符合条件的配送，不论准时还是延误。","A target is the management benchmark for the KPI itself.":"目标是管理层为 KPI 本身设定的基准。","A guardrail watches a different outcome that must not get worse: complaints.":"护栏指标盯住的是另一个不能变差的结果：投诉。","On-time ÷ eligible deliveries, weekly; target ≥ 85%; complaints ≤ 3%":"准时 ÷ 符合条件的配送，按周计；目标 ≥ 85%；投诉 ≤ 3%","One row, many values":"一行，多个值","Here is one row of <code>orders_story.csv</code>, shown sideways: each line is one column of the file.":"这是 <code>orders_story.csv</code> 中的一行，横过来显示：每一行文字是文件中的一列。","In data terms, what is this row?":"用数据的语言来说，这一行是什么？","<p>A dataset puts <b>variables</b> in columns and <b>observations</b> in rows. This file has 16 variables and 2,000 observations.</p>\n          <p>Order 10482 is one late delivery: 54 minutes against a 45-minute promise, so 9 minutes late, with 3 items and a satisfaction code of 2.</p>":"<p>数据集把<b>变量</b>放在列中，把<b>观测</b>放在行中。这个文件有 16 个变量和 2,000 个观测。</p><p>订单 10482 是一次延误的配送：实际用时 54 分钟，而承诺是 45 分钟，所以延误了 9 分钟；包含 3 件商品，满意度代码为 2。</p>","One observation: one delivery, with a value for each variable":"一个观测：一次配送，每个变量都有一个值","One variable: the delivery called 10482":"一个变量：名为 10482 的那次配送","A variable is a column, such as region or item_count. A row holds one value of each column.":"变量是一列，比如 region 或 item_count。一行包含每一列的一个值。","A summary of all North region deliveries":"所有 North 区域配送的汇总","Nothing is added up here. It is one delivery that happened to be in the North region.":"这里没有把任何东西加总。它只是一次恰好发生在 North 区域的配送。","Two questions for every column":"每一列都要问两个问题","Excel stores all four of these columns as numbers. That does not make them all numerical.":"Excel 把这四列都存成数字。但这并不代表它们都是数值型变量。","Classify each variable twice: its data type, then its measurement scale. One tile is left over.":"给每个变量分类两次：先判断数据类型，再判断测量尺度。会剩下一张卡片。","<p>Data type and measurement scale are separate questions.</p>\n          <ul><li><b>order_id:</b> categorical, nominal. Its digits name a delivery.</li>\n          <li><b>satisfaction_category:</b> categorical, ordinal. 4 is above 2, but the gaps between codes are not promised to be equal.</li>\n          <li><b>item_count:</b> numerical, discrete, ratio. It counts items, and 0 would mean none.</li>\n          <li><b>delivery_minutes:</b> numerical, continuous, ratio. It measures time, so 54 minutes is twice 27.</li></ul>":"<p>数据类型和测量尺度是两个不同的问题。</p><ul><li><b>order_id：</b>分类型，定类。它的数字是给一次配送命名的。</li><li><b>satisfaction_category：</b>分类型，定序。4 高于 2，但不保证代码之间的间距相等。</li><li><b>item_count：</b>数值型，离散，定比。它计数商品件数，0 表示一件也没有。</li><li><b>delivery_minutes：</b>数值型，连续，定比。它测量时间，所以 54 分钟是 27 分钟的两倍。</li></ul>","Nominal":"定类","Categorical":"分类型","Ratio":"定比","Numerical, discrete":"数值型，离散","Interval":"定距","Ordinal":"定序","Numerical, continuous":"数值型，连续","Variable ↓   Question →":"变量 ↓   问题 →","order_id<br><small>10482</small>":"order_id<br><small>10482</small>","satisfaction_category<br><small>1 to 5</small>":"satisfaction_category<br><small>1 至 5</small>","item_count<br><small>1 or 3</small>":"item_count<br><small>1 或 3</small>","delivery_minutes<br><small>54.0</small>":"delivery_minutes<br><small>54.0</small>","Data type":"数据类型","Measurement scale":"测量尺度","Categorical fits labels and codes, such as order_id and satisfaction_category. Their digits do not measure an amount.":"分类型适用于标签和代码，比如 order_id 和 satisfaction_category。它们的数字并不测量数量。","Numerical, discrete fits counts. Ask: does this column count something, like items?":"数值型、离散适用于计数。问问自己：这一列是在数某样东西吗，比如商品件数？","Numerical, continuous fits measurements. Ask: is this column measured, like minutes?":"数值型、连续适用于测量值。问问自己：这一列是测量出来的吗，比如分钟数？","Nominal means labels with no order. order_id names a delivery and cannot be ranked.":"定类指没有顺序的标签。order_id 是给一次配送命名的，无法排序。","Ordinal means ordered categories. A satisfaction code of 4 is above 2, but the gaps may not be equal.":"定序指有顺序的类别。满意度代码 4 高于 2，但间距不一定相等。","Ratio means equal gaps and a true zero, so “twice as many” makes sense. That fits counts and minutes.":"定比指间距相等且有真正的零点，所以“两倍多”是有意义的。计数和分钟数都属于这一类。","Interval has equal gaps but no true zero, like calendar dates. None of these four columns is interval.":"定距的间距相等，但没有真正的零点，比如日历日期。这四列中没有一列是定距。","order_id nominal; satisfaction ordinal; item_count and minutes ratio":"order_id 定类；满意度定序；item_count 和分钟数定比","Four scales, four kinds of comparison":"四种尺度，四种比较","The scale tells you which comparisons make sense: same or different, more or less, how far apart, or how many times as much.":"尺度告诉你哪些比较有意义：相同还是不同，多还是少，相差多远，或者是几倍。","Drag one variable into each scale. One tile stays in the bank.":"把一个变量拖进每种尺度。会有一张卡片留在卡片库里。","<p><b>Nominal:</b> region and complaint_flag only say same or different. <b>Ordinal:</b> satisfaction adds order. <b>Interval:</b> completed_date adds equal gaps, so “6 days apart” works, but its zero is arbitrary. <b>Ratio:</b> late_minutes adds a true zero, so “twice as late” works.</p>\n          <p>Excel stores dates as serial numbers. That is a storage convention, not permission to average or multiply them.</p>":"<p><b>定类：</b>region 和 complaint_flag 只能说明相同或不同。<b>定序：</b>满意度增加了顺序。<b>定距：</b>completed_date 增加了相等的间距，所以“相隔 6 天”说得通，但它的零点是任意设定的。<b>定比：</b>late_minutes 增加了真正的零点，所以“延误时间是两倍”说得通。</p><p>Excel 把日期存成序列号。这只是一种存储惯例，并不代表可以对日期求平均或做乘法。</p>","late_minutes: 0 to 50.2":"late_minutes：0 至 50.2","region: Central, North, South, West":"region：Central, North, South, West","completed_date: 2026-08-24":"completed_date：2026-08-24","satisfaction_category: 1 to 5":"satisfaction_category：1 至 5","complaint_flag: 0 or 1":"complaint_flag：0 或 1","Nominal<br><small>labels, no order</small>":"定类<br><small>标签，无顺序</small>","Ordinal<br><small>ordered, gaps unknown</small>":"定序<br><small>有顺序，间距未知</small>","Interval<br><small>equal gaps, no true zero</small>":"定距<br><small>间距相等，无真正的零点</small>","Ratio<br><small>equal gaps, true zero</small>":"定比<br><small>间距相等，有真正的零点</small>","A date has equal one-day gaps, but its zero point is arbitrary. “Aug 24 is twice Aug 12” means nothing. That is interval.":"日期之间的间距都是相等的一天，但它的零点是任意设定的。“8 月 24 日是 8 月 12 日的两倍”毫无意义。这是定距。","0 late minutes means not late at all, a true zero. So 12 minutes is twice 6 minutes. That is ratio.":"延误 0 分钟就是完全没有延误，这是真正的零点。所以 12 分钟是 6 分钟的两倍。这是定比。","Codes 1 to 5 are ordered, but the step from 1 to 2 need not equal the step from 4 to 5. That is ordinal.":"代码 1 至 5 是有顺序的，但从 1 到 2 的一步不一定等于从 4 到 5 的一步。这是定序。","Region names are labels with no order. That is nominal.":"区域名称是没有顺序的标签。这是定类。","A 0 or 1 flag names two groups, complaint or no complaint. The codes are labels, so this is nominal.":"取值为 0 或 1 的标记把数据分成两组：有投诉或无投诉。这些代码只是标签，所以这是定类。","Excel will average anything":"Excel 什么都能求平均","For the latest week, <code>AVERAGE(satisfaction_category)</code> returns 3.54. For all rows, <code>AVERAGE(order_id)</code> returns 11000.5. Excel shows no error.":"对最近一周，<code>AVERAGE(satisfaction_category)</code> 返回 3.54。对所有行，<code>AVERAGE(order_id)</code> 返回 11000.5。Excel 不会报错。","Which statement is right?":"哪种说法是对的？","<p>Arithmetic must match the scale. An average of identifiers has no business meaning. An average of ordinal codes treats the gap from 1 to 2 as equal to the gap from 4 to 5.</p>\n          <p>If you report a mean rating, say so, and show how many deliveries fell in each category beside it.</p>":"<p>运算必须与尺度相匹配。标识符的平均值没有任何业务意义。定序代码的平均值会把 1 到 2 的间距当作与 4 到 5 的间距相等。</p><p>如果你要报告平均评分，就要说明这一点，并在旁边列出每个类别各有多少次配送。</p>","11000.5 means nothing. 3.54 needs its convention stated and category counts shown.":"11000.5 毫无意义。3.54 需要说明所用的惯例，并展示各类别的计数。","Both are valid means, because Excel returned no error.":"两者都是有效的均值，因为 Excel 没有报错。","Excel checks storage, not meaning. order_id is a name, so its average describes nothing.":"Excel 检查的是存储方式，而不是含义。order_id 是一个名称，所以它的平均值什么也描述不了。","Both are meaningless, so ratings can never be summarized.":"两者都没有意义，所以评分永远无法汇总。","Ratings can be summarized with a count for each category, or a mean whose convention you disclose. Identifiers cannot.":"评分可以用每个类别的计数来汇总，也可以用均值汇总，但要说明你采用的惯例。标识符则不能汇总。","3.54 sits on an equal-gap scale, like minutes.":"3.54 位于一个间距相等的尺度上，就像分钟数一样。","Ordinal codes do not promise equal gaps between 1, 2, 3, 4 and 5.":"定序代码并不保证 1、2、3、4 和 5 之间的间距相等。","Compute the weekly KPI":"计算每周 KPI","Week of August 24: 392 deliveries were on time and 108 were late. 14 deliveries had a complaint.":"8 月 24 日这一周：392 次配送准时，108 次延误。有 14 次配送收到了投诉。","Check the denominator first, then compute.":"先检查分母，再计算。","<p>Check the parts first: 392 + 108 = 500. Then 392 ÷ 500 = 0.784, or 78.4%. The gap is 78.4 − 85.0 = −6.6 percentage points.</p>\n          <p>Complaints: 14 ÷ 500 = 2.8%, inside the 3% guardrail. In Excel, keep the numerator and denominator in their own cells and divide them, so anyone can trace the rate.</p>":"<p>先检查各部分：392 + 108 = 500。然后 392 ÷ 500 = 0.784，即 78.4%。差距是 78.4 − 85.0 = −6.6 个百分点。</p><p>投诉：14 ÷ 500 = 2.8%，在 3% 的护栏指标之内。在 Excel 中，把分子和分母分别放在各自的单元格里再相除，这样任何人都能追溯这个比率。</p>","check: 392 + 108 = {{tot}} eligible deliveries":"核对：392 + 108 = {{tot}} 次符合条件的配送","on-time rate = 392 / 500 = {{rate}}":"准时率 = 392 / 500 = {{rate}}","gap to target = 78.4% − 85.0% = {{gap}} percentage points":"与目标的差距 = 78.4% − 85.0% = {{gap}} 个百分点","complaint rate = 14 / 500 = {{cr}}":"投诉率 = 14 / 500 = {{cr}}","On time plus late must give every eligible delivery: 392 + 108.":"准时加上延误，必须等于全部符合条件的配送：392 + 108。","Eligible deliveries":"符合条件的配送","392 ÷ 500 = 0.784, shown as 78.4%.":"392 ÷ 500 = 0.784，显示为 78.4%。","On-time rate":"准时率","Subtract the target from the rate: 78.4 − 85.0 = −6.6. It is negative because the rate is below target.":"用比率减去目标：78.4 − 85.0 = −6.6。结果是负数，因为比率低于目标。","Gap to target in percentage points":"与目标的差距（百分点）","14 ÷ 500 = 0.028, or 2.8%. Divide by all 500 eligible deliveries, not by the 392 on-time ones.":"14 ÷ 500 = 0.028，即 2.8%。要除以全部 500 次符合条件的配送，而不是 392 次准时配送。","Complaint rate":"投诉率","How close is the guardrail?":"离护栏指标的上限还有多远？","The guardrail says the complaint rate must be no greater than 3%. The latest week had 14 complaints in 500 deliveries.":"护栏指标规定投诉率不得超过 3%。最近一周 500 次配送中有 14 次投诉。","Drag the complaint count. What is the highest count that still meets the guardrail?":"拖动投诉次数。仍然满足护栏指标的最高次数是多少？","<p>3% of 500 is 15, so 15 complaints (3.0%) is the most the rule allows. 16 complaints would be 3.2%.</p>\n          <p>The latest week had 14, one below the line. The guardrail held, but with almost no room. Keep watching it while you investigate the on-time miss.</p>":"<p>500 的 3% 是 15，所以 15 次投诉（3.0%）是规则允许的最大值。16 次投诉就是 3.2%。</p><p>最近一周有 14 次，比上限少一次。护栏指标守住了，但几乎没有余地。在你调查准时率未达标的同时，要继续关注它。</p>","14 / 500 = 2.8%: within 3% (limit is 15 complaints)":"14 / 500 = 2.8%：在 3% 以内（上限是 15 次投诉）","Points or percent?":"百分点还是百分比？","A teammate drafts three sentences for the director about the latest week.":"一位队友为总监起草了三句关于最近一周的话。","Which sentence is wrong?":"哪句话是错的？","<p>Percentage points subtract two percentages: 85.0 − 78.4 = 6.6 points. Percent change divides by the starting value: 6.6 ÷ 85 ≈ 7.8%.</p>\n          <p>“6.6% below target” mixes the two. Write a target gap in percentage points, as the lab does in column F of <code>KPI_Build</code>.</p>":"<p>百分点是两个百分比相减：85.0 − 78.4 = 6.6 个百分点。百分比变化是除以起始值：6.6 ÷ 85 ≈ 7.8%。</p><p>“比目标低 6.6%”把两者混在一起了。写与目标的差距时要用百分点，就像实验中 <code>KPI_Build</code> 的 F 列那样。</p>","The rate was 6.6 percentage points below the target.":"该比率比目标低 6.6 个百分点。","That one is correct: 85.0 − 78.4 = 6.6 points.":"这句是对的：85.0 − 78.4 = 6.6 个百分点。","The rate was 6.6% below the target.":"该比率比目标低 6.6%。","Right. The gap is 6.6 percentage points. In relative terms the shortfall is about 7.8%.":"没错。差距是 6.6 个百分点。按相对值计算，缺口约为 7.8%。","The rate was about 7.8% below the target, in relative terms.":"按相对值计算，该比率比目标低约 7.8%。","That one is correct: 6.6 ÷ 85 ≈ 0.078, a 7.8% relative shortfall.":"这句是对的：6.6 ÷ 85 ≈ 0.078，即相对缺口为 7.8%。","−6.6 percentage points (about 7.8% relative)":"−6.6 个百分点（相对约 7.8%）","Which number answers which question?":"哪个数字回答哪个问题？","Among the 108 late deliveries in the latest week: mean 12.4 minutes late, median 7, 90th percentile 31.":"最近一周的 108 次延误配送中：延误时长的均值为 12.4 分钟，中位数为 7 分钟，第 90 百分位数为 31 分钟。","Drag the number that answers each question. One tile is left over.":"把能回答每个问题的数字拖过去。会剩下一张卡片。","<p>A count shows volume. A proportion shows performance against opportunities. A median describes the middle. A percentile describes position, here the tail of bad experiences.</p>\n          <p>The mean, 12.4, sits well above the median, 7, because a few very late deliveries pull it up. That is a prompt to look at the whole distribution in Session 3, not proof of a cause.</p>":"<p>计数显示的是量。比例显示的是相对于机会的表现。中位数描述的是中间位置。百分位数描述的是位置，这里指糟糕体验的尾部。</p><p>均值 12.4 远高于中位数 7，因为少数严重延误的配送把它拉高了。这提示你在第 3 课查看整个分布，但并不能证明某个原因。</p>","90th percentile: 31 minutes late":"第 90 百分位数：延误 31 分钟","78.4% of eligible deliveries on time":"78.4% 的符合条件配送准时","Mean: 12.4 minutes late":"均值：延误 12.4 分钟","392 on-time deliveries":"392 次准时配送","Median: 7 minutes late":"中位数：延误 7 分钟","How much on-time work got done?":"准时完成了多少工作量？","How did on-time work compare with all opportunities?":"准时完成的工作与所有机会相比如何？","How late is a typical late delivery?":"典型的延误配送会延误多久？","How late are the worst 10% of late deliveries?":"最差的 10% 延误配送会延误多久？","The mean uses every late value, so the 10 deliveries 50 or more minutes late pull it up to 12.4. For a typical late delivery, use the median.":"均值用到了每一个延误值，所以那 10 次延误 50 分钟或以上的配送把它拉高到 12.4。要描述典型的延误配送，请用中位数。","392 is a count. It shows the volume of on-time work, not performance against the 500 opportunities.":"392 是一个计数。它显示准时工作的量，而不是相对于 500 次机会的表现。","78.4% compares on-time deliveries with all eligible deliveries. It answers the performance question.":"78.4% 是把准时配送与所有符合条件的配送做比较。它回答的是表现的问题。","The median is the middle late delivery: at least half were 7 minutes late or less.":"中位数是位于中间的那次延误配送：至少一半的延误配送延误了 7 分钟或更少。","The 90th percentile describes the tail: about 90% of late deliveries were 31 minutes late or less.":"第 90 百分位数描述的是尾部：大约 90% 的延误配送延误了 31 分钟或更少。","Each row represents one…":"每一行代表一个……","Four rows from <code>orders_story.csv</code>. Look at which values repeat and which never do.":"这是 <code>orders_story.csv</code> 中的四行。看看哪些值会重复，哪些从不重复。","Complete the grain sentence for this file.":"补全这个文件的粒度句子。","<p>Grain is what one row means: here, one eligible completed delivery from August 3 to 30, 2026. order_id never repeats, so it is the key: 2,000 rows, 2,000 order IDs.</p>\n          <p>customer_id repeats because each customer has 2 deliveries. Test the grain before you count anything: if the sentence “each row is one…” has two possible endings, stop and check.</p>":"<p>粒度就是一行代表什么：这里是 2026 年 8 月 3 日至 30 日之间的一次符合条件的已完成配送。order_id 从不重复，所以它是键：2,000 行，2,000 个订单 ID。</p><p>customer_id 会重复，因为每位客户有 2 次配送。在计数之前先检验粒度：如果“每一行是一个……”这个句子有两种可能的结尾，就停下来检查。</p>","One eligible completed delivery, August 3 to 30, 2026":"一次符合条件的已完成配送，2026 年 8 月 3 日至 30 日","One customer":"一位客户","customer_id repeats: customer 5241 appears on two rows. Each customer has 2 deliveries in the file.":"customer_id 会重复：客户 5241 出现在两行中。文件中每位客户有 2 次配送。","One week":"一周","The file has 2,000 rows but only 4 weeks. A weekly table would have 4 rows.":"文件有 2,000 行，但只有 4 周。按周汇总的表只会有 4 行。","One item in an order":"订单中的一件商品","item_count is a column. A 3-item order is still a single row here.":"item_count 是一列。在这里，一个含 3 件商品的订单仍然只占一行。","One row = one eligible completed delivery (order_id is the key)":"一行 = 一次符合条件的已完成配送（order_id 是键）","Count the rows behind the KPI":"数一数 KPI 背后的行","This is the real lab file, 2,000 rows. Use the filters to count before you trust any formula.":"这是真实的实验文件，有 2,000 行。在相信任何公式之前，先用筛选器数一数。","Use the explorer to find the latest week’s counts.":"用数据浏览器找出最近一周的计数。","<p>The latest week has 500 delivery rows: 392 on time and 14 with a complaint. These counts are the numerator and denominator behind 78.4% and 2.8%.</p>\n          <p>A weekly summary table turns these 500 rows into one row. That one row can support weekly claims, but it can no longer show which deliveries were late.</p>":"<p>最近一周有 500 行配送记录：392 行准时，14 行有投诉。这些计数就是 78.4% 和 2.8% 背后的分子和分母。</p><p>按周汇总的表会把这 500 行变成一行。这一行可以支持关于每周的结论，但它再也无法显示哪些配送延误了。</p>","rows with week_start = 2026-08-24: {{n}}":"week_start = 2026-08-24 的行数：{{n}}","of those, on_time_kpi_flag = 1: {{on}}":"其中 on_time_kpi_flag = 1 的行数：{{on}}","of those 500, complaint_flag = 1: {{c}}":"在这 500 行中，complaint_flag = 1 的行数：{{c}}","Set week_start to 2026-08-24 and leave the other filters at (Any).":"把 week_start 设为 2026-08-24，其他筛选器保持 (Any)。","Rows in the latest week":"最近一周的行数","Keep week_start = 2026-08-24 and set on_time_kpi_flag to 1.":"保持 week_start = 2026-08-24，并把 on_time_kpi_flag 设为 1。","On-time rows in the latest week":"最近一周的准时行数","Set on_time_kpi_flag back to (Any), then complaint_flag to 1. If you see 47, week_start is not set.":"把 on_time_kpi_flag 改回 (Any)，再把 complaint_flag 设为 1。如果你看到 47，说明 week_start 没有设置。","Complaint rows in the latest week":"最近一周的投诉行数","Same data, four grains":"同样的数据，四种粒度","Each tile is one row from a different table built from the same deliveries.":"每张卡片都是一行，分别来自用同一批配送构建的不同表格。","Drag each row to the grain it represents. One tile does not fit any slot.":"把每一行拖到它所代表的粒度。有一张卡片不适合任何位置。","<p>The same deliveries can be stored at many grains: item, delivery, customer, day, week. Each grain supports different claims.</p>\n          <p>The KPI is defined per delivery and reported per week. A day row shows when lateness happened. A customer row shows who experienced it. None of them is “the” data; pick the grain that matches the decision.</p>":"<p>同一批配送可以按多种粒度存储：商品、配送、客户、天、周。每种粒度支持不同的结论。</p><p>KPI 按配送定义，按周报告。按天的一行显示延误发生在什么时候。按客户的一行显示是谁经历了延误。它们都不是“唯一正确”的数据；要选择与决策相匹配的粒度。</p>","Week of Aug 24: 500 eligible, 392 on time":"8 月 24 日这一周：500 次符合条件，392 次准时","Order 10482, item 2 of 3":"订单 10482，第 2 件商品（共 3 件）","Order 10482: North, 3 items, 54 minutes, late":"订单 10482：North，3 件商品，54 分钟，延误","Aug 29: 71 deliveries, 36 on time":"8 月 29 日：71 次配送，36 次准时","Customer 5241: 2 deliveries, 1 on time":"客户 5241：2 次配送，1 次准时","One delivery":"一次配送","One day":"一天","That row is one item inside an order: item grain. None of these slots needs it.":"这一行是订单中的一件商品：商品粒度。这些位置都不需要它。","This row describes a single delivery, order 10482.":"这一行描述的是单次配送，即订单 10482。","Customer 5241 has two deliveries, so this row summarizes more than one delivery.":"客户 5241 有两次配送，所以这一行汇总了不止一次配送。","Aug 29 covers 71 deliveries completed on one date.":"8 月 29 日这一行涵盖了在同一天完成的 71 次配送。","This row covers all 500 deliveries in one week.":"这一行涵盖了一周内的全部 500 次配送。","Same week, new unit":"同一周，换一种单位","A colleague reports 72.8% on time for the latest week. Your KPI says 78.4%. Switch the unit below.":"一位同事报告最近一周的准时率是 72.8%。你的 KPI 显示 78.4%。在下方切换单位看看。","Same week, same rows. Why does the customer view show 72.8%?":"同一周，同样的行。为什么客户视角显示 72.8%？","<p>Delivery grain: 392 of 500 deliveries were on time, 78.4%. Customer grain: 250 customers had deliveries that week, and 182 had every delivery on time, 72.8%.</p>\n          <p>Both are correct, and they answer different questions. The KPI contract counts deliveries, so the director’s number is 78.4%. A customer-level KPI would need its own written definition.</p>":"<p>配送粒度：500 次配送中有 392 次准时，即 78.4%。客户粒度：那一周有 250 位客户有配送，其中 182 位的每一次配送都准时，即 72.8%。</p><p>两个数字都对，它们回答的是不同的问题。KPI 契约统计的是配送，所以总监要看的数字是 78.4%。客户层面的 KPI 需要有自己的书面定义。</p>","It counts customers, and a customer is on time only if every delivery was.":"它统计的是客户，只有当一位客户的每一次配送都准时，这位客户才算准时。","It is a calculation error. The rate must be 78.4%.":"这是计算错误。比率一定是 78.4%。","Both numbers are correct. They answer different questions, because the unit counted changed.":"两个数字都对。它们回答的是不同的问题，因为计数的单位变了。","Customers are a sample of deliveries, so the rate is less precise.":"客户是配送的一个样本，所以这个比率不那么精确。","There is no sampling here. Each of the 250 customers had exactly 2 deliveries that week.":"这里没有抽样。那一周 250 位客户中，每位都正好有 2 次配送。","What a join does to the rows":"连接 (join) 会对行产生什么影响","An analyst joins the latest week’s deliveries to an item table, so each item gets its own row. Use the explorer: what is item_count for the late deliveries?":"一位分析师把最近一周的配送连接到一张商品表上，于是每件商品都有自己的一行。用数据浏览器看看：延误配送的 item_count 是多少？","Every late delivery has 3 items and every on-time delivery has 1. Fill in the joined table.":"每次延误配送都有 3 件商品，每次准时配送都有 1 件。请填写连接后的表。","<p>392 + 3 × 108 = 716 rows. Counting rows now gives 392 ÷ 716 = 54.7%, not 78.4%.</p>\n          <p>No delivery changed. Late deliveries simply got three times the weight. Before you compute a delivery-level rate, bring the items back to one row per delivery, then check that each order_id appears once.</p>":"<p>392 + 3 × 108 = 716 行。现在按行计数会得到 392 ÷ 716 = 54.7%，而不是 78.4%。</p><p>没有任何配送发生变化。只是延误的配送获得了三倍的权重。在计算配送层面的比率之前，先把商品汇总回每次配送一行，然后检查每个 order_id 只出现一次。</p>","joined rows = 392 × 1 + 108 × 3 = {{rows}}":"连接后的行数 = 392 × 1 + 108 × 3 = {{rows}}","“on-time rate” from joined rows = 392 / {{rows2}} = {{jr}}":"用连接后的行算出的“准时率” = 392 / {{rows2}} = {{jr}}","392 on-time deliveries keep 1 row each. 108 late deliveries get 3 rows each: 392 + 324.":"392 次准时配送各保留 1 行。108 次延误配送各变成 3 行：392 + 324。","Rows after the join":"连接后的行数","Use the joined row count you just found.":"用你刚刚算出的连接后行数。","Denominator from joined rows":"用连接后的行得到的分母","392 ÷ 716 ≈ 0.547, or 54.7%.":"392 ÷ 716 ≈ 0.547，即 54.7%。","Rate from joined rows":"用连接后的行得到的比率","Item join: 716 rows give 54.7% (wrong grain)":"商品连接：716 行得出 54.7%（粒度错误）","How many repeats flip the verdict?":"重复多少次会让结论翻转？","The week of Aug 10 beat the target: 438 of 500 deliveries on time, 87.6%. It had 62 late deliveries. Suppose a join repeats some late deliveries on 3 rows.":"8 月 10 日这一周超过了目标：500 次配送中有 438 次准时，即 87.6%。这一周有 62 次延误配送。假设一次连接让其中一些延误配送各重复成 3 行。","Drag the number of late deliveries repeated on 3 rows. What is the most that can be repeated before this good week looks like a miss?":"拖动被重复成 3 行的延误配送数量。在这个达标的一周看起来变成未达标之前，最多可以重复多少次配送？","<p>Each repeated late delivery adds 2 extra rows. With 7 repeated, the table has 514 rows and 438 ÷ 514 = 85.21%. With 8, it has 516 rows and 438 ÷ 516 = 84.88%, below target.</p>\n          <p>So 8 repeated deliveries out of 500 turn a week that beat the target into an apparent miss. In the real file all 62 late deliveries that week have 3 items, which would show 70.2%.</p>":"<p>每重复一次延误配送，就会多出 2 行。重复 7 次时，表中有 514 行，438 ÷ 514 = 85.21%。重复 8 次时，有 516 行，438 ÷ 516 = 84.88%，低于目标。</p><p>所以，500 次配送中只要有 8 次被重复，一个超过目标的周就会看起来像未达标。在真实文件中，那一周全部 62 次延误配送都有 3 件商品，结果会显示为 70.2%。</p>","Count first, then divide":"先计数，再相除","The director also wants the rate for all four weeks together. Each week had 500 eligible deliveries, 2,000 in total.":"总监还想要四周合计的比率。每周有 500 次符合条件的配送，总共 2,000 次。","Build the four-week rate from counts.":"用计数来构建四周比率。","<p>Add the counts first: 1,675 on-time deliveries out of 2,000. Then divide: 83.75%, which is 1.25 points below target.</p>\n          <p>Here the average of the four weekly rates is also 83.75%, but only because every week has 500 deliveries. With unequal weeks, averaging rates gives each week equal weight instead of each delivery. Count first, then divide.</p>":"<p>先把计数相加：2,000 次中有 1,675 次准时配送。然后相除：83.75%，比目标低 1.25 个百分点。</p><p>在这里，四个每周比率的平均值也是 83.75%，但这只是因为每周都正好有 500 次配送。如果各周的配送量不同，对比率求平均就会给每一周相同的权重，而不是给每一次配送相同的权重。先计数，再相除。</p>","on time, four weeks = 420 + 438 + 425 + 392 = {{on}}":"四周的准时次数 = 420 + 438 + 425 + 392 = {{on}}","four-week rate = on time / 2,000 = {{rate}}":"四周比率 = 准时次数 / 2,000 = {{rate}}","Add the four weekly on-time counts.":"把四周各自的准时次数相加。","Four-week on-time count":"四周准时次数","1,675 ÷ 2,000 = 0.8375, or 83.75%. Divide summed counts. Do not add the four rates, which gives 3.35.":"1,675 ÷ 2,000 = 0.8375，即 83.75%。要用加总后的计数相除。不要把四个比率相加，那样会得到 3.35。","Pool more weeks, lose the signal":"合并的周越多，信号越弱","Drag the window: it pools the latest weeks, counting back from Aug 24. Dots are read by position, so this scale can zoom in.":"拖动时间窗口：它从 8 月 24 日往回数，把最近的几周合并起来。圆点是按位置来读的，所以这个坐标轴可以放大显示。","The director asks how the latest week did. A colleague answers with the four-week rate, 83.75%. What is the problem?":"总监问最近一周表现如何。一位同事用四周比率 83.75% 来回答。问题出在哪里？","<p>The window is part of the grain. Latest week alone: 78.4%, 6.6 points below target. Last two weeks: 81.7%. All four weeks: 83.75%, only 1.25 points below.</p>\n          <p>The director’s decision is about the latest week, so report the weekly rate. Show the four-week figure only as labeled context.</p>":"<p>时间窗口是粒度的一部分。只看最近一周：78.4%，比目标低 6.6 个百分点。最近两周：81.7%。全部四周：83.75%，只低 1.25 个百分点。</p><p>总监的决策针对的是最近一周，所以要报告每周比率。四周的数字只能作为标注清楚的背景信息来展示。</p>","Pooling four weeks dilutes the latest week’s 6.6-point miss to 1.25 points.":"合并四周后，最近一周 6.6 个百分点的缺口被稀释成了 1.25 个百分点。","83.75% is miscalculated. You must average the four weekly rates.":"83.75% 算错了。你必须对四个每周比率求平均。","With equal denominators of 500, the average of rates also gives 83.75%. The number is right; the window is wrong for this question.":"分母都是 500 时，比率的平均值同样是 83.75%。数字没错；错的是对这个问题用了不合适的时间窗口。","Nothing. More weeks always give the better answer.":"没有问题。周数越多，答案总是越好。","More weeks answer a different question: the whole month, not the latest week.":"更多的周回答的是另一个问题：整个月的情况，而不是最近一周。","An exploratory lead":"一条探索性线索","Exploring further, you split the latest week by <code>weekend_flag</code> (1 = Saturday or Sunday).":"进一步探索时，你按 <code>weekend_flag</code>（1 = 周六或周日）把最近一周拆开来看。","Compare weekend and weekday on-time counts in the latest week. What can you honestly say?":"比较最近一周周末和工作日的准时次数。你能如实地说些什么？","<p>In the latest week, 72 of 142 weekend deliveries were on time (50.7%), against 320 of 358 on weekdays (89.4%). Weekend rates were lower in all four weeks.</p>\n          <p>But every late delivery in the file also had 3 items, and the file has no staffing records. Order size, staffing, traffic or something else could be behind the gap. This is an exploratory lead to check, not a cause.</p>":"<p>最近一周，142 次周末配送中有 72 次准时（50.7%），而工作日 358 次中有 320 次准时（89.4%）。四周里，每一周的周末比率都更低。</p><p>但文件中每一次延误配送也都有 3 件商品，而且文件里没有人员配置记录。订单大小、人员配置、交通或其他因素都可能造成这个差距。这是一条需要核查的探索性线索，而不是原因。</p>","Weekend deliveries were on time less often. These records cannot say why.":"周末配送准时的情况更少。这些记录无法说明原因。","Weekend understaffing caused the late deliveries.":"周末人手不足导致了延误配送。","The file has no staffing records. Also, every late delivery had 3 items: order size is another possible explanation.":"文件中没有人员配置记录。而且，每一次延误配送都有 3 件商品：订单大小是另一种可能的解释。","Weekend and weekday rates are about the same.":"周末和工作日的比率差不多。","Set weekend_flag = 1 and on_time_kpi_flag = 1: 72 of 142. Weekdays: 320 of 358.":"设置 weekend_flag = 1 和 on_time_kpi_flag = 1：142 次中有 72 次。工作日：358 次中有 320 次。","What is wrong with Chart A?":"图表 A 有什么问题？","This is Chart A from the dashboard, rebuilt from the real weekly rates. The numbers are right. The picture is not.":"这是仪表板上的图表 A，用真实的每周比率重新绘制。数字是对的，但画面不对。","Drag each defect to the problem it causes. One tile is not a defect.":"把每个缺陷拖到它造成的问题上。有一张卡片不是缺陷。","<p>Chart A shows correct numbers in a misleading way.</p>\n          <ul><li><b>Exaggeration:</b> 3D bars on a 75% start make a 9.2-point difference look huge.</li>\n          <li><b>Accessibility:</b> red and green alone fail many readers and grayscale prints.</li>\n          <li><b>Claim:</b> “collapses” is drama. One week missed the target by 6.6 points.</li>\n          <li><b>Base:</b> without n = 500, readers cannot tell what each rate is out of.</li></ul>":"<p>图表 A 用误导的方式展示了正确的数字。</p><ul><li><b>夸大：</b>从 75% 起始的 3D 柱形，让 9.2 个百分点的差异看起来非常大。</li><li><b>无障碍：</b>只靠红色和绿色，许多读者和灰度打印都无法区分。</li><li><b>说法：</b>“崩盘”是在渲染戏剧效果。实际上只有一周比目标低了 6.6 个百分点。</li><li><b>基数：</b>没有 n = 500，读者就无法知道每个比率的分母是多少。</li></ul>","Title: “Delivery performance collapses”":"标题：“配送表现崩盘”","Weeks shown in time order":"各周按时间顺序显示","3D bars on an axis that starts at 75%":"3D 柱形，坐标轴从 75% 开始","No weekly denominators (n = 500)":"没有每周的分母（n = 500）","Colour is the only status cue (red and green)":"颜色是唯一的状态提示（红色和绿色）","Exaggerates the size of the change":"夸大了变化的幅度","Shuts out some readers":"把部分读者排除在外","Claims more than the data show":"说法超出了数据所能显示的范围","Hides what each rate is out of":"隐藏了每个比率的分母","Time order is the natural order for weeks. That is a strength, not a defect.":"时间顺序是周的自然顺序。这是优点，不是缺陷。","A 75% start and 3D depth change how big the bars look. That is exaggeration.":"从 75% 起始和 3D 深度会改变柱形看起来的大小。这就是夸大。","Many readers cannot tell red from green, and grayscale prints lose colour. Colour alone shuts them out.":"许多读者分不清红色和绿色，灰度打印也会丢失颜色。只靠颜色会把他们排除在外。","“Collapses” is a claim. The data show one week that missed the target by 6.6 points.":"“崩盘”是一种说法。数据显示的是有一周比目标低了 6.6 个百分点。","Without n = 500, readers cannot see what each rate is out of.":"没有 n = 500，读者就看不出每个比率的分母是多少。","Measure the exaggeration":"量一量夸大的程度","Readers judge bars by height. On Chart A, every bar starts at the 75% line. The Aug 10 rate is 87.6% and the Aug 24 rate is 78.4%.":"读者根据高度来判断柱形。在图表 A 上，每根柱形都从 75% 这条线开始。8 月 10 日的比率是 87.6%，8 月 24 日的比率是 78.4%。","Compare the drawn heights with the real rates.":"把画出来的高度和真实比率做比较。","<p>Above the 75% line, the Aug 10 bar is 12.6 points tall and the Aug 24 bar is 3.4. So Chart A draws Aug 10 about 3.71 times as tall.</p>\n          <p>The real rates differ much less: 87.6 ÷ 78.4 ≈ 1.12. Chart A exaggerates the comparison about 3.3 times (3.71 ÷ 1.12).</p>":"<p>在 75% 这条线以上，8 月 10 日的柱形高 12.6 个百分点，8 月 24 日的柱形高 3.4。所以图表 A 把 8 月 10 日画得大约有 3.71 倍高。</p><p>真实比率的差别要小得多：87.6 ÷ 78.4 ≈ 1.12。图表 A 把这一比较夸大了大约 3.3 倍（3.71 ÷ 1.12）。</p>","drawn heights above 75%: Aug 10 = 87.6 − 75 = 12.6, Aug 24 = 78.4 − 75 = {{h}}":"75% 以上画出的高度：8 月 10 日 = 87.6 − 75 = 12.6，8 月 24 日 = 78.4 − 75 = {{h}}","on Chart A, Aug 10 looks {{r}} times as tall as Aug 24":"在图表 A 上，8 月 10 日看起来是 8 月 24 日的 {{r}} 倍高","real ratio of the rates: 87.6 / 78.4 = {{t}}":"两个比率的真实之比：87.6 / 78.4 = {{t}}","78.4 − 75 = 3.4 points of drawn height.":"画出的高度为 78.4 − 75 = 3.4 个百分点。","Aug 24 bar height above 75%":"8 月 24 日柱形在 75% 以上的高度","Drawn height ratio":"画出高度之比","87.6 ÷ 78.4 ≈ 1.12. The Aug 10 rate is only about 1.12 times the Aug 24 rate.":"87.6 ÷ 78.4 ≈ 1.12。8 月 10 日的比率只是 8 月 24 日比率的大约 1.12 倍。","Real ratio of the rates":"两个比率的真实之比","Repair the axis":"修复坐标轴","The handle sets where the vertical axis starts. It begins where Chart A does, at 75%. The readout compares drawn height with the real rates.":"这个手柄决定纵轴从哪里开始。它的起点和图表 A 一样，在 75%。读数会把画出的高度和真实比率做比较。","Drag the axis start until bar height tells the truth: Aug 10 should look only 1.117 times as tall as Aug 24.":"拖动坐标轴起点，直到柱形高度如实反映数据：8 月 10 日看起来应该只有 8 月 24 日的 1.117 倍高。","<p>Readers judge bars by height. Height matches the value only when bars start at 0%. At 0% the Aug 10 bar is 1.117 times as tall as Aug 24, the same as the real ratio. At 1% it is already 1.119, and at 75% it is 3.706.</p>\n          <p>The repaired chart starts at 0%, labels each bar with its rate and n = 500, draws the 85% target, and marks the latest week with a dashed outline, not colour alone.</p>":"<p>读者根据高度来判断柱形。只有当柱形从 0% 开始时，高度才与数值相符。在 0% 时，8 月 10 日的柱形是 8 月 24 日的 1.117 倍高，与真实比率相同。在 1% 时已经是 1.119 倍，在 75% 时则是 3.706 倍。</p><p>修复后的图表从 0% 开始，给每根柱形标上比率和 n = 500，画出 85% 的目标线，并用虚线轮廓标出最近一周，而不是只靠颜色。</p>","Bars from 0%: ×1.12, not ×3.71; labels, n = 500, target, latest week marked":"柱形从 0% 开始：×1.12，而不是 ×3.71；有标签、n = 500、目标线，并标出最近一周","Can a line zoom in?":"折线图可以放大吗？","An analyst reader wants to see the week-to-week movement more closely. Switch between the three versions.":"一位擅长分析的读者想更仔细地看每周之间的变化。在三个版本之间切换看看。","Is a line chart with a 70% to 90% axis acceptable here?":"在这里，坐标轴为 70% 到 90% 的折线图可以接受吗？","<p>Bars encode value by length, so they need a zero start. A line encodes value by position and slope, so a zoomed range is acceptable when it is labeled and the purpose is week-to-week movement.</p>\n          <p>Still label all four points and the target, say the window is only four weeks, and do not call it a stable trend. Compare “Bars, 70% to 90%”: the same zoom on bars exaggerates again.</p>":"<p>柱形用长度来编码数值，所以需要从零开始。折线用位置和斜率来编码数值，所以只要标注清楚、目的是展示每周之间的变化，放大的范围是可以接受的。</p><p>不过仍要标出全部四个点和目标，说明时间窗口只有四周，也不要把它称为稳定的趋势。对比一下“柱形图，70% 至 90%”：在柱形上做同样的放大，又会造成夸大。</p>","Yes, if the axis range is labeled and the short four-week window is stated.":"可以，只要标注了坐标轴范围，并说明这只是四周的短时间窗口。","No. Every chart must start at zero.":"不可以。每张图表都必须从零开始。","Zero is the rule for bars, because readers judge bar length. A line is read by position and slope.":"从零开始是柱形图的规则，因为读者会判断柱形的长度。折线是按位置和斜率来读的。","Yes, and the line proves a stable downward trend.":"可以，而且这条折线证明了稳定的下降趋势。","Four points cannot establish a stable trend. The rate went up, then down, then down.":"四个点无法确立稳定的趋势。比率先上升，然后下降，再下降。","Yes, as long as red and green show the status.":"可以，只要用红色和绿色显示状态就行。","Colour alone shuts out many readers. Add labels or a shape, as the dashed latest-week marker does.":"只靠颜色会把许多读者排除在外。要加上标签或形状，就像最近一周的虚线标记那样。","Write the title":"写出标题","Your repaired chart is ready. It needs a title the director can read without you in the room.":"你修复后的图表已经准备好了。它需要一个标题，让总监在你不在场时也能看懂。","Which title should go on the chart?":"图表上应该用哪个标题？","<p>A good explanatory title states the checked takeaway: the week, the rate and the gap to target. Every number traces to a cell: 392 ÷ 500 = 78.4%, and 78.4 − 85.0 = −6.6.</p>\n          <p>Remove cause words, drama words and forecasts unless separate evidence supports them.</p>":"<p>好的解释性标题会说明经过核查的要点：哪一周、比率是多少、与目标差多少。每个数字都能追溯到一个单元格：392 ÷ 500 = 78.4%，78.4 − 85.0 = −6.6。</p><p>除非有单独的证据支持，否则要去掉表示因果的词、渲染戏剧效果的词和预测。</p>","Week of August 24 on-time delivery was 78.4%, 6.6 percentage points below target":"8 月 24 日这一周的准时配送率为 78.4%，比目标低 6.6 个百分点","Delivery performance collapses":"配送表现崩盘","“Collapses” is drama the data do not show. The three earlier weeks ran 84.0% to 87.6%.":"“崩盘”是数据并未显示的戏剧化说法。之前三周的比率在 84.0% 到 87.6% 之间。","Weekend understaffing caused a 6.6% drop in on-time delivery":"周末人手不足导致准时配送下降了 6.6%","Two problems: the records cannot show a cause, and the gap is 6.6 points, not 6.6%.":"有两个问题：这些记录无法显示原因，而且差距是 6.6 个百分点，不是 6.6%。","On-time delivery is in steady decline and will miss again":"准时配送正在持续下滑，而且还会再次未达标","Four weekly points do not show a stable trend, and they cannot forecast the next week.":"四个每周数据点显示不出稳定的趋势，也无法预测下一周。","Week of Aug 24: 78.4%, 6.6 points below target":"8 月 24 日这一周：78.4%，比目标低 6.6 个百分点","Label each sentence":"给每句话贴标签","Your draft story has four sentences. Each one carries a different level of certainty.":"你的故事草稿有四句话。每一句的确定程度都不同。","Drag each sentence to its label.":"把每句话拖到它的标签上。","<p><b>Observation:</b> directly countable in the file. <b>Inference:</b> a claim beyond the observed rows, such as next month. <b>Assumption:</b> something you rely on but have not checked. <b>Recommendation:</b> the bounded action.</p>\n          <p>Labeling each sentence stops a story from quietly raising its certainty.</p>":"<p><b>观察：</b>可以在文件中直接数出来。<b>推断：</b>超出已观测行的说法，比如关于下个月的说法。<b>假定：</b>你所依赖但尚未核查的东西。<b>建议：</b>有边界的行动。</p><p>给每句话贴上标签，可以防止故事悄悄抬高自己的确定程度。</p>","Review order-level timing and staffing records before changing the schedule.":"在调整排班之前，先查看订单层面的时间记录和人员配置记录。","Next month will show a similar on-time rate.":"下个月的准时率会差不多。","392 of 500 eligible deliveries were on time in the week of Aug 24.":"在 8 月 24 日这一周，500 次符合条件的配送中有 392 次准时。","Every on_time_kpi_flag follows the promised-time rule.":"每个 on_time_kpi_flag 都遵循承诺时间规则。","Observation<br><small>directly countable</small>":"观察<br><small>可以直接计数</small>","Inference<br><small>reaches beyond the rows</small>":"推断<br><small>超出了已有的行</small>","Assumption<br><small>relied on, not yet checked</small>":"假定<br><small>依赖它，但尚未核查</small>","Recommendation<br><small>bounded action</small>":"建议<br><small>有边界的行动</small>","You can count this directly in the file. That makes it an observation.":"你可以在文件中直接数出这一点。所以它是观察。","Next month is outside the observed rows. That is an inference, and an unsupported one.":"下个月不在已观测的行之内。这是推断，而且是缺乏支持的推断。","You rely on the flag being right, but you have not audited the timestamps. That is an assumption.":"你依赖这个标记是正确的，但你还没有核查时间戳。这是假定。","This is the bounded action the director can take. That is a recommendation.":"这是总监可以采取的有边界的行动。这是建议。","Make the call":"做出判断","The director wants one recommendation before the next scheduling cycle.":"总监希望在下一个排班周期之前得到一条建议。","What do you recommend?":"你建议怎么做？","<p>The KPI missed: 78.4%, 6.6 points below target. The guardrail held at 2.8%. The records describe the miss but contain no staffing data, so they cannot show its cause.</p>\n          <p>The bounded action is to investigate first: order-level timing by day, order size and staffing rosters. Change the schedule only when evidence links staffing to lateness.</p>":"<p>KPI 未达标：78.4%，比目标低 6.6 个百分点。护栏指标守住了，为 2.8%。这些记录描述了未达标的情况，但不包含人员配置数据，所以无法显示原因。</p><p>有边界的行动是先调查：按天、订单大小和人员排班表查看订单层面的时间记录。只有当证据把人员配置和延误联系起来时，才调整排班。</p>","Investigate weekend staffing and order records before changing the schedule.":"在调整排班之前，先调查周末人员配置和订单记录。","Add weekend staff now, because staffing caused the miss.":"现在就增加周末员工，因为是人员配置导致了未达标。","The records show a miss, not its cause. Change staffing once evidence links staffing to lateness.":"这些记录显示了未达标，但没有显示原因。等证据把人员配置和延误联系起来后，再调整人员配置。","Do nothing. The four-week rate, 83.75%, is close to target.":"什么都不做。四周比率 83.75% 已经接近目标。","That pools away the latest week. The decision is about the latest 6.6-point miss.":"这样会把最近一周合并掉。这次决策针对的是最近一周 6.6 个百分点的缺口。","Wait until complaints break the guardrail, then act.":"等投诉突破护栏指标后再行动。","The guardrail held at 2.8%, but the KPI missed. Act on the KPI and keep watching the guardrail.":"护栏指标守住了，为 2.8%，但 KPI 未达标。要针对 KPI 采取行动，同时继续关注护栏指标。","Investigate first; change staffing only on linked evidence":"先调查；只有证据建立关联后才调整人员配置","Your chart bench":"你的图表工作台","Name the grain. Count before you divide. Start bars at zero, show the base, and claim only what the rows show.":"说清粒度。先计数，再相除。柱形从零开始，展示基数，只说数据行能显示的内容。","This is Chart A again. Repair it with the controls and watch the checklist. Try breaking it again, too.":"这又是图表 A。用这些控件修复它，并留意检查清单。也试试再把它弄坏。","Weekend understaffing caused a delivery crisis":"周末人手不足导致了配送危机","Open this page from the class site to see the dataset.":"请从课程网站打开此页面以查看数据集。","Weekly on-time delivery rate, weeks of Aug 3 to Aug 24":"每周准时配送率，8 月 3 日至 8 月 24 日各周","latest week":"最近一周","target 85%":"目标 85%","Control for where the vertical axis starts":"用于设置纵轴起点的控件","axis starts at":"坐标轴起点","Axis start":"坐标轴起点","Variable (column)":"变量（列）","Value in this row":"这一行中的值","Order 10482, all 16 columns":"订单 10482，全部 16 列","Complaint rate for the week of Aug 24 against the 3% guardrail":"8 月 24 日这一周的投诉率与 3% 护栏指标的对比","complaint rate":"投诉率","Week of Aug 24":"8 月 24 日这一周","guardrail: no more than 3%":"护栏指标：不超过 3%","Within limit":"在上限之内","Breaks limit":"超出上限","Complaints in the week":"本周投诉次数","Four sample rows":"四行示例","The full file has 2,000 rows and 2,000 different order_id values.":"完整文件有 2,000 行，共有 2,000 个不同的 order_id 值。","deliveries on time":"准时的配送","Each delivery counts once.":"每次配送计一次。","customers with every delivery on time":"每次配送都准时的客户","Each customer counts once, and is on time only if both deliveries were.":"每位客户计一次，只有两次配送都准时，这位客户才算准时。","On-time share for the chosen unit":"所选单位下的准时占比","Unit counted":"计数单位","Note":"说明","Count by":"计数依据","Delivery":"配送","Customer":"客户","On-time share per delivery and per joined row, week of Aug 10":"8 月 10 日这一周，按配送和按连接后的行计算的准时占比","on-time share":"准时占比","Per delivery":"按配送","Per joined row":"按连接后的行","Late deliveries repeated":"被重复的延误配送","Joined rows":"连接后的行数","Share from joined rows":"按连接后的行计算的占比","Looks like":"看起来像","Meets target":"达到目标","Misses target":"未达到目标","Late deliveries repeated on 3 rows":"被重复成 3 行的延误配送","Pooled on-time rate for the chosen window":"所选时间窗口的合并准时率","on-time rate (axis from 70%)":"准时率（坐标轴从 70% 开始）","single weeks":"单周","Weeks pooled":"合并的周数","On time / eligible":"准时 / 符合条件","Gap to 85%":"与 85% 的差距","pts":"百分点","Weeks pooled, counting back from Aug 24":"合并的周数，从 8 月 24 日往回数","Axis starts at":"坐标轴起点","Aug 10 bar ÷ Aug 24 bar":"8 月 10 日柱形 ÷ 8 月 24 日柱形","Bar height honest?":"柱形高度如实吗？","Yes":"是","No":"否","Show":"显示","Bars, 0% to 100%":"柱形图，0% 至 100%","Line, 70% to 90%":"折线图，70% 至 90%","Bars, 70% to 90%":"柱形图，70% 至 90%","Latest rate meets the 85% target":"最近的比率达到 85% 的目标","78.4%, 6.6 points below":"78.4%，低 6.6 个百分点","Fail":"未通过","Complaints within the 3% guardrail":"投诉在 3% 护栏指标之内","Pass":"通过","Numbers trace to source counts":"数字可追溯到源头计数","Records identify the cause":"记录能确定原因","no staffing data in the file":"文件中没有人员配置数据","Not shown":"未显示","Evidence checklist":"证据检查清单","Right call.":"判断正确。","Right call. Your gut call at the start was “{call}”. Now you can back your answer with evidence.":"判断正确。你一开始的直觉判断是“{call}”。现在你可以用证据支持你的答案了。","Checks for your chart":"图表检查项","Bars start at 0%, or the chart is a labeled line":"柱形从 0% 开始，或图表是带标注的折线图","Flat 2D marks, no 3D":"平面 2D 图形，没有 3D","Every value has a direct label":"每个值都有直接标签","Denominators visible (n = 500)":"分母可见（n = 500）","85% target drawn and labeled":"画出并标注 85% 的目标","Latest week marked without relying on colour":"标出最近一周，不只依靠颜色","Title states what was observed, with no cause or drama":"标题说明观察到的情况，不含因果或戏剧化的说法","Fix":"修复","Verdict":"结论","Ready to send":"可以发送","Repair first":"先修复","Chart type":"图表类型","Bars":"柱形图","Line":"折线图","Marks and labels":"图形与标签","3D effect":"3D 效果","Direct % labels":"% 直接标签","Show n = 500":"显示 n = 500","85% target line":"85% 目标线","Mark latest week with a dashed outline":"用虚线轮廓标出最近一周","Title":"标题","Lesson complete":"课程完成","You earned {pts} points: {firsts} first-try answers across {graded} questions.":"你获得了 {pts} 分：{graded} 道题中有 {firsts} 道一次答对。","Your evidence file stays in the case panel. Use Back or the part bar to revisit any screen before the midterm on October 21.":"你的证据档案会保留在案例面板中。在 10 月 21 日期中考试之前，你可以用“返回”或部分导航栏重新查看任意一屏。","That meets the limit, but the week could take more complaints and still pass. Find the highest.":"这满足上限，但这一周还能承受更多投诉并仍然达标。找出最高值。","That is above 3%. Lower the count until the rate is no greater than 3%.":"这已超过 3%。降低次数，直到比率不超过 3%。","The joined share still meets 85%. More repeats are possible before it misses. Find the most.":"连接后的占比仍然达到 85%。在它未达标之前，还可以重复更多次。找出最大值。","At this count the joined share is below 85%, so the good week wrongly looks like a miss. Use fewer.":"在这个次数下，连接后的占比低于 85%，所以这个达标的一周被错误地显示为未达标。请减少一些。","Close. Any start above 0% trims every bar by the same amount, so the gap still looks too big. Go all the way to 0%.":"很接近了。任何高于 0% 的起点都会把每根柱形截掉同样的长度，所以差距看起来仍然太大。一直拖到 0%。","The bars still start well above zero, so the Aug 24 bar looks far shorter than it is. Keep dragging left.":"柱形的起点仍然远高于零，所以 8 月 24 日的柱形看起来比实际短得多。继续向左拖。"},"es":{"Is MetroMeal Slipping?":"¿MetroMeal está perdiendo terreno?","GC1015 · Session 2 · KPIs, variables, grain and chart critique":"GC1015 · Sesión 2 · KPI, variables, granularidad y crítica de gráficos","Finish":"Terminar","Evidence so far":"Evidencia hasta ahora","Variable types and scales":"Tipos y escalas de variables","Grain and unit of analysis":"Granularidad y unidad de análisis","Chart critique":"Crítica de gráficos","Case file: MetroMeal Delivery":"Expediente del caso: MetroMeal Delivery","Fictional food-delivery company. One row per eligible completed delivery, August 3 to 30, 2026: 2,000 rows in <code>orders_story.csv</code>.":"Empresa ficticia de entrega de comida. Una fila por cada entrega completada elegible, del 3 al 30 de agosto de 2026: 2,000 filas en <code>orders_story.csv</code>.","Decision: should the regional operations director investigate, and possibly adjust, weekend staffing before the next scheduling cycle?":"Decisión: ¿debe el director de operaciones regionales investigar, y quizá ajustar, la dotación de personal de fin de semana antes del próximo ciclo de programación?","Week of":"Semana del","Eligible":"Elegibles","On time":"A tiempo","Complaints":"Quejas","Aug 3":"3 ago","Aug 10":"10 ago","Aug 17":"17 ago","Aug 24":"24 ago","KPI: on-time eligible deliveries ÷ eligible deliveries, each week. Target: at least 85%.":"KPI: entregas elegibles a tiempo ÷ entregas elegibles, cada semana. Meta: al menos 85%.","Guardrail: complaint rate no greater than 3%.":"Salvaguarda: tasa de quejas no mayor que 3%.","Latest week, 108 late deliveries: mean 12.4 minutes late, median 7, 90th percentile 31.":"Última semana, 108 entregas con retraso: media de 12.4 minutos de retraso, mediana de 7, percentil 90 de 31.","Toolkit links explain each rule with a second fictional example, Mosaic Pantry. The rules are the same.":"Los enlaces al Toolkit explican cada regla con un segundo ejemplo ficticio, Mosaic Pantry. Las reglas son las mismas.","KPI contract":"Contrato del KPI","Set on screen 2":"Se definen en la pantalla 2","Variable types":"Tipos de variables","Latest week KPI":"KPI de la última semana","Complaint guardrail":"Salvaguarda de quejas","Gap to target":"Brecha con la meta","Grain of the file":"Granularidad del archivo","Mixed-grain risk":"Riesgo de granularidad mixta","Four-week rate":"Tasa de cuatro semanas","Honest chart":"Gráfico honesto","Chart title":"Título del gráfico","Recommendation":"Recomendación","Is weekend staffing the problem?":"¿El problema es el personal de fin de semana?","Your gut call, before any checks: what should the director do?":"Tu intuición, antes de cualquier verificación: ¿qué debería hacer el director?","MetroMeal Delivery, a fictional food-delivery company, aims for at least 85% of deliveries on time. A dashboard chart now says “Delivery performance collapses.”":"MetroMeal Delivery, una empresa ficticia de entrega de comida, busca que al menos el 85% de las entregas lleguen a tiempo. Ahora un gráfico del tablero dice “El desempeño de las entregas se desploma.”","Weekend staffing has been suggested as the reason. The regional operations director must decide what to do before the next scheduling cycle.":"Se ha sugerido que el personal de fin de semana es la causa. El director de operaciones regionales debe decidir qué hacer antes del próximo ciclo de programación.","Noted. You will test this call against checked evidence at the end.":"Anotado. Al final pondrás a prueba esta decisión con evidencia verificada.","Change weekend staffing now":"Cambiar ya el personal de fin de semana","Leave staffing as it is":"Dejar el personal como está","Investigate first, then decide":"Investigar primero, luego decidir","Write the KPI contract":"Escribe el contrato del KPI","Before any chart, you write down exactly what the weekly on-time KPI counts.":"Antes de cualquier gráfico, anotas exactamente qué cuenta el KPI semanal de entregas a tiempo.","Drag each piece into its place. Two tiles do not belong.":"Arrastra cada pieza a su lugar. Dos fichas no corresponden.","<p>A KPI is a definition another analyst can reproduce. It names the population, the time window, the grain, the numerator and the denominator.</p>\n          <ul><li><b>Numerator:</b> on-time eligible deliveries in the week.</li>\n          <li><b>Denominator:</b> all eligible completed deliveries in the same week.</li>\n          <li><b>Target:</b> at least 85%, a management benchmark, not a statistical finding.</li>\n          <li><b>Guardrail:</b> complaint rate no greater than 3%, a harm to watch while chasing the target.</li></ul>":"<p>Un KPI es una definición que otro analista puede reproducir. Nombra la población, la ventana de tiempo, la granularidad, el numerador y el denominador.</p><ul><li><b>Numerador:</b> entregas elegibles a tiempo en la semana.</li><li><b>Denominador:</b> todas las entregas completadas elegibles de la misma semana.</li><li><b>Meta:</b> al menos 85%, un punto de referencia de la gerencia, no un hallazgo estadístico.</li><li><b>Salvaguarda:</b> tasa de quejas no mayor que 3%, un daño que hay que vigilar mientras persigues la meta.</li></ul>","Deliveries made by weekend staff":"Entregas hechas por el personal de fin de semana","Complaint rate no greater than 3%":"Tasa de quejas no mayor que 3%","On-time eligible deliveries in the week":"Entregas elegibles a tiempo en la semana","On-time rate of at least 85%":"Tasa de entregas a tiempo de al menos 85%","Item rows delivered on time":"Filas de artículos entregados a tiempo","All eligible completed deliveries in the week":"Todas las entregas completadas elegibles de la semana","Numerator":"Numerador","Denominator":"Denominador","Target":"Meta","Guardrail":"Salvaguarda","That filters by the suspected cause. The KPI covers every eligible completed delivery, weekday or weekend.":"Eso filtra por la causa sospechada. El KPI cubre cada entrega completada elegible, entre semana o en fin de semana.","Items are a different grain. The KPI counts each delivery once, however many items it holds.":"Los artículos son otra granularidad. El KPI cuenta cada entrega una sola vez, sin importar cuántos artículos tenga.","The numerator is the part that meets the condition: deliveries that were on time.":"El numerador es la parte que cumple la condición: las entregas que llegaron a tiempo.","The denominator is every eligible delivery in the same week, whether on time or late.":"El denominador es cada entrega elegible de la misma semana, a tiempo o con retraso.","A target is the management benchmark for the KPI itself.":"Una meta es el punto de referencia de la gerencia para el propio KPI.","A guardrail watches a different outcome that must not get worse: complaints.":"Una salvaguarda vigila otro resultado que no debe empeorar: las quejas.","On-time ÷ eligible deliveries, weekly; target ≥ 85%; complaints ≤ 3%":"Entregas a tiempo ÷ elegibles, semanal; meta ≥ 85%; quejas ≤ 3%","One row, many values":"Una fila, muchos valores","Here is one row of <code>orders_story.csv</code>, shown sideways: each line is one column of the file.":"Esta es una fila de <code>orders_story.csv</code>, mostrada de lado: cada línea es una columna del archivo.","In data terms, what is this row?":"En términos de datos, ¿qué es esta fila?","<p>A dataset puts <b>variables</b> in columns and <b>observations</b> in rows. This file has 16 variables and 2,000 observations.</p>\n          <p>Order 10482 is one late delivery: 54 minutes against a 45-minute promise, so 9 minutes late, with 3 items and a satisfaction code of 2.</p>":"<p>Un conjunto de datos pone las <b>variables</b> en columnas y las <b>observaciones</b> en filas. Este archivo tiene 16 variables y 2,000 observaciones.</p><p>El pedido 10482 es una entrega con retraso: 54 minutos frente a una promesa de 45 minutos, o sea 9 minutos de retraso, con 3 artículos y un código de satisfacción de 2.</p>","One observation: one delivery, with a value for each variable":"Una observación: una entrega, con un valor para cada variable","One variable: the delivery called 10482":"Una variable: la entrega llamada 10482","A variable is a column, such as region or item_count. A row holds one value of each column.":"Una variable es una columna, como region o item_count. Una fila contiene un valor de cada columna.","A summary of all North region deliveries":"Un resumen de todas las entregas de la región North","Nothing is added up here. It is one delivery that happened to be in the North region.":"Aquí no se suma nada. Es una sola entrega que resultó estar en la región North.","Two questions for every column":"Dos preguntas para cada columna","Excel stores all four of these columns as numbers. That does not make them all numerical.":"Excel guarda estas cuatro columnas como números. Eso no las convierte a todas en numéricas.","Classify each variable twice: its data type, then its measurement scale. One tile is left over.":"Clasifica cada variable dos veces: primero su tipo de dato, luego su escala de medición. Sobra una ficha.","<p>Data type and measurement scale are separate questions.</p>\n          <ul><li><b>order_id:</b> categorical, nominal. Its digits name a delivery.</li>\n          <li><b>satisfaction_category:</b> categorical, ordinal. 4 is above 2, but the gaps between codes are not promised to be equal.</li>\n          <li><b>item_count:</b> numerical, discrete, ratio. It counts items, and 0 would mean none.</li>\n          <li><b>delivery_minutes:</b> numerical, continuous, ratio. It measures time, so 54 minutes is twice 27.</li></ul>":"<p>El tipo de dato y la escala de medición son preguntas distintas.</p><ul><li><b>order_id:</b> categórica, nominal. Sus dígitos nombran una entrega.</li><li><b>satisfaction_category:</b> categórica, ordinal. 4 está por encima de 2, pero no se garantiza que las distancias entre códigos sean iguales.</li><li><b>item_count:</b> numérica, discreta, de razón. Cuenta artículos, y 0 significaría ninguno.</li><li><b>delivery_minutes:</b> numérica, continua, de razón. Mide tiempo, así que 54 minutos es el doble de 27.</li></ul>","Nominal":"Nominal","Categorical":"Categórica","Ratio":"De razón","Numerical, discrete":"Numérica, discreta","Interval":"De intervalo","Ordinal":"Ordinal","Numerical, continuous":"Numérica, continua","Variable ↓   Question →":"Variable ↓   Pregunta →","order_id<br><small>10482</small>":"order_id<br><small>10482</small>","satisfaction_category<br><small>1 to 5</small>":"satisfaction_category<br><small>1 a 5</small>","item_count<br><small>1 or 3</small>":"item_count<br><small>1 o 3</small>","delivery_minutes<br><small>54.0</small>":"delivery_minutes<br><small>54.0</small>","Data type":"Tipo de dato","Measurement scale":"Escala de medición","Categorical fits labels and codes, such as order_id and satisfaction_category. Their digits do not measure an amount.":"Categórica sirve para etiquetas y códigos, como order_id y satisfaction_category. Sus dígitos no miden una cantidad.","Numerical, discrete fits counts. Ask: does this column count something, like items?":"Numérica, discreta sirve para conteos. Pregúntate: ¿esta columna cuenta algo, como artículos?","Numerical, continuous fits measurements. Ask: is this column measured, like minutes?":"Numérica, continua sirve para mediciones. Pregúntate: ¿esta columna se mide, como los minutos?","Nominal means labels with no order. order_id names a delivery and cannot be ranked.":"Nominal significa etiquetas sin orden. order_id nombra una entrega y no se puede ordenar de mayor a menor.","Ordinal means ordered categories. A satisfaction code of 4 is above 2, but the gaps may not be equal.":"Ordinal significa categorías ordenadas. Un código de satisfacción de 4 está por encima de 2, pero las distancias pueden no ser iguales.","Ratio means equal gaps and a true zero, so “twice as many” makes sense. That fits counts and minutes.":"De razón significa distancias iguales y un cero verdadero, así que “el doble” tiene sentido. Eso encaja con conteos y minutos.","Interval has equal gaps but no true zero, like calendar dates. None of these four columns is interval.":"De intervalo tiene distancias iguales pero no un cero verdadero, como las fechas del calendario. Ninguna de estas cuatro columnas es de intervalo.","order_id nominal; satisfaction ordinal; item_count and minutes ratio":"order_id nominal; satisfacción ordinal; item_count y minutos de razón","Four scales, four kinds of comparison":"Cuatro escalas, cuatro tipos de comparación","The scale tells you which comparisons make sense: same or different, more or less, how far apart, or how many times as much.":"La escala te dice qué comparaciones tienen sentido: igual o diferente, más o menos, qué tan lejos, o cuántas veces más.","Drag one variable into each scale. One tile stays in the bank.":"Arrastra una variable a cada escala. Una ficha se queda en el banco.","<p><b>Nominal:</b> region and complaint_flag only say same or different. <b>Ordinal:</b> satisfaction adds order. <b>Interval:</b> completed_date adds equal gaps, so “6 days apart” works, but its zero is arbitrary. <b>Ratio:</b> late_minutes adds a true zero, so “twice as late” works.</p>\n          <p>Excel stores dates as serial numbers. That is a storage convention, not permission to average or multiply them.</p>":"<p><b>Nominal:</b> region y complaint_flag solo dicen igual o diferente. <b>Ordinal:</b> la satisfacción agrega orden. <b>De intervalo:</b> completed_date agrega distancias iguales, así que “6 días de diferencia” funciona, pero su cero es arbitrario. <b>De razón:</b> late_minutes agrega un cero verdadero, así que “el doble de retraso” funciona.</p><p>Excel guarda las fechas como números de serie. Es una convención de almacenamiento, no un permiso para promediarlas o multiplicarlas.</p>","late_minutes: 0 to 50.2":"late_minutes: 0 a 50.2","region: Central, North, South, West":"region: Central, North, South, West","completed_date: 2026-08-24":"completed_date: 2026-08-24","satisfaction_category: 1 to 5":"satisfaction_category: 1 a 5","complaint_flag: 0 or 1":"complaint_flag: 0 o 1","Nominal<br><small>labels, no order</small>":"Nominal<br><small>etiquetas, sin orden</small>","Ordinal<br><small>ordered, gaps unknown</small>":"Ordinal<br><small>ordenadas, distancias desconocidas</small>","Interval<br><small>equal gaps, no true zero</small>":"De intervalo<br><small>distancias iguales, sin cero verdadero</small>","Ratio<br><small>equal gaps, true zero</small>":"De razón<br><small>distancias iguales, cero verdadero</small>","A date has equal one-day gaps, but its zero point is arbitrary. “Aug 24 is twice Aug 12” means nothing. That is interval.":"Una fecha tiene distancias iguales de un día, pero su punto cero es arbitrario. “El 24 de agosto es el doble del 12 de agosto” no significa nada. Eso es de intervalo.","0 late minutes means not late at all, a true zero. So 12 minutes is twice 6 minutes. That is ratio.":"0 minutos de retraso significa que no hubo ningún retraso, un cero verdadero. Así que 12 minutos es el doble de 6 minutos. Eso es de razón.","Codes 1 to 5 are ordered, but the step from 1 to 2 need not equal the step from 4 to 5. That is ordinal.":"Los códigos 1 a 5 están ordenados, pero el paso de 1 a 2 no tiene por qué ser igual al paso de 4 a 5. Eso es ordinal.","Region names are labels with no order. That is nominal.":"Los nombres de región son etiquetas sin orden. Eso es nominal.","A 0 or 1 flag names two groups, complaint or no complaint. The codes are labels, so this is nominal.":"Un indicador 0 o 1 nombra dos grupos, con queja o sin queja. Los códigos son etiquetas, así que esto es nominal.","Excel will average anything":"Excel promedia cualquier cosa","For the latest week, <code>AVERAGE(satisfaction_category)</code> returns 3.54. For all rows, <code>AVERAGE(order_id)</code> returns 11000.5. Excel shows no error.":"Para la última semana, <code>AVERAGE(satisfaction_category)</code> devuelve 3.54. Para todas las filas, <code>AVERAGE(order_id)</code> devuelve 11000.5. Excel no muestra ningún error.","Which statement is right?":"¿Qué afirmación es correcta?","<p>Arithmetic must match the scale. An average of identifiers has no business meaning. An average of ordinal codes treats the gap from 1 to 2 as equal to the gap from 4 to 5.</p>\n          <p>If you report a mean rating, say so, and show how many deliveries fell in each category beside it.</p>":"<p>La aritmética debe coincidir con la escala. Un promedio de identificadores no tiene significado de negocio. Un promedio de códigos ordinales trata la distancia de 1 a 2 como igual a la distancia de 4 a 5.</p><p>Si reportas una calificación media, dilo, y muestra al lado cuántas entregas cayeron en cada categoría.</p>","11000.5 means nothing. 3.54 needs its convention stated and category counts shown.":"11000.5 no significa nada. 3.54 necesita que declares su convención y que muestres los conteos por categoría.","Both are valid means, because Excel returned no error.":"Ambas son medias válidas, porque Excel no devolvió ningún error.","Excel checks storage, not meaning. order_id is a name, so its average describes nothing.":"Excel revisa el almacenamiento, no el significado. order_id es un nombre, así que su promedio no describe nada.","Both are meaningless, so ratings can never be summarized.":"Ambas carecen de sentido, así que las calificaciones nunca se pueden resumir.","Ratings can be summarized with a count for each category, or a mean whose convention you disclose. Identifiers cannot.":"Las calificaciones se pueden resumir con un conteo por categoría, o con una media cuya convención declares. Los identificadores no.","3.54 sits on an equal-gap scale, like minutes.":"3.54 está en una escala de distancias iguales, como los minutos.","Ordinal codes do not promise equal gaps between 1, 2, 3, 4 and 5.":"Los códigos ordinales no garantizan distancias iguales entre 1, 2, 3, 4 y 5.","Compute the weekly KPI":"Calcula el KPI semanal","Week of August 24: 392 deliveries were on time and 108 were late. 14 deliveries had a complaint.":"Semana del 24 de agosto: 392 entregas llegaron a tiempo y 108 con retraso. 14 entregas tuvieron una queja.","Check the denominator first, then compute.":"Primero revisa el denominador y luego calcula.","<p>Check the parts first: 392 + 108 = 500. Then 392 ÷ 500 = 0.784, or 78.4%. The gap is 78.4 − 85.0 = −6.6 percentage points.</p>\n          <p>Complaints: 14 ÷ 500 = 2.8%, inside the 3% guardrail. In Excel, keep the numerator and denominator in their own cells and divide them, so anyone can trace the rate.</p>":"<p>Primero revisa las partes: 392 + 108 = 500. Luego 392 ÷ 500 = 0.784, o 78.4%. La brecha es 78.4 − 85.0 = −6.6 puntos porcentuales.</p><p>Quejas: 14 ÷ 500 = 2.8%, dentro de la salvaguarda de 3%. En Excel, pon el numerador y el denominador en sus propias celdas y divídelos, para que cualquiera pueda rastrear la tasa.</p>","check: 392 + 108 = {{tot}} eligible deliveries":"comprobación: 392 + 108 = {{tot}} entregas elegibles","on-time rate = 392 / 500 = {{rate}}":"tasa a tiempo = 392 / 500 = {{rate}}","gap to target = 78.4% − 85.0% = {{gap}} percentage points":"brecha con la meta = 78.4% − 85.0% = {{gap}} puntos porcentuales","complaint rate = 14 / 500 = {{cr}}":"tasa de quejas = 14 / 500 = {{cr}}","On time plus late must give every eligible delivery: 392 + 108.":"A tiempo más con retraso debe dar todas las entregas elegibles: 392 + 108.","Eligible deliveries":"Entregas elegibles","392 ÷ 500 = 0.784, shown as 78.4%.":"392 ÷ 500 = 0.784, que se muestra como 78.4%.","On-time rate":"Tasa de entregas a tiempo","Subtract the target from the rate: 78.4 − 85.0 = −6.6. It is negative because the rate is below target.":"Resta la meta a la tasa: 78.4 − 85.0 = −6.6. Es negativa porque la tasa está por debajo de la meta.","Gap to target in percentage points":"Brecha con la meta en puntos porcentuales","14 ÷ 500 = 0.028, or 2.8%. Divide by all 500 eligible deliveries, not by the 392 on-time ones.":"14 ÷ 500 = 0.028, o 2.8%. Divide entre las 500 entregas elegibles, no entre las 392 a tiempo.","Complaint rate":"Tasa de quejas","How close is the guardrail?":"¿Cuánto margen le queda a la salvaguarda?","The guardrail says the complaint rate must be no greater than 3%. The latest week had 14 complaints in 500 deliveries.":"La salvaguarda dice que la tasa de quejas no debe ser mayor que 3%. La última semana tuvo 14 quejas en 500 entregas.","Drag the complaint count. What is the highest count that still meets the guardrail?":"Arrastra el número de quejas. ¿Cuál es el número más alto que aún cumple la salvaguarda?","<p>3% of 500 is 15, so 15 complaints (3.0%) is the most the rule allows. 16 complaints would be 3.2%.</p>\n          <p>The latest week had 14, one below the line. The guardrail held, but with almost no room. Keep watching it while you investigate the on-time miss.</p>":"<p>El 3% de 500 es 15, así que 15 quejas (3.0%) es lo máximo que permite la regla. 16 quejas serían 3.2%.</p><p>La última semana tuvo 14, una por debajo de la línea. La salvaguarda se mantuvo, pero casi sin margen. Sigue vigilándola mientras investigas el incumplimiento de la meta de entregas a tiempo.</p>","14 / 500 = 2.8%: within 3% (limit is 15 complaints)":"14 / 500 = 2.8%: dentro de 3% (el límite es 15 quejas)","Points or percent?":"¿Puntos o por ciento?","A teammate drafts three sentences for the director about the latest week.":"Un compañero de equipo redacta tres oraciones para el director sobre la última semana.","Which sentence is wrong?":"¿Qué oración es incorrecta?","<p>Percentage points subtract two percentages: 85.0 − 78.4 = 6.6 points. Percent change divides by the starting value: 6.6 ÷ 85 ≈ 7.8%.</p>\n          <p>“6.6% below target” mixes the two. Write a target gap in percentage points, as the lab does in column F of <code>KPI_Build</code>.</p>":"<p>Los puntos porcentuales restan dos porcentajes: 85.0 − 78.4 = 6.6 puntos. El cambio porcentual divide entre el valor inicial: 6.6 ÷ 85 ≈ 7.8%.</p><p>“6.6% por debajo de la meta” mezcla las dos ideas. Escribe la brecha con la meta en puntos porcentuales, como hace el laboratorio en la columna F de <code>KPI_Build</code>.</p>","The rate was 6.6 percentage points below the target.":"La tasa estuvo 6.6 puntos porcentuales por debajo de la meta.","That one is correct: 85.0 − 78.4 = 6.6 points.":"Esa es correcta: 85.0 − 78.4 = 6.6 puntos.","The rate was 6.6% below the target.":"La tasa estuvo 6.6% por debajo de la meta.","Right. The gap is 6.6 percentage points. In relative terms the shortfall is about 7.8%.":"Correcto. La brecha es de 6.6 puntos porcentuales. En términos relativos, el déficit es de aproximadamente 7.8%.","The rate was about 7.8% below the target, in relative terms.":"La tasa estuvo aproximadamente 7.8% por debajo de la meta, en términos relativos.","That one is correct: 6.6 ÷ 85 ≈ 0.078, a 7.8% relative shortfall.":"Esa es correcta: 6.6 ÷ 85 ≈ 0.078, un déficit relativo de 7.8%.","−6.6 percentage points (about 7.8% relative)":"−6.6 puntos porcentuales (aprox. 7.8% relativo)","Which number answers which question?":"¿Qué número responde a qué pregunta?","Among the 108 late deliveries in the latest week: mean 12.4 minutes late, median 7, 90th percentile 31.":"Entre las 108 entregas con retraso de la última semana: media de 12.4 minutos de retraso, mediana de 7, percentil 90 de 31.","Drag the number that answers each question. One tile is left over.":"Arrastra el número que responde a cada pregunta. Sobra una ficha.","<p>A count shows volume. A proportion shows performance against opportunities. A median describes the middle. A percentile describes position, here the tail of bad experiences.</p>\n          <p>The mean, 12.4, sits well above the median, 7, because a few very late deliveries pull it up. That is a prompt to look at the whole distribution in Session 3, not proof of a cause.</p>":"<p>Un conteo muestra volumen. Una proporción muestra el desempeño frente a las oportunidades. Una mediana describe el centro. Un percentil describe una posición, aquí la cola de las peores experiencias.</p><p>La media, 12.4, está muy por encima de la mediana, 7, porque unas pocas entregas muy retrasadas la elevan. Es una señal para mirar toda la distribución en la Sesión 3, no una prueba de una causa.</p>","90th percentile: 31 minutes late":"Percentil 90: 31 minutos de retraso","78.4% of eligible deliveries on time":"78.4% de las entregas elegibles a tiempo","Mean: 12.4 minutes late":"Media: 12.4 minutos de retraso","392 on-time deliveries":"392 entregas a tiempo","Median: 7 minutes late":"Mediana: 7 minutos de retraso","How much on-time work got done?":"¿Cuánto trabajo a tiempo se hizo?","How did on-time work compare with all opportunities?":"¿Cómo se compara el trabajo a tiempo con todas las oportunidades?","How late is a typical late delivery?":"¿Cuánto retraso tiene una entrega con retraso típica?","How late are the worst 10% of late deliveries?":"¿Cuánto retraso tiene el peor 10% de las entregas con retraso?","The mean uses every late value, so the 10 deliveries 50 or more minutes late pull it up to 12.4. For a typical late delivery, use the median.":"La media usa todos los valores de retraso, así que las 10 entregas con 50 minutos o más de retraso la

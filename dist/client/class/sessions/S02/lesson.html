elevan a 12.4. Para una entrega con retraso típica, usa la mediana.","392 is a count. It shows the volume of on-time work, not performance against the 500 opportunities.":"392 es un conteo. Muestra el volumen de trabajo a tiempo, no el desempeño frente a las 500 oportunidades.","78.4% compares on-time deliveries with all eligible deliveries. It answers the performance question.":"78.4% compara las entregas a tiempo con todas las entregas elegibles. Responde la pregunta de desempeño.","The median is the middle late delivery: at least half were 7 minutes late or less.":"La mediana es la entrega con retraso del medio: al menos la mitad tuvo 7 minutos de retraso o menos.","The 90th percentile describes the tail: about 90% of late deliveries were 31 minutes late or less.":"El percentil 90 describe la cola: alrededor del 90% de las entregas con retraso tuvo 31 minutos de retraso o menos.","Each row represents one…":"Cada fila representa…","Four rows from <code>orders_story.csv</code>. Look at which values repeat and which never do.":"Cuatro filas de <code>orders_story.csv</code>. Fíjate qué valores se repiten y cuáles nunca.","Complete the grain sentence for this file.":"Completa la oración de granularidad de este archivo.","<p>Grain is what one row means: here, one eligible completed delivery from August 3 to 30, 2026. order_id never repeats, so it is the key: 2,000 rows, 2,000 order IDs.</p>\n          <p>customer_id repeats because each customer has 2 deliveries. Test the grain before you count anything: if the sentence “each row is one…” has two possible endings, stop and check.</p>":"<p>La granularidad es lo que significa una fila: aquí, una entrega completada elegible del 3 al 30 de agosto de 2026. order_id nunca se repite, así que es la clave: 2,000 filas, 2,000 ID de pedido.</p><p>customer_id se repite porque cada cliente tiene 2 entregas. Prueba la granularidad antes de contar cualquier cosa: si la oración “cada fila es…” tiene dos finales posibles, detente y revisa.</p>","One eligible completed delivery, August 3 to 30, 2026":"Una entrega completada elegible, del 3 al 30 de agosto de 2026","One customer":"Un cliente","customer_id repeats: customer 5241 appears on two rows. Each customer has 2 deliveries in the file.":"customer_id se repite: el cliente 5241 aparece en dos filas. Cada cliente tiene 2 entregas en el archivo.","One week":"Una semana","The file has 2,000 rows but only 4 weeks. A weekly table would have 4 rows.":"El archivo tiene 2,000 filas pero solo 4 semanas. Una tabla semanal tendría 4 filas.","One item in an order":"Un artículo de un pedido","item_count is a column. A 3-item order is still a single row here.":"item_count es una columna. Un pedido de 3 artículos sigue siendo una sola fila aquí.","One row = one eligible completed delivery (order_id is the key)":"Una fila = una entrega completada elegible (order_id es la clave)","Count the rows behind the KPI":"Cuenta las filas detrás del KPI","This is the real lab file, 2,000 rows. Use the filters to count before you trust any formula.":"Este es el archivo real del laboratorio, 2,000 filas. Usa los filtros para contar antes de confiar en cualquier fórmula.","Use the explorer to find the latest week’s counts.":"Usa el explorador para encontrar los conteos de la última semana.","<p>The latest week has 500 delivery rows: 392 on time and 14 with a complaint. These counts are the numerator and denominator behind 78.4% and 2.8%.</p>\n          <p>A weekly summary table turns these 500 rows into one row. That one row can support weekly claims, but it can no longer show which deliveries were late.</p>":"<p>La última semana tiene 500 filas de entregas: 392 a tiempo y 14 con una queja. Estos conteos son el numerador y el denominador detrás de 78.4% y 2.8%.</p><p>Una tabla de resumen semanal convierte estas 500 filas en una sola fila. Esa fila puede respaldar afirmaciones semanales, pero ya no puede mostrar qué entregas llegaron con retraso.</p>","rows with week_start = 2026-08-24: {{n}}":"filas con week_start = 2026-08-24: {{n}}","of those, on_time_kpi_flag = 1: {{on}}":"de ellas, on_time_kpi_flag = 1: {{on}}","of those 500, complaint_flag = 1: {{c}}":"de esas 500, complaint_flag = 1: {{c}}","Set week_start to 2026-08-24 and leave the other filters at (Any).":"Pon week_start en 2026-08-24 y deja los demás filtros en (Any).","Rows in the latest week":"Filas en la última semana","Keep week_start = 2026-08-24 and set on_time_kpi_flag to 1.":"Mantén week_start = 2026-08-24 y pon on_time_kpi_flag en 1.","On-time rows in the latest week":"Filas a tiempo en la última semana","Set on_time_kpi_flag back to (Any), then complaint_flag to 1. If you see 47, week_start is not set.":"Vuelve a poner on_time_kpi_flag en (Any) y luego complaint_flag en 1. Si ves 47, week_start no está fijado.","Complaint rows in the latest week":"Filas con queja en la última semana","Same data, four grains":"Mismos datos, cuatro granularidades","Each tile is one row from a different table built from the same deliveries.":"Cada ficha es una fila de una tabla distinta, construida a partir de las mismas entregas.","Drag each row to the grain it represents. One tile does not fit any slot.":"Arrastra cada fila a la granularidad que representa. Una ficha no encaja en ningún espacio.","<p>The same deliveries can be stored at many grains: item, delivery, customer, day, week. Each grain supports different claims.</p>\n          <p>The KPI is defined per delivery and reported per week. A day row shows when lateness happened. A customer row shows who experienced it. None of them is “the” data; pick the grain that matches the decision.</p>":"<p>Las mismas entregas se pueden guardar con muchas granularidades: artículo, entrega, cliente, día, semana. Cada granularidad respalda afirmaciones distintas.</p><p>El KPI se define por entrega y se reporta por semana. Una fila por día muestra cuándo ocurrieron los retrasos. Una fila por cliente muestra quién los vivió. Ninguna de ellas es “los” datos; elige la granularidad que coincida con la decisión.</p>","Week of Aug 24: 500 eligible, 392 on time":"Semana del 24 ago: 500 elegibles, 392 a tiempo","Order 10482, item 2 of 3":"Pedido 10482, artículo 2 de 3","Order 10482: North, 3 items, 54 minutes, late":"Pedido 10482: North, 3 artículos, 54 minutos, con retraso","Aug 29: 71 deliveries, 36 on time":"29 ago: 71 entregas, 36 a tiempo","Customer 5241: 2 deliveries, 1 on time":"Cliente 5241: 2 entregas, 1 a tiempo","One delivery":"Una entrega","One day":"Un día","That row is one item inside an order: item grain. None of these slots needs it.":"Esa fila es un artículo dentro de un pedido: granularidad de artículo. Ningún espacio la necesita.","This row describes a single delivery, order 10482.":"Esta fila describe una sola entrega, el pedido 10482.","Customer 5241 has two deliveries, so this row summarizes more than one delivery.":"El cliente 5241 tiene dos entregas, así que esta fila resume más de una entrega.","Aug 29 covers 71 deliveries completed on one date.":"El 29 ago abarca 71 entregas completadas en una sola fecha.","This row covers all 500 deliveries in one week.":"Esta fila abarca las 500 entregas de una semana.","Same week, new unit":"Misma semana, nueva unidad","A colleague reports 72.8% on time for the latest week. Your KPI says 78.4%. Switch the unit below.":"Un colega reporta 72.8% a tiempo para la última semana. Tu KPI dice 78.4%. Cambia la unidad abajo.","Same week, same rows. Why does the customer view show 72.8%?":"Misma semana, mismas filas. ¿Por qué la vista por cliente muestra 72.8%?","<p>Delivery grain: 392 of 500 deliveries were on time, 78.4%. Customer grain: 250 customers had deliveries that week, and 182 had every delivery on time, 72.8%.</p>\n          <p>Both are correct, and they answer different questions. The KPI contract counts deliveries, so the director’s number is 78.4%. A customer-level KPI would need its own written definition.</p>":"<p>Granularidad de entrega: 392 de 500 entregas llegaron a tiempo, 78.4%. Granularidad de cliente: 250 clientes tuvieron entregas esa semana, y 182 tuvieron todas sus entregas a tiempo, 72.8%.</p><p>Ambas son correctas, y responden preguntas distintas. El contrato del KPI cuenta entregas, así que el número del director es 78.4%. Un KPI a nivel de cliente necesitaría su propia definición escrita.</p>","It counts customers, and a customer is on time only if every delivery was.":"Cuenta clientes, y un cliente está a tiempo solo si todas sus entregas lo estuvieron.","It is a calculation error. The rate must be 78.4%.":"Es un error de cálculo. La tasa debe ser 78.4%.","Both numbers are correct. They answer different questions, because the unit counted changed.":"Ambos números son correctos. Responden preguntas distintas, porque cambió la unidad que se cuenta.","Customers are a sample of deliveries, so the rate is less precise.":"Los clientes son una muestra de las entregas, así que la tasa es menos precisa.","There is no sampling here. Each of the 250 customers had exactly 2 deliveries that week.":"Aquí no hay muestreo. Cada uno de los 250 clientes tuvo exactamente 2 entregas esa semana.","What a join does to the rows":"Lo que una unión (join) les hace a las filas","An analyst joins the latest week’s deliveries to an item table, so each item gets its own row. Use the explorer: what is item_count for the late deliveries?":"Un analista une las entregas de la última semana con una tabla de artículos, así que cada artículo obtiene su propia fila. Usa el explorador: ¿cuál es el item_count de las entregas con retraso?","Every late delivery has 3 items and every on-time delivery has 1. Fill in the joined table.":"Cada entrega con retraso tiene 3 artículos y cada entrega a tiempo tiene 1. Completa la tabla unida.","<p>392 + 3 × 108 = 716 rows. Counting rows now gives 392 ÷ 716 = 54.7%, not 78.4%.</p>\n          <p>No delivery changed. Late deliveries simply got three times the weight. Before you compute a delivery-level rate, bring the items back to one row per delivery, then check that each order_id appears once.</p>":"<p>392 + 3 × 108 = 716 filas. Contar filas ahora da 392 ÷ 716 = 54.7%, no 78.4%.</p><p>Ninguna entrega cambió. Las entregas con retraso simplemente recibieron el triple de peso. Antes de calcular una tasa a nivel de entrega, vuelve a dejar los artículos en una fila por entrega y luego verifica que cada order_id aparezca una sola vez.</p>","joined rows = 392 × 1 + 108 × 3 = {{rows}}":"filas unidas = 392 × 1 + 108 × 3 = {{rows}}","“on-time rate” from joined rows = 392 / {{rows2}} = {{jr}}":"“tasa a tiempo” con las filas unidas = 392 / {{rows2}} = {{jr}}","392 on-time deliveries keep 1 row each. 108 late deliveries get 3 rows each: 392 + 324.":"Las 392 entregas a tiempo conservan 1 fila cada una. Las 108 entregas con retraso reciben 3 filas cada una: 392 + 324.","Rows after the join":"Filas después de la unión","Use the joined row count you just found.":"Usa el número de filas unidas que acabas de encontrar.","Denominator from joined rows":"Denominador con las filas unidas","392 ÷ 716 ≈ 0.547, or 54.7%.":"392 ÷ 716 ≈ 0.547, o 54.7%.","Rate from joined rows":"Tasa con las filas unidas","Item join: 716 rows give 54.7% (wrong grain)":"Unión con artículos: 716 filas dan 54.7% (granularidad incorrecta)","How many repeats flip the verdict?":"¿Cuántas repeticiones cambian el veredicto?","The week of Aug 10 beat the target: 438 of 500 deliveries on time, 87.6%. It had 62 late deliveries. Suppose a join repeats some late deliveries on 3 rows.":"La semana del 10 de agosto superó la meta: 438 de 500 entregas a tiempo, 87.6%. Tuvo 62 entregas con retraso. Supón que una unión repite algunas entregas con retraso en 3 filas.","Drag the number of late deliveries repeated on 3 rows. What is the most that can be repeated before this good week looks like a miss?":"Arrastra el número de entregas con retraso repetidas en 3 filas. ¿Cuántas se pueden repetir como máximo antes de que esta buena semana parezca un incumplimiento?","<p>Each repeated late delivery adds 2 extra rows. With 7 repeated, the table has 514 rows and 438 ÷ 514 = 85.21%. With 8, it has 516 rows and 438 ÷ 516 = 84.88%, below target.</p>\n          <p>So 8 repeated deliveries out of 500 turn a week that beat the target into an apparent miss. In the real file all 62 late deliveries that week have 3 items, which would show 70.2%.</p>":"<p>Cada entrega con retraso repetida agrega 2 filas extra. Con 7 repetidas, la tabla tiene 514 filas y 438 ÷ 514 = 85.21%. Con 8, tiene 516 filas y 438 ÷ 516 = 84.88%, por debajo de la meta.</p><p>Así, 8 entregas repetidas de 500 convierten una semana que superó la meta en un aparente incumplimiento. En el archivo real, las 62 entregas con retraso de esa semana tienen 3 artículos, lo que mostraría 70.2%.</p>","Count first, then divide":"Primero cuenta, luego divide","The director also wants the rate for all four weeks together. Each week had 500 eligible deliveries, 2,000 in total.":"El director también quiere la tasa de las cuatro semanas juntas. Cada semana tuvo 500 entregas elegibles, 2,000 en total.","Build the four-week rate from counts.":"Construye la tasa de cuatro semanas a partir de conteos.","<p>Add the counts first: 1,675 on-time deliveries out of 2,000. Then divide: 83.75%, which is 1.25 points below target.</p>\n          <p>Here the average of the four weekly rates is also 83.75%, but only because every week has 500 deliveries. With unequal weeks, averaging rates gives each week equal weight instead of each delivery. Count first, then divide.</p>":"<p>Primero suma los conteos: 1,675 entregas a tiempo de 2,000. Luego divide: 83.75%, que está 1.25 puntos por debajo de la meta.</p><p>Aquí el promedio de las cuatro tasas semanales también es 83.75%, pero solo porque cada semana tiene 500 entregas. Con semanas desiguales, promediar tasas le da el mismo peso a cada semana en lugar de a cada entrega. Primero cuenta, luego divide.</p>","on time, four weeks = 420 + 438 + 425 + 392 = {{on}}":"a tiempo, cuatro semanas = 420 + 438 + 425 + 392 = {{on}}","four-week rate = on time / 2,000 = {{rate}}":"tasa de cuatro semanas = a tiempo / 2,000 = {{rate}}","Add the four weekly on-time counts.":"Suma los cuatro conteos semanales de entregas a tiempo.","Four-week on-time count":"Conteo a tiempo de cuatro semanas","1,675 ÷ 2,000 = 0.8375, or 83.75%. Divide summed counts. Do not add the four rates, which gives 3.35.":"1,675 ÷ 2,000 = 0.8375, o 83.75%. Divide los conteos sumados. No sumes las cuatro tasas, eso da 3.35.","Pool more weeks, lose the signal":"Combina más semanas y pierdes la señal","Drag the window: it pools the latest weeks, counting back from Aug 24. Dots are read by position, so this scale can zoom in.":"Arrastra la ventana: combina las últimas semanas, contando hacia atrás desde el 24 de agosto. Los puntos se leen por su posición, así que esta escala puede hacer zoom.","The director asks how the latest week did. A colleague answers with the four-week rate, 83.75%. What is the problem?":"El director pregunta cómo le fue a la última semana. Un colega responde con la tasa de cuatro semanas, 83.75%. ¿Cuál es el problema?","<p>The window is part of the grain. Latest week alone: 78.4%, 6.6 points below target. Last two weeks: 81.7%. All four weeks: 83.75%, only 1.25 points below.</p>\n          <p>The director’s decision is about the latest week, so report the weekly rate. Show the four-week figure only as labeled context.</p>":"<p>La ventana es parte de la granularidad. Solo la última semana: 78.4%, 6.6 puntos por debajo de la meta. Últimas dos semanas: 81.7%. Las cuatro semanas: 83.75%, solo 1.25 puntos por debajo.</p><p>La decisión del director es sobre la última semana, así que reporta la tasa semanal. Muestra la cifra de cuatro semanas solo como contexto etiquetado.</p>","Pooling four weeks dilutes the latest week’s 6.6-point miss to 1.25 points.":"Combinar cuatro semanas diluye el incumplimiento de 6.6 puntos de la última semana a 1.25 puntos.","83.75% is miscalculated. You must average the four weekly rates.":"83.75% está mal calculado. Debes promediar las cuatro tasas semanales.","With equal denominators of 500, the average of rates also gives 83.75%. The number is right; the window is wrong for this question.":"Con denominadores iguales de 500, el promedio de las tasas también da 83.75%. El número está bien; la ventana es la equivocada para esta pregunta.","Nothing. More weeks always give the better answer.":"Nada. Más semanas siempre dan la mejor respuesta.","More weeks answer a different question: the whole month, not the latest week.":"Más semanas responden otra pregunta: el mes completo, no la última semana.","An exploratory lead":"Una pista exploratoria","Exploring further, you split the latest week by <code>weekend_flag</code> (1 = Saturday or Sunday).":"Explorando más, divides la última semana por <code>weekend_flag</code> (1 = sábado o domingo).","Compare weekend and weekday on-time counts in the latest week. What can you honestly say?":"Compara los conteos a tiempo de fin de semana y entre semana en la última semana. ¿Qué puedes decir con honestidad?","<p>In the latest week, 72 of 142 weekend deliveries were on time (50.7%), against 320 of 358 on weekdays (89.4%). Weekend rates were lower in all four weeks.</p>\n          <p>But every late delivery in the file also had 3 items, and the file has no staffing records. Order size, staffing, traffic or something else could be behind the gap. This is an exploratory lead to check, not a cause.</p>":"<p>En la última semana, 72 de 142 entregas de fin de semana llegaron a tiempo (50.7%), frente a 320 de 358 entre semana (89.4%). Las tasas de fin de semana fueron más bajas en las cuatro semanas.</p><p>Pero cada entrega con retraso del archivo también tenía 3 artículos, y el archivo no tiene registros de personal. El tamaño del pedido, el personal, el tráfico u otra cosa podrían estar detrás de la brecha. Es una pista exploratoria para verificar, no una causa.</p>","Weekend deliveries were on time less often. These records cannot say why.":"Las entregas de fin de semana llegaron a tiempo con menos frecuencia. Estos registros no pueden decir por qué.","Weekend understaffing caused the late deliveries.":"La falta de personal en fin de semana causó las entregas con retraso.","The file has no staffing records. Also, every late delivery had 3 items: order size is another possible explanation.":"El archivo no tiene registros de personal. Además, cada entrega con retraso tenía 3 artículos: el tamaño del pedido es otra posible explicación.","Weekend and weekday rates are about the same.":"Las tasas de fin de semana y de entre semana son más o menos iguales.","Set weekend_flag = 1 and on_time_kpi_flag = 1: 72 of 142. Weekdays: 320 of 358.":"Pon weekend_flag = 1 y on_time_kpi_flag = 1: 72 de 142. Entre semana: 320 de 358.","What is wrong with Chart A?":"¿Qué está mal en el Gráfico A?","This is Chart A from the dashboard, rebuilt from the real weekly rates. The numbers are right. The picture is not.":"Este es el Gráfico A del tablero, reconstruido con las tasas semanales reales. Los números están bien. La imagen no.","Drag each defect to the problem it causes. One tile is not a defect.":"Arrastra cada defecto al problema que causa. Una ficha no es un defecto.","<p>Chart A shows correct numbers in a misleading way.</p>\n          <ul><li><b>Exaggeration:</b> 3D bars on a 75% start make a 9.2-point difference look huge.</li>\n          <li><b>Accessibility:</b> red and green alone fail many readers and grayscale prints.</li>\n          <li><b>Claim:</b> “collapses” is drama. One week missed the target by 6.6 points.</li>\n          <li><b>Base:</b> without n = 500, readers cannot tell what each rate is out of.</li></ul>":"<p>El Gráfico A muestra números correctos de forma engañosa.</p><ul><li><b>Exageración:</b> las barras 3D que empiezan en 75% hacen que una diferencia de 9.2 puntos parezca enorme.</li><li><b>Accesibilidad:</b> el rojo y el verde por sí solos fallan para muchos lectores y en impresiones en escala de grises.</li><li><b>Afirmación:</b> “se desploma” es dramatismo. Una semana no alcanzó la meta por 6.6 puntos.</li><li><b>Base:</b> sin n = 500, los lectores no pueden saber sobre qué total se calcula cada tasa.</li></ul>","Title: “Delivery performance collapses”":"Título: “El desempeño de las entregas se desploma”","Weeks shown in time order":"Semanas mostradas en orden cronológico","3D bars on an axis that starts at 75%":"Barras 3D en un eje que empieza en 75%","No weekly denominators (n = 500)":"Sin denominadores semanales (n = 500)","Colour is the only status cue (red and green)":"El color es la única señal de estado (rojo y verde)","Exaggerates the size of the change":"Exagera el tamaño del cambio","Shuts out some readers":"Excluye a algunos lectores","Claims more than the data show":"Afirma más de lo que muestran los datos","Hides what each rate is out of":"Oculta sobre qué total se calcula cada tasa","Time order is the natural order for weeks. That is a strength, not a defect.":"El orden cronológico es el orden natural para las semanas. Es una fortaleza, no un defecto.","A 75% start and 3D depth change how big the bars look. That is exaggeration.":"Empezar en 75% y la profundidad 3D cambian lo grandes que se ven las barras. Eso es exageración.","Many readers cannot tell red from green, and grayscale prints lose colour. Colour alone shuts them out.":"Muchos lectores no distinguen el rojo del verde, y las impresiones en escala de grises pierden el color. El color por sí solo los excluye.","“Collapses” is a claim. The data show one week that missed the target by 6.6 points.":"“Se desploma” es una afirmación. Los datos muestran una semana que no alcanzó la meta por 6.6 puntos.","Without n = 500, readers cannot see what each rate is out of.":"Sin n = 500, los lectores no pueden ver sobre qué total se calcula cada tasa.","Measure the exaggeration":"Mide la exageración","Readers judge bars by height. On Chart A, every bar starts at the 75% line. The Aug 10 rate is 87.6% and the Aug 24 rate is 78.4%.":"Los lectores juzgan las barras por su altura. En el Gráfico A, cada barra empieza en la línea de 75%. La tasa del 10 de agosto es 87.6% y la del 24 de agosto es 78.4%.","Compare the drawn heights with the real rates.":"Compara las alturas dibujadas con las tasas reales.","<p>Above the 75% line, the Aug 10 bar is 12.6 points tall and the Aug 24 bar is 3.4. So Chart A draws Aug 10 about 3.71 times as tall.</p>\n          <p>The real rates differ much less: 87.6 ÷ 78.4 ≈ 1.12. Chart A exaggerates the comparison about 3.3 times (3.71 ÷ 1.12).</p>":"<p>Por encima de la línea de 75%, la barra del 10 de agosto mide 12.6 puntos y la del 24 de agosto mide 3.4. Así que el Gráfico A dibuja el 10 de agosto unas 3.71 veces más alto.</p><p>Las tasas reales difieren mucho menos: 87.6 ÷ 78.4 ≈ 1.12. El Gráfico A exagera la comparación unas 3.3 veces (3.71 ÷ 1.12).</p>","drawn heights above 75%: Aug 10 = 87.6 − 75 = 12.6, Aug 24 = 78.4 − 75 = {{h}}":"alturas dibujadas sobre 75%: 10 ago = 87.6 − 75 = 12.6, 24 ago = 78.4 − 75 = {{h}}","on Chart A, Aug 10 looks {{r}} times as tall as Aug 24":"en el Gráfico A, el 10 ago se ve {{r}} veces tan alto como el 24 ago","real ratio of the rates: 87.6 / 78.4 = {{t}}":"razón real de las tasas: 87.6 / 78.4 = {{t}}","78.4 − 75 = 3.4 points of drawn height.":"78.4 − 75 = 3.4 puntos de altura dibujada.","Aug 24 bar height above 75%":"Altura de la barra del 24 ago sobre 75%","Drawn height ratio":"Razón de las alturas dibujadas","87.6 ÷ 78.4 ≈ 1.12. The Aug 10 rate is only about 1.12 times the Aug 24 rate.":"87.6 ÷ 78.4 ≈ 1.12. La tasa del 10 de agosto es solo unas 1.12 veces la del 24 de agosto.","Real ratio of the rates":"Razón real de las tasas","Repair the axis":"Repara el eje","The handle sets where the vertical axis starts. It begins where Chart A does, at 75%. The readout compares drawn height with the real rates.":"El control deslizante fija dónde empieza el eje vertical. Empieza donde lo hace el Gráfico A, en 75%. La lectura compara la altura dibujada con las tasas reales.","Drag the axis start until bar height tells the truth: Aug 10 should look only 1.117 times as tall as Aug 24.":"Arrastra el inicio del eje hasta que la altura de las barras diga la verdad: el 10 de agosto debería verse solo 1.117 veces tan alto como el 24 de agosto.","<p>Readers judge bars by height. Height matches the value only when bars start at 0%. At 0% the Aug 10 bar is 1.117 times as tall as Aug 24, the same as the real ratio. At 1% it is already 1.119, and at 75% it is 3.706.</p>\n          <p>The repaired chart starts at 0%, labels each bar with its rate and n = 500, draws the 85% target, and marks the latest week with a dashed outline, not colour alone.</p>":"<p>Los lectores juzgan las barras por su altura. La altura coincide con el valor solo cuando las barras empiezan en 0%. En 0%, la barra del 10 de agosto mide 1.117 veces la del 24 de agosto, igual que la razón real. En 1% ya es 1.119, y en 75% es 3.706.</p><p>El gráfico reparado empieza en 0%, etiqueta cada barra con su tasa y n = 500, dibuja la meta de 85% y marca la última semana con un contorno discontinuo, no solo con color.</p>","Bars from 0%: ×1.12, not ×3.71; labels, n = 500, target, latest week marked":"Barras desde 0%: ×1.12, no ×3.71; etiquetas, n = 500, meta, última semana marcada","Can a line zoom in?":"¿Puede una línea hacer zoom?","An analyst reader wants to see the week-to-week movement more closely. Switch between the three versions.":"Un lector analista quiere ver más de cerca el movimiento de semana a semana. Cambia entre las tres versiones.","Is a line chart with a 70% to 90% axis acceptable here?":"¿Es aceptable aquí un gráfico de líneas con un eje de 70% a 90%?","<p>Bars encode value by length, so they need a zero start. A line encodes value by position and slope, so a zoomed range is acceptable when it is labeled and the purpose is week-to-week movement.</p>\n          <p>Still label all four points and the target, say the window is only four weeks, and do not call it a stable trend. Compare “Bars, 70% to 90%”: the same zoom on bars exaggerates again.</p>":"<p>Las barras codifican el valor por su longitud, así que necesitan empezar en cero. Una línea codifica el valor por su posición y pendiente, así que un rango con zoom es aceptable cuando está etiquetado y el propósito es mostrar el movimiento de semana a semana.</p><p>Aun así, etiqueta los cuatro puntos y la meta, di que la ventana es de solo cuatro semanas y no lo llames una tendencia estable. Compara con “Barras, 70% a 90%”: el mismo zoom en barras vuelve a exagerar.</p>","Yes, if the axis range is labeled and the short four-week window is stated.":"Sí, si el rango del eje está etiquetado y se indica la ventana corta de cuatro semanas.","No. Every chart must start at zero.":"No. Todo gráfico debe empezar en cero.","Zero is the rule for bars, because readers judge bar length. A line is read by position and slope.":"Cero es la regla para las barras, porque los lectores juzgan su longitud. Una línea se lee por posición y pendiente.","Yes, and the line proves a stable downward trend.":"Sí, y la línea prueba una tendencia descendente estable.","Four points cannot establish a stable trend. The rate went up, then down, then down.":"Cuatro puntos no pueden establecer una tendencia estable. La tasa subió, luego bajó y luego volvió a bajar.","Yes, as long as red and green show the status.":"Sí, siempre que el rojo y el verde muestren el estado.","Colour alone shuts out many readers. Add labels or a shape, as the dashed latest-week marker does.":"El color por sí solo excluye a muchos lectores. Agrega etiquetas o una forma, como hace el marcador discontinuo de la última semana.","Write the title":"Escribe el título","Your repaired chart is ready. It needs a title the director can read without you in the room.":"Tu gráfico reparado está listo. Necesita un título que el director pueda leer sin que tú estés en la sala.","Which title should go on the chart?":"¿Qué título debería ir en el gráfico?","<p>A good explanatory title states the checked takeaway: the week, the rate and the gap to target. Every number traces to a cell: 392 ÷ 500 = 78.4%, and 78.4 − 85.0 = −6.6.</p>\n          <p>Remove cause words, drama words and forecasts unless separate evidence supports them.</p>":"<p>Un buen título explicativo dice la conclusión verificada: la semana, la tasa y la brecha con la meta. Cada número se rastrea hasta una celda: 392 ÷ 500 = 78.4%, y 78.4 − 85.0 = −6.6.</p><p>Quita palabras de causa, palabras dramáticas y pronósticos, a menos que otra evidencia los respalde.</p>","Week of August 24 on-time delivery was 78.4%, 6.6 percentage points below target":"En la semana del 24 de agosto, las entregas a tiempo fueron 78.4%, 6.6 puntos porcentuales por debajo de la meta","Delivery performance collapses":"El desempeño de las entregas se desploma","“Collapses” is drama the data do not show. The three earlier weeks ran 84.0% to 87.6%.":"“Se desploma” es dramatismo que los datos no muestran. Las tres semanas anteriores estuvieron entre 84.0% y 87.6%.","Weekend understaffing caused a 6.6% drop in on-time delivery":"La falta de personal en fin de semana causó una caída de 6.6% en las entregas a tiempo","Two problems: the records cannot show a cause, and the gap is 6.6 points, not 6.6%.":"Dos problemas: los registros no pueden mostrar una causa, y la brecha es de 6.6 puntos, no de 6.6%.","On-time delivery is in steady decline and will miss again":"Las entregas a tiempo están en declive constante y volverán a fallar","Four weekly points do not show a stable trend, and they cannot forecast the next week.":"Cuatro puntos semanales no muestran una tendencia estable, y no pueden pronosticar la próxima semana.","Week of Aug 24: 78.4%, 6.6 points below target":"Semana del 24 ago: 78.4%, 6.6 puntos por debajo de la meta","Label each sentence":"Etiqueta cada oración","Your draft story has four sentences. Each one carries a different level of certainty.":"El borrador de tu historia tiene cuatro oraciones. Cada una tiene un nivel distinto de certeza.","Drag each sentence to its label.":"Arrastra cada oración a su etiqueta.","<p><b>Observation:</b> directly countable in the file. <b>Inference:</b> a claim beyond the observed rows, such as next month. <b>Assumption:</b> something you rely on but have not checked. <b>Recommendation:</b> the bounded action.</p>\n          <p>Labeling each sentence stops a story from quietly raising its certainty.</p>":"<p><b>Observación:</b> se puede contar directamente en el archivo. <b>Inferencia:</b> una afirmación que va más allá de las filas observadas, como el próximo mes. <b>Supuesto:</b> algo en lo que confías pero que no has verificado. <b>Recomendación:</b> la acción acotada.</p><p>Etiquetar cada oración evita que una historia eleve su certeza sin que nadie lo note.</p>","Review order-level timing and staffing records before changing the schedule.":"Revisar los registros de tiempos por pedido y los de personal antes de cambiar el horario.","Next month will show a similar on-time rate.":"El próximo mes mostrará una tasa de entregas a tiempo similar.","392 of 500 eligible deliveries were on time in the week of Aug 24.":"392 de 500 entregas elegibles llegaron a tiempo en la semana del 24 de agosto.","Every on_time_kpi_flag follows the promised-time rule.":"Cada on_time_kpi_flag sigue la regla del tiempo prometido.","Observation<br><small>directly countable</small>":"Observación<br><small>se puede contar directamente</small>","Inference<br><small>reaches beyond the rows</small>":"Inferencia<br><small>va más allá de las filas</small>","Assumption<br><small>relied on, not yet checked</small>":"Supuesto<br><small>se confía en él, aún no verificado</small>","Recommendation<br><small>bounded action</small>":"Recomendación<br><small>acción acotada</small>","You can count this directly in the file. That makes it an observation.":"Puedes contar esto directamente en el archivo. Eso lo hace una observación.","Next month is outside the observed rows. That is an inference, and an unsupported one.":"El próximo mes está fuera de las filas observadas. Es una inferencia, y sin respaldo.","You rely on the flag being right, but you have not audited the timestamps. That is an assumption.":"Confías en que el indicador sea correcto, pero no has auditado las marcas de tiempo. Eso es un supuesto.","This is the bounded action the director can take. That is a recommendation.":"Esta es la acción acotada que el director puede tomar. Eso es una recomendación.","Make the call":"Toma la decisión","The director wants one recommendation before the next scheduling cycle.":"El director quiere una recomendación antes del próximo ciclo de programación.","What do you recommend?":"¿Qué recomiendas?","<p>The KPI missed: 78.4%, 6.6 points below target. The guardrail held at 2.8%. The records describe the miss but contain no staffing data, so they cannot show its cause.</p>\n          <p>The bounded action is to investigate first: order-level timing by day, order size and staffing rosters. Change the schedule only when evidence links staffing to lateness.</p>":"<p>El KPI no se cumplió: 78.4%, 6.6 puntos por debajo de la meta. La salvaguarda se mantuvo en 2.8%. Los registros describen el incumplimiento pero no contienen datos de personal, así que no pueden mostrar su causa.</p><p>La acción acotada es investigar primero: tiempos por pedido según el día, tamaño del pedido y turnos del personal. Cambia el horario solo cuando la evidencia vincule el personal con los retrasos.</p>","Investigate weekend staffing and order records before changing the schedule.":"Investigar el personal de fin de semana y los registros de pedidos antes de cambiar el horario.","Add weekend staff now, because staffing caused the miss.":"Agregar personal de fin de semana ya, porque el personal causó el incumplimiento.","The records show a miss, not its cause. Change staffing once evidence links staffing to lateness.":"Los registros muestran un incumplimiento, no su causa. Cambia la dotación de personal cuando la evidencia vincule el personal con los retrasos.","Do nothing. The four-week rate, 83.75%, is close to target.":"No hacer nada. La tasa de cuatro semanas, 83.75%, está cerca de la meta.","That pools away the latest week. The decision is about the latest 6.6-point miss.":"Al combinar semanas, la última semana se diluye. La decisión es sobre el incumplimiento más reciente, de 6.6 puntos.","Wait until complaints break the guardrail, then act.":"Esperar a que las quejas rompan la salvaguarda y luego actuar.","The guardrail held at 2.8%, but the KPI missed. Act on the KPI and keep watching the guardrail.":"La salvaguarda se mantuvo en 2.8%, pero el KPI no se cumplió. Actúa sobre el KPI y sigue vigilando la salvaguarda.","Investigate first; change staffing only on linked evidence":"Investigar primero; cambiar el personal solo con evidencia que lo vincule","Your chart bench":"Tu mesa de trabajo de gráficos","Name the grain. Count before you divide. Start bars at zero, show the base, and claim only what the rows show.":"Nombra la granularidad. Cuenta antes de dividir. Empieza las barras en cero, muestra la base y afirma solo lo que muestran las filas.","This is Chart A again. Repair it with the controls and watch the checklist. Try breaking it again, too.":"Este es el Gráfico A otra vez. Repáralo con los controles y observa la lista de verificación. También intenta volver a romperlo.","Weekend understaffing caused a delivery crisis":"La falta de personal en fin de semana causó una crisis de entregas","Open this page from the class site to see the dataset.":"Abre esta página desde el sitio de la clase para ver el conjunto de datos.","Weekly on-time delivery rate, weeks of Aug 3 to Aug 24":"Tasa semana   /* ---------- Weekly chart ---------- */
  // st: { base, top, type: 'bar' | 'line', threeD, status, labels, denoms, target, emph, title }
  function weeklyChart(el, a, init) {
    const C = a.Charts;
    const st = Object.assign({ base: 0, top: 1, type: 'bar', threeD: false, status: false, labels: true, denoms: true, target: true, emph: true, title: '' }, init);
    const holder = a.h('div');
    el.append(holder);
    const ticks = (lo, hi) => {
      const span = hi - lo, step = span <= 0.2 ? 0.05 : span <= 0.5 ? 0.1 : 0.2;
      const out = [];
      for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(4));
      if (out[0] > lo + 1e-9) out.unshift(lo);
      return out;
    };
    function draw() {
      holder.replaceChildren();
      const f = C.frame(holder, { x: [0, 4], y: [st.base, st.top], h: 262, pad: { l: 50, r: st.target ? 64 : 16, t: st.title ? 50 : 30, b: 44 }, label: K.tr('Weekly on-time delivery rate, weeks of Aug 3 to Aug 24') });
      C.axisY(f, ticks(st.base, st.top), (v) => `${Math.round(v * 1000) / 10}%`);
      if (st.title) f.add('grid', 'text', { x: 6, y: 18, class: 'strong', style: { fontSize: '13px' } }, st.title);
      WEEKS.forEach((w, i) => f.add('grid', 'text', { x: f.X(i + 0.5), y: f.H - f.P.b + 18, 'text-anchor': 'middle', class: i === 3 && st.emph ? 'strong' : null }, wkName(i)));
      if (st.emph) f.add('grid', 'text', { x: f.X(3.5), y: f.H - f.P.b + 32, 'text-anchor': 'middle' }, K.tr('latest week'));
      if (st.target && TARGET >= st.base && TARGET <= st.top) {
        f.add('top', 'line', { x1: f.P.l, x2: f.W - f.P.r, y1: f.Y(TARGET), y2: f.Y(TARGET), class: 's-guard' });
        f.add('top', 'text', { x: f.W - f.P.r + 5, y: f.Y(TARGET) + 4, 'text-anchor': 'start', class: 't-guard' }, K.tr('target 85%'));
      }
      const y0 = f.Y(st.base), bw = f.X(0.54) - f.X(0), pts = [];
      WEEKS.forEach((w, i) => {
        const r = RATE[i], x = f.X(i + 0.5), yv = f.Y(r), latest = i === 3;
        const cls = st.status ? (r >= TARGET ? 'f-ok-solid' : 'f-warn-solid') : (latest && st.emph ? 'f-b' : 'f-a');
        const mark = latest && st.emph ? { stroke: 'var(--ink)', strokeWidth: '2.5', strokeDasharray: '6 3' } : null;
        if (st.type === 'bar') {
          if (st.threeD) {
            const dx = 10, dy = 8;
            f.add('data', 'path', { d: `M${x + bw / 2},${yv} l${dx},${-dy} V${y0 - dy} l${-dx},${dy} Z`, class: 'f-line' });
            f.add('data', 'path', { d: `M${x - bw / 2},${yv} l${dx},${-dy} H${x + bw / 2 + dx} l${-dx},${dy} Z`, class: 'f-line', opacity: 0.7 });
          }
          f.add('data', 'rect', { x: x - bw / 2, y: yv, width: bw, height: Math.max(0, y0 - yv), rx: st.threeD ? 0 : 3, class: cls, style: mark });
        } else pts.push([x, yv]);
        const ly = st.type === 'bar' ? yv - (st.threeD ? 14 : 6) : yv - 12;
        const inside = st.type === 'bar' && y0 - yv > 26; // room for the denominator inside the bar
        if (st.labels) f.add('data', 'text', { x, y: st.denoms && !inside ? ly - 13 : ly, 'text-anchor': 'middle', class: 'strong' }, P1(r));
        if (st.denoms) f.add('data', 'text', inside ? { x, y: yv + 16, 'text-anchor': 'middle', class: 't-on' } : { x, y: ly, 'text-anchor': 'middle' }, `n = ${w.n}`);
      });
      if (st.type === 'line') {
        f.add('data', 'path', { d: 'M' + pts.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' L'), class: 'c-b' });
        pts.forEach(([x, y], i) => f.add('data', i === 3 && st.emph ? 'rect' : 'circle', i === 3 && st.emph
          ? { x: x - 7, y: y - 7, width: 14, height: 14, class: 'f-ink' } : { cx: x, cy: y, r: 5.5, class: 'f-b' }));
      }
    }
    draw();
    return { st, set(p) { Object.assign(st, p); draw(); } };
  }
  const chartA = (el, a) => weeklyChart(el, a, { base: 0.75, top: 0.9, threeD: true, status: true, labels: false, denoms: false, target: false, emph: false, title: K.tr('Delivery performance collapses') });

        scene: 'Exploring further, you split the latest week by <code>weekend_flag</code> (1 = Saturday or Sunday).',
        figure(el, a) {
          ordersExplorer(el, a, { show: ['order_id', 'completed_date', 'weekend_flag', 'item_count', 'on_time_kpi_flag'], filters: ['week_start', 'weekend_flag', 'on_time_kpi_flag', 'item_count'], preset: { week_start: '2026-08-24' } });
        },
        prompt: 'Compare weekend and weekday on-time counts in the latest week. What can you honestly say?',
        options: [
          { t: 'Weekend deliveries were on time less often. These records cannot say why.', ok: true },
          { t: 'Weekend understaffing caused the late deliveries.', hint: 'The file has no staffing records. Also, every late delivery had 3 items: order size is another possible explanation.' },
          { t: 'Weekend and weekday rates are about the same.', hint: 'Set weekend_flag = 1 and on_time_kpi_flag = 1: 72 of 142. Weekdays: 320 of 358.' },
        ],
        why: `<p>In the latest week, 72 of 142 weekend deliveries were on time (50.7%), against 320 of 358 on weekdays (89.4%). Weekend rates were lower in all four weeks.</p>
          <p>But every late delivery in the file also had 3 items, and the file has no staffing records. Order size, staffing, traffic or something else could be behind the gap. This is an exploratory lead to check, not a cause.</p>`,
      },

      /* ===== Part 3: Chart critique ===== */
      {
        id: 'chart-a', refs: ['4.1', '4.2'], part: 2, type: 'tiles',
        title: 'What is wrong with Chart A?',
        scene: 'This is Chart A from the dashboard, rebuilt from the real weekly rates. The numbers are right. The picture is not.',
        figure: (el, a) => { chartA(el, a); },
        prompt: 'Drag each defect to the problem it causes. One tile is not a defect.',
        slots: [
          { id: 's_exag', label: 'Exaggerates the size of the change' },
          { id: 's_access', label: 'Shuts out some readers' },
          { id: 's_claim', label: 'Claims more than the data show' },
          { id: 's_base', label: 'Hides what each rate is out of' },
        ],
        tiles: [
          { id: 't_title', t: 'Title: “Delivery performance collapses”' },
          { id: 't_order', t: 'Weeks shown in time order' },
          { id: 't_axis', t: '3D bars on an axis that starts at 75%' },
          { id: 't_n', t: 'No weekly denominators (n = 500)' },
          { id: 't_color', t: 'Colour is the only status cue (red and green)' },
        ],
        want: { s_exag: 't_axis', s_access: 't_color', s_claim: 't_title', s_base: 't_n' },
        hints: {
          t_order: 'Time order is the natural order for weeks. That is a strength, not a defect.',
          t_axis: 'A 75% start and 3D depth change how big the bars look. That is exaggeration.',
          t_color: 'Many readers cannot tell red from green, and grayscale prints lose colour. Colour alone shuts them out.',
          t_title: '“Collapses” is a claim. The data show one week that missed the target by 6.6 points.',
          t_n: 'Without n = 500, readers cannot see what each rate is out of.',
        },
        why: `<p>Chart A shows correct numbers in a misleading way.</p>
          <ul><li><b>Exaggeration:</b> 3D bars on a 75% start make a 9.2-point difference look huge.</li>
          <li><b>Accessibility:</b> red and green alone fail many readers and grayscale prints.</li>
          <li><b>Claim:</b> “collapses” is drama. One week missed the target by 6.6 points.</li>
          <li><b>Base:</b> without n = 500, readers cannot tell what each rate is out of.</li></ul>`,
      },
      {
        id: 'chart-a-ratio', refs: ['4.1'], part: 2, type: 'blanks',
        title: 'Measure the exaggeration',
        scene: 'Readers judge bars by height. On Chart A, every bar starts at the 75% line. The Aug 10 rate is 87.6% and the Aug 24 rate is 78.4%.',
        figure: (el, a) => { chartA(el, a); },
        prompt: 'Compare the drawn heights with the real rates.',
        lines: [
          'drawn heights above 75%: Aug 10 = 87.6 − 75 = 12.6, Aug 24 = 78.4 − 75 = {{h}}',
          'on Chart A, Aug 10 looks {{r}} times as tall as Aug 24',
          'real ratio of the rates: 87.6 / 78.4 = {{t}}',
        ],
        blanks: {
          h: { answer: 3.4, tol: 0.01, width: 5, label: 'Aug 24 bar height above 75%', hint: '78.4 − 75 = 3.4 points of drawn height.' },
          r: { accept: St.accept.near(3.71, 0.03), answer: 3.71, width: 5, label: 'Drawn height ratio', hint: '12.6 ÷ 3.4 ≈ 3.71.' },
          t: { accept: St.accept.near(1.12, 0.01), answer: 1.12, width: 5, label: 'Real ratio of the rates', hint: '87.6 ÷ 78.4 ≈ 1.12. The Aug 10 rate is only about 1.12 times the Aug 24 rate.' },
        },
        why: `<p>Above the 75% line, the Aug 10 bar is 12.6 points tall and the Aug 24 bar is 3.4. So Chart A draws Aug 10 about 3.71 times as tall.</p>
          <p>The real rates differ much less: 87.6 ÷ 78.4 ≈ 1.12. Chart A exaggerates the comparison about 3.3 times (3.71 ÷ 1.12).</p>`,
      },
      {
        id: 'baseline', refs: ['4.1'], part: 2, type: 'custom',
        title: 'Repair the axis',
        scene: 'The handle sets where the vertical axis starts. It begins where Chart A does, at 75%. The readout compares drawn height with the real rates.',
        prompt: 'Drag the axis start until bar height tells the truth: Aug 10 should look only 1.117 times as tall as Aug 24.',
        render(q, a) {
          let b = 75;
          let out = () => {};
          const upd = () => {
            const ok = b === 0;
            out([[K.tr('Axis starts at'), `${b}%`], [K.tr('Aug 10 bar ÷ Aug 24 bar'), `×${barRatio(b).toFixed(3)}`], [K.tr('Real ratio of the rates'), '×1.117'], [K.tr('Bar height honest?'), ok ? K.tr('Yes') : K.tr('No'), ok ? 'ok' : 'warn']]);
          };
          const hd = baseControl(q, a, { value: 75, onInput: (v) => { b = v; ch.set({ base: v / 100 }); upd(); a.changed(); } });
          const ch = weeklyChart(q, a, { base: 0.75, top: 0.9, labels: true, denoms: true, target: true, emph: true });
          out = a.readout(q);
          upd();
          return {
            ready: () => b !== 75,
            check() {
              if (b === 0) return { ok: true };
              if (b <= 10) return { ok: false, hint: 'Close. Any start above 0% trims every bar by the same amount, so the gap still looks too big. Go all the way to 0%.' };
              return { ok: false, hint: 'The bars still start well above zero, so the Aug 24 bar looks far shorter than it is. Keep dragging left.' };
            },
            reveal() { hd.set(0); },
            reset() {},
          };
        },
        key: '0% (only a zero start keeps bar height proportional: ×1.117 at 0%, ×1.119 at 1%, ×3.706 at 75%).',
        why: `<p>Readers judge bars by height. Height matches the value only when bars start at 0%. At 0% the Aug 10 bar is 1.117 times as tall as Aug 24, the same as the real ratio. At 1% it is already 1.119, and at 75% it is 3.706.</p>
          <p>The repaired chart starts at 0%, labels each bar with its rate and n = 500, draws the 85% target, and marks the latest week with a dashed outline, not colour alone.</p>`,
        ledger: { id: 'chart', value: 'Bars from 0%: ×1.12, not ×3.71; labels, n = 500, target, latest week marked' },
      },
      {
        id: 'line-or-bar', refs: ['4.1', '4.2'], part: 2, type: 'choice',
        title: 'Can a line zoom in?',
        scene: 'An analyst reader wants to see the week-to-week movement more closely. Switch between the three versions.',
        figure(el, a) {
          let ch = null;
          const views = { bar0: { type: 'bar', base: 0, top: 1 }, line70: { type: 'line', base: 0.7, top: 0.9 }, bar70: { type: 'bar', base: 0.7, top: 0.9 } };
          choose(el, a, { legend: K.tr('Show'), items: [['bar0', K.tr('Bars, 0% to 100%')], ['line70', K.tr('Line, 70% to 90%')], ['bar70', K.tr('Bars, 70% to 90%')]], value: 'bar0', onChange: (v) => ch.set(views[v]) });
          ch = weeklyChart(el, a, Object.assign({ labels: true, denoms: false, target: true, emph: true }, views.bar0));
        },
        prompt: 'Is a line chart with a 70% to 90% axis acceptable here?',
        options: [
          { t: 'Yes, if the axis range is labeled and the short four-week window is stated.', ok: true },
          { t: 'No. Every chart must start at zero.', hint: 'Zero is the rule for bars, because readers judge bar length. A line is read by position and slope.' },
          { t: 'Yes, and the line proves a stable downward trend.', hint: 'Four points cannot establish a stable trend. The rate went up, then down, then down.' },
          { t: 'Yes, as long as red and green show the status.', hint: 'Colour alone shuts out many readers. Add labels or a shape, as the dashed latest-week marker does.' },
        ],
        why: `<p>Bars encode value by length, so they need a zero start. A line encodes value by position and slope, so a zoomed range is acceptable when it is labeled and the purpose is week-to-week movement.</p>
          <p>Still label all four points and the target, say the window is only four weeks, and do not call it a stable trend. Compare “Bars, 70% to 90%”: the same zoom on bars exaggerates again.</p>`,
      },
      {
        id: 'title', refs: ['4.1', '5.1'], part: 2, type: 'choice',
        title: 'Write the title',
        scene: 'Your repaired chart is ready. It needs a title the director can read without you in the room.',
        prompt: 'Which title should go on the chart?',
        options: [
          { t: 'Week of August 24 on-time delivery was 78.4%, 6.6 percentage points below target', ok: true },
          { t: 'Delivery performance collapses', hint: '“Collapses” is drama the data do not show. The three earlier weeks ran 84.0% to 87.6%.' },
          { t: 'Weekend understaffing caused a 6.6% drop in on-time delivery', hint: 'Two problems: the records cannot show a cause, and the gap is 6.6 points, not 6.6%.' },
          { t: 'On-time delivery is in steady decline and will miss again', hint: 'Four weekly points do not show a stable trend, and they cannot forecast the next week.' },
        ],
        why: `<p>A good explanatory title states the checked takeaway: the week, the rate and the gap to target. Every number traces to a cell: 392 ÷ 500 = 78.4%, and 78.4 − 85.0 = −6.6.</p>
          <p>Remove cause words, drama words and forecasts unless separate evidence supports them.</p>`,
        ledger: { id: 'title', value: 'Week of Aug 24: 78.4%, 6.6 points below target' },
      },
      {
        id: 'labels', refs: ['5.2'], part: 2, tier: 'Bridge', type: 'tiles',
        title: 'Label each sentence',
        scene: 'Your draft story has four sentences. Each one carries a different level of certainty.',
        prompt: 'Drag each sentence to its label.',
        slots: [
          { id: 'obs', label: 'Observation<br><small>directly countable</small>' },
          { id: 'inf', label: 'Inference<br><small>reaches beyond the rows</small>' },
          { id: 'asm', label: 'Assumption<br><small>relied on, not yet checked</small>' },
          { id: 'rec', label: 'Recommendation<br><small>bounded action</small>' },
        ],
        tiles: [
          { id: 't_rec', t: 'Review order-level timing and staffing records before changing the schedule.' },
          { id: 't_inf', t: 'Next month will show a similar on-time rate.' },
          { id: 't_obs', t: '392 of 500 eligible deliveries were on time in the week of Aug 24.' },
          { id: 't_asm', t: 'Every on_time_kpi_flag follows the promised-time rule.' },
        ],
        want: { obs: 't_obs', inf: 't_inf', asm: 't_asm', rec: 't_rec' },
        hints: {
          t_obs: 'You can count this directly in the file. That makes it an observation.',
          t_inf: 'Next month is outside the observed rows. That is an inference, and an unsupported one.',
          t_asm: 'You rely on the flag being right, but you have not audited the timestamps. That is an assumption.',
          t_rec: 'This is the bounded action the director can take. That is a recommendation.',
        },
        why: `<p><b>Observation:</b> directly countable in the file. <b>Inference:</b> a claim beyond the observed rows, such as next month. <b>Assumption:</b> something you rely on but have not checked. <b>Recommendation:</b> the bounded action.</p>
          <p>Labeling each sentence stops a story from quietly raising its certainty.</p>`,
      },
      {
        id: 'decision', refs: ['5.1', '5.2'], part: 2, type: 'choice',
        title: 'Make the call',
        figure(el, a) {
          const rows = [
            [K.tr('Latest rate meets the 85% target'), K.tr('78.4%, 6.6 points below'), 'warn', K.tr('Fail')],
            [K.tr('Complaints within the 3% guardrail'), '14 / 500 = 2.8%', 'ok', K.tr('Pass')],
            [K.tr('Numbers trace to source counts'), '392 + 108 = 500', 'ok', K.tr('Pass')],
            [K.tr('Records identify the cause'), K.tr('no staffing data in the file'), 'warn', K.tr('Not shown')],
          ];
          el.append(a.h('ul', { class: 'lk-checklist', 'aria-label': K.tr('Evidence checklist') },
            rows.map(([t, ev, tone, chip]) => a.h('li', null, a.h('span', null, t, a.h('small', null, ev)), a.chip(chip, tone)))));
        },
        scene: 'The director wants one recommendation before the next scheduling cycle.',
        prompt: 'What do you recommend?',
        options: [
          { t: 'Investigate weekend staffing and order records before changing the schedule.', ok: true },
          { t: 'Add weekend staff now, because staffing caused the miss.', hint: 'The records show a miss, not its cause. Change staffing once evidence links staffing to lateness.' },
          { t: 'Do nothing. The four-week rate, 83.75%, is close to target.', hint: 'That pools away the latest week. The decision is about the latest 6.6-point miss.' },
          { t: 'Wait until complaints break the guardrail, then act.', hint: 'The guardrail held at 2.8%, but the KPI missed. Act on the KPI and keep watching the guardrail.' },
        ],
        praise: (S) => {
          const calls = ['Change weekend staffing now', 'Leave staffing as it is', 'Investigate first, then decide'];
          const g = S.polls.hook;
          return g == null ? K.tr('Right call.') : K.tr('Right call. Your gut call at the start was “{call}”. Now you can back your answer with evidence.').replace('{call}', K.tr(calls[g]));
        },
        why: `<p>The KPI missed: 78.4%, 6.6 points below target. The guardrail held at 2.8%. The records describe the miss but contain no staffing data, so they cannot show its cause.</p>
          <p>The bounded action is to investigate first: order-level timing by day, order size and staffing rosters. Change the schedule only when evidence links staffing to lateness.</p>`,
        ledger: { id: 'decision', value: 'Investigate first; change staffing only on linked evidence' },
      },
      {
        id: 'bench', refs: ['recap'], part: 2, type: 'read',
        title: 'Your chart bench',
        callout: 'Name the grain. Count before you divide. Start bars at zero, show the base, and claim only what the rows show.',
        body: ['This is Chart A again. Repair it with the controls and watch the checklist. Try breaking it again, too.'],
        figure(el, a) {
          const st = { base: 75, type: 'bar', threeD: true, labels: false, denoms: false, target: false, emph: false, title: 0 };
          const ctrls = a.h('div', { class: 'lk-controls' });
          el.append(ctrls);
          const chartBox = a.h('div');
          el.append(chartBox);
          const list = a.h('ul', { class: 'lk-checklist', 'aria-label': K.tr('Checks for your chart') });
          el.append(list);
          const ch = weeklyChart(chartBox, a, {});
          const draw = () => {
            ch.set({ base: st.base / 100, top: st.base === 0 ? 1 : 0.9, type: st.type, threeD: st.threeD, status: !st.emph, labels: st.labels, denoms: st.denoms, target: st.target, emph: st.emph, title: TITLES()[st.title] });
            const gates = [
              [K.tr('Bars start at 0%, or the chart is a labeled line'), st.type === 'line' || st.base === 0],
              [K.tr('Flat 2D marks, no 3D'), !st.threeD || st.type === 'line'],
              [K.tr('Every value has a direct label'), st.labels],
              [K.tr('Denominators visible (n = 500)'), st.denoms],
              [K.tr('85% target drawn and labeled'), st.target],
              [K.tr('Latest week marked without relying on colour'), st.emph],
              [K.tr('Title states what was observed, with no cause or drama'), st.title === 1],
            ];
            const all = gates.every((g) => g[1]);
            list.replaceChildren(...gates.map(([t, ok]) => a.h('li', null, a.h('span', null, t), a.chip(ok ? K.tr('Pass') : K.tr('Fix'), ok ? 'ok' : 'warn'))),
              a.h('li', null, a.h('span', null, a.h('b', null, K.tr('Verdict'))), a.chip(all ? K.tr('Ready to send') : K.tr('Repair first'), all ? 'ok' : 'warn')));
          };
          a.slider(ctrls, { label: K.tr('Axis starts at'), min: 0, max: 78, step: 1, value: st.base, fmt: (v) => `${v}%`, onInput: (v) => { st.base = v; draw(); } });
          choose(ctrls, a, { legend: K.tr('Chart type'), items: [['bar', K.tr('Bars')], ['line', K.tr('Line')]], value: 'bar', onChange: (v) => { st.type = v; draw(); } });
          const marks = a.h('fieldset', { class: 'lk-x-filters' }, a.h('legend', null, K.tr('Marks and labels')));
          ctrls.append(marks);
          tick(marks, a, K.tr('3D effect'), st.threeD, (v) => { st.threeD = v; draw(); });
          tick(marks, a, K.tr('Direct % labels'), st.labels, (v) => { st.labels = v; draw(); });
          tick(marks, a, K.tr('Show n = 500'), st.denoms, (v) => { st.denoms = v; draw(); });
          tick(marks, a, K.tr('85% target line'), st.target, (v) => { st.target = v; draw(); });
          tick(marks, a, K.tr('Mark latest week with a dashed outline'), st.emph, (v) => { st.emph = v; draw(); });
          choose(ctrls, a, { legend: K.tr('Title'), items: TITLES().map((t, i) => [i, t]), value: 0, onChange: (v) => { st.title = v; draw(); } });
          draw();
        },
      },
    ],
    onFinish(S, a) {
      const graded = Object.keys(S.res).length;
      const firsts = Object.values(S.res).filter((v) => v === 'first').length;
      K.confetti();
      K.sheet(K.tr('Lesson complete'), [
        a.h('p', null, K.tr('You earned {pts} points: {firsts} first-try answers across {graded} questions.').replace('{pts}', S.pts).replace('{firsts}', firsts).replace('{graded}', graded)),
        a.h('p', null, K.tr('Your evidence file stays in the case panel. Use Back or the part bar to revisit any screen before the midterm on October 21.')),
      ]);
    },
  });
})();

</script>

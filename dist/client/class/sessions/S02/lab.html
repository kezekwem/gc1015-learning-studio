span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mi mathvariant=\"normal\">/</mi><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">3/6</annotation></semantics></math></span> unreminded orders were on time. This is directly countable.</li><li><b>Inference:</b> Whether a similar gap holds for all future eligible orders is unknown. The selected extract cannot establish it.</li><li><b>Assumption:</b> The recorded “On time” and “Reminder sent” fields follow the operational definitions and contain no unexamined missing cases. That assumption still needs verification.</li><li><b>Recommendation:</b> Do not scale reminders from this table alone. Ask the data owner to audit timestamps, excluded orders, and mode-specific denominators; then plan a limited comparison with guardrail monitoring.</li></ul>\n<p>The ethical boundary is practical: use order-level data with minimal identifiers, restrict access, and avoid presenting staff-selected reminders as proof of staff performance or customer behavior. Later sessions provide sampling uncertainty, A/B guardrails, association analysis, and model diagnostics. None should be smuggled into today’s descriptive result.</p>\n<p><b>Failure mode:</b> A recommendation can be appropriately cautious yet still fail if nobody owns its next step. Here the operations manager can request the audit, while the data owner must document definitions and exclusions.</p>\n<p><b>Try it — ungraded.</b> Label this statement: “All eligible orders next month will show the same 33.3-point gap.”</p>\n<p><b>Explained answer:</b> It is an unsupported <b>inference</b>, not an observation. The observed gap describes only the displayed orders; the extract’s selection and group imbalance make that forecast especially fragile.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>Start with a stakeholder’s decision and the action the analysis might enable.</li><li>Write a KPI contract: eligible population, time window, grain, numerator, denominator, exclusions, and units.</li><li>Pair an improvement target with a defined guardrail; label invented thresholds as provisional.</li><li>One order per row does not mean one row per customer or per message.</li><li>Check measurement rules and provenance before trusting a correct-looking calculation.</li><li>Compare groups using their own denominators; show counts beside percentages.</li><li>Describe an observed gap as a gap, not as causal impact or a forecast.</li><li>Validate software output against a hand count and source-quality checks.</li><li>Use a chart whose title, scale, labels, table, and accessibility support its claim.</li><li>End with a bounded recommendation, the unresolved limits, an owner, and a next action.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<ul><li><b>Basket:</b> Dollar value of one order; $32 for order 101.</li><li><b>Categorical variable:</b> A label defining a group; “Pickup” is a mode category.</li><li><b>Convenience extract:</b> Records selected because they were readily available; the first 12 completed orders here.</li><li><b>Denominator:</b> The eligible cases beneath a rate; six reminder-Yes orders in that group’s rate.</li><li><b>Grain:</b> What one row represents; one completed order in this table.</li><li><b>Guardrail:</b> A measure that watches for possible harm while pursuing a target; the share with prep over 40 minutes.</li><li><b>Inference:</b> A conclusion extending beyond directly observed records; a claim about next month would be one.</li><li><b>KPI:</b> A defined measure for monitoring a decision; the on-time handoff rate.</li><li><b>Key:</b> A field intended to identify a case uniquely; Order ID at order grain.</li><li><b>Numerator:</b> Cases meeting the rate’s condition; eight on-time orders overall.</li><li><b>Observation:</b> A recorded case or a directly supported description of cases; order 101 is a case.</li><li><b>Operational definition:</b> The rule turning a concept into a field; “at or before recorded promise time” defines on time here.</li><li><b>Population:</b> All cases the decision is meant to address; next month’s eligible orders.</li><li><b>Provenance:</b> The record of data origins and transformations; which system supplied handoff time and how “On time” was derived.</li><li><b>Quantitative variable:</b> A measured amount with meaningful numeric differences; prep minutes.</li><li><b>Target:</b> A proposed performance threshold; at least 80% on time in this fictional case.</li><li><b>Unit of analysis:</b> The entity counted or compared; an order, not a message.</li><li><b>Variable:</b> A characteristic that can differ between cases; reminder status differs between orders.</li></ul>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>Heckert, N. A., &amp; Filliben, J. J. (2003). <i>NIST/SEMATECH e-handbook of statistical methods: Chapter 1, exploratory data analysis</i>. National Institute of Standards and Technology. <a href=\"https://www.nist.gov/publications/nistsematech-e-handbook-statistical-methods-chapter-1-exploratory-data-analysis\" target=\"_blank\" rel=\"noopener\">https://www.nist.gov/publications/nistsematech-e-handbook-statistical-methods-chapter-1-exploratory-data-analysis</a></p>\n<p>IBM. (n.d.-a). <i>CELLS subcommand (CROSSTABS command): IBM SPSS Statistics 31.0.0</i>. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=crosstabs-cells-subcommand-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=crosstabs-cells-subcommand-command</a></p>\n<p>IBM. (n.d.-b). <i>Overview (MEANS command): IBM SPSS Statistics 31.0.0</i>. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=means-overview-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=means-overview-command</a></p>\n<p>Microsoft. (n.d.-a). <i>SUMIFS function</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/functions/sumifs-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/functions/sumifs-function</a></p>\n<p>Microsoft. (n.d.-b). <i>Ways to count values in a worksheet</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/ways-to-count-values-in-a-worksheet\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/ways-to-count-values-in-a-worksheet</a></p>\n<p>OpenStax. (2023). <i>1.2 Data, sampling, and variation in data and sampling</i>. In <i>Introductory business statistics 2e</i>. <a href=\"https://openstax.org/books/introductory-business-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/introductory-business-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling</a></p>\n<p>Penn State Department of Statistics. (n.d.-a). <i>1 Collecting data</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson01\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson01</a></p>\n<p>Penn State Department of Statistics. (n.d.-b). <i>2 Describing data, part 1</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson02\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson02</a></p>\n<p>World Wide Web Consortium. (n.d.). <i>Complex images</i>. Web Accessibility Initiative. <a href=\"https://www.w3.org/WAI/tutorials/images/complex/\" target=\"_blank\" rel=\"noopener\">https://www.w3.org/WAI/tutorials/images/complex/</a></p>"}]};
globalThis.LESSON_I18N = {"zh":{"S02P Lab Checkpoints":"S02P 实验检查点","GC1015 · Session 2 · Build it in Excel or SPSS, check it here":"GC1015 · 第 2 课 · 在 Excel 或 SPSS 中构建，在这里核对","Finish":"完成","Your lab results":"你的实验结果","Get set":"准备就绪","Class practices 1 to 5":"课堂练习 1 至 5","Steps 1 and 2: KPI_Build":"第 1 和第 2 步：KPI_Build","Step 3: Chart_Build":"第 3 步：Chart_Build","Step 4: Self_Check and Response":"第 4 步：Self_Check 和 Response","Lab files":"实验文件","Work in your saved copy <code>S02P_FirstName_LastName_NetID.xlsx</code>. Pale-yellow cells are yours to build; pale-lavender cells are worked guidance.":"请在你保存的副本 <code>S02P_FirstName_LastName_NetID.xlsx</code> 中操作。浅黄色单元格由你来构建；浅紫色单元格是已完成的示范指导。","Part":"部分","Sheet":"工作表","Finish check":"完成检查","Class practices":"课堂练习","Class_Practice, Slide_Practice":"Class_Practice, Slide_Practice","5 hand-offs":"5 项交付","Steps 1 and 2":"第 1 和第 2 步","KPI_Build":"KPI_Build","E10 = 78.4%":"E10 = 78.4%","Step 3":"第 3 步","Chart_Build":"Chart_Build","axis 0% to 100%":"坐标轴 0% 至 100%","Step 4":"第 4 步","Self_Check, Response":"Self_Check, Response","B7: 3 sentences":"B7：3 句话","Dataset: orders_story.csv, one row per eligible completed delivery, August 3 to 30, 2026 (2,000 rows), loaded as table Orders.":"数据集：orders_story.csv，每行是一笔符合条件的已完成配送，时间为 2026 年 8 月 3 日至 30 日（2,000 行），已作为表 Orders 载入。","SPSS: Blocks H1 to H5 type the slide-case values; the Guided Step 2 block imports the CSV.":"SPSS：H1 至 H5 代码块直接输入幻灯片案例的数值；Guided Step 2 代码块导入 CSV。","Practice only. Nothing here is graded.":"仅供练习。这里的内容都不计分。","Step 1: KPI_Build!B3:B5":"第 1 步：KPI_Build!B3:B5","Checkpoint GP-A":"检查点 GP-A","Step 2: latest week, row 10":"第 2 步：最近一周，第 10 行","Step 2: four-week row 11":"第 2 步：四周合计，第 11 行","Step 2: late checks, row 18":"第 2 步：延误检查，第 18 行","Step 3: chart axis":"第 3 步：图表坐标轴","Step 4: Response!B7":"第 4 步：Response!B7","Meet orders_story.csv":"认识 orders_story.csv","Count first, then calculate. If your workbook disagrees with a simple count, check the formula.":"先计数，再计算。如果你的工作簿和简单计数对不上，就检查公式。","This is the raw MetroMeal file, loaded in your workbook as table <code>Orders</code> on sheet <code>Orders_Story</code>. Each row is one eligible completed delivery. Use the filters to count rows before you trust a formula.":"这是 MetroMeal 的原始文件，在你的工作簿中作为表 <code>Orders</code> 载入，位于工作表 <code>Orders_Story</code>。每行是一笔符合条件的已完成配送。在相信任何公式之前，先用筛选器数一数行数。","Class practice 1: HarborCare, then MetroMeal":"课堂练习 1：先 HarborCare，再 MetroMeal","HarborCare: 46 no-shows and 12 complaints among 400 eligible appointments. MetroMeal (<code>Slide_Practice</code>): 392 on time, 500 eligible, target 0.85, 14 complaints.":"HarborCare：400 个符合条件的预约中有 46 次爽约、12 次投诉。MetroMeal（<code>Slide_Practice</code>）：392 单准时，500 单符合条件，目标 0.85，14 次投诉。","Type what your cells show.":"输入你的单元格显示的值。","<p>HarborCare: 11.5% no-shows, 1.5 points above its 10.0% maximum target; complaints 3.0%, within the 4.0% guardrail. MetroMeal: 78.4% on time, −6.6 points to target; complaints 2.8%, within 3.0%.</p>\n          <p>SPSS Block H1 shows the same values: rate .784, gap_pp −6.6, complaint_rate .028.</p>":"<p>HarborCare：爽约率 11.5%，比 10.0% 的上限目标高 1.5 个百分点；投诉率 3.0%，在 4.0% 的护栏指标之内。MetroMeal：准时率 78.4%，距目标 −6.6 个百分点；投诉率 2.8%，在 3.0% 之内。</p><p>SPSS 的 H1 代码块显示相同的数值：rate .784，gap_pp −6.6，complaint_rate .028。</p>","Class_Practice!B15  no-show rate = {{ns}}":"Class_Practice!B15  爽约率 = {{ns}}","Class_Practice!B16  complaint rate = {{hc}}":"Class_Practice!B16  投诉率 = {{hc}}","Slide_Practice!B11  on-time rate = {{r}}":"Slide_Practice!B11  准时率 = {{r}}","Slide_Practice!B12  target gap = {{g}}":"Slide_Practice!B12  与目标的差距 = {{g}}","Slide_Practice!B13  complaint rate = {{c}}":"Slide_Practice!B13  投诉率 = {{c}}","B15 = B12 / B13 = 46 / 400 = 0.115, shown as 11.5%.":"B15 = B12 / B13 = 46 / 400 = 0.115，显示为 11.5%。","B15 no-show rate":"B15 爽约率","B16 = B14 / B13 = 12 / 400. If you see 26.1%, you divided by the 46 no-shows instead of all 400 appointments.":"B16 = B14 / B13 = 12 / 400。如果你看到 26.1%，说明你除以了 46 次爽约，而不是全部 400 个预约。","B16 complaint rate":"B16 投诉率","B11 = B6 / B7 = 392 / 500.":"B11 = B6 / B7 = 392 / 500。","Slide_Practice B11 on-time rate":"Slide_Practice B11 准时率","B12 = (B11 − B8) * 100. If you see −0.066, you left out * 100. If you see 6.6, you subtracted in the wrong order.":"B12 = (B11 − B8) * 100。如果你看到 −0.066，说明你漏了 * 100。如果你看到 6.6，说明减法顺序反了。","Slide_Practice B12 target gap":"Slide_Practice B12 与目标的差距","B13 = B9 / B7 = 14 / 500. Divide by eligible deliveries, not on-time ones.":"B13 = B9 / B7 = 14 / 500。要除以符合条件的配送数，而不是准时配送数。","Slide_Practice B13 complaint rate":"Slide_Practice B13 投诉率","Class practice 1: what goes in B17?":"课堂练习 1：B17 应该填什么？","HarborCare’s month: 11.5% no-shows against a 10.0% maximum target. Only this one month is supplied.":"HarborCare 的这个月：爽约率 11.5%，上限目标为 10.0%。只提供了这一个月的数据。","Which clause should B17 mark as unsupported?":"B17 应该把哪一句标为缺乏证据支持？","<p>“Getting worse” needs an aligned earlier period, and one month has none. The month also cannot show that reminder scheduling caused the result. Ask for a comparable earlier period under the same KPI definition, plus reminder records.</p>":"<p>“越来越差”需要一个可对齐的更早时期作比较，而只有一个月的数据没有这样的时期。这一个月也无法说明是提醒安排导致了这个结果。应要求提供同一 KPI 定义下可比的更早时期数据，以及提醒记录。</p>","No-show performance is getting worse.":"爽约情况越来越差。","The no-show rate was 1.5 points above the 10% target.":"爽约率比 10% 的目标高 1.5 个百分点。","That is supported: 11.5% − 10.0% = 1.5 points, from this month’s counts.":"这一句有依据：11.5% − 10.0% = 1.5 个百分点，来自本月的计数。","The 3.0% complaint rate was within the 4% guardrail.":"3.0% 的投诉率在 4% 的护栏指标之内。","That is supported: 12 / 400 = 3.0%, below 4.0%.":"这一句有依据：12 / 400 = 3.0%，低于 4.0%。","Class practice 2: NorthLine and the four-week rate":"课堂练习 2：NorthLine 与四周比率","NorthLine: 684 of 760 eligible calls resolved within 5 minutes; target 92%. MetroMeal (<code>Slide_Practice</code>): weekly on-time counts 420, 438, 425 and 392, each out of 500.":"NorthLine：760 通符合条件的来电中有 684 通在 5 分钟内解决；目标 92%。MetroMeal（<code>Slide_Practice</code>）：每周准时数为 420、438、425 和 392，每周的分母都是 500。","<p>NorthLine: 684 ÷ 760 = 90.0%, 2.0 points below its 92.0% target. If another analyst adds abandoned calls to the denominator, that is a different KPI version, not the same KPI.</p>\n          <p>MetroMeal: 1,675 ÷ 2,000 = 83.75%. A simple average of the four rates matches only because every week has 500 deliveries. SPSS Block H2 shows overall_rate .8375.</p>":"<p>NorthLine：684 ÷ 760 = 90.0%，比 92.0% 的目标低 2.0 个百分点。如果另一位分析师把放弃的来电也加进分母，那就是另一个版本的 KPI，而不是同一个 KPI。</p><p>MetroMeal：1,675 ÷ 2,000 = 83.75%。四个比率的简单平均之所以与之相同，只是因为每周都有 500 单配送。SPSS 的 H2 代码块显示 overall_rate .8375。</p>","Class_Practice!B30  rate = {{nr}}":"Class_Practice!B30  比率 = {{nr}}","Class_Practice!B31  target gap = {{ng}}":"Class_Practice!B31  与目标的差距 = {{ng}}","Slide_Practice!B34  four-week rate = {{fw}}":"Slide_Practice!B34  四周比率 = {{fw}}","B30 = B21 / B22 = 684 / 760 = 0.90.":"B30 = B21 / B22 = 684 / 760 = 0.90。","B30 NorthLine rate":"B30 NorthLine 比率","B31 = (B30 − B23) * 100 = (0.90 − 0.92) × 100.":"B31 = (B30 − B23) * 100 = (0.90 − 0.92) × 100。","B31 NorthLine target gap":"B31 NorthLine 与目标的差距","B34 = SUM(B21:B24) / SUM(B25:B28) = 1,675 / 2,000. If you see 3.35, you added the four rates instead of dividing summed counts.":"B34 = SUM(B21:B24) / SUM(B25:B28) = 1,675 / 2,000。如果你看到 3.35，说明你把四个比率加了起来，而不是用计数之和相除。","B34 four-week rate":"B34 四周比率","Class practice 3: count the rows":"课堂练习 3：数一数行数","BrightCart: 120 order rows and 310 item rows. MetroMeal (<code>Slide_Practice</code>): 2,000 delivery rows, 4 weekly rows, and the two-order example with order A on 3 item rows and order B on 1.":"BrightCart：120 个订单行和 310 个商品行。MetroMeal（<code>Slide_Practice</code>）：2,000 个配送行、4 个周行，以及一个两笔订单的例子：订单 A 占 3 个商品行，订单 B 占 1 个。","<p>A join to items repeats each order once per item: BrightCart’s 120 orders become 310 rows. In the MetroMeal example, 2 orders become 4 rows, so counting rows turns a 1 of 2 on-time rate (50%) into 1 of 4 (25%).</p>\n          <p>SPSS Block H3 aggregates the 4 item rows back to 2 order rows.</p>":"<p>与商品表连接（join）时，每个商品都会让订单重复一次：BrightCart 的 120 个订单变成 310 行。在 MetroMeal 的例子中，2 笔订单变成 4 行，所以按行计数会把 2 单中 1 单准时（50%）变成 4 行中 1 行准时（25%）。</p><p>SPSS 的 H3 代码块把 4 个商品行汇总回 2 个订单行。</p>","Class_Practice!B49  rows after joining items to orders = {{bj}}":"Class_Practice!B49  把商品连接到订单后的行数 = {{bj}}","Slide_Practice!B39  raw rows = {{raw}}    B40  weekly rows = {{wk}}":"Slide_Practice!B39  原始行数 = {{raw}}    B40  周行数 = {{wk}}","Slide_Practice!B51  joined rows = {{jr}}    C51  distinct orders = {{dor}}":"Slide_Practice!B51  连接后的行数 = {{jr}}    C51  不同订单数 = {{dor}}","Every item row keeps its own row after the join, so B49 = B46 = 310. If you typed 120, you counted orders, not joined rows.":"连接后每个商品行都保留自己的一行，所以 B49 = B46 = 310。如果你输入了 120，说明你数的是订单，而不是连接后的行。","B49 joined rows":"B49 连接后的行数","One row per eligible completed delivery: 2,000.":"每笔符合条件的已完成配送一行：2,000。","B39 raw rows":"B39 原始行数","One row per week: August 3, 10, 17 and 24.":"每周一行：8 月 3 日、10 日、17 日和 24 日。","B40 weekly rows":"B40 周行数","B51 = COUNTA(B47:B50): A, A, A and B.":"B51 = COUNTA(B47:B50)：A、A、A 和 B。","B51 joined rows":"B51 连接后的行数","C51 = ROWS(UNIQUE(B47:B50)): A and B. If you see 4, UNIQUE is missing.":"C51 = ROWS(UNIQUE(B47:B50))：A 和 B。如果你看到 4，说明漏了 UNIQUE。","C51 distinct orders":"C51 不同订单数","Class practice 3: delete the repeats?":"课堂练习 3：删掉重复行吗？","BrightCart’s joined table shows some order_id values 2, 3 or more times. Management wants an order-level return rate.":"BrightCart 连接后的表中，有些 order_id 出现了 2 次、3 次甚至更多。管理层想要一个订单层面的退货率。","What should you do before calculating the rate?":"计算比率之前，你应该先做什么？","<p>Repeated order IDs can be valid evidence that the table is at item grain. State both grains, confirm the one-to-many relationship, then aggregate items to one row per order before computing an order-level rate.</p>":"<p>重复的订单 ID 可能恰好是有效证据，说明这张表是商品粒度。先写明两种粒度，确认一对多的关系，然后把商品汇总成每个订单一行，再计算订单层面的比率。</p>","Confirm the item grain, then aggregate to one row per order.":"确认商品粒度，然后汇总成每个订单一行。","Delete the repeated order_id rows, because they are duplicates.":"删除重复的 order_id 行，因为它们是重复数据。","They may be valid item rows. Deleting them also deletes item information you may need.":"它们可能是有效的商品行。删除它们也会删掉你可能需要的商品信息。","Keep the joined rows, because more rows make the rate more accurate.":"保留连接后的行，因为行越多，比率越准确。","Repeating an order gives it more weight. Orders with more items would count more than once.":"重复一个订单会给它更大的权重。商品越多的订单会被计算不止一次。","Class practice 4: RiverTown and Chart A":"课堂练习 4：RiverTown 与图表 A","RiverTown attendance: 72 of 80, 54 of 60 and 30 of 50 eligible residents. MetroMeal (<code>Slide_Practice</code>): latest rate in B59, target 0.85 in B60.":"RiverTown 的出席情况：符合条件的居民中，80 人有 72 人、60 人有 54 人、50 人有 30 人出席。MetroMeal（<code>Slide_Practice</code>）：最近的比率在 B59，目标 0.85 在 B60。","<p>January and February tie at 90.0%, even though February had fewer attendees, because its denominator was smaller. A bar axis that starts at 50% would make March’s 60.0% look tiny.</p>\n          <p>MetroMeal’s Chart A has the same flaw on a 75% to 90% axis. B69 confirms the latest gap of −6.6 points that belongs in the repaired title.</p>":"<p>1 月和 2 月同为 90.0%，尽管 2 月出席人数更少，因为它的分母也更小。如果柱形图的坐标轴从 50% 开始，3 月的 60.0% 会显得非常小。</p><p>MetroMeal 的图表 A 在 75% 到 90% 的坐标轴上有同样的缺陷。B69 确认了最近一周 −6.6 个百分点的差距，这个数字应该写进修正后的标题。</p>","Class_Practice!B63  January = {{j}}":"Class_Practice!B63  1 月 = {{j}}","Class_Practice!B64  February = {{fe}}":"Class_Practice!B64  2 月 = {{fe}}","Class_Practice!B65  March = {{mr}}":"Class_Practice!B65  3 月 = {{mr}}","Slide_Practice!B69  latest target gap = {{g}}":"Slide_Practice!B69  最近一周与目标的差距 = {{g}}","B63 = B56 / B57 = 72 / 80.":"B63 = B56 / B57 = 72 / 80。","B63 January rate":"B63 1 月比率","B64 = B58 / B59 = 54 / 60 = 0.90. February has fewer attendees but the same rate.":"B64 = B58 / B59 = 54 / 60 = 0.90。2 月出席人数更少，但比率相同。","B64 February rate":"B64 2 月比率","B65 = B60 / B61 = 30 / 50.":"B65 = B60 / B61 = 30 / 50。","B65 March rate":"B65 3 月比率","B69 = (B59 − B60) * 100 = (0.784 − 0.85) × 100.":"B69 = (B59 − B60) * 100 = (0.784 − 0.85) × 100。","Slide_Practice B69 target gap":"Slide_Practice B69 与目标的差距","Class practice 5: GreenBlock, then the MetroMeal check":"课堂练习 5：先 GreenBlock，再核对 MetroMeal","GreenBlock: 273 of 300 eligible repairs on time; target 95%. MetroMeal (SPSS Block H5): 392 on time, 108 late, 500 eligible.":"GreenBlock：300 次符合条件的维修中有 273 次准时完成；目标 95%。MetroMeal（SPSS 的 H5 代码块）：392 单准时，108 单延误，500 单符合条件。","Type what your cells and SPSS show.":"输入你的单元格和 SPSS 显示的值。","<p>GreenBlock: 91.0%, 4.0 points below target. MetroMeal reconciles: 392 + 108 = 500, so reconcile = 0. Write in Slide_Practice!B88 how you checked at least one number this way.</p>":"<p>GreenBlock：91.0%，比目标低 4.0 个百分点。MetroMeal 的数字能对上：392 + 108 = 500，所以 reconcile = 0。在 Slide_Practice!B88 中写下你如何用这种方式核对了至少一个数字。</p>","Class_Practice!B77  rate = {{gr}}":"Class_Practice!B77  比率 = {{gr}}","Class_Practice!B78  target gap = {{gg}}":"Class_Practice!B78  与目标的差距 = {{gg}}","SPSS H5  reconcile = ontime + late − eligible = {{rc}}":"SPSS H5  reconcile = ontime + late − eligible = {{rc}}","B77 = B74 / B75 = 273 / 300.":"B77 = B74 / B75 = 273 / 300。","B77 GreenBlock rate":"B77 GreenBlock 比率","B78 = (B77 − B76) * 100 = (0.91 − 0.95) × 100.":"B78 = (B77 − B76) * 100 = (0.91 − 0.95) × 100。","B78 GreenBlock target gap":"B78 GreenBlock 与目标的差距","392 + 108 − 500 = 0. Any other value means the counts do not add up.":"392 + 108 − 500 = 0。任何其他值都说明计数对不上。","SPSS reconcile value":"SPSS reconcile 值","Class practice 5: the weakest sentence":"课堂练习 5：最站不住脚的一句","GreenBlock’s draft story says a new scheduling policy caused the 4.0-point miss. Only three descriptive months are available.":"GreenBlock 的报告草稿说，新的排班政策导致了 4.0 个百分点的未达标。可用的只有三个月的描述性数据。","Which sentence is most vulnerable to overclaiming?":"哪一句最容易犯过度推断的错误？","<p>A causal claim needs variation in policy exposure, comparable groups or periods, reliable scheduling records and checks for other explanations. Three descriptive months support “investigate the policy”, not “the policy caused it”.</p>":"<p>因果结论需要政策暴露程度上的差异、可比的组或时期、可靠的排班记录，以及对其他解释的排查。三个月的描述性数据只支持“调查这项政策”，不支持“是这项政策导致的”。</p>","The new scheduling policy caused the miss.":"新的排班政策导致了未达标。","273 of 300 eligible repairs were completed on time.":"300 次符合条件的维修中有 273 次准时完成。","That is a count from the records. Anyone can check it.":"这是记录中的计数，任何人都可以核对。","The rate was 4.0 points below the 95% target.":"比率比 95% 的目标低 4.0 个百分点。","That is supported: 91.0% − 95.0% = −4.0 points.":"这一句有依据：91.0% − 95.0% = −4.0 个百分点。","Step 1 · GP-A: source and grain checks":"第 1 步 · GP-A：数据源与粒度检查","In <code>KPI_Build</code>, B3 counts rows (GP.1), B4 counts distinct order IDs (GP.2) and B5 sums the eligibility flag (GP.3).":"在 <code>KPI_Build</code> 中，B3 计算行数（GP.1），B4 计算不同订单 ID 的数量（GP.2），B5 对资格标记求和（GP.3）。","Type what B3 to B5 show.":"输入 B3 至 B5 显示的值。","<p>B3 = B4 = 2,000, so order_id is unique at this grain and works as the key. B5 = 2,000, so every row is eligible. Grain sentence: each row is one eligible completed delivery, August 3 to 30, 2026.</p>":"<p>B3 = B4 = 2,000，所以 order_id 在这个粒度上是唯一的，可以作为键。B5 = 2,000，所以每一行都符合条件。粒度句：每行是一笔符合条件的已完成配送，时间为 2026 年 8 月 3 日至 30 日。</p>","B3  =ROWS(Orders[order_id]) = {{b3}}":"B3  =ROWS(Orders[order_id]) = {{b3}}","B4  =ROWS(UNIQUE(Orders[order_id])) = {{b4}}":"B4  =ROWS(UNIQUE(Orders[order_id])) = {{b4}}","B5  =SUM(Orders[eligible_kpi_flag]) = {{b5}}":"B5  =SUM(Orders[eligible_kpi_flag]) = {{b5}}","With no filters, the explorer shows Rows = 2000.":"不加任何筛选时，数据浏览器显示 Rows = 2000。","B3 source rows":"B3 源数据行数","Each order_id appears once. If you see 1000, you used customer_id: each customer has 2 deliveries.":"每个 order_id 只出现一次。如果你看到 1000，说明你用的是 customer_id：每位顾客有 2 笔配送。","B4 distinct order IDs":"B4 不同订单 ID 数","All 2,000 rows have eligible_kpi_flag = 1.":"全部 2,000 行的 eligible_kpi_flag = 1。","B5 eligible rows":"B5 符合条件的行数","2,000 rows = 2,000 order IDs = 2,000 eligible":"2,000 行 = 2,000 个订单 ID = 2,000 行符合条件","Step 2 · GP-B: weekly counts":"第 2 步 · GP-B：每周计数","Column C counts eligible deliveries per week (500 each). Column D sums on_time_kpi_flag per week (GP.14 to GP.17). Column G sums complaint_flag (GP.26 to GP.29).":"C 列统计每周符合条件的配送数（每周 500）。D 列按周对 on_time_kpi_flag 求和（GP.14 至 GP.17）。G 列对 complaint_flag 求和（GP.26 至 GP.29）。","Check D7 to D10 and G10 with the explorer, then type them.":"先用数据浏览器核对 D7 至 D10 和 G10，再输入这些值。","<p>On time by week: 420, 438, 425 and 392, each out of 500. Complaints in the latest week: 14. SUMIFS on a 0/1 flag counts the 1s, so it gives the same numbers as these filters.</p>":"<p>每周准时数：420、438、425 和 392，每周分母都是 500。最近一周的投诉：14 次。对 0/1 标记使用 SUMIFS 会统计其中的 1，所以结果与这些筛选得到的数字相同。</p>","D7 (Aug 3) = {{d7}}":"D7（8 月 3 日）= {{d7}}","D8 (Aug 10) = {{d8}}":"D8（8 月 10 日）= {{d8}}","D9 (Aug 17) = {{d9}}":"D9（8 月 17 日）= {{d9}}","D10 (Aug 24) = {{d10}}":"D10（8 月 24 日）= {{d10}}","G10 (Aug 24 complaints) = {{g10}}":"G10（8 月 24 日这一周的投诉）= {{g10}}","Filter week_start = 2026-08-03 and on_time_kpi_flag = 1.":"筛选 week_start = 2026-08-03 且 on_time_kpi_flag = 1。","D7 on time, week of Aug 3":"D7 准时数，8 月 3 日这一周","Filter week_start = 2026-08-10 and on_time_kpi_flag = 1.":"筛选 week_start = 2026-08-10 且 on_time_kpi_flag = 1。","D8 on time, week of Aug 10":"D8 准时数，8 月 10 日这一周","Filter week_start = 2026-08-17 and on_time_kpi_flag = 1.":"筛选 week_start = 2026-08-17 且 on_time_kpi_flag = 1。","D9 on time, week of Aug 17":"D9 准时数，8 月 17 日这一周","Filter week_start = 2026-08-24 and on_time_kpi_flag = 1. If you see 108, you counted the late ones.":"筛选 week_start = 2026-08-24 且 on_time_kpi_flag = 1。如果你看到 108，说明你数的是延误的配送。","D10 on time, week of Aug 24":"D10 准时数，8 月 24 日这一周","Filter week_start = 2026-08-24 and complaint_flag = 1. If you see 47, week_start is not set.":"筛选 week_start = 2026-08-24 且 complaint_flag = 1。如果你看到 47，说明没有设置 week_start。","G10 complaints, week of Aug 24":"G10 投诉数，8 月 24 日这一周","Step 2 · GP-B: the latest week, row 10":"第 2 步 · GP-B：最近一周，第 10 行","C10 = 500, D10 = 392 and G10 = 14. The target is in B14 (0.85) and the guardrail in B15 (0.03).":"C10 = 500，D10 = 392，G10 = 14。目标在 B14（0.85），护栏指标在 B15（0.03）。","Type what E10, F10 and H10 show.":"输入 E10、F10 和 H10 显示的值。","<p>E10 = 392 ÷ 500 = 78.4%. F10 = (0.784 − 0.85) × 100 = −6.6 percentage points. H10 = 14 ÷ 500 = 2.8%, within the 3% guardrail. SPSS’s Guided Step 2 block shows rate .784, gap −6.6 and complaint rate .028 for the latest week.</p>":"<p>E10 = 392 ÷ 500 = 78.4%。F10 = (0.784 − 0.85) × 100 = −6.6 个百分点。H10 = 14 ÷ 500 = 2.8%，在 3% 的护栏指标之内。SPSS 的 Guided Step 2 代码块显示，最近一周的比率为 .784，差距为 −6.6，投诉率为 .028。</p>","E10  on-time rate = {{e10}}":"E10  准时率 = {{e10}}","F10  target gap = {{f10}}":"F10  与目标的差距 = {{f10}}","H10  complaint rate = {{h10}}":"H10  投诉率 = {{h10}}","E10 = D10 / C10. If you see 1.276, you divided C10 by D10.":"E10 = D10 / C10。如果你看到 1.276，说明你用 C10 除以了 D10。","E10 on-time rate":"E10 准时率","F10 = (E10 − $B$14) * 100. If you see −0.066, you left out * 100; the unit is percentage points.":"F10 = (E10 − $B$14) * 100。如果你看到 −0.066，说明你漏了 * 100；单位是百分点。","F10 target gap":"F10 与目标的差距","H10 = G10 / C10 = 14 / 500. If you see 3.6%, you divided by D10, the 392 on-time deliveries.":"H10 = G10 / C10 = 14 / 500。如果你看到 3.6%，说明你除以了 D10，也就是 392 单准时配送。","H10 complaint rate":"H10 投诉率","E10 78.4%, F10 −6.6, H10 2.8%":"E10 78.4%, F10 −6.6, H10 2.8%","Step 2 · GP-B: the four-week row 11":"第 2 步 · GP-B：四周合计，第 11 行","Row 11 sums the counts first (GP.35, GP.36 and GP.39), then divides.":"第 11 行先对计数求和（GP.35、GP.36 和 GP.39），再做除法。","Type what row 11 shows.":"输入第 11 行显示的值。","<p>1,675 ÷ 2,000 = 83.75%, 1.25 points below target; complaints 47 ÷ 2,000 = 2.35%. AVERAGE(E7:E10) would also give 83.75% here, but only because all four denominators are 500. Count first, then divide.</p>":"<p>1,675 ÷ 2,000 = 83.75%，比目标低 1.25 个百分点；投诉率 47 ÷ 2,000 = 2.35%。这里 AVERAGE(E7:E10) 也会得到 83.75%，但这只是因为四个分母都是 500。先计数，再相除。</p>","D11 = SUM(D7:D10) = {{d11}}":"D11 = SUM(D7:D10) = {{d11}}","E11 = D11 / C11 = {{e11}}":"E11 = D11 / C11 = {{e11}}","F11  target gap = {{f11}}":"F11  与目标的差距 = {{f11}}","H11 = G11 / C11 = {{h11}}":"H11 = G11 / C11 = {{h11}}","D11 four-week on-time count":"D11 四周准时数","E11 = 1,675 / 2,000. If you see 3.35, you summed the rates in E7:E10.":"E11 = 1,675 / 2,000。如果你看到 3.35，说明你把 E7:E10 中的比率加了起来。","E11 four-week rate":"E11 四周比率","F11 four-week target gap":"F11 四周与目标的差距","H11 = G11 / C11 = 47 / 2,000.":"H11 = G11 / C11 = 47 / 2,000。","H11 four-week complaint rate":"H11 四周投诉率","1,675 / 2,000 = 83.75%, gap −1.25":"1,675 / 2,000 = 83.75%，差距 −1.25","Step 2 · GP-B: late-delivery checks, row 18":"第 2 步 · GP-B：延误配送检查，第 18 行","Row 18 summarizes only the latest week’s late deliveries: late_minutes greater than 0. The explorer is already filtered to them.":"第 18 行只汇总最近一周的延误配送：late_minutes 大于 0。数据浏览器已经筛选出这些配送。","Type what C18 to G18 show.":"输入 C18 至 G18 显示的值。","<p>108 late deliveries: mean 12.4 minutes, median 7, 90th percentile 31, and the two routes to the late count agree (0). The mean sits above the median because 10 deliveries were 50 or more minutes late. That is a reason to inspect the distribution in Session 3, not proof of a cause.</p>":"<p>108 单延误配送：均值 12.4 分钟，中位数 7，第 90 百分位数 31，两种计算延误数的方法结果一致（0）。均值高于中位数，是因为有 10 单延误了 50 分钟或更久。这是在第 3 课检查分布的理由，而不是原因的证明。</p>","C18  late deliveries = {{c18}}":"C18  延误配送数 = {{c18}}","D18  mean minutes late = {{d18}}":"D18  平均延误分钟数 = {{d18}}","E18  median minutes late = {{e18}}":"E18  延误分钟数中位数 = {{e18}}","F18  90th percentile = {{f18}}":"F18  第 90 百分位数 = {{f18}}","G18  reconciliation = {{g18}}":"G18  核对值 = {{g18}}","C18 = C10 − D10 = 500 − 392.":"C18 = C10 − D10 = 500 − 392。","C18 late deliveries":"C18 延误配送数","If you see 2.68, you averaged all 500 rows, including 392 zeros. AVERAGEIFS needs late_minutes \">0\".":"如果你看到 2.68，说明你对全部 500 行求了平均，其中包括 392 个零。AVERAGEIFS 需要条件 late_minutes \">0\"。","D18 mean minutes late":"D18 平均延误分钟数","If you see 0, your FILTER kept the on-time rows with 0 late minutes.":"如果你看到 0，说明你的 FILTER 保留了延误分钟数为 0 的准时行。","E18 median minutes late":"E18 延误分钟数中位数","Use PERCENTILE.INC on the 108 late values. If you see 12, the FILTER kept all 500 rows.":"对 108 个延误值使用 PERCENTILE.INC。如果你看到 12，说明 FILTER 保留了全部 500 行。","F18 90th percentile":"F18 第 90 百分位数","G18 = C10 − D10 − C18 should be 0.":"G18 = C10 − D10 − C18 应该等于 0。","G18 reconciliation":"G18 核对值","108 late: mean 12.4, median 7, P90 31, check 0":"108 单延误：均值 12.4，中位数 7，P90 31，核对 0","Step 2 · GP.47: what does H18 say?":"第 2 步 · GP.47：H18 显示什么？","H18 = IF(AND(E10 &lt; $B$14, H10 &lt;= $B$15), \"Investigate, guardrail within limit\", \"Review KPI and guardrail\")":"H18 = IF(AND(E10 &lt; $B$14, H10 &lt;= $B$15), \"Investigate, guardrail within limit\", \"Review KPI and guardrail\")","With your row 10 values, what does H18 display, and what does it mean?":"用你第 10 行的数值，H18 会显示什么？这又意味着什么？","<p>E10 = 0.784 &lt; 0.85 and H10 = 0.028 ≤ 0.03, so both conditions hold and H18 reads “Investigate, guardrail within limit”. It turns checked numbers into a bounded next step, not a diagnosis.</p>":"<p>E10 = 0.784 &lt; 0.85，且 H10 = 0.028 ≤ 0.03，所以两个条件都成立，H18 显示“Investigate, guardrail within limit”。它把核对过的数字变成一个有边界的下一步，而不是诊断。</p>","“Investigate, guardrail within limit”: the KPI missed and complaints held.":"“Investigate, guardrail within limit”：KPI 未达标，投诉率守住了护栏指标。","“Review KPI and guardrail”: both measures failed.":"“Review KPI and guardrail”：两项指标都没达标。","H10 = 2.8% is within 3%, and E10 is below 85%, so the AND is true and H18 shows the first message.":"H10 = 2.8% 在 3% 之内，E10 低于 85%，所以 AND 为真，H18 显示第一条信息。","“Investigate, guardrail within limit”: staffing caused the miss.":"“Investigate, guardrail within limit”：人员配置导致了未达标。","The status says what to do next. It does not name a cause.":"这个状态说明下一步做什么，并不指出原因。","Step 3 · GP.67: the direct label in E8":"第 3 步 · GP.67：E8 中的直接标签","E8 = TEXT(B8,\"0.0%\")&amp;\" (n = \"&amp;D8&amp;\")\". B8 links KPI_Build!E10 and D8 links KPI_Build!C10.":"E8 = TEXT(B8,\"0.0%\")&amp;\" (n = \"&amp;D8&amp;\")\"。B8 链接到 KPI_Build!E10，D8 链接到 KPI_Build!C10。","What should E8 display?":"E8 应该显示什么？","<p>Each direct label carries the rate and its denominator: 84.0%, 87.6%, 85.0% and 78.4%, each with n = 500. Link every chart cell to KPI_Build instead of retyping values, so the chart updates when the checked numbers do.</p>":"<p>每个直接标签都带有比率和它的分母：84.0%、87.6%、85.0% 和 78.4%，每个都标注 n = 500。把每个图表单元格链接到 KPI_Build，而不是重新输入数值，这样核对过的数字一变，图表也会跟着更新。</p>","78.4% (n = 500)":"78.4% (n = 500)","0.784 (n = 500)":"0.784 (n = 500)","TEXT(B8,\"0.0%\") turns 0.784 into 78.4%. Check the format code inside TEXT.":"TEXT(B8,\"0.0%\") 会把 0.784 变成 78.4%。检查 TEXT 里面的格式代码。","78.4% (n = 392)":"78.4% (n = 392)","n is the denominator. D8 must link KPI_Build!C10, the 500 eligible deliveries, not D10.":"n 是分母。D8 必须链接到 KPI_Build!C10，也就是 500 单符合条件的配送，而不是 D10。","The label also carries the denominator, so readers see what the rate is out of.":"标签还要带上分母，这样读者才能看出这个比率是以多少为基数的。","Step 3: set the vertical axis":"第 3 步：设置纵坐标轴","Right-click the vertical axis, then choose Format Axis. Your rates are stored as decimals, such as 0.784.":"右键单击纵坐标轴，然后选择“设置坐标轴格式 (Format Axis)”。你的比率是以小数形式存储的，例如 0.784。","Which bounds give an honest bar chart?":"哪组边界能得到诚实的柱形图？","<p>Bars are judged by length, so the axis must start at 0. Because the rates are stored as decimals, 1 means 100%. Then add the target line, direct labels from E5:E8 and a pattern or outline on the latest bar.</p>":"<p>读者通过长度来判断柱形，所以坐标轴必须从 0 开始。因为比率以小数存储，1 就代表 100%。然后加上目标线、来自 E5:E8 的直接标签，并给最近一周的柱形加上图案或轮廓。</p>","Minimum 0, Maximum 1":"最小值 0，最大值 1","Minimum 0.75, Maximum 0.9":"最小值 0.75，最大值 0.9","That is Chart A. A 75% start makes the Aug 10 bar look 3.7 times as tall as Aug 24, when the rates differ by a factor of 1.12.":"这就是图表 A。从 75% 开始，会让 8 月 10 日的柱形看起来是 8 月 24 日的 3.7 倍高，而两者的比率只相差 1.12 倍。","Minimum 0, Maximum 100":"最小值 0，最大值 100","The rates are decimals, so 100 means 10,000%. The bars would be tiny. Use 1.":"比率是小数，所以 100 表示 10,000%。柱形会变得非常小。请用 1。","Leave Excel’s automatic bounds":"保留 Excel 的自动边界","For values this close together, Excel may choose a minimum above 0. Set 0 and 1 yourself.":"数值这么接近时，Excel 可能会选一个大于 0 的最小值。请自己设置 0 和 1。","Minimum 0, Maximum 1 (0% to 100%)":"最小值 0，最大值 1（0% 至 100%）","Step 3: critique fields B12 to B15":"第 3 步：评析栏 B12 至 B15","Chart_Build asks for four short entries about Chart A and your repair.":"Chart_Build 要求你就图表 A 和你的修正填写四条简短内容。","Drag each entry to its cell. One tile belongs in none of them.":"把每条内容拖到对应的单元格。有一张卡片不属于任何一个单元格。","<p>Statistical defect: the 75% start and missing denominators. Accessibility defect: colour as the only cue. Repair: zero-based axis, direct labels with n = 500, target line and a non-colour marker. Title: the observed comparison, with no cause, drama or forecast.</p>":"<p>统计缺陷：从 75% 开始的坐标轴和缺失的分母。无障碍缺陷：颜色是唯一的提示。修正：从零开始的坐标轴、带 n = 500 的直接标签、目标线，以及不依赖颜色的标记。标题：陈述观察到的比较，不写原因、不渲染、不预测。</p>","Red and green are the only status cue":"红色和绿色是唯一的状态提示","Weekend staffing caused the latest weekly drop":"周末人员配置导致了最近一周的下降","Latest observed weekly on-time rate was below the 85.0% target":"最近观察到的每周准时率低于 85.0% 的目标","Bars start at 75% and show no denominators":"柱形从 75% 开始，且没有显示分母","0% to 100% axis, labels with n = 500, 85% target line, patterned latest bar":"0% 至 100% 的坐标轴、带 n = 500 的标签、85% 目标线、最近一周柱形加图案","B12 statistical defect":"B12 统计缺陷","B13 accessibility defect":"B13 无障碍缺陷","B14 repair":"B14 修正","B15 bounded title":"B15 有边界的标题","The records do not show a cause. Keep this sentence out of every field.":"记录并不能显示原因。不要把这句话写进任何一栏。","A truncated axis and missing denominators distort the numbers themselves. That is the statistical defect.":"截断的坐标轴和缺失的分母会扭曲数字本身。这就是统计缺陷。","Colour alone shuts out readers who cannot tell red from green. That is the accessibility defect.":"只靠颜色会把分不清红绿的读者排除在外。这就是无障碍缺陷。","This lists what you change. That is the repair.":"这列出了你要改什么。这就是修正。","This states the observed comparison with no cause. That is the bounded title.":"这陈述了观察到的比较，没有提原因。这就是有边界的标题。","Step 4 · GP-D: a ✗ on Self_Check":"第 4 步 · GP-D：Self_Check 上出现 ✗","The check labeled “Latest complaint rate” shows ✗.":"标为“Latest complaint rate”的检查项显示 ✗。","Where do you fix it?":"你应该在哪里修正？","<p>Self_Check only reads your analysis cells. Repair the cell its table names: H10 = G10 / C10. The usual slip is dividing by D10, the on-time count, which gives 3.6% instead of 2.8%.</p>":"<p>Self_Check 只读取你的分析单元格。请修正它的表格中指出的单元格：H10 = G10 / C10。常见的失误是除以 D10（准时数），这样得到的是 3.6%，而不是 2.8%。</p>","KPI_Build!H10: it must divide G10 by C10.":"KPI_Build!H10：它必须用 G10 除以 C10。","On Self_Check: type ✓ over the formula.":"在 Self_Check 上：用 ✓ 覆盖公式。","Never type on Self_Check. Its formulas read your analysis cells.":"永远不要在 Self_Check 上输入内容。它的公式会读取你的分析单元格。","Chart_Build!B8: relink the rate.":"Chart_Build!B8：重新链接比率。","That is the chart’s rate link. The complaint rate lives in KPI_Build!H10.":"那是图表的比率链接。投诉率在 KPI_Build!H10 中。","Step 4: three sentences for Response!B7":"第 4 步：为 Response!B7 写三句话","The director wants exactly three sentences: what the evidence shows, what it does not show, and what to do next.":"总监要的正好是三句话：证据显示了什么，没有显示什么，以及下一步做什么。","Drag one sentence into each position. Two tiles do not belong.":"把一句话拖到每个位置。有两张卡片不属于这里。","<p>This is a model, not text to copy. Write your own three sentences in Response!B7. A limitation that says the data do not show what caused the delay is correct, even though it contains the word “caused”.</p>":"<p>这是一个示范，不是让你照抄的文字。请在 Response!B7 中写出你自己的三句话。如果一句局限说明写的是数据没有显示是什么导致了延误，那它是正确的，尽管其中出现了“导致”（caused）这个词。</p>","Review order-level timing and weekend staffing records before changing the schedule.":"在调整排班之前，先审查订单层面的时间记录和周末人员配置记录。","Weekend understaffing caused a delivery collapse, so add staff now.":"周末人手不足导致了配送崩溃，所以现在就增加人手。","In the week of Aug 24, 392 of 500 deliveries (78.4%) were on time, 6.6 points below target; complaints were 2.8%.":"在 8 月 24 日这一周，500 单配送中有 392 单（78.4%）准时，比目标低 6.6 个百分点；投诉率为 2.8%。","On-time delivery fell 6.6% and will keep falling.":"准时配送下降了 6.6%，而且会继续下降。","Four descriptive weeks do not show that staffing caused the miss or predict the next cycle.":"四周的描述性数据既不能说明是人员配置导致了未达标，也不能预测下一个周期。","1. What the evidence shows":"1. 证据显示了什么","2. What it does not show":"2. 证据没有显示什么","3. What to do next":"3. 下一步做什么","Cause and drama the records cannot support. Keep all three sentences bounded.":"记录无法支持其中的原因和渲染。三句话都要保持有边界。","The gap is 6.6 percentage points, not 6.6%, and four weeks cannot forecast.":"差距是 6.6 个百分点，不是 6.6%，而且四周的数据无法用来预测。","This sentence reports the checked numbers. It belongs first.":"这句话报告核对过的数字，应该放在第一句。","This sentence names the limit of the evidence. It belongs second.":"这句话指出证据的局限，应该放在第二句。","This sentence is the bounded next step. It belongs last.":"这句话是有边界的下一步，应该放在最后。","Evidence, limit, next step: drafted":"证据、局限、下一步：已起草","Bring this to the group studio":"把这些带到小组工作坊","State the decision and the grain. Trace every number to counts. Keep the claim inside the observed evidence.":"说明决策和粒度。让每个数字都能追溯到计数。结论不要超出观察到的证据。","Save your workbook as <code>S02P_FirstName_LastName_NetID.xlsx</code>. The practice is ungraded, but the instructor may ask to see it for feedback.":"把工作簿另存为 <code>S02P_FirstName_LastName_NetID.xlsx</code>。这项练习不计分，但老师可能会要求查看，以便给你反馈。","Your evidence chain: 2,000 source rows, four weekly count pairs, 392 of 500 (78.4%), −6.6 points to target, 14 of 500 complaints (2.8%), an honest linked chart, and a bounded three-sentence response.":"你的证据链：2,000 行源数据、四组每周计数、500 单中 392 单（78.4%）、距目标 −6.6 个百分点、500 单中 14 次投诉（2.8%）、一张诚实且链接到数据的图表，以及一段有边界的三句话回应。","Open this page from the class site to see the dataset.":"请从课程网站打开此页面以查看数据集。","Lab checkpoints complete":"实验检查点已完成","Your checkpoint answers are saved in this browser. Keep your workbook for feedback in the group studio.":"你的检查点答案已保存在此浏览器中。请保留你的工作簿，以便在小组工作坊中获得反馈。"},"es":{"S02P Lab Checkpoints":"Puntos de control del laboratorio S02P","GC1015 · Session 2 · Build it in Excel or SPSS, check it here":"GC1015 · Sesión 2 · Constrúyelo en Excel o SPSS, compruébalo aquí","Finish":"Terminar","Your lab results":"Tus resultados del laboratorio","Get set":"Prepárate","Class practices 1 to 5":"Prácticas de clase 1 a 5","Steps 1 and 2: KPI_Build":"Pasos 1 y 2: KP . If your workbook disagrees with a simple count, check the formula.":"Primero cuenta, luego calcula. Si tu libro no coincide con un conteo simple, revisa la fórmula.","This is the raw MetroMeal file, loaded in your workbook as table <code>Orders</code> on sheet <code>Orders_Story</code>. Each row is one eligible completed delivery. Use the filters to count rows before you trust a formula.":"Este es el archivo original de MetroMeal, cargado en tu libro como la tabla <code>Orders</code> en la hoja <code>Orders_Story</code>. Cada fila es una entrega completada elegible. Usa los filtros para contar filas antes de confiar en una fórmula.","Class practice 1: HarborCare, then MetroMeal":"Práctica de clase 1: HarborCare, luego MetroMeal","HarborCare: 46 no-shows and 12 complaints among 400 eligible appointments. MetroMeal (<code>Slide_Practice</code>): 392 on time, 500 eligible, target 0.85, 14 complaints.":"HarborCare: 46 inasistencias y 12 quejas entre 400 citas elegibles. MetroMeal (<code>Slide_Practice</code>): 392 a tiempo, 500 elegibles, meta 0.85, 14 quejas.","Type what your cells show.":"Escribe lo que muestran tus celdas.","<p>HarborCare: 11.5% no-shows, 1.5 points above its 10.0% maximum target; complaints 3.0%, within the 4.0% guardrail. MetroMeal: 78.4% on time, −6.6 points to target; complaints 2.8%, within 3.0%.</p>\n          <p>SPSS Block H1 shows the same values: rate .784, gap_pp −6.6, complaint_rate .028.</p>":"<p>HarborCare: 11.5% de inasistencias, 1.5 puntos por encima de su meta máxima de 10.0%; quejas 3.0%, dentro de la salvaguarda de 4.0%. MetroMeal: 78.4% a tiempo, −6.6 puntos respecto a la meta; quejas 2.8%, dentro de 3.0%.</p><p>El bloque H1 de SPSS muestra los mismos valores: rate .784, gap_pp −6.6, complaint_rate .028.</p>","Class_Practice!B15  no-show rate = {{ns}}":"Class_Practice!B15  tasa de inasistencia = {{ns}}","Class_Practice!B16  complaint rate = {{hc}}":"Class_Practice!B16  tasa de quejas = {{hc}}","Slide_Practice!B11  on-time rate = {{r}}":"Slide_Practice!B11  tasa a tiempo = {{r}}","Slide_Practice!B12  target gap = {{g}}":"Slide_Practice!B12  brecha con la meta = {{g}}","Slide_Practice!B13  complaint rate = {{c}}":"Slide_Practice!B13  tasa de quejas = {{c}}","B15 = B12 / B13 = 46 / 400 = 0.115, shown as 11.5%.":"B15 = B12 / B13 = 46 / 400 = 0.115, que se muestra como 11.5%.","B15 no-show rate":"B15 tasa de inasistencia","B16 = B14 / B13 = 12 / 400. If you see 26.1%, you divided by the 46 no-shows instead of all 400 appointments.":"B16 = B14 / B13 = 12 / 400. Si ves 26.1%, dividiste entre las 46 inasistencias en lugar de entre las 400 citas.","B16 complaint rate":"B16 tasa de quejas","B11 = B6 / B7 = 392 / 500.":"B11 = B6 / B7 = 392 / 500.","Slide_Practice B11 on-time rate":"Slide_Practice B11 tasa a tiempo","B12 = (B11 − B8) * 100. If you see −0.066, you left out * 100. If you see 6.6, you subtracted in the wrong order.":"B12 = (B11 − B8) * 100. Si ves −0.066, omitiste * 100. Si ves 6.6, restaste en el orden equivocado.","Slide_Practice B12 target gap":"Slide_Practice B12 brecha con la meta","B13 = B9 / B7 = 14 / 500. Divide by eligible deliveries, not on-time ones.":"B13 = B9 / B7 = 14 / 500. Divide entre las entregas elegibles, no entre las entregas a tiempo.","Slide_Practice B13 complaint rate":"Slide_Practice B13 tasa de quejas","Class practice 1: what goes in B17?":"Práctica de clase 1: ¿qué va en B17?","HarborCare’s month: 11.5% no-shows against a 10.0% maximum target. Only this one month is supplied.":"El mes de HarborCare: 11.5% de inasistencias frente a una meta máxima de 10.0%. Solo se da este mes.","Which clause should B17 mark as unsupported?":"¿Qué afirmación debería marcar B17 como no respaldada?","<p>“Getting worse” needs an aligned earlier period, and one month has none. The month also cannot show that reminder scheduling caused the result. Ask for a comparable earlier period under the same KPI definition, plus reminder records.</p>":"<p>“Está empeorando” necesita un periodo anterior comparable, y un solo mes no lo tiene. Ese mes tampoco puede mostrar que la programación de recordatorios causó el resultado. Pide un periodo anterior comparable con la misma definición del KPI, además de los registros de recordatorios.</p>","No-show performance is getting worse.":"El desempeño en inasistencias está empeorando.","The no-show rate was 1.5 points above the 10% target.":"La tasa de inasistencia estuvo 1.5 puntos por encima de la meta de 10%.","That is supported: 11.5% − 10.0% = 1.5 points, from this month’s counts.":"Eso está respaldado: 11.5% − 10.0% = 1.5 puntos, a partir de los conteos de este mes.","The 3.0% complaint rate was within the 4% guardrail.":"La tasa de quejas de 3.0% estuvo dentro de la salvaguarda de 4%.","That is supported: 12 / 400 = 3.0%, below 4.0%.":"Eso está respaldado: 12 / 400 = 3.0%, por debajo de 4.0%.","Class practice 2: NorthLine and the four-week rate":"Práctica de clase 2: NorthLine y la tasa de cuatro semanas","NorthLine: 684 of 760 eligible calls resolved within 5 minutes; target 92%. MetroMeal (<code>Slide_Practice</code>): weekly on-time counts 420, 438, 425 and 392, each out of 500.":"NorthLine: 684 de 760 llamadas elegibles se resolvieron en 5 minutos o menos; meta 92%. MetroMeal (<code>Slide_Practice</code>): conteos semanales a tiempo de 420, 438, 425 y 392, cada uno de 500.","<p>NorthLine: 684 ÷ 760 = 90.0%, 2.0 points below its 92.0% target. If another analyst adds abandoned calls to the denominator, that is a different KPI version, not the same KPI.</p>\n          <p>MetroMeal: 1,675 ÷ 2,000 = 83.75%. A simple average of the four rates matches only because every week has 500 deliveries. SPSS Block H2 shows overall_rate .8375.</p>":"<p>NorthLine: 684 ÷ 760 = 90.0%, 2.0 puntos por debajo de su meta de 92.0%. Si otro analista agrega las llamadas abandonadas al denominador, eso es otra versión del KPI, no el mismo KPI.</p><p>MetroMeal: 1,675 ÷ 2,000 = 83.75%. Un promedio simple de las cuatro tasas coincide solo porque cada semana tiene 500 entregas. El bloque H2 de SPSS muestra overall_rate .8375.</p>","Class_Practice!B30  rate = {{nr}}":"Class_Practice!B30  tasa = {{nr}}","Class_Practice!B31  target gap = {{ng}}":"Class_Practice!B31  brecha con la meta = {{ng}}","Slide_Practice!B34  four-week rate = {{fw}}":"Slide_Practice!B34  tasa de cuatro semanas = {{fw}}","B30 = B21 / B22 = 684 / 760 = 0.90.":"B30 = B21 / B22 = 684 / 760 = 0.90.","B30 NorthLine rate":"B30 tasa de NorthLine","B31 = (B30 − B23) * 100 = (0.90 − 0.92) × 100.":"B31 = (B30 − B23) * 100 = (0.90 − 0.92) × 100.","B31 NorthLine target gap":"B31 brecha con la meta de NorthLine","B34 = SUM(B21:B24) / SUM(B25:B28) = 1,675 / 2,000. If you see 3.35, you added the four rates instead of dividing summed counts.":"B34 = SUM(B21:B24) / SUM(B25:B28) = 1,675 / 2,000. Si ves 3.35, sumaste las cuatro tasas en lugar de dividir los conteos sumados.","B34 four-week rate":"B34 tasa de cuatro semanas","Class practice 3: count the rows":"Práctica de clase 3: cuenta las filas","BrightCart: 120 order rows and 310 item rows. MetroMeal (<code>Slide_Practice</code>): 2,000 delivery rows, 4 weekly rows, and the two-order example with order A on 3 item rows and order B on 1.":"BrightCart: 120 filas de pedidos y 310 filas de artículos. MetroMeal (<code>Slide_Practice</code>): 2,000 filas de entregas, 4 filas semanales y el ejemplo de dos pedidos, con el pedido A en 3 filas de artículos y el pedido B en 1.","<p>A join to items repeats each order once per item: BrightCart’s 120 orders become 310 rows. In the MetroMeal example, 2 orders become 4 rows, so counting rows turns a 1 of 2 on-time rate (50%) into 1 of 4 (25%).</p>\n          <p>SPSS Block H3 aggregates the 4 item rows back to 2 order rows.</p>":"<p>Una unión (join) con artículos repite cada pedido una vez por artículo: los 120 pedidos de BrightCart se convierten en 310 filas. En el ejemplo de MetroMeal, 2 pedidos se convierten en 4 filas, así que contar filas convierte una tasa a tiempo de 1 de 2 (50%) en 1 de 4 (25%).</p><p>El bloque H3 de SPSS agrega las 4 filas de artículos de vuelta a 2 filas de pedidos.</p>","Class_Practice!B49  rows after joining items to orders = {{bj}}":"Class_Practice!B49  filas después de unir artículos con pedidos = {{bj}}","Slide_Practice!B39  raw rows = {{raw}}    B40  weekly rows = {{wk}}":"Slide_Practice!B39  filas originales = {{raw}}    B40  filas semanales = {{wk}}","Slide_Practice!B51  joined rows = {{jr}}    C51  distinct orders = {{dor}}":"Slide_Practice!B51  filas unidas = {{jr}}    C51  pedidos distintos = {{dor}}","Every item row keeps its own row after the join, so B49 = B46 = 310. If you typed 120, you counted orders, not joined rows.":"Cada fila de artículo conserva su propia fila después de la unión, así que B49 = B46 = 310. Si escribiste 120, contaste pedidos, no filas unidas.","B49 joined rows":"B49 filas unidas","One row per eligible completed delivery: 2,000.":"Una fila por entrega completada elegible: 2,000.","B39 raw rows":"B39 filas originales","One row per week: August 3, 10, 17 and 24.":"Una fila por semana: 3, 10, 17 y 24 de agosto.","B40 weekly rows":"B40 filas semanales","B51 = COUNTA(B47:B50): A, A, A and B.":"B51 = COUNTA(B47:B50): A, A, A y B.","B51 joined rows":"B51 filas unidas","C51 = ROWS(UNIQUE(B47:B50)): A and B. If you see 4, UNIQUE is missing.":"C51 = ROWS(UNIQUE(B47:B50)): A y B. Si ves 4, falta UNIQUE.","C51 distinct orders":"C51 pedidos distintos","Class practice 3: delete the repeats?":"Práctica de clase 3: ¿borrar las repeticiones?","BrightCart’s joined table shows some order_id values 2, 3 or more times. Management wants an order-level return rate.":"La tabla unida de BrightCart muestra algunos valores de order_id 2, 3 o más veces. La gerencia quiere una tasa de devoluciones a nivel de pedido.","What should you do before calculating the rate?":"¿Qué debes hacer antes de calcular la tasa?","<p>Repeated order IDs can be valid evidence that the table is at item grain. State both grains, confirm the one-to-many relationship, then aggregate items to one row per order before computing an order-level rate.</p>":"<p>Los ID de pedido repetidos pueden ser evidencia válida de que la tabla está a granularidad de artículo. Indica ambas granularidades, confirma la relación de uno a muchos y luego agrega los artículos a una fila por pedido antes de calcular una tasa a nivel de pedido.</p>","Confirm the item grain, then aggregate to one row per order.":"Confirma la granularidad de artículo y luego agrega a una fila por pedido.","Delete the repeated order_id rows, because they are duplicates.":"Borra las filas de order_id repetidas, porque son duplicados.","They may be valid item rows. Deleting them also deletes item information you may need.":"Pueden ser filas de artículos válidas. Borrarlas también borra información de artículos que podrías necesitar.","Keep the joined rows, because more rows make the rate more accurate.":"Conserva las filas unidas, porque más filas hacen la tasa más precisa.","Repeating an order gives it more weight. Orders with more items would count more than once.":"Repetir un pedido le da más peso. Los pedidos con más artículos contarían más de una vez.","Class practice 4: RiverTown and Chart A":"Práctica de clase 4: RiverTown y el Gráfico A","RiverTown attendance: 72 of 80, 54 of 60 and 30 of 50 eligible residents. MetroMeal (<code>Slide_Practice</code>): latest rate in B59, target 0.85 in B60.":"Asistencia en RiverTown: 72 de 80, 54 de 60 y 30 de 50 residentes elegibles. MetroMeal (<code>Slide_Practice</code>): la tasa más reciente en B59, la meta 0.85 en B60.","<p>January and February tie at 90.0%, even though February had fewer attendees, because its denominator was smaller. A bar axis that starts at 50% would make March’s 60.0% look tiny.</p>\n          <p>MetroMeal’s Chart A has the same flaw on a 75% to 90% axis. B69 confirms the latest gap of −6.6 points that belongs in the repaired title.</p>":"<p>Enero y febrero empatan en 90.0%, aunque febrero tuvo menos asistentes, porque su denominador era menor. Un eje de barras que empieza en 50% haría que el 60.0% de marzo se viera diminuto.</p><p>El Gráfico A de MetroMeal tiene el mismo defecto con un eje de 75% a 90%. B69 confirma la brecha más reciente de −6.6 puntos, que va en el título corregido.</p>","Class_Practice!B63  January = {{j}}":"Class_Practice!B63  enero = {{j}}","Class_Practice!B64  February = {{fe}}":"Class_Practice!B64  febrero = {{fe}}","Class_Practice!B65  March = {{mr}}":"Class_Practice!B65  marzo = {{mr}}","Slide_Practice!B69  latest target gap = {{g}}":"Slide_Practice!B69  brecha más reciente con la meta = {{g}}","B63 = B56 / B57 = 72 / 80.":"B63 = B56 / B57 = 72 / 80.","B63 January rate":"B63 tasa de enero","B64 = B58 / B59 = 54 / 60 = 0.90. February has fewer attendees but the same rate.":"B64 = B58 / B59 = 54 / 60 = 0.90. Febrero tiene menos asistentes, pero la misma tasa.","B64 February rate":"B64 tasa de febrero","B65 = B60 / B61 = 30 / 50.":"B65 = B60 / B61 = 30 / 50.","B65 March rate":"B65 tasa de marzo","B69 = (B59 − B60) * 100 = (0.784 − 0.85) × 100.":"B69 = (B59 − B60) * 100 = (0.784 − 0.85) × 100.","Slide_Practice B69 target gap":"Slide_Practice B69 brecha con la meta","Class practice 5: GreenBlock, then the MetroMeal check":"Práctica de clase 5: GreenBlock, luego la comprobación de MetroMeal","GreenBlock: 273 of 300 eligible repairs on time; target 95%. MetroMeal (SPSS Block H5): 392 on time, 108 late, 500 eligible.":"GreenBlock: 273 de 300 reparaciones elegibles a tiempo; meta 95%. MetroMeal (bloque H5 de SPSS): 392 a tiempo, 108 con retraso, 500 elegibles.","Type what your cells and SPSS show.":"Escribe lo que muestran tus celdas y SPSS.","<p>GreenBlock: 91.0%, 4.0 points below target. MetroMeal reconciles: 392 + 108 = 500, so reconcile = 0. Write in Slide_Practice!B88 how you checked at least one number this way.</p>":"<p>GreenBlock: 91.0%, 4.0 puntos por debajo de la meta. MetroMeal cuadra: 392 + 108 = 500, así que reconcile = 0. Escribe en Slide_Practice!B88 cómo comprobaste al menos un número de esta forma.</p>","Class_Practice!B77  rate = {{gr}}":"Class_Practice!B77  tasa = {{gr}}","Class_Practice!B78  target gap = {{gg}}":"Class_Practice!B78  brecha con la meta = {{gg}}","SPSS H5  reconcile = ontime + late − eligible = {{rc}}":"SPSS H5  reconcile = ontime + late − eligible = {{rc}}","B77 = B74 / B75 = 273 / 300.":"B77 = B74 / B75 = 273 / 300.","B77 GreenBlock rate":"B77 tasa de GreenBlock","B78 = (B77 − B76) * 100 = (0.91 − 0.95) × 100.":"B78 = (B77 − B76) * 100 = (0.91 − 0.95) × 100.","B78 GreenBlock target gap":"B78 brecha con la meta de GreenBlock","392 + 108 − 500 = 0. Any other value means the counts do not add up.":"392 + 108 − 500 = 0. Cualquier otro valor significa que los conteos no cuadran.","SPSS reconcile value":"Valor de reconcile en SPSS","Class practice 5: the weakest sentence":"Práctica de clase 5: la oración más débil","GreenBlock’s draft story says a new scheduling policy caused the 4.0-point miss. Only three descriptive months are available.":"El borrador de GreenBlock dice que una nueva política de programación causó el incumplimiento de 4.0 puntos. Solo hay tres meses descriptivos disponibles.","Which sentence is most vulnerable to overclaiming?":"¿Qué oración es más vulnerable a exagerar la conclusión?","<p>A causal claim needs variation in policy exposure, comparable groups or periods, reliable scheduling records and checks for other explanations. Three descriptive months support “investigate the policy”, not “the policy caused it”.</p>":"<p>Una afirmación causal necesita variación en la exposición a la política, grupos o periodos comparables, registros de programación confiables y comprobaciones de otras explicaciones. Tres meses descriptivos respaldan “investigar la política”, no “la política lo causó”.</p>","The new scheduling policy caused the miss.":"La nueva política de programación causó el incumplimiento.","273 of 300 eligible repairs were completed on time.":"273 de 300 reparaciones elegibles se completaron a tiempo.","That is a count from the records. Anyone can check it.":"Es un conteo de los registros. Cualquiera puede comprobarlo.","The rate was 4.0 points below the 95% target.":"La tasa estuvo 4.0 puntos por debajo de la meta de 95%.","That is supported: 91.0% − 95.0% = −4.0 points.":"Eso está respaldado: 91.0% − 95.0% = −4.0 puntos.","Step 1 · GP-A: source and grain checks":"Paso 1 · GP-A: comprobaciones de fuente y granularidad","In <code>KPI_Build</code>, B3 counts rows (GP.1), B4 counts distinct order IDs (GP.2) and B5 sums the eligibility flag (GP.3).":"En <code>KPI_Build</code>, B3 cuenta filas (GP.1), B4 cuenta los ID de pedido distintos (GP.2) y B5 suma el indicador de elegibilidad (GP.3).","Type what B3 to B5 show.":"Escribe lo que muestran B3 a B5.","<p>B3 = B4 = 2,000, so order_id is unique at this grain and works as the key. B5 = 2,000, so every row is eligible. Grain sentence: each row is one eligible completed delivery, August 3 to 30, 2026.</p>":"<p>B3 = B4 = 2,000, así que order_id es único en esta granularidad y sirve como clave. B5 = 2,000, así que todas las filas son elegibles. Oración de granularidad: cada fila es una entrega completada elegible, del 3 al 30 de agosto de 2026.</p>","B3  =ROWS(Orders[order_id]) = {{b3}}":"B3  =ROWS(Orders[order_id]) = {{b3}}","B4  =ROWS(UNIQUE(Orders[order_id])) = {{b4}}":"B4  =ROWS(UNIQUE(Orders[order_id])) = {{b4}}","B5  =SUM(Orders[eligible_kpi_flag]) = {{b5}}":"B5  =SUM(Orders[eligible_kpi_flag]) = {{b5}}","With no filters, the explorer shows Rows = 2000.":"Sin filtros, el explorador muestra Rows = 2000.","B3 source rows":"B3 filas de origen","Each order_id appears once. If you see 1000, you used customer_id: each customer has 2 deliveries.":"Cada order_id aparece una vez. Si ves 1000, usaste customer_id: cada cliente tiene 2 entregas.","B4 distinct order IDs":"B4 ID de pedido distintos","All 2,000 rows have eligible_kpi_flag = 1.":"Las 2,000 filas tienen eligible_kpi_flag = 1.","B5 eligible rows":"B5 filas elegibles","2,000 rows = 2,000 order IDs = 2,000 eligible":"2,000 filas = 2,000 ID de pedido = 2,000 elegibles","Step 2 · GP-B: weekly counts":"Paso 2 · GP-B: conteos semanales","Column C counts eligible deliveries per week (500 each). Column D sums on_time_kpi_flag per week (GP.14 to GP.17). Column G sums complaint_flag (GP.26 to GP.29).":"La columna C cuenta las entregas elegibles por semana (500 cada una). La columna D suma on_time_kpi_flag por semana (GP.14 a GP.17). La columna G suma complaint_flag (GP.26 a GP.29).","Check D7 to D10 and G10 with the explorer, then type them.":"Comprueba D7 a D10 y G10 con el explorador y luego escríbelos.","<p>On time by week: 420, 438, 425 and 392, each out of 500. Complaints in the latest week: 14. SUMIFS on a 0/1 flag counts the 1s, so it gives the same numbers as these filters.</p>":"<p>A tiempo por semana: 420, 438, 425 y 392, cada uno de 500. Quejas en la última semana: 14. SUMIFS sobre un indicador 0/1 cuenta los 1, así que da los mismos números que estos filtros.</p>","D7 (Aug 3) = {{d7}}":"D7 (3 ago) = {{d7}}","D8 (Aug 10) = {{d8}}":"D8 (10 ago) = {{d8}}","D9 (Aug 17) = {{d9}}":"D9 (17 ago) = {{d9}}","D10 (Aug 24) = {{d10}}":"D10 (24 ago) = {{d10}}","G10 (Aug 24 complaints) = {{g10}}":"G10 (quejas, 24 ago) = {{g10}}","Filter week_start = 2026-08-03 and on_time_kpi_flag = 1.":"Filtra week_start = 2026-08-03 y on_time_kpi_flag = 1.","D7 on time, week of Aug 3":"D7 a tiempo, semana del 3 de agosto","Filter week_start = 2026-08-10 and on_time_kpi_flag = 1.":"Filtra week_start = 2026-08-10 y on_time_kpi_flag = 1.","D8 on time, week of Aug 10":"D8 a tiempo, semana del 10 de agosto","Filter week_start = 2026-08-17 and on_time_kpi_flag = 1.":"Filtra week_start = 2026-08-17 y on_time_kpi_flag = 1.","D9 on time, week of Aug 17":"D9 a tiempo, semana del 17 de agosto","Filter week_start = 2026-08-24 and on_time_kpi_flag = 1. If you see 108, you counted the late ones.":"Filtra week_start = 2026-08-24 y on_time_kpi_flag = 1. Si ves 108, contaste las entregas con retraso.","D10 on time, week of Aug 24":"D10 a tiempo, semana del 24 de agosto","Filter week_start = 2026-08-24 and complaint_flag = 1. If you see 47, week_start is not set.":"Filtra week_start = 2026-08-24 y complaint_flag = 1. Si ves 47, no fijaste week_start.","G10 complaints, week of Aug 24":"G10 quejas, semana del 24 de agosto","Step 2 · GP-B: the latest week, row 10":"Paso 2 · GP-B: la última semana, fila 10","C10 = 500, D10 = 392 and G10 = 14. The target is in B14 (0.85) and the guardrail in B15 (0.03).":"C10 = 500, D10 = 392 y G10 = 14. La meta está en B14 (0.85) y la salvaguarda en B15 (0.03).","Type what E10, F10 and H10 show.":"Escribe lo que muestran E10, F10 y H10.","<p>E10 = 392 ÷ 500 = 78.4%. F10 = (0.784 − 0.85) × 100 = −6.6 percentage points. H10 = 14 ÷ 500 = 2.8%, within the 3% guardrail. SPSS’s Guided Step 2 block shows rate .784, gap −6.6 and complaint rate .028 for the latest week.</p>":"<p>E10 = 392 ÷ 500 = 78.4%. F10 = (0.784 − 0.85) × 100 = −6.6 puntos porcentuales. H10 = 14 ÷ 500 = 2.8%, dentro de la salvaguarda de 3%. El bloque Guided Step 2 de SPSS muestra para la última semana una tasa de .784, una brecha de −6.6 y una tasa de quejas de .028.</p>","E10  on-time rate = {{e10}}":"E10  tasa a tiempo = {{e10}}","F10  target gap = {{f10}}":"F10  brecha con la meta = {{f10}}","H10  complaint rate = {{h10}}":"H10  tasa de quejas = {{h10}}","E10 = D10 / C10. If you see 1.276, you divided C10 by D10.":"E10 = D10 / C10. Si ves 1.276, dividiste C10 entre D10.","E10 on-time rate":"E10 tasa a tiempo","F10 = (E10 − $B$14) * 100. If you see −0.066, you left out * 100; the unit is percentage points.":"F10 = (E10 − $B$14) * 100. Si ves −0.066, omitiste * 100; la unidad son puntos porcentuales.","F10 target gap":"F10 brecha con la meta","H10 = G10 / C10 = 14 / 500. If you see 3.6%, you divided by D10, the 392 on-time deliveries.":"H10 = G10 / C10 = 14 / 500. Si ves 3.6%, dividiste entre D10, las 392 entregas a tiempo.","H10 complaint rate":"H10 tasa de quejas","E10 78.4%, F10 −6.6, H10 2.8%":"E10 78.4%, F10 −6.6, H10 2.8%","Step 2 · GP-B: the four-week row 11":"Paso 2 · GP-B: la fila 11 de cuatro semanas","Row 11 sums the counts first (GP.35, GP.36 and GP.39), then divides.":"La fila 11 primero suma los conteos (GP.35, GP.36 y GP.39) y luego divide.","Type what row 11 shows.":"Escribe lo que muestra la fila 11.","<p>1,675 ÷ 2,000 = 83.75%, 1.25 points below target; complaints 47 ÷ 2,000 = 2.35%. AVERAGE(E7:E10) would also give 83.75% here, but only because all four denominators are 500. Count first, then divide.</p>":"<p>1,675 ÷ 2,000 = 83.75%, 1.25 puntos por debajo de la meta; quejas 47 ÷ 2,000 = 2.35%. AVERAGE(E7:E10) también daría 83.75% aquí, pero solo porque los cuatro denominadores son 500. Primero cuenta, luego divide.</p>","D11 = SUM(D7:D10) = {{d11}}":"D11 = SUM(D7:D10) = {{d11}}","E11 = D11 / C11 = {{e11}}":"E11 = D11 / C11 = {{e11}}","F11  target gap = {{f11}}":"F11  brecha con la meta = {{f11}}","H11 = G11 / C11 = {{h11}}":"H11 = G11 / C11 = {{h11}}","D11 four-week on-time count":"D11 conteo a tiempo de cuatro semanas","E11 = 1,675 / 2,000. If you see 3.35, you summed the rates in E7:E10.":"E11 = 1,675 / 2,000. Si ves 3.35, sumaste las tasas de E7:E10.","E11 four-week rate":"E11 tasa de cuatro semanas","F11 four-week target gap":"F11 brecha con la meta de cuatro semanas","H11 = G11 / C11 = 47 / 2,000.":"H11 = G11 / C11 = 47 / 2,000.","H11 four-week complaint rate":"H11 tasa de quejas de cuatro semanas","1,675 / 2,000 = 83.75%, gap −1.25":"1,675 / 2,000 = 83.75%, brecha −1.25","Step 2 · GP-B: late-delivery checks, row 18":"Paso 2 · GP-B: comprobaciones de entregas con retraso, fila 18","Row 18 summarizes only the latest week’s late deliveries: late_minutes greater than 0. The explorer is already filtered to them.":"La fila 18 resume solo las entregas con retraso de la última semana: late_minutes mayor que 0. El explorador ya está filtrado a ellas.","Type what C18 to G18 show.":"Escribe lo que muestran C18 a G18.","<p>108 late deliveries: mean 12.4 minutes, median 7, 90th percentile 31, and the two routes to the late count agree (0). The mean sits above the median because 10 deliveries were 50 or more minutes late. That is a reason to inspect the distribution in Session 3, not proof of a cause.</p>":"<p>108 entregas con retraso: media 12.4 minutos, mediana 7, percentil 90 de 31, y las dos vías para obtener el conteo de retrasos coinciden (0). La media está por encima de la mediana porque 10 entregas llegaron 50 minutos tarde o más. Es una razón para revisar la distribución en la Sesión 3, no una prueba de una causa.</p>","C18  late deliveries = {{c18}}":"C18  entregas con retraso = {{c18}}","D18  mean minutes late = {{d18}}":"D18  media de minutos de retraso = {{d18}}","E18  median minutes late = {{e18}}":"E18  mediana de minutos de retraso = {{e18}}","F18  90th percentile = {{f18}}":"F18  percentil 90 = {{f18}}","G18  reconciliation = {{g18}}":"G18  conciliación = {{g18}}","C18 = C10 − D10 = 500 − 392.":"C18 = C10 − D10 = 500 − 392.","C18 late deliveries":"C18 entregas con retraso","If you see 2.68, you averaged all 500 rows, including 392 zeros. AVERAGEIFS needs late_minutes \">0\".":"Si ves 2.68, promediaste las 500 filas, incluidos 392 ceros. AVERAGEIFS necesita late_minutes \">0\".","D18 mean minutes late":"D18 media de minutos de retraso","If you see 0, your FILTER kept the on-time rows with 0 late minutes.":"Si ves 0, tu FILTER conservó las filas a tiempo con 0 minutos de retraso.","E18 median minutes late":"E18 mediana de minutos de retraso","Use PERCENTILE.INC on the 108 late values. If you see 12, the FILTER kept all 500 rows.":"Usa PERCENTILE.INC sobre los 108 valores de retraso. Si ves 12, el FILTER conservó las 500 filas.","F18 90th percentile":"F18 percentil 90","G18 = C10 − D10 − C18 should be 0.":"G18 = C10 − D10 − C18 debería ser 0.","G18 reconciliation":"G18 conciliación","108 late: mean 12.4, median 7, P90 31, check 0":"108 con retraso: media 12.4, mediana 7, P90 31, comprobación 0","Step 2 · GP.47: what does H18 say?":"Paso 2 · GP.47: ¿qué dice H18?","H18 = IF(AND(E10 &lt; $B$14, H10 &lt;= $B$15), \"Investigate, guardrail within limit\", \"Review KPI and guardrail\")":"H18 = IF(AND(E10 &lt; $B$14, H10 &lt;= $B$15), \"Investigate, guardrail within limit\", \"Review KPI and guardrail\")","With your row 10 values, what does H18 display, and what does it mean?":"Con tus valores de la fila 10, ¿qué muestra H18 y qué significa?","<p>E10 = 0.784 &lt; 0.85 and H10 = 0.028 ≤ 0.03, so both conditions hold and H18 reads “Investigate, guardrail within limit”. It turns checked numbers into a bounded next step, not a diagnosis.</p>":"<p>E10 = 0.784 &lt; 0.85 y H10 = 0.028 ≤ 0.03, así que se cumplen ambas condiciones y H18 muestra “Investigate, guardrail within limit”. Convierte números comprobados en un siguiente paso acotado, no en un diagnóstico.</p>","“Investigate, guardrail within limit”: the KPI missed and complaints held.":"“Investigate, guardrail within limit”: el KPI no se cumplió y las quejas se mantuvieron dentro del límite.","“Review KPI and guardrail”: both measures failed.":"“Review KPI and guardrail”: ambas medidas fallaron.","H10 = 2.8% is within 3%, and E10 is below 85%, so the AND is true and H18 shows the first message.":"H10 = 2.8% está dentro de 3% y E10 está por debajo de 85%, así que el AND es verdadero y H18 muestra el primer mensaje.","“Investigate, guardrail within limit”: staffing caused the miss.":"“Investigate, guardrail within limit”: la dotación de personal causó el incumplimiento.","The status says what to do next. It does not name a cause.":"El estado dice qué hacer después. No nombra una causa.","Step 3 · GP.67: the direct label in E8":"Paso 3 · GP.67: la etiqueta directa en E8","E8 = TEXT(B8,\"0.0%\")&amp;\" (n = \"&amp;D8&amp;\")\". B8 links KPI_Build!E10 and D8 links KPI_Build!C10.":"E8 = TEXT(B8,\"0.0%\")&amp;\" (n = \"&amp;D8&amp;\")\". B8 enlaza KPI_Build!E10 y D8 enlaza KPI_Build!C10.","What should E8 display?":"¿Qué debería mostrar E8?","<p>Each direct label carries the rate and its denominator: 84.0%, 87.6%, 85.0% and 78.4%, each with n = 500. Link every chart cell to KPI_Build instead of retyping values, so the chart updates when the checked numbers do.</p>":"<p>Cada etiqueta directa lleva la tasa y su denominador: 84.0%, 87.6%, 85.0% y 78.4%, cada una con n = 500. Enlaza cada celda del gráfico a KPI_Build en lugar de volver a escribir valores, para que el gráfico se actualice cuando cambien los números comprobados.</p>","78.4% (n = 500)":"78.4% (n = 500)","0.784 (n = 500)":"0.784 (n = 500)","TEXT(B8,\"0.0%\") turns 0.784 into 78.4%. Check the format code inside TEXT.":"TEXT(B8,\"0.0%\") convierte 0.784 en 78.4%. Revisa el código de formato dentro de TEXT.","78.4% (n = 392)":"78.4% (n = 392)","n is the denominator. D8 must link KPI_Build!C10, the 500 eligible deliveries, not D10.":"n es el denominador. D8 debe enlazar KPI_Build!C10, las 500 entregas elegibles, no D10.","The label also carries the denominator, so readers see what the rate is out of.":"La etiqueta también lleva el denominador, para que los lectores vean sobre qué total se calcula la tasa.","Step 3: set the vertical axis":"Paso 3: configura el eje vertical","Right-click the vertical axis, then choose Format Axis. Your rates are stored as decimals, such as 0.784.":"Haz clic derecho en el eje vertical y elige Dar formato al eje (Format Axis). Tus tasas están guardadas como decimales, por ejemplo 0.784.","Which bounds give an honest bar chart?":"¿Qué límites dan un gráfico de barras honesto?","<p>Bars are judged by length, so the axis must start at 0. Because the rates are stored as decimals, 1 means 100%. Then add the target line, direct labels from E5:E8 and a pattern or outline on the latest bar.</p>":"<p>Las barras se juzgan por su longitud, así que el eje debe empezar en 0. Como las tasas están guardadas como decimales, 1 significa 100%. Luego agrega la línea de meta, etiquetas directas de E5:E8 y un patrón o contorno en la barra más reciente.</p>","Minimum 0, Maximum 1":"Mínimo 0, Máximo 1","Minimum 0.75, Maximum 0.9":"Mínimo 0.75, Máximo 0.9","That is Chart A. A 75% start makes the Aug 10 bar look 3.7 times as tall as Aug 24, when the rates differ by a factor of 1.12.":"Ese es el Gráfico A. Empezar en 75% hace que la barra del 10 de agosto parezca 3.7 veces más alta que la del 24 de agosto, cuando las tasas difieren en un factor de 1.12.","Minimum 0, Maximum 100":"Mínimo 0, Máximo 100","The rates are decimals, so 100 means 10,000%. The bars would be tiny. Use 1.":"Las tasas son decimales, así que 100 significa 10,000%. Las barras serían diminutas. Usa 1.","Leave Excel’s automatic bounds":"Dejar los límites automáticos de Excel","For values this close together, Excel may choose a minimum above 0. Set 0 and 1 yourself.":"Con valores tan cercanos, Excel puede elegir un mínimo por encima de 0. Fija tú mismo 0 y 1.","Minimum 0, Maximum 1 (0% to 100%)":"Mínimo 0, Máximo 1 (0% a 100%)","Step 3: critique fields B12 to B15":"Paso 3: campos de crítica B12 a B15","Chart_Build asks for four short entries about Chart A and your repair.":"Chart_Build pide cuatro entradas breves sobre el Gráfico A y tu corrección.","Drag each entry to its cell. One tile belongs in none of them.":"Arrastra cada entrada a su celda. Una ficha no va en ninguna.","<p>Statistical defect: the 75% start and missing denominators. Accessibility defect: colour as the only cue. Repair: zero-based axis, direct labels with n = 500, target line and a non-colour marker. Title: the observed comparison, with no cause, drama or forecast.</p>":"<p>Defecto estadístico: el inicio en 75% y los denominadores que faltan. Defecto de accesibilidad: el color como única señal. Corrección: eje desde cero, etiquetas directas con n = 500, línea de meta y un marcador que no dependa del color. Título: la comparación observada, sin causa, dramatismo ni pronóstico.</p>","Red and green are the only status cue":"El rojo y el verde son la única señal de estado","Weekend staffing caused the latest weekly drop":"La dotación de personal del fin de semana causó la última caída semanal","Latest observed weekly on-time rate was below the 85.0% target":"La última tasa semanal a tiempo observada estuvo por debajo de la meta de 85.0%","Bars start at 75% and show no denominators":"Las barras empiezan en 75% y no muestran denominadores","0% to 100% axis, labels with n = 500, 85% target line, patterned latest bar":"Eje de 0% a 100%, etiquetas con n = 500, línea de meta de 85%, última barra con patrón","B12 statistical defect":"B12 defecto estadístico","B13 accessibility defect":"B13 defecto de accesibilidad","B14 repair":"B14 corrección","B15 bounded title":"B15 título acotado","The records do not show a cause. Keep this sentence out of every field.":"Los registros no muestran una causa. Deja esta oración fuera de todos los campos.","A truncated axis and missing denominators distort the numbers themselves. That is the statistical defect.":"Un eje truncado y la falta de denominadores distorsionan los propios números. Ese es el defecto estadístico.","Colour alone shuts out readers who cannot tell red from green. That is the accessibility defect.":"Usar solo el color excluye a los lectores que no distinguen el rojo del verde. Ese es el defecto de accesibilidad.","This lists what you change. That is the repair.":"Esto enumera lo que cambias. Esa es la corrección.","This states the observed comparison with no cause. That is the bounded title.":"Esto expresa la comparación observada sin causa. Ese es el título acotado.","Step 4 · GP-D: a ✗ on Self_Check":"Paso 4 · GP-D: una ✗ en Self_Check","The check labeled “Latest complaint rate” shows ✗.":"La comprobación llamada “Latest complaint rate” muestra ✗.","Where do you fix it?":"¿Dónde lo corriges?","<p>Self_Check only reads your analysis cells. Repair the cell its table names: H10 = G10 / C10. The usual slip is dividing by D10, the on-time count, which gives 3.6% instead of 2.8%.</p>":"<p>Self_Check solo lee tus celdas de análisis. Corrige la celda que indica su tabla: H10 = G10 / C10. El error habitual es dividir entre D10, el conteo a tiempo, que da 3.6% en lugar de 2.8%.</p>","KPI_Build!H10: it must divide G10 by C10.":"KPI_Build!H10: debe dividir G10 entre C10.","On Self_Check: type ✓ over the formula.":"En Self_Check: escribe ✓ encima de la fórmula.","Never type on Self_Check. Its formulas read your analysis cells.":"Nunca escribas en Self_Check. Sus fórmulas leen tus celdas de análisis.","Chart_Build!B8: relink the rate.":"Chart_Build!B8: vuelve a enlazar la tasa.","That is the chart’s rate link. The complaint rate lives in KPI_Build!H10.":"Ese es el enlace de la tasa del gráfico. La tasa de quejas está en KPI_Build!H10.","Step 4: three sentences for Response!B7":"Paso 4: tres oraciones para Response!B7","The director wants exactly three sentences: what the evidence shows, what it does not show, and what to do next.":"El director quiere exactamente tres oraciones: qué muestra la evidencia, qué no muestra y qué hacer después.","Drag one sentence into each position. Two tiles do not belong.":"Arrastra una oración a cada posición. Dos fichas no van.","<p>This is a model, not text to copy. Write your own three sentences in Response!B7. A limitation that says the data do not show what caused the delay is correct, even though it contains the word “caused”.</p>":"<p>Esto es un modelo, no un texto para copiar. Escribe tus propias tres oraciones en Response!B7. Una limitación que dice que los datos no muestran qué causó el retraso es correcta, aunque contenga la palabra “causó” (caused).</p>","Review order-level timing and weekend staffing records before changing the schedule.":"Revisa los tiempos a nivel de pedido y los registros de personal del fin de semana antes de cambiar el horario.","Weekend understaffing caused a delivery collapse, so add staff now.":"La falta de personal el fin de semana causó un colapso en las entregas, así que agrega personal ya.","In the week of Aug 24, 392 of 500 deliveries (78.4%) were on time, 6.6 points below target; complaints were 2.8%.":"En la semana del 24 de agosto, 392 de 500 entregas (78.4%) llegaron a tiempo, 6.6 puntos por debajo de la meta; las quejas fueron 2.8%.","On-time delivery fell 6.6% and will keep falling.":"Las entregas a tiempo cayeron 6.6% y seguirán cayendo.","Four descriptive weeks do not show that staffing caused the miss or predict the next cycle.":"Cuatro semanas descriptivas no muestran que la dotación de personal causara el incumplimiento ni predicen el próximo ciclo.","1. What the evidence shows":"1. Qué muestra la evidencia","2. What it does not show":"2. Qué no muestra","3. What to do next":"3. Qué hacer después","Cause and drama the records cannot support. Keep all three sentences bounded.":"Causa y dramatismo que los registros no pueden respaldar. Mantén acotadas las tres oraciones.","The gap is 6.6 percentage points, not 6.6%, and four weeks cannot forecast.":"La brecha es de 6.6 puntos porcentuales, no de 6.6%, y cuatro semanas no permiten pronosticar.","This sentence reports the checked numbers. It belongs first.":"Esta oración informa los números comprobados. Va primero.","This sentence names the limit of the evidence. It belongs second.":"Esta oración nombra el límite de la evidencia. Va en segundo lugar.","This sentence is the bounded next step. It belongs last.":"Esta oración es el siguiente paso acotado. Va al final.","Evidence, limit, next step: drafted":"Evidencia, límite, siguiente paso: redactado","Bring this to the group studio":"Lleva esto al taller grupal","State the decision and the grain. Trace every number to counts. Keep the claim inside the observed evidence.":"Indica la decisión y la granularidad. Rastrea cada número hasta sus conteos. Mantén la afirmación dentro de la evidencia observada.","Save your workbook as <code>S02P_FirstName_LastName_NetID.xlsx</code>. The practice is ungraded, but the instructor may ask to see it for feedback.":"Guarda tu libro como <code>S02P_FirstName_LastName_NetID.xlsx</code>. La práctica no se califica, pero el profesor puede pedir verla para darte retroalimentación.","Your evidence chain: 2,000 source rows, four weekly count pairs, 392 of 500 (78.4%), −6.6 points to target, 14 of 500 complaints (2.8%), an honest linked chart, and a bounded three-sentence response.":"Tu cadena de evidencia: 2,000 filas de origen, cuatro pares de conteos semanales, 392 de 500 (78.4%), −6.6 puntos respecto a la meta, 14 quejas de 500 (2.8%), un gráfico honesto y enlazado, y una respuesta acotada de tres oraciones.","Open this page from the class site to see the dataset.":"Abre esta página desde el sitio de la clase para ver el conjunto de datos.","Lab checkpoints complete":"Puntos de control del laboratorio completados","Your checkpoint answers are saved in this browser. Keep your workbook for feedback in the group studio.":"Tus respuestas de los puntos de control se guardan en este navegador. Conserva tu libro para recibir retroalimentación en el taller grupal."}};

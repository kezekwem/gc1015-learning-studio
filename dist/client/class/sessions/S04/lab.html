    els.secondary = h('button', { type: 'button', class: 'lk-btn ghost', hidden: true });
    els.primary = h('button', { type: 'button', class: 'lk-btn' });
    els.card = h('section', { class: 'lk-card', 'aria-label': strip(tr(L.title)) }, els.head, els.body,
      h('div', { class: 'lk-foot' }, els.bubble, h('div', { class: 'lk-actions' }, els.secondary, els.primary)));
    els.rail = h('aside', { class: 'lk-rail', 'aria-label': ui('caseFile') });
    root.append(h('div', { class: 'lk-app' }, top, h('main', { class: 'lk-stage' }, els.card, els.rail)));
    if (!els.keyBound) { document.addEventListener('keydown', onKey); els.keyBound = true; }
    rail();
    renderPill();
  }

  function onKey(e) {
    if (e.key === 'Escape' && els.sheet) { closeSheet(); return; }
    if (e.key !== 'Enter' || els.sheet) return;
    const t = e.target;
    if (t.closest && t.closest('button, a, textarea, select, [role="slider"], [role="button"]')) return;
    if (t.tagName === 'INPUT' && t.type !== 'text') return;
    if (!els.primary.disabled && !els.primary.hidden) { e.preventDefault(); els.primary.click(); }
  }

  function go(i, initial, keep) {
    i = clamp(i, 0, L.screens.length - 1);
    const dir = cur && i < cur.sc._i ? 'back' : 'fwd';
    S.i = i; save({ nav: true });
    const sc = L.screens[i];
    const a = api(sc);
    els.head.replaceChildren(...[
      h('button', { type: 'button', class: 'lk-back', disabled: i === 0, onclick: () => go(i - 1) }, ui('back')),
      h('span', null, strip(tr(L.parts[sc.part]))),
      h('span', { class: 'lk-tier', 'data-tier': sc.tier }, sc.tier),
      LANG !== 'en' ? h('span', { class: 'lk-ai' }, ui('aiNote')) : null,
      h('span', { class: 'lk-count' }, `${i + 1} / ${L.screens.length}`)].filter(Boolean));
    const col = h('div', { class: `lk-col${initial ? '' : ` enter-${dir}`}`, tabindex: -1 });
    els.body.replaceChildren(col);
    if (sc.title) col.append(h('h2', null, ...said(sc.title)));
    if (sc.refs && L.toolkit) col.append(h('div', { class: 'lk-refs' }, sc.refs.map((r) => refChip(r, i))));
    if (sc.art) col.append(h('div', { class: 'lk-art', html: sc.art }));
    if (sc.scene) col.append(h('div', { class: 'lk-scene', 'data-label': ui('scene') }, h('p', null, ...said(sc.scene))));
    for (const p of [].concat(sc.body || [])) col.append(h('p', null, ...said(p)));
    if (sc.callout) col.append(h('div', { class: 'lk-callout' }, ...said(sc.callout)));
    let fig = null;
    if (sc.figure) { const fe = h('div', { class: 'lk-figure' }); col.append(fe); fig = sc.figure(fe, a) || null; }
    if (sc.prompt) col.append(h('p', { class: 'lk-prompt' }, ...said(sc.prompt)));
    const q = h('div', { class: 'lk-q' });
    col.append(q);
    for (const p of [].concat(sc.after || [])) col.append(h('p', { class: 'lk-caption' }, ...said(p)));

    let ctrl = null;
    if (sc.type === 'choice') ctrl = choiceWidget(q, sc, a);
    else if (sc.type === 'tiles') ctrl = tilesWidget(q, sc, a);
    else if (sc.type === 'blanks') ctrl = blanksWidget(q, sc, a);
    else if (sc.type === 'custom') ctrl = sc.render(q, a, fig);
    else if (sc.type === 'poll') ctrl = pollWidget(q, sc, a);
    cur = { sc, ctrl, q, fig, mode: null, api: a };
    if (EMBED) post({ type: 'lk:screen', i, id: sc.id, title: strip(tr(sc.title || '')), refs: sc.refs || [], part: sc.part, tier: sc.tier, done: !!S.res[sc.id] });

    bubble(null);
    if (graded(sc) && S.res[sc.id]) { ctrl.reveal(); lock(); setMode('done'); }
    else if (sc.type === 'poll') {
      if (S.polls[sc.id] != null) { ctrl.mark(S.polls[sc.id]); const o = sc.options[S.polls[sc.id]]; bubble(said(o.reply || sc.reply || ui('noted')), 'neutral'); setMode('read', { keepBubble: true }); }
      else setMode('poll');
    } else {
      setMode(graded(sc) ? 'idle' : 'read');
      if (keep !== undefined && ctrl?.restore) { ctrl.restore(keep); refreshPrimary(); }
    }
    progress();
    rail();
    if (!initial) {
      col.focus({ preventScroll: true });
      els.card.scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' });
    }
  }

  function lock() { cur.q.inert = true; cur.q.classList.add('locked'); }

  // Accepts an English lesson string (translated here), a list of nodes, or null to hide.
  function bubble(content, tone) {
    if (!content) { els.bubble.hidden = true; els.bubble.replaceChildren(); return; }
    els.bubble.hidden = false;
    els.bubble.dataset.tone = tone || 'neutral';
    els.bubble.replaceChildren(...(Array.isArray(content) ? content : rich(content)));
    restart(els.bubble, 'pop-in');
  }

  function btn(el, label, fn, tone, disabled) {
    if (!label) { el.hidden = true; el.onclick = null; return; }
    el.hidden = false;
    el.textContent = label;
    el.onclick = fn;
    el.disabled = !!disabled;
    if (tone) el.dataset.tone = tone; else el.removeAttribute('data-tone');
  }

  function refreshPrimary() { if (cur.mode === 'idle') els.primary.disabled = !(cur.ctrl && cur.ctrl.ready()); }

  function setMode(m, info = {}) {
    cur.mode = m;
    const sc = cur.sc;
    els.card.dataset.state = m === 'ok' ? 'ok' : m === 'warn' ? 'warn' : 'idle';
    const last = sc._i === L.screens.length - 1;
    const nextLabel = last ? (L.finishLabel ? tr(L.finishLabel) : ui('finish')) : ui('continue');
    const why = sc.why ? ui('why') : null;
    if (!info.keepBubble && !['ok', 'warn', 'revealed'].includes(m)) bubble(null);
    switch (m) {
      case 'read': btn(els.primary, nextLabel, next); btn(els.secondary, null); break;
      case 'poll': btn(els.primary, ui('continue'), null, null, true); btn(els.secondary, null); break;
      case 'idle': btn(els.primary, ui('check'), check, null, !cur.ctrl.ready()); btn(els.secondary, null); break;
      case 'ok': bubble(info.nodes, 'ok'); btn(els.primary, nextLabel, next, 'ok'); btn(els.secondary, why, openWhy); break;
      case 'warn': bubble(info.nodes, 'warn'); btn(els.primary, ui('tryAgain'), tryAgain, 'warn'); btn(els.secondary, ui('seeAnswer'), seeAnswer); break;
      case 'revealed': bubble(ui('revealed'), 'neutral'); btn(els.primary, sc.why ? ui('why') : nextLabel, sc.why ? openWhy : next); btn(els.secondary, sc.why ? ui('skipWhy') : null, next); break;
      case 'done': btn(els.primary, nextLabel, next); btn(els.secondary, why, openWhy); break;
    }
  }

  function award(kind) {
    const sc = cur.sc;
    const partDone = () => L.screens.filter((x) => x.part === sc.part && graded(x)).every((x) => S.res[x.id]);
    const wasDone = partDone();
    S.res[sc.id] = kind;
    const gained = kind === 'first' ? 10 : kind === 'retry' ? 5 : 0;
    S.pts += gained;
    if (sc.ledger) S.ledger[sc.ledger.id] = typeof sc.ledger.value === 'function' ? sc.ledger.value(S) : sc.ledger.value;
    save(); progress(); rail();
    floatPoints(gained);
    if (!wasDone && partDone()) setTimeout(() => toast(`<b>✓</b> ${ui('partDone', { n: sc.part + 1, name: strip(tr(L.parts[sc.part])) })}`), 450);
    return gained;
  }

  function check() {
    const sc = cur.sc;
    const r = cur.ctrl.check();
    if (r.ok) {
      syncEvent('correct', { first: !S.tries[sc.id], tries: (S.tries[sc.id] || 0) + 1 });
      award(S.tries[sc.id] ? 'retry' : 'first');
      lock();
      let praise = r.praise || sc.praise;
      if (typeof praise === 'function') praise = praise(S);
      const praiseList = ui('praise');
      setMode('ok', { nodes: praise ? said(praise) : rich(praiseList[sc._i % praiseList.length]) });
      burst(els.primary);
    } else {
      S.tries[sc.id] = (S.tries[sc.id] || 0) + 1;
      syncEvent('wrong', { tries: S.tries[sc.id], hint: r.hint ? strip(r.hint).slice(0, 160) : '' });
      save();
      setMode('warn', { nodes: r.hint ? said(r.hint) : rich(r.uiHint || ui('notQuite')) });
      if (!reduced()) restart(cur.q, 'shake');
    }
  }
  function tryAgain() { cur.ctrl.reset?.(); setMode('idle'); cur.ctrl.focus?.(); }
  function seeAnswer() { syncEvent('revealed', {}); cur.ctrl.reveal(); award('revealed'); lock(); setMode('revealed'); }
  function next() {
    const i = cur.sc._i;
    if (i < L.screens.length - 1) go(i + 1);
    else { syncEvent('finish', { points: S.pts }); if (L.onFinish) L.onFinish(S, api(cur.sc)); }
    syncNow();
  }

  function progress() {
    els.pts.querySelector('.n').textContent = S.pts;
    L.parts.forEach((p, pi) => {
      const list = L.screens.filter((sc) => sc.part === pi);
      const done = list.filter((sc) => (graded(sc) ? S.res[sc.id] : sc._i < S.i || (sc.type === 'poll' && S.polls[sc.id] != null))).length;
      els.segs[pi].querySelector('i').style.width = `${Math.round(100 * done / list.length)}%`;
      if (cur && cur.sc.part === pi) els.segs[pi].setAttribute('aria-current', 'step'); else els.segs[pi].removeAttribute('aria-current');
    });
  }

  function railContent() {
    const cf = L.caseFile || {};
    const panels = [];
    if (cf.title) {
      const p = h('section', { class: 'lk-panel' }, h('h3', null, strip(tr(cf.title))));
      for (const line of [].concat(cf.intro || [])) p.append(h('p', null, ...rich(tr(line))));
      if (cf.table) {
        p.append(h('table', { class: 'lk-facts' },
          h('thead', null, h('tr', null, cf.table.head.map((c) => h('th', null, ...rich(tr(c)))))),
          h('tbody', null, cf.table.rows.map((r) => h('tr', null, r.map((c) => h('td', null, ...rich(tr(c)))))))));
      }
      if (cf.notes) p.append(h('ul', { class: 'lk-notes' }, cf.notes.map((n) => h('li', null, ...rich(tr(n))))));
      panels.push(p);
    }
    if (L.ledger) {
      panels.push(h('section', { class: 'lk-panel' }, h('h3', null, strip(tr(L.ledgerTitle || 'Evidence so far'))),
        h('ul', { class: 'lk-ledger' }, L.ledger.map((it) => {
          const v = S.ledger[it.id];
          return h('li', null, h('span', { class: 'k' }, ...rich(tr(it.label))), h('span', { class: 'v' + (v ? '' : ' pending') }, ...rich(v ? tr(v) : (it.pending ? tr(it.pending) : ui('notYet')))));
        }))));
    }
    const gradedList = L.screens.filter(graded);
    const firsts = gradedList.filter((sc) => S.res[sc.id] === 'first').length;
    const done = gradedList.filter((sc) => S.res[sc.id]).length;
    const restartBtn = h('button', { type: 'button', class: 'lk-restart' }, ui('restart'));
    restartBtn.addEventListener('click', () => {
      if (restartBtn.dataset.armed) { S = fresh(); Sync.reset = true; save(); closeSheet(); shell(); go(0); }
      else { restartBtn.dataset.armed = '1'; restartBtn.textContent = ui('restartConfirm'); }
    });
    panels.push(h('section', { class: 'lk-panel' }, h('h3', null, ui('progressTitle')),
      h('p', null, ui('progressLine', { done, total: gradedList.length, first: firsts })), restartBtn));
    return panels;
  }
  function rail() { if (els.rail) els.rail.replaceChildren(...railContent()); }

  function sheet(title, nodes, onClose, opts = {}) {
    closeSheet();
    const x = h('button', { type: 'button', class: 'x', 'aria-label': ui('close') }, '×');
    const card = h('div', { class: 'lk-sheet-card' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': strip(title) },
      h('header', null, h('h3', null, ...rich(title)), x), h('div', { class: 'lk-sheet-body' }, nodes));
    const wrap = h('div', { class: 'lk-sheet' }, card);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) closeSheet(); });
    x.addEventListener('click', closeSheet);
    els.sheet = wrap;
    els.sheetClose = onClose;
    els.sheetReturn = document.activeElement;
    document.body.append(wrap);
    x.focus();
  }
  function closeSheet() {
    if (!els.sheet) return;
    els.sheet.remove();
    els.sheet = null;
    const cb = els.sheetClose; els.sheetClose = null;
    if (cb) cb();
    els.sheetReturn?.focus?.({ preventScroll: true });
  }
  function openWhy() {
    const sc = cur.sc;
    const en = typeof sc.why === 'function' ? sc.why(S) : sc.why;
    const t = tr(en);
    const nodes = rich(t);
    if (LANG !== 'en' && SHOW_EN && t !== en) nodes.push(h('details', { class: 'lk-en-block', lang: 'en' }, h('summary', null, ui('english')), ...rich(en)));
    if (sc.refs && L.toolkit) nodes.push(h('div', { class: 'lk-why-more' }, ui('readMore'), sc.refs.map((r) => refChip(r, sc._i))));
    sheet(ui('whyTitle'), nodes, () => { if (cur.mode === 'revealed') setMode('done'); });
  }
  function openCase() {
    const r = h('div', { class: 'lk-rail' }, railContent());
    sheet(strip(tr(L.caseFile?.title)) || ui('caseFile'), [r]);
  }

  globalThis.LessonKit = { define, h, s, rich, strip, tr, ui, Stats, Charts, slider, readout, chip, lookup, explorer, accept, sheet, toast, confetti, burst, openToolkit };
})();

</script>
<script>
globalThis.LESSON_TOOLKIT = {"title":"Conditional risk, expected value, simulation","sections":[{"id":"how-to-use-this-toolkit","level":2,"title":"How to use this toolkit","short":"How to use this toolkit","html":"<p>Read Sections 1–3 to build the decision by hand. Use Section 4 to reproduce it in Excel 365 or SPSS, then Section 5 to challenge the recommendation. A spreadsheet result is a check on a model, not a substitute for knowing what the model assumes.</p>\n<p>The <b>core crosswalk</b> is H001–H012: probability, conditional risk, expected value, decision trees, information, and risk attitude. H013–H020 supply a <b>targeted simulation bridge</b>. H021–H027 are an <b>optional optimization bridge</b>, not an optimization assignment. The course has <b>no required textbook</b>. The listed Albright and Winston headings are scope cues; this toolkit does not claim that any textbook chapter was assigned or read. Its explanations are an original synthesis grounded in the open and primary sources actually cited below.</p>\n<p>This source has no stable PDF page numbers. Use its numbered section headings—not presumed pages—for future slide and PNP cross-references after pagination. S02–S03 provide the prerequisite habits of defining a KPI and checking data quality. Sampling, tests, and causal analysis belong to later sessions.</p>"},{"id":"case","level":2,"title":"Fictional running case: Embercup’s rainy-day cart","short":"Fictional running case: Embercup…","html":"<p><b>Everything about Embercup and its numbers is fictional.</b> Embercup operates one mobile coffee cart on each scheduled weekday. Its manager must decide whether to buy a <b>same-day covered-pitch package</b>. The package changes where and how the cart sells. A vendor can first send a paid morning <b>rain alert</b>; the manager may then buy the package only on alert days.</p>\n<p>The decision population is Embercup’s future scheduled cart-days under comparable operating conditions. The unit of analysis is <b>one cart-day</b>, not one customer or one transaction. “Rain” means the predefined rain condition occurs during selling hours. Profit means dollars per cart-day after the ordinary operating costs included in the model. A rain alert is available <i>before</i> the pitch decision.</p>\n<div class=\"tbl\"><table><thead><tr><th>Model input or decision</th><th>Fictional value</th><th>Meaning and unit</th></tr></thead><tbody><tr><td>Prior rain probability, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P(R)</annotation></semantics></math></span></td><td>0.30</td><td>Chance of rain on a comparable cart-day</td></tr><tr><td>Alert sensitivity, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>A</mi><mo>∣</mo><mi>R</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P(A\\mid R)</annotation></semantics></math></span></td><td>0.75</td><td>Chance of an alert <b>if it rains</b></td></tr><tr><td>False-alert rate, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>A</mi><mo>∣</mo><mi mathvariant=\"normal\">¬</mi><mi>R</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P(A\\mid \\neg R)</annotation></semantics></math></span></td><td>0.20</td><td>Chance of an alert <b>if it stays dry</b></td></tr><tr><td>Profit without covered pitch, rain / dry</td><td>−$400 / $200</td><td>Dollars per cart-day</td></tr><tr><td>Covered-pitch benefit before its price, rain / dry</td><td>$500 / $40</td><td>Change in profit per cart-day</td></tr><tr><td>Covered-pitch price</td><td>$180</td><td>Paid only when purchased</td></tr><tr><td>Alert-service price</td><td>$25</td><td>Paid on <b>every</b> subscribed cart-day</td></tr><tr><td>Candidate policies</td><td>Never buy; always buy; subscribe and buy only after an alert</td><td>Rules chosen before the day’s weather is known</td></tr></tbody></table></div>\n<p>The manager’s <b>KPI</b> is expected profit per cart-day. A proposed target is at least <b>$20 more expected profit</b> than the best policy without the alert. A separate <b>guardrail</b> is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mtext>daily profit</mtext><mo>&lt;</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>150</mn><mo stretchy=\"false\">)</mo><mo>≤</mo><mn>0.10</mn></mrow><annotation encoding=\"application/x-tex\">P(\\text{daily profit}&lt;-\\$150)\\leq0.10</annotation></semantics></math></span>. The testable decision claim is: <i>under the stated probabilities and payoffs, the alert-and-act policy beats the best no-alert policy by at least $20 per day and meets the downside guardrail.</i></p>\n<p><b>Evidence limits:</b> These inputs are planning assumptions, not measured Embercup records. The table contains no sample size, observation dates, weather verification method, vendor validation, or estimate of how pitch location changes demand. Neither a confidence interval nor a causal claim can be obtained from it. Before spending real money, the manager would request time-stamped alert and weather records, reconcile daily profit definitions, and assess whether future cart-days resemble the days behind the estimates.</p>"},{"id":"1","level":2,"title":"1. Define events before calculating risk","short":"1. Define events before calculat…","html":""},{"id":"1.1","level":3,"title":"1.1 Joint and conditional probabilities","short":"1.1. Joint and conditional proba…","html":"<p>A <b>joint probability</b> concerns two events together: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo>∩</mo><mi>A</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P(R\\cap A)</annotation></semantics></math></span> is the chance of rain <i>and</i> an alert. A <b>conditional probability</b> changes the reference group: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo>∣</mo><mi>A</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P(R\\mid A)</annotation></semantics></math></span> asks about rain <i>among alert days</i>. Use the distinction when a manager acts after receiving a signal. Conditional probability divides the joint probability by the probability of the condition (Holmes et al., 2023).</p>\n<p>First construct all four possible weather–alert outcomes. Rain and dry partition the days, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">¬</mi><mi>R</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><mn>0.30</mn><mo>=</mo><mn>0.70</mn></mrow><annotation encoding=\"application/x-tex\">P(\\neg R)=1-0.30=0.70</annotation></semantics></math></span>.</p>\n<div class=\"tbl\"><table><thead><tr><th>Weather and alert</th><th>Calculation</th><th>Joint probability</th></tr></thead><tbody><tr><td>Rain, alert</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo stretchy=\"false\">(</mo><mn>0.75</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">0.30(0.75)</annotation></semantics></math></span></td><td>0.225</td></tr><tr><td>Rain, no alert</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mn>0.75</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">0.30(1-0.75)</annotation></semantics></math></span></td><td>0.075</td></tr><tr><td>Dry, alert</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.70</mn><mo stretchy=\"false\">(</mo><mn>0.20</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">0.70(0.20)</annotation></semantics></math></span></td><td>0.140</td></tr><tr><td>Dry, no alert</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.70</mn><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mn>0.20</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">0.70(1-0.20)</annotation></semantics></math></span></td><td>0.560</td></tr><tr><td><b>Check</b></td><td><b>Sum</b></td><td><b>1.000</b></td></tr></tbody></table></div>\n<p>The alert probability is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>A</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.225</mn><mo>+</mo><mn>0.140</mn><mo>=</mo><mn>0.365</mn></mrow><annotation encoding=\"application/x-tex\">P(A)=0.225+0.140=0.365</annotation></semantics></math></span>. Therefore,</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo>∣</mo><mi>A</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mfrac><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo>∩</mo><mi>A</mi><mo stretchy=\"false\">)</mo></mrow><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>A</mi><mo stretchy=\"false\">)</mo></mrow></mfrac><mo>=</mo><mfrac><mn>0.225</mn><mn>0.365</mn></mfrac><mo>≈</mo><mn>0.6164.</mn></mrow><annotation encoding=\"application/x-tex\">P(R\\mid A)=\\frac{P(R\\cap A)}{P(A)}\n=\\frac{0.225}{0.365}\\approx0.6164.</annotation></semantics></math></span></div></p>\n<p>For comparison, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo>∣</mo><mi mathvariant=\"normal\">¬</mi><mi>A</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.075</mn><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mn>0.075</mn><mo>+</mo><mn>0.560</mn><mo stretchy=\"false\">)</mo><mo>≈</mo><mn>0.1181</mn></mrow><annotation encoding=\"application/x-tex\">P(R\\mid\\neg A)=0.075/(0.075+0.560)\\approx0.1181</annotation></semantics></math></span>. An alert raises the modeled rain chance from the prior 0.30 to about 0.616; silence lowers it to about 0.118. These are statements <b>conditional on the assumed alert performance</b>, not evidence that the vendor will achieve it.</p>\n<div class=\"key\"><b>Name the condition before choosing the denominator.</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>A</mi><mo>∣</mo><mi>R</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.75</mn></mrow><annotation encoding=\"application/x-tex\">P(A\\mid R)=0.75</annotation></semantics></math></span> describes alerts among rainy days; it is <i>not</i> the chance of rain among alert days.</div>\n<p><b>Failure mode:</b> Calling a 75%-sensitive alert “75% likely to be right.” That ignores false alerts and the underlying rain frequency.</p>\n<p><b>Try it — ungraded:</b> What share of <i>no-alert</i> days are dry?</p>\n<p><b>Explained answer:</b> No-alert days have probability <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.075</mn><mo>+</mo><mn>0.560</mn><mo>=</mo><mn>0.635</mn></mrow><annotation encoding=\"application/x-tex\">0.075+0.560=0.635</annotation></semantics></math></span>. The dry-and-no-alert portion is 0.560. Thus <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">¬</mi><mi>R</mi><mo>∣</mo><mi mathvariant=\"normal\">¬</mi><mi>A</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.560</mn><mi mathvariant=\"normal\">/</mi><mn>0.635</mn><mo>≈</mo><mn>0.8819</mn></mrow><annotation encoding=\"application/x-tex\">P(\\neg R\\mid\\neg A)=0.560/0.635\\approx0.8819</annotation></semantics></math></span>. The denominator is 0.635 because the question restricts attention to no-alert days.</p>"},{"id":"1.2","level":3,"title":"1.2 Probability distributions and a first downside question","short":"1.2. Probability distributions a…","html":"<p>A <b>random variable</b> assigns a number to an uncertain outcome. Let <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi></mrow><annotation encoding=\"application/x-tex\">X</annotation></semantics></math></span> be daily profit under a stated policy. Its <b>distribution</b> lists possible profit values and their probabilities. For example, under “never buy the pitch,” <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi><mo>=</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>400</mn></mrow><annotation encoding=\"application/x-tex\">X=-\\$400</annotation></semantics></math></span> with probability 0.30 and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>200</mn></mrow><annotation encoding=\"application/x-tex\">X=\\$200</annotation></semantics></math></span> with probability 0.70. The probabilities add to one. A distribution answers a question that an average alone cannot: under this policy, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>X</mi><mo>&lt;</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>150</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.30</mn></mrow><annotation encoding=\"application/x-tex\">P(X&lt;-\\$150)=0.30</annotation></semantics></math></span>. Discrete distributions pair each possible value with a probability (Illowsky &amp; Dean, 2020). ([openstax.org](<a href=\"https://openstax.org/books/statistics/pages/4-2-mean-or-expected-value-and-standard-deviation\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/statistics/pages/4-2-mean-or-expected-value-and-standard-deviation</a>))</p>\n<p>For the alert-and-act policy, keep the $25 alert fee even on no-alert days. The four profit outcomes are:</p>\n<div class=\"tbl\"><table><thead><tr><th>Outcome</th><th>Profit calculation</th><th>Profit</th><th>Probability</th></tr></thead><tbody><tr><td>Rain, alert: buy pitch</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>400</mn><mo>+</mo><mn>500</mn><mo>−</mo><mn>180</mn><mo>−</mo><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">-400+500-180-25</annotation></semantics></math></span></td><td>−$105</td><td>0.225</td></tr><tr><td>Dry, alert: buy pitch</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>200</mn><mo>+</mo><mn>40</mn><mo>−</mo><mn>180</mn><mo>−</mo><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">200+40-180-25</annotation></semantics></math></span></td><td>$35</td><td>0.140</td></tr><tr><td>Rain, no alert: do not buy</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>400</mn><mo>−</mo><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">-400-25</annotation></semantics></math></span></td><td>−$425</td><td>0.075</td></tr><tr><td>Dry, no alert: do not buy</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>200</mn><mo>−</mo><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">200-25</annotation></semantics></math></span></td><td>$175</td><td>0.560</td></tr></tbody></table></div>\n<p>Only −$425 is <b>strictly below</b> −$150. Thus <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>X</mi><mo>&lt;</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>150</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.075</mn></mrow><annotation encoding=\"application/x-tex\">P(X&lt;-\\$150)=0.075</annotation></semantics></math></span>, which meets the proposed 0.10 guardrail <i>if the inputs hold</i>. This is modeled risk, not an observed loss rate.</p>\n<p><b>Failure mode:</b> Dropping the subscription fee from no-alert outcomes. The fee is paid for the day’s signal, not only for positive alerts.</p>\n<p><b>Try it — ungraded:</b> Under this same policy, what is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>X</mi><mo>≤</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>105</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P(X\\leq-\\$105)</annotation></semantics></math></span>?</p>\n<p><b>Explained answer:</b> Both −$105 and −$425 qualify because the inequality includes −$105. Their probabilities sum to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.225</mn><mo>+</mo><mn>0.075</mn><mo>=</mo><mn>0.300</mn></mrow><annotation encoding=\"application/x-tex\">0.225+0.075=0.300</annotation></semantics></math></span>. Changing <code>&lt;</code> to <code>≤</code> changes this answer substantially.</p>"},{"id":"2","level":2,"title":"2. Turn uncertainty into a decision","short":"2. Turn uncertainty into a decis…","html":""},{"id":"2.1","level":3,"title":"2.1 Payoffs, expected value, and the action threshold","short":"2.1. Payoffs, expected value, an…","html":"<p>A <b>payoff</b> is the profit produced by an action under a particular outcome. <b>Expected monetary value</b> (EMV) multiplies each payoff by its probability and adds the results. It is the model’s long-run average across comparable repetitions, <b>not</b> a promise of profit on the next day (Illowsky &amp; Dean, 2020).</p>\n<p>Without the alert, “never buy” has EMV <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo stretchy=\"false\">(</mo><mo>−</mo><mn>400</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mn>0.70</mn><mo stretchy=\"false\">(</mo><mn>200</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">0.30(-400)+0.70(200)=\\$20</annotation></semantics></math></span> per day. Buying the pitch changes profit by <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>500</mn><mo>−</mo><mn>180</mn><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>320</mn></mrow><annotation encoding=\"application/x-tex\">500-180=\\$320</annotation></semantics></math></span> on a rainy day and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn><mo>−</mo><mn>180</mn><mo>=</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>140</mn></mrow><annotation encoding=\"application/x-tex\">40-180=-\\$140</annotation></semantics></math></span> on a dry day. Its <i>incremental</i> EMV is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo stretchy=\"false\">(</mo><mn>320</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mn>0.70</mn><mo stretchy=\"false\">(</mo><mo>−</mo><mn>140</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>96</mn><mo>−</mo><mn>98</mn><mo>=</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">0.30(320)+0.70(-140)=96-98=-\\$2</annotation></semantics></math></span>. “Always buy” therefore has EMV <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">$</mi><mn>20</mn><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>2</mn><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>18</mn></mrow><annotation encoding=\"application/x-tex\">\\$20-\\$2=\\$18</annotation></semantics></math></span>. On this criterion, <b>never buy is the better no-alert policy</b>.</p>\n<p>Let <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span> be the rain probability available <i>when</i> the pitch decision is made. Its expected incremental payoff is</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>p</mi><mo stretchy=\"false\">(</mo><mn>320</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mo>−</mo><mn>140</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>460</mn><mi>p</mi><mo>−</mo><mn>140.</mn></mrow><annotation encoding=\"application/x-tex\">p(320)+(1-p)(-140)=460p-140.</annotation></semantics></math></span></div></p>\n<p>Set this expression above zero to find when buying is worthwhile:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mn>460</mn><mi>p</mi><mo>−</mo><mn>140</mn><mo>&gt;</mo><mn>0</mn><mspace width=\"1em\"/><mo>⟺</mo><mspace width=\"1em\"/><mi>p</mi><mo>&gt;</mo><mfrac><mn>140</mn><mn>460</mn></mfrac><mo>≈</mo><mn>0.30435.</mn></mrow><annotation encoding=\"application/x-tex\">460p-140&gt;0\n\\quad\\Longleftrightarrow\\quad\np&gt;\\frac{140}{460}\\approx0.30435.</annotation></semantics></math></span></div></p>\n<p>This is the <b>decision threshold</b>. The $25 alert fee is absent from this <i>after-subscribing</i> comparison because it is already paid whether or not the manager buys the pitch. It belongs in the earlier decision about subscribing. At the prior <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>0.30</mn></mrow><annotation encoding=\"application/x-tex\">p=0.30</annotation></semantics></math></span>, do not buy. After an alert <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>≈</mo><mn>0.6164</mn></mrow><annotation encoding=\"application/x-tex\">p\\approx0.6164</annotation></semantics></math></span>, buy. After no alert <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>≈</mo><mn>0.1181</mn></mrow><annotation encoding=\"application/x-tex\">p\\approx0.1181</annotation></semantics></math></span>, do not buy.</p>\n<div class=\"key\"><b>Compare incremental payoffs at the moment of choice.</b> Include costs that the choice changes; account separately for a fee already committed.</div>\n<p><b>Failure mode:</b> Subtracting the $25 fee once when deciding to subscribe and again when deciding what to do after an alert. That double-counts the same expense.</p>\n<p><b>Try it — ungraded:</b> Suppose the pitch price were $200, with all other amounts unchanged. What rain-probability threshold would make buying worthwhile?</p>\n<p><b>Explained answer:</b> Rainy incremental profit becomes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>500</mn><mo>−</mo><mn>200</mn><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>300</mn></mrow><annotation encoding=\"application/x-tex\">500-200=\\$300</annotation></semantics></math></span>; dry incremental profit becomes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn><mo>−</mo><mn>200</mn><mo>=</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>160</mn></mrow><annotation encoding=\"application/x-tex\">40-200=-\\$160</annotation></semantics></math></span>. Solve <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>300</mn><mi>p</mi><mo>−</mo><mn>160</mn><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy=\"false\">)</mo><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">300p-160(1-p)&gt;0</annotation></semantics></math></span>, or <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>460</mn><mi>p</mi><mo>&gt;</mo><mn>160</mn></mrow><annotation encoding=\"application/x-tex\">460p&gt;160</annotation></semantics></math></span>. The new threshold is about 0.34783. A higher price requires stronger evidence of rain.</p>"},{"id":"2.2","level":3,"title":"2.2 Read the decision tree backward; price the information","short":"2.2. Read the decision tree back…","html":"<p>A <b>decision tree</b> orders choices and chance outcomes as they occur. Here the first choice is <i>subscribe or not</i>. If Embercup subscribes, the chance of an alert follows. Then the manager chooses whether to buy the pitch. Finally weather determines profit. Work backward: choose the better action at each post-alert choice, then average the resulting payoffs at chance branches. That ordering prevents a manager from acting on information not yet available; university-hosted decision-tree teaching uses the same distinction between learning an outcome and choosing an action (Massachusetts Institute of Technology, 2002). ([ocw.mit.edu](<a href=\"https://ocw.mit.edu/courses/6-825-techniques-in-artificial-intelligence-sma-5504-fall-2002/d5b46fa507bf7dc6e16ad05e3ed83f7f_Lecture19FinalPart1.pdf\" target=\"_blank\" rel=\"noopener\">https://ocw.mit.edu/courses/6-825-techniques-in-artificial-intelligence-sma-5504-fall-2002/d5b46fa507bf7dc6e16ad05e3ed83f7f_Lecture19FinalPart1.pdf</a>))</p>\n<p>Before the alert fee, the optimal alert policy’s incremental value over never buying is</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo>∩</mo><mi>A</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">$</mi><mn>320</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">¬</mi><mi>R</mi><mo>∩</mo><mi>A</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>140</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.225</mn><mo stretchy=\"false\">(</mo><mn>320</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mn>0.140</mn><mo stretchy=\"false\">(</mo><mo>−</mo><mn>140</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>52.40.</mn></mrow><annotation encoding=\"application/x-tex\">P(R\\cap A)(\\$320)+P(\\neg R\\cap A)(-\\$140)\n=0.225(320)+0.140(-140)\n=\\$52.40.</annotation></semantics></math></span></div></p>\n<p>No-alert branches contribute zero <i>incremental pitch payoff</i>, because the manager does not buy. Thus <b>expected value of sample information</b> (EVSI)—the value of this imperfect alert before its fee—is $52.40 per day. After the $25 fee, the expected gain over the best no-alert policy is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>52.40</mn><mo>−</mo><mn>25</mn><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>27.40</mn></mrow><annotation encoding=\"application/x-tex\">52.40-25=\\$27.40</annotation></semantics></math></span>. Total expected profit is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">$</mi><mn>20</mn><mo>+</mo><mi mathvariant=\"normal\">$</mi><mn>27.40</mn><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>47.40</mn></mrow><annotation encoding=\"application/x-tex\">\\$20+\\$27.40=\\$47.40</annotation></semantics></math></span> per day. An independent check uses the four complete profits: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.225</mn><mo stretchy=\"false\">(</mo><mo>−</mo><mn>105</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mn>0.140</mn><mo stretchy=\"false\">(</mo><mn>35</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mn>0.075</mn><mo stretchy=\"false\">(</mo><mo>−</mo><mn>425</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mn>0.560</mn><mo stretchy=\"false\">(</mo><mn>175</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>47.40</mn></mrow><annotation encoding=\"application/x-tex\">0.225(-105)+0.140(35)+0.075(-425)+0.560(175)=\\$47.40</annotation></semantics></math></span>.</p>\n<p>If the manager could instead know the weather perfectly before choosing, the pitch would be bought only when rainy. Its expected incremental value would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo stretchy=\"false\">(</mo><mn>320</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>96</mn></mrow><annotation encoding=\"application/x-tex\">0.30(320)=\\$96</annotation></semantics></math></span>. This <b>expected value of perfect information</b> (EVPI) is an upper bound on what a weather signal can add here, before its price. The imperfect alert’s $52.40 is below $96, as it must be under these assumptions.</p>\n<p><b>Risk attitude matters.</b> A manager who dislikes large losses may prefer a lower-EMV policy. Conversely, clearing the 0.10 downside guardrail does not settle every concern: the alert policy still has a 0.075 chance of a −$425 day. State both the EMV and the loss scenario before recommending it.</p>\n<p><b>Failure mode:</b> Calling $52.40 the <i>net</i> value of subscribing. It is the gross value of the information; the $25 fee reduces the gain to $27.40.</p>\n<p><b>Try it — ungraded:</b> What is the largest daily alert fee that leaves this policy strictly better in EMV than never buying the pitch?</p>\n<p><b>Explained answer:</b> Before its fee, the alert improves EMV by $52.40. At a $52.40 fee the policies tie; a fee <b>below</b> $52.40 makes subscribing strictly better. This is an EMV ceiling, not a promise that a vendor is worth that amount in practice.</p>"},{"id":"3","level":2,"title":"3. Select a probability model that matches the question","short":"3. Select a probability model th…","html":""},{"id":"3.1","level":3,"title":"3.1 Binomial counts versus daily profit outcomes","short":"3.1. Binomial counts versus dail…","html":"<p>A <b>Bernoulli trial</b> has two outcomes. Under the alert policy, define a “severe-loss day” as profit below −$150. Its modeled probability is 0.075. If ten comparable cart-days were <b>independent</b> and each had the same 0.075 severe-loss probability, the number <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span> of severe-loss days would follow a <b>binomial distribution</b> with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">n=10</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>0.075</mn></mrow><annotation encoding=\"application/x-tex\">p=0.075</annotation></semantics></math></span>. The binomial model requires a fixed number of independent trials with a constant probability (Holmes et al., 2023).</p>\n<p>The expected <i>count</i> is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo stretchy=\"false\">(</mo><mi>K</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>n</mi><mi>p</mi><mo>=</mo><mn>10</mn><mo stretchy=\"false\">(</mo><mn>0.075</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.75</mn></mrow><annotation encoding=\"application/x-tex\">E(K)=np=10(0.075)=0.75</annotation></semantics></math></span> days. That does <b>not</b> mean a fractional day will occur. The chance of at least one severe-loss day is easier to calculate by its complement:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>K</mi><mo>≥</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>K</mi><mo>=</mo><mn>0</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mn>0.075</mn><msup><mo stretchy=\"false\">)</mo><mn>10</mn></msup><mo>=</mo><mn>1</mn><mo>−</mo><mn>0.92</mn><msup><mn>5</mn><mn>10</mn></msup><mo>≈</mo><mn>0.5414.</mn></mrow><annotation encoding=\"application/x-tex\">P(K\\geq1)=1-P(K=0)=1-(1-0.075)^{10}\n=1-0.925^{10}\\approx0.5414.</annotation></semantics></math></span></div></p>\n<p>The calculation answers a different question from the one-day guardrail. A 7.5% daily chance can coexist with about a 54.1% modeled chance of at least one such day across ten independent days.</p>\n<p>Other models answer other questions. A <b>Poisson</b> count could model arrivals in a fixed interval if a roughly stable rate and suitable occurrence assumptions were defensible; an <b>exponential</b> model could then concern time between arrivals under the corresponding process assumptions. A <b>normal</b> model can represent some continuous, approximately symmetric quantities, but should not automatically be assigned to Embercup’s four-point profit distribution: it could place probability on profit amounts this simple model cannot produce. These are model choices, not properties conferred by a software menu. The business-statistics review distinguishes binomial and Poisson count settings (Holmes et al., 2023).</p>\n<p><b>Failure mode:</b> Treating ten consecutive rainy-season days as independent without checking whether the same weather system affects several days. Correlation would undermine the binomial calculation.</p>\n<p><b>Try it — ungraded:</b> Under the same independence assumptions, what is the chance of <b>zero</b> severe-loss days in three days?</p>\n<p><b>Explained answer:</b> Each day avoids the event with probability <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><mn>0.075</mn><mo>=</mo><mn>0.925</mn></mrow><annotation encoding=\"application/x-tex\">1-0.075=0.925</annotation></semantics></math></span>. Multiply across three independent days: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.92</mn><msup><mn>5</mn><mn>3</mn></msup><mo>≈</mo><mn>0.7915</mn></mrow><annotation encoding=\"application/x-tex\">0.925^3\\approx0.7915</annotation></semantics></math></span>. Without independence, this multiplication is not justified.</p>"},{"id":"3.2","level":3,"title":"3.2 Inputs, units, and sensitivity before a simulation","short":"3.2. Inputs, units, and sensitiv…","html":"<p>A simulation draws many hypothetical outcomes from specified input distributions and applies the <b>same decision rule</b> to each. Before generating anything, write down the process: draw rain with probability 0.30; conditional on that rain result, draw an alert using 0.75 if rainy or 0.20 if dry; buy the pitch exactly when alerted; then calculate dollars of profit. Drawing rain and alert independently with unconditional probabilities would erase the alert’s usefulness.</p>\n<p>Test influential inputs first. Suppose alert sensitivity were 0.50 rather than 0.75 while the false-alert rate remained 0.20. The rain-and-alert probability would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo stretchy=\"false\">(</mo><mn>0.50</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.15</mn></mrow><annotation encoding=\"application/x-tex\">0.30(0.50)=0.15</annotation></semantics></math></span>; dry-and-alert would remain 0.14. Gross information value would become <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.15</mn><mo stretchy=\"false\">(</mo><mn>320</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mn>0.14</mn><mo stretchy=\"false\">(</mo><mo>−</mo><mn>140</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>28.40</mn></mrow><annotation encoding=\"application/x-tex\">0.15(320)+0.14(-140)=\\$28.40</annotation></semantics></math></span>. After the $25 fee, the gain would be only <b>$3.40</b> per day, below Embercup’s $20 target. Rain-and-no-alert probability would rise to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo stretchy=\"false\">(</mo><mn>0.50</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.15</mn></mrow><annotation encoding=\"application/x-tex\">0.30(0.50)=0.15</annotation></semantics></math></span>. Those days have profit −$425, so the severe-loss probability would be <b>0.15</b>, failing the 0.10 guardrail. This is a <b>sensitivity analysis</b>: change an uncertain input and re-evaluate both objectives.</p>\n<div class=\"key\"><b>Simulation propagates assumptions; it does not validate them.</b> A large number of trials reduces random simulation noise, not uncertainty about whether 0.75 is the vendor’s true sensitivity.</div>\n<p><b>Failure mode:</b> Entering estimated probabilities to three decimal places, running thousands of trials, and reporting the resulting mean as if it were measured to the nearest cent. The output precision cannot repair weak inputs.</p>\n<p><b>Try it — ungraded:</b> If sensitivity instead rose to 0.80 and the false-alert rate stayed 0.20, what is the rainy no-alert probability?</p>\n<p><b>Explained answer:</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo>∩</mo><mi mathvariant=\"normal\">¬</mi><mi>A</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">[</mo><mn>1</mn><mo>−</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>A</mi><mo>∣</mo><mi>R</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">]</mo><mo>=</mo><mn>0.30</mn><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mn>0.80</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.06</mn></mrow><annotation encoding=\"application/x-tex\">P(R\\cap\\neg A)=P(R)[1-P(A\\mid R)]=0.30(1-0.80)=0.06</annotation></semantics></math></span>. Under the unchanged payoff rule, this is also the probability of a profit below −$150.</p>"},{"id":"4","level":2,"title":"4. Reproduce and check the model","short":"4. Reproduce and check the model","html":""},{"id":"4.1","level":3,"title":"4.1 Excel 365: one trial per row","short":"4.1. Excel 365: one trial per row","html":"<p>The input is a model, <b>not</b> a customer dataset. Set the worksheet grain to one simulated cart-day per row. Before clicking anything, check the expected benchmark: 0.365 of days should have alerts, expected profit should approach $47.40, and about 0.075 of days should fall below −$150. Excel’s <code>RAND()</code> generates a value from 0 up to, but not including, 1 and recalculates with the worksheet; Microsoft documents both behaviors (Microsoft, n.d.-b).</p>\n<p>Make headers in row 1: <code>Trial</code>, <code>Rain</code>, <code>Alert</code>, <code>BuyPitch</code>, <code>Profit</code>, <code>SevereLoss</code>. In row 2, enter:</p>\n<pre><code>A2: =ROW()-1\nB2: =--(RAND()&lt;0.30)\nC2: =--(RAND()&lt;IF(B2=1,0.75,0.20))\nD2: =C2\nE2: =200-600*B2+D2*(-140+460*B2)-25\nF2: =--(E2&lt;-150)</code></pre>\n<p><code>B2</code> is 1 for rain and 0 for dry. <code>C2</code> applies the <b>conditional</b> alert chance. <code>D2</code> implements the decision rule. In <code>E2</code>, <code>200-600*B2</code> gives $200 if dry and −$400 if rainy; <code>D2*(-140+460*B2)</code> adds −$140 for a dry-day pitch or $320 for a rainy-day pitch; <code>-25</code> charges the alert every day. <code>F2</code> records whether the strict loss threshold was crossed. The double minus turns a TRUE/FALSE comparison into 1/0. Copy A2:F2 through row 10001 for <b>10,000 trials</b>.</p>\n<p>In empty cells, calculate:</p>\n<pre><code>=AVERAGE(C2:C10001)\n=AVERAGE(E2:E10001)\n=AVERAGE(F2:F10001)</code></pre>\n<p>Interpret these, respectively, as simulated alert frequency, average daily profit in dollars, and simulated severe-loss frequency. They should be <b>near</b>, not exactly equal to, 0.365, $47.40, and 0.075. A manual row check is decisive: set rain = 1 and alert = 1 in a <i>separate check row</i>; the profit formula must give −$105. Rain = 0 and alert = 0 must give $175. Do not overwrite random-trial cells and then include the hand checks in the simulation range.</p>\n<p>Microsoft’s Excel simulation guidance also warns that random formulas change on recalculation (Microsoft, n.d.-a). For a record of a run, preserve a copy of its trial outputs as values alongside the formulas, assumptions, run date, and trial count. Excel’s displayed run is not guaranteed to match a later recalculation.</p>\n<p><b>Failure mode:</b> Using <code>RAND()&lt;0.75</code> for alerts on <i>all</i> days. That changes both the alert frequency and the decision’s value.</p>\n<p><b>Try it — ungraded:</b> If a trial has <code>Rain=0</code> and <code>Alert=1</code>, what should <code>BuyPitch</code>, <code>Profit</code>, and <code>SevereLoss</code> be?</p>\n<p><b>Explained answer:</b> The rule buys the pitch, so <code>BuyPitch=1</code>. Profit is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>200</mn><mo>−</mo><mn>140</mn><mo>−</mo><mn>25</mn><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>35</mn></mrow><annotation encoding=\"application/x-tex\">200-140-25=\\$35</annotation></semantics></math></span>; $35 is not below −$150, so <code>SevereLoss=0</code>. This tests one branch without relying on random output.</p>"},{"id":"4.2","level":3,"title":"4.2 SPSS: equivalent trial logic and a reproducible run","short":"4.2. SPSS: equivalent trial logi…","html":"<p>SPSS can create one simulated case per cart-day rather than requiring real customer records. IBM documents both random-variable functions and the <code>INPUT PROGRAM</code>/<code>LOOP</code> pattern for generating cases. Its <code>SET SEED</code> setting can initialize the default random-number generator for a repeatable sequence within a specified environment (IBM, n.d.-a, n.d.-b, n.d.-c).</p>\n<p>Here the model inputs and units are identical to Excel’s. Run the following SPSS Statistics syntax in an empty working session:</p>\n<pre><code>SET RNG=MC SEED=24680.\nINPUT PROGRAM.\nLOOP #i=1 TO 10000.\n  COMPUTE trial=#i.\n  COMPUTE rain=RV.BERNOULLI(.30).\n  COMPUTE alert=RV.BERNOULLI(.20+.55*rain).\n  COMPUTE buy_pitch=alert.\n  COMPUTE profit=200-600*rain+buy_pitch*(-140+460*rain)-25.\n  COMPUTE severe_loss=(profit &lt; -150).\n  END CASE.\nEND LOOP.\nEND FILE.\nEND INPUT PROGRAM.\nEXECUTE.\nDESCRIPTIVES VARIABLES=rain alert profit severe_loss\n  /STATISTICS=MEAN MIN MAX.</code></pre>\n<p><code>RV.BERNOULLI(.30)</code> returns a 0/1 rain outcome. The alert argument equals <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.20</mn><mo>+</mo><mn>0.55</mn><mo stretchy=\"false\">(</mo><mn>0</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.20</mn></mrow><annotation encoding=\"application/x-tex\">0.20+0.55(0)=0.20</annotation></semantics></math></span> when dry and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.20</mn><mo>+</mo><mn>0.55</mn><mo stretchy=\"false\">(</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.75</mn></mrow><annotation encoding=\"application/x-tex\">0.20+0.55(1)=0.75</annotation></semantics></math></span> when rainy. The next two lines apply the same action and profit equations as Excel. <code>END CASE</code> creates each trial; <code>END FILE</code> stops generation. The mean of a 0/1 variable is its simulated event frequency. Check that rain’s mean is near 0.30, alert’s near 0.365, profit’s near $47.40, and severe loss’s near 0.075. The 0/1 minima and maxima also help flag coding errors.</p>\n<p>The seed helps <b>repeat the SPSS run</b> with the same settings; it does not make SPSS and Excel produce identical rows. Keep the syntax, software version, seed, assumptions, and output together. Run the four-row hand payoff table independently as the stronger arithmetic check.</p>\n<p><b>Failure mode:</b> Treating 10,000 simulated cases as 10,000 observed Embercup days. They are generated from four stipulated probabilities, not sampled from the business.</p>\n<p><b>Try it — ungraded:</b> Why does <code>severe_loss</code> average to a probability estimate rather than a dollar amount?</p>\n<p><b>Explained answer:</b> It is coded 1 when the modeled event happens and 0 otherwise. Its mean is the number of 1s divided by the number of trials—a simulated event proportion. <code>profit</code>, by contrast, is measured in dollars.</p>"},{"id":"5","level":2,"title":"5. Make a bounded recommendation","short":"5. Make a bounded recommendation","html":""},{"id":"5.1","level":3,"title":"5.1 Decision, limits, and next action","short":"5.1. Decision, limits, and next…","html":"<p>Separate four kinds of statement:</p>\n<ul><li><b>Descriptive observation:</b> There are no observed Embercup cart-days in this case. The input table describes a fictional planning model, not a measured sample.</li><li><b>Assumption:</b> Rain occurs on 30% of comparable days; the vendor’s alert has 75% sensitivity and a 20% false-alert rate; each weather–action combination has the listed profit.</li><li><b>Model implication:</b> With those assumptions, subscribing and buying the pitch only after an alert has $47.40 expected daily profit. That is $27.40 above the best no-alert policy and clears the $20 target. Its modeled chance of profit below −$150 is 0.075, below the 0.10 guardrail.</li><li><b>Bounded recommendation:</b> <i>Conditionally favor</i> the alert-and-act rule <b>only if</b> the assumptions and the manager’s loss tolerance withstand validation. Do not describe a simulated advantage as an observed business impact or a statistically significant effect.</li></ul>\n<p>A useful sensitivity finding changes the next action. At 50% alert sensitivity, the projected gain falls to $3.40 and the downside guardrail fails. The manager should therefore ask the vendor for dated, auditable alerts matched to weather outcomes, including <i>no-alert</i> days; confirm that the vendor’s timing permits the pitch decision; and check the profit estimates against comparable cart-days. A short prospective pilot with a predeclared comparison could assess inputs. Sampling uncertainty and intervals are developed in S05; tests and A/B guardrails in S06; stronger causal and predictive boundaries later. None is silently supplied by this model.</p>\n<p>The optional optimization connection is narrow but useful: if many carts compete for a limited number of covered pitches, “buy when <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mn>0.30435</mn></mrow><annotation encoding=\"application/x-tex\">p&gt;0.30435</annotation></semantics></math></span>” may no longer be sufficient. A capacity constraint and the carts’ <i>incremental</i> values would determine an allocation. Employee scheduling, logistics, and financial optimization models are outside today’s worked decision; they are bridges, not extra claims established by this example.</p>\n<p><b>Failure mode:</b> Recommending subscription solely because its EMV is larger. The vendor may be inaccurate, the severe-loss tolerance may differ, and a multi-cart decision may face constraints omitted here.</p>\n<p><b>Try it — ungraded:</b> A manager reports, “The simulation proves alerts cause a $27.40 daily gain.” Replace that sentence with a defensible one.</p>\n<p><b>Explained answer:</b> “Under the stated rain, alert, and payoff assumptions, the model projects a $27.40 higher <i>expected</i> profit per cart-day for the alert-and-act rule than for the best no-alert rule.” No real-world causal effect was estimated.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>Define the decision, cart-day unit, KPI, target, and downside guardrail before calculating.</li><li>Conditional risk uses the population <b>after</b> the stated condition; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>A</mi><mo>∣</mo><mi>R</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P(A\\mid R)</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo>∣</mo><mi>A</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P(R\\mid A)</annotation></semantics></math></span> differ.</li><li>Joint outcomes must cover all possibilities exactly once; their probabilities sum to one.</li><li>At the original rain prior, never buying the pitch has $20 EMV; always buying has $18.</li><li>Buy the pitch only when the available rain probability exceeds about 0.30435.</li><li>The imperfect alert has $52.40 gross information value and a $27.40 gain after its $25 daily fee.</li><li>The alert policy projects $47.40 expected daily profit and a 0.075 severe-loss probability; neither is an observed result.</li><li>Check every simulation against the four hand-calculated branches and the analytic benchmarks.</li><li>A less sensitive alert can remove the target gain <b>and</b> breach the guardrail.</li><li>Recommend conditionally, disclose loss exposure, and validate alert quality before committing.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<div class=\"tbl\"><table><thead><tr><th>Term</th><th>Plain-language meaning in this case</th></tr></thead><tbody><tr><td><b>Unit of analysis</b></td><td>One scheduled Embercup cart-day, the unit to which each profit and probability refers.</td></tr><tr><td><b>Event</b></td><td>A specified outcome, such as rain during selling hours.</td></tr><tr><td><b>Prior probability</b></td><td>Rain chance before the morning alert: 0.30 in the model.</td></tr><tr><td><b>Joint probability</b></td><td>Chance of two events together, such as rain <b>and</b> an alert.</td></tr><tr><td><b>Conditional probability</b></td><td>Chance within a restricted group, such as rain <b>among alert days</b>.</td></tr><tr><td><b>Sensitivity</b></td><td>Chance the vendor alerts when rain occurs.</td></tr><tr><td><b>False-alert rate</b></td><td>Chance the vendor alerts when rain does not occur.</td></tr><tr><td><b>Random variable</b></td><td>A number determined by an uncertain outcome, such as daily profit.</td></tr><tr><td><b>Distribution</b></td><td>Possible values of a random variable and their probabilities.</td></tr><tr><td><b>Payoff</b></td><td>Profit from a particular action and weather outcome.</td></tr><tr><td><b>Expected monetary value (EMV)</b></td><td>Probability-weighted average payoff under stated assumptions.</td></tr><tr><td><b>Decision threshold</b></td><td>Rain probability above which buying the pitch has positive expected incremental payoff.</td></tr><tr><td><b>Decision tree</b></td><td>A diagram or ordered account of choices, information, uncertain outcomes, and payoffs.</td></tr><tr><td><b>Value of sample information</b></td><td>Expected improvement from an imperfect signal before paying for it.</td></tr><tr><td><b>Guardrail</b></td><td>A limit the decision must respect in addition to its profit target.</td></tr><tr><td><b>Binomial distribution</b></td><td>Model for the count of events across a fixed number of independent, equal-probability trials.</td></tr><tr><td><b>Simulation</b></td><td>Repeated hypothetical draws from specified inputs, followed by the decision and payoff calculation.</td></tr><tr><td><b>Sensitivity analysis</b></td><td>Recalculation after changing an uncertain input to see whether the decision survives.</td></tr></tbody></table></div>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>Holmes, A., Illowsky, B., &amp; Dean, S. (2023). 3.1 Terminology. In <i>Introductory business statistics 2e</i>. OpenStax. <a href=\"https://openstax.org/books/introductory-business-statistics-2e/pages/3-1-terminology\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/introductory-business-statistics-2e/pages/3-1-terminology</a></p>\n<p>Holmes, A., Illowsky, B., &amp; Dean, S. (2023). Chapter 4 review. In <i>Introductory business statistics 2e</i>. OpenStax. <a href=\"https://openstax.org/books/introductory-business-statistics-2e/pages/4-chapter-review\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/introductory-business-statistics-2e/pages/4-chapter-review</a></p>\n<p>Illowsky, B., &amp; Dean, S. (2020). 4.2 Mean or expected value and standard deviation. In <i>Statistics</i>. OpenStax. <a href=\"https://openstax.org/books/statistics/pages/4-2-mean-or-expected-value-and-standard-deviation\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/statistics/pages/4-2-mean-or-expected-value-and-standard-deviation</a></p>\n<p>IBM. (n.d.-a). <i>Creating data (LOOP–END LOOP command).</i> IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=loop-creating-data-end-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=loop-creating-data-end-command</a></p>\n<p>IBM. (n.d.-b). <i>MTINDEX, RNG, and SEED subcommands (SET command).</i> IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=set-mtindex-rng-seed-subcommands-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=set-mtindex-rng-seed-subcommands-command</a></p>\n<p>IBM. (n.d.-c). <i>Random variable and distribution functions.</i> IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=expressions-random-variable-distribution-functions\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=expressions-random-variable-distribution-functions</a></p>\n<p>Massachusetts Institute of Technology. (2002). <i>Lecture 19, part 1: Decision trees and value of information</i> [Lecture slides]. MIT OpenCourseWare. <a href=\"https://ocw.mit.edu/courses/6-825-techniques-in-artificial-intelligence-sma-5504-fall-2002/d5b46fa507bf7dc6e16ad05e3ed83f7f_Lecture19FinalPart1.pdf\" target=\"_blank\" rel=\"noopener\">https://ocw.mit.edu/courses/6-825-techniques-in-artificial-intelligence-sma-5504-fall-2002/d5b46fa507bf7dc6e16ad05e3ed83f7f_Lecture19FinalPart1.pdf</a></p>\n<p>Microsoft. (n.d.-a). <i>Introduction to Monte Carlo simulation in Excel.</i> Microsoft Support. <a href=\"https://support.microsoft.com/en-US/Excel/introduction-to-monte-carlo-simulation-in-excel\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-US/Excel/introduction-to-monte-carlo-simulation-in-excel</a></p>\n<p>Microsoft. (n.d.-b). <i>RAND function.</i> Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/functions/rand-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/functions/rand-function</a></p>"}]};

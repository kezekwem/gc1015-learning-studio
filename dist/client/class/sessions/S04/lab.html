38","Meet your two datasets":"Conoce tus dos conjuntos de datos","Count first, then calculate. Blank cells are missing, not “No”.":"Primero cuenta, después calcula. Las celdas en blanco son datos faltantes, no “No”.","Each row of <code>cloudflow_churn_cohort.csv</code> is one account: did it churn, and was it flagged for high support tickets? Each row of <code>reference_trials.csv</code> is one fixed probability, u_001, for one simulation trial.":"Cada fila de <code>cloudflow_churn_cohort.csv</code> es una cuenta: ¿abandonó? ¿Se marcó por tener muchos tickets de soporte? Cada fila de <code>reference_trials.csv</code> es una probabilidad fija, u_001, para un ensayo de la simulación.","Use the filters to count rows before you trust any formula or pivot table.":"Usa los filtros para contar filas antes de confiar en cualquier fórmula o tabla dinámica.","Checkpoint A1: B7 and the four counts":"Punto de control A1: B7 y los cuatro conteos","In <code>IN-CLASS_Lab Part A</code>, B7 counts the source rows. B9:C10 hold four COUNTIFS cells: rows are HighTickets (Yes, No) and columns are Churn (Yes, No).":"En <code>IN-CLASS_Lab Part A</code>, B7 cuenta las filas de origen. B9:C10 contienen cuatro celdas COUNTIFS: las filas son HighTickets (Yes, No) y las columnas son Churn (Yes, No).","Confirm each count with the explorer, then type what your workbook shows.":"Confirma cada conteo con el explorador de datos y luego escribe lo que muestra tu libro.","<p>96 + 176 + 24 + 704 = 1,000. In Excel: <code>=COUNTIFS(Cohort[HighTickets],$A9,Cohort[Churn],B$8)</code>, filled to C10. The $ signs keep the row label in column A and the column label in row 8.</p>":"<p>96 + 176 + 24 + 704 = 1,000. En Excel: <code>=COUNTIFS(Cohort[HighTickets],$A9,Cohort[Churn],B$8)</code>, rellenado hasta C10. Los signos $ mantienen la etiqueta de fila en la columna A y la etiqueta de columna en la fila 8.</p>","B7   rows = {{n}}":"B7   filas = {{n}}","B9   HighTickets Yes, Churn Yes = {{b9}}":"B9   HighTickets Yes, Churn Yes = {{b9}}","C9   HighTickets Yes, Churn No = {{c9}}":"C9   HighTickets Yes, Churn No = {{c9}}","B10  HighTickets No, Churn Yes = {{b10}}":"B10  HighTickets No, Churn Yes = {{b10}}","C10  HighTickets No, Churn No = {{c10}}":"C10  HighTickets No, Churn No = {{c10}}","B7 = ROWS(Cohort[AccountID]) = 1,000. If you see 1,001, your range includes the header row.":"B7 = ROWS(Cohort[AccountID]) = 1,000. Si ves 1,001, tu rango incluye la fila de encabezado.","B7 source rows":"B7 filas de origen","Filter HighTickets = Yes and Churn = Yes: 96 rows.":"Filtra HighTickets = Yes y Churn = Yes: 96 filas.","B9 count":"Conteo de B9","C9 is HighTickets = Yes and Churn = No: 176. If you see 24, the two COUNTIFS criteria are swapped.":"C9 es HighTickets = Yes y Churn = No: 176. Si ves 24, los dos criterios de COUNTIFS están invertidos.","C9 count":"Conteo de C9","B10 is HighTickets = No and Churn = Yes: 24. If you see 176, the criteria are swapped.":"B10 es HighTickets = No y Churn = Yes: 24. Si ves 176, los criterios están invertidos.","B10 count":"Conteo de B10","HighTickets = No and Churn = No: 704. The four cells must add to 1,000.":"HighTickets = No y Churn = No: 704. Las cuatro celdas deben sumar 1,000.","C10 count":"Conteo de C10","Checkpoint A2: the totals":"Punto de control A2: los totales","Column D holds the row totals and row 11 the column totals.":"La columna D contiene los totales de fila y la fila 11, los totales de columna.","Type what your workbook shows.":"Escribe lo que muestra tu libro.","<p>272 flagged and 728 not flagged; 120 churned and 880 renewed; 1,000 complete pairs. D11 must equal B7, because this cohort has no blank categories.</p>":"<p>272 marcadas y 728 no marcadas; 120 abandonaron y 880 renovaron; 1,000 pares completos. D11 debe ser igual a B7, porque esta cohorte no tiene categorías en blanco.</p>","D9   flagged total = {{d9}}":"D9   total de marcadas = {{d9}}","D10  not flagged total = {{d10}}":"D10  total de no marcadas = {{d10}}","B11  churned total = {{b11}}":"B11  total que abandonó = {{b11}}","C11  renewed total = {{c11}}":"C11  total que renovó = {{c11}}","D11  all complete pairs = {{d11}}":"D11  todos los pares completos = {{d11}}","D9 = SUM(B9:C9) = 96 + 176.":"D9 = SUM(B9:C9) = 96 + 176.","D9 total":"Total de D9","D10 = SUM(B10:C10) = 24 + 704.":"D10 = SUM(B10:C10) = 24 + 704.","D10 total":"Total de D10","B11 = SUM(B9:B10) = 96 + 24.":"B11 = SUM(B9:B10) = 96 + 24.","B11 total":"Total de B11","C11 = SUM(C9:C10) = 176 + 704.":"C11 = SUM(C9:C10) = 176 + 704.","C11 total":"Total de C11","D11 adds all four cells: 1,000. If it differs from B7, a category is blank or misspelled.":"D11 suma las cuatro celdas: 1,000. Si difiere de B7, hay una categoría en blanco o mal escrita.","D11 total":"Total de D11","Checkpoint A3: B13 to B16":"Punto de control A3: B13 a B16","The workbook formats these cells as percentages. Type 0.12 or 12%; both are accepted here.":"El libro da formato de porcentaje a estas celdas. Escribe 0.12 o 12%; aquí se aceptan ambos.","<p>12.0%, 27.2%, 9.6% and 29.6%. The union subtracts the 96 accounts that sit in both the churn total and the flagged total, so they are not counted twice.</p>":"<p>12.0%, 27.2%, 9.6% y 29.6%. La unión resta las 96 cuentas que están tanto en el total de abandono como en el total de marcadas, para no contarlas dos veces.</p>","B13  P(C) = {{b13}}":"B13  P(C) = {{b13}}","B14  P(H) = {{b14}}":"B14  P(H) = {{b14}}","B15  P(C ∩ H) = {{b15}}":"B15  P(C ∩ H) = {{b15}}","B16  P(C ∪ H) = {{b16}}":"B16  P(C ∪ H) = {{b16}}","B13 = B11/D11 = 120 / 1,000. If you see 44.1%, you divided by D9 instead of D11.":"B13 = B11/D11 = 120 / 1,000. Si ves 44.1%, dividiste entre D9 en vez de D11.","B13 baseline churn":"B13 abandono de referencia","B14 = D9/D11 = 272 / 1,000.":"B14 = D9/D11 = 272 / 1,000.","B14 flagged share":"B14 proporción de marcadas","B15 = B9/D11 = 96 / 1,000. If you see 35.3%, you divided by D9; a joint probability uses all 1,000.":"B15 = B9/D11 = 96 / 1,000. Si ves 35.3%, dividiste entre D9; una probabilidad conjunta usa las 1,000.","B15 joint probability":"B15 probabilidad conjunta","B16 = B13 + B14 − B15. If you see 39.2%, you left out the overlap in B15.":"B16 = B13 + B14 − B15. Si ves 39.2%, omitiste la intersección de B15.","B16 union probability":"B16 probabilidad de la unión","Checkpoint A4: B17 and B18":"Punto de control A4: B17 y B18","Both cells share the numerator B9 = 96. Only the denominator changes.":"Ambas celdas comparten el numerador B9 = 96. Solo cambia el denominador.","<p>B18 = 35.3% is the CFO’s number: of 272 flagged accounts, 96 churned. B17 = 80.0% describes churners, not flagged accounts. Bayes rule gives the same B18: 0.096 ÷ (0.096 + 0.176).</p>":"<p>B18 = 35.3% es el número del CFO: de 272 cuentas marcadas, 96 abandonaron. B17 = 80.0% describe a las cuentas que abandonaron, no a las marcadas. La regla de Bayes da el mismo B18: 0.096 ÷ (0.096 + 0.176).</p>","B17  P(H | C) = {{b17}}":"B17  P(H | C) = {{b17}}","B18  P(C | H) = {{b18}}":"B18  P(C | H) = {{b18}}","B17 = B9/B11 = 96 / 120: the share of churners who were flagged.":"B17 = B9/B11 = 96 / 120: la proporción de cuentas que abandonaron y estaban marcadas.","B17 flagged share of churners":"B17 proporción marcada entre las que abandonaron","B18 = B9/D9 = 96 / 272. If B18 shows 80.0%, you divided by B11. If it shows 3,529%, remove the *100.":"B18 = B9/D9 = 96 / 272. Si B18 muestra 80.0%, dividiste entre B11. Si muestra 3,529%, quita el *100.","B18 churn risk among flagged":"B18 riesgo de abandono entre las marcadas","B18 = 35.3% (96 of 272); B17 = 80.0%":"B18 = 35.3% (96 de 272); B17 = 80.0%","What goes in B20?":"¿Qué va en B20?","B18 shows 35.3% against a 12.0% baseline in B13. The B20 dropdown has four statements, shortened here.":"B18 muestra 35.3% frente a una referencia de 12.0% en B13. La lista desplegable de B20 tiene cuatro afirmaciones, abreviadas aquí.","Which statement belongs in B20?":"¿Qué afirmación corresponde a B20?","<p>B21 then explains the choice in 2 to 3 sentences: numerator 96, denominator 272, the comparison with the 12.0% baseline, and the limit that the table shows association only.</p>":"<p>Luego, B21 explica la elección en 2 a 3 oraciones: numerador 96, denominador 272, la comparación con la referencia de 12.0% y el límite de que la tabla solo muestra asociación.</p>","Flagged accounts show higher recorded churn risk; screening priority, not a causal claim":"Las cuentas marcadas muestran un mayor riesgo de abandono registrado; es prioridad de revisión, no una afirmación causal","80% of flagged accounts churn, because 80% of churners were flagged":"El 80% de las cuentas marcadas abandona, porque el 80% de las que abandonaron estaban marcadas","That reverses the condition. 80% is B17, P(H | C). The share of flagged accounts that churned is B18, 35.3%.":"Eso invierte la condición. El 80% es B17, P(H | C). La proporción de cuentas marcadas que abandonaron es B18, 35.3%.","High tickets prove an automatic intervention will prevent churn":"Muchos tickets demuestran que una intervención automática evitará el abandono","The cohort contains no intervention. It shows an association, so it cannot prove prevention.":"La cohorte no contiene ninguna intervención. Muestra una asociación, así que no puede demostrar prevención.","The conditional rate uses all 1,000 accounts as its denominator":"La tasa condicional usa las 1,000 cuentas como denominador","B18 divides by D9, the 272 flagged accounts. Dividing by 1,000 gives the joint probability in B15.":"B18 divide entre D9, las 272 cuentas marcadas. Dividir entre 1,000 da la probabilidad conjunta de B15.","Read SPSS H1":"Lee H1 de SPSS","H1 runs CROSSTABS with Churn as rows and HighTickets as columns. It shows count, row %, column % and total %.":"H1 ejecuta CROSSTABS con Churn en las filas y HighTickets en las columnas. Muestra el conteo, el % de fila, el % de columna y el % del total.","Which H1 number should match your B18?":"¿Qué número de H1 debería coincidir con tu B18?","<p>Column percentages divide by each HighTickets column total, so the Yes column gives 96 / 272 = 35.3%. Your B25 caption names H1, the count read (96), this column percentage, and says that it agrees with B18.</p>":"<p>Los porcentajes de columna dividen entre el total de cada columna de HighTickets, así que la columna Yes da 96 / 272 = 35.3%. Tu leyenda en B25 nombra H1, el conteo leído (96) y este porcentaje de columna, y dice que coincide con B18.</p>","Churn = Yes row, column % under HighTickets = Yes: 35.3%":"Fila Churn = Yes, % de columna bajo HighTickets = Yes: 35.3%","Churn = Yes row, row % under HighTickets = Yes: 80.0%":"Fila Churn = Yes, % de fila bajo HighTickets = Yes: 80.0%","Row % divides by the Churn = Yes total, 120. That is P(H | C), your B17.":"El % de fila divide entre el total de Churn = Yes, 120. Eso es P(H | C), tu B17.","Total % in the Churn = Yes, HighTickets = Yes cell: 9.6%":"% del total en la celda Churn = Yes, HighTickets = Yes: 9.6%","Total % divides by all 1,000 accounts. That is the joint probability in B15.":"El % del total divide entre las 1,000 cuentas. Esa es la probabilidad conjunta de B15.","Checkpoint B: D14 to D17":"Punto de control B: D14 a D17","B7:D7 hold 30%, 50% and 20%. B10:D10 hold the Large Hub payoffs 12, 3 and −9; B11:D11 hold the Modular Hub payoffs 9, 5 and 1, in $ millions.":"B7:D7 contienen 30%, 50% y 20%. B10:D10 contienen los pagos del Hub Grande, 12, 3 y −9; B11:D11 contienen los pagos del Hub Modular, 9, 5 y 1, en millones de $.","<p>EMV(Large) = 0.30 × 12 + 0.50 × 3 + 0.20 × (−9) = 3.30, and EMV(Modular) = 5.40, in $ millions. The decision node keeps the larger, 5.40, and the premium is 2.10. SPSS H2 lists the same values with a probability total of 1.000.</p>":"<p>EMV(Large) = 0.30 × 12 + 0.50 × 3 + 0.20 × (−9) = 3.30, y EMV(Modular) = 5.40, en millones de $. El nodo de decisión conserva el mayor, 5.40, y la prima es 2.10. H2 de SPSS lista los mismos valores con una probabilidad total de 1.000.</p>","D14  EMV(Large) = {{d14}}":"D14  EMV(Large) = {{d14}}","D15  EMV(Modular) = {{d15}}":"D15  EMV(Modular) = {{d15}}","D16  rolled-back value = {{d16}}":"D16  valor resuelto hacia atrás = {{d16}}","D17  EMV premium = {{d17}}":"D17  prima de EMV = {{d17}}","D14 Large Hub EMV":"D14 EMV del Hub Grande","Fill D14 down to D15. If D15 shows 0.00, the $ signs are missing and the probabilities moved to the empty row 8.":"Rellena D14 hacia abajo hasta D15. Si D15 muestra 0.00, faltan los signos $ y las probabilidades se movieron a la fila 8, que está vacía.","D15 Modular Hub EMV":"D15 EMV del Hub Modular","D16 = MAX(D14:D15). Use the branch EMVs, not the largest single payoff, 12.":"D16 = MAX(D14:D15). Usa los EMV de las ramas, no el mayor pago individual, 12.","D16 rolled-back value":"D16 valor resuelto hacia atrás","D17 = MAX(D14:D15) − MIN(D14:D15) = 5.40 − 3.30.":"D17 = MAX(D14:D15) − MIN(D14:D15) = 5.40 − 3.30.","D17 EMV premium":"D17 prima de EMV","D14 = 3.30, D15 = 5.40, D16 = 5.40, D17 = 2.10":"D14 = 3.30, D15 = 5.40, D16 = 5.40, D17 = 2.10","Lock the probabilities":"Fija las probabilidades","You type a formula in D14 and fill it down to D15.":"Escribes una fórmula en D14 y la rellenas hacia abajo hasta D15.","Which D14 formula still works in D15?":"¿Qué fórmula de D14 sigue funcionando en D15?","<p>Absolute references ($) keep the probability row fixed; relative references let the payoff row move from 10 to 11. Show formulas (Ctrl+`) to check what each cell points at.</p>":"<p>Las referencias absolutas ($) mantienen fija la fila de probabilidades; las referencias relativas dejan que la fila de pagos pase de 10 a 11. Muestra las fórmulas (Ctrl+`) para comprobar a qué apunta cada celda.</p>","<code>=SUMPRODUCT($B$7:$D$7,B10:D10)</code>":"<code>=SUMPRODUCT($B$7:$D$7,B10:D10)</code>","<code>=SUMPRODUCT(B7:D7,B10:D10)</code>":"<code>=SUMPRODUCT(B7:D7,B10:D10)</code>","Filled down, it becomes SUMPRODUCT(B8:D8,B11:D11). Row 8 is empty, so D15 shows 0.00.":"Al rellenarla hacia abajo, se convierte en SUMPRODUCT(B8:D8,B11:D11). La fila 8 está vacía, así que D15 muestra 0.00.","<code>=SUMPRODUCT($B$7:$D$7,$B$10:$D$10)</code>":"<code>=SUMPRODUCT($B$7:$D$7,$B$10:$D$10)</code>","Filled down, D15 still points at row 10, so both hubs show the Large Hub EMV, 3.30.":"Al rellenarla hacia abajo, D15 sigue apuntando a la fila 10, así que ambos hubs muestran el EMV del Hub Grande, 3.30.","<code>=SUM(B7:D7)*SUM(B10:D10)</code>":"<code>=SUM(B7:D7)*SUM(B10:D10)</code>","That multiplies two totals: 1.00 × 6 = 6.00. EMV multiplies each probability by its own payoff, then adds.":"Eso multiplica dos totales: 1.00 × 6 = 6.00. El EMV multiplica cada probabilidad por su propio pago y luego suma.","What goes in B18?":"¿Qué va en B18?","D16 shows 5.40 and D17 shows 2.10. The B18 dropdown has four statements, shortened here.":"D16 muestra 5.40 y D17 muestra 2.10. La lista desplegable de B18 tiene cuatro afirmaciones, abreviadas aquí.","Which statement belongs in B18?":"¿Qué afirmación corresponde a B18?","<p>B19 then names the EMV rule, the chosen branch, the $2.10M premium and one risk-tolerance condition, for example a committee that cannot absorb a large loss.</p>":"<p>Luego, B19 nombra la regla del EMV, la rama elegida, la prima de $2.10M y una condición de tolerancia al riesgo, por ejemplo un comité que no puede absorber una pérdida grande.</p>","Under risk-neutral EMV, choose Modular; its EMV is not a guaranteed outcome":"Con un EMV neutral al riesgo, elige Modular; su EMV no es un resultado garantizado","Choose Large, because the highest possible payoff decides":"Elige Grande, porque decide el mayor pago posible","The $12M payoff happens only in high demand, with probability 0.30. EMV weighs all three states.":"El pago de $12M solo ocurre con demanda alta, con probabilidad 0.30. El EMV pondera los tres estados.","The hubs are equivalent because the probabilities sum to one":"Los hubs son equivalentes porque las probabilidades suman uno","The probabilities sum to 1 for both hubs. That checks the inputs; it does not compare the hubs.":"Las probabilidades suman 1 para ambos hubs. Eso verifica las entradas; no compara los hubs.","Modular guarantees $5.40M in every demand state":"Modular garantiza $5.40M en todos los estados de demanda","Modular pays $9M, $5M or $1M. $5.40M is their probability-weighted average.":"Modular paga $9M, $5M o $1M. $5.40M es su promedio ponderado por probabilidad.","Optional Topic 5: the tipping point":"Tema opcional 5: el punto de quiebre","In a copy, set D7 to <code>=1-B7-C7</code>, put <code>=D14-D15</code> in F14, and use Goal Seek to set F14 to 0 by changing B7.":"En una copia, pon D7 como <code>=1-B7-C7</code>, escribe <code>=D14-D15</code> en F14 y usa Buscar objetivo (Goal Seek) para llevar F14 a 0 cambiando B7.","What P(high) does Goal Seek return?":"¿Qué P(high) devuelve Buscar objetivo?","<p>p = 6/13 ≈ 0.4615, or 46.2%. The forecast, 0.30, is well below it, so the Modular choice is robust to a moderate forecast error. This topic is optional and not graded.</p>":"<p>p = 6/13 ≈ 0.4615, o 46.2%. El pronóstico, 0.30, está muy por debajo, así que la elección del Modular resiste un error de pronóstico moderado. Este tema es opcional y no se califica.</p>","B7 at the tie = {{p}}":"B7 en el empate = {{p}}","With P(medium) at 0.50, EMV(Large) = 21p − 3 and EMV(Modular) = 8p + 3. They tie at p = 6 ÷ 13.":"Con P(medium) en 0.50, EMV(Large) = 21p − 3 y EMV(Modular) = 8p + 3. Empatan en p = 6 ÷ 13.","Tipping point P(high)":"Punto de quiebre P(high)","Checkpoint C1: B14 and trial 1":"Punto de control C1: B14 y el ensayo 1","B7:B12 hold mean demand 1,000, SD 250, capacity 1,000, price $100, salvage $15 and cost $40. Trial 1 reads <code>Data_Trials!B2</code>.":"B7:B12 contienen demanda media 1,000, SD 250, capacidad 1,000, precio $100, valor de rescate $15 y costo $40. El ensayo 1 lee <code>Data_Trials!B2</code>.","Type B14, then trial 1 in B32 and C32.":"Escribe B14 y luego el ensayo 1 en B32 y C32.","<p>Trial 1: demand 653.82 units, 346.18 units unused, profit $30,575. Fill B32:C32 down to row 1031 so that every u_001 value gets its own trial. Use plain <code>Data_Trials!B2</code>, not <code>$B$2</code>, or every row repeats trial 1.</p>":"<p>Ensayo 1: demanda de 653.82 unidades, 346.18 unidades sin usar, ganancia de $30,575. Rellena B32:C32 hacia abajo hasta la fila 1031 para que cada valor de u_001 tenga su propio ensayo. Usa <code>Data_Trials!B2</code> sin más, no <code>$B$2</code>, o cada fila repetirá el ensayo 1.</p>","B14  profit at mean demand = $ {{b14}}":"B14  ganancia con la demanda media = $ {{b14}}","B32  trial 1 demand = {{b32}}":"B32  demanda del ensayo 1 = {{b32}}","C32  trial 1 profit = $ {{c32}}":"C32  ganancia del ensayo 1 = $ {{c32}}","At demand 1,000: 100 × 1,000 + 15 × 0 − 40 × 1,000 = 60,000.":"Con demanda de 1,000: 100 × 1,000 + 15 × 0 − 40 × 1,000 = 60,000.","B14 profit at mean demand":"B14 ganancia con la demanda media","B32 = NORM.INV(Data_Trials!B2,$B$7,$B$8) with u = 0.0831. #NUM! means the cell does not point at a probability between 0 and 1.":"B32 = NORM.INV(Data_Trials!B2,$B$7,$B$8) con u = 0.0831. #NUM! significa que la celda no apunta a una probabilidad entre 0 y 1.","B32 trial 1 demand":"B32 demanda del ensayo 1","If you see 25,382, the salvage term is missing: add MAX($B$9−B32,0)*$B$11.":"Si ves 25,382, falta el término del valor de rescate: agrega MAX($B$9−B32,0)*$B$11.","C32 trial 1 profit":"C32 ganancia del ensayo 1","Checkpoint C2: B16 to B20":"Punto de control C2: B16 a B20","Your 1,000 trial profits sit in C32:C1031.":"Tus 1,000 ganancias de los ensayos están en C32:C1031.","Type what your workbook shows, to the nearest dollar.":"Escribe lo que muestra tu libro, redondeado al dólar.","<p>Mean $51,320, SD $12,701, 5th percentile $25,884, and a gap of $8,680 below profit at mean demand. SPSS H3 lists the same mean, SD and 5th percentile, because it uses the same u_001 values and the same inclusive percentile rule.</p>":"<p>Media $51,320, SD $12,701, percentil 5 $25,884 y una diferencia de $8,680 por debajo de la ganancia con la demanda media. H3 de SPSS lista la misma media, SD y percentil 5, porque usa los mismos valores de u_001 y la misma regla de percentil inclusivo.</p>","B16  mean profit = $ {{b16}}":"B16  ganancia media = $ {{b16}}","B17  sample SD = $ {{b17}}":"B17  SD muestral = $ {{b17}}","B18  5th-percentile profit = $ {{b18}}":"B18  ganancia en el percentil 5 = $ {{b18}}","B19  gap B14 − B16 = $ {{b19}}":"B19  diferencia B14 − B16 = $ {{b19}}","B20  numeric trials = {{b20}}":"B20  ensayos numéricos = {{b20}}","B16 = AVERAGE(C32:C1031). If you see about 999, you averaged demand in column B instead of profit.":"B16 = AVERAGE(C32:C1031). Si ves unos 999, promediaste la demanda de la columna B en lugar de la ganancia.","B16 mean profit":"B16 ganancia media","B17 = STDEV.S(C32:C1031). If you see 12,695, you used STDEV.P, which divides by n instead of n − 1.":"B17 = STDEV.S(C32:C1031). Si ves 12,695, usaste STDEV.P, que divide entre n en lugar de n − 1.","B17 sample SD":"B17 SD muestral","B18 = PERCENTILE.INC(C32:C1031,0.05). PERCENTILE.EXC gives 25,776. Format it as dollars, not percent.":"B18 = PERCENTILE.INC(C32:C1031,0.05). PERCENTILE.EXC da 25,776. Dale formato de dólares, no de porcentaje.","B18 5th-percentile profit":"B18 ganancia en el percentil 5","B19 = B14 − B16 = 60,000 − 51,320.":"B19 = B14 − B16 = 60,000 − 51,320.","B19 gap":"B19 diferencia","B20 = COUNT(C32:C1031). If it is below 1,000, the fill stopped early; fill to row 1031.":"B20 = COUNT(C32:C1031). Si es menor que 1,000, el relleno se detuvo antes; rellena hasta la fila 1031.","B20 numeric trials":"B20 ensayos numéricos","B16 $51,320; B17 $12,701; B18 $25,884; B19 $8,680":"B16 $51,320; B17 $12,701; B18 $25,884; B19 $8,680","What goes in B22?":"¿Qué va en B22?","B14 shows $60,000 and B16 shows $51,320. The B22 dropdown has four statements, shortened here.":"B14 muestra $60,000 y B16 muestra $51,320. La lista desplegable de B22 tiene cuatro afirmaciones, abreviadas aquí.","Which statement belongs in B22?":"¿Qué afirmación corresponde a B22?","<p>B23 then compares $60,000 with $51,320, reads the 5th percentile in dollars, and names one limit of the model, such as the assumed normal demand.</p>":"<p>Luego, B23 compara $60,000 con $51,320, interpreta el percentil 5 en dólares y nombra un límite del modelo, como la demanda normal supuesta.</p>","Capacity and salvage make profit nonlinear, so the two numbers can differ":"La capacidad y el valor de rescate hacen que la ganancia no sea lineal, así que los dos números pueden diferir","Profit at mean demand must equal mean profit, since mean demand is 1,000":"La ganancia con la demanda media debe ser igual a la ganancia media, ya que la demanda media es 1,000","That holds only for a straight-line model. The capacity cap and the salvage price bend the profit line.":"Eso solo se cumple en un modelo lineal. El tope de capacidad y el precio de rescate curvan la línea de ganancia.","The 5th-percentile profit is the probability that profit is negative":"La ganancia en el percentil 5 es la probabilidad de que la ganancia sea negativa","B18 is a dollar amount: 5% of trials earn $25,884 or less. The chance of a loss is a separate measure.":"B18 es un monto en dólares: el 5% de los ensayos gana $25,884 o menos. La probabilidad de pérdida es otra medida.","A larger standard deviation guarantees a larger expected profit":"Una desviación estándar mayor garantiza una ganancia esperada mayor","SD measures spread. Here more spread lowers expected profit, because the upside is capped.":"La SD mide la dispersión. Aquí más dispersión reduce la ganancia esperada, porque el potencial al alza tiene tope.","Why fixed u values?":"¿Por qué valores de u fijos?","SPSS H3 and your Excel sheet both start from <code>reference_trials.csv</code> instead of RAND().":"H3 de SPSS y tu hoja de Excel parten de <code>reference_trials.csv</code> en lugar de RAND().","Why does the lab use fixed u_001 values?":"¿Por qué el laboratorio usa valores de u_001 fijos?","<p>RAND() recalculates whenever the sheet changes, so no two runs match. Fixed probabilities make the run reproducible, like a seed. Use <code>LAB02_Live_Exploration.xlsx</code> and F9 to watch the numbers move; it is not graded.</p>":"<p>RAND() se recalcula cada vez que cambia la hoja, así que no hay dos corridas iguales. Las probabilidades fijas hacen que la corrida sea reproducible, como una semilla. Usa <code>LAB02_Live_Exploration.xlsx</code> y F9 para ver cómo se mueven los números; no se califica.</p>","Everyone, including the grader and SPSS, gets the same 1,000 trials":"Todos, incluidos quien califica y SPSS, obtienen los mismos 1,000 ensayos","Fixed values make the simulation more accurate than RAND()":"Los valores fijos hacen la simulación más precisa que RAND()","They are not more accurate. They are the same kind of random draws, frozen so results can be checked exactly.":"No son más precisos. Son el mismo tipo de extracciones aleatorias, congeladas para que los resultados se puedan comprobar con exactitud.","RAND() cannot produce numbers between 0 and 1":"RAND() no puede producir números entre 0 y 1","RAND() does return values from 0 up to 1. The problem is that it changes on every recalculation.":"RAND() sí devuelve valores desde 0 hasta 1. El problema es que cambia con cada recálculo.","Checkpoint: count the losses (H4)":"Punto de control: cuenta las pérdidas (H4)","SPSS H4 flags each trial with profit below $0, then divides by the number of numeric trials.":"H4 de SPSS marca cada ensayo con ganancia por debajo de $0 y luego divide entre el número de ensayos numéricos.","Type the three values H4 lists.":"Escribe los tres valores que lista H4.","<p>4 of 1,000 trials lose money, a loss probability of 0.4%. The exact model value is about 0.24%, so 1,000 trials estimate a rare event only roughly. In Excel: <code>=COUNTIF(C32:C1031,\"&lt;0\")/COUNT(C32:C1031)</code>.</p>\n          <p>Look at trial 264: its demand is about −47 units. A normal model can produce impossible values, one limit worth naming in B23.</p>":"<p>4 de 1,000 ensayos pierden dinero, una probabilidad de pérdida del 0.4%. El valor exacto del modelo es de cerca del 0.24%, así que 1,000 ensayos estiman un evento raro solo de forma aproximada. En Excel: <code>=COUNTIF(C32:C1031,\"&lt;0\")/COUNT(C32:C1031)</code>.</p>\n          <p>Mira el ensayo 264: su demanda es de unas −47 unidades. Un modelo normal puede producir valores imposibles, un límite que vale la pena nombrar en B23.</p>","ShortfallCount = {{k}}":"ShortfallCount = {{k}}","NumericDenominator = {{n}}":"NumericDenominator = {{n}}","ShortfallProbability = {{p}}":"ShortfallProbability = {{p}}","Count trials with profit strictly below $0. The table lists the lowest trials.":"Cuenta los ensayos con ganancia estrictamente por debajo de $0. La tabla lista los ensayos más bajos.","Shortfall count":"Número de pérdidas","Every numeric profit counts: 1,000 trials.":"Cuenta toda ganancia numérica: 1,000 ensayos.","Numeric denominator":"Denominador numérico","Divide: 4 ÷ 1,000 = 0.004, which H4 shows as 0.4%.":"Divide: 4 ÷ 1,000 = 0.004, que H4 muestra como 0.4%.","Shortfall probability":"Probabilidad de pérdida","4 of 1,000 trials below $0 (0.4%)":"4 de 1,000 ensayos por debajo de $0 (0.4%)","Checkpoint B1033: pick your measures":"Punto de control B1033: elige tus medidas","B1033 asks for one expected-performance metric, one downside or spread metric, and one risk-tolerance condition.":"B1033 pide una métrica de desempeño esperado, una métrica de riesgo a la baja o de dispersión y una condición de tolerancia al riesgo.","Which set fits B1033 best?":"¿Qué conjunto encaja mejor en B1033?","<p>A sound B1033 cites the mean for expected performance, the 5th percentile or the loss share for the downside, and a condition such as: if capital preservation governs, prefer the lower loss probability as long as expected value stays positive.</p>":"<p>Un B1033 sólido cita la media para el desempeño esperado, el percentil 5 o la proporción de pérdidas para el riesgo a la baja, y una condición como esta: si manda la preservación del capital, prefiere la menor probabilidad de pérdida siempre que el valor esperado siga siendo positivo.</p>","Mean profit (B16), 5th percentile (B18) or loss share, and a capital-preservation condition":"Ganancia media (B16), percentil 5 (B18) o proporción de pérdidas, y una condición de preservación del capital","The standard deviation alone, because it measures risk":"Solo la desviación estándar, porque mide el riesgo","SD counts good surprises as risk too. Pair the mean with a one-sided downside measure.":"La SD también cuenta las sorpresas buenas como riesgo. Combina la media con una medida de riesgo a la baja de un solo lado.","Profit at mean demand (B14) and the best trial":"La ganancia con la demanda media (B14) y el mejor ensayo","B14 is the flawed deterministic number, and the best trial says nothing about losses.":"B14 es el número determinista con la falacia, y el mejor ensayo no dice nada sobre las pérdidas.","Pick Option A or B now, using Part C":"Elegir ya la Opción A o B, usando la Parte C","Not yet. B1033 states a principle. The take-home numbers decide between A and B.":"Todavía no. B1033 enuncia un principio. Los números de la tarea para casa deciden entre A y B.","Take-home: check row 38":"Tarea para casa: revisa la fila 38","In <code>POST-CLASS_Part 1</code>, row 38 is trial 1. Option A costs $1,000,000 up front, with mean cash flow $551,000 and SD $187,300 a year; Option B costs $900,000, with $498,600 and $100,200. The rate is 8% for 3 years.":"En <code>POST-CLASS_Part 1</code>, la fila 38 es el ensayo 1. La Opción A cuesta $1,000,000 al inicio, con un flujo de caja medio de $551,000 y SD de $187,300 al año; la Opción B cuesta $900,000, con $498,600 y $100,200. La tasa es del 8% durante 3 años.","Type D38, E38 and F38. These check the structure of your formulas, not your recommendation.":"Escribe D38, E38 y F38. Estos valores revisan la estructura de tus fórmulas, no tu recomendación.","<p>Trial 1 is a bad year for both options (z ≈ −1.385): Option A’s NPV is about −$248,409 and Option B’s about $27,372. Fill row 38 down to row 1037, then summarize each column the same way as Part C. The recommendation is yours to make from those summaries.</p>":"<p>El ensayo 1 es un mal año para ambas opciones (z ≈ −1.385): el NPV de la Opción A es de unos −$248,409 y el de la Opción B, de unos $27,372. Rellena la fila 38 hasta la fila 1037 y luego resume cada columna igual que en la Parte C. La recomendación la decides tú a partir de esos resúmenes.</p>","D38  z = {{z}}":"D38  z = {{z}}","E38  NPV of Option A = $ {{ea}}":"E38  NPV de la Opción A = $ {{ea}}","F38  NPV of Option B = $ {{fb}}":"F38  NPV de la Opción B = $ {{fb}}","D38 = NORM.S.INV(Data_Trials!B2). Trial 1 has u = 0.0831, so z is about −1.385.":"D38 = NORM.S.INV(Data_Trials!B2). El ensayo 1 tiene u = 0.0831, así que z es de unos −1.385.","D38 shared shock":"D38 shock común","If you see about −230,008, the investment went inside NPV(). Subtract $B$10 outside it: =-$B$10+NPV($B$7,...).":"Si ves unos −230,008, la inversión quedó dentro de NPV(). Resta $B$10 fuera: =-$B$10+NPV($B$7,...).","E38 NPV of Option A":"E38 NPV de la Opción A","Same structure as E38 with Option B’s cells: =-$C$10+NPV($B$7, three cash flows of $C$11+$C$12*$D38).":"La misma estructura que E38 con las celdas de la Opción B: =-$C$10+NPV($B$7, tres flujos de caja de $C$11+$C$12*$D38).","F38 NPV of Option B":"F38 NPV de la Opción B","Row 38: z = −1.385, structure checked":"Fila 38: z = −1.385, estructura revisada","Take-home: name the units":"Tarea para casa: nombra las unidades","B23 holds the absolute gap between the two loss probabilities in B20 and C20.":"B23 contiene la diferencia absoluta entre las dos probabilidades de pérdida de B20 y C20.","How should the memo describe B23?":"¿Cómo debería describir el memorando B23?","<p>Subtracting two percentages gives percentage points. Dividing by a starting value gives percent change. The memo cites every number with its unit and denominator, for example “x of 1,000 trials”.</p>":"<p>Restar dos porcentajes da puntos porcentuales. Dividir entre un valor inicial da un cambio porcentual. El memorando cita cada número con su unidad y su denominador, por ejemplo “x de 1,000 ensayos”.</p>","As a gap in percentage points between two loss probabilities":"Como una diferencia en puntos porcentuales entre dos probabilidades de pérdida","As a percent change in risk":"Como un cambio porcentual del riesgo","Percent change divides by one option’s probability. B23 subtracts two probabilities, so its unit is percentage points.":"El cambio porcentual divide entre la probabilidad de una opción. B23 resta dos probabilidades, así que su unidad son los puntos porcentuales.","As a dollar amount":"Como un monto en dólares","B23 compares probabilities. B22 is the dollar gap between the two mean NPVs.":"B23 compara probabilidades. B22 es la diferencia en dólares entre los dos NPV medios.","Take-home: finish the memo":"Tarea para casa: termina el memorando","Your checkpoints are saved in this browser. The recommendation, the evidence map and the AI disclosure are yours to write.":"Tus puntos de control se guardan en este navegador. La recomendación, el mapa de evidencia y la declaración de uso de IA los escribes tú.","B25: recommend Option A or B. Cite mean NPV and loss probability with their denominators, state one limitation, and name what would reverse your call.":"B25: recomienda la Opción A o B. Cita el NPV medio y la probabilidad de pérdida con sus denominadores, señala una limitación y nombra lo que cambiaría tu decisión.","One shared shock per trial drives both options and all three years. That assumes a persistent business condition, not independent years; name it as a limit.":"Un solo shock común por ensayo mueve ambas opciones y los tres años. Eso supone una condición de negocio persistente, no años independientes; nómbralo como un límite.","Optional stretch: in a copy, change B7 from 8% to 12%. Does the ranking or the loss-probability gap change?":"Reto opcional: en una copia, cambia B7 de 8% a 12%. ¿Cambia la clasificación o la diferencia entre las probabilidades de pérdida?","Open this page from the class site to see the dataset.":"Abre esta página desde el sitio de la clase para ver el conjunto de datos.","The six lowest-profit reference trials":"Los seis ensayos de referencia con menor ganancia","demand":"demanda","profit":"ganancia","The six lowest profits among the 1,000 reference trials, sorted from the lowest.":"Las seis ganancias más bajas entre los 1,000 ensayos de referencia, ordenadas de menor a mayor.","Lab checkpoints complete":"Puntos de control del laboratorio completados","Your checkpoint answers are saved. Finish the take-home memo in your workbook.":"Tus respuestas de los puntos de control están guardadas. Termina el memorando de la tarea para casa en tu libro.","D14 = SUMPRODUCT($B$7:$D$7,B10:D10). If you see 330, you typed the probabilities as 30, 50 and 20 instead of 30%, 50% and 20%.":"D14 = SUMPRODUCT($B$7:$D$7,B10:D10). Si ves 330, escribiste las probabilidades como 30, 50 y 20 en lugar de 30%, 50% y 20%."},"hi":{"LAB02 Checkpoints":"LAB02 चेकपॉइंट","GC1015 · Session 4 · Build it in Excel or SPSS, check it here":"GC1015 · सत्र 4 · Excel या SPSS में बनाएँ, यहाँ जाँचें","Finish":"समाप्त करें","Your lab results":"आपके लैब परिणाम","Get set":"तैयार हो जाएँ","Part A":"भाग A","Part B":"भाग B","Part C":"भाग C","Checkpoint and take-home":"चेकपॉइंट और टेक-होम","Lab files":"लैब फ़ाइलें","Work in your saved copy <code>LAB02_FirstName_LastName_NetID.xlsx</code>. Yellow cells are yours to build. Each sheet’s Check your work box confirms each result.":"अपनी सेव की हुई कॉपी <code>LAB02_FirstName_LastName_NetID.xlsx</code> में काम करें। पीले सेल आपको बनाने हैं। हर शीट का Check your work बॉक्स हर परिणाम की पुष्टि करता है।","Part":"भाग","Start at":"यहाँ से शुरू करें","Done when":"पूरा तब, जब","A":"A","IN-CLASS_Lab Part A!A7":"IN-CLASS_Lab Part A!A7","B18 = 35.3%":"B18 = 35.3%","B":"B","IN-CLASS_Lab Part B!A7":"IN-CLASS_Lab Part B!A7","D15 = 5.40":"D15 = 5.40","C":"C","IN-CLASS_Lab Part C!A7":"IN-CLASS_Lab Part C!A7","B20 = 1,000":"B20 = 1,000","Checkpoint":"चेकपॉइंट","IN-CLASS_Lab Part C!B1033":"IN-CLASS_Lab Part C!B1033","Principle written":"सिद्धांत लिखा गया","Take-home":"टेक-होम","POST-CLASS_Part 1!A7":"POST-CLASS_Part 1!A7","Memo, evidence map, AI note":"मेमो, साक्ष्य मैप, AI नोट","Datasets: cloudflow_churn_cohort.csv (1,000 accounts) and reference_trials.csv (1,000 fixed probabilities, u_001).":"डेटासेट: cloudflow_churn_cohort.csv (1,000 खाते) और reference_trials.csv (1,000 तय प्रायिकताएँ, u_001)।","SPSS: run the CD line and H0 once per session, then H1 to H4.":"SPSS: हर सेशन में CD लाइन और H0 एक बार चलाएँ, फिर H1 से H4।","Part A: B18":"भाग A: B18","Checkpoint A4":"चेकपॉइंट A4","Part B: D14 to D17":"भाग B: D14 से D17","Checkpoint B":"चेकपॉइंट B","Part C: B16 to B19":"भाग C: B16 से B19","Checkpoint C2":"चेकपॉइंट C2","Checkpoint: H4 loss share":"चेकपॉइंट: H4 में नुकसान का हिस्सा","Take-home: row 38":"टेक-होम: पंक्ति 38","Meet your two datasets":"अपने दो डेटासेट से परिचय","Count first, then calculate. Blank cells are missing, not “No”.":"पहले गिनें, फिर गणना करें। खाली सेल लुप्त (missing) मान हैं, “No” नहीं।","Each row of <code>cloudflow_churn_cohort.csv</code> is one account: did it churn, and was it flagged for high support tickets? Each row of <code>reference_trials.csv</code> is one fixed probability, u_001, for one simulation trial.":"<code>cloudflow_churn_cohort.csv</code> की हर पंक्ति एक खाता है: क्या वह चर्न (churn) हुआ, और क्या उसे ज़्यादा सपोर्ट टिकट के लिए फ़्लैग किया गया? <code>reference_trials.csv</code> की हर पंक्ति एक तय प्रायिकता, u_001, है, जो एक सिमुलेशन ट्रायल के लिए है।","Use the filters to count rows before you trust any formula or pivot table.":"किसी भी सूत्र या पिवट टेबल पर भरोसा करने से पहले, फ़िल्टर से पंक्तियाँ गिनें।","Checkpoint A1: B7 and the four counts":"चेकपॉइंट A1: B7 और चार गिनतियाँ","In <code>IN-CLASS_Lab Part A</code>, B7 counts the source rows. B9:C10 hold four COUNTIFS cells: rows are HighTickets (Yes, No) and columns are Churn (Yes, No).":"<code>IN-CLASS_Lab Part A</code> में, B7 स्रोत पंक्तियाँ गिनता है। B9:C10 में चार COUNTIFS सेल हैं: पंक्तियाँ HighTickets (Yes, No) हैं और कॉलम Churn (Yes, No)।","Confirm each count with the explorer, then type what your workbook shows.":"डेटा एक्सप्लोरर से हर गिनती की पुष्टि करें, फिर वह लिखें जो आपकी वर्कबुक दिखाती है।","<p>96 + 176 + 24 + 704 = 1,000. In Excel: <code>=COUNTIFS(Cohort[HighTickets],$A9,Cohort[Churn],B$8)</code>, filled to C10. The $ signs keep the row label in column A and the column label in row 8.</p>":"<p>96 + 176 + 24 + 704 = 1,000। Excel में: <code>=COUNTIFS(Cohort[HighTickets],$A9,Cohort[Churn],B$8)</code>, C10 तक भरा गया। $ चिह्न पंक्ति लेबल को कॉलम A में और कॉलम लेबल को पंक्ति 8 में स्थिर रखते हैं।</p>","B7   rows = {{n}}":"B7   पंक्तियाँ = {{n}}","B9   HighTickets Yes, Churn Yes = {{b9}}":"B9   HighTickets Yes, Churn Yes = {{b9}}","C9   HighTickets Yes, Churn No = {{c9}}":"C9   HighTickets Yes, Churn No = {{c9}}","B10  HighTickets No, Churn Yes = {{b10}}":"B10  HighTickets No, Churn Yes = {{b10}}","C10  HighTickets No, Churn No = {{c10}}":"C10  HighTickets No, Churn No = {{c10}}","B7 = ROWS(Cohort[AccountID]) = 1,000. If you see 1,001, your range includes the header row.":"B7 = ROWS(Cohort[AccountID]) = 1,000। अगर आपको 1,001 दिखे, तो आपकी रेंज में हेडर पंक्ति शामिल है।","B7 source rows":"B7 स्रोत पंक्तियाँ","Filter HighTickets = Yes and Churn = Yes: 96 rows.":"HighTickets = Yes और Churn = Yes फ़िल्टर करें: 96 पंक्तियाँ।","B9 count":"B9 गिनती","C9 is HighTickets = Yes and Churn = No: 176. If you see 24, the two COUNTIFS criteria are swapped.":"C9, HighTickets = Yes और Churn = No है: 176। अगर आपको 24 दिखे, तो दोनों COUNTIFS मानदंड आपस में बदल गए हैं।","C9 count":"C9 गिनती","B10 is HighTickets = No and Churn = Yes: 24. If you see 176, the criteria are swapped.":"B10, HighTickets = No और Churn = Yes है: 24। अगर आपको 176 दिखे, तो मानदंड आपस में बदल गए हैं।","B10 count":"B10 गिनती","HighTickets = No and Churn = No: 704. The four cells must add to 1,000.":"HighTickets = No और Churn = No: 704। चारों सेल का योग 1,000 होना चाहिए।","C10 count":"C10 गिनती","Checkpoint A2: the totals":"चेकपॉइंट A2: योग","Column D holds the row totals and row 11 the column totals.":"कॉलम D में पंक्ति योग हैं और पंक्ति 11 में कॉलम योग।","Type what your workbook shows.":"वह लिखें जो आपकी वर्कबुक दिखाती है।","<p>272 flagged and 728 not flagged; 120 churned and 880 renewed; 1,000 complete pairs. D11 must equal B7, because this cohort has no blank categories.</p>":"<p>272 फ़्लैग हुए और 728 फ़्लैग नहीं हुए; 120 चर्न हुए और 880 रिन्यू हुए; 1,000 पूर्ण जोड़े। D11 को B7 के बराबर होना चाहिए, क्योंकि इस कोहोर्ट में कोई खाली श्रेणी नहीं है।</p>","D9   flagged total = {{d9}}":"D9   फ़्लैग हुए का योग = {{d9}}","D10  not flagged total = {{d10}}":"D10  फ़्लैग नहीं हुए का योग = {{d10}}","B11  churned total = {{b11}}":"B11  चर्न हुए का योग = {{b11}}","C11  renewed total = {{c11}}":"C11  रिन्यू हुए का योग = {{c11}}","D11  all complete pairs = {{d11}}":"D11  सभी पूर्ण जोड़े = {{d11}}","D9 = SUM(B9:C9) = 96 + 176.":"D9 = SUM(B9:C9) = 96 + 176।","D9 total":"D9 योग","D10 = SUM(B10:C10) = 24 + 704.":"D10 = SUM(B10:C10) = 24 + 704।","D10 total":"D10 योग","B11 = SUM(B9:B10) = 96 + 24.":"B11 = SUM(B9:B10) = 96 + 24।","B11 total":"B11 योग","C11 = SUM(C9:C10) = 176 + 704.":"C11 = SUM(C9:C10) = 176 + 704।","C11 total":"C11 योग","D11 adds all four cells: 1,000. If it differs from B7, a category is blank or misspelled.":"D11 चारों सेल जोड़ता है: 1,000। अगर यह B7 से अलग है, तो कोई श्रेणी खाली है या उसकी वर्तनी गलत है।","D11 total":"D11 योग","Checkpoint A3: B13 to B16":"चेकपॉइंट A3: B13 से B16","The workbook formats these cells as percentages. Type 0.12 or 12%; both are accepted here.":"वर्कबुक इन सेल को प्रतिशत के रूप में फ़ॉर्मैट करती है। 0.12 या 12% लिखें; यहाँ दोनों स्वीकार हैं।","<p>12.0%, 27.2%, 9.6% and 29.6%. The union subtracts the 96 accounts that sit in both the churn total and the flagged total, so they are not counted twice.</p>":"<p>12.0%, 27.2%, 9.6% और 29.6%। सम्मिलन (union) उन 96 खातों को घटाता है जो चर्न के योग और फ़्लैग के योग, दोनों में हैं, ताकि वे दो बार न गिने जाएँ।</p>","B13  P(C) = {{b13}}":"B13  P(C) = {{b13}}","B14  P(H) = {{b14}}":"B14  P(H) = {{b14}}","B15  P(C ∩ H) = {{b15}}":"B15  P(C ∩ H) = {{b15}}","B16  P(C ∪ H) = {{b16}}":"B16  P(C ∪ H) = {{b16}}","B13 = B11/D11 = 120 / 1,000. If you see 44.1%, you divided by D9 instead of D11.":"B13 = B11/D11 = 120 / 1,000। अगर आपको 44.1% दिखे, तो आपने D11 के बजाय D9 से भाग दिया।","B13 baseline churn":"B13 बेसलाइन चर्न","B14 = D9/D11 = 272 / 1,000.":"B14 = D9/D11 = 272 / 1,000।","B14 flagged share":"B14 फ़्लैग हुए खातों का हिस्सा","B15 = B9/D11 = 96 / 1,000. If you see 35.3%, you divided by D9; a joint probability uses all 1,000.":"B15 = B9/D11 = 96 / 1,000। अगर आपको 35.3% दिखे, तो आपने D9 से भाग दिया; संयुक्त प्रायिकता (joint probability) सभी 1,000 का उपयोग करती है।","B15 joint probability":"B15 संयुक्त प्रायिकता","B16 = B13 + B14 − B15. If you see 39.2%, you left out the overlap in B15.":"B16 = B13 + B14 − B15। अगर आपको 39.2% दिखे, तो आपने B15 का ओवरलैप छोड़ दिया।","B16 union probability":"B16 सम्मिलन (union) की प्रायिकता","Checkpoint A4: B17 and B18":"चेकपॉइंट A4: B17 और B18","Both cells share the numerator B9 = 96. Only the denominator changes.":"दोनों सेल का अंश (numerator) एक ही है, B9 = 96। सिर्फ़ हर (denominator) बदलता है।","<p>B18 = 35.3% is the CFO’s number: of 272 flagged accounts, 96 churned. B17 = 80.0% describes churners, not flagged accounts. Bayes rule gives the same B18: 0.096 ÷ (0.096 + 0.176).</p>":"<p>B18 = 35.3% CFO की संख्या है: 272 फ़्लैग किए गए खातों में से 96 चर्न हुए। B17 = 80.0% चर्न हुए खातों का वर्णन करता है, फ़्लैग किए गए खातों का नहीं। बेज़ नियम (Bayes rule) से वही B18 मिलता है: 0.096 ÷ (0.096 + 0.176)।</p>","B17  P(H | C) = {{b17}}":"B17  P(H | C) = {{b17}}","B18  P(C | H) = {{b18}}":"B18  P(C | H) = {{b18}}","B17 = B9/B11 = 96 / 120: the share of churners who were flagged.":"B17 = B9/B11 = 96 / 120: चर्न हुए खातों में से फ़्लैग हुए खातों का हिस्सा।","B17 flagged share of churners":"B17 चर्न हुए खातों में फ़्लैग का हिस्सा","B18 = B9/D9 = 96 / 272. If B18 shows 80.0%, you divided by B11. If it shows 3,529%, remove the *100.":"B18 = B9/D9 = 96 / 272। अगर B18 में 80.0% दिखे, तो आपने B11 से भाग दिया। अगर 3,529% दिखे, तो *100 हटा दें।","B18 churn risk among flagged":"B18 फ़्लैग हुए खातों में चर्न जोखिम","B18 = 35.3% (96 of 272); B17 = 80.0%":"B18 = 35.3% (272 में से 96); B17 = 80.0%","What goes in B20?":"B20 में क्या जाएगा?","B18 shows 35.3% against a 12.0% baseline in B13. The B20 dropdown has four statements, shortened here.":"B18 में 35.3% दिखता है, जबकि B13 में बेसलाइन 12.0% है। B20 के ड्रॉपडाउन में चार कथन हैं, जो यहाँ छोटे करके दिए गए हैं।","Which statement belongs in B20?":"B20 में कौन-सा कथन जाएगा?","<p>B21 then explains the choice in 2 to 3 sentences: numerator 96, denominator 272, the comparison with the 12.0% baseline, and the limit that the table shows association only.</p>":"<p>फिर B21 इस चुनाव को 2 से 3 वाक्यों में समझाता है: अंश 96, हर 272, 12.0% बेसलाइन से तुलना, और यह सीमा कि तालिका सिर्फ़ संबंध (association) दिखाती है।</p>","Flagged accounts show higher recorded churn risk; screening priority, not a causal claim":"फ़्लैग किए गए खातों में दर्ज चर्न जोखिम ज़्यादा है; यह स्क्रीनिंग प्राथमिकता है, कारणात्मक दावा नहीं","80% of flagged accounts churn, because 80% of churners were flagged":"80% फ़्लैग किए गए खाते चर्न होते हैं, क्योंकि 80% चर्न हुए खाते फ़्लैग हुए थे","That reverses the condition. 80% is B17, P(H | C). The share of flagged accounts that churned is B18, 35.3%.":"यह शर्त को उलट देता है। 80% B17 है, P(H | C)। फ़्लैग किए गए खातों में चर्न होने वालों का हिस्सा B18 है, 35.3%।","High tickets prove an automatic intervention will prevent churn":"ज़्यादा टिकट साबित करते हैं कि एक स्वचालित हस्तक्षेप चर्न रोकेगा","The cohort contains no intervention. It shows an association, so it cannot prove prevention.":"कोहोर्ट में कोई हस्तक्षेप नहीं है। यह सिर्फ़ संबंध दिखाता है, इसलिए रोकथाम साबित नहीं कर सकता।","The conditional rate uses all 1,000 accounts as its denominator":"सशर्त दर हर (denominator) के रूप में सभी 1,000 खातों का उपयोग करती है","B18 divides by D9, the 272 flagged accounts. Dividing by 1,000 gives the joint probability in B15.":"B18, D9 से भाग देता है, यानी 272 फ़्लैग किए गए खाते। 1,000 से भाग देने पर B15 की संयुक्त प्रायिकता मिलती है।","Read SPSS H1":"SPSS H1 पढ़ें","H1 runs CROSSTABS with Churn as rows and HighTickets as columns. It shows count, row %, column % and total %.":"H1, CROSSTABS चलाता है, जिसमें Churn पंक्तियों में और HighTickets कॉलम में है। यह गिनती, पंक्ति %, कॉलम % और कुल % दिखाता है।","Which H1 number should match your B18?":"H1 की कौन-सी संख्या आपके B18 से मेल खानी चाहिए?","<p>Column percentages divide by each HighTickets column total, so the Yes column gives 96 / 272 = 35.3%. Your B25 caption names H1, the count read (96), this column percentage, and says that it agrees with B18.</p>":"<p>कॉलम प्रतिशत हर HighTickets कॉलम के योग से भाग देते हैं, इसलिए Yes कॉलम से 96 / 272 = 35.3% मिलता है। आपके B25 कैप्शन में H1, पढ़ी गई गिनती (96) और यह कॉलम प्रतिशत हो, और यह लिखा हो कि यह B18 से मेल खाता है।</p>","Churn = Yes row, column % under HighTickets = Yes: 35.3%":"Churn = Yes पंक्ति, HighTickets = Yes के नीचे कॉलम %: 35.3%","Churn = Yes row, row % under HighTickets = Yes: 80.0%":"Churn = Yes पंक्ति, HighTickets = Yes के नीचे पंक्ति %: 80.0%","Row % divides by the Churn = Yes total, 120. That is P(H | C), your B17.":"पंक्ति % Churn = Yes के योग, 120, से भाग देता है। वह P(H | C) है, आपका B17।","Total % in the Churn = Yes, HighTickets = Yes cell: 9.6%":"Churn = Yes, HighTickets = Yes सेल में कुल %: 9.6%","Total % divides by all 1,000 accounts. That is the joint probability in B15.":"कुल % सभी 1,000 खातों से भाग देता है। वह B15 की संयुक्त प्रायिकता है।","Checkpoint B: D14 to D17":"चेकपॉइंट B: D14 से D17","B7:D7 hold 30%, 50% and 20%. B10:D10 hold the Large Hub payoffs 12, 3 and −9; B11:D11 hold the Modular Hub payoffs 9, 5 and 1, in $ millions.":"B7:D7 में 30%, 50% और 20% हैं। B10:D10 में Large Hub के पेऑफ़ 12, 3 और −9 हैं; B11:D11 में Modular Hub के पेऑफ़ 9, 5 और 1 हैं, $ मिलियन में।","<p>EMV(Large) = 0.30 × 12 + 0.50 × 3 + 0.20 × (−9) = 3.30, and EMV(Modular) = 5.40, in $ millions. The decision node keeps the larger, 5.40, and the premium is 2.10. SPSS H2 lists the same values with a probability total of 1.000.</p>":"<p>EMV(Large) = 0.30 × 12 + 0.50 × 3 + 0.20 × (−9) = 3.30, और EMV(Modular) = 5.40, $ मिलियन में। निर्णय नोड बड़ा मान, 5.40, रखता है, और प्रीमियम 2.10 है। SPSS H2 यही मान दिखाता है, और प्रायिकताओं का योग 1.000 है।</p>","D14  EMV(Large) = {{d14}}":"D14  EMV(Large) = {{d14}}","D15  EMV(Modular) = {{d15}}":"D15  EMV(Modular) = {{d15}}","D16  rolled-back value = {{d16}}":"D16  रोल-बैक मान = {{d16}}","D17  EMV premium = {{d17}}":"D17  EMV प्रीमियम = {{d17}}","D14 Large Hub EMV":"D14 Large Hub EMV","Fill D14 down to D15. If D15 shows 0.00, the $ signs are missing and the probabilities moved to the empty row 8.":"D14 को D15 तक नीचे भरें। अगर D15 में 0.00 दिखे, तो $ चिह्न गायब हैं और प्रायिकताएँ खाली पंक्ति 8 पर खिसक गई हैं।","D15 Modular Hub EMV":"D15 Modular Hub EMV","D16 = MAX(D14:D15). Use the branch EMVs, not the largest single payoff, 12.":"D16 = MAX(D14:D15)। शाखाओं के EMV का उपयोग करें, सबसे बड़े अकेले पेऑफ़, 12, का नहीं।","D16 rolled-back value":"D16 रोल-बैक मान","D17 = MAX(D14:D15) − MIN(D14:D15) = 5.40 − 3.30.":"D17 = MAX(D14:D15) − MIN(D14:D15) = 5.40 − 3.30।","D17 EMV premium":"D17 EMV प्रीमियम","D14 = 3.30, D15 = 5.40, D16 = 5.40, D17 = 2.10":"D14 = 3.30, D15 = 5.40, D16 = 5.40, D17 = 2.10","Lock the probabilities":"प्रायिकताएँ लॉक करें","You type a formula in D14 and fill it down to D15.":"आप D14 में एक सूत्र लिखते हैं और उसे D15 तक नीचे भरते हैं।","Which D14 formula still works in D15?":"D14 का कौन-सा सूत्र D15 में भी सही काम करता है?","<p>Absolute references ($) keep the probability row fixed; relative references let the payoff row move from 10 to 11. Show formulas (Ctrl+`) to check what each cell points at.</p>":"<p>निरपेक्ष संदर्भ (absolute references, $) प्रायिकता वाली पंक्ति को स्थिर रखते हैं; सापेक्ष संदर्भ (relative references) पेऑफ़ पंक्ति को 10 से 11 पर जाने देते हैं। हर सेल किसे इंगित करता है, यह जाँचने के लिए Show formulas (Ctrl+`) चालू करें।</p>","<code>=SUMPRODUCT($B$7:$D$7,B10:D10)</code>":"<code>=SUMPRODUCT($B$7:$D$7,B10:D10)</code>","<code>=SUMPRODUCT(B7:D7,B10:D10)</code>":"<code>=SUMPRODUCT(B7:D7,B10:D10)</code>","Filled down, it becomes SUMPRODUCT(B8:D8,B11:D11). Row 8 is empty, so D15 shows 0.00.":"नीचे भरने पर यह SUMPRODUCT(B8:D8,B11:D11) बन जाता है। पंक्ति 8 खाली है, इसलिए D15 में 0.00 दिखता है।","<code>=SUMPRODUCT($B$7:$D$7,$B$10:$D$10)</code>":"<code>=SUMPRODUCT($B$7:$D$7,$B$10:$D$10)</code>","Filled down, D15 still points at row 10, so both hubs show the Large Hub EMV, 3.30.":"नीचे भरने पर भी D15 पंक्ति 10 को ही इंगित करता है, इसलिए दोनों हब Large Hub का EMV, 3.30, दिखाते हैं।","<code>=SUM(B7:D7)*SUM(B10:D10)</code>":"<code>=SUM(B7:D7)*SUM(B10:D10)</code>","That multiplies two totals: 1.00 × 6 = 6.00. EMV multiplies each probability by its own payoff, then adds.":"यह दो योगों को गुणा करता है: 1.00 × 6 = 6.00। EMV हर प्रायिकता को उसके अपने पेऑफ़ से गुणा करता है, फिर जोड़ता है।","What goes in B18?":"B18 में क्या जाएगा?","D16 shows 5.40 and D17 shows 2.10. The B18 dropdown has four statements, shortened here.":"D16 में 5.40 और D17 में 2.10 दिखता है। B18 के ड्रॉपडाउन में चार कथन हैं, जो यहाँ छोटे करके दिए गए हैं।","Which statement belongs in B18?":"B18 में कौन-सा कथन जाएगा?","<p>B19 then names the EMV rule, the chosen branch, the $2.10M premium and one risk-tolerance condition, for example a committee that cannot absorb a large loss.</p>":"<p>फिर B19 में EMV नियम, चुनी गई शाखा, $2.10M का प्रीमियम और जोखिम सहनशीलता की एक शर्त लिखें, उदाहरण के लिए ऐसी समिति जो बड़ा नुकसान नहीं झेल सकती।</p>","Under risk-neutral EMV, choose Modular; its EMV is not a guaranteed outcome":"जोखिम-तटस्थ (risk-neutral) EMV के आधार पर Modular चुनें; उसका EMV कोई गारंटीशुदा परिणाम नहीं है","Choose Large, because the highest possible payoff decides":"Large चुनें, क्योंकि सबसे ऊँचा संभव पेऑफ़ ही फ़ैसला करता है","The $12M payoff happens only in high demand, with probability 0.30. EMV weighs all three states.":"$12M का पेऑफ़ सिर्फ़ उच्च माँग में मिलता है, जिसकी प्रायिकता 0.30 है। EMV तीनों स्थितियों को भार देता है।","The hubs are equivalent because the probabilities sum to one":"दोनों हब बराबर हैं, क्योंकि प्रायिकताओं का योग एक है","The probabilities sum to 1 for both hubs. That checks the inputs; it does not compare the hubs.":"दोनों हबों के लिए प्रायिकताओं का योग 1 है। इससे इनपुट की जाँच होती है; हबों की तुलना नहीं होती।","Modular guarantees $5.40M in every demand state":"Modular हर माँग स्थिति में $5.40M की गारंटी देता है","Modular pays $9M, $5M or $1M. $5.40M is their probability-weighted average.":"Modular से $9M, $5M या $1M मिलता है। $5.40M उनका प्रायिकता-भारित औसत है।","Optional Topic 5: the tipping point":"वैकल्पिक विषय 5: टिपिंग पॉइंट","In a copy, set D7 to <code>=1-B7-C7</code>, put <code>=D14-D15</code> in F14, and use Goal Seek to set F14 to 0 by changing B7.":"एक कॉपी में D7 को <code>=1-B7-C7</code> पर सेट करें, F14 में <code>=D14-D15</code> लिखें, और Goal Seek से B7 बदलकर F14 को 0 पर सेट करें।","What P(high) does Goal Seek return?":"Goal Seek कौन-सा P(high) लौटाता है?","<p>p = 6/13 ≈ 0.4615, or 46.2%. The forecast, 0.30, is well below it, so the Modular choice is robust to a moderate forecast error. This topic is optional and not graded.</p>":"<p>p = 6/13 ≈ 0.4615, यानी 46.2%। पूर्वानुमान, 0.30, इससे काफ़ी नीचे है, इसलिए पूर्वानुमान में मध्यम त्रुटि होने पर भी Modular का चुनाव मज़बूत रहता है। यह विषय वैकल्पिक है और इसके अंक नहीं मिलते।</p>","B7 at the tie = {{p}}":"बराबरी पर B7 = {{p}}","With P(medium) at 0.50, EMV(Large) = 21p − 3 and EMV(Modular) = 8p + 3. They tie at p = 6 ÷ 13.":"P(medium) 0.50 पर होने पर, EMV(Large) = 21p − 3 और EMV(Modular) = 8p + 3। ये p = 6 ÷ 13 पर बराबर होते हैं।","Tipping point P(high)":"टिपिंग पॉइंट P(high)","Checkpoint C1: B14 and trial 1":"चेकपॉइंट C1: B14 और ट्रायल 1","B7:B12 hold mean demand 1,000, SD 250, capacity 1,000, price $100, salvage $15 and cost $40. Trial 1 reads <code>Data_Trials!B2</code>.":"B7:B12 में माध्य माँग 1,000, SD 250, क्षमता 1,000, कीमत $100, साल्वेज $15 और लागत $40 हैं। ट्रायल 1 <code>Data_Trials!B2</code> को पढ़ता है।","Type B14, then trial 1 in B32 and C32.":"B14 लिखें, फिर B32 और C32 में ट्रायल 1।","<p>Trial 1: demand 653.82 units, 346.18 units unused, profit $30,575. Fill B32:C32 down to row 1031 so that every u_001 value gets its own trial. Use plain <code>Data_Trials!B2</code>, not <code>$B$2</code>, or every row repeats trial 1.</p>":"<p>ट्रायल 1: माँग 653.82 यूनिट, 346.18 यूनिट अप्रयुक्त, लाभ $30,575। B32:C32 को पंक्ति 1031 तक नीचे भरें, ताकि हर u_001 मान का अपना ट्रायल हो। सादा <code>Data_Trials!B2</code> इस्तेमाल करें, <code>$B$2</code> नहीं, वरना हर पंक्ति ट्रायल 1 को ही दोहराएगी।</p>","B14  profit at mean demand = $ {{b14}}":"B14  माध्य माँग पर लाभ = $ {{b14}}","B32  trial 1 demand = {{b32}}":"B32  ट्रायल 1 की माँग = {{b32}}","C32  trial 1 profit = $ {{c32}}":"C32  ट्रायल 1 का लाभ = $ {{c32}}","At demand 1,000: 100 × 1,000 + 15 × 0 − 40 × 1,000 = 60,000.":"माँग 1,000 पर: 100 × 1,000 + 15 × 0 − 40 × 1,000 = 60,000।","B14 profit at mean demand":"B14 माध्य माँग पर लाभ","B32 = NORM.INV(Data_Trials!B2,$B$7,$B$8) with u = 0.0831. #NUM! means the cell does not point at a probability between 0 and 1.":"B32 = NORM.INV(Data_Trials!B2,$B$7,$B$8), जहाँ u = 0.0831। #NUM! का मतलब है कि सेल 0 और 1 के बीच की किसी प्रायिकता को इंगित नहीं करता।","B32 trial 1 demand":"B32 ट्रायल 1 की माँग","If you see 25,382, the salvage term is missing: add MAX($B$9−B32,0)*$B$11.":"अगर आपको 25,382 दिखे, तो साल्वेज वाला पद गायब है: MAX($B$9−B32,0)*$B$11 जोड़ें।","C32 trial 1 profit":"C32 ट्रायल 1 का लाभ","Checkpoint C2: B16 to B20":"चेकपॉइंट C2: B16 से B20","Your 1,000 trial profits sit in C32:C1031.":"आपके 1,000 ट्रायल लाभ C32:C1031 में हैं।","Type what your workbook shows, to the nearest dollar.":"वह लिखें जो आपकी वर्कबुक दिखाती है, निकटतम डॉलर तक।","<p>Mean $51,320, SD $12,701, 5th percentile $25,884, and a gap of $8,680 below profit at mean demand. SPSS H3 lists the same mean, SD and 5th percentile, because it uses the same u_001 values and the same inclusive percentile rule.</p>":"<p>माध्य $51,320, SD $12,701, 5वाँ पर्सेंटाइल (percentile) $25,884, और माध्य माँग पर लाभ से $8,680 का अंतर। SPSS H3 वही माध्य, SD और 5वाँ पर्सेंटाइल दिखाता है, क्योंकि यह वही u_001 मान और वही inclusive पर्सेंटाइल नियम इस्तेमाल करता है।</p>","B16  mean profit = $ {{b16}}":"B16  माध्य लाभ = $ {{b16}}","B17  sample SD = $ {{b17}}":"B17  नमूना SD = $ {{b17}}","B18  5th-percentile profit = $ {{b18}}":"B18  5वें पर्सेंटाइल का लाभ = $ {{b18}}","B19  gap B14 − B16 = $ {{b19}}":"B19  अंतर B14 − B16 = $ {{b19}}","B20  numeric trials = {{b20}}":"B20  संख्यात्मक ट्रायल = {{b20}}","B16 = AVERAGE(C32:C1031). If you see about 999, you averaged demand in column B instead of profit.":"B16 = AVERAGE(C32:C1031)। अगर आपको लगभग 999 दिखे, तो आपने लाभ के बजाय कॉलम B की माँग का औसत लिया।","B16 mean profit":"B16 माध्य लाभ","B17 = STDEV.S(C32:C1031). If you see 12,695, you used STDEV.P, which divides by n instead of n − 1.":"B17 = STDEV.S(C32:C1031)। अगर आपको 12,695 दिखे, तो आपने STDEV.P इस्तेमाल किया, जो n − 1 के बजाय n से भाग देता है।","B17 sample SD":"B17 नमूना SD","B18 = PERCENTILE.INC(C32:C1031,0.05). PERCENTILE.EXC gives 25,776. Format it as dollars, not percent.":"B18 = PERCENTILE.INC(C32:C1031,0.05)। PERCENTILE.EXC से 25,776 मिलता है। इसे डॉलर में फ़ॉर्मैट करें, प्रतिशत में नहीं।","B18 5th-percentile profit":"B18 5वें पर्सेंटाइल का लाभ","B19 = B14 − B16 = 60,000 − 51,320.":"B19 = B14 − B16 = 60,000 − 51,320।","B19 gap":"B19 अंतर","B20 = COUNT(C32:C1031). If it is below 1,000, the fill stopped early; fill to row 1031.":"B20 = COUNT(C32:C1031)। अगर यह 1,000 से कम है, तो भराई पहले ही रुक गई; पंक्ति 1031 तक भरें।","B20 numeric trials":"B20 संख्यात्मक ट्रायल","B16 $51,320; B17 $12,701; B18 $25,884; B19 $8,680":"B16 $51,320; B17 $12,701; B18 $25,884; B19 $8,680","What goes in B22?":"B22 में क्या जाएगा?","B14 shows $60,000 and B16 shows $51,320. The B22 dropdown has four statements, shortened here.":"B14 में $60,000 और B16 में $51,320 दिखता है। B22 के ड्रॉपडाउन में चार कथन हैं, जो यहाँ छोटे करके दिए गए हैं।","Which statement belongs in B22?":"B22 में कौन-सा कथन जाएगा?","<p>B23 then compares $60,000 with $51,320, reads the 5th percentile in dollars, and names one limit of the model, such as the assumed normal demand.</p>":"<p>फिर B23 में $60,000 की तुलना $51,320 से करें, 5वें पर्सेंटाइल को डॉलर में पढ़ें, और मॉडल की एक सीमा बताएँ, जैसे माँग को सामान्य (normal) मान लेना।</p>","Capacity and salvage make profit nonlinear, so the two numbers can differ":"क्षमता और साल्वेज लाभ को अरैखिक (nonlinear) बनाते हैं, इसलिए दोनों संख्याएँ अलग हो सकती हैं","Profit at mean demand must equal mean profit, since mean demand is 1,000":"माध्य माँग पर लाभ, माध्य लाभ के बराबर होना ही चाहिए, क्योंकि माध्य माँग 1,000 है","That holds only for a straight-line model. The capacity cap and the salvage price bend the profit line.":"यह सिर्फ़ सीधी रेखा वाले मॉडल में सही है। क्षमता की सीमा और साल्वेज कीमत लाभ रेखा को मोड़ देती हैं।","The 5th-percentile profit is the probability that profit is negative":"5वें पर्सेंटाइल का लाभ, लाभ के ऋणात्मक होने की प्रायिकता है","B18 is a dollar amount: 5% of trials earn $25,884 or less. The chance of a loss is a separate measure.":"B18 एक डॉलर राशि है: 5% ट्रायल $25,884 या उससे कम कमाते हैं। नुकसान की संभावना एक अलग माप है।","A larger standard deviation guarantees a larger expected profit":"ज़्यादा मानक विचलन (standard deviation) ज़्यादा अपेक्षित लाभ की गारंटी देता है","SD measures spread. Here more spread lowers expected profit, because the upside is capped.":"SD फैलाव मापता है। यहाँ ज़्यादा फैलाव अपेक्षित लाभ को घटाता है, क्योंकि ऊपरी फ़ायदा सीमित है।","Why fixed u values?":"u के तय मान क्यों?","SPSS H3 and your Excel sheet both start from <code>reference_trials.csv</code> instead of RAND().":"SPSS H3 और आपकी Excel शीट, दोनों RAND() के बजाय <code>reference_trials.csv</code> से शुरू होते हैं।","Why does the lab use fixed u_001 values?":"लैब u_001 के तय मान क्यों इस्तेमाल करती है?","<p>RAND() recalculates whenever the sheet changes, so no two runs match. Fixed probabilities make the run reproducible, like a seed. Use <code>LAB02_Live_Exploration.xlsx</code> and F9 to watch the numbers move; it is not graded.</p>":"<p>शीट बदलते ही RAND() दोबारा गणना करता है, इसलिए कोई भी दो रन मेल नहीं खाते। तय प्रायिकताएँ रन को दोहराने योग्य बनाती हैं, ठीक सीड की तरह। संख्याओं को बदलते देखने के लिए <code>LAB02_Live_Exploration.xlsx</code> और F9 इस्तेमाल करें; इसके अंक नहीं मिलते।</p>","Everyone, including the grader and SPSS, gets the same 1,000 trials":"हर किसी को, ग्रेडर और SPSS समेत, वही 1,000 ट्रायल मिलते हैं","Fixed values make the simulation more accurate than RAND()":"तय मान सिमुलेशन को RAND() से ज़्यादा सटीक बनाते हैं","They are not more accurate. They are the same kind of random draws, frozen so results can be checked exactly.":"वे ज़्यादा सटीक नहीं हैं। वे उसी तरह के यादृच्छिक मान हैं, जिन्हें स्थिर कर दिया गया है ताकि परिणामों की ठीक-ठीक जाँच हो सके।","RAND() cannot produce numbers between 0 and 1":"RAND() 0 और 1 के बीच की संख्याएँ नहीं बना सकता","RAND() does return values from 0 up to 1. The problem is that it changes on every recalculation.":"RAND() 0 से 1 तक के मान लौटाता ही है। समस्या यह है कि यह हर दोबारा गणना पर बदल जाता है।","Checkpoint: count the losses (H4)":"चेकपॉइंट: नुकसान गिनें (H4)","SPSS H4 flags each trial with profit below $0, then divides by the number of numeric trials.":"SPSS H4 हर उस ट्रायल को चिह्नित करता है जिसका लाभ $0 से कम है, फिर संख्यात्मक ट्रायल की संख्या से भाग देता है।","Type the three values H4 lists.":"H4 जो तीन मान दिखाता है, वे लिखें।","<p>4 of 1,000 trials lose money, a loss probability of 0.4%. The exact model value is about 0.24%, so 1,000 trials estimate a rare event only roughly. In Excel: <code>=COUNTIF(C32:C1031,\"&lt;0\")/COUNT(C32:C1031)</code>.</p>\n          <p>Look at trial 264: its demand is about −47 units. A normal model can produce impossible values, one limit worth naming in B23.</p>":"<p>1,000 में से 4 ट्रायल में नुकसान होता है, यानी नुकसान की प्रायिकता 0.4%। मॉडल का सटीक मान लगभग 0.24% है, इसलिए 1,000 ट्रायल किसी दुर्लभ घटना का सिर्फ़ मोटा अनुमान देते हैं। Excel में: <code>=COUNTIF(C32:C1031,\"&lt;0\")/COUNT(C32:C1031)</code>।</p>\n          <p>ट्रायल 264 देखें: इसकी माँग लगभग −47 यूनिट है। सामान्य (normal) मॉडल असंभव मान भी दे सकता है, यह एक सीमा है जिसे B23 में बताना चाहिए।</p>","ShortfallCount = {{k}}":"ShortfallCount = {{k}}","NumericDenominator = {{n}}":"NumericDenominator = {{n}}","ShortfallProbability = {{p}}":"ShortfallProbability = {{p}}","Count trials with profit strictly below $0. The table lists the lowest trials.":"उन ट्रायल को गिनें जिनका लाभ $0 से सख्ती से कम है। तालिका में सबसे कम लाभ वाले ट्रायल दिए गए हैं।","Shortfall count":"नुकसान की गिनती","Every numeric profit counts: 1,000 trials.":"हर संख्यात्मक लाभ गिना जाता है: 1,000 ट्रायल।","Numeric denominator":"संख्यात्मक हर (denominator)","Divide: 4 ÷ 1,000 = 0.004, which H4 shows as 0.4%.":"भाग दें: 4 ÷ 1,000 = 0.004, जिसे H4 0.4% के रूप में दिखाता है।","Shortfall probability":"नुकसान की प्रायिकता","4 of 1,000 trials below $0 (0.4%)":"1,000 में से 4 ट्रायल $0 से नीचे (0.4%)","Checkpoint B1033: pick your measures":"चेकपॉइंट B1033: अपने माप चुनें","B1033 asks for one expected-performance metric, one downside or spread metric, and one risk-tolerance condition.":"B1033 में एक अपेक्षित प्रदर्शन मीट्रिक, एक नुकसान-पक्ष या फैलाव मीट्रिक, और जोखिम सहनशीलता की एक शर्त चाहिए।","Which set fits B1033 best?":"कौन-सा सेट B1033 के लिए सबसे उपयुक्त है?","<p>A sound B1033 cites the mean for expected performance, the 5th percentile or the loss share for the downside, and a condition such as: if capital preservation governs, prefer the lower loss probability as long as expected value stays positive.</p>":"<p>एक अच्छा B1033 अपेक्षित प्रदर्शन के लिए माध्य, नुकसान के पक्ष के लिए 5वाँ पर्सेंटाइल या नुकसान का हिस्सा, और एक शर्त बताता है, जैसे: अगर पूँजी बचाना सबसे अहम है, तो कम नुकसान प्रायिकता वाला विकल्प चुनें, बशर्ते अपेक्षित मान धनात्मक रहे।</p>","Mean profit (B16), 5th percentile (B18) or loss share, and a capital-preservation condition":"माध्य लाभ (B16), 5वाँ पर्सेंटाइल (B18) या नुकसान का हिस्सा, और पूँजी बचाने की एक शर्त","The standard deviation alone, because it measures risk":"सिर्फ़ मानक विचलन, क्योंकि वह जोखिम मापता है","SD counts good surprises as risk too. Pair the mean with a one-sided downside measure.":"SD अच्छे आश्चर्यों को भी जोखिम गिनता है। माध्य के साथ नुकसान-पक्ष का एकतरफ़ा माप जोड़ें।","Profit at mean demand (B14) and the best trial":"माध्य माँग पर लाभ (B14) और सबसे अच्छा ट्रायल","B14 is the flawed deterministic number, and the best trial says nothing about losses.":"B14 वही भ्रामक नियतात्मक (deterministic) संख्या है, और सबसे अच्छा ट्रायल नुकसान के बारे में कुछ नहीं बताता।","Pick Option A or B now, using Part C":"भाग C के आधार पर अभी Option A या B चुनें","Not yet. B1033 states a principle. The take-home numbers decide between A and B.":"अभी नहीं। B1033 एक सिद्धांत बताता है। A और B के बीच फ़ैसला टेक-होम की संख्याएँ करेंगी।","Take-home: check row 38":"टेक-होम: पंक्ति 38 जाँचें","In <code>POST-CLASS_Part 1</code>, row 38 is trial 1. Option A costs $1,000,000 up front, with mean cash flow $551,000 and SD $187,300 a year; Option B costs $900,000, with $498,600 and $100,200. The rate is 8% for 3 years.":"<code>POST-CLASS_Part 1</code> में पंक्ति 38 ट्रायल 1 है। Option A की शुरुआती लागत $1,000,000 है, सालाना माध्य नकदी प्रवाह $551,000 और SD $187,300; Option B की लागत $900,000 है, माध्य $498,600 और SD $100,200। दर 8% है, 3 साल के लिए।","Type D38, E38 and F38. These check the structure of your formulas, not your recommendation.":"D38, E38 और F38 लिखें। ये आपके सूत्रों की संरचना जाँचते हैं, आपकी सिफ़ारिश नहीं।","<p>Trial 1 is a bad year for both options (z ≈ −1.385): Option A’s NPV is about −$248,409 and Option B’s about $27,372. Fill row 38 down to row 1037, then summarize each column the same way as Part C. The recommendation is yours to make from those summaries.</p>":"<p>ट्रायल 1 दोनों विकल्पों के लिए बुरा साल है (z ≈ −1.385): Option A का NPV लगभग −$248,409 है और Option B का लगभग $27,372। पंक्ति 38 को पंक्ति 1037 तक नीचे भरें, फिर हर कॉलम का सारांश भाग C की तरह बनाएँ। सिफ़ारिश आपको इन्हीं सारांशों से तय करनी है।</p>","D38  z = {{z}}":"D38  z = {{z}}","E38  NPV of Option A = $ {{ea}}":"E38  Option A का NPV = $ {{ea}}","F38  NPV of Option B = $ {{fb}}":"F38  Option B का NPV = $ {{fb}}","D38 = NORM.S.INV(Data_Trials!B2). Trial 1 has u = 0.0831, so z is about −1.385.":"D38 = NORM.S.INV(Data_Trials!B2)। ट्रायल 1 का u = 0.0831 है, इसलिए z लगभग −1.385 है।","D38 shared shock":"D38 साझा झटका (shock)","If you see about −230,008, the investment went inside NPV(). Subtract $B$10 outside it: =-$B$10+NPV($B$7,...).":"अगर आपको लगभग −230,008 दिखे, तो निवेश NPV() के अंदर चला गया है। $B$10 को बाहर घटाएँ: =-$B$10+NPV($B$7,...)।","E38 NPV of Option A":"E38 Option A का NPV","Same structure as E38 with Option B’s cells: =-$C$10+NPV($B$7, three cash flows of $C$11+$C$12*$D38).":"E38 जैसी ही संरचना, Option B के सेल के साथ: =-$C$10+NPV($B$7, $C$11+$C$12*$D38 के तीन नकदी प्रवाह)।","F38 NPV of Option B":"F38 Option B का NPV","Row 38: z = −1.385, structure checked":"पंक्ति 38: z = −1.385, संरचना जाँची गई","Take-home: name the units":"टेक-होम: इकाइयाँ बताएँ","B23 holds the absolute gap between the two loss probabilities in B20 and C20.":"B23 में B20 और C20 की दो नुकसान प्रायिकताओं के बीच का निरपेक्ष अंतर है।","How should the memo describe B23?":"मेमो को B23 का वर्णन कैसे करना चाहिए?","<p>Subtracting two percentages gives percentage points. Dividing by a starting value gives percent change. The memo cites every number with its unit and denominator, for example “x of 1,000 trials”.</p>":"<p>दो प्रतिशत घटाने पर प्रतिशत अंक मिलते हैं। किसी शुरुआती मान से भाग देने पर प्रतिशत बदलाव मिलता है। मेमो हर संख्या को उसकी इकाई और हर (denominator) के साथ बताता है, उदाहरण के लिए “1,000 ट्रायल में से x”।</p>","As a gap in percentage points between two loss probabilities":"दो नुकसान प्रायिकताओं के बीच प्रतिशत अंकों में अंतर के रूप में","As a percent change in risk":"जोखिम में प्रतिशत बदलाव के रूप में","Percent change divides by one option’s probability. B23 subtracts two probabilities, so its unit is percentage points.":"प्रतिशत बदलाव किसी एक विकल्प की प्रायिकता से भाग देता है। B23 दो प्रायिकताओं को घटाता है, इसलिए इसकी इकाई प्रतिशत अंक है।","As a dollar amount":"एक डॉलर राशि के रूप में","B23 compares probabilities. B22 is the dollar gap between the two mean NPVs.":"B23 प्रायिकताओं की तुलना करता है। B22 दो माध्य NPV के बीच का डॉलर अंतर है।","Take-home: finish the memo":"टेक-होम: मेमो पूरा करें","Your checkpoints are saved in this browser. The recommendation, the evidence map and the AI disclosure are yours to write.":"आपके चेकपॉइंट इस ब्राउज़र में सेव हैं। सिफ़ारिश, साक्ष्य मैप और AI डिस्क्लोज़र आपको खुद लिखने हैं।","B25: recommend Option A or B. Cite mean NPV and loss probability with their denominators, state one limitation, and name what would reverse your call.":"B25: Option A या B की सिफ़ारिश करें। माध्य NPV और नुकसान की प्रायिकता उनके हर (denominator) के साथ बताएँ, एक सीमा लिखें, और बताएँ कि क्या होने पर आपका फ़ैसला पलट जाएगा।","One shared shock per trial drives both options and all three years. That assumes a persistent business condition, not independent years; name it as a limit.":"हर ट्रायल में एक ही साझा झटका दोनों विकल्पों और तीनों सालों को प्रभावित करता है। यह एक लगातार बनी रहने वाली व्यावसायिक स्थिति मानता है, स्वतंत्र साल नहीं; इसे एक सीमा के रूप में बताएँ।","Optional stretch: in a copy, change B7 from 8% to 12%. Does the ranking or the loss-probability gap change?":"वैकल्पिक चुनौती: एक कॉपी में B7 को 8% से 12% करें। क्या रैंकिंग या नुकसान-प्रायिकता का अंतर बदलता है?","Open this page from the class site to see the dataset.":"डेटासेट देखने के लिए यह पेज क्लास साइट से खोलें।","The six lowest-profit reference trials":"सबसे कम लाभ वाले छह संदर्भ ट्रायल","demand":"माँग","profit":"लाभ","The six lowest profits among the 1,000 reference trials, sorted from the lowest.":"1,000 संदर्भ ट्रायल में से सबसे कम छह लाभ, सबसे कम से शुरू करके।","Lab checkpoints complete":"लैब चेकपॉइंट पूरे हुए","Your checkpoint answers are saved. Finish the take-home memo in your workbook.":"आपके चेकपॉइंट उत्तर सेव हो गए हैं। टेक-होम मेमो अपनी वर्कबुक में पूरा करें।","D14 = SUMPRODUCT($B$7:$D$7,B10:D10). If you see 330, you typed the probabilities as 30, 50 and 20 instead of 30%, 50% and 20%.":"D14 = SUMPRODUCT($B$7:$D$7,B10:D10)। अगर आपको 330 दिखे, तो आपने प्रायिकताएँ 30%, 50% और 20% के बजाय 30, 50 और 20 के रूप में लिखी हैं।"}};

   reference_trials.csv, all verified by verify_S04.py. Take-home screens check structure only (row 38), not the
   graded summary results or the recommendation. */
(function () {
  'use strict';
  const K = LessonKit;
  const St = K.Stats;
  const money = (v) => `${v < 0 ? '−' : ''}$${Math.round(Math.abs(v)).toLocaleString('en-US')}`;
  const profitAt = (d) => 100 * Math.min(d, 1000) + 15 * Math.max(1000 - d, 0) - 40 * 1000;
  const fallback = (el, a) => el.append(a.h('p', { class: 'lk-caption' }, K.tr('Open this page from the class site to see the dataset.')));

  const cohortExplorer = (el, a, opts = {}) => {
    const data = a.data('cloudflow');
    if (!data) { fallback(el, a); return null; }
    return a.explorer(el, { data, show: ['AccountID', 'Churn', 'HighTickets'], filters: opts.filters || ['HighTickets', 'Churn'], pageSize: 6, label: 'cloudflow_churn_cohort.csv' });
  };
  const trialsExplorer = (el, a) => {
    const data = a.data('trials');
    if (!data) { fallback(el, a); return null; }
    return a.explorer(el, { data, show: ['trial', 'u_001'], filters: [], pageSize: 6, label: 'reference_trials.csv' });
  };
  // The lowest-profit reference trials, recomputed from u_001 with the Part C model.
  function lowestTrials(el, a, k = 6) {
    const data = a.data('trials');
    if (!data) { fallback(el, a); return; }
    const it = data.columns.indexOf('trial'), iu = data.columns.indexOf('u_001');
    const rows = data.rows.map((r) => {
      const u = +r[iu], d = 1000 + 250 * St.normInv(u);
      return { t: r[it], u, d, p: profitAt(d) };
    }).sort((x, y) => x.p - y.p).slice(0, k);
    el.append(a.h('div', { class: 'lk-x-wrap' }, a.h('table', { class: 'lk-x-table', 'aria-label': K.tr('The six lowest-profit reference trials') },
      a.h('thead', null, a.h('tr', null, ['trial', 'u_001', K.tr('demand'), K.tr('profit')].map((c) => a.h('th', { scope: 'col' }, c)))),
      a.h('tbody', null, rows.map((r) => a.h('tr', null, a.h('td', null, r.t), a.h('td', null, r.u.toFixed(6)), a.h('td', null, St.fmt(r.d, 1)), a.h('td', null, money(r.p))))))));
    el.append(a.h('p', { class: 'lk-caption' }, K.tr('The six lowest profits among the 1,000 reference trials, sorted from the lowest.')));
  }

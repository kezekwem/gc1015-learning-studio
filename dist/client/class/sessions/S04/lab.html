probability, u_001, for one simulation trial.":"<code>cloudflow_churn_cohort.csv</code> 的每一行是一个账户：它是否流失？是否因支持工单量高而被标记？<code>reference_trials.csv</code> 的每一行是一个固定概率 u_001，对应一次模拟试验。","Use the filters to count rows before you trust any formula or pivot table.":"在信任任何公式或数据透视表之前，先用筛选器数一数行数。","Checkpoint A1: B7 and the four counts":"检查点 A1：B7 和四个计数","In <code>IN-CLASS_Lab Part A</code>, B7 counts the source rows. B9:C10 hold four COUNTIFS cells: rows are HighTickets (Yes, No) and columns are Churn (Yes, No).":"在 <code>IN-CLASS_Lab Part A</code> 中，B7 统计源数据行数。B9:C10 是四个 COUNTIFS 单元格：行是 HighTickets（Yes、No），列是 Churn（Yes、No）。","Confirm each count with the explorer, then type what your workbook shows.":"先用数据浏览器确认每个计数，再输入你的工作簿显示的值。","<p>96 + 176 + 24 + 704 = 1,000. In Excel: <code>=COUNTIFS(Cohort[HighTickets],$A9,Cohort[Churn],B$8)</code>, filled to C10. The $ signs keep the row label in column A and the column label in row 8.</p>":"<p>96 + 176 + 24 + 704 = 1,000。在 Excel 中：<code>=COUNTIFS(Cohort[HighTickets],$A9,Cohort[Churn],B$8)</code>，填充到 C10。$ 符号把行标签固定在 A 列，把列标签固定在第 8 行。</p>","B7   rows = {{n}}":"B7   行数 = {{n}}","B9   HighTickets Yes, Churn Yes = {{b9}}":"B9   HighTickets Yes, Churn Yes = {{b9}}","C9   HighTickets Yes, Churn No = {{c9}}":"C9   HighTickets Yes, Churn No = {{c9}}","B10  HighTickets No, Churn Yes = {{b10}}":"B10  HighTickets No, Churn Yes = {{b10}}","C10  HighTickets No, Churn No = {{c10}}":"C10  HighTickets No, Churn No = {{c10}}","B7 = ROWS(Cohort[AccountID]) = 1,000. If you see 1,001, your range includes the header row.":"B7 = ROWS(Cohort[AccountID]) = 1,000。如果你看到 1,001，说明你的范围包含了标题行。","B7 source rows":"B7 源数据行数","Filter HighTickets = Yes and Churn = Yes: 96 rows.":"筛选 HighTickets = Yes 且 Churn = Yes：96 行。","B9 count":"B9 计数","C9 is HighTickets = Yes and Churn = No: 176. If you see 24, the two COUNTIFS criteria are swapped.":"C9 是 HighTickets = Yes 且 Churn = No：176。如果你看到 24，说明两个 COUNTIFS 条件弄反了。","C9 count":"C9 计数","B10 is HighTickets = No and Churn = Yes: 24. If you see 176, the criteria are swapped.":"B10 是 HighTickets = No 且 Churn = Yes：24。如果你看到 176，说明条件弄反了。","B10 count":"B10 计数","HighTickets = No and Churn = No: 704. The four cells must add to 1,000.":"HighTickets = No 且 Churn = No：704。四个单元格之和必须是 1,000。","C10 count":"C10 计数","Checkpoint A2: the totals":"检查点 A2：合计","Column D holds the row totals and row 11 the column totals.":"D 列是行合计，第 11 行是列合计。","Type what your workbook shows.":"输入你的工作簿显示的值。","<p>272 flagged and 728 not flagged; 120 churned and 880 renewed; 1,000 complete pairs. D11 must equal B7, because this cohort has no blank categories.</p>":"<p>272 个被标记，728 个未被标记；120 个流失，880 个续约；1,000 个完整配对。D11 必须等于 B7，因为这个队列没有空白类别。</p>","D9   flagged total = {{d9}}":"D9   被标记合计 = {{d9}}","D10  not flagged total = {{d10}}":"D10  未被标记合计 = {{d10}}","B11  churned total = {{b11}}":"B11  流失合计 = {{b11}}","C11  renewed total = {{c11}}":"C11  续约合计 = {{c11}}","D11  all complete pairs = {{d11}}":"D11  全部完整配对 = {{d11}}","D9 = SUM(B9:C9) = 96 + 176.":"D9 = SUM(B9:C9) = 96 + 176。","D9 total":"D9 合计","D10 = SUM(B10:C10) = 24 + 704.":"D10 = SUM(B10:C10) = 24 + 704。","D10 total":"D10 合计","B11 = SUM(B9:B10) = 96 + 24.":"B11 = SUM(B9:B10) = 96 + 24。","B11 total":"B11 合计","C11 = SUM(C9:C10) = 176 + 704.":"C11 = SUM(C9:C10) = 176 + 704。","C11 total":"C11 合计","D11 adds all four cells: 1,000. If it differs from B7, a category is blank or misspelled.":"D11 把四个单元格加起来：1,000。如果它与 B7 不同，说明某个类别为空或拼写错误。","D11 total":"D11 合计","Checkpoint A3: B13 to B16":"检查点 A3：B13 到 B16","The workbook formats these cells as percentages. Type 0.12 or 12%; both are accepted here.":"工作簿把这些单元格设为百分比格式。输入 0.12 或 12% 都可以，这里两种都接受。","<p>12.0%, 27.2%, 9.6% and 29.6%. The union subtracts the 96 accounts that sit in both the churn total and the flagged total, so they are not counted twice.</p>":"<p>12.0%、27.2%、9.6% 和 29.6%。并集要减去同时出现在流失合计和标记合计中的 96 个账户，这样它们就不会被算两次。</p>","B13  P(C) = {{b13}}":"B13  P(C) = {{b13}}","B14  P(H) = {{b14}}":"B14  P(H) = {{b14}}","B15  P(C ∩ H) = {{b15}}":"B15  P(C ∩ H) = {{b15}}","B16  P(C ∪ H) = {{b16}}":"B16  P(C ∪ H) = {{b16}}","B13 = B11/D11 = 120 / 1,000. If you see 44.1%, you divided by D9 instead of D11.":"B13 = B11/D11 = 120 / 1,000。如果你看到 44.1%，说明你除以了 D9，而不是 D11。","B13 baseline churn":"B13 基准流失率","B14 = D9/D11 = 272 / 1,000.":"B14 = D9/D11 = 272 / 1,000。","B14 flagged share":"B14 被标记占比","B15 = B9/D11 = 96 / 1,000. If you see 35.3%, you divided by D9; a joint probability uses all 1,000.":"B15 = B9/D11 = 96 / 1,000。如果你看到 35.3%，说明你除以了 D9；联合概率要用全部 1,000。","B15 joint probability":"B15 联合概率","B16 = B13 + B14 − B15. If you see 39.2%, you left out the overlap in B15.":"B16 = B13 + B14 − B15。如果你看到 39.2%，说明你漏掉了 B15 中的重叠部分。","B16 union probability":"B16 并集概率","Checkpoint A4: B17 and B18":"检查点 A4：B17 和 B18","Both cells share the numerator B9 = 96. Only the denominator changes.":"两个单元格的分子都是 B9 = 96。只有分母不同。","<p>B18 = 35.3% is the CFO’s number: of 272 flagged accounts, 96 churned. B17 = 80.0% describes churners, not flagged accounts. Bayes rule gives the same B18: 0.096 ÷ (0.096 + 0.176).</p>":"<p>B18 = 35.3% 就是 CFO 要的数字：272 个被标记账户中有 96 个流失。B17 = 80.0% 描述的是流失账户，而不是被标记账户。贝叶斯法则给出同样的 B18：0.096 ÷ (0.096 + 0.176)。</p>","B17  P(H | C) = {{b17}}":"B17  P(H | C) = {{b17}}","B18  P(C | H) = {{b18}}":"B18  P(C | H) = {{b18}}","B17 = B9/B11 = 96 / 120: the share of churners who were flagged.":"B17 = B9/B11 = 96 / 120：流失账户中被标记的比例。","B17 flagged share of churners":"B17 流失账户中被标记的占比","B18 = B9/D9 = 96 / 272. If B18 shows 80.0%, you divided by B11. If it shows 3,529%, remove the *100.":"B18 = B9/D9 = 96 / 272。如果 B18 显示 80.0%，说明你除以了 B11。如果显示 3,529%，请去掉 *100。","B18 churn risk among flagged":"B18 被标记账户的流失风险","B18 = 35.3% (96 of 272); B17 = 80.0%":"B18 = 35.3%（272 个中的 96 个）；B17 = 80.0%","What goes in B20?":"B20 里填什么？","B18 shows 35.3% against a 12.0% baseline in B13. The B20 dropdown has four statements, shortened here.":"B18 显示 35.3%，而 B13 中的基准为 12.0%。B20 的下拉列表有四个陈述，这里是缩写版。","Which statement belongs in B20?":"哪个陈述属于 B20？","<p>B21 then explains the choice in 2 to 3 sentences: numerator 96, denominator 272, the comparison with the 12.0% baseline, and the limit that the table shows association only.</p>":"<p>接着在 B21 中用 2 到 3 句话解释这个选择：分子 96，分母 272，与 12.0% 基准的比较，以及这个表只能显示关联这一局限。</p>","Flagged accounts show higher recorded churn risk; screening priority, not a causal claim":"被标记账户记录到的流失风险更高；这是筛查优先级，而不是因果结论","80% of flagged accounts churn, because 80% of churners were flagged":"80% 的被标记账户会流失，因为 80% 的流失账户被标记了","That reverses the condition. 80% is B17, P(H | C). The share of flagged accounts that churned is B18, 35.3%.":"这把条件弄反了。80% 是 B17，即 P(H | C)。被标记账户中流失的比例是 B18，35.3%。","High tickets prove an automatic intervention will prevent churn":"高工单量证明自动干预能防止流失","The cohort contains no intervention. It shows an association, so it cannot prove prevention.":"这个队列中没有任何干预。它只显示关联，所以无法证明能防止流失。","The conditional rate uses all 1,000 accounts as its denominator":"条件比率以全部 1,000 个账户作为分母","B18 divides by D9, the 272 flagged accounts. Dividing by 1,000 gives the joint probability in B15.":"B18 除以的是 D9，即 272 个被标记账户。除以 1,000 得到的是 B15 中的联合概率。","Read SPSS H1":"解读 SPSS H1","H1 runs CROSSTABS with Churn as rows and HighTickets as columns. It shows count, row %, column % and total %.":"H1 运行 CROSSTABS，Churn 作为行，HighTickets 作为列。它显示计数、行 %、列 % 和总 %。","Which H1 number should match your B18?":"H1 中哪个数字应该与你的 B18 一致？","<p>Column percentages divide by each HighTickets column total, so the Yes column gives 96 / 272 = 35.3%. Your B25 caption names H1, the count read (96), this column percentage, and says that it agrees with B18.</p>":"<p>列百分比除以每个 HighTickets 列的合计，所以 Yes 列给出 96 / 272 = 35.3%。你在 B25 中的图注要写明 H1、读到的计数（96）、这个列百分比，并说明它与 B18 一致。</p>","Churn = Yes row, column % under HighTickets = Yes: 35.3%":"Churn = Yes 行，HighTickets = Yes 下的列 %：35.3%","Churn = Yes row, row % under HighTickets = Yes: 80.0%":"Churn = Yes 行，HighTickets = Yes 下的行 %：80.0%","Row % divides by the Churn = Yes total, 120. That is P(H | C), your B17.":"行 % 除以 Churn = Yes 的合计 120。那是 P(H | C)，即你的 B17。","Total % in the Churn = Yes, HighTickets = Yes cell: 9.6%":"Churn = Yes、HighTickets = Yes 单元格中的总 %：9.6%","Total % divides by all 1,000 accounts. That is the joint probability in B15.":"总 % 除以全部 1,000 个账户。那是 B15 中的联合概率。","Checkpoint B: D14 to D17":"检查点 B：D14 到 D17","B7:D7 hold 30%, 50% and 20%. B10:D10 hold the Large Hub payoffs 12, 3 and −9; B11:D11 hold the Modular Hub payoffs 9, 5 and 1, in $ millions.":"B7:D7 中是 30%、50% 和 20%。B10:D10 是大型枢纽的收益 12、3 和 −9；B11:D11 是模块化枢纽的收益 9、5 和 1，单位为百万美元。","<p>EMV(Large) = 0.30 × 12 + 0.50 × 3 + 0.20 × (−9) = 3.30, and EMV(Modular) = 5.40, in $ millions. The decision node keeps the larger, 5.40, and the premium is 2.10. SPSS H2 lists the same values with a probability total of 1.000.</p>":"<p>EMV(Large) = 0.30 × 12 + 0.50 × 3 + 0.20 × (−9) = 3.30，EMV(Modular) = 5.40，单位为百万美元。决策节点保留较大的 5.40，溢价为 2.10。SPSS H2 列出相同的值，概率合计为 1.000。</p>","D14  EMV(Large) = {{d14}}":"D14  EMV(Large) = {{d14}}","D15  EMV(Modular) = {{d15}}":"D15  EMV(Modular) = {{d15}}","D16  rolled-back value = {{d16}}":"D16  逆推值 = {{d16}}","D17  EMV premium = {{d17}}":"D17  EMV 溢价 = {{d17}}","D14 Large Hub EMV":"D14 大型枢纽 EMV","Fill D14 down to D15. If D15 shows 0.00, the $ signs are missing and the probabilities moved to the empty row 8.":"把 D14 向下填充到 D15。如果 D15 显示 0.00，说明缺少 $ 符号，概率引用移到了空的第 8 行。","D15 Modular Hub EMV":"D15 模块化枢纽 EMV","D16 = MAX(D14:D15). Use the branch EMVs, not the largest single payoff, 12.":"D16 = MAX(D14:D15)。用各分支的 EMV，而不是最大的单个收益 12。","D16 rolled-back value":"D16 逆推值","D17 = MAX(D14:D15) − MIN(D14:D15) = 5.40 − 3.30.":"D17 = MAX(D14:D15) − MIN(D14:D15) = 5.40 − 3.30。","D17 EMV premium":"D17 EMV 溢价","D14 = 3.30, D15 = 5.40, D16 = 5.40, D17 = 2.10":"D14 = 3.30, D15 = 5.40, D16 = 5.40, D17 = 2.10","Lock the probabilities":"锁定概率","You type a formula in D14 and fill it down to D15.":"你在 D14 中输入公式，并向下填充到 D15。","Which D14 formula still works in D15?":"哪个 D14 公式在 D15 中仍然有效？","<p>Absolute references ($) keep the probability row fixed; relative references let the payoff row move from 10 to 11. Show formulas (Ctrl+`) to check what each cell points at.</p>":"<p>绝对引用（$）固定概率所在的行；相对引用让收益行从 10 移到 11。显示公式（Ctrl+`）可以检查每个单元格指向哪里。</p>","<code>=SUMPRODUCT($B$7:$D$7,B10:D10)</code>":"<code>=SUMPRODUCT($B$7:$D$7,B10:D10)</code>","<code>=SUMPRODUCT(B7:D7,B10:D10)</code>":"<code>=SUMPRODUCT(B7:D7,B10:D10)</code>","Filled down, it becomes SUMPRODUCT(B8:D8,B11:D11). Row 8 is empty, so D15 shows 0.00.":"向下填充后，它变成 SUMPRODUCT(B8:D8,B11:D11)。第 8 行是空的，所以 D15 显示 0.00。","<code>=SUMPRODUCT($B$7:$D$7,$B$10:$D$10)</code>":"<code>=SUMPRODUCT($B$7:$D$7,$B$10:$D$10)</code>","Filled down, D15 still points at row 10, so both hubs show the Large Hub EMV, 3.30.":"向下填充后，D15 仍然指向第 10 行，所以两个枢纽都显示大型枢纽的 EMV，3.30。","<code>=SUM(B7:D7)*SUM(B10:D10)</code>":"<code>=SUM(B7:D7)*SUM(B10:D10)</code>","That multiplies two totals: 1.00 × 6 = 6.00. EMV multiplies each probability by its own payoff, then adds.":"那是把两个合计相乘：1.00 × 6 = 6.00。EMV 是把每个概率乘以它自己的收益，再相加。","What goes in B18?":"B18 里填什么？","D16 shows 5.40 and D17 shows 2.10. The B18 dropdown has four statements, shortened here.":"D16 显示 5.40，D17 显示 2.10。B18 的下拉列表有四个陈述，这里是缩写版。","Which statement belongs in B18?":"哪个陈述属于 B18？","<p>B19 then names the EMV rule, the chosen branch, the $2.10M premium and one risk-tolerance condition, for example a committee that cannot absorb a large loss.</p>":"<p>接着在 B19 中写明 EMV 准则、所选分支、$2.10M 的溢价，以及一个风险承受条件，例如委员会无法承受巨额亏损。</p>","Under risk-neutral EMV, choose Modular; its EMV is not a guaranteed outcome":"按风险中性的 EMV，选择模块化；它的 EMV 并不是有保证的结果","Choose Large, because the highest possible payoff decides":"选择大型，因为应由最高可能收益来决定","The $12M payoff happens only in high demand, with probability 0.30. EMV weighs all three states.":"$12M 的收益只在高需求下出现，概率为 0.30。EMV 会对三种状态加权。","The hubs are equivalent because the probabilities sum to one":"两个枢纽等价，因为概率之和为一","The probabilities sum to 1 for both hubs. That checks the inputs; it does not compare the hubs.":"两个枢纽的概率之和都是 1。这只是检查输入，并不能比较两个枢纽。","Modular guarantees $5.40M in every demand state":"模块化在每种需求状态下都保证 $5.40M","Modular pays $9M, $5M or $1M. $5.40M is their probability-weighted average.":"模块化的收益是 $9M、$5M 或 $1M。$5.40M 是它们按概率加权的平均值。","Optional Topic 5: the tipping point":"选学主题 5：临界点","In a copy, set D7 to <code>=1-B7-C7</code>, put <code>=D14-D15</code> in F14, and use Goal Seek to set F14 to 0 by changing B7.":"在一个副本中，把 D7 设为 <code>=1-B7-C7</code>，在 F14 中输入 <code>=D14-D15</code>，然后用单变量求解（Goal Seek）通过改变 B7 把 F14 设为 0。","What P(high) does Goal Seek return?":"单变量求解返回的 P(high) 是多少？","<p>p = 6/13 ≈ 0.4615, or 46.2%. The forecast, 0.30, is well below it, so the Modular choice is robust to a moderate forecast error. This topic is optional and not graded.</p>":"<p>p = 6/13 ≈ 0.4615，即 46.2%。预测值 0.30 远低于它，所以即使预测有中等程度的误差，选择模块化依然稳健。本主题为选学，不计分。</p>","B7 at the tie = {{p}}":"打平时的 B7 = {{p}}","With P(medium) at 0.50, EMV(Large) = 21p − 3 and EMV(Modular) = 8p + 3. They tie at p = 6 ÷ 13.":"当 P(medium) 为 0.50 时，EMV(Large) = 21p − 3，EMV(Modular) = 8p + 3。两者在 p = 6 ÷ 13 处打平。","Tipping point P(high)":"临界点 P(high)","Checkpoint C1: B14 and trial 1":"检查点 C1：B14 和试验 1","B7:B12 hold mean demand 1,000, SD 250, capacity 1,000, price $100, salvage $15 and cost $40. Trial 1 reads <code>Data_Trials!B2</code>.":"B7:B12 中是平均需求 1,000、SD 250、产能 1,000、价格 $100、残值 $15 和成本 $40。试验 1 读取 <code>Data_Trials!B2</code>。","Type B14, then trial 1 in B32 and C32.":"先输入 B14，再输入 B32 和 C32 中的试验 1。","<p>Trial 1: demand 653.82 units, 346.18 units unused, profit $30,575. Fill B32:C32 down to row 1031 so that every u_001 value gets its own trial. Use plain <code>Data_Trials!B2</code>, not <code>$B$2</code>, or every row repeats trial 1.</p>":"<p>试验 1：需求 653.82 单位，未使用 346.18 单位，利润 $30,575。把 B32:C32 向下填充到第 1031 行，让每个 u_001 值都有自己的试验。用普通的 <code>Data_Trials!B2</code>，而不是 <code>$B$2</code>，否则每一行都会重复试验 1。</p>","B14  profit at mean demand = $ {{b14}}":"B14  平均需求下的利润 = $ {{b14}}","B32  trial 1 demand = {{b32}}":"B32  试验 1 需求 = {{b32}}","C32  trial 1 profit = $ {{c32}}":"C32  试验 1 利润 = $ {{c32}}","At demand 1,000: 100 × 1,000 + 15 × 0 − 40 × 1,000 = 60,000.":"需求为 1,000 时：100 × 1,000 + 15 × 0 − 40 × 1,000 = 60,000。","B14 profit at mean demand":"B14 平均需求下的利润","B32 = NORM.INV(Data_Trials!B2,$B$7,$B$8) with u = 0.0831. #NUM! means the cell does not point at a probability between 0 and 1.":"B32 = NORM.INV(Data_Trials!B2,$B$7,$B$8)，u = 0.0831。#NUM! 表示该单元格没有指向 0 到 1 之间的概率。","B32 trial 1 demand":"B32 试验 1 需求","If you see 25,382, the salvage term is missing: add MAX($B$9−B32,0)*$B$11.":"如果你看到 25,382，说明缺少残值项：加上 MAX($B$9−B32,0)*$B$11。","C32 trial 1 profit":"C32 试验 1 利润","Checkpoint C2: B16 to B20":"检查点 C2：B16 到 B20","Your 1,000 trial profits sit in C32:C1031.":"你的 1,000 个试验利润位于 C32:C1031。","Type what your workbook shows, to the nearest dollar.":"输入你的工作簿显示的值，精确到美元。","<p>Mean $51,320, SD $12,701, 5th percentile $25,884, and a gap of $8,680 below profit at mean demand. SPSS H3 lists the same mean, SD and 5th percentile, because it uses the same u_001 values and the same inclusive percentile rule.</p>":"<p>均值 $51,320，SD $12,701，第 5 百分位数 $25,884，比平均需求下的利润低 $8,680。SPSS H3 列出相同的均值、SD 和第 5 百分位数，因为它使用相同的 u_001 值和相同的包含型（inclusive）百分位数规则。</p>","B16  mean profit = $ {{b16}}":"B16  平均利润 = $ {{b16}}","B17  sample SD = $ {{b17}}":"B17  样本 SD = $ {{b17}}","B18  5th-percentile profit = $ {{b18}}":"B18  第 5 百分位数利润 = $ {{b18}}","B19  gap B14 − B16 = $ {{b19}}":"B19  差距 B14 − B16 = $ {{b19}}","B20  numeric trials = {{b20}}":"B20  数值型试验数 = {{b20}}","B16 = AVERAGE(C32:C1031). If you see about 999, you averaged demand in column B instead of profit.":"B16 = AVERAGE(C32:C1031)。如果你看到约 999，说明你平均的是 B 列的需求，而不是利润。","B16 mean profit":"B16 平均利润","B17 = STDEV.S(C32:C1031). If you see 12,695, you used STDEV.P, which divides by n instead of n − 1.":"B17 = STDEV.S(C32:C1031)。如果你看到 12,695，说明你用了 STDEV.P，它除以 n 而不是 n − 1。","B17 sample SD":"B17 样本 SD","B18 = PERCENTILE.INC(C32:C1031,0.05). PERCENTILE.EXC gives 25,776. Format it as dollars, not percent.":"B18 = PERCENTILE.INC(C32:C1031,0.05)。PERCENTILE.EXC 给出 25,776。把它设为美元格式，而不是百分比。","B18 5th-percentile profit":"B18 第 5 百分位数利润","B19 = B14 − B16 = 60,000 − 51,320.":"B19 = B14 − B16 = 60,000 − 51,320。","B19 gap":"B19 差距","B20 = COUNT(C32:C1031). If it is below 1,000, the fill stopped early; fill to row 1031.":"B20 = COUNT(C32:C1031)。如果小于 1,000，说明填充提前停止了；请填充到第 1031 行。","B20 numeric trials":"B20 数值型试验数","B16 $51,320; B17 $12,701; B18 $25,884; B19 $8,680":"B16 $51,320；B17 $12,701；B18 $25,884；B19 $8,680","What goes in B22?":"B22 里填什么？","B14 shows $60,000 and B16 shows $51,320. The B22 dropdown has four statements, shortened here.":"B14 显示 $60,000，B16 显示 $51,320。B22 的下拉列表有四个陈述，这里是缩写版。","Which statement belongs in B22?":"哪个陈述属于 B22？","<p>B23 then compares $60,000 with $51,320, reads the 5th percentile in dollars, and names one limit of the model, such as the assumed normal demand.</p>":"<p>接着在 B23 中比较 $60,000 和 $51,320，用美元解读第 5 百分位数，并指出模型的一个局限，例如假设需求服从正态分布。</p>","Capacity and salvage make profit nonlinear, so the two numbers can differ":"产能和残值让利润呈非线性，所以这两个数字可能不同","Profit at mean demand must equal mean profit, since mean demand is 1,000":"平均需求下的利润必定等于平均利润，因为平均需求是 1,000","That holds only for a straight-line model. The capacity cap and the salvage price bend the profit line.":"这只对直线模型成立。产能上限和残值价格让利润线弯曲。","The 5th-percentile profit is the probability that profit is negative":"第 5 百分位数利润就是利润为负的概率","B18 is a dollar amount: 5% of trials earn $25,884 or less. The chance of a loss is a separate measure.":"B18 是一个美元金额：5% 的试验赚 $25,884 或更少。亏损概率是另一个指标。","A larger standard deviation guarantees a larger expected profit":"标准差越大，期望利润一定越大","SD measures spread. Here more spread lowers expected profit, because the upside is capped.":"SD 衡量离散程度。这里更大的离散会降低期望利润，因为上行空间被封顶。","Why fixed u values?":"为什么用固定的 u 值？","SPSS H3 and your Excel sheet both start from <code>reference_trials.csv</code> instead of RAND().":"SPSS H3 和你的 Excel 工作表都从 <code>reference_trials.csv</code> 开始，而不是 RAND()。","Why does the lab use fixed u_001 values?":"为什么实验使用固定的 u_001 值？","<p>RAND() recalculates whenever the sheet changes, so no two runs match. Fixed probabilities make the run reproducible, like a seed. Use <code>LAB02_Live_Exploration.xlsx</code> and F9 to watch the numbers move; it is not graded.</p>":"<p>工作表每次变化时 RAND() 都会重新计算，所以没有两次运行结果相同。固定概率让运行可以复现，就像种子一样。用 <code>LAB02_Live_Exploration.xlsx</code> 和 F9 来观察数字的变化；它不计分。</p>","Everyone, including the grader and SPSS, gets the same 1,000 trials":"每个人，包括评分者和 SPSS，都得到相同的 1,000 次试验","Fixed values make the simulation more accurate than RAND()":"固定值让模拟比 RAND() 更准确","They are not more accurate. They are the same kind of random draws, frozen so results can be checked exactly.":"它们并不更准确。它们是同一种随机抽样，只是被冻结下来，以便精确核对结果。","RAND() cannot produce numbers between 0 and 1":"RAND() 无法产生 0 到 1 之间的数","RAND() does return values from 0 up to 1. The problem is that it changes on every recalculation.":"RAND() 确实会返回 0 到 1 之间的值。问题在于它每次重新计算都会变化。","Checkpoint: count the losses (H4)":"检查点：统计亏损次数（H4）","SPSS H4 flags each trial with profit below $0, then divides by the number of numeric trials.":"SPSS H4 标记出利润低于 $0 的每次试验，然后除以数值型试验数。","Type the three values H4 lists.":"输入 H4 列出的三个值。","<p>4 of 1,000 trials lose money, a loss probability of 0.4%. The exact model value is about 0.24%, so 1,000 trials estimate a rare event only roughly. In Excel: <code>=COUNTIF(C32:C1031,\"&lt;0\")/COUNT(C32:C1031)</code>.</p>\n          <p>Look at trial 264: its demand is about −47 units. A normal model can produce impossible values, one limit worth naming in B23.</p>":"<p>1,000 次试验中有 4 次亏损，亏损概率为 0.4%。精确的模型值约为 0.24%，所以 1,000 次试验对罕见事件的估计只是粗略的。在 Excel 中：<code>=COUNTIF(C32:C1031,\"&lt;0\")/COUNT(C32:C1031)</code>。</p>\n          <p>看看试验 264：它的需求约为 −47 单位。正态模型可能产生不可能出现的值，这是值得在 B23 中指出的一个局限。</p>","ShortfallCount = {{k}}":"ShortfallCount = {{k}}","NumericDenominator = {{n}}":"NumericDenominator = {{n}}","ShortfallProbability = {{p}}":"ShortfallProbability = {{p}}","Count trials with profit strictly below $0. The table lists the lowest trials.":"统计利润严格低于 $0 的试验。表中列出了利润最低的几次试验。","Shortfall count":"亏损次数","Every numeric profit counts: 1,000 trials.":"每个数值型利润都要计入：1,000 次试验。","Numeric denominator":"数值型分母","Divide: 4 ÷ 1,000 = 0.004, which H4 shows as 0.4%.":"相除：4 ÷ 1,000 = 0.004，H4 显示为 0.4%。","Shortfall probability":"亏损概率","4 of 1,000 trials below $0 (0.4%)":"1,000 次试验中有 4 次低于 $0（0.4%）","Checkpoint B1033: pick your measures":"检查点 B1033：选择你的指标","B1033 asks for one expected-performance metric, one downside or spread metric, and one risk-tolerance condition.":"B1033 要求一个预期表现指标、一个下行或离散指标，以及一个风险承受条件。","Which set fits B1033 best?":"哪一组最适合 B1033？","<p>A sound B1033 cites the mean for expected performance, the 5th percentile or the loss share for the downside, and a condition such as: if capital preservation governs, prefer the lower loss probability as long as expected value stays positive.</p>":"<p>一个合格的 B1033 会用均值表示预期表现，用第 5 百分位数或亏损占比表示下行风险，并给出一个条件，例如：如果以保全资本为首要目标，只要期望值仍为正，就选择亏损概率较低的方案。</p>","Mean profit (B16), 5th percentile (B18) or loss share, and a capital-preservation condition":"平均利润（B16），第 5 百分位数（B18）或亏损占比，以及一个保全资本的条件","The standard deviation alone, because it measures risk":"只用标准差，因为它衡量风险","SD counts good surprises as risk too. Pair the mean with a one-sided downside measure.":"SD 把好的意外也算作风险。应把均值与一个单侧的下行指标搭配。","Profit at mean demand (B14) and the best trial":"平均需求下的利润（B14）和最好的试验","B14 is the flawed deterministic number, and the best trial says nothing about losses.":"B14 是有缺陷的确定性数字，而最好的试验完全不能说明亏损。","Pick Option A or B now, using Part C":"现在就用 C 部分选出方案 A 或 B","Not yet. B1033 states a principle. The take-home numbers decide between A and B.":"还不行。B1033 陈述的是原则。要由课后作业的数字在 A 和 B 之间做决定。","Take-home: check row 38":"课后作业：检查第 38 行","In <code>POST-CLASS_Part 1</code>, row 38 is trial 1. Option A costs $1,000,000 up front, with mean cash flow $551,000 and SD $187,300 a year; Option B costs $900,000, with $498,600 and $100,200. The rate is 8% for 3 years.":"在 <code>POST-CLASS_Part 1</code> 中，第 38 行是试验 1。方案 A 前期投入 $1,000,000，每年现金流均值 $551,000，SD $187,300；方案 B 投入 $900,000，均值 $498,600，SD $100,200。利率为 8%，期限 3 年。","Type D38, E38 and F38. These check the structure of your formulas, not your recommendation.":"输入 D38、E38 和 F38。这些用来检查你的公式结构，而不是你的建议。","<p>Trial 1 is a bad year for both options (z ≈ −1.385): Option A’s NPV is about −$248,409 and Option B’s about $27,372. Fill row 38 down to row 1037, then summarize each column the same way as Part C. The recommendation is yours to make from those summaries.</p>":"<p>试验 1 对两个方案来说都是糟糕的一年（z ≈ −1.385）：方案 A 的 NPV 约为 −$248,409，方案 B 约为 $27,372。把第 38 行向下填充到第 1037 行，然后按 C 部分的方法汇总每一列。建议由你根据这些汇总结果来做。</p>","D38  z = {{z}}":"D38  z = {{z}}","E38  NPV of Option A = $ {{ea}}":"E38  方案 A 的 NPV = $ {{ea}}","F38  NPV of Option B = $ {{fb}}":"F38  方案 B 的 NPV = $ {{fb}}","D38 = NORM.S.INV(Data_Trials!B2). Trial 1 has u = 0.0831, so z is about −1.385.":"D38 = NORM.S.INV(Data_Trials!B2)。试验 1 的 u = 0.0831，所以 z 约为 −1.385。","D38 shared shock":"D38 共同冲击","If you see about −230,008, the investment went inside NPV(). Subtract $B$10 outside it: =-$B$10+NPV($B$7,...).":"如果你看到约 −230,008，说明投资被放进了 NPV() 里面。请在外面减去 $B$10：=-$B$10+NPV($B$7,...)。","E38 NPV of Option A":"E38 方案 A 的 NPV","Same structure as E38 with Option B’s cells: =-$C$10+NPV($B$7, three cash flows of $C$11+$C$12*$D38).":"结构与 E38 相同，改用方案 B 的单元格：=-$C$10+NPV($B$7, 三笔 $C$11+$C$12*$D38 现金流)。","F38 NPV of Option B":"F38 方案 B 的 NPV","Row 38: z = −1.385, structure checked":"第 38 行：z = −1.385，结构已检查","Take-home: name the units":"课后作业：写明单位","B23 holds the absolute gap between the two loss probabilities in B20 and C20.":"B23 存放 B20 和 C20 中两个亏损概率之间的绝对差距。","How should the memo describe B23?":"备忘录应该如何描述 B23？","<p>Subtracting two percentages gives percentage points. Dividing by a starting value gives percent change. The memo cites every number with its unit and denominator, for example “x of 1,000 trials”.</p>":"<p>两个百分比相减得到的是百分点。除以起始值得到的是百分比变化。备忘录引用每个数字时都要带上单位和分母，例如“1,000 次试验中的 x 次”。</p>","As a gap in percentage points between two loss probabilities":"作为两个亏损概率之间以百分点计的差距","As a percent change in risk":"作为风险的百分比变化","Percent change divides by one option’s probability. B23 subtracts two probabilities, so its unit is percentage points.":"百分比变化要除以某个方案的概率。B23 是两个概率相减，所以单位是百分点。","As a dollar amount":"作为一个美元金额","B23 compares probabilities. B22 is the dollar gap between the two mean NPVs.":"B23 比较的是概率。B22 才是两个平均 NPV 之间的美元差距。","Take-home: finish the memo":"课后作业：完成备忘录","Your checkpoints are saved in this browser. The recommendation, the evidence map and the AI disclosure are yours to write.":"你的检查点答案保存在这个浏览器中。建议、证据图和 AI 使用声明需要你自己来写。","B25: recommend Option A or B. Cite mean NPV and loss probability with their denominators, state one limitation, and name what would reverse your call.":"B25：推荐方案 A 或 B。引用平均 NPV 和亏损概率并注明分母，说明一个局限，并指出什么情况会让你改变结论。","One shared shock per trial drives both options and all three years. That assumes a persistent business condition, not independent years; name it as a limit.":"每次试验用一个共同冲击驱动两个方案和全部三年。这假设经营状况是持续的，而不是各年独立；请把它作为一个局限写出来。","Optional stretch: in a copy, change B7 from 8% to 12%. Does the ranking or the loss-probability gap change?":"选做拓展：在一个副本中，把 B7 从 8% 改为 12%。排名或亏损概率差距会改变吗？","Open this page from the class site to see the dataset.":"请从课程网站打开本页面以查看数据集。","The six lowest-profit reference trials":"利润最低的六次参考试验","demand":"需求","profit":"利润","The six lowest profits among the 1,000 reference trials, sorted from the lowest.":"1,000 次参考试验中利润最低的六次，从最低开始排序。","Lab checkpoints complete":"实验检查点已完成","Your checkpoint answers are saved. Finish the take-home memo in your workbook.":"你的检查点答案已保存。请在工作簿中完成课后作业备忘录。","D14 = SUMPRODUCT($B$7:$D$7,B10:D10). If you see 330, you typed the probabilities as 30, 50 and 20 instead of 30%, 50% and 20%.":"D14 = SUMPRODUCT($B$7:$D$7,B10:D10)。如果你看到 330，说明你把概率输成了 30、50 和 20，而不是 30%、50% 和 20%。"},"es":{"LAB02 Checkpoints":"Puntos de control del LAB02","GC1015 · Session 4 · Build it in Excel or SPSS, check it here":"GC1015 ·

; a fee <b>below</b> $52.40 makes subscribing strictly better. This is an EMV ceiling, not a promise that a vendor is worth that amount in practice.</p>"},{"id":"3","level":2,"title":"3. Select a probability model that matches the question","short":"3. Select a probability model th…","html":""},{"id":"3.1","level":3,"title":"3.1 Binomial counts versus daily profit outcomes","short":"3.1. Binomial counts versus dail…","html":"<p>A <b>Bernoulli trial</b> has two outcomes. Under the alert policy, define a “severe-loss day” as profit below −$150. Its modeled probability is 0.075. If ten comparable cart-days were <b>independent</b> and each had the same 0.075 severe-loss probability, the number <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span> of severe-loss days would follow a <b>binomial distribution</b> with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">n=10</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>0.075</mn></mrow><annotation encoding=\"application/x-tex\">p=0.075</annotation></semantics></math></span>. The binomial model requires a fixed number of independent trials with a constant probability (Holmes et al., 2023).</p>\n<p>The expected <i>count</i> is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo stretchy=\"false\">(</mo><mi>K</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>n</mi><mi>p</mi><mo>=</mo><mn>10</mn><mo stretchy=\"false\">(</mo><mn>0.075</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.75</mn></mrow><annotation encoding=\"application/x-tex\">E(K)=np=10(0.075)=0.75</annotation></semantics></math></span> days. That does <b>not</b> mean a fractional day will occur. The chance of at least one severe-loss day is easier to calculate by its complement:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>K</mi><mo>≥</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>K</mi><mo>=</mo><mn>0</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mn>0.075</mn><msup><mo stretchy=\"false\">)</mo><mn>10</mn></msup><mo>=</mo><mn>1</mn><mo>−</mo><mn>0.92</mn><msup><mn>5</mn><mn>10</mn></msup><mo>≈</mo><mn>0.5414.</mn></mrow><annotation encoding=\"application/x-tex\">P(K\\geq1)=1-P(K=0)=1-(1-0.075)^{10}\n=1-0.925^{10}\\approx0.5414.</annotation></semantics></math></span></div></p>\n<p>The calculation answers a different question from the one-day guardrail. A 7.5% daily chance can coexist with about a 54.1% modeled chance of at least one such day across ten independent days.</p>\n<p>Other models answer other questions. A <b>Poisson</b> count could model arrivals in a fixed interval if a roughly stable rate and suitable occurrence assumptions were defensible; an <b>exponential</b> model could then concern time between arrivals under the corresponding process assumptions. A <b>normal</b> model can represent some continuous, approximately symmetric quantities, but should not automatically be assigned to Embercup’s four-point profit distribution: it could place probability on profit amounts this simple model cannot produce. These are model choices, not properties conferred by a software menu. The business-statistics review distinguishes binomial and Poisson count settings (Holmes et al., 2023).</p>\n<p><b>Failure mode:</b> Treating ten consecutive rainy-season days as independent without checking whether the same weather system affects several days. Correlation would undermine the binomial calculation.</p>\n<p><b>Try it — ungraded:</b> Under the same independence assumptions, what is the chance of <b>zero</b> severe-loss days in three days?</p>\n<p><b>Explained answer:</b> Each day avoids the event with probability <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><mn>0.075</mn><mo>=</mo><mn>0.925</mn></mrow><annotation encoding=\"application/x-tex\">1-0.075=0.925</annotation></semantics></math></span>. Multiply across three independent days: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.92</mn><msup><mn>5</mn><mn>3</mn></msup><mo>≈</mo><mn>0.7915</mn></mrow><annotation encoding=\"application/x-tex\">0.925^3\\approx0.7915</annotation></semantics></math></span>. Without independence, this multiplication is not justified.</p>"},{"id":"3.2","level":3,"title":"3.2 Inputs, units, and sensitivity before a simulation","short":"3.2. Inputs, units, and sensitiv…","html":"<p>A simulation draws many hypothetical outcomes from specified input distributions and applies the <b>same decision rule</b> to each. Before generating anything, write down the process: draw rain with probability 0.30; conditional on that rain result, draw an alert using 0.75 if rainy or 0.20 if dry; buy the pitch exactly when alerted; then calculate dollars of profit. Drawing rain and alert independently with unconditional probabilities would erase the alert’s usefulness.</p>\n<p>Test influential inputs first. Suppose alert sensitivity were 0.50 rather than 0.75 while the false-alert rate remained 0.20. The rain-and-alert probability would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo stretchy=\"false\">(</mo><mn>0.50</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.15</mn></mrow><annotation encoding=\"application/x-tex\">0.30(0.50)=0.15</annotation></semantics></math></span>; dry-and-alert would remain 0.14. Gross information value would become <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.15</mn><mo stretchy=\"false\">(</mo><mn>320</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mn>0.14</mn><mo stretchy=\"false\">(</mo><mo>−</mo><mn>140</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>28.40</mn></mrow><annotation encoding=\"application/x-tex\">0.15(320)+0.14(-140)=\\$28.40</annotation></semantics></math></span>. After the $25 fee, the gain would be only <b>$3.40</b> per day, below Embercup’s $20 target. Rain-and-no-alert probability would rise to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo stretchy=\"false\">(</mo><mn>0.50</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.15</mn></mrow><annotation encoding=\"application/x-tex\">0.30(0.50)=0.15</annotation></semantics></math></span>. Those days have profit −$425, so the severe-loss probability would be <b>0.15</b>, failing the 0.10 guardrail. This is a <b>sensitivity analysis</b>: change an uncertain input and re-evaluate both objectives.</p>\n<div class=\"key\"><b>Simulation propagates assumptions; it does not validate them.</b> A large number of trials reduces random simulation noise, not uncertainty about whether 0.75 is the vendor’s true sensitivity.</div>\n<p><b>Failure mode:</b> Entering estimated probabilities to three decimal places, running thousands of trials, and reporting the resulting mean as if it were measured to the nearest cent. The output precision cannot repair weak inputs.</p>\n<p><b>Try it — ungraded:</b> If sensitivity instead rose to 0.80 and the false-alert rate stayed 0.20, what is the rainy no-alert probability?</p>\n<p><b>Explained answer:</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo>∩</mo><mi mathvariant=\"normal\">¬</mi><mi>A</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">[</mo><mn>1</mn><mo>−</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>A</mi><mo>∣</mo><mi>R</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">]</mo><mo>=</mo><mn>0.30</mn><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mn>0.80</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.06</mn></mrow><annotation encoding=\"application/x-tex\">P(R\\cap\\neg A)=P(R)[1-P(A\\mid R)]=0.30(1-0.80)=0.06</annotation></semantics></math></span>. Under the unchanged payoff rule, this is also the probability of a profit below −$150.</p>"},{"id":"4","level":2,"title":"4. Reproduce and check the model","short":"4. Reproduce and check the model","html":""},{"id":"4.1","level":3,"title":"4.1 Excel 365: one trial per row","short":"4.1. Excel 365: one trial per row","html":"<p>The input is a model, <b>not</b> a customer dataset. Set the worksheet grain to one simulated cart-day per row. Before clicking anything, check the expected benchmark: 0.365 of days should have alerts, expected profit should approach $47.40, and about 0.075 of days should fall below −$150. Excel’s <code>RAND()</code> generates a value from 0 up to, but not including, 1 and recalculates with the worksheet; Microsoft documents both behaviors (Microsoft, n.d.-b).</p>\n<p>Make headers in row 1: <code>Trial</code>, <code>Rain</code>, <code>Alert</code>, <code>BuyPitch</code>, <code>Profit</code>, <code>SevereLoss</code>. In row 2, enter:</p>\n<pre><code>A2: =ROW()-1\nB2: =--(RAND()&lt;0.30)\nC2: =--(RAND()&lt;IF(B2=1,0.75,0.20))\nD2: =C2\nE2: =200-600*B2+D2*(-140+460*B2)-25\nF2: =--(E2&lt;-150)</code></pre>\n<p><code>B2</code> is 1 for rain and 0 for dry. <code>C2</code> applies the <b>conditional</b> alert chance. <code>D2</code> implements the decision rule. In <code>E2</code>, <code>200-600*B2</code> gives $200 if dry and −$400 if rainy; <code>D2*(-140+460*B2)</code> adds −$140 for a dry-day pitch or $320 for a rainy-day pitch; <code>-25</code> charges the alert every day. <code>F2</code> records whether the strict loss threshold was crossed. The double minus turns a TRUE/FALSE comparison into 1/0. Copy A2:F2 through row 10001 for <b>10,000 trials</b>.</p>\n<p>In empty cells, calculate:</p>\n<pre><code>=AVERAGE(C2:C10001)\n=AVERAGE(E2:E10001)\n=AVERAGE(F2:F10001)</code></pre>\n<p>Interpret these, respectively, as simulated alert frequency, average daily profit in dollars, and simulated severe-loss frequency. They should be <b>near</b>, not exactly equal to, 0.365, $47.40, and 0.075. A manual row check is decisive: set rain = 1 and alert = 1 in a <i>separate check row</i>; the profit formula must give −$105. Rain = 0 and alert = 0 must give $175. Do not overwrite random-trial cells and then include the hand checks in the simulation range.</p>\n<p>Microsoft’s Excel simulation guidance also warns that random formulas change on recalculation (Microsoft, n.d.-a). For a record of a run, preserve a copy of its trial outputs as values alongside the formulas, assumptions, run date, and trial count. Excel’s displayed run is not guaranteed to match a later recalculation.</p>\n<p><b>Failure mode:</b> Using <code>RAND()&lt;0.75</code> for alerts on <i>all</i> days. That changes both the alert frequency and the decision’s value.</p>\n<p><b>Try it — ungraded:</b> If a trial has <code>Rain=0</code> and <code>Alert=1</code>, what should <code>BuyPitch</code>, <code>Profit</code>, and <code>SevereLoss</code> be?</p>\n<p><b>Explained answer:</b> The rule buys the pitch, so <code>BuyPitch=1</code>. Profit is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>200</mn><mo>−</mo><mn>140</mn><mo>−</mo><mn>25</mn><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>35</mn></mrow><annotation encoding=\"application/x-tex\">200-140-25=\\$35</annotation></semantics></math></span>; $35 is not below −$150, so <code>SevereLoss=0</code>. This tests one branch without relying on random output.</p>"},{"id":"4.2","level":3,"title":"4.2 SPSS: equivalent trial logic and a reproducible run","short":"4.2. SPSS: equivalent trial logi…","html":"<p>SPSS can create one simulated case per cart-day rather than requiring real customer records. IBM documents both random-variable functions and the <code>INPUT PROGRAM</code>/<code>LOOP</code> pattern for generating cases. Its <code>SET SEED</code> setting can initialize the default random-number generator for a repeatable sequence within a specified environment (IBM, n.d.-a, n.d.-b, n.d.-c).</p>\n<p>Here the model inputs and units are identical to Excel’s. Run the following SPSS Statistics syntax in an empty working session:</p>\n<pre><code>SET RNG=MC SEED=24680.\nINPUT PROGRAM.\nLOOP #i=1 TO 10000.\n  COMPUTE trial=#i.\n  COMPUTE rain=RV.BERNOULLI(.30).\n  COMPUTE alert=RV.BERNOULLI(.20+.55*rain).\n  COMPUTE buy_pitch=alert.\n  COMPUTE profit=200-600*rain+buy_pitch*(-140+460*rain)-25.\n  COMPUTE severe_loss=(profit &lt; -150).\n  END CASE.\nEND LOOP.\nEND FILE.\nEND INPUT PROGRAM.\nEXECUTE.\nDESCRIPTIVES VARIABLES=rain alert profit severe_loss\n  /STATISTICS=MEAN MIN MAX.</code></pre>\n<p><code>RV.BERNOULLI(.30)</code> returns a 0/1 rain outcome. The alert argument equals <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.20</mn><mo>+</mo><mn>0.55</mn><mo stretchy=\"false\">(</mo><mn>0</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.20</mn></mrow><annotation encoding=\"application/x-tex\">0.20+0.55(0)=0.20</annotation></semantics></math></span> when dry and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.20</mn><mo>+</mo><mn>0.55</mn><mo stretchy=\"false\">(</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.75</mn></mrow><annotation encoding=\"application/x-tex\">0.20+0.55(1)=0.75</annotation></semantics></math></span> when rainy. The next two lines apply the same action and profit equations as Excel. <code>END CASE</code> creates each trial; <code>END FILE</code> stops generation. The mean of a 0/1 variable is its simulated event frequency. Check that rain’s mean is near 0.30, alert’s near 0.365, profit’s near $47.40, and severe loss’s near 0.075. The 0/1 minima and maxima also help flag coding errors.</p>\n<p>The seed helps <b>repeat the SPSS run</b> with the same settings; it does not make SPSS and Excel produce identical rows. Keep the syntax, software version, seed, assumptions, and output together. Run the four-row hand payoff table independently as the stronger arithmetic check.</p>\n<p><b>Failure mode:</b> Treating 10,000 simulated cases as 10,000 observed Embercup days. They are generated from four stipulated probabilities, not sampled from the business.</p>\n<p><b>Try it — ungraded:</b> Why does <code>severe_loss</code> average to a probability estimate rather than a dollar amount?</p>\n<p><b>Explained answer:</b> It is coded 1 when the modeled event happens and 0 otherwise. Its mean is the number of 1s divided by the number of trials—a simulated event proportion. <code>profit</code>, by contrast, is measured in dollars.</p>"},{"id":"5","level":2,"title":"5. Make a bounded recommendation","short":"5. Make a bounded recommendation","html":""},{"id":"5.1","level":3,"title":"5.1 Decision, limits, and next action","short":"5.1. Decision, limits, and next…","html":"<p>Separate four kinds of statement:</p>\n<ul><li><b>Descriptive observation:</b> There are no observed Embercup cart-days in this case. The input table describes a fictional planning model, not a measured sample.</li><li><b>Assumption:</b> Rain occurs on 30% of comparable days; the vendor’s alert has 75% sensitivity and a 20% false-alert rate; each weather–action combination has the listed profit.</li><li><b>Model implication:</b> With those assumptions, subscribing and buying the pitch only after an alert has $47.40 expected daily profit. That is $27.40 above the best no-alert policy and clears the $20 target. Its modeled chance of profit below −$150 is 0.075, below the 0.10 guardrail.</li><li><b>Bounded recommendation:</b> <i>Conditionally favor</i> the alert-and-act rule <b>only if</b> the assumptions and the manager’s loss tolerance withstand validation. Do not describe a simulated advantage as an observed business impact or a statistically significant effect.</li></ul>\n<p>A useful sensitivity finding changes the next action. At 50% alert sensitivity, the projected gain falls to $3.40 and the downside guardrail fails. The manager should therefore ask the vendor for dated, auditable alerts matched to weather outcomes, including <i>no-alert</i> days; confirm that the vendor’s timing permits the pitch decision; and check the profit estimates against comparable cart-days. A short prospective pilot with a predeclared comparison could assess inputs. Sampling uncertainty and intervals are developed in S05; tests and A/B guardrails in S06; stronger causal and predictive boundaries later. None is silently supplied by this model.</p>\n<p>The optional optimization connection is narrow but useful: if many carts compete for a limited number of covered pitches, “buy when <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mn>0.30435</mn></mrow><annotation encoding=\"application/x-tex\">p&gt;0.30435</annotation></semantics></math></span>” may no longer be sufficient. A capacity constraint and the carts’ <i>incremental</i> values would determine an allocation. Employee scheduling, logistics, and financial optimization models are outside today’s worked decision; they are bridges, not extra claims established by this example.</p>\n<p><b>Failure mode:</b> Recommending subscription solely because its EMV is larger. The vendor may be inaccurate, the severe-loss tolerance may differ, and a multi-cart decision may face constraints omitted here.</p>\n<p><b>Try it — ungraded:</b> A manager reports, “The simulation proves alerts cause a $27.40 daily gain.” Replace that sentence with a defensible one.</p>\n<p><b>Explained answer:</b> “Under the stated rain, alert, and payoff assumptions, the model projects a $27.40 higher <i>expected</i> profit per cart-day for the alert-and-act rule than for the best no-alert rule.” No real-world causal effect was estimated.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>Define the decision, cart-day unit, KPI, target, and downside guardrail before calculating.</li><li>Conditional risk uses the population <b>after</b> the stated condition; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>A</mi><mo>∣</mo><mi>R</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P(A\\mid R)</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo stretchy=\"false\">(</mo><mi>R</mi><mo>∣</mo><mi>A</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P(R\\mid A)</annotation></semantics></math></span> differ.</li><li>Joint outcomes must cover all possibilities exactly once; their probabilities sum to one.</li><li>At the original rain prior, never buying the pitch has $20 EMV; always buying has $18.</li><li>Buy the pitch only when the available rain probability exceeds about 0.30435.</li><li>The imperfect alert has $52.40 gross information value and a $27.40 gain after its $25 daily fee.</li><li>The alert policy projects $47.40 expected daily profit and a 0.075 severe-loss probability; neither is an observed result.</li><li>Check every simulation against the four hand-calculated branches and the analytic benchmarks.</li><li>A less sensitive alert can remove the target gain <b>and</b> breach the guardrail.</li><li>Recommend conditionally, disclose loss exposure, and validate alert quality before committing.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<div class=\"tbl\"><table><thead><tr><th>Term</th><th>Plain-language meaning</th></tr></thead><tbody><tr><td><b>Unit of analysis</b></td><td>The single unit to which each probability, count, and profit figure refers, such as one day or one customer.</td></tr><tr><td><b>Event</b></td><td>A specified outcome that either occurs or does not, such as a late delivery.</td></tr><tr><td><b>Prior probability</b></td><td>Chance of an event before new information, such as an alert, is taken into account.</td></tr><tr><td><b>Joint probability</b></td><td>Chance that two events occur together, such as the event <b>and</b> an alert.</td></tr><tr><td><b>Conditional probability</b></td><td>Chance of an event within a restricted group, such as the event <b>among cases with an alert</b>.</td></tr><tr><td><b>Sensitivity</b></td><td>Chance an alert or signal fires when the event occurs.</td></tr><tr><td><b>False-alert rate</b></td><td>Chance an alert or signal fires when the event does not occur.</td></tr><tr><td><b>Random variable</b></td><td>A number determined by an uncertain outcome, such as daily profit.</td></tr><tr><td><b>Distribution</b></td><td>Possible values of a random variable and their probabilities.</td></tr><tr><td><b>Payoff</b></td><td>Profit or loss from a particular action combined with a particular outcome.</td></tr><tr><td><b>Expected monetary value (EMV)</b></td><td>Probability-weighted average payoff under stated assumptions.</td></tr><tr><td><b>Decision threshold</b></td><td>The event probability at which two actions have equal expected payoff; on either side of it, one action is expected to pay more.</td></tr><tr><td><b>Decision tree</b></td><td>A diagram or ordered account of choices, information, uncertain outcomes, and payoffs.</td></tr><tr><td><b>Value of sample information</b></td><td>Expected improvement from an imperfect signal before paying for it.</td></tr><tr><td><b>Guardrail</b></td><td>A limit the decision must respect in addition to its profit target.</td></tr><tr><td><b>Binomial distribution</b></td><td>Model for the count of events across a fixed number of independent, equal-probability trials.</td></tr><tr><td><b>Simulation</b></td><td>Repeated hypothetical draws from specified inputs, followed by the decision and payoff calculation.</td></tr><tr><td><b>Sensitivity analysis</b></td><td>Recalculation after changing an uncertain input to see whether the decision survives.</td></tr></tbody></table></div>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>Holmes, A., Illowsky, B., &amp; Dean, S. (2023). 3.1 Terminology. In <i>Introductory business statistics 2e</i>. OpenStax. <a href=\"https://openstax.org/books/introductory-business-statistics-2e/pages/3-1-terminology\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/introductory-business-statistics-2e/pages/3-1-terminology</a></p>\n<p>Holmes, A., Illowsky, B., &amp; Dean, S. (2023). Chapter 4 review. In <i>Introductory business statistics 2e</i>. OpenStax. <a href=\"https://openstax.org/books/introductory-business-statistics-2e/pages/4-chapter-review\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/introductory-business-statistics-2e/pages/4-chapter-review</a></p>\n<p>Illowsky, B., &amp; Dean, S. (2020). 4.2 Mean or expected value and standard deviation. In <i>Statistics</i>. OpenStax. <a href=\"https://openstax.org/books/statistics/pages/4-2-mean-or-expected-value-and-standard-deviation\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/statistics/pages/4-2-mean-or-expected-value-and-standard-deviation</a></p>\n<p>IBM. (n.d.-a). <i>Creating data (LOOP–END LOOP command).</i> IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=loop-creating-data-end-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=loop-creating-data-end-command</a></p>\n<p>IBM. (n.d.-b). <i>MTINDEX, RNG, and SEED subcommands (SET command).</i> IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=set-mtindex-rng-seed-subcommands-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=set-mtindex-rng-seed-subcommands-command</a></p>\n<p>IBM. (n.d.-c). <i>Random variable and distribution functions.</i> IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=expressions-random-variable-distribution-functions\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/32.0.0?topic=expressions-random-variable-distribution-functions</a></p>\n<p>Massachusetts Institute of Technology. (2002). <i>Lecture 19, part 1: Decision trees and value of information</i> [Lecture slides]. MIT OpenCourseWare. <a href=\"https://ocw.mit.edu/courses/6-825-techniques-in-artificial-intelligence-sma-5504-fall-2002/d5b46fa507bf7dc6e16ad05e3ed83f7f_Lecture19FinalPart1.pdf\" target=\"_blank\" rel=\"noopener\">https://ocw.mit.edu/courses/6-825-techniques-in-artificial-intelligence-sma-5504-fall-2002/d5b46fa507bf7dc6e16ad05e3ed83f7f_Lecture19FinalPart1.pdf</a></p>\n<p>Microsoft. (n.d.-a). <i>Introduction to Monte Carlo simulation in Excel.</i> Microsoft Support. <a href=\"https://support.microsoft.com/en-US/Excel/introduction-to-monte-carlo-simulation-in-excel\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-US/Excel/introduction-to-monte-carlo-simulation-in-excel</a></p>\n<p>Microsoft. (n.d.-b). <i>RAND function.</i> Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/functions/rand-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/functions/rand-function</a></p>"}]};
globalThis.LESSON_I18N = {"zh":{"CloudFlow Under Uncertainty":"不确定性下的 CloudFlow","GC1015 · Session 4 · Conditional risk, expected value, simulation":"GC1015 · 第 4 课 · 条件风险、期望值、模拟","Finish":"完成","Evidence so far":"目前的证据","Conditional risk and Bayes":"条件风险与贝叶斯","Expected value and payoff tables":"期望值与收益表","Monte Carlo simulation":"蒙特卡洛模拟","Case file: CloudFlow Analytics":"案例档案：CloudFlow Analytics","Fictional business software company. The CFO needs three answers for the Risk Committee: should we screen high-ticket accounts, which hub should we build, and is the profit plan too optimistic?":"虚构的企业软件公司。CFO 需要为风险委员会给出三个答案：是否应筛查高工单量账户，应该建哪个枢纽，利润计划是否过于乐观？","Lab file <code>cloudflow_churn_cohort.csv</code>: one row per account, 1,000 rows, with Churn and HighTickets coded Yes or No.":"实验文件 <code>cloudflow_churn_cohort.csv</code>：每个账户一行，共 1,000 行，Churn 和 HighTickets 编码为 Yes 或 No。","Hub payoff, $ millions":"枢纽收益，百万美元","High 0.30":"高 0.30","Medium 0.50":"中 0.50","Low 0.20":"低 0.20","Large Hub":"大型枢纽","Modular Hub":"模块化枢纽","Payoffs are net of the capital cost. The slides show a version with Large Hub payoffs 13, 2 and −8. Both versions give the same EMVs and the same tipping point.":"收益已扣除资本成本。幻灯片中的版本，大型枢纽的收益为 13、2 和 −8。两个版本的 EMV 相同，临界点也相同。","Capacity model: 1,000 units of capacity at $40 per unit, $100 per unit sold, $15 for each unused unit. Demand is normal with mean 1,000 and SD 250.":"产能模型：1,000 单位产能，每单位成本 $40；每售出一单位收入 $100；每个未使用单位回收 $15。需求服从正态分布，均值 1,000，SD 250。","Toolkit note: the linked toolkit practices the same methods on a different fictional case, Embercup’s rain alert. Use it for the methods and this case file for CloudFlow’s numbers.":"工具包说明：链接的工具包用另一个虚构案例 Embercup 的降雨预警来练习同样的方法。方法请看工具包，CloudFlow 的数字请看本案例档案。","Cohort counts":"队列计数","Set on screen 2":"在第 2 屏设定","Baseline churn":"基准流失率","Churn among flagged accounts":"被标记账户的流失率","The “80%”":"那个“80%”","Screening claim":"筛查结论","Hub EMVs":"枢纽 EMV","Tipping point":"临界点","Flaw of averages":"平均值缺陷","Simulated profit":"模拟利润","Downside":"下行风险","Lead for the CFO":"给 CFO 的开篇结论","Is a flagged account about to leave?":"被标记的账户快要流失了吗？","Your gut call, before any math: of all flagged accounts, what share churn?":"先别计算，凭直觉判断：在所有被标记的账户中，有多大比例会流失？","CloudFlow Analytics, a fictional software company, sells to other businesses. Its CFO must answer three questions for the Risk Committee.":"CloudFlow Analytics 是一家虚构的软件公司，面向企业客户销售。它的 CFO 必须为风险委员会回答三个问题。","The first one: Customer Success flags accounts with heavy support-ticket volume. Someone told the CFO that flagged accounts churn “80%” of the time.":"第一个问题：客户成功团队会标记支持工单量很大的账户。有人告诉 CFO，被标记的账户有“80%”会流失。","Noted. You will check this against the data in a few screens.":"记下了。再过几屏，你会用数据来检验它。","About 80%":"约 80%","About 50%":"约 50%","About 35%":"约 35%","About 12%":"约 12%","Count before you calculate":"先计数，再计算","Last year CloudFlow tracked 1,000 accounts. Each row of the lab file is one account: did it churn, and was it flagged for high tickets?":"去年 CloudFlow 跟踪了 1,000 个账户。实验文件的每一行是一个账户：它是否流失？是否因工单量高而被标记？","Use the filters. Count the flagged accounts, the flagged accounts that churned, and all churned accounts.":"使用筛选器。数一数被标记的账户、被标记且流失的账户，以及所有流失的账户。","<p>272 accounts were flagged, 96 of them churned, and 120 accounts churned in total. Every probability in this part comes from these counts and the total of 1,000.</p>\n          <p>In Excel: <code>=COUNTIFS(Cohort[HighTickets],\"Yes\",Cohort[Churn],\"Yes\")</code> returns 96.</p>":"<p>272 个账户被标记，其中 96 个流失；流失账户总共 120 个。本部分的每个概率都来自这些计数和总数 1,000。</p>\n          <p>在 Excel 中：<code>=COUNTIFS(Cohort[HighTickets],\"Yes\",Cohort[Churn],\"Yes\")</code> 返回 96。</p>","flagged (HighTickets = Yes) = {{h}}":"被标记（HighTickets = Yes）= {{h}}","flagged and churned (HighTickets = Yes, Churn = Yes) = {{hc}}":"被标记且流失（HighTickets = Yes, Churn = Yes）= {{hc}}","all churned (Churn = Yes) = {{c}}":"全部流失（Churn = Yes）= {{c}}","Set HighTickets to Yes and leave Churn on (Any). Read the row count.":"把 HighTickets 设为 Yes，Churn 保持 (Any)。读出行数。","Flagged accounts":"被标记账户","Keep HighTickets = Yes and set Churn = Yes.":"保持 HighTickets = Yes，并把 Churn 设为 Yes。","Flagged and churned":"被标记且流失","Set HighTickets back to (Any) and Churn to Yes.":"把 HighTickets 改回 (Any)，Churn 设为 Yes。","All churned":"全部流失","1,000 accounts; 272 flagged; 120 churned; 96 both":"1,000 个账户；272 个被标记；120 个流失；96 个两者皆是","Build the two-way table":"构建列联表","You now know four facts: 1,000 accounts, 120 churned, 272 flagged, and 96 both flagged and churned.":"你现在知道四个事实：1,000 个账户，120 个流失，272 个被标记，96 个既被标记又流失。","Drag a count into each cell. Two tiles are totals, not cells.":"把计数拖进每个单元格。有两个卡片是合计，不属于单元格。","<p>Inside cells are joint counts; row and column totals are marginal counts. Flagged: 96 + 176 = 272. Churned: 96 + 24 = 120. All four cells add to 1,000.</p>":"<p>内部单元格是联合计数；行合计和列合计是边际计数。被标记：96 + 176 = 272。流失：96 + 24 = 120。四个单元格加起来是 1,000。</p>","Flag ↓   Outcome →":"标记 ↓   结果 →","Flagged (high tickets)":"被标记（高工单量）","Not flagged":"未被标记","Churned":"流失","Renewed":"续约","120 is the total of the Churned column, a margin. The cells split it: 96 flagged plus 24 not flagged.":"120 是“流失”列的合计，属于边际值。单元格把它拆开：96 个被标记加 24 个未被标记。","272 is the total of the Flagged row. The cells split it: 96 churned plus 176 renewed.":"272 是“被标记”行的合计。单元格把它拆开：96 个流失加 176 个续约。","96 accounts were both flagged and churned. That is the Flagged, Churned cell.":"96 个账户既被标记又流失。它属于“被标记、流失”这个单元格。","176 = 272 − 96: flagged accounts that renewed.":"176 = 272 − 96：被标记但续约的账户。","24 = 120 − 96: churned accounts that were not flagged.":"24 = 120 − 96：流失但未被标记的账户。","704 = 1,000 − 272 − 24: accounts that were neither flagged nor churned.":"704 = 1,000 − 272 − 24：既未被标记也未流失的账户。","Marginal, joint and either":"边际、联合与“或”","When a question is about everyone, divide by all 1,000 accounts.":"当问题涉及所有人时，就除以全部 1,000 个账户。","Write each probability as a decimal.":"把每个概率写成小数。","<p>Baseline churn is 12.0%. 27.2% of accounts were flagged, and 9.6% were both. 29.6% churned, were flagged, or both.</p>\n          <p>The addition rule subtracts the overlap because the 96 accounts sit in both the churn total and the flag total.</p>":"<p>基准流失率为 12.0%。27.2% 的账户被标记，9.6% 两者皆是。29.6% 的账户流失、被标记或两者皆是。</p>\n          <p>加法法则要减去重叠部分，因为这 96 个账户既在流失合计中，也在标记合计中。</p>","P(churn) = 120 / 1,000 = {{pc}}":"P(churn) = 120 / 1,000 = {{pc}}","P(flagged) = 272 / 1,000 = {{ph}}":"P(flagged) = 272 / 1,000 = {{ph}}","P(churn and flagged) = 96 / 1,000 = {{pch}}":"P(churn and flagged) = 96 / 1,000 = {{pch}}","P(churn or flagged) = P(churn) + P(flagged) − P(both) = {{pu}}":"P(churn or flagged) = P(churn) + P(flagged) − P(both) = {{pu}}","120 ÷ 1,000 = 0.12, the baseline churn rate.":"120 ÷ 1,000 = 0.12，即基准流失率。","P(churn)":"P(churn)","P(flagged)":"P(flagged)","Both events together: 96 ÷ 1,000 = 0.096.":"两个事件同时发生：96 ÷ 1,000 = 0.096。","P(churn and flagged)":"P(churn and flagged)","Subtract the overlap once: 0.12 + 0.272 − 0.096 = 0.296. Without it you get 0.392 and count 96 accounts twice.":"减去一次重叠部分：0.12 + 0.272 − 0.096 = 0.296。不减的话会得到 0.392，把 96 个账户算了两次。","P(churn or flagged)":"P(churn or flagged)","P(churn) = 12.0% (120 of 1,000)":"P(churn) = 12.0%（1,000 个中的 120 个）","Pick the right denominator":"选对分母","The CFO asks: of the accounts we flag, what share churn?":"CFO 问：在我们标记的账户中，有多大比例会流失？","Which count belongs in the denominator?":"哪个计数应该放在分母？","<p>“Of the accounts we flag” limits the question to the flagged row. Its total, 272, becomes the denominator. Name the condition first, then pick the denominator.</p>":"<p>“在我们标记的账户中”把问题限定在“被标记”这一行。该行合计 272 就成为分母。先说出条件，再选分母。</p>","272, all flagged accounts":"272，所有被标记账户","120, all churned accounts":"120，所有流失账户","Dividing by churners answers a different question: what share of churners were flagged. That is 80%.":"除以流失账户数回答的是另一个问题：流失账户中有多大比例被标记。那是 80%。","1,000, all accounts":"1,000，所有账户","Dividing by everyone gives the joint probability, 9.6%. The question is only about flagged accounts.":"除以全部账户得到的是联合概率 9.6%。而问题只关心被标记的账户。","Two conditional probabilities":"两个条件概率","Same numerator, 96 accounts, but two different groups.":"分子相同，都是 96 个账户，但对应两个不同的群体。","Compute both as decimals, to four places.":"把两者都算成小数，保留四位。","<p>About 35.3% of flagged accounts churned. That is roughly 3 times the 12.0% baseline (0.3529 ÷ 0.12 ≈ 2.94).</p>\n          <p>80% is the share of churners who were flagged. Same 96 accounts, different denominator, different question.</p>":"<p>约 35.3% 的被标记账户流失了，大约是 12.0% 基准的 3 倍（0.3529 ÷ 0.12 ≈ 2.94）。</p>\n          <p>80% 是流失账户中被标记的比例。同样的 96 个账户，分母不同，问题也不同。</p>","P(churn | flagged) = 96 / 272 = {{cf}}":"P(churn | flagged) = 96 / 272 = {{cf}}","P(flagged | churn) = 96 / 120 = {{fc}}":"P(flagged | churn) = 96 / 120 = {{fc}}","96 ÷ 272 ≈ 0.3529. The group is the 272 flagged accounts.":"96 ÷ 272 ≈ 0.3529。这里的群体是 272 个被标记账户。","P(churn given flagged)":"被标记账户的流失概率","96 ÷ 120 = 0.80. The group is the 120 churned accounts.":"96 ÷ 120 = 0.80。这里的群体是 120 个流失账户。","P(flagged given churn)":"流失账户被标记的概率","P(churn | flag) = 35.3% (96 of 272)":"P(churn | flag) = 35.3%（272 个中的 96 个）","Where did “80%” come from?":"“80%”是从哪来的？","A manager tells the CFO: “80% of churners had high tickets, so 80% of flagged accounts will churn.”":"一位经理告诉 CFO：“80% 的流失账户工单量都高，所以 80% 的被标记账户会流失。”","What is wrong with the claim?":"这个说法错在哪里？","<p>This is the transposition error: P(A | B) is not P(B | A). 80% describes churners. The CFO asked about flagged accounts, and 64.7% of those renewed.</p>\n          <p>Renewers are 88% of the base, so even a 20% false-alert rate flags 176 of them, more than the 96 churners the flag catches.</p>":"<p>这是条件倒置错误：P(A | B) 不等于 P(B | A)。80% 描述的是流失账户。CFO 问的是被标记账户，而其中 64.7% 续约了。</p>\n          <p>续约账户占全体的 88%，所以即使误报率只有 20%，也会标记其中 176 个，比标记抓到的 96 个流失账户还多。</p>","It swaps the condition: P(flag | churn) is not P(churn | flag).":"它把条件弄反了：P(flag | churn) 不等于 P(churn | flag)。","Nothing. A flag that catches 80% of churners is 80% accurate.":"没有问题。能抓到 80% 流失账户的标记，准确率就是 80%。","The flag also fires for 176 renewers. Those false alerts pull the share of flagged accounts that churn down to 35.3%.":"这个标记也会对 176 个续约账户触发。这些误报把被标记账户的流失比例拉低到 35.3%。","The 80% is right, but only for large accounts.":"80% 是对的，但只适用于大客户账户。","The data have no account-size field. The error is the reversed condition, not the segment.":"数据中没有账户规模字段。错误在于条件颠倒，而不在于细分群体。","It should use all 1,000 accounts as the denominator.":"它应该用全部 1,000 个账户作为分母。","That gives the joint probability, 9.6%. The CFO needs the share among flagged accounts.":"那样得到的是联合概率 9.6%。CFO 需要的是被标记账户中的比例。","80% is P(flag | churn), not the churn risk":"80% 是 P(flag | churn)，不是流失风险","Slide the base rate":"拖动基础比率","Keep the flag the same: it catches 80% of churners and wrongly flags 20% of renewers. Only the base churn rate changes.":"标记保持不变：它抓到 80% 的流失账户，并误标 20% 的续约账户。只有基础流失率在变。","Drag the base rate. What is the smallest whole-percent base rate at which a flagged account is more likely to churn than to renew?":"拖动基础比率。基础比率最小为多少（取整数百分比）时，被标记账户流失的可能性会高于续约？","<p>Per 1,000 accounts at a 20% base rate, the flag catches 0.80 × 200 = 160 churners and wrongly flags 0.20 × 800 = 160 renewers: a tie. At 21%, P(churn | flag) = 0.168 ÷ 0.326 ≈ 51.5%.</p>\n          <p>CloudFlow sits at 12%, well below that line. When the base rate is low, false alerts on the large renewing group fill most of the flagged pile.</p>":"<p>基础比率为 20% 时，每 1,000 个账户中，标记会抓到 0.80 × 200 = 160 个流失账户，并误标 0.20 × 800 = 160 个续约账户：打平。在 21% 时，P(churn | flag) = 0.168 ÷ 0.326 ≈ 51.5%。</p>\n          <p>CloudFlow 处在 12%，远低于这条线。基础比率低时，对庞大续约群体的误报会占据被标记账户的大部分。</p>","Same answer by Bayes rule":"用贝叶斯法则得到同样的答案","Without the table, start from three rates: the prior P(churn) = 0.12, P(flag | churn) = 0.80 and P(flag | renew) = 0.20.":"不用表格，从三个比率出发：先验概率 P(churn) = 0.12，P(flag | churn) = 0.80，P(flag | renew) = 0.20。","Fill in each step of Bayes rule.":"填写贝叶斯法则的每一步。","<p>Bayes rule: P(C | H) = P(H | C) P(C) ÷ [P(H | C) P(C) + P(H | renew) P(renew)] = 0.096 ÷ 0.272 ≈ 0.3529.</p>\n          <p>It is the table in rate form. The denominator adds every way to be flagged; that sum is the law of total probability.</p>":"<p>贝叶斯法则：P(C | H) = P(H | C) P(C) ÷ [P(H | C) P(C) + P(H | renew) P(renew)] = 0.096 ÷ 0.272 ≈ 0.3529。</p>\n          <p>它就是比率形式的列联表。分母把被标记的所有途径加在一起；这个总和就是全概率公式。</p>","churn and flagged = 0.80 × 0.12 = {{j1}}":"流失且被标记 = 0.80 × 0.12 = {{j1}}","renew and flagged = 0.20 × 0.88 = {{j0}}":"续约且被标记 = 0.20 × 0.88 = {{j0}}","P(flag) = churn and flagged + renew and flagged = {{pf}}":"P(flag) = 流失且被标记 + 续约且被标记 = {{pf}}","P(churn | flag) = churn and flagged ÷ P(flag) = {{pp}}":"P(churn | flag) = 流失且被标记 ÷ P(flag) = {{pp}}","0.80 × 0.12 = 0.096, the same 96 out of 1,000.":"0.80 × 0.12 = 0.096，也就是 1,000 个中的那 96 个。","Joint churn and flagged":"流失且被标记的联合概率","0.20 × 0.88 = 0.176. The prior for renewing is 1 − 0.12 = 0.88.":"0.20 × 0.88 = 0.176。续约的先验概率为 1 − 0.12 = 0.88。","Joint renew and flagged":"续约且被标记的联合概率","Add both ways to be flagged: 0.096 + 0.176 = 0.272.":"把被标记的两种途径相加：0.096 + 0.176 = 0.272。","P(flag)":"P(flag)","Divide the churn joint by the total: 0.096 ÷ 0.272 ≈ 0.3529.":"用流失的联合概率除以总和：0.096 ÷ 0.272 ≈ 0.3529。","Posterior churn risk":"后验流失风险","Better catch, or fewer false alerts?":"多抓一些，还是少些误报？","Customer Success can tune the flag. Option 1 raises sensitivity from 80% to 90%. Option 2 cuts false alerts on renewers from 20% to 10%. The base rate stays at 12%.":"客户成功团队可以调整标记。方案 1 把灵敏度从 80% 提高到 90%。方案 2 把对续约账户的误报率从 20% 降到 10%。基础比率保持 12%。","Use the sliders. Which option raises P(churn | flag) more?":"使用滑块。哪个方案让 P(churn | flag) 提高得更多？","<p>At 90% sensitivity: 0.108 ÷ (0.108 + 0.176) ≈ 38.0%. At 10% false alerts: 0.096 ÷ (0.096 + 0.088) ≈ 52.2%.</p>\n          <p>With a 12% base rate, most flagged accounts are renewers. Shrinking false alerts on that large group does more than catching a few more churners.</p>":"<p>灵敏度为 90% 时：0.108 ÷ (0.108 + 0.176) ≈ 38.0%。误报率为 10% 时：0.096 ÷ (0.096 + 0.088) ≈ 52.2%。</p>\n          <p>基础比率为 12% 时，大多数被标记账户是续约账户。减少对这个大群体的误报，比多抓几个流失账户更有效。</p>","Cutting false alerts to 10%: about 52%, against about 38%":"把误报率降到 10%：约 52%，对比约 38%","Raising sensitivity to 90%, because it finds more churners":"把灵敏度提高到 90%，因为能找到更多流失账户","Set sensitivity to 90% with false alerts at 20%: P(churn | flag) only reaches about 38%. Renewers still fill the flagged pile.":"把灵敏度设为 90%、误报率保持 20%：P(churn | flag) 只能达到约 38%。被标记的账户里仍然大多是续约账户。","They are equal, since both move the flag by 10 points":"两者相同，因为都让标记变动了 10 个点","Ten points of sensitivity act on 120 churners. Ten points of false alerts act on 880 renewers, so the second moves far more accounts.":"灵敏度的十个点作用于 120 个流失账户。误报率的十个点作用于 880 个续约账户，所以后者影响的账户要多得多。","What can the CFO claim?":"CFO 能主张什么？","Flagged accounts churned at 35.3%, against a 12.0% baseline. The CFO also asks: does this show that screening would prevent churn?":"被标记账户的流失率为 35.3%，而基准为 12.0%。CFO 还问：这能说明筛查会防止流失吗？","Which statement can the memo defend?":"备忘录能站得住脚的是哪种说法？","<p>The table is descriptive: churn was more common among flagged accounts last year. That supports putting flagged accounts first in a queue.</p>\n          <p>It cannot show that an intervention would prevent churn. That needs a test in which some flagged accounts get the intervention and others do not, the topic of Session 6.</p>":"<p>这个表是描述性的：去年被标记账户中流失更常见。这支持把被标记账户排在队列前面。</p>\n          <p>它无法证明干预能防止流失。那需要做一次试验，让一部分被标记账户接受干预、另一部分不接受，这是第 6 课的主题。</p>","Flagged accounts carry about 3 times the baseline risk; screen them first. Prevention is unproven.":"被标记账户的风险约为基准的 3 倍；应优先筛查它们。能否防止流失尚未得到证明。","Contacting flagged accounts will cut churn by about 35%.":"联系被标记账户会让流失减少约 35%。","The data show an association between tickets and churn. They contain no intervention, so they cannot show a treatment effect.":"数据显示工单量与流失之间存在关联。数据中没有任何干预，所以无法显示处理效应。","High tickets cause churn, so cutting tickets will stop churn.":"高工单量导致流失，所以减少工单就能阻止流失。","Tickets may be a symptom of a deeper problem. An association in past data is not a causal effect.":"工单可能只是更深层问题的症状。历史数据中的关联并不是因果效应。","The flag is useless because most flagged accounts renew.":"这个标记毫无用处，因为大多数被标记账户都会续约。","A flagged account is about 3 times as likely to churn as the average account. That is useful for ranking, even if most flagged accounts renew.":"被标记账户的流失可能性约为平均账户的 3 倍。即使大多数被标记账户会续约，这对排序仍然有用。","Screen flagged accounts first; prevention not shown":"优先筛查被标记账户；防止流失的作用未被证明","Parts of a decision tree":"决策树的组成部分","CloudFlow must also add capacity: build a Large Hub or a Modular Hub. Next year, demand will be high, medium or low.":"CloudFlow 还必须增加产能：建大型枢纽还是模块化枢纽。明年的需求可能高、中或低。","Drag each description to the tree symbol it belongs to. Two tiles do not belong.":"把每条描述拖到它对应的树形符号上。有两张卡片不属于任何符号。","<p>Squares are decisions: CloudFlow picks the branch. Circles are chance nodes: demand picks the branch, with probabilities that sum to 1. Each path ends in a net payoff after the capital cost.</p>\n          <p>Draw the nodes in time order. CloudFlow commits capital before demand is known, so the square comes first.</p>":"<p>方框是决策：由 CloudFlow 选择分支。圆圈是机会节点：由需求决定分支，各分支概率之和为 1。每条路径的末端是扣除资本成本后的净收益。</p>\n          <p>按时间顺序画节点。CloudFlow 在知道需求之前就要投入资本，所以方框在前。</p>","The EMV CloudFlow will earn":"CloudFlow 将赚到的 EMV","An event CloudFlow does not control: demand":"CloudFlow 无法控制的事件：需求","Net payoff in $ millions, after the capital cost":"扣除资本成本后的净收益，单位为百万美元","Gross cash flow before the capital cost":"扣除资本成本前的总现金流","A choice CloudFlow controls: Large or Modular":"CloudFlow 能控制的选择：大型或模块化","Square ■":"方框 ■","Circle ●":"圆圈 ●","Branch end ▸":"分支末端 ▸","EMV is computed at a circle as a weighted average. No branch ends with it, and no single year pays it.":"EMV 是在圆圈处算出的加权平均值。没有哪条分支以它结尾，也没有哪一年恰好赚到这个数。","Branch ends hold net payoffs. Subtract the capital outlay first, or you overstate both hubs.":"分支末端放的是净收益。先减去资本支出，否则两个枢纽的收益都会被高估。","CloudFlow picks the hub, so that is a decision: a square.":"选哪个枢纽由 CloudFlow 决定，所以这是一个决策：方框。","Demand is not CloudFlow’s choice. Uncertain events sit at circles.":"需求不是 CloudFlow 能选择的。不确定事件放在圆圈处。","Roll back the tree":"逆推决策树","Payoffs are in $ millions, after the capital cost. High demand has probability 0.30, medium 0.50 and low 0.20.":"收益单位为百万美元，已扣除资本成本。高需求的概率为 0.30，中需求 0.50，低需求 0.20。","Compute the EMV at each circle, then the value at the square.":"先算出每个圆圈处的 EMV，再算方框处的值。","<p>EMV(Large) = $3.30M and EMV(Modular) = $5.40M. Rolling back, the square keeps the Modular branch and prunes the Large one. The EMV premium is $2.10M.</p>\n          <p>In Excel: <code>=SUMPRODUCT($B$7:$D$7,B10:D10)</code>.</p>":"<p>EMV(Large) = $3.30M，EMV(Modular) = $5.40M。逆推时，方框保留模块化分支，剪掉大型分支。EMV 溢价为 $2.10M。</p>\n          <p>在 Excel 中：<code>=SUMPRODUCT($B$7:$D$7,B10:D10)</code>。</p>","EMV(Large) = 0.30 × 12 + 0.50 × 3 + 0.20 × (−9) = {{el}}":"EMV(Large) = 0.30 × 12 + 0.50 × 3 + 0.20 × (−9) = {{el}}","EMV(Modular) = 0.30 × 9 + 0.50 × 5 + 0.20 × 1 = {{em}}":"EMV(Modular) = 0.30 × 9 + 0.50 × 5 + 0.20 × 1 = {{em}}","value at the square = the larger EMV = {{v}}":"方框处的值 = 较大的 EMV = {{v}}","3.6 + 1.5 − 1.8 = 3.30. Keep the minus sign on the low-demand payoff.":"3.6 + 1.5 − 1.8 = 3.30。低需求收益前的负号不要丢。","EMV of the Large Hub":"大型枢纽的 EMV","EMV of the Modular Hub":"模块化枢纽的 EMV","At a decision square, keep the better branch: the larger of 3.30 and 5.40.":"在决策方框处，保留更好的分支：3.30 和 5.40 中较大的那个。","Value at the decision node":"决策节点处的值","Large $3.30M vs Modular $5.40M: Modular":"大型 $3.30M 对比模块化 $5.40M：选模块化","Biggest payoff, smaller EMV":"收益最高，EMV 却更低","A committee member says: “The Large Hub can make $12M. The Modular Hub tops out at $9M. Build Large.”":"一位委员会成员说：“大型枢纽能赚 $12M。模块化枢纽最多只有 $9M。建大型的。”","Why does the Modular Hub still have the higher EMV?":"为什么模块化枢纽的 EMV 仍然更高？","<p>High demand is only 30% likely. In medium demand (50%) Modular earns $5M against $3M, and in low demand (20%) it earns $1M against a $9M loss for Large. Those two states carry 70% of the probability.</p>\n          <p>The best single payoff is one cell of the table. EMV uses the whole row.</p>":"<p>高需求的可能性只有 30%。在中需求（50%）下，模块化赚 $5M，大型赚 $3M；在低需求（20%）下，模块化赚 $1M，而大型亏损 $9M。这两种状态合计占 70% 的概率。</p>\n          <p>最好的单个收益只是表中的一个单元格。EMV 用的是整行。</p>","It wins in medium and low demand, which together have probability 0.70.":"它在中需求和低需求下胜出，这两种情况的概率合计为 0.70。","Its capital cost is lower, so EMV ignores the payoffs.":"它的资本成本更低，所以 EMV 忽略了收益。","The payoffs are already net of capital cost. EMV weighs each net payoff by its probability.":"收益已经扣除了资本成本。EMV 按概率对每个净收益加权。","EMV always favors the safer option.":"EMV 总是偏向更安全的方案。","EMV is risk-neutral. It favors Modular here only because its probability-weighted payoffs are larger.":"EMV 是风险中性的。它在这里偏向模块化，只是因为模块化按概率加权后的收益更大。","The $12M payoff cannot happen.":"$12M 的收益不可能出现。","It can, with probability 0.30. EMV counts it, weighted by 0.30.":"它可能出现，概率为 0.30。EMV 把它算进去了，权重为 0.30。","What does $5.40M mean?":"$5.40M 是什么意思？","The draft memo says: “The Modular Hub will earn $5.40M.”":"备忘录草稿写道：“模块化枢纽将赚 $5.40M。”","How should the memo describe EMV?":"备忘录应该如何描述 EMV？","<p>EMV is the long-run average if this choice could be repeated many times under the same probabilities. CloudFlow builds one hub, once, and gets one outcome. Report EMV together with the worst case: $1M for Modular, −$9M for Large.</p>":"<p>EMV 是在相同概率下把这个选择重复很多次后的长期平均值。CloudFlow 只建一个枢纽、只建一次，也只会得到一个结果。报告 EMV 时要同时给出最坏情况：模块化为 $1M，大型为 −$9M。</p>","A probability-weighted average; CloudFlow will actually get $9M, $5M or $1M.":"按概率加权的平均值；CloudFlow 实际会得到 $9M、$5M 或 $1M。","The payoff CloudFlow will earn in a typical year.":"CloudFlow 在典型年份会赚到的收益。","No state pays $5.40M. The hub pays $9M, $5M or $1M, depending on demand.":"没有哪种状态的收益是 $5.40M。根据需求不同，这个枢纽的收益是 $9M、$5M 或 $1M。","A guaranteed minimum: the hub earns at least $5.40M.":"有保证的下限：这个枢纽至少赚 $5.40M。","In low demand the Modular Hub earns only $1M, below its EMV.":"在低需求下，模块化枢纽只赚 $1M，低于它的 EMV。","The most likely payoff.":"最可能出现的收益。","The most likely state is medium demand, which pays $5M. EMV is a weighted average, not the most likely value.":"最可能的状态是中需求，收益为 $5M。EMV 是加权平均值，而不是最可能的值。","Where does the decision flip?":"决策在哪里反转？","Hold P(medium) at 0.50. As P(high) rises, P(low) falls by the same amount. Today’s forecast is P(high) = 0.30.":"把 P(medium) 固定为 0.50。P(high) 上升多少，P(low) 就下降多少。目前的预测是 P(high) = 0.30。","Drag P(high). What is the smallest value, in steps of 0.01, at which the Large Hub has the higher EMV?":"拖动 P(high)。以 0.01 为步长，P(high) 最小为多少时，大型枢纽的 EMV 更高？","<p>With P(medium) = 0.50, EMV(Large) = 21p − 3 and EMV(Modular) = 8p + 3. The lines cross at p = 6/13 ≈ 0.4615, so on a 0.01 grid Large first wins at 0.47.</p>\n          <p>The forecast of 0.30 sits about 0.16 below the tipping point, so the Modular choice survives a sizable forecasting error.</p>":"<p>当 P(medium) = 0.50 时，EMV(Large) = 21p − 3，EMV(Modular) = 8p + 3。两条线在 p = 6/13 ≈ 0.4615 处相交，所以以 0.01 为步长，大型枢纽在 0.47 时首次胜出。</p>\n          <p>预测值 0.30 比临界点低约 0.16，所以即使预测误差相当大，模块化的选择依然成立。</p>","Large wins only if P(high) > 0.4615; forecast 0.30":"仅当 P(high) > 0.4615 时大型胜出；预测为 0.30","Solve for the tipping point":"求解临界点","With P(high) = p, P(medium) = 0.50 and P(low) = 0.50 − p, each EMV is a straight line in p.":"设 P(high) = p，P(medium) = 0.50，P(low) = 0.50 − p，则每个 EMV 都是关于 p 的一条直线。","Fill in the algebra.":"完成代数运算。","<p>21p − 3 = 8p + 3 gives 13p = 6 and p ≈ 0.4615. Above it the Large Hub has the higher EMV; below it the Modular Hub does.</p>\n          <p>In Excel, Goal Seek finds the same point: set EMV(Large) − EMV(Modular) to 0 by changing P(high).</p>":"<p>由 21p − 3 = 8p + 3 得 13p = 6，p ≈ 0.4615。高于这个值，大型枢纽的 EMV 更高；低于这个值，模块化枢纽的 EMV 更高。</p>\n          <p>在 Excel 中，单变量求解（Goal Seek）能找到同一个点：通过改变 P(high)，把 EMV(Large) − EMV(Modular) 设为 0。</p>","EMV(Large) = 12p + 0.50 × 3 − 9(0.50 − p) = {{a}}p − 3":"EMV(Large) = 12p + 0.50 × 3 − 9(0.50 − p) = {{a}}p − 3","EMV(Modular) = 9p + 0.50 × 5 + 1(0.50 − p) = {{b}}p + 3":"EMV(Modular) = 9p + 0.50 × 5 + 1(0.50 − p) = {{b}}p + 3","the two lines are equal at p = {{p}}":"两条线在 p = {{p}} 处相等","12p + 9p = 21p. The constants: 1.5 − 4.5 = −3.":"12p + 9p = 21p。常数项：1.5 − 4.5 = −3。","Slope of the Large Hub line":"大型枢纽直线的斜率","9p − 1p = 8p. The constants: 2.5 + 0.5 = 3.":"9p − 1p = 8p。常数项：2.5 + 0.5 = 3。","Slope of the Modular Hub line":"模块化枢纽直线的斜率","Set 21p − 3 = 8p + 3. Then 13p = 6, so p = 6 ÷ 13 ≈ 0.4615.":"令 21p − 3 = 8p + 3。于是 13p = 6，所以 p = 6 ÷ 13 ≈ 0.4615。","Risk attitude":"风险态度","In class you faced a choice: a sure $400,000, or a 50/50 gamble between $0 and $1,000,000.":"课堂上你面临一个选择：稳拿 $400,000，或者参加一个 50/50 的赌局，结果为 $0 或 $1,000,000。","Which statement is correct?":"哪种说法正确？","<p>The gamble’s EMV is $500,000, so a risk-neutral decision maker takes it. A risk-averse one may accept $400,000 for certainty; the $100,000 gap is the price paid to remove the risk.</p>\n          <p>For the hubs, both views agree: Modular has the higher EMV and the better worst case, $1M against −$9M.</p>":"<p>这个赌局的 EMV 是 $500,000，所以风险中性的决策者会选择它。风险厌恶的决策者可能为了确定性而接受 $400,000；$100,000 的差额就是为消除风险付出的代价。</p>\n          <p>在枢纽问题上，两种观点一致：模块化的 EMV 更高，最坏情况也更好，$1M 对比 −$9M。</p>","The gamble has the higher EMV, but a risk-averse firm can rationally take $400,000.":"赌局的 EMV 更高，但风险厌恶的公司选择 $400,000 也是理性的。","The sure $400,000 has the higher EMV.":"稳拿的 $400,000 的 EMV 更高。","0.5 × $1,000,000 + 0.5 × $0 = $500,000, which beats $400,000 on EMV.":"0.5 × $1,000,000 + 0.5 × $0 = $500,000，在 EMV 上胜过 $400,000。","Taking $400,000 is irrational, because EMV is always the right rule.":"选择 $400,000 是不理性的，因为 EMV 永远是正确的准则。","EMV assumes risk neutrality. When a bad outcome would threaten solvency, giving up some EMV for certainty can be sensible.":"EMV 假设风险中性。当坏结果可能威胁偿付能力时，为确定性放弃一些 EMV 是明智的。","Risk attitude matters only when probabilities are unknown.":"只有在概率未知时，风险态度才重要。","Here the probabilities are known exactly. Risk attitude is about how much the spread of outcomes hurts, not about knowing the odds.":"这里的概率是确切已知的。风险态度关乎结果的分散程度让你有多难受，而不是是否知道概率。","What is a perfect forecast worth?":"完美预测值多少钱？","Imagine a forecaster who tells CloudFlow the demand state before it builds. CloudFlow would then pick the better hub in each state.":"设想有一位预测者在 CloudFlow 动工前告诉它需求状态。那么 CloudFlow 在每种状态下都会选择更好的枢纽。","Pick the best payoff in each state, then compute the value of the forecast.":"选出每种状态下的最佳收益，再计算这个预测的价值。","<p>Knowing demand first is worth at most $0.90M in expectation. That is the expected value of perfect information (EVPI), an upper bound on what any forecast or market study could add before its price.</p>\n          <p>A study that costs more than $0.90M cannot pay for itself, however good it is.</p>":"<p>提前知道需求，期望价值最多为 $0.90M。这就是完全信息期望价值（EVPI），它是任何预测或市场研究在扣除费用前所能增加价值的上限。</p>\n          <p>费用超过 $0.90M 的研究，无论多好都无法收回成本。</p>","EV with perfect information = 0.30 × {{h}} + 0.50 × {{m}} + 0.20 × {{l}} = {{ev}}":"完全信息下的 EV = 0.30 × {{h}} + 0.50 × {{m}} + 0.20 × {{l}} = {{ev}}","EVPI = EV with perfect information − 5.40 = {{evpi}}":"EVPI = 完全信息下的 EV − 5.40 = {{evpi}}","In high demand the better hub is Large: $12M.":"在高需求下，更好的枢纽是大型：$12M。","Best payoff in high demand":"高需求下的最佳收益","In medium demand Modular is better: $5M.":"在中需求下，模块化更好：$5M。","Best payoff in medium demand":"中需求下的最佳收益","In low demand Modular is better: $1M.":"在低需求下，模块化更好：$1M。","Best payoff in low demand":"低需求下的最佳收益","EV with perfect information":"完全信息下的 EV","6.30 − 5.40 = 0.90, in $ millions.":"6.30 − 5.40 = 0.90，单位为百万美元。","Expected value of perfect information":"完全信息期望价值","Profit at average demand":"平均需求下的利润","CloudFlow commits to 1,000 units of capacity at $40 each. Each unit used earns $100; each unused unit is resold for $15. Suppose demand is 600, 1,000 or 1,400 units, each with probability 1/3.":"CloudFlow 承诺投入 1,000 单位产能，每单位 $40。每个被使用的单位赚 $100；每个未使用的单位以 $15 转售。假设需求为 600、1,000 或 1,400 单位，概率各为 1/3。","Average demand is 1,000 units, which gives $60,000. Now average the three profits instead.":"平均需求是 1,000 单位，对应利润 $60,000。现在改为对三个利润求平均。","<p>Profit at average demand is $60,000, but the average profit is only $48,666.67, a gap of $11,333.33. Average inputs do not give average outputs when the formula bends.</p>\n          <p>This is the flaw of averages: E[profit(D)] ≠ profit(E[D]).</p>":"<p>平均需求下的利润是 $60,000，但平均利润只有 $48,666.67，相差 $11,333.33。当公式是弯曲的（非线性）时，平均的输入并不会给出平均的输出。</p>\n          <p>这就是平均值缺陷：E[profit(D)] ≠ profit(E[D])。</p>","profit at 600 = 100 × 600 + 15 × 400 − 40,000 = $ {{p6}}":"需求为 600 时的利润 = 100 × 600 + 15 × 400 − 40,000 = $ {{p6}}","profit at 1,400 = 100 × 1,000 + 15 × 0 − 40,000 = $ {{p14}}":"需求为 1,400 时的利润 = 100 × 1,000 + 15 × 0 − 40,000 = $ {{p14}}","expected profit = (profit at 600 + 60,000 + profit at 1,400) ÷ 3 = $ {{ev}}":"期望利润 = (600 时的利润 + 60,000 + 1,400 时的利润) ÷ 3 = $ {{ev}}","Only 600 units sell at $100. The other 400 are resold at $15: 60,000 + 6,000 − 40,000 = 26,000.":"只有 600 单位按 $100 售出。其余 400 单位按 $15 转售：60,000 + 6,000 − 40,000 = 26,000。","Profit at demand 600":"需求为 600 时的利润","Sales are capped at the 1,000 units of capacity. The extra 400 customers add nothing, so profit stays $60,000.":"销量以 1,000 单位产能为上限。多出来的 400 位客户不会带来任何收入，所以利润仍为 $60,000。","Profit at demand 1,400":"需求为 1,400 时的利润","Expected profit":"期望利润","$60,000 at average demand vs $48,667 averaged (3 states)":"平均需求下 $60,000，对比平均利润 $48,667（3 种状态）","Why the average misleads":"为什么平均值会误导","Drag demand along the profit line. Watch what happens above and below 1,000 units.":"沿着利润线拖动需求。观察高于和低于 1,000 单位时会发生什么。","Why is profit at average demand too optimistic?":"为什么平均需求下的利润过于乐观？","<p>Above 1,000 units, extra demand earns nothing because sales are capped. Below 1,000, each unused unit loses $40 − $15 = $25. Good surprises are cut off and bad ones are not, so average profit falls below profit at average demand.</p>\n          <p>The same holds with normal demand: the exact expected profit is about $51,522, about $8,478 below $60,000.</p>":"<p>高于 1,000 单位时，额外的需求赚不到钱，因为销量有上限。低于 1,000 时，每个未使用单位亏损 $40 − $15 = $25。好的意外被截断，坏的意外却没有，所以平均利润低于平均需求下的利润。</p>\n          <p>需求服从正态分布时也一样：精确的期望利润约为 $51,522，比 $60,000 低约 $8,478。</p>","Upside is capped at capacity, but each unused unit still loses $25.":"上行空间被产能封顶，但每个未使用单位仍亏损 $25。","Demand is usually below average.":"需求通常低于平均值。","Here demand is symmetric around 1,000. The bias comes from the bent profit line, not from skewed demand.":"这里的需求以 1,000 为中心对称分布。偏差来自弯曲的利润线，而不是偏斜的需求。","The average demand was computed wrongly.":"平均需求算错了。","Average demand really is 1,000. The error is plugging that average into a formula that bends.":"平均需求确实是 1,000。错误在于把这个平均值代入了一个弯曲的公式。","Random errors cancel out, so there is no real gap.":"随机误差会相互抵消，所以并不存在真正的差距。","Gains above 1,000 are cut off, while losses below are not. The two sides cannot cancel.":"高于 1,000 的收益被截断，而低于它的损失没有。两边无法相互抵消。","One trial, one row":"一次试验，一行","A simulation turns a random probability u into a demand, then into a profit. In the lab, trial 1 has u = 0.0831, and NORM.INV(0.0831, 1000, 250) gives demand of 653.82 units.":"模拟把一个随机概率 u 转换成需求，再转换成利润。在实验中，试验 1 的 u = 0.0831，NORM.INV(0.0831, 1000, 250) 给出的需求是 653.82 单位。","Finish trial 1.":"完成试验 1。","<p>Trial 1 earns about $30,575, the value your lab shows in C32. A Monte Carlo run repeats this row 1,000 times with different u values, then summarizes the profit column.</p>\n          <p>In Excel: <code>=MIN(B32,$B$9)*$B$10+MAX($B$9-B32,0)*$B$11-$B$9*$B$12</code>.</p>":"<p>试验 1 赚约 $30,575，也就是你的实验在 C32 中显示的值。一次蒙特卡洛运行会用不同的 u 值把这一行重复 1,000 次，然后汇总利润列。</p>\n          <p>在 Excel 中：<code>=MIN(B32,$B$9)*$B$10+MAX($B$9-B32,0)*$B$11-$B$9*$B$12</code>。</p>","units sold = MIN(653.82, 1,000) = 653.82":"售出单位 = MIN(653.82, 1,000) = 653.82","unused units = MAX(1,000 − 653.82, 0) = {{s}}":"未使用单位 = MAX(1,000 − 653.82, 0) = {{s}}","profit = 100 × 653.82 + 15 × unused − 40,000 = $ {{p}}":"利润 = 100 × 653.82 + 15 × 未使用单位 − 40,000 = $ {{p}}","1,000 − 653.82 = 346.18 unused units.":"1,000 − 653.82 = 346.18 个未使用单位。","Unused units":"未使用单位","65,382.07 + 5,192.69 − 40,000 ≈ 30,575. If you got 25,382, you left out the salvage.":"65,382.07 + 5,192.69 − 40,000 ≈ 30,575。如果你得到 25,382，说明漏掉了残值。","Trial 1 profit":"试验 1 的利润","Run the simulation":"运行模拟","This page runs the same model in your browser. A seed fixes the random numbers, so the same seed always gives the same run, like SET SEED in SPSS.":"本页面在你的浏览器中运行同一个模型。随机种子固定了随机数，所以同一个种子总是给出同样的结果，就像 SPSS 中的 SET SEED。","Try at least five seeds with 1,000 trials. Where does the mean profit land?":"用 1,000 次试验，至少尝试五个种子。平均利润落在哪里？","<p>Across seeds 1 to 50, the 1,000-trial mean runs from about $50,700 to $52,300, and the exact expected profit is about $51,522. About half the trials land on the $60,000 cap, so the mean can never reach it.</p>\n          <p>The lab gives everyone the same 1,000 u values, so its mean is fixed at $51,320. RAND() would change on every recalculation.</p>":"<p>在种子 1 到 50 中，1,000 次试验的均值大约在 $50,700 到 $52,300 之间，而精确的期望利润约为 $51,522。约一半的试验落在 $60,000 的上限上，所以均值永远达不到这个上限。</p>\n          <p>实验给每个人同样的 1,000 个 u 值，所以它的均值固定为 $51,320。RAND() 每次重新计算都会变化。</p>","Below $60,000 every time, by roughly $7,500 to $9,500":"每次都低于 $60,000，大约低 $7,500 到 $9,500","Above and below $60,000, about equally often":"高于和低于 $60,000 的次数大致相同","No trial can earn more than $60,000, the cap. About half the trials sit exactly at the cap and the rest fall below it.":"没有任何试验能赚超过 $60,000 这个上限。约一半的试验恰好落在上限上，其余都低于上限。","Exactly $60,000, once you find the right seed":"只要找到合适的种子，就正好是 $60,000","A seed only changes which random numbers are drawn. The cap and the salvage loss pull every run below $60,000.":"种子只改变抽到哪些随机数。上限和残值损失会把每次运行都拉到 $60,000 以下。","Mean about $51,500, not $60,000 (lab run: $51,320)":"均值约 $51,500，而不是 $60,000（实验运行：$51,320）","More trials, same risk":"试验更多，风险不变","An executive says: “Run 10,000 trials instead of 1,000. That will make the plan safer.”":"一位高管说：“跑 10,000 次试验，而不是 1,000 次。这样计划会更安全。”","Compare 1,000 and 10,000 trials across a few seeds. What does the larger run change?":"用几个种子比较 1,000 次和 10,000 次试验。更大规模的运行改变了什么？","<p>Across seeds 1 to 50, the mean spreads over about $1,500 with 1,000 trials and about $470 with 10,000. At 10,000 trials the 5th percentile stays between about $24,000 and $26,000.</p>\n          <p>More trials reduce simulation noise. They do not reduce business risk, and they cannot fix a wrong input such as the demand SD.</p>":"<p>在种子 1 到 50 中，1,000 次试验时均值的波动范围约为 $1,500，10,000 次时约为 $470。10,000 次试验时，第 5 百分位数保持在约 $24,000 到 $26,000 之间。</p>\n          <p>更多试验能减少模拟噪声。它们不能降低经营风险，也无法纠正错误的输入，比如需求的 SD。</p>","The mean wobbles less between seeds; the 5th percentile stays near $25,000.":"不同种子之间均值的波动变小；第 5 百分位数保持在 $25,000 附近。","The 5th percentile rises toward $60,000.":"第 5 百分位数向 $60,000 上升。","Watch the 5th percentile as you add trials. It settles near $25,000. More trials describe the downside better; they do not remove it.":"增加试验次数时观察第 5 百分位数。它稳定在 $25,000 附近。更多试验能更好地描述下行风险，但不能消除它。","The chance of a loss falls to zero.":"亏损的概率降到零。","The loss share settles between about 0.1% and 0.4% of trials. It belongs to the model, not to the run length.":"亏损试验的占比稳定在约 0.1% 到 0.4% 之间。它由模型决定，而不是由运行次数决定。","Nothing changes at all.":"什么都没有改变。","Something does change: with 10,000 trials the mean moves much less from seed to seed.":"确实有变化：10,000 次试验时，均值随种子的变动要小得多。","Measure the downside":"衡量下行风险","The Risk Committee cares about how often CloudFlow loses money, not only about the average.":"风险委员会关心 CloudFlow 多常亏钱，而不只是平均值。","Which pair of numbers answers the Committee best?":"哪一对数字最能回答委员会的问题？","<p>Loss probability answers “how often”: trials below $0 divided by all numeric trials. In the lab run, 4 of 1,000 trials lose money (0.4%). The 5th percentile answers “how bad”, in dollars: $25,884 in the lab run.</p>\n          <p>SD measures spread in both directions, so it is not a downside measure on its own.</p>":"<p>亏损概率回答“多常”：低于 $0 的试验数除以所有数值型试验数。在实验运行中，1,000 次试验中有 4 次亏损（0.4%）。第 5 百分位数以美元回答“有多糟”：实验运行中为 $25,884。</p>\n          <p>SD 衡量的是两个方向上的离散程度，所以它本身不是下行风险指标。</p>","Loss probability (share of trials below $0) and the 5th-percentile profit":"亏损概率（低于 $0 的试验占比）和第 5 百分位数利润","The standard deviation of profit":"利润的标准差","SD counts good surprises as risk too. It does not say how often profit falls below zero.":"SD 把好的意外也算作风险。它不能告诉你利润多常低于零。","The mean profit, about $51,500":"平均利润，约 $51,500","The mean is expected performance. It hides how bad a bad year can be.":"均值代表预期表现。它掩盖了糟糕的年份能有多糟。","The best trial, $60,000":"最好的试验，$60,000","The best case says nothing about losses.":"最好情况完全无法说明亏损。","Loss in 4 of 1,000 lab trials; 5th percentile $25,884":"实验的 1,000 次试验中有 4 次亏损；第 5 百分位数 $25,884","Write the lead for the CFO":"为 CFO 写开篇结论","The CFO wants one lead sentence for the Risk Committee memo.":"CFO 想为风险委员会备忘录写一句开篇结论。","Which lead can you defend?":"哪个开篇结论站得住脚？","<p>Each part of the lead rests on its own evidence: 35.3% against 12.0% for screening priority; $5.40M against $3.30M for the hub, robust unless P(high) passes 0.4615; and a simulated mean near $51,500 with a small loss risk for the profit plan.</p>\n          <p>The memo should also say what the evidence cannot show: that screening prevents churn, or that the model inputs are right.</p>":"<p>开篇结论的每一部分都有各自的证据：筛查优先级看 35.3% 对比 12.0%；枢纽看 $5.40M 对比 $3.30M，除非 P(high) 超过 0.4615，否则结论稳健；利润计划看约 $51,500 的模拟均值和很小的亏损风险。</p>\n          <p>备忘录还应说明证据无法证明什么：筛查能防止流失，或者模型输入是正确的。</p>","Screen flagged accounts first, build the Modular Hub, and budget below $60,000.":"优先筛查被标记账户，建造模块化枢纽，预算定在 $60,000 以下。","Treat flagged accounts as churners: 80% of them will leave.":"把被标记账户当作流失账户：其中 80% 会离开。","80% is P(flag | churn). Only 35.3% of flagged accounts churned.":"80% 是 P(flag | churn)。被标记账户中只有 35.3% 流失了。","Build the Large Hub, because its $12M payoff is the largest.":"建造大型枢纽，因为它 $12M 的收益最大。","Its EMV is $3.30M against $5.40M, and its worst case is a $9M loss.":"它的 EMV 是 $3.30M，对比 $5.40M，而且最坏情况是亏损 $9M。","Budget $60,000 profit, since average demand gives average profit.":"把利润预算定为 $60,000，因为平均需求会带来平均利润。","The cap and the salvage loss pull expected profit to about $51,500.":"上限和残值损失把期望利润拉低到约 $51,500。","Screen flagged first; Modular Hub; plan below $60,000":"优先筛查被标记账户；模块化枢纽；计划低于 $60,000","Your risk bench":"你的风险工作台","Name the condition before the denominator. EMV is an average, not an outcome. Average inputs do not give average profit when the model bends.":"先说出条件，再定分母。EMV 是平均值，不是结果。当模型弯曲时，平均的输入不会给出平均的利润。","Change the inputs and watch each answer respond. The capacity panel uses exact formulas for normal demand, not a simulation. Expected profit peaks near 1,135 units of capacity.":"改变输入，观察每个答案如何变化。产能面板使用正态需求的精确公式，而不是模拟。期望利润在产能约 1,135 单位时达到峰值。","Open this page from the class site to see the dataset.":"请从课程网站打开此页面以查看数据集。","CloudFlow accounts by flag and outcome":"按标记和结果划分的 CloudFlow 账户","Total":"合计","Flagged":"被标记","Hub payoffs in $ millions, net of capital cost":"枢纽收益（百万美元），已扣除资本成本","$ millions":"百万美元","High":"高","Medium":"中","Low":"低","Churn risk among flagged accounts by base churn rate":"不同基础流失率下被标记账户的流失风险","base churn rate, P(churn)":"基础流失率，P(churn)","P(churn | flag)":"P(churn | flag)","50%: churn as likely as renewal":"50%：流失与续约可能性相同","Flagged accounts per 1,000: churners (dark) and renewers (light).":"每 1,000 个账户中的被标记账户：流失账户（深色）和续约账户（浅色）。","churn":"流失","renew":"续约","Base churn rate":"基础流失率","Flagged churners per 1,000":"每 1,000 个中被标记的流失账户","Flagged renewers per 1,000":"每 1,000 个中被标记的续约账户","Sensitivity: churners flagged":"灵敏度：流失账户被标记的比例","False alerts: renewers flagged":"误报：续约账户被标记的比例","Decision tree: choose Large or Modular Hub, then demand is high, medium or low":"决策树：选择大型或模块化枢纽，然后需求为高、中或低","EMV of each hub as P(high) changes":"P(high) 变化时各枢纽的 EMV","P(high demand), with P(medium) fixed at 0.50":"P(high demand)，P(medium) 固定为 0.50","EMV":"EMV","forecast 0.30":"预测 0.30","Tie":"打平","P(low)":"P(low)","EMV Large":"EMV 大型","EMV Modular":"EMV 模块化","Higher EMV":"EMV 较高","P(high demand)":"P(high demand)","Profit by demand with capacity 1,000 units":"产能为 1,000 单位时各需求水平的利润","demand (units)":"需求（单位）","profit":"利润","profit at average demand: $60,000":"平均需求下的利润：$60,000","average of the three profits: $48,667":"三个利润的平均值：$48,667","Demand":"需求","units":"单位","Units sold":"售出单位","Profit":"利润","Demand in units":"需求（单位）","Histogram of simulated profit per trial":"每次试验模拟利润的直方图","profit per trial":"每次试验的利润","share of trials":"试验占比","at the $60,000 cap":"处于 $60,000 上限","mean":"均值","5th pct":"第 5 百分位","Mean profit":"平均利润","Gap below $60,000":"低于 $60,000 的差距","5th percentile":"第 5 百分位数","Trials with a loss":"亏损的试验","Trials at the cap":"处于上限的试验","Trials":"试验次数","Seed":"种子","1. Screening flag":"1. 筛查标记","Times the base rate":"基础比率的倍数","Flagged per 1,000":"每 1,000 个中被标记数","Flagged who renew":"被标记中续约的比例","2. Hub choice, P(medium) fixed at 0.50":"2. 枢纽选择，P(medium) 固定为 0.50","3. Capacity, demand normal with mean 1,000 and SD 250":"3. 产能，需求服从正态分布，均值 1,000，SD 250","Chance of a loss":"亏损概率","Chance demand fills capacity":"需求填满产能的概率","Capacity (units)":"产能（单位）","From data":"来自数据","From the model":"来自模型","Not shown":"未显示","Flagged accounts churned more than the baseline":"被标记账户的流失高于基准","35.3% vs 12.0%":"35.3% 对比 12.0%","Screening would prevent churn":"筛查能防止流失","no intervention in the data":"数据中没有干预","Modular Hub has the higher EMV":"模块化枢纽的 EMV 更高","$5.40M vs $3.30M":"$5.40M 对比 $3.30M","Large Hub wins only above the tipping point":"只有超过临界点时大型枢纽才胜出","P(high) > 0.4615; forecast 0.30":"P(high) > 0.4615；预测为 0.30","Average profit is below profit at average demand":"平均利润低于平均需求下的利润","about $51,500 vs $60,000":"约 $51,500 对比 $60,000","Evidence for the memo":"备忘录的证据","Right call.":"判断正确。","Right call. Your gut call at the start was “{call}”. The data say 35.3%: 96 of 272 flagged accounts churned.":"判断正确。你一开始的直觉判断是“{call}”。数据显示是 35.3%：272 个被标记账户中有 96 个流失。","Lesson complete":"课程完成","You earned {pts} points: {firsts} first-try answers across {graded} questions.":"你获得了 {pts} 分：{graded} 道题中有 {firsts} 道一次答对。","Your evidence file stays in the case panel. Use Back or the part bar to revisit any screen before the midterm on October 21.":"你的证据档案会保留在案例面板中。在 10 月 21 日期中考试之前，你可以用“返回”或部分导航栏重新查看任意一屏。","Found it. At 21%, churners just outnumber renewers in the flagged pile.":"找到了。在 21% 时，被标记账户中的流失账户刚好多于续约账户。","Very close. At 20%, the flag catches 160 churners and 160 renewers per 1,000: a tie. Go one step higher.":"非常接近。在 20% 时，每 1,000 个账户中标记会抓到 160 个流失账户和 160 个续约账户：打平。再往上调一格。","Flagged renewers still outnumber flagged churners. Raise the base rate.":"被标记的续约账户仍然多于被标记的流失账户。提高基础比率。","Churn is more likely here, but a lower base rate also works. Find the smallest.":"这里流失的可能性更大，但更低的基础比率也可以。找出最小的那个。","Right. At 0.47 the Large Hub leads, $6.87M to $6.76M.":"对。在 0.47 时大型枢纽领先，$6.87M 对 $6.76M。","Very close. At 0.46 Modular still leads, $6.68M to $6.66M. Go one step higher.":"非常接近。在 0.46 时模块化仍然领先，$6.68M 对 $6.66M。再往上调一格。","Modular still has the higher EMV here. Raise P(high).":"这里模块化的 EMV 仍然更高。提高 P(high)。","Large wins here, but it already wins at a lower value. Find the first step.":"这里大型胜出，但在更低的值时它就已经胜出了。找出第一个胜出的点。"},"es":{"CloudFlow Under Uncertainty":"CloudFlow ante la incertidumbre","GC1015 · Session 4 · Conditional risk, expected value, simulation":"GC1015 · Sesión 4 · Riesgo condicional, valor esperado, simulación","Finish":"Terminar","Evidence so far":"Evidencia hasta ahora","Conditional risk and Bayes":"Riesgo condicional y Bayes","Expected value and payoff tables":"Valor esperado y tablas de pagos","Monte Carlo simulation":"Simulación Monte Carlo","Case file: CloudFlow Analytics":"Expediente del caso: CloudFlow Analytics","Fictional business software company. The CFO needs three answers for the Risk Committee: should we screen high-ticket accounts, which hub should we build, and is the profit plan too optimistic?":"Empresa ficticia de software para empresas. El CFO necesita tres respuestas para el Comité de Riesgos: si conviene revisar las cuentas con muchos tickets, qué hub construir y si el plan de ganancias es demasiado optimista.","Lab file <code>cloudflow_churn_cohort.csv</code>: one row per account, 1,000 rows, with Churn and HighTickets coded Yes or No.":"Archivo del laboratorio <code>cloudflow_churn_cohort.csv</code>: una fila por cuenta, 1,000 filas, con Churn y HighTickets codificados como Yes o No.","Hub payoff, $ millions":"Pago por hub, millones de $","High 0.30":"Alta 0.30","Medium 0.50":"Media 0.50","Low 0.20":"Baja 0.20","Large Hub":"Hub Grande","Modular Hub":"Hub Modular","Payoffs are net of the capital cost. The slides show a version with Large Hub payoffs 13, 2 and −8. Both versions give the same EMVs and the same tipping point.":"Los pagos son netos del costo de capital. Las diapositivas muestran una versión con pagos del Hub Grande de 13, 2 y −8. Ambas versiones dan los mismos EMV y el mismo punto de quiebre.","Capacity model: 1,000 units of capacity at $40 per unit, $100 per unit sold, $15 for each unused unit. Demand is normal with mean 1,000 and SD 250.":"Modelo de capacidad: 1,000 unidades de capacidad a $40 por unidad, $100 por unidad vendida, $15 por cada unidad sin usar. La demanda es normal, con media 1,000 y SD 250.","Toolkit note: the linked toolkit practices the same methods on a different fictional case, Embercup’s rain alert. Use it for the methods and this case file for CloudFlow’s numbers.":"Nota sobre el toolkit: el toolkit enlazado practica los mismos métodos con otro caso ficticio, la alerta de lluvia de Embercup. Úsalo para los métodos y este expediente para los números de CloudFlow.","Cohort counts":"Conteos de la cohorte","Set on screen 2":"Se definen en la pantalla 2","Baseline churn":"Abandono de referencia","Churn among flagged accounts":"Abandono entre cuentas marcadas","The “80%”":"El “80%”","Screening claim":"Afirmación sobre la revisión","Hub EMVs":"EMV de los hubs","Tipping point":"Punto de quiebre","Flaw of averages":"Falacia de los promedios","Simulated profit":"Ganancia simulada","Downside":"Riesgo a la baja","Lead for the CFO":"Frase inicial para el CFO","Is a flagged account about to leave?":"¿Está a punto de irse una cuenta marcada?","Your gut call, before any math: of all flagged accounts, what share churn?":"Tu intuición, antes de hacer cuentas: de todas las cuentas marcadas, ¿qué proporción abandona?","CloudFlow Analytics, a fictional software company, sells to other businesses. Its CFO must answer three questions for the Risk Committee.":"CloudFlow Analytics, una empresa ficticia de software, vende a otras empresas. Su CFO debe responder tres preguntas para el Comité de Riesgos.","The first one: Customer Success flags accounts with heavy support-ticket volume. Someone told the CFO that flagged accounts churn “80%” of the time.":"La primera: Éxito del Cliente marca las cuentas con mucho volumen de tickets de soporte. Alguien le dijo al CFO que las cuentas marcadas abandonan el “80%” de las veces.","Noted. You will check this against the data in a few screens.":"Anotado. Lo comprobarás con los datos dentro de unas pantallas.","About 80%":"Alrededor del 80%","About 50%":"Alrededor del 50%","About 35%":"Alrededor del 35%","About 12%":"Alrededor del 12%","Count before you calculate":"Cuenta antes de calcular","Last year CloudFlow tracked 1,000 accounts. Each row of the lab file is one account: did it churn, and was it flagged for high tickets?":"El año pasado CloudFlow siguió 1,000 cuentas. Cada fila del archivo del laboratorio es una cuenta: ¿abandonó? ¿Se marcó por tener muchos tickets?","Use the filters. Count the flagged accounts, the flagged accounts that churned, and all churned accounts.":"Usa los filtros. Cuenta las cuentas marcadas, las cuentas marcadas que abandonaron y todas las cuentas que abandonaron.","<p>272 accounts were flagged, 96 of them churned, and 120 accounts churned in total. Every probability in this part comes from these counts and the total of 1,000.</p>\n          <p>In Excel: <code>=COUNTIFS(Cohort[HighTickets],\"Yes\",Cohort[Churn],\"Yes\")</code> returns 96.</p>":"<p>Se marcaron 272 cuentas, 96 de ellas abandonaron, y en total abandonaron 120 cuentas. Todas las probabilidades de esta parte salen de estos conteos y del total de 1,000.</p>\n          <p>En Excel: <code>=COUNTIFS(Cohort[HighTickets],\"Yes\",Cohort[Churn],\"Yes\")</code> devuelve 96.</p>","flagged (HighTickets = Yes) = {{h}}":"marcadas (HighTickets = Yes) = {{h}}","flagged and churned (HighTickets = Yes, Churn = Yes) = {{hc}}":"marcadas que abandonaron (HighTickets = Yes, Churn = Yes) = {{hc}}","all churned (Churn = Yes) = {{c}}":"todas las que abandonaron (Churn = Yes) = {{c}}","Set HighTickets to Yes and leave Churn on (Any). Read the row count.":"Pon HighTickets en Yes y deja Churn en (Any). Lee el número de filas.","Flagged accounts":"Cuentas marcadas","Keep HighTickets = Yes and set Churn = Yes.":"Mantén HighTickets = Yes y pon Churn = Yes.","Flagged and churned":"Marcadas que abandonaron","Set HighTickets back to (Any) and Churn to Yes.":"Vuelve a poner HighTickets en (Any) y Churn en Yes.","All churned":"Todas las que abandonaron","1,000 accounts; 272 flagged; 120 churned; 96 both":"1,000 cuentas; 272 marcadas; 120 abandonaron; 96 ambas cosas","Build the two-way table":"Construye la tabla de contingencia","You now know four facts: 1,000 accounts, 120 churned, 272 flagged, and 96 both flagged and churned.":"Ya conoces cuatro datos: 1,000 cuentas, 120 abandonaron, 272 marcadas y 96 marcadas que además abandonaron.","Drag a count into each cell. Two tiles are totals, not cells.":"Arrastra un conteo a cada celda. Dos fichas son totales, no celdas.","<p>Inside cells are joint counts; row and column totals are marginal counts. Flagged: 96 + 176 = 272. Churned: 96 + 24 = 120. All four cells add to 1,000.</p>":"<p>Las celdas interiores son conteos conjuntos; los totales de filas y columnas son conteos marginales. Marcadas: 96 + 176 = 272. Abandonaron: 96 + 24 = 120. Las cuatro celdas suman 1,000.</p>","Flag ↓   Outcome →":"Alerta ↓   Resultado →","Flagged (high tickets)":"Marcadas (muchos tickets)","Not flagged":"No marcadas","Churned":"Abandonaron","Renewed":"Renovaron","120 is the total of the Churned column, a margin. The cells split it: 96 flagged plus 24 not flagged.":"120 es el total de la columna Abandonaron, un margen. Las celdas lo reparten: 96 marcadas más 24 no marcadas.","272 is the total of the Flagged row. The cells split it: 96 churned plus 176 renewed.":"272 es el total de la fila Marcadas. Las celdas lo reparten: 96 abandonaron más 176 renovaron.","96 accounts were both flagged and churned. That is the Flagged, Churned cell.":"96 cuentas fueron marcadas y abandonaron. Esa es la celda Marcadas, Abandonaron.","176 = 272 − 96: flagged accounts that renewed.":"176 = 272 − 96: cuentas marcadas que renovaron.","24 = 120 − 96: churned accounts that were not flagged.":"24 = 120 − 96: cuentas que abandonaron sin estar marcadas.","704 = 1,000 − 272 − 24: accounts that were neither flagged nor churned.":"704 = 1,000 − 272 − 24: cuentas que ni fueron marcadas ni abandonaron.","Marginal, joint and either":"Marginal, conjunta y “o”","When a question is about everyone, divide by all 1,000 accounts.":"Cuando la pregunta trata de todas las cuentas, divide entre las 1,000.","Write each probability as a decimal.":"Escribe cada probabilidad como decimal.","<p>Baseline churn is 12.0%. 27.2% of accounts were flagged, and 9.6% were both. 29.6% churned, were flagged, or both.</p>\n          <p>The addition rule subtracts the overlap because the 96 accounts sit in both the churn total and the flag total.</p>":"<p>El abandono de referencia es 12.0%. El 27.2% de las cuentas fue marcado y el 9.6% cumplió ambas cosas. El 29.6% abandonó, fue marcado o ambas cosas.</p>\n          <p>La regla de la suma resta la intersección porque las 96 cuentas están tanto en el total de abandono como en el total de marcadas.</p>","P(churn) = 120 / 1,000 = {{pc}}":"P(churn) = 120 / 1,000 = {{pc}}","P(flagged) = 272 / 1,000 = {{ph}}":"P(flagged) = 272 / 1,000 = {{ph}}","P(churn and flagged) = 96 / 1,000 = {{pch}}":"P(churn and flagged) = 96 / 1,000 = {{pch}}","P(churn or flagged) = P(churn) + P(flagged) − P(both) = {{pu}}":"P(churn or flagged) = P(churn) + P(flagged) − P(both) = {{pu}}","120 ÷ 1,000 = 0.12, the baseline churn rate.":"120 ÷ 1,000 = 0.12, la tasa de abandono de referencia.","P(churn)":"P(churn)","P(flagged)":"P(flagged)","Both events together: 96 ÷ 1,000 = 0.096.":"Ambos eventos a la vez: 96 ÷ 1,000 = 0.096.","P(churn and flagged)":"P(churn and flagged)","Subtract the overlap once: 0.12 + 0.272 − 0.096 = 0.296. Without it you get 0.392 and count 96 accounts twice.":"Resta la intersección una vez: 0.12 + 0.272 − 0.096 = 0.296. Sin restarla obtienes 0.392 y cuentas dos veces 96 cuentas.","P(churn or flagged)":"P(churn or flagged)","P(churn) = 12.0% (120 of 1,000)":"P(churn) = 12.0% (120 de 1,000)","Pick the right denominator":"Elige el denominador correcto","The CFO asks: of the accounts we flag, what share churn?":"El CFO pregunta: de las cuentas que marcamos, ¿qué proporción abandona?","Which count belongs in the denominator?":"¿Qué conteo va en el denominador?","<p>“Of the accounts we flag” limits the question to the flagged row. Its total, 272, becomes the denominator. Name the condition first, then pick the denominator.</p>":"<p>“De las cuentas que marcamos” limita la pregunta a la fila de marcadas. Su total, 272, pasa a ser el denominador. Primero nombra la condición y luego elige el denominador.</p>","272, all flagged accounts":"272, todas las cuentas marcadas","120, all churned accounts":"120, todas las cuentas que abandonaron","Dividing by churners answers a different question: what share of churners were flagged. That is 80%.":"Dividir entre las que abandonaron responde otra pregunta: qué proporción de ellas estaba marcada. Eso es el 80%.","1,000, all accounts":"1,000, todas las cuentas","Dividing by everyone gives the joint probability, 9.6%. The question is only about flagged accounts.":"Dividir entre todas da la probabilidad conjunta, 9.6%. La pregunta trata solo de las cuentas marcadas.","Two conditional probabilities":"Dos probabilidades condicionales","Same numerator, 96 accounts, but two different groups.":"El mismo numerador, 96 cuentas, pero dos grupos disti

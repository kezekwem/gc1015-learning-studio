s elegibles en el marco (cuatro semanas)","Selected and invited":"Seleccionadas e invitadas","Usable confirmations":"Confirmaciones válidas","Slow (over 50 minutes)":"Lentas (más de 50 minutos)","Mean pickup time":"Tiempo medio de recogida","42 min":"42 min","Standard deviation":"Desviación estándar","12 min":"12 min","Decision: add permanent evening staff now, or audit and run a bounded pilot first.":"Decisión: sumar ahora personal permanente en el turno de la tarde, o auditar y hacer primero un piloto acotado.","Guardrail: a pilot must stay within the approved labor cost per pickup.":"Salvaguarda: un piloto debe mantenerse dentro del costo laboral aprobado por recogida.","Lab file: cedar_loop_pickups.csv, one row per pickup ID.":"Archivo del laboratorio: cedar_loop_pickups.csv, una fila por cada ID de recogida.","Who answered":"Quién respondió","Count on screen 2":"Cuenta en la pantalla 2","Sampling distribution":"Distribución muestral","SE of the mean time":"SE del tiempo medio","SE of the slow share":"SE de la proporción de recogidas lentas","Nonresponse bounds":"Límites por no respuesta","95% interval, mean time":"Intervalo del 95%, tiempo medio","95% interval, slow share":"Intervalo del 95%, proporción de recogidas lentas","Next audit plan":"Plan de la próxima auditoría","Recommendation":"Recomendación","Is Cedar Loop too slow?":"¿Es Cedar Loop demasiado lento?","Your gut call, before any math: should Cedar Loop add permanent evening staff now?":"Tu intuición, antes de cualquier cálculo: ¿debería Cedar Loop sumar ahora personal permanente en el turno de la tarde?","Cedar Loop is a fictional grocery pickup service. Its manager wants at most 20% of pickups to take more than 50 minutes, from the order-ready message to handoff.":"Cedar Loop es un servicio ficticio de recogida de compras de supermercado. Su gerente quiere que como máximo el 20% de las recogidas tarde más de 50 minutos, desde el mensaje de pedido listo hasta la entrega.","An audit selected 125 of the 2,400 pickups from a four-week period. 100 customers confirmed their records, and 24 of those pickups were slow.":"Una auditoría seleccionó 125 de las 2,400 recogidas de un periodo de cuatro semanas. 100 clientes confirmaron sus registros, y 24 de esas recogidas fueron lentas.","Noted. We will check your call against the evidence at the end.":"Anotado. Al final compararemos tu respuesta con la evidencia.","Yes, add permanent evening staff now":"Sí, sumar ahora personal permanente en el turno de la tarde","No, keep staffing as it is":"No, mantener el personal como está","I need more information first":"Primero necesito más información","Count before you calculate":"Cuenta antes de calcular","This is the lab file, <code>cedar_loop_pickups.csv</code>: one row for each of the 2,400 pickup IDs in the frame. A blank cell means no observed outcome. It is not a zero.":"Este es el archivo del laboratorio, <code>cedar_loop_pickups.csv</code>: una fila por cada uno de los 2,400 ID de recogida del marco. Una celda en blanco significa que no hay un resultado observado. No es un cero.","Use the filters to count the rows.":"Usa los filtros para contar las filas.","<p>125 pickups were invited, 100 gave usable confirmations, and 24 of those were slow. So the usable-response rate is 100 / 125 = 80%, and the respondent share is 24 / 100 = 24%.</p>\n          <p>The other 2,275 rows were never invited. Their blank flags do not mean \"on time\". Those pickups were simply not in the sample.</p>":"<p>Se invitó a 125 recogidas, 100 dieron confirmaciones válidas y 24 de ellas fueron lentas. Así, la tasa de respuestas válidas es 100 / 125 = 80%, y la proporción de recogidas lentas entre los respondientes es 24 / 100 = 24%.</p>\n          <p>Las otras 2,275 filas nunca fueron invitadas. Sus indicadores en blanco no significan \"a tiempo\". Esas recogidas simplemente no estaban en la muestra.</p>","invited pickups = responded + nonresponse = {{inv}}":"recogidas invitadas = responded + nonresponse = {{inv}}","usable responses (responded) = {{resp}}":"respuestas válidas (responded) = {{resp}}","slow responses (responded, delay_flag = 1) = {{slow}}":"respuestas lentas (responded, delay_flag = 1) = {{slow}}","Filter invitation_status to responded (100 rows), then to nonresponse (25 rows), and add them.":"Filtra invitation_status por responded (100 filas), luego por nonresponse (25 filas), y súmalas.","Invited pickups":"Recogidas invitadas","Set invitation_status to responded and read the row count.":"Pon invitation_status en responded y lee el número de filas.","Usable responses":"Respuestas válidas","Keep invitation_status = responded and set delay_flag = 1.":"Mantén invitation_status = responded y pon delay_flag = 1.","Slow responses":"Respuestas lentas","125 invited, 100 usable (80%), 24 slow":"125 invitadas, 100 válidas (80%), 24 lentas","Name the population first":"Primero nombra la población","Before any formula, say whom the number is about. The manager’s question is about eligible pickups in this four-week period.":"Antes de cualquier fórmula, di a qué se refiere el número. La pregunta del gerente es sobre las recogidas elegibles de este periodo de cuatro semanas.","Drag each description to its term. Two tiles do not belong anywhere.":"Arrastra cada descripción a su término. Dos fichas no van en ningún lugar.","<p>The <b>population</b> is every eligible pickup in the period. The <b>frame</b> is the list you can actually draw from, so audit it: no duplicate IDs, no canceled orders. The <b>parameter</b> p is fixed but unknown. The <b>statistic</b> p̂ = 0.24 estimates it, and a different sample would give a different p̂.</p>\n          <p>\"All future customers\" is a broader population than this four-week list. These data cannot speak for it without more assumptions.</p>":"<p>La <b>población</b> son todas las recogidas elegibles del periodo. El <b>marco</b> es la lista de la que realmente puedes extraer, así que audítalo: sin ID duplicados, sin pedidos cancelados. El <b>parámetro</b> p es fijo pero desconocido. El <b>estadístico</b> p̂ = 0.24 lo estima, y otra muestra daría un p̂ distinto.</p>\n          <p>\"Todos los clientes futuros\" es una población más amplia que esta lista de cuatro semanas. Estos datos no pueden hablar por ella sin más supuestos.</p>","p̂ = 24 / 100 = 0.24, from the usable responses":"p̂ = 24 / 100 = 0.24, a partir de las respuestas válidas","All future Cedar Loop customers":"Todos los clientes futuros de Cedar Loop","All 2,400 eligible pickups in the four weeks":"Las 2,400 recogidas elegibles de las cuatro semanas","p, the true slow share of those 2,400 pickups":"p, la verdadera proporción de recogidas lentas entre esas 2,400","The 24 slow pickups":"Las 24 recogidas lentas","The deduplicated list of 2,400 pickup IDs":"La lista sin duplicados de 2,400 ID de recogida","Population":"Población","Sampling frame":"Marco muestral","Parameter<br><small>fixed, unknown</small>":"Parámetro<br><small>fijo, desconocido</small>","Statistic<br><small>changes from sample to sample</small>":"Estadístico<br><small>cambia de una muestra a otra</small>","That group is broader than the question. The audit covers eligible pickups in the four-week period only.":"Ese grupo es más amplio que la pregunta. La auditoría cubre solo las recogidas elegibles del periodo de cuatro semanas.","That is a count inside the sample. A statistic is a summary of the sample, such as the share 24 / 100.":"Eso es un conteo dentro de la muestra. Un estadístico es un resumen de la muestra, como la proporción 24 / 100.","p is the population value. It is fixed but unknown. The sample gives an estimate of it, p̂.":"p es el valor de la población. Es fijo pero desconocido. La muestra da una estimación de él, p̂.","p̂ comes from one sample, so another sample would give a different value. The parameter does not change.":"p̂ viene de una sola muestra, así que otra muestra daría un valor distinto. El parámetro no cambia.","The frame is the list you can draw from. The population is the pickups themselves.":"El marco es la lista de la que puedes extraer. La población son las recogidas mismas.","The frame is the actual list of IDs. You audit it for duplicates and canceled orders.":"El marco es la lista real de ID. Lo auditas en busca de duplicados y pedidos cancelados.","The Monday morning shortcut":"El atajo del lunes por la mañana","To save time, a supervisor suggests auditing the first 125 pickups from Monday morning instead.":"Para ahorrar tiempo, un supervisor sugiere auditar en su lugar las primeras 125 recogidas del lunes por la mañana.","What kind of selection is that, and can a confidence interval fix it?":"¿Qué tipo de selección es esa, y puede un intervalo de confianza corregirla?","<p>Taking the first 125 records from one morning is a convenience selection, not a probability design. Evening pickups, the very ones the manager worries about, could never be chosen.</p>\n          <p>An interval built from those 125 describes chance variation under assumptions they do not meet. It cannot repair the missing periods.</p>":"<p>Tomar los primeros 125 registros de una mañana es una selección por conveniencia, no un diseño probabilístico. Las recogidas de la tarde, justo las que preocupan al gerente, nunca podrían ser elegidas.</p>\n          <p>Un intervalo construido con esas 125 describe la variación por azar bajo supuestos que no cumplen. No puede reparar los periodos que faltan.</p>","Convenience selection. It misses other times, and no interval can repair that.":"Selección por conveniencia. Deja fuera otros horarios, y ningún intervalo puede reparar eso.","Simple random, because every pickup on the list could be chosen.":"Muestreo aleatorio simple, porque cualquier recogida de la lista podría ser elegida.","Evening and other-day pickups had no chance at all. Probability sampling needs a known, non-zero chance for every unit in the frame.":"Las recogidas de la tarde y de otros días no tenían ninguna probabilidad. El muestreo probabilístico necesita una probabilidad conocida y distinta de cero para cada unidad del marco.","Systematic, because Monday orders arrive in time order.":"Muestreo sistemático, porque los pedidos del lunes llegan en orden cronológico.","A systematic sample starts at a random point and steps through the whole list, for example every 20th ID.":"Un muestreo sistemático empieza en un punto aleatorio y avanza a pasos fijos por toda la lista, por ejemplo un ID de cada 20.","Fine, as long as the interval is narrow.":"Está bien, siempre que el intervalo sea estrecho.","A narrow interval only measures chance variation around those 125 pickups. It cannot add the periods that were left out.":"Un intervalo estrecho solo mide la variación por azar en torno a esas 125 recogidas. No puede agregar los periodos que quedaron fuera.","Freeze the random draw":"Congela el sorteo aleatorio","Ana sorted the frame by <code>=RAND()</code>, kept the first IDs and saved the file. The next day, the selected IDs had changed.":"Ana ordenó el marco por <code>=RAND()</code>, se quedó con los primeros ID y guardó el archivo. Al día siguiente, los ID seleccionados habían cambiado.","Try the mini frame above. What should Ana have done?":"Prueba el minimarco de arriba. ¿Qué debió hacer Ana?","<p>Add <code>=RAND()</code> beside each unique ID, calculate once, and paste that column <b>as values</b>. Then sort, keep the first 125, and save the frozen numbers, the selected IDs, the frame date and the draw date.</p>\n          <p>Reopening the saved file then reproduces exactly which IDs were selected. Also check that there are exactly 125 distinct IDs and that each one is in the frame.</p>":"<p>Agrega <code>=RAND()</code> junto a cada ID único, calcula una vez y pega esa columna <b>como valores</b>. Luego ordena, quédate con los primeros 125 y guarda los números congelados, los ID seleccionados, la fecha del marco y la fecha del sorteo.</p>\n          <p>Así, al volver a abrir el archivo guardado se reproduce exactamente qué ID se seleccionaron. Verifica también que haya exactamente 125 ID distintos y que cada uno esté en el marco.</p>","Paste the RAND column as values before sorting, then save the list":"Pegar la columna RAND como valores antes de ordenar, y luego guardar la lista","Sort again until the same IDs come back":"Ordenar otra vez hasta que vuelvan los mismos ID","RAND() makes new numbers every time the sheet recalculates. The old draw cannot be found again.":"RAND() genera números nuevos cada vez que la hoja se recalcula. El sorteo anterior no se puede recuperar.","Keep the first IDs in the original frame order instead":"Quedarse en cambio con los primeros ID en el orden original del marco","Then the list order decides who is selected. That is not random selection.":"Entonces el orden de la lista decide qué ID quedan seleccionados. Eso no es selección aleatoria.","Use RANDBETWEEN, which does not recalculate":"Usar RANDBETWEEN, que no se recalcula","RANDBETWEEN also recalculates. Only numbers pasted as values stay fixed.":"RANDBETWEEN también se recalcula. Solo los números pegados como valores se quedan fijos.","Make sure evenings are in":"Asegúrate de incluir las tardes","Suppose the audited frame holds 1,440 morning and 960 evening pickups. The manager worries about evenings, so you split the frame by period and draw randomly within each one.":"Supón que el marco auditado tiene 1,440 recogidas de la mañana y 960 de la tarde. Al gerente le preocupan las tardes, así que divides el marco por periodo y extraes al azar dentro de cada uno.","Allocate the 125 invitations in proportion to each period.":"Reparte las 125 invitaciones en proporción a cada periodo.","<p>This is a <b>stratified</b> design: random draws within each period, so both periods are sure to appear. Combine the results using each period’s share of the population.</p>\n          <p>It protects evening representation at the invitation stage. It does not make the eventual responses representative if one period answers less often. For comparison, a systematic draw of every 20th ID gives 2,400 / 20 = 120 IDs, not 125.</p>":"<p>Este es un diseño <b>estratificado</b>: extracciones aleatorias dentro de cada periodo, así que ambos periodos aparecen con seguridad. Combina los resultados usando la proporción de la población que corresponde a cada periodo.</p>\n          <p>Protege la representación de la tarde en la etapa de invitación. No hace representativas las respuestas finales si un periodo responde con menos frecuencia. Para comparar, una extracción sistemática de un ID de cada 20 da 2,400 / 20 = 120 ID, no 125.</p>","morning share = 1,440 / 2,400 = {{ms}}":"proporción de la mañana = 1,440 / 2,400 = {{ms}}","morning invitations = 0.60 × 125 = {{m}}":"invitaciones de la mañana = 0.60 × 125 = {{m}}","evening invitations = 0.40 × 125 = {{e}}":"invitaciones de la tarde = 0.40 × 125 = {{e}}","Morning share":"Proporción de la mañana","Morning invitations":"Invitaciones de la mañana","0.40 × 125 = 50. Check: 75 + 50 = 125.":"0.40 × 125 = 50. Comprueba: 75 + 50 = 125.","Evening invitations":"Invitaciones de la tarde","Watch sample means pile up":"Mira cómo se acumulan las medias muestrales","Only a simulation can show a whole population. This one imagines pickup times with a long right tail, a mean of 42 minutes and an SD of 12, like the sample.":"Solo una simulación puede mostrar una población completa. Esta imagina tiempos de recogida con una cola larga a la derecha, una media de 42 minutos y una SD de 12, como la muestra.","Draw 100 samples at n = 1, then switch to n = 100 and draw again. What happens to the histogram of sample means?":"Extrae 100 muestras con n = 1, luego cambia a n = 100 y vuelve a extraer. ¿Qué le pasa al histograma de las medias muestrales?","The population is imagined for the simulation. In real work you see one sample and never the whole population.":"La población es imaginaria, creada para la simulación. En el trabajo real ves una sola muestra y nunca la población completa.","<p>Each sample gives one mean. The pattern of those means across many samples is the <b>sampling distribution</b>. By the <b>central limit theorem</b>, it gets close to a normal bell as n grows, even when single pickup times are skewed.</p>\n          <p>Its spread is the <b>standard error</b>, 12 / √n: 12 at n = 1, 6 at n = 4, 2.4 at n = 25 and 1.2 at n = 100. The CLT does not remove selection bias, and it does not make related records independent.</p>":"<p>Cada muestra da una media. El patrón de esas medias a lo largo de muchas muestras es la <b>distribución muestral</b>. Por el <b>teorema central del límite</b>, se acerca a una campana normal a medida que n crece, incluso cuando los tiempos de recogida individuales son asimétricos.</p>\n          <p>Su dispersión es el <b>error estándar</b>, 12 / √n: 12 con n = 1, 6 con n = 4, 2.4 con n = 25 y 1.2 con n = 100. El teorema central del límite no elimina el sesgo de selección, y no vuelve independientes los registros relacionados.</p>","It becomes a narrow bell centered near 42 minutes":"Se vuelve una campana estrecha centrada cerca de 42 minutos","It keeps the long right tail of the pickup times":"Conserva la cola larga a la derecha de los tiempos de recogida","That is true at n = 1, where each \"mean\" is a single pickup. At n = 100 the tail disappears. Draw again and compare.":"Eso es cierto con n = 1, donde cada \"media\" es una sola recogida. Con n = 100 la cola desaparece. Vuelve a extraer y compara.","It spreads out more, because more pickups add more variation":"Se dispersa más, porque más recogidas agregan más variación","Watch the SD of the means in the readout. It shrinks as n grows: about 12 at n = 1 and about 1.2 at n = 100.":"Observa la SD de las medias en el indicador. Se reduce a medida que n crece: cerca de 12 con n = 1 y cerca de 1.2 con n = 100.","It shifts right, toward the slow pickups":"Se desplaza a la derecha, hacia las recogidas lentas","The center stays near 42 at every n. Only the spread and the shape change.":"El centro se mantiene cerca de 42 para cualquier n. Solo cambian la dispersión y la forma.","Means form a bell near 42; spread 12 / √n":"Las medias forman una campana cerca de 42; dispersión 12 / √n","Two kinds of spread":"Dos tipos de dispersión","Cedar Loop’s 100 usable pickup times have a standard deviation of 12 minutes. The standard error of their mean is 1.20 minutes.":"Los 100 tiempos de recogida válidos de Cedar Loop tienen una desviación estándar de 12 minutos. El error estándar de su media es 1.20 minutos.","Drag each tile into the matching cell.":"Arrastra cada ficha a la celda que le corresponde.","<p>The <b>standard deviation</b>, 12 minutes, describes how single pickups vary around 42 minutes. The <b>standard error</b>, 1.20 minutes, describes the estimate: how much the mean of 100 pickups would move between comparable samples.</p>\n          <p>Four times the sample halves the SE: 12 / √400 = 0.60 minutes. The SD stays near 12, because pickups do not become more alike.</p>":"<p>La <b>desviación estándar</b>, 12 minutos, describe cuánto varían las recogidas individuales alrededor de 42 minutos. El <b>error estándar</b>, 1.20 minutos, describe la estimación: cuánto se movería la media de 100 recogidas entre muestras comparables.</p>\n          <p>Una muestra cuatro veces mayor reduce el SE a la mitad: 12 / √400 = 0.60 minutos. La SD se mantiene cerca de 12, porque las recogidas no se vuelven más parecidas.</p>","How much the sample mean moves from sample to sample":"Cuánto se mueve la media muestral de una muestra a otra","Stays near 12 minutes":"Se mantiene cerca de 12 minutos","How much single pickup times vary":"Cuánto varían los tiempos de recogida individuales","Halves, to 0.60 minutes":"Se reduce a la mitad, a 0.60 minutos","Measure ↓   Question →":"Medida ↓   Pregunta →","s = 12 minutes<br><small>standard deviation</small>":"s = 12 minutos<br><small>desviación estándar</small>","SE = 1.20 minutes<br><small>standard error of the mean</small>":"SE = 1.20 minutos<br><small>error estándar de la media</small>","What does it describe?":"¿Qué describe?","If n grew from 100 to 400?":"¿Y si n pasara de 100 a 400?","Single pickups vary by about 12 minutes. The SE is about the mean, which varies much less.":"Las recogidas individuales varían unos 12 minutos. El SE se refiere a la media, que varía mucho menos.","The SD describes single pickups. The sample-to-sample movement of the mean is the SE.":"La SD describe las recogidas individuales. El movimiento de la media de una muestra a otra es el SE.","More data does not make single pickups less variable, but it does make the mean steadier. So the SE shrinks.":"Más datos no hacen que las recogidas individuales varíen menos, pero sí hacen más estable la media. Por eso el SE se reduce.","The SD estimates how much pickup times vary. More data estimates that spread better, but it does not shrink it.":"La SD estima cuánto varían los tiempos de recogida. Más datos estiman mejor esa dispersión, pero no la reducen.","Compute the standard error":"Calcula el error estándar","100 usable pickup times, with sample SD s = 12 minutes. For a mean, SE = s / √n.":"100 tiempos de recogida válidos, con SD muestral s = 12 minutos. Para una media, SE = s / √n.","Fill in both lines.":"Completa ambas líneas.","<p>SE = 12 / √100 = 1.20 minutes. Dividing by n instead of √n gives 0.12 minutes and claims ten times too much precision.</p>\n          <p>At n = 400, SE = 0.60: four times the sample, half the SE. That assumes 400 truly separate pickups. Copying the 100 rows four times would not count. In Excel: <code>=E4/SQRT(E2)</code>.</p>":"<p>SE = 12 / √100 = 1.20 minutos. Dividir entre n en vez de √n da 0.12 minutos y afirma diez veces más precisión de la real.</p>\n          <p>Con n = 400, SE = 0.60: cuatro veces la muestra, la mitad del SE. Eso supone 400 recogidas realmente distintas. Copiar las 100 filas cuatro veces no contaría. En Excel: <code>=E4/SQRT(E2)</code>.</p>","SE = 12 / √100 = 12 / {{root}} = {{se}} minutes":"SE = 12 / √100 = 12 / {{root}} = {{se}} minutos","with 400 comparable pickups: SE = 12 / √400 = {{se4}} minutes":"con 400 recogidas comparables: SE = 12 / √400 = {{se4}} minutos","√100 = 10, because 10 × 10 = 100.":"√100 = 10, porque 10 × 10 = 100.","Square root of 100":"Raíz cuadrada de 100","12 ÷ 10 = 1.20. If you got 0.12, you divided by n instead of √n.":"12 ÷ 10 = 1.20. Si obtuviste 0.12, dividiste entre n en vez de √n.","Standard error":"Error estándar","√400 = 20, so 12 ÷ 20 = 0.60.":"√400 = 20, así que 12 ÷ 20 = 0.60.","Standard error at n = 400":"Error estándar con n = 400","12 / √100 = 1.20 min":"12 / √100 = 1.20 min","Precision costs √n":"La precisión cuesta √n","Keep s = 12 minutes. Only the number of usable pickups changes.":"Mantén s = 12 minutos. Solo cambia el número de recogidas válidas.","Drag n along the curve. What is the smallest sample whose standard error is at most 0.60 minutes?":"Arrastra n a lo largo de la curva. ¿Cuál es la muestra más pequeña cuyo error estándar es como máximo 0.60 minutos?","<p>12 / √400 = 0.60 exactly, while n = 399 gives 0.6008. Halving the SE took four times the data, because the SE shrinks with √n, not with n.</p>\n          <p>So each extra step of precision gets expensive. The next screens ask whether precision is even the main problem.</p>":"<p>12 / √400 = 0.60 exacto, mientras que n = 399 da 0.6008. Reducir el SE a la mitad requirió cuatro veces más datos, porque el SE se reduce con √n, no con n.</p>\n          <p>Por eso cada paso extra de precisión sale caro. Las siguientes pantallas preguntan si la precisión es siquiera el problema principal.</p>","Standard error of a share":"Error estándar de una proporción","For the slow share, p̂ = 0.24 from n = 100 usable pickups. For a share, SE = √( p̂(1 − p̂) / n ).":"Para la proporción de recogidas lentas, p̂ = 0.24 con n = 100 recogidas válidas. Para una proporción, SE = √( p̂(1 − p̂) / n ).","Fill in the steps. Keep five decimals in the SE.":"Completa los pasos. Usa cinco decimales en el SE.","<p>SE ≈ 0.04271, or about 4.27 percentage points. It is the typical sample-to-sample movement of the estimated share, assuming an approximately independent random sample.</p>\n          <p>In Excel, with the share in E5 and n in E2: <code>=SQRT(E5*(1-E5)/E2)</code>.</p>":"<p>SE ≈ 0.04271, o cerca de 4.27 puntos porcentuales. Es el movimiento típico de la proporción estimada de una muestra a otra, suponiendo una muestra aleatoria aproximadamente independiente.</p>\n          <p>En Excel, con la proporción en E5 y n en E2: <code>=SQRT(E5*(1-E5)/E2)</code>.</p>","p̂(1 − p̂) / n = 0.24 × 0.76 / 100 = {{v}}":"p̂(1 − p̂) / n = 0.24 × 0.76 / 100 = {{v}}","SE = √0.001824 = {{se}}":"SE = √0.001824 = {{se}}","in percentage points: SE ≈ {{pts}} points":"en puntos porcentuales: SE ≈ {{pts}} puntos","0.24 × 0.76 = 0.1824. Then divide by 100.":"0.24 × 0.76 = 0.1824. Luego divide entre 100.","p-hat times one minus p-hat over n":"p sombrero por uno menos p sombrero, entre n","The square root of 0.001824 is about 0.04271.":"La raíz cuadrada de 0.001824 es aproximadamente 0.04271.","Standard error of the share":"Error estándar de la proporción","0.04271 is a share. Times 100, it is 4.27 percentage points.":"0.04271 es una proporción. Multiplicada por 100, son 4.27 puntos porcentuales.","Standard error in percentage points":"Error estándar en puntos porcentuales","0.04271 (4.27 points)":"0.04271 (4.27 puntos)","What does 4.27 points mean?":"¿Qué significan 4.27 puntos?","The standard error of Cedar Loop’s slow share is about 0.0427, or 4.27 percentage points.":"El error estándar de la proporción de recogidas lentas de Cedar Loop es cerca de 0.0427, o 4.27 puntos porcentuales.","What does 4.27 points describe?":"¿Qué describen 4.27 puntos?","<p>4.27 points is the spread of the sampling distribution of p̂: how far shares from comparable samples of 100 typically land from the true share. It is not a probability about one pickup, and it is not the spread of pickup times.</p>":"<p>4.27 puntos es la dispersión de la distribución muestral de p̂: qué tan lejos de la proporción verdadera suelen caer las proporciones de muestras comparables de 100. No es una probabilidad sobre una recogida, y no es la dispersión de los tiempos de recogida.</p>","How much the sample share would typically move from sample to sample":"Cuánto se movería típicamente la proporción muestral de una muestra a otra","The chance that any one pickup is slow":"La probabilidad de que una recogida cualquiera sea lenta","That chance is the share itself, about 24%. The SE measures how much the estimate wobbles.":"Esa probabilidad es la proporción misma, cerca del 24%. El SE mide cuánto oscila la estimación.","How far single pickup times spread around 42 minutes":"Cuánto se dispersan los tiempos de recogida individuales alrededor de 42 minutos","That is the standard deviation, 12 minutes. This SE is about the share, in percentage points.":"Esa es la desviación estándar, 12 minutos. Este SE se refiere a la proporción, en puntos porcentuales.","The most the true share can differ from 24%":"Lo máximo que la proporción verdadera puede diferir del 24%","The truth can be further away. A 95% margin is about 1.96 SEs, and even that is not a hard limit.":"El valor verdadero puede estar más lejos. Un margen del 95% es cerca de 1.96 SE, y ni siquiera eso es un límite estricto.","What if the 25 had answered?":"¿Y si los 25 hubieran respondido?","25 of the 125 invited pickups have no usable confirmation. Busy customers with slow pickups might be the ones who did not reply.":"25 de las 125 recogidas invitadas no tienen confirmación válida. Los clientes ocupados con recogidas lentas podrían ser los que no respondieron.","Explore with the slider. Then fill in the two extreme cases for all 125 selected pickups.":"Explora con el control deslizante. Luego completa los dos casos extremos para las 125 recogidas seleccionadas.","<p>Holding the 24 observed slow pickups fixed, the share among the 125 selected runs from 19.2% (none of the 25 slow) to 39.2% (all 25 slow). That range crosses the 20% target.</p>\n          <p>These are <b>sensitivity bounds</b> under extreme assumptions about missing outcomes. They are not a 95% confidence interval, and they do not yet describe all 2,400 pickups.</p>":"<p>Si se mantienen fijas las 24 recogidas lentas observadas, la proporción entre las 125 seleccionadas va de 19.2% (ninguna de las 25 lenta) a 39.2% (las 25 lentas). Ese rango cruza la meta del 20%.</p>\n          <p>Estos son <b>límites de sensibilidad</b> bajo supuestos extremos sobre los resultados faltantes. No son un intervalo de confianza del 95%, y todavía no describen las 2,400 recogidas.</p>","none of the 25 slow: (24 + 0) / 125 = {{lo}} %":"ninguna de las 25 lenta: (24 + 0) / 125 = {{lo}} %","all 25 slow: (24 + 25) / 125 = {{hi}} %":"las 25 lentas: (24 + 25) / 125 = {{hi}} %","24 ÷ 125 = 0.192, which is 19.2%. Divide by all 125 invited, not by the 100 who answered.":"24 ÷ 125 = 0.192, que es 19.2%. Divide entre las 125 invitadas, no entre las 100 que respondieron.","Best-case share in percent":"Proporción en el mejor caso, en porcentaje","(24 + 25) ÷ 125 = 49 ÷ 125 = 0.392, which is 39.2%.":"(24 + 25) ÷ 125 = 49 ÷ 125 = 0.392, que es 39.2%.","Worst-case share in percent":"Proporción en el peor caso, en porcentaje","19.2% to 39.2% of the 125 selected":"19.2% a 39.2% de las 125 seleccionadas","How many would tip it?":"¿Cuántas inclinarían la balanza?","The target is at most 20% slow. Among the 125 selected, 24 slow pickups are already known.":"La meta es como máximo 20% de recogidas lentas. Entre las 125 seleccionadas, ya se conocen 24 recogidas lentas.","Drag the slider. What is the smallest number of slow nonrespondents that puts the selected set above the 20% target?":"Arrastra el control deslizante. ¿Cuál es el menor número de no respondientes con recogida lenta que pone al conjunto seleccionado por encima de la meta del 20%?","<p>With 1 slow nonrespondent, 25 / 125 = 20.0%, which meets \"at most 20%\". With 2, 26 / 125 = 20.8%, above it. So the verdict on the selected set hangs on just 2 of the 25 missing pickups.</p>\n          <p>That is why following up nonrespondents can matter more than another decimal place in an interval. If follow-up found 10 of the 25 slow, the share would be 34 / 125 = 27.2%.</p>":"<p>Con 1 no respondiente con recogida lenta, 25 / 125 = 20.0%, que cumple \"como máximo 20%\". Con 2, 26 / 125 = 20.8%, por encima. Así que el veredicto sobre el conjunto seleccionado depende de solo 2 de las 25 recogidas faltantes.</p>\n          <p>Por eso dar seguimiento a los no respondientes puede importar más que otro decimal en un intervalo. Si el seguimiento encontrara 10 de las 25 lentas, la proporción sería 34 / 125 = 27.2%.</p>","Can a bigger sample fix it?":"¿Puede una muestra más grande corregirlo?","A manager proposes emailing 1,000 more customers the same way, with no follow-up of people who do not reply.":"Un gerente propone enviar un correo a 1,000 clientes más de la misma manera, sin dar seguimiento a quienes no respondan.","What does the bigger sample fix?":"¿Qué corrige la muestra más grande?","<p>Sampling error is chance variation, and it shrinks with √n. Bias is a systematic pull in one direction, and more of the same data repeats it. If customers with slow pickups tend not to reply, every bigger sample of repliers still understates the slow share.</p>\n          <p><b>Precision is not representativeness.</b> A narrow interval from a biased group can be confidently wrong. Better fixes: follow up nonrespondents and compare them with respondents on permitted frame fields.</p>":"<p>El error muestral es variación por azar, y se reduce con √n. El sesgo es un empuje sistemático en una dirección, y más datos del mismo tipo lo repiten. Si los clientes con recogidas lentas tienden a no responder, cada muestra más grande de quienes responden sigue subestimando la proporción de recogidas lentas.</p>\n          <p><b>Precisión no es representatividad.</b> Un intervalo estrecho de un grupo sesgado puede estar equivocado con mucha seguridad. Mejores soluciones: da seguimiento a los no respondientes y compáralos con los respondientes en los campos permitidos del marco.</p>","Random sampling error shrinks, but nonresponse bias can remain":"El error muestral aleatorio se reduce, pero el sesgo de no respuesta puede persistir","Both random error and nonresponse bias shrink":"Se reducen tanto el error aleatorio como el sesgo de no respuesta","If busy customers with slow pickups skip the email, more invitations repeat the same gap.":"Si los clientes ocupados con recogidas lentas ignoran el correo, más invitaciones repiten la misma brecha.","Nonresponse bias, because large numbers cancel errors out":"El sesgo de no respuesta, porque los números grandes cancelan los errores","Random errors average out. A systematic gap does not: it pulls every sample the same way.":"Los errores aleatorios se compensan al promediar. Una brecha sistemática no: empuja cada muestra en la misma dirección.","Nothing, because sample size never changes precision":"Nada, porque el tamaño de muestra nunca cambia la precisión","The SE falls with √n, so precision does improve. The problem is bias, not precision.":"El SE baja con √n, así que la precisión sí mejora. El problema es el sesgo, no la precisión.","Are the 100 really separate?":"¿Las 100 son realmente independientes?","Suppose the audit finds several pickups from the same daily customers, and a cluster of pickups during one system outage.":"Supón que la auditoría encuentra varias recogidas de los mismos clientes diarios, y un grupo de recogidas durante una caída del sistema.","What does this do to a simple interval that treats all 100 pickups as independent?":"¿Qué efecto tiene esto en un intervalo simple que trata las 100 recogidas como independientes?","<p>Independence asks whether records carry separate information. Pickups by the same customer, or many pickups during one outage, can move together. Treating them as 100 separate pieces of evidence makes the SE, and the interval, too narrow.</p>\n          <p>Check repeat customer IDs and service incidents with authorized, privacy-protected data. Do not export customer names into a student workbook.</p>":"<p>La independencia pregunta si los registros aportan información separada. Las recogidas del mismo cliente, o muchas recogidas durante una misma caída, pueden moverse juntas. Tratarlas como 100 piezas de evidencia separadas hace que el SE sea demasiado pequeño y el intervalo demasiado estrecho.</p>\n          <p>Revisa los ID de clientes repetidos y los incidentes del servicio con datos autorizados y con protección de la privacidad. No exportes nombres de clientes a un libro de trabajo de estudiantes.</p>","It can be too narrow, because related pickups add less separate information":"Puede quedar demasiado estrecho, porque las recogidas relacionadas aportan menos información separada","Nothing, because each pickup has its own ID":"Nada, porque cada recogida tiene su propio ID","Unique IDs stop literal duplicates. Pickups by the same customer or during one outage can still move together.":"Los ID únicos evitan duplicados literales. Las recogidas del mismo cliente o durante una misma caída aún pueden moverse juntas.","It makes the interval too wide":"Hace que el intervalo sea demasiado ancho","Related records carry less new information than their count suggests. The real uncertainty is larger, not smaller.":"Los registros relacionados aportan menos información nueva de lo que sugiere su número. La incertidumbre real es mayor, no menor.","It is fixed by deleting the outage night":"Se corrige borrando la noche de la caída","Deleting data to remove a pattern changes the population. Report it and use a method that allows for it.":"Borrar datos para quitar un patrón cambia la población. Repórtalo y usa un método que lo tome en cuenta.","Find t* in the table":"Encuentra t* en la tabla","For a mean with an unknown population SD, a 95% interval uses t* with n − 1 degrees of freedom. Each row is a df. Each column is the total area in both tails.":"Para una media con SD poblacional desconocida, un intervalo del 95% usa t* con n − 1 grados de libertad. Cada fila es un valor de df. Cada columna es el área total en ambas colas.","Cedar Loop has n = 100 usable pickups. Tap the cell for its df and a 95% interval.":"Cedar Loop tiene n = 100 recogidas válidas. Toca la celda que corresponde a sus df y a un intervalo del 95%.","<p>Row 99, column 0.05 gives t* = 1.984, the cut-off that leaves 2.5% in each tail. Excel gives more decimals: <code>=T.INV.2T(0.05, 99)</code> = 1.9842.</p>\n          <p>Compare the ∞ row: 1.960, the z value. With 99 df, t* is only a little larger than z, because the sample SD comes from many pickups.</p>":"<p>La fila 99, columna 0.05, da t* = 1.984, el punto de corte que deja 2.5% en cada cola. Excel da más decimales: <code>=T.INV.2T(0.05, 99)</code> = 1.9842.</p>\n          <p>Compara con la fila ∞: 1.960, el valor z. Con 99 df, t* es solo un poco mayor que z, porque la SD muestral viene de muchas recogidas.</p>","Build the 95% interval for the mean":"Construye el intervalo del 95% para la media","Mean 42 minutes, SE 1.20 minutes, t* = 1.9842.":"Media 42 minutos, SE 1.20 minutos, t* = 1.9842.","Compute the margin, then both ends. Use two decimals for the ends.":"Calcula el margen y luego ambos extremos. Usa dos decimales para los extremos.","<p>The 95% interval is 42 ± 2.38, or <b>39.62 to 44.38 minutes</b>, for the mean pickup time of eligible pickups in the period. It assumes a defensible sampling and response process, which Cedar Loop has not yet shown.</p>\n          <p>Excel: <code>=E3-T.INV.2T(0.05,E2-1)*E4/SQRT(E2)</code>, and the same with + for the upper end. SPSS: <code>EXAMINE VARIABLES=duration /STATISTICS=DESCRIPTIVES /CINTERVAL 95.</code> and read \"95% Confidence Interval for Mean\".</p>":"<p>El intervalo del 95% es 42 ± 2.38, o <b>39.62 a 44.38 minutos</b>, para el tiempo medio de recogida de las recogidas elegibles del periodo. Supone un proceso de muestreo y de respuesta defendible, algo que Cedar Loop todavía no ha demostrado.</p>\n          <p>Excel: <code>=E3-T.INV.2T(0.05,E2-1)*E4/SQRT(E2)</code>, y lo mismo con + para el extremo superior. SPSS: <code>EXAMINE VARIABLES=duration /STATISTICS=DESCRIPTIVES /CINTERVAL 95.</code> y lee \"95% Confidence Interval for Mean\" (intervalo de confianza para la media).</p>","margin M = 1.9842 × 1.20 = {{m}} minutes":"margen M = 1.9842 × 1.20 = {{m}} minutos","lower end = 42 − M = {{lo}} minutes":"extremo inferior = 42 − M = {{lo}} minutos","upper end = 42 + M = {{hi}} minutes":"extremo superior = 42 + M = {{hi}} minutos","1.9842 × 1.20 ≈ 2.381 minutes.":"1.9842 × 1.20 ≈ 2.381 minutos.","Margin of error":"Margen de error","42 − 2.381 = 39.619, about 39.62.":"42 − 2.381 = 39.619, cerca de 39.62.","Lower end":"Extremo inferior","42 + 2.381 = 44.381, about 44.38.":"42 + 2.381 = 44.381, cerca de 44.38.","Upper end":"Extremo superior","39.62 to 44.38 min":"39.62 a 44.38 min","What does 95% promise?":"¿Qué promete el 95%?","Each line below is a 95% interval from a new simulated sample of 100 pickups. Green lines cover the true mean of the imagined population. Amber lines miss it.":"Cada línea de abajo es un intervalo del 95% de una nueva muestra simulada de 100 recogidas. Las líneas verdes cubren la media verdadera de la población imaginaria. Las líneas ámbar no la cubren.","Draw a few batches. Which sentence about Cedar Loop’s interval, 39.62 to 44.38 minutes, is correct?":"Extrae algunos lotes. ¿Qué afirmación sobre el intervalo de Cedar Loop, de 39.62 a 44.38 minutos, es correcta?","<p>\"95%\" describes the <b>procedure</b>: across many samples, about 95% of intervals built this way cover the fixed true mean. In this simulation, 95 of the first 100 do.</p>\n          <p>Once it is computed, Cedar Loop’s interval either covers the true mean or it does not, and we cannot tell which. It is also not a range for single pickups, which vary with an SD of 12 minutes.</p>":"<p>\"95%\" describe el <b>procedimiento</b>: a lo largo de muchas muestras, cerca del 95% de los intervalos construidos de esta forma cubren la media verdadera, que es fija. En esta simulación, 95 de los primeros 100 la cubren.</p>\n          <p>Una vez calculado, el intervalo de Cedar Loop cubre la media verdadera o no la cubre, y no podemos saber cuál de las dos. Tampoco es un rango para recogidas individuales, que varían con una SD de 12 minutos.</p>","The method captures the true mean in about 95% of repeated samples":"El método captura la media verdadera en cerca del 95% de las muestras repetidas","There is a 95% chance the true mean is in this interval":"Hay una probabilidad del 95% de que la media verdadera esté en este intervalo","The true mean is fixed. This one interval either covers it or not. The 95% describes the method.":"La media verdadera es fija. Este intervalo en particular la cubre o no. El 95% describe el método.","95% of pickups take between 39.62 and 44.38 minutes":"El 95% de las recogidas tarda entre 39.62 y 44.38 minutos","Single pickups vary with an SD of 12 minutes. The interval is for the mean, not for single pickups.":"Las recogidas individuales varían con una SD de 12 minutos. El intervalo es para la media, no para recogidas individuales.","The true mean is 42 minutes":"La media verdadera es 42 minutos","42 is the sample mean, one estimate. The interval shows the other plausible values.":"42 es la media muestral, una estimación. El intervalo muestra los otros valores plausibles.","More confidence, wider window":"Más confianza, ventana más ancha","The manager says, \"Give me 99% confidence instead of 95%.\" Slide the confidence level and watch the interval.":"El gerente dice: \"Dame 99% de confianza en vez de 95%\". Desliza el nivel de confianza y observa el intervalo.","What happens to Cedar Loop’s mean interval at 99%?":"¿Qué le pasa al intervalo para la media de Cedar Loop con 99%?","<p>At 99%, t* = 2.626 and the margin is about 2.626 × 1.20 = 3.15, giving 38.85 to 45.15 minutes. At 90%, t* = 1.660 and the interval is 40.01 to 43.99.</p>\n          <p>Higher confidence buys a wider, less actionable window. Only more good data, or less variable data, buys both confidence and a narrow window.</p>":"<p>Con 99%, t* = 2.626 y el margen es cerca de 2.626 × 1.20 = 3.15, lo que da 38.85 a 45.15 minutos. Con 90%, t* = 1.660 y el intervalo es 40.01 a 43.99.</p>\n          <p>Más confianza te cuesta una ventana más ancha y menos útil para actuar. Solo más datos buenos, o datos menos variables, te dan a la vez confianza y una ventana estrecha.</p>","It widens, to about 38.85 to 45.15 minutes":"Se ensancha, a cerca de 38.85 a 45.15 minutos","It narrows, because 99% is more precise":"Se estrecha, porque 99% es más preciso","More confidence needs a bigger multiplier. t* rises from 1.98 to 2.63, so the margin grows.":"Más confianza requiere un multiplicador mayor. t* sube de 1.98 a 2.63, así que el margen crece.","It stays 39.62 to 44.38; only the label changes":"Se queda en 39.62 a 44.38; solo cambia la etiqueta","The confidence level and the width move together. Slide to 99% and watch the ends.":"El nivel de confianza y el ancho se mueven juntos. Desliza a 99% y observa los extremos.","It widens, because the sample gets smaller":"Se ensancha, porque la muestra se hace más pequeña","n stays 100. Only the multiplier t* changes.":"n sigue en 100. Solo cambia el multiplicador t*.","Where does 1.96 come from?":"¿De dónde sale 1.96?","The interval for a share uses the normal multiplier z*. A 95% interval leaves 2.5% in each tail, so z* has 97.5% of the area to its left.":"El intervalo para una proporción usa el multiplicador normal z*. Un intervalo del 95% deja 2.5% en cada cola, así que z* tiene 97.5% del área a su izquierda.","Hunt inside the z-table: tap the cell that holds 0.9750. Its row and column give z*.":"Busca dentro de la tabla z: toca la celda que contiene 0.9750. Su fila y su columna dan z*.","<p>0.9750 sits in row 1.9, column 0.06, so z* = 1.96. It is the multiplier in the slow-share interval, 0.24 ± 1.96 × 0.04271.</p>\n          <p>The t-table agrees: its ∞ row, 95% column, reads 1.960. For the mean you used t* = 1.984 instead, because the SD was estimated from the sample.</p>":"<p>0.9750 está en la fila 1.9, columna 0.06, así que z* = 1.96. Es el multiplicador del intervalo para la proporción de recogidas lentas, 0.24 ± 1.96 × 0.04271.</p>\n          <p>La tabla t coincide: su fila ∞, columna 95%, marca 1.960. Para la media, en cambio, usaste t* = 1.984, porque la SD se estimó a partir de la muestra.</p>","Build the 95% interval for the slow share":"Construye el intervalo del 95% para la proporción de recogidas lentas","p̂ = 0.24, SE = 0.04271 and z* = 1.96. The counts suit this simple method: 24 slow and 76 not slow, both well above 10.":"p̂ = 0.24, SE = 0.04271 y z* = 1.96. Los conteos son adecuados para este método simple: 24 lentas y 76 no lentas, ambos muy por encima de 10.","Compute the margin and both ends, as shares.":"Calcula el margen y ambos extremos, como proporciones.","<p>The margin is 0.0837, or <b>8.37 percentage points</b>. The 95% interval is 0.1563 to 0.3237: about <b>15.6% to 32.4%</b> slow.</p>\n          <p>Excel: <code>=E5-1.96*SQRT(E5*(1-E5)/E2)</code>, and the same with + for the upper end. This interval covers chance variation only. It does not include the risk from the 25 missing confirmations.</p>":"<p>El margen es 0.0837, o <b>8.37 puntos porcentuales</b>. El intervalo del 95% es 0.1563 a 0.3237: cerca de <b>15.6% a 32.4%</b> de recogidas lentas.</p>\n          <p>Excel: <code>=E5-1.96*SQRT(E5*(1-E5)/E2)</code>, y lo mismo con + para el extremo superior. Este intervalo cubre solo la variación por azar. No incluye el riesgo de las 25 confirmaciones faltantes.</p>","M = 1.96 × 0.04271 = {{m}}":"M = 1.96 × 0.04271 = {{m}}","lower end = 0.24 − M = {{lo}}":"extremo inferior = 0.24 − M = {{lo}}","upper end = 0.24 + M = {{hi}}":"extremo superior = 0.24 + M = {{hi}}","15.6% to 32.4% (±8.37 points)":"15.6% a 32.4% (±8.37 puntos)","Does it clear the target?":"¿Supera claramente la meta?","The violet bar is the 95% interval for the slow share. The gold bar shows the nonresponse bounds for the 125 selected. Drag the target line to explore.":"La barra violeta es el intervalo del 95% para la proporción de recogidas lentas. La barra dorada muestra los límites por no respuesta para las 125 seleccionadas. Arrastra la línea de la meta para explorar.","Does this evidence show that the true slow share is above the 20% target?":"¿Muestra esta evidencia que la verdadera proporción de recogidas lentas está por encima de la meta del 20%?","<p>Both the 95% interval (15.6% to 32.4%) and the nonresponse bounds (19.2% to 39.2%) cross 20%. The evidence does not show a share above the target, and it does not show that the target is met.</p>\n          <p>Drag the target line: only a target below 15.6% would sit fully under the interval.</p>":"<p>Tanto el intervalo del 95% (15.6% a 32.4%) como los límites por no respuesta (19.2% a 39.2%) cruzan el 20%. La evidencia no muestra una proporción por encima de la meta, y tampoco muestra que la meta se cumpla.</p>\n          <p>Arrastra la línea de la meta: solo una meta por debajo de 15.6% quedaría completamente debajo del intervalo.</p>","No. Plausible shares run from 15.6% to 32.4%, on both sides of 20%.":"No. Las proporciones plausibles van de 15.6% a 32.4%, a ambos lados del 20%.","Yes. The estimate, 24%, is above 20%.":"Sí. La estimación, 24%, está por encima del 20%.","24% is one plausible value. The interval reaches down to 15.6%, below the target.":"24% es un valor plausible. El intervalo baja hasta 15.6%, por debajo de la meta.","No. It proves the 20% target is met.":"No. Prueba que se cumple la meta del 20%.","The interval also reaches 32.4%. Not showing a problem is not proof that there is none.":"El intervalo también llega a 32.4%. No mostrar un problema no prueba que no lo haya.","Yes. The nonresponse bounds reach 39.2%.":"Sí. Los límites por no respuesta llegan a 39.2%.","They also reach down to 19.2%. Both ranges cross the target.":"También bajan hasta 19.2%. Ambos rangos cruzan la meta.","Points, not percent":"Puntos, no porcentaje","A teammate drafts one line for the manager’s memo.":"Un compañero de equipo redacta una línea para el memorando del gerente.","Which line reports the result correctly?":"¿Qué línea reporta el resultado correctamente?","<p>The margin of a share is in <b>percentage points</b>: 24% ± 8.37 points. \"±8.37%\" can read as a relative change, 0.0837 × 24% ≈ 2 points, which hides most of the uncertainty.</p>\n          <p>Also name the parameter, the period and the main limitation: the respondents may not represent all 2,400 pickups.</p>":"<p>El margen de una proporción está en <b>puntos porcentuales</b>: 24% ± 8.37 puntos. \"±8.37%\" puede leerse como un cambio relativo, 0.0837 × 24% ≈ 2 puntos, lo que oculta la mayor parte de la incertidumbre.</p>\n          <p>Nombra también el parámetro, el periodo y la limitación principal: los respondientes podrían no representar las 2,400 recogidas.</p>","24% slow; 95% CI 15.6% to 32.4% (margin 8.37 percentage points)":"24% lentas; IC del 95%: 15.6% a 32.4% (margen de 8.37 puntos porcentuales)","24% slow, plus or minus 8.37%":"24% lentas, más o menos 8.37%","A reader may take 8.37% of 24%, which is about 2 points. Say percentage points.":"Un lector podría entender 8.37% de 24%, que es cerca de 2 puntos. Di puntos porcentuales.","24% slow, plus or minus 4.27 points at 95% confidence":"24% lentas, más o menos 4.27 puntos con 95% de confianza","4.27 points is one standard error. The 95% margin is 1.96 × 4.27 ≈ 8.37 points.":"4.27 puntos es un error estándar. El margen del 95% es 1.96 × 4.27 ≈ 8.37 puntos.","24% of all 2,400 pickups are slow":"El 24% de las 2,400 recogidas son lentas","That reports a respondent share as a population fact. It drops the interval and the 25 missing confirmations.":"Eso reporta una proporción de respondientes como un hecho de la población. Omite el intervalo y las 25 confirmaciones faltantes.","Plan the next audit":"Planea la próxima auditoría","Before collecting more data, the manager wants a 95% interval no wider than ±5 percentage points. Use the current estimate, 0.24, as the planning share.":"Antes de recolectar más datos, el gerente quiere un intervalo del 95% no más ancho que ±5 puntos porcentuales. Usa la estimación actual, 0.24, como proporción de planificación.","Drag n. What is the smallest number of usable pickups that brings the margin to 5 points or less?":"Arrastra n. ¿Cuál es el menor número de recogidas válidas que lleva el margen a 5 puntos o menos?","<p>n = (1.96 / 0.05)² × 0.24 × 0.76 = 280.28. Always round <b>up</b>, to 281 usable pickups: at 280 the margin is 5.003 points, just over the goal.</p>\n          <p>Switch the planning share to 0.50 and the answer becomes 385. A share of 0.50 gives the largest p(1 − p), so it is the safe choice when no credible estimate exists.</p>":"<p>n = (1.96 / 0.05)² × 0.24 × 0.76 = 280.28. Siempre redondea <b>hacia arriba</b>, a 281 recogidas válidas: con 280 el margen es 5.003 puntos, apenas por encima del objetivo.</p>\n          <p>Cambia la proporción de planificación a 0.50 y la respuesta pasa a 385. Una proporción de 0.50 da el mayor p(1 − p), así que es la opción segura cuando no existe una estimación creíble.</p>","281 usable for ±5 points":"281 válidas para ±5 puntos","From usable pickups to invitations":"De recogidas válidas a invitaciones","The plan counts usable confirmations, but Cedar Loop can only send invitations. Last time, 80% of invitations gave usable responses.":"El plan cuenta confirmaciones válidas, pero Cedar Loop solo puede enviar invitaciones. La vez pasada, el 80% de las invitaciones dio respuestas válidas.","Fill in each plan. Round up every time.":"Completa cada plan. Redondea hacia arriba siempre.","<p>Without a credible planning share, 0.50 gives 385. To get 281 usable responses at an 80% response rate, plan about 352 invitations. Halving the margin needs four times the sample, 1,122.</p>\n          <p>Inviting more people fixes the <b>count</b>, not the <b>pattern</b> of who responds. 352 invitations are not 352 representative observations.</p>":"<p>Sin una proporción de planificación creíble, 0.50 da 385. Para obtener 281 respuestas válidas con una tasa de respuesta del 80%, planea cerca de 352 invitaciones. Reducir el margen a la mitad requiere cuatro veces la muestra, 1,122.</p>\n          <p>Invitar a más personas corrige el <b>número</b>, no el <b>patrón</b> de quién responde. 352 invitaciones no son 352 observaciones representativas.</p>","planning share 0.50: 1.96² × 0.25 / 0.05² = 384.16, so n = {{n50}}":"proporción de planificación 0.50: 1.96² × 0.25 / 0.05² = 384.16, así que n = {{n50}}","invitations for 281 usable at 80%: 281 / 0.80 = 351.25, so invite {{inv}}":"invitaciones para 281 válidas al 80%: 281 / 0.80 = 351.25, así que invita a {{inv}}","margin halved to ±2.5 points: 4 × 280.28 = 1,121.13, so n = {{n25}}":"margen reducido a la mitad, ±2.5 puntos: 4 × 280.28 = 1,121.13, así que n = {{n25}}","Round 384.16 up to 385. Rounding down would leave the margin just over 5 points.":"Redondea 384.16 hacia arriba, a 385. Redondear hacia abajo dejaría el margen apenas por encima de 5 puntos.","Usable pickups with planning share 0.50":"Recogidas válidas con proporción de planificación 0.50","281 ÷ 0.80 = 351.25. Round up to 352: you cannot send part of an invitation.":"281 ÷ 0.80 = 351.25. Redondea hacia arriba a 352: no puedes enviar parte de una invitación.","Invitations":"Invitaciones","Halving the margin multiplies n by 4: 4 × 280.28 = 1,121.13, rounded up to 1,122.":"Reducir el margen a la mitad multiplica n por 4: 4 × 280.28 = 1,121.13, redondeado hacia arriba a 1,122.","Usable pickups for a margin of 2.5 points":"Recogidas válidas para un margen de 2.5 puntos","281 usable (±5 points), about 352 invitations":"281 válidas (±5 puntos), cerca de 352 invitaciones","Make the call":"Toma la decisión","You are the analyst. The manager wants one recommendation for the staffing meeting.":"Tienes el rol de analista. El gerente quiere una sola recomendación para la reunión sobre personal.","What do you recommend?":"¿Qué recomiendas?","<p>The respondent share is above 20%, but the 95% interval (15.6% to 32.4%) and the nonresponse bounds (19.2% to 39.2%) both cross the target. The snapshot is observational, so it cannot show what extra staff would do.</p>\n          <p>A bounded next step: audit the frame, follow up nonrespondents, then pilot evening staffing with a labor-cost guardrail and a sample planned for ±5 points.</p>":"<p>La proporción entre los respondientes está por encima del 20%, pero el intervalo del 95% (15.6% a 32.4%) y los límites por no respuesta (19.2% a 39.2%) cruzan la meta. Esta instantánea de datos es observacional, así que no puede mostrar qué lograría más personal.</p>\n          <p>Un siguiente paso acotado: audita el marco, da seguimiento a los no respondientes y luego haz un piloto con personal en el turno de la tarde, con una salvaguarda de costo laboral y una muestra planificada para ±5 puntos.</p>","Audit and follow up nonrespondents, then pilot evening staff with a cost guardrail":"Auditar y dar seguimiento a los no respondientes, y luego hacer un piloto con personal de la tarde y una salvaguarda de costos","Hire permanent evening staff now, because 24% is above the 20% target":"Contratar ahora personal permanente para la tarde, porque 24% está por encima de la meta del 20%","The 24% is one estimate from respondents. The interval and the nonresponse bounds both reach below 20%.":"El 24% es una estimación a partir de los respondientes. El intervalo y los límites por no respuesta bajan ambos por debajo del 20%.","Change nothing, because the interval includes values below 20%":"No cambiar nada, porque el intervalo incluye valores por debajo del 20%","The interval also reaches 32.4%. Not showing a problem is not proof that the target is met.":"El intervalo también llega a 32.4%. No mostrar un problema no prueba que se cumpla la meta.","Email 1,000 more customers the same way, then decide":"Enviar un correo a 1,000 clientes más de la misma manera, y luego decidir","More of the same narrows chance error, but the same nonresponse pattern could still bias the share.":"Más de lo mismo reduce el error por azar, pero el mismo patrón de no respuesta aún podría sesgar la proporción.","Audit and follow up, then a bounded evening pilot":"Auditar y dar seguimiento, luego un piloto acotado en la tarde","Your audit bench":"Tu banco de pruebas de auditoría","Name the population first. The SE shrinks with √n, but bias does not. A 95% interval describes the procedure, and it can still cross the target.":"Primero nombra la población. El SE se reduce con √n, pero el sesgo no. Un intervalo del 95% describe el procedimiento, y aun así puede cruzar la meta.","Change the inputs to invent your own audit. The checks update as you drag.":"Cambia los datos de entrada para inventar tu propia auditoría. Las comprobaciones se actualizan mientras arrastras.","Open this page from the class site to see the dataset.":"Abre esta página desde el sitio de la clase para ver el conjunto de datos.","Mini frame sorted by its random number":"Minimarco ordenado por su número aleatorio","Selected?":"¿Seleccionado?","Edit any cell (Excel recalculates)":"Editar cualquier celda (Excel recalcula)","Paste RAND as values":"Pegar RAND como valores","Start over":"Empezar de nuevo","A mini frame: 10 IDs, keep the 3 with the smallest random numbers. The real draw keeps 125 of 2,400.":"Un minimarco: 10 ID, quédate con los 3 de números aleatorios más pequeños. El sorteo real se queda con 125 de 2,400.","Selected":"Seleccionado","Selected IDs":"ID seleccionados","RAND column":"Columna RAND","Frozen values":"Valores congelados","Live formula":"Fórmula activa","After the last edit":"Después de la última edición","Selection changed":"La selección cambió","Selection kept":"La selección se mantuvo","Imagined population of pickup times, with the latest sample as dots":"Población imaginaria de tiempos de recogida, con la última muestra como puntos","pickup time (minutes)":"tiempo de recogida (minutos)","population: mean 42, SD 12, long right tail":"población: media 42, SD 12, cola larga a la derecha","Histogram of sample means":"Histograma de medias muestrales","sample mean (minutes)":"media muestral (minutos)","Sample means":"Medias muestrales","Normal curve with SD 12 / √n":"Curva normal con SD 12 / √n","Pickups per sample, n":"Recogidas por muestra, n","Draw 1 sample":"Extraer 1 muestra","Draw 100 samples":"Extraer 100 muestras","Clear this n":"Borrar este n","this sample’s mean":"media de esta muestra","Samples drawn":"Muestras extraídas","Mean of the means":"Media de las medias","min":"min","SD of the means":"SD de las medias","Formula: 12 / √n":"Fórmula: 12 / √n","The 125 selected pickups: known slow, known not slow, and missing":"Las 125 recogidas seleccionadas: lentas conocidas, no lentas conocidas y faltantes","Known slow":"Lentas conocidas","Known not slow":"No lentas conocidas","Missing":"Faltantes","Missing, assumed slow":"Faltantes, supuestas lentas","Share of the 125 selected pickups that are slow":"Proporción de las 125 recogidas seleccionadas que son lentas","slow share of the 125 selected":"proporción de lentas entre las 125 seleccionadas","target 20%":"meta 20%","Slow among the 25 missing":"Lentas entre las 25 faltantes","Slow among the 125":"Lentas entre las 125","Share of the 125":"P <script>
/* GC1015 Session 5 interactive lesson: sampling distributions, standard error, confidence intervals, sample size.
   Source: S05_Expanded_Toolkit.md, SESSION_OUTLINE.md and the S05P lab (Cedar Loop, fictional).
   Every number is verified by verify_S05.py in this folder. Post-class review: the session ran on 30 September 2026. */
(function () {
  'use strict';
  const K = LessonKit;
  const St = K.Stats;
  const near = (x, y) => Math.abs(x - y) < 1e-9;
  const SMALL = { minWidth: '0', padding: '9px 14px', fontSize: '13.5px' };
  const btn = (a, label, fn) => a.h('button', { type: 'button', class: 'lk-btn ghost', style: SMALL, onclick: fn }, label);
  const btnRow = (a, ...kids) => a.h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px' } }, ...kids);
  const reduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

  /* ---------- Case numbers (toolkit case table; checked in verify_S05.py) ---------- */
  const N_USE = 100, N_INV = 125, SLOW = 24, XBAR = 42, SD = 12, TARGET = 0.2;
  const PHAT = SLOW / N_USE;
  const SE_P = Math.sqrt(PHAT * (1 - PHAT) / N_USE);          // 0.04271
  const CI_P = [PHAT - 1.96 * SE_P, PHAT + 1.96 * SE_P];       // 0.1563 to 0.3237
  const BOUNDS = [SLOW / N_INV, (SLOW + N_INV - N_USE) / N_INV]; // 0.192 to 0.392

  /* ---------- Seeded simulation (mulberry32; replicated in verify_S05.py) ---------- */
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Imagined population of pickup times: shifted lognormal with mean 42 and SD 12 minutes, skewed right.
  const SIG = 0.5;
  const ML = SD / Math.sqrt(Math.exp(SIG * SIG) - 1);
  const C0 = XBAR - ML;
  const MU = Math.log(ML) - SIG * SIG / 2;
  const popPdf = (x) => (x <= C0 ? 0 : Math.exp(-((Math.log(x - C0) - MU) ** 2) / (2 * SIG * SIG)) / ((x - C0) * SIG * Math.sqrt(2 * Math.PI)));
  const drawPop = (rng) => C0 + Math.exp(MU + SIG * St.normInv(Math.min(Math.max(rng(), 1e-12), 1 - 1e-12)));
  function sampleOf(rng, n) { const xs = []; let sum = 0; for (let i = 0; i < n; i++) { const x = drawPop(rng); xs.push(x); sum += x; } return { xs, mean: sum / n }; }

  /* ---------- Figures ---------- */
  function hookArt() {

    return `<svg viewBox="0 0 420 236" role="img" aria-label="A pickup counter with grocery bags and a clock past 50 minutes, beside 100 squares where 24 are marked slow.">

        <rect x="76" y="88" width="42" height="40" rx="6" class="f-a"/><path d="M86 88 q11 -16 22 0" class="s-ink"/>

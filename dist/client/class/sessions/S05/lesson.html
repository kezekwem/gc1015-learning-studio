<mo>=</mo><mn>99</mn></mrow><annotation encoding=\"application/x-tex\">100-1=99</annotation></semantics></math></span> degrees of freedom. The two-sided 95% critical value is approximately <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>t</mi><mo>∗</mo></msup><mo>=</mo><mn>1.9842</mn></mrow><annotation encoding=\"application/x-tex\">t^*=1.9842</annotation></semantics></math></span>. Calculate each endpoint:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>=</mo><mn>1.9842</mn><mo stretchy=\"false\">(</mo><mn>1.20</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>2.3810</mn><mtext> minutes</mtext><mo separator=\"true\">;</mo><mspace width=\"2em\"/><mn>42</mn><mo>−</mo><mn>2.3810</mn><mo>=</mo><mn>39.6190</mn><mo separator=\"true\">;</mo><mspace width=\"2em\"/><mn>42</mn><mo>+</mo><mn>2.3810</mn><mo>=</mo><mn>44.3810.</mn></mrow><annotation encoding=\"application/x-tex\">M=1.9842(1.20)=2.3810\\text{ minutes};\n\\qquad\n42-2.3810=39.6190;\n\\qquad\n42+2.3810=44.3810.</annotation></semantics></math></span></div></p>\n<p>Rounded to reporting precision, the <b>illustrative 95% interval is 39.62 to 44.38 minutes</b>. Conditional on a defensible sampling and response process, it estimates the mean duration of eligible pickups in the stated period. It does not say that 95% of <i>individual</i> pickups lasted between those endpoints. Because Cedar Loop has unresolved nonresponse, report the interval alongside that limitation rather than presenting it as fully validated population coverage. (The Pennsylvania State University, n.d.-c).</p>\n<p><b>Excel 365, after the calculation.</b> If an audited sheet has one numeric duration per usable pickup in <code>B2:B101</code>, first check that <code>=COUNT(B2:B101)</code> returns <code>100</code>, <code>=AVERAGE(B2:B101)</code> returns <code>42</code>, and <code>=STDEV.S(B2:B101)</code> returns <code>12</code>. If it does not, investigate rows or rounding rather than forcing the result. For this exercise’s stipulated summaries, place <code>100</code>, <code>42</code>, and <code>12</code> in <code>E2:E4</code>. Then use <code>=E4/SQRT(E2)</code> for the SE, <code>=T.INV.2T(0.05,E2-1)</code> for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>t</mi><mo>∗</mo></msup></mrow><annotation encoding=\"application/x-tex\">t^*</annotation></semantics></math></span>, and <code>=E3-T.INV.2T(0.05,E2-1)*E4/SQRT(E2)</code> and the corresponding <code>+</code> formula for endpoints. <code>STDEV.S</code> estimates a sample standard deviation; Microsoft documents the statistical functions used here. A summary-only sheet checks arithmetic but cannot validate the missing row-level data. (Microsoft, n.d.).</p>\n<p><b>SPSS, when an authorized row-level file exists.</b> Verify that it has one usable row per pickup, numeric <code>minutes</code>, and the same missing-value rule. Run <code>EXAMINE VARIABLES=minutes /STATISTICS=DESCRIPTIVES /CINTERVAL 95.</code> and compare its valid <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>, mean, standard deviation, and <b>95% CI for Mean</b> with the hand calculation. Do not claim the stipulated aggregates are reproducible in SPSS without those rows. IBM documents <code>EXAMINE</code>’s descriptive output and its confidence-level option. (IBM, n.d.-a, n.d.-b).</p>\n<p><b>[KEY] An interval measures uncertainty from a specified procedure, conditional on its assumptions; it is not a cure for missing or wrongly measured pickups.</b></p>\n<p><b>Failure mode:</b> Reporting “42 ± 2.38 minutes” without identifying the parameter, confidence level, dates, or nonresponse limitation makes the number look more general than it is.</p>\n<p><b>Try it — ungraded.</b> For a separate illustrative mean of 30 minutes with SE 2 minutes and a supplied 95% critical value of 2, find the interval.</p>\n<p><b>Answer.</b> The margin is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mo stretchy=\"false\">(</mo><mn>2</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">2(2)=4</annotation></semantics></math></span> minutes, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30</mn><mo>±</mo><mn>4</mn><mo>=</mo><mo stretchy=\"false\">[</mo><mn>26</mn><mo separator=\"true\">,</mo><mn>34</mn><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">30\\pm4=[26,34]</annotation></semantics></math></span> minutes. This is an interval for a <i>population mean</i> only if the procedure’s sampling assumptions hold.</p>"},{"id":"5","level":2,"title":"5. Estimate a proportion and plan useful precision","short":"5. Estimate a proportion and pla…","html":""},{"id":"5.1","level":3,"title":"5.1 Slow-pickup interval and sample-size plan","short":"5.1. Slow-pickup interval and sa…","html":"<p>A <b>proportion</b> is a share of units with a defined attribute: Cedar Loop’s <code>slow=1</code> means <i>more than</i> 50 minutes, so exactly 50 is not slow. The simple normal-approximation, or <b>Wald</b>, interval is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover><mo>±</mo><msup><mi>z</mi><mo>∗</mo></msup><mi>S</mi><msub><mi>E</mi><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover></msub></mrow><annotation encoding=\"application/x-tex\">\\hat p\\pm z^*SE_{\\hat p}</annotation></semantics></math></span>. For a two-sided 95% interval, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>z</mi><mo>∗</mo></msup><mo>≈</mo><mn>1.96</mn></mrow><annotation encoding=\"application/x-tex\">z^*\\approx1.96</annotation></semantics></math></span>. It is a useful introductory calculation when observations are suitable and expected counts are not small; with sparse successes or failures, a more appropriate proportion procedure is needed. Cedar Loop has 24 slow and 76 not-slow responses, so neither observed count is sparse. Its unresolved response process remains the more serious limitation. (The Pennsylvania State University, n.d.-c).</p>\n<p><b>Worked example.</b> Section 3 found <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><msub><mi>E</mi><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover></msub><mo>≈</mo><mn>0.04271</mn></mrow><annotation encoding=\"application/x-tex\">SE_{\\hat p}\\approx0.04271</annotation></semantics></math></span>. Complete the calculation without rounding the SE prematurely:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>=</mo><mn>1.96</mn><msqrt><mfrac><mrow><mn>0.24</mn><mo stretchy=\"false\">(</mo><mn>0.76</mn><mo stretchy=\"false\">)</mo></mrow><mn>100</mn></mfrac></msqrt><mo>≈</mo><mn>1.96</mn><mo stretchy=\"false\">(</mo><mn>0.042708</mn><mo stretchy=\"false\">)</mo><mo>≈</mo><mn>0.08371</mn><mo separator=\"true\">;</mo></mrow><annotation encoding=\"application/x-tex\">M=1.96\\sqrt{\\frac{0.24(0.76)}{100}}\n\\approx1.96(0.042708)\n\\approx0.08371;</annotation></semantics></math></span></div>\n<div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mn>0.24</mn><mo>−</mo><mn>0.08371</mn><mo>=</mo><mn>0.15629</mn><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mn>0.24</mn><mo>+</mo><mn>0.08371</mn><mo>=</mo><mn>0.32371.</mn></mrow><annotation encoding=\"application/x-tex\">0.24-0.08371=0.15629,\\qquad\n0.24+0.08371=0.32371.</annotation></semantics></math></span></div></p>\n<p>The <b>illustrative 95% interval is 15.6% to 32.4%</b>, rounded to one decimal percentage point. The 20% managerial target lies inside it. Thus these responses and this interval do not isolate a population slow share above 20%; they also do not establish that the target is met. More fundamentally, the interval does not incorporate the possible nonresponse bias demonstrated in Section 2. A bounded recommendation is to audit the frame and follow up nonrespondents, then plan an evening-focused staffing pilot with a labor-cost guardrail. The snapshot alone cannot establish a staffing effect. (The Pennsylvania State University, n.d.-b, n.d.-c).</p>\n<p><b>Excel 365 check.</b> With audited binary values in <code>C2:C101</code>, check <code>=COUNT(C2:C101)</code> is <code>100</code>, <code>=SUM(C2:C101)</code> is <code>24</code>, and every value is 0 or 1. Compute <code>=SUM(C2:C101)/COUNT(C2:C101)</code> for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\hat p</annotation></semantics></math></span>. If <code>E5</code> holds that share and <code>E2</code> holds <code>100</code>, compute <code>=SQRT(E5*(1-E5)/E2)</code> for SE; subtract and add <code>1.96</code> times that cell for endpoints. For a summary-only check, enter <code>=24/100</code> in <code>E5</code>. Excel verifies the arithmetic, not the selection mechanism. Microsoft documents the Excel statistical-function reference used for related checks. (Microsoft, n.d.).</p>\n<p>For <b>advance sample-size planning</b>, specify an acceptable half-width <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span> <i>before</i> collection. For an approximate 95% one-proportion interval, with planning share <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\tilde p</annotation></semantics></math></span>,</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>n</mi><mtext>usable</mtext></msub><mo>≈</mo><msup><mrow><mo fence=\"true\">(</mo><mfrac><mn>1.96</mn><mi>M</mi></mfrac><mo fence=\"true\">)</mo></mrow><mn>2</mn></msup><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">.</mi></mrow><annotation encoding=\"application/x-tex\">n_{\\text{usable}}\\approx\n\\left(\\frac{1.96}{M}\\right)^2\\tilde p(1-\\tilde p).</annotation></semantics></math></span></div></p>\n<p>If Cedar Loop wants roughly <b>±5 percentage points</b> and uses the current <b>respondent estimate</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo>=</mo><mn>0.24</mn></mrow><annotation encoding=\"application/x-tex\">\\tilde p=0.24</annotation></semantics></math></span> as a planning input, then</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>n</mi><mtext>usable</mtext></msub><mo>≈</mo><mo stretchy=\"false\">(</mo><mn>1.96</mn><mi mathvariant=\"normal\">/</mi><mn>0.05</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup><mo stretchy=\"false\">(</mo><mn>0.24</mn><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mn>0.76</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>280.283136</mn><mo separator=\"true\">,</mo></mrow><annotation encoding=\"application/x-tex\">n_{\\text{usable}}\\approx\n(1.96/0.05)^2(0.24)(0.76)\n=280.283136,</annotation></semantics></math></span></div></p>\n<p>so round <b>up to 281 usable pickups</b>. This is an approximate planning calculation, not a guarantee of exactly five points in the eventual interval. If no credible planning share exists, using <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo>=</mo><mn>0.50</mn></mrow><annotation encoding=\"application/x-tex\">\\tilde p=0.50</annotation></semantics></math></span> gives the largest value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\tilde p(1-\\tilde p)</annotation></semantics></math></span>: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.9</mn><msup><mn>6</mn><mn>2</mn></msup><mo stretchy=\"false\">(</mo><mn>0.25</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>0.0</mn><msup><mn>5</mn><mn>2</mn></msup><mo>=</mo><mn>384.16</mn></mrow><annotation encoding=\"application/x-tex\">1.96^2(0.25)/0.05^2=384.16</annotation></semantics></math></span>, rounded up to <b>385 usable pickups</b>. At an assumed 80% usable-response rate, obtaining 281 usable pickups requires planning about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>281</mn><mi mathvariant=\"normal\">/</mi><mn>0.80</mn><mo>=</mo><mn>351.25</mn></mrow><annotation encoding=\"application/x-tex\">281/0.80=351.25</annotation></semantics></math></span>, or <b>352 invitations</b> after rounding up. Inviting more people addresses count, not differential response. Sample-size plans for a mean instead require a planning standard deviation in minutes and a target margin in minutes. (The Pennsylvania State University, n.d.-c).</p>\n<p><b>Failure mode:</b> Reporting “±5%” when the intended margin is <b>five percentage points</b>, or treating 352 invitations as equivalent to 352 usable, representative observations.</p>\n<p><b>Try it — ungraded.</b> With the same planning share and confidence level, what happens to the approximate required usable sample size if the desired margin falls from 0.05 to 0.025?</p>\n<p><b>Answer.</b> The margin is halved and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> depends on <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><msup><mi>M</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">1/M^2</annotation></semantics></math></span>, so the unrounded requirement becomes four times as large: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo stretchy=\"false\">(</mo><mn>280.283136</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>1121.132544</mn></mrow><annotation encoding=\"application/x-tex\">4(280.283136)=1121.132544</annotation></semantics></math></span>. Round up to <b>1,122 usable pickups</b>. This is a precision plan, not a nonresponse fix.</p>"},{"id":"5.2","level":3,"title":"5.2 Optional bridge: differences between periods","short":"5.2. Optional bridge: difference…","html":"<p>A <i>difference</i> needs a defined order and unit. If Cedar Loop’s 100 respondents included 50 morning pickups with 10 slow and 50 evening pickups with 14 slow, those counts would agree with the case’s total of 24. The observed <b>evening minus morning</b> difference would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>14</mn><mi mathvariant=\"normal\">/</mi><mn>50</mn><mo>−</mo><mn>10</mn><mi mathvariant=\"normal\">/</mi><mn>50</mn><mo>=</mo><mn>0.28</mn><mo>−</mo><mn>0.20</mn><mo>=</mo><mn>0.08</mn></mrow><annotation encoding=\"application/x-tex\">14/50-10/50=0.28-0.20=0.08</annotation></semantics></math></span>, or <b>8 percentage points</b>. For independent groups, the illustrative SE of that difference is</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msqrt><mrow><mfrac><mrow><mn>0.28</mn><mo stretchy=\"false\">(</mo><mn>0.72</mn><mo stretchy=\"false\">)</mo></mrow><mn>50</mn></mfrac><mo>+</mo><mfrac><mrow><mn>0.20</mn><mo stretchy=\"false\">(</mo><mn>0.80</mn><mo stretchy=\"false\">)</mo></mrow><mn>50</mn></mfrac></mrow></msqrt><mo>=</mo><msqrt><mn>0.007232</mn></msqrt><mo>≈</mo><mn>0.08504.</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt{\\frac{0.28(0.72)}{50}+\\frac{0.20(0.80)}{50}}\n=\\sqrt{0.007232}\\approx0.08504.</annotation></semantics></math></span></div></p>\n<p>An introductory 95% normal interval is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.08</mn><mo>±</mo><mn>1.96</mn><mo stretchy=\"false\">(</mo><mn>0.08504</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">0.08\\pm1.96(0.08504)</annotation></semantics></math></span>, or approximately <b>−8.7 to 24.7 percentage points</b>. With only 10 morning slow pickups, check whether a normal approximation is suitable before relying on it. The interval includes zero; neither its width nor an observed group difference makes time of day a causal explanation. Comparing mean minutes instead would estimate an <i>evening-minus-morning mean in minutes</i>, using both groups’ standard deviations and sample sizes. These are bridges to later comparison and testing sessions, not a staffing-effect analysis. (The Pennsylvania State University, n.d.-d).</p>\n<p><b>Failure mode:</b> Applying a one-proportion SE to a difference of two independent proportions, or describing an observational difference as the effect of adding staff.</p>\n<p><b>Try it — ungraded.</b> If two independent period estimates were 0.30 and 0.22, what is <i>first minus second</i>, and is that alone a causal result?</p>\n<p><b>Answer.</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo>−</mo><mn>0.22</mn><mo>=</mo><mn>0.08</mn></mrow><annotation encoding=\"application/x-tex\">0.30-0.22=0.08</annotation></semantics></math></span>, or 8 percentage points. It is an observed contrast. Without a suitable design and uncertainty assessment, it is neither a demonstrated population difference nor a causal effect.</p>"},{"id":"5.3","level":3,"title":"5.3 Optional bridge: interval for a difference between mean minutes","short":"5.3. Optional bridge: interval f…","html":"<p>The previous bridge compared <b>proportions of slow pickups</b> in percentage points. A different question compares <b>mean pickup durations</b> in minutes. Suppose the same 100 responding pickups split into 50 morning and 50 evening responses. The morning mean is 40 minutes with sample standard deviation 11 minutes; the evening mean is 44 minutes with sample standard deviation 13 minutes. These fictional group summaries are compatible with the case's rounded overall mean of 42 minutes and standard deviation of about 12 minutes.</p>\n<p><b>Worked example.</b> Define the comparison direction before calculating: evening minus morning. The observed difference is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>44</mn><mo>−</mo><mn>40</mn><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">44-40=4</annotation></semantics></math></span> minutes. For two <i>independent</i> groups, Welch's estimated standard error uses each group's variance separately:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>S</mi><msub><mi>E</mi><mrow><msub><mover accent=\"true\"><mi>x</mi><mo>ˉ</mo></mover><mi>E</mi></msub><mo>−</mo><msub><mover accent=\"true\"><mi>x</mi><mo>ˉ</mo></mover><mi>M</mi></msub></mrow></msub><mo>=</mo><msqrt><mrow><mfrac><mrow><mn>1</mn><msup><mn>3</mn><mn>2</mn></msup></mrow><mn>50</mn></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn><msup><mn>1</mn><mn>2</mn></msup></mrow><mn>50</mn></mfrac></mrow></msqrt><mo>=</mo><msqrt><mn>5.8</mn></msqrt><mo>≈</mo><mn>2.408</mn><mtext> minutes</mtext><mi mathvariant=\"normal\">.</mi></mrow><annotation encoding=\"application/x-tex\">SE_{\\bar x_E-\\bar x_M}\n=\\sqrt{\\frac{13^2}{50}+\\frac{11^2}{50}}\n=\\sqrt{5.8}\\approx2.408\\text{ minutes}.</annotation></semantics></math></span></div></p>\n<p>Welch's degrees of freedom are about 95 here, so the two-sided 95% critical value is about 1.985. The margin is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.985</mn><mo stretchy=\"false\">(</mo><mn>2.408</mn><mo stretchy=\"false\">)</mo><mo>≈</mo><mn>4.78</mn></mrow><annotation encoding=\"application/x-tex\">1.985(2.408)\\approx4.78</annotation></semantics></math></span> minutes. The interval for the <i>evening-minus-morning population mean difference</i> is therefore about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo>±</mo><mn>4.78</mn></mrow><annotation encoding=\"application/x-tex\">4\\pm4.78</annotation></semantics></math></span>, or <b>−0.78 to 8.78 minutes</b>. It includes zero: these responses do not distinguish a positive population difference from zero at this interval's nominal level, even if sampling and response assumptions were satisfied. The unresolved nonresponse also limits that interpretation. Compare the groups' distributions and check for influential duration errors before reporting the interval. The comparison is observational; staffing was not varied, so it cannot estimate a staffing effect (The Pennsylvania State University, n.d.-d).</p>\n<p><b>Excel 365 route.</b> With audited morning minutes in one range and evening minutes in another, obtain each <code>COUNT</code>, <code>AVERAGE</code>, and <code>STDEV.S</code>; calculate <code>=SQRT(s_evening^2/n_evening+s_morning^2/n_morning)</code> from those summaries. Use a verified two-sided Welch critical value and record its degrees of freedom. <b>SPSS route.</b> An independent-samples t-test output can show an unequal-variances row and a confidence interval, but first confirm group coding, valid counts, and direction; do not copy the equal-variances row by habit (IBM, n.d.-c). The hand-calculated <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.408</mn></mrow><annotation encoding=\"application/x-tex\">2.408</annotation></semantics></math></span> SE and approximately <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">[</mo><mo>−</mo><mn>0.78</mn><mo separator=\"true\">,</mo><mn>8.78</mn><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">[-0.78,8.78]</annotation></semantics></math></span> interval are independent checks. Full test selection and effect interpretation belong to S08.</p>\n<p><b>Try it — ungraded.</b> If a colleague reports “morning minus evening = +4 minutes” from these summaries, what is wrong, and what happens to the interval when the subtraction order is reversed?</p>\n<p><b>Answer.</b> Morning minus evening is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn><mo>−</mo><mn>44</mn><mo>=</mo><mo>−</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">40-44=-4</annotation></semantics></math></span> minutes. Reversing the direction changes the signs of both interval endpoints, yielding approximately <b>−8.78 to 0.78 minutes</b>. It does not change the underlying evidence or remove the nonresponse limitation.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>Name the population, period, unit, KPI, target, and decision before estimating anything.</li><li>Audit the sampling frame and preserve one record per eligible pickup.</li><li>Random selection of invitations does not guarantee representative responses.</li><li>Standard deviation describes unit-to-unit spread; standard error describes estimate-to-estimate spread.</li><li>A 95% interval is a repeated-procedure statement, conditional on its assumptions.</li><li>Calculate and report a mean interval in minutes; report a proportion interval in percentage points.</li><li>More usable independent observations usually improve random precision, but do not erase bias.</li><li>Choose sample size from a desired margin and a defensible planning value; round up.</li><li>Cedar Loop’s respondent evidence does not establish that the population exceeds its target or that staffing would change it.</li><li>Check arithmetic in Excel and, when authorized rows exist, SPSS; check provenance and missingness separately.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<div class=\"tbl\"><table><thead><tr><th>Term</th><th>Plain-language meaning</th></tr></thead><tbody><tr><td><b>Population</b></td><td>Every eligible unit covered by the stated question, such as the period’s 2,400 pickups.</td></tr><tr><td><b>Unit</b></td><td>One thing counted or measured; here, one completed pickup.</td></tr><tr><td><b>Sampling frame</b></td><td>The actual list of eligible units available for selection.</td></tr><tr><td><b>Simple random sample</b></td><td>A selection in which every same-sized set of distinct frame units has the same chance.</td></tr><tr><td><b>Stratified sample</b></td><td>Random samples drawn separately within specified, nonoverlapping groups such as morning and evening pickups.</td></tr><tr><td><b>Cluster sample</b></td><td>Randomly selected groups of units, such as pickup waves, with several units observed within each group.</td></tr><tr><td><b>Systematic sample</b></td><td>Selection at a fixed interval on a list after a random start; list cycles can matter.</td></tr><tr><td><b>Parameter</b></td><td>A fixed population quantity of interest, such as the true slow-pickup share.</td></tr><tr><td><b>Statistic</b></td><td>A quantity calculated from a sample, such as 24 slow pickups out of 100 responses.</td></tr><tr><td><b>Point estimate</b></td><td>One sample statistic used to estimate a parameter.</td></tr><tr><td><b>Bias</b></td><td>A systematic tendency for the data process to favor some results.</td></tr><tr><td><b>Nonresponse</b></td><td>A selected unit’s outcome being unavailable for the analysis.</td></tr><tr><td><b>Independence</b></td><td>Observations supplying sufficiently separate information for the stated method.</td></tr><tr><td><b>Standard deviation</b></td><td>A measure of spread among observed values, in the variable’s units.</td></tr><tr><td><b>Sampling distribution</b></td><td>The pattern a statistic would show across repeated samples of the same design.</td></tr><tr><td><b>Standard error</b></td><td>A measure of the spread of that sampling distribution.</td></tr><tr><td><b>Confidence interval</b></td><td>An estimate range produced by a procedure with a stated long-run coverage level.</td></tr><tr><td><b>Welch interval</b></td><td>A two-independent-means interval that estimates each group's variance separately.</td></tr><tr><td><b>Margin of error</b></td><td>Half an interval’s width when the interval is centered on its estimate.</td></tr><tr><td><b>Precision</b></td><td>How narrowly an estimate is reported under its stated procedure; it is not the same as freedom from bias.</td></tr></tbody></table></div>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>IBM. (n.d.-a). <i>CINTERVAL subcommand (EXAMINE command)</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=examine-cinterval-subcommand-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=examine-cinterval-subcommand-command</a></p>\n<p>IBM. (n.d.-b). <i>Overview (EXAMINE command)</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=examine-overview-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=examine-overview-command</a></p>\n<p>IBM. (n.d.-c). <i>Independent-samples T test</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=tests-independent-samples-t-test\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=tests-independent-samples-t-test</a></p>\n<p>Microsoft. (n.d.). <i>Statistical functions (reference)</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/statistical-functions-reference\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/statistical-functions-reference</a></p>\n<p>The Pennsylvania State University. (n.d.-a). <i>Lesson 1: Collecting data</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson01\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson01</a></p>\n<p>The Pennsylvania State University. (n.d.-b). <i>Lesson 4: Confidence intervals</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson04\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson04</a></p>\n<p>The Pennsylvania State University. (n.d.-c). <i>Lesson 8: Inference for one sample</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson08\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson08</a></p>\n<p>The Pennsylvania State University. (n.d.-d). <i>Lesson 9: Inference for two samples</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson09\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson09</a></p>\n<p>The Pennsylvania State University. (n.d.-e). <i>Lesson 1: Estimating population mean and total under SRS</i>. STAT 506: Sampling Theory and Methods. <a href=\"https://online.stat.psu.edu/stat506/Lesson01\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat506/Lesson01</a></p>\n<p>The Pennsylvania State University. (n.d.-f). <i>Lesson 11: Applied problems for survey sampling</i>. STAT 506: Sampling Theory and Methods. <a href=\"https://online.stat.psu.edu/stat506/Lesson11\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat506/Lesson11</a></p>"}]};
globalThis.LESSON_I18N = {"zh":{"Is Cedar Loop Too Slow?":"Cedar Loop 是不是太慢了？","GC1015 · Session 5 · Sampling, bias, confidence intervals, precision":"GC1015 · 第 5 课 · 抽样、偏差、置信区间、精确度","Finish":"完成","Evidence so far":"目前的证据","Sampling distributions and the CLT":"抽样分布与中心极限定理（CLT）","Standard error and precision":"标准误与精确度","Confidence intervals":"置信区间","Case file: Cedar Loop":"案例档案：Cedar Loop","Fictional grocery pickup service. KPI: the share of pickups that take more than 50 minutes from the order-ready message to handoff. Target: at most 20%.":"虚构的杂货自提服务。KPI：从“订单已备好”通知到交给顾客，用时超过 50 分钟的取货单占比。目标：不超过 20%。","Audit step":"核查步骤","Count":"数量","Eligible pickups in the frame (four weeks)":"抽样框中的合格取货单（四周）","Selected and invited":"抽中并邀请","Usable confirmations":"有效确认","Slow (over 50 minutes)":"慢单（超过 50 分钟）","Mean pickup time":"平均取货时长","42 min":"42 分钟","Standard deviation":"标准差","12 min":"12 分钟","Decision: add permanent evening staff now, or audit and run a bounded pilot first.":"决策：现在就增加长期晚班人员，还是先核查并开展限定范围的试点。","Guardrail: a pilot must stay within the approved labor cost per pickup.":"护栏指标：试点必须控制在已批准的每单人工成本之内。","Lab file: cedar_loop_pickups.csv, one row per pickup ID.":"实验文件：cedar_loop_pickups.csv，每个取货单 ID 一行。","Who answered":"谁应答了","Count on screen 2":"在第 2 屏计数","Sampling distribution":"抽样分布","SE of the mean time":"平均时长的 SE","SE of the slow share":"慢单占比的 SE","Nonresponse bounds":"无应答界限","95% interval, mean time":"95% 置信区间，平均时长","95% interval, slow share":"95% 置信区间，慢单占比","Next audit plan":"下一次核查计划","Recommendation":"建议","Is Cedar Loop too slow?":"Cedar Loop 是不是太慢了？","Your gut call, before any math: should Cedar Loop add permanent evening staff now?":"先不算，凭直觉判断：Cedar Loop 现在应该增加长期晚班人员吗？","Cedar Loop is a fictional grocery pickup service. Its manager wants at most 20% of pickups to take more than 50 minutes, from the order-ready message to handoff.":"Cedar Loop 是一家虚构的杂货自提服务。经理希望从“订单已备好”通知到交给顾客，用时超过 50 分钟的取货单不超过 20%。","An audit selected 125 of the 2,400 pickups from a four-week period. 100 customers confirmed their records, and 24 of those pickups were slow.":"一次核查从四周内的 2,400 笔取货中抽取了 125 笔。100 位顾客确认了自己的记录，其中 24 笔取货是慢单。","Noted. We will check your call against the evidence at the end.":"已记录。最后我们会用证据来检验你的判断。","Yes, add permanent evening staff now":"是，现在就增加长期晚班人员","No, keep staffing as it is":"否，维持现有人手","I need more information first":"我需要先了解更多信息","Count before you calculate":"先计数，再计算","This is the lab file, <code>cedar_loop_pickups.csv</code>: one row for each of the 2,400 pickup IDs in the frame. A blank cell means no observed outcome. It is not a zero.":"这是实验文件 <code>cedar_loop_pickups.csv</code>：抽样框中 2,400 个取货单 ID 各占一行。空白单元格表示没有观察到结果，它不是零。","Use the filters to count the rows.":"用筛选器统计行数。","<p>125 pickups were invited, 100 gave usable confirmations, and 24 of those were slow. So the usable-response rate is 100 / 125 = 80%, and the respondent share is 24 / 100 = 24%.</p>\n          <p>The other 2,275 rows were never invited. Their blank flags do not mean \"on time\". Those pickups were simply not in the sample.</p>":"<p>共邀请了 125 笔取货，其中 100 笔给出了有效确认，这些确认中有 24 笔是慢单。所以有效应答率是 100 / 125 = 80%，应答者中的慢单占比是 24 / 100 = 24%。</p>\n          <p>其余 2,275 行从未被邀请。它们的空白标记并不代表“准时”，这些取货单只是不在样本中。</p>","invited pickups = responded + nonresponse = {{inv}}":"受邀取货单 = responded + nonresponse = {{inv}}","usable responses (responded) = {{resp}}":"有效应答（responded） = {{resp}}","slow responses (responded, delay_flag = 1) = {{slow}}":"慢单应答（responded，delay_flag = 1） = {{slow}}","Filter invitation_status to responded (100 rows), then to nonresponse (25 rows), and add them.":"先把 invitation_status 筛选为 responded（100 行），再筛选为 nonresponse（25 行），然后把两者相加。","Invited pickups":"受邀取货单","Set invitation_status to responded and read the row count.":"把 invitation_status 设为 responded，然后读取行数。","Usable responses":"有效应答","Keep invitation_status = responded and set delay_flag = 1.":"保持 invitation_status = responded，再设 delay_flag = 1。","Slow responses":"慢单应答","125 invited, 100 usable (80%), 24 slow":"邀请 125，有效 100（80%），慢单 24","Name the population first":"先明确总体","Before any formula, say whom the number is about. The manager’s question is about eligible pickups in this four-week period.":"在用任何公式之前，先说清楚这个数字描述的是谁。经理的问题针对的是这四周内的合格取货单。","Drag each description to its term. Two tiles do not belong anywhere.":"把每条描述拖到对应的术语上。有两张卡片不属于任何位置。","<p>The <b>population</b> is every eligible pickup in the period. The <b>frame</b> is the list you can actually draw from, so audit it: no duplicate IDs, no canceled orders. The <b>parameter</b> p is fixed but unknown. The <b>statistic</b> p̂ = 0.24 estimates it, and a different sample would give a different p̂.</p>\n          <p>\"All future customers\" is a broader population than this four-week list. These data cannot speak for it without more assumptions.</p>":"<p><b>总体</b>是这一时期内的每一笔合格取货。<b>抽样框</b>是你实际能从中抽样的名单，所以要核查它：没有重复 ID，没有已取消的订单。<b>参数</b> p 是固定的，但未知。<b>统计量</b> p̂ = 0.24 是对它的估计，换一个样本就会得到不同的 p̂。</p>\n          <p>“所有未来顾客”是比这份四周名单更广的总体。没有更多假设，这些数据无法代表它。</p>","p̂ = 24 / 100 = 0.24, from the usable responses":"p̂ = 24 / 100 = 0.24，来自有效应答","All future Cedar Loop customers":"所有未来的 Cedar Loop 顾客","All 2,400 eligible pickups in the four weeks":"四周内全部 2,400 笔合格取货","p, the true slow share of those 2,400 pickups":"p，这 2,400 笔取货的真实慢单占比","The 24 slow pickups":"那 24 笔慢单","The deduplicated list of 2,400 pickup IDs":"去重后的 2,400 个取货单 ID 名单","Population":"总体","Sampling frame":"抽样框","Parameter<br><small>fixed, unknown</small>":"参数<br><small>固定，未知</small>","Statistic<br><small>changes from sample to sample</small>":"统计量<br><small>随样本而变化</small>","That group is broader than the question. The audit covers eligible pickups in the four-week period only.":"这个群体比问题所问的范围更广。核查只涵盖这四周内的合格取货。","That is a count inside the sample. A statistic is a summary of the sample, such as the share 24 / 100.":"这是样本内的一个计数。统计量是对样本的概括，比如占比 24 / 100。","p is the population value. It is fixed but unknown. The sample gives an estimate of it, p̂.":"p 是总体的值，它固定但未知。样本给出它的估计值 p̂。","p̂ comes from one sample, so another sample would give a different value. The parameter does not change.":"p̂ 来自一个样本，换一个样本就会得到不同的值。参数则不会改变。","The frame is the list you can draw from. The population is the pickups themselves.":"抽样框是你能从中抽样的名单。总体是这些取货单本身。","The frame is the actual list of IDs. You audit it for duplicates and canceled orders.":"抽样框是实际的 ID 名单。你要核查其中有无重复和已取消的订单。","The Monday morning shortcut":"周一上午的捷径","To save time, a supervisor suggests auditing the first 125 pickups from Monday morning instead.":"为了省时间，一位主管建议改为核查周一上午的前 125 笔取货。","What kind of selection is that, and can a confidence interval fix it?":"这属于哪种选取方式？置信区间能弥补它吗？","<p>Taking the first 125 records from one morning is a convenience selection, not a probability design. Evening pickups, the very ones the manager worries about, could never be chosen.</p>\n          <p>An interval built from those 125 describes chance variation under assumptions they do not meet. It cannot repair the missing periods.</p>":"<p>取某一个上午的前 125 条记录属于便利抽样（便利选取），而不是概率抽样设计。晚间的取货，也就是经理最担心的那部分，根本不可能被抽中。</p>\n          <p>用这 125 笔建立的区间，描述的是在某些假设下的随机变异，而这些数据并不满足那些假设。它无法弥补缺失的时段。</p>","Convenience selection. It misses other times, and no interval can repair that.":"便利抽样。它漏掉了其他时段，任何区间都无法弥补。","Simple random, because every pickup on the list could be chosen.":"简单随机抽样，因为名单上的每一笔取货都可能被抽中。","Evening and other-day pickups had no chance at all. Probability sampling needs a known, non-zero chance for every unit in the frame.":"晚间和其他日子的取货完全没有机会被抽中。概率抽样要求抽样框中的每个单位都有已知且非零的入选机会。","Systematic, because Monday orders arrive in time order.":"系统抽样，因为周一的订单按时间顺序到达。","A systematic sample starts at a random point and steps through the whole list, for example every 20th ID.":"系统抽样从一个随机起点开始，按固定间隔走完整份名单，例如每隔 20 个 ID 抽一个。","Fine, as long as the interval is narrow.":"没问题，只要区间够窄。","A narrow interval only measures chance variation around those 125 pickups. It cannot add the periods that were left out.":"窄区间只衡量这 125 笔取货周围的随机变异。它无法补上被遗漏的时段。","Freeze the random draw":"固定随机抽样结果","Ana sorted the frame by <code>=RAND()</code>, kept the first IDs and saved the file. The next day, the selected IDs had changed.":"Ana 按 <code>=RAND()</code> 对抽样框排序，保留了前面的 ID 并保存了文件。第二天，被抽中的 ID 变了。","Try the mini frame above. What should Ana have done?":"试试上面的迷你抽样框。Ana 本应怎么做？","<p>Add <code>=RAND()</code> beside each unique ID, calculate once, and paste that column <b>as values</b>. Then sort, keep the first 125, and save the frozen numbers, the selected IDs, the frame date and the draw date.</p>\n          <p>Reopening the saved file then reproduces exactly which IDs were selected. Also check that there are exactly 125 distinct IDs and that each one is in the frame.</p>":"<p>在每个唯一 ID 旁边加上 <code>=RAND()</code>，计算一次，然后把这一列<b>粘贴为数值</b>。接着排序，保留前 125 个，并保存固定下来的随机数、抽中的 ID、抽样框日期和抽样日期。</p>\n          <p>这样，重新打开保存的文件，就能准确重现抽中了哪些 ID。还要检查是否正好有 125 个不重复的 ID，并且每个都在抽样框中。</p>","Paste the RAND column as values before sorting, then save the list":"排序前先把 RAND 列粘贴为数值，再保存名单","Sort again until the same IDs come back":"反复排序，直到相同的 ID 重新出现","RAND() makes new numbers every time the sheet recalculates. The old draw cannot be found again.":"工作表每次重新计算，RAND() 都会生成新的随机数。原来的抽样结果再也找不回来。","Keep the first IDs in the original frame order instead":"改为按抽样框原有顺序保留前面的 ID","Then the list order decides who is selected. That is not random selection.":"那样的话，由名单顺序决定谁被抽中。这不是随机选取。","Use RANDBETWEEN, which does not recalculate":"改用 RANDBETWEEN，它不会重新计算","RANDBETWEEN also recalculates. Only numbers pasted as values stay fixed.":"RANDBETWEEN 也会重新计算。只有粘贴为数值的数字才会保持不变。","Make sure evenings are in":"确保晚间被纳入","Suppose the audited frame holds 1,440 morning and 960 evening pickups. The manager worries about evenings, so you split the frame by period and draw randomly within each one.":"假设核查的抽样框中有 1,440 笔上午取货和 960 笔晚间取货。经理担心晚间，所以你按时段把抽样框分开，并在每个时段内随机抽取。","Allocate the 125 invitations in proportion to each period.":"按各时段的比例分配这 125 份邀请。","<p>This is a <b>stratified</b> design: random draws within each period, so both periods are sure to appear. Combine the results using each period’s share of the population.</p>\n          <p>It protects evening representation at the invitation stage. It does not make the eventual responses representative if one period answers less often. For comparison, a systematic draw of every 20th ID gives 2,400 / 20 = 120 IDs, not 125.</p>":"<p>这是<b>分层抽样</b>设计：在每个时段内随机抽取，因此两个时段都一定会出现。合并结果时，按每个时段在总体中的占比加权。</p>\n          <p>它在邀请阶段保证了晚间的代表性。但如果某个时段的应答更少，最终的应答仍不具代表性。作为对比，每隔 20 个 ID 抽一个的系统抽样会得到 2,400 / 20 = 120 个 ID，而不是 125 个。</p>","morning share = 1,440 / 2,400 = {{ms}}":"上午占比 = 1,440 / 2,400 = {{ms}}","morning invitations = 0.60 × 125 = {{m}}":"上午邀请数 = 0.60 × 125 = {{m}}","evening invitations = 0.40 × 125 = {{e}}":"晚间邀请数 = 0.40 × 125 = {{e}}","Morning share":"上午占比","Morning invitations":"上午邀请数","0.40 × 125 = 50. Check: 75 + 50 = 125.":"0.40 × 125 = 50。检查：75 + 50 = 125。","Evening invitations":"晚间邀请数","Watch sample means pile up":"看样本均值如何堆积","Only a simulation can show a whole population. This one imagines pickup times with a long right tail, a mean of 42 minutes and an SD of 12, like the sample.":"只有模拟才能展示整个总体。这个模拟设想的取货时长呈右偏、右侧长尾，均值为 42 分钟，SD 为 12，与样本一致。","Draw 100 samples at n = 1, then switch to n = 100 and draw again. What happens to the histogram of sample means?":"在 n = 1 时抽取 100 个样本，然后切换到 n = 100 再抽一次。样本均值的直方图会发生什么变化？","The population is imagined for the simulation. In real work you see one sample and never the whole population.":"这个总体是为模拟而设想的。在实际工作中，你只能看到一个样本，永远看不到整个总体。","<p>Each sample gives one mean. The pattern of those means across many samples is the <b>sampling distribution</b>. By the <b>central limit theorem</b>, it gets close to a normal bell as n grows, even when single pickup times are skewed.</p>\n          <p>Its spread is the <b>standard error</b>, 12 / √n: 12 at n = 1, 6 at n = 4, 2.4 at n = 25 and 1.2 at n = 100. The CLT does not remove selection bias, and it does not make related records independent.</p>":"<p>每个样本给出一个均值。这些均值在许多样本中呈现的分布就是<b>抽样分布</b>。根据<b>中心极限定理</b>，随着 n 增大，它会接近正态钟形，即使单笔取货时长是偏态的。</p>\n          <p>它的离散程度就是<b>标准误</b>，即 12 / √n：n = 1 时为 12，n = 4 时为 6，n = 25 时为 2.4，n = 100 时为 1.2。中心极限定理（CLT）不能消除选择偏差，也不能让相互关联的记录变得独立。</p>","It becomes a narrow bell centered near 42 minutes":"它变成一个以 42 分钟附近为中心的窄钟形","It keeps the long right tail of the pickup times":"它保留取货时长的右侧长尾","That is true at n = 1, where each \"mean\" is a single pickup. At n = 100 the tail disappears. Draw again and compare.":"在 n = 1 时确实如此，因为每个“均值”只是一笔取货。到 n = 100 时，长尾就消失了。再抽一次比较看看。","It spreads out more, because more pickups add more variation":"它更分散，因为更多取货带来更多变异","Watch the SD of the means in the readout. It shrinks as n grows: about 12 at n = 1 and about 1.2 at n = 100.":"看读数中均值的 SD。它随 n 增大而缩小：n = 1 时约为 12，n = 100 时约为 1.2。","It shifts right, toward the slow pickups":"它向右移，靠向慢单","The center stays near 42 at every n. Only the spread and the shape change.":"无论 n 是多少，中心都保持在 42 附近。变化的只有离散程度和形状。","Means form a bell near 42; spread 12 / √n":"均值在 42 附近形成钟形；离散程度 12 / √n","Two kinds of spread":"两种离散程度","Cedar Loop’s 100 usable pickup times have a standard deviation of 12 minutes. The standard error of their mean is 1.20 minutes.":"Cedar Loop 的 100 个有效取货时长的标准差是 12 分钟。它们均值的标准误是 1.20 分钟。","Drag each tile into the matching cell.":"把每张卡片拖到匹配的格子里。","<p>The <b>standard deviation</b>, 12 minutes, describes how single pickups vary around 42 minutes. The <b>standard error</b>, 1.20 minutes, describes the estimate: how much the mean of 100 pickups would move between comparable samples.</p>\n          <p>Four times the sample halves the SE: 12 / √400 = 0.60 minutes. The SD stays near 12, because pickups do not become more alike.</p>":"<p><b>标准差</b>为 12 分钟，描述单笔取货围绕 42 分钟的变异。<b>标准误</b>为 1.20 分钟，描述的是估计值：100 笔取货的均值在可比样本之间会变动多少。</p>\n          <p>样本扩大到四倍，SE 减半：12 / √400 = 0.60 分钟。SD 仍在 12 附近，因为取货单之间并不会变得更相似。</p>","How much the sample mean moves from sample to sample":"样本均值在不同样本之间变动多少","Stays near 12 minutes":"保持在 12 分钟附近","How much single pickup times vary":"单笔取货时长的变异有多大","Halves, to 0.60 minutes":"减半，降到 0.60 分钟","Measure ↓   Question →":"度量 ↓   问题 →","s = 12 minutes<br><small>standard deviation</small>":"s = 12 分钟<br><small>标准差</small>","SE = 1.20 minutes<br><small>standard error of the mean</small>":"SE = 1.20 分钟<br><small>均值的标准误</small>","What does it describe?":"它描述什么？","If n grew from 100 to 400?":"如果 n 从 100 增加到 400？","Single pickups vary by about 12 minutes. The SE is about the mean, which varies much less.":"单笔取货的变异约为 12 分钟。SE 针对的是均值，而均值的变异要小得多。","The SD describes single pickups. The sample-to-sample movement of the mean is the SE.":"SD 描述的是单笔取货。均值在不同样本之间的变动才是 SE。","More data does not make single pickups less variable, but it does make the mean steadier. So the SE shrinks.":"更多数据不会让单笔取货的变异变小，但会让均值更稳定。所以 SE 会缩小。","The SD estimates how much pickup times vary. More data estimates that spread better, but it does not shrink it.":"SD 估计的是取货时长的变异有多大。更多数据能把这个离散程度估计得更准，但不会让它缩小。","Compute the standard error":"计算标准误","100 usable pickup times, with sample SD s = 12 minutes. For a mean, SE = s / √n.":"100 个有效取货时长，样本 SD s = 12 分钟。对于均值，SE = s / √n。","Fill in both lines.":"填写这两行。","<p>SE = 12 / √100 = 1.20 minutes. Dividing by n instead of √n gives 0.12 minutes and claims ten times too much precision.</p>\n          <p>At n = 400, SE = 0.60: four times the sample, half the SE. That assumes 400 truly separate pickups. Copying the 100 rows four times would not count. In Excel: <code>=E4/SQRT(E2)</code>.</p>":"<p>SE = 12 / √100 = 1.20 分钟。如果除以 n 而不是 √n，会得到 0.12 分钟，把精确度夸大了十倍。</p>\n          <p>n = 400 时，SE = 0.60：样本扩大到四倍，SE 减半。这假设有 400 笔真正相互独立的取货。把那 100 行复制四遍并不算数。在 Excel 中：<code>=E4/SQRT(E2)</code>。</p>","SE = 12 / √100 = 12 / {{root}} = {{se}} minutes":"SE = 12 / √100 = 12 / {{root}} = {{se}} 分钟","with 400 comparable pickups: SE = 12 / √400 = {{se4}} minutes":"若有 400 笔可比的取货：SE = 12 / √400 = {{se4}} 分钟","√100 = 10, because 10 × 10 = 100.":"√100 = 10，因为 10 × 10 = 100。","Square root of 100":"100 的平方根","12 ÷ 10 = 1.20. If you got 0.12, you divided by n instead of √n.":"12 ÷ 10 = 1.20。如果你得到 0.12，说明你除以的是 n 而不是 √n。","Standard error":"标准误","√400 = 20, so 12 ÷ 20 = 0.60.":"√400 = 20，所以 12 ÷ 20 = 0.60。","Standard error at n = 400":"n = 400 时的标准误","12 / √100 = 1.20 min":"12 / √100 = 1.20 分钟","Precision costs √n":"精确度的代价是 √n","Keep s = 12 minutes. Only the number of usable pickups changes.":"保持 s = 12 分钟不变。只改变有效取货单的数量。","Drag n along the curve. What is the smallest sample whose standard error is at most 0.60 minutes?":"沿曲线拖动 n。标准误不超过 0.60 分钟的最小样本量是多少？","<p>12 / √400 = 0.60 exactly, while n = 399 gives 0.6008. Halving the SE took four times the data, because the SE shrinks with √n, not with n.</p>\n          <p>So each extra step of precision gets expensive. The next screens ask whether precision is even the main problem.</p>":"<p>12 / √400 正好等于 0.60，而 n = 399 时为 0.6008。要让 SE 减半，需要四倍的数据，因为 SE 随 √n 缩小，而不是随 n 缩小。</p>\n          <p>所以每多提高一步精确度，代价都会越来越高。接下来几屏会问：精确度究竟是不是主要问题。</p>","Standard error of a share":"占比的标准误","For the slow share, p̂ = 0.24 from n = 100 usable pickups. For a share, SE = √( p̂(1 − p̂) / n ).":"对于慢单占比，p̂ = 0.24，来自 n = 100 笔有效取货。对于占比，SE = √( p̂(1 − p̂) / n )。","Fill in the steps. Keep five decimals in the SE.":"填写各个步骤。SE 保留五位小数。","<p>SE ≈ 0.04271, or about 4.27 percentage points. It is the typical sample-to-sample movement of the estimated share, assuming an approximately independent random sample.</p>\n          <p>In Excel, with the share in E5 and n in E2: <code>=SQRT(E5*(1-E5)/E2)</code>.</p>":"<p>SE ≈ 0.04271，约为 4.27 个百分点。它是估计占比在不同样本之间的典型变动幅度，前提是样本是近似独立的随机样本。</p>\n          <p>在 Excel 中，若占比在 E5、n 在 E2：<code>=SQRT(E5*(1-E5)/E2)</code>。</p>","p̂(1 − p̂) / n = 0.24 × 0.76 / 100 = {{v}}":"p̂(1 − p̂) / n = 0.24 × 0.76 / 100 = {{v}}","SE = √0.001824 = {{se}}":"SE = √0.001824 = {{se}}","in percentage points: SE ≈ {{pts}} points":"换算成百分点：SE ≈ {{pts}} 个百分点","0.24 × 0.76 = 0.1824. Then divide by 100.":"0.24 × 0.76 = 0.1824。再除以 100。","p-hat times one minus p-hat over n":"p-hat 乘以（一减 p-hat），再除以 n","The square root of 0.001824 is about 0.04271.":"0.001824 的平方根约为 0.04271。","Standard error of the share":"占比的标准误","0.04271 is a share. Times 100, it is 4.27 percentage points.":"0.04271 是占比。乘以 100，就是 4.27 个百分点。","Standard error in percentage points":"以百分点表示的标准误","0.04271 (4.27 points)":"0.04271（4.27 个百分点）","What does 4.27 points mean?":"4.27 个百分点是什么意思？","The standard error of Cedar Loop’s slow share is about 0.0427, or 4.27 percentage points.":"Cedar Loop 慢单占比的标准误约为 0.0427，即 4.27 个百分点。","What does 4.27 points describe?":"4.27 个百分点描述的是什么？","<p>4.27 points is the spread of the sampling distribution of p̂: how far shares from comparable samples of 100 typically land from the true share. It is not a probability about one pickup, and it is not the spread of pickup times.</p>":"<p>4.27 个百分点是 p̂ 抽样分布的离散程度：规模为 100 的可比样本所得的占比，通常离真实占比有多远。它不是关于某一笔取货的概率，也不是取货时长的离散程度。</p>","How much the sample share would typically move from sample to sample":"样本占比在不同样本之间通常会变动多少","The chance that any one pickup is slow":"任意一笔取货成为慢单的概率","That chance is the share itself, about 24%. The SE measures how much the estimate wobbles.":"这个概率就是占比本身，约为 24%。SE 衡量的是估计值的波动幅度。","How far single pickup times spread around 42 minutes":"单笔取货时长围绕 42 分钟的分散程度","That is the standard deviation, 12 minutes. This SE is about the share, in percentage points.":"那是标准差，12 分钟。这里的 SE 针对的是占比，单位是百分点。","The most the true share can differ from 24%":"真实占比与 24% 之间的最大差距","The truth can be further away. A 95% margin is about 1.96 SEs, and even that is not a hard limit.":"真实值可能离得更远。95% 的误差范围约为 1.96 个 SE，即使这样也不是硬性上限。","What if the 25 had answered?":"如果那 25 位顾客作答了呢？","25 of the 125 invited pickups have no usable confirmation. Busy customers with slow pickups might be the ones who did not reply.":"125 笔受邀取货中，有 25 笔没有有效确认。没有回复的，可能恰恰是取货慢、又很忙的顾客。","Explore with the slider. Then fill in the two extreme cases for all 125 selected pickups.":"用滑块探索一下。然后针对全部 125 笔抽中的取货，填写两种极端情况。","<p>Holding the 24 observed slow pickups fixed, the share among the 125 selected runs from 19.2% (none of the 25 slow) to 39.2% (all 25 slow). That range crosses the 20% target.</p>\n          <p>These are <b>sensitivity bounds</b> under extreme assumptions about missing outcomes. They are not a 95% confidence interval, and they do not yet describe all 2,400 pickups.</p>":"<p>保持已观察到的 24 笔慢单不变，125 笔抽中取货中的慢单占比介于 19.2%（25 笔中没有慢单）到 39.2%（25 笔全是慢单）之间。这个范围跨过了 20% 的目标。</p>\n          <p>这些是在关于缺失结果的极端假设下得到的<b>敏感性界限</b>。它们不是 95% 置信区间，也还不能描述全部 2,400 笔取货。</p>","none of the 25 slow: (24 + 0) / 125 = {{lo}} %":"25 笔中没有慢单：(24 + 0) / 125 = {{lo}} %","all 25 slow: (24 + 25) / 125 = {{hi}} %":"25 笔全是慢单：(24 + 25) / 125 = {{hi}} %","24 ÷ 125 = 0.192, which is 19.2%. Divide by all 125 invited, not by the 100 who answered.":"24 ÷ 125 = 0.192，即 19.2%。要除以全部 125 笔受邀取货，而不是 100 位作答者。","Best-case share in percent":"最好情况占比（百分比）","(24 + 25) ÷ 125 = 49 ÷ 125 = 0.392, which is 39.2%.":"(24 + 25) ÷ 125 = 49 ÷ 125 = 0.392，即 39.2%。","Worst-case share in percent":"最坏情况占比（百分比）","19.2% to 39.2% of the 125 selected":"125 笔抽中取货的 19.2% 至 39.2%","How many would tip it?":"多少笔会改变结论？","The target is at most 20% slow. Among the 125 selected, 24 slow pickups are already known.":"目标是慢单不超过 20%。在 125 笔抽中的取货中，已知有 24 笔慢单。","Drag the slider. What is the smallest number of slow nonrespondents that puts the selected set above the 20% target?":"拖动滑块。未应答者中至少要有几笔慢单，才会让抽中的这组取货超过 20% 的目标？","<p>With 1 slow nonrespondent, 25 / 125 = 20.0%, which meets \"at most 20%\". With 2, 26 / 125 = 20.8%, above it. So the verdict on the selected set hangs on just 2 of the 25 missing pickups.</p>\n          <p>That is why following up nonrespondents can matter more than another decimal place in an interval. If follow-up found 10 of the 25 slow, the share would be 34 / 125 = 27.2%.</p>":"<p>若未应答者中有 1 笔慢单，25 / 125 = 20.0%，符合“不超过 20%”。若有 2 笔，26 / 125 = 20.8%，就超过了目标。所以对这组抽中取货的结论，只取决于 25 笔缺失取货中的 2 笔。</p>\n          <p>这就是为什么追访未应答者，可能比让区间多精确一位小数更重要。如果追访发现 25 笔中有 10 笔是慢单，占比就是 34 / 125 = 27.2%。</p>","Can a bigger sample fix it?":"更大的样本能解决问题吗？","A manager proposes emailing 1,000 more customers the same way, with no follow-up of people who do not reply.":"一位经理提议用同样的方式再给 1,000 位顾客发邮件，并且不追访没有回复的人。","What does the bigger sample fix?":"更大的样本能解决什么？","<p>Sampling error is chance variation, and it shrinks with √n. Bias is a systematic pull in one direction, and more of the same data repeats it. If customers with slow pickups tend not to reply, every bigger sample of repliers still understates the slow share.</p>\n          <p><b>Precision is not representativeness.</b> A narrow interval from a biased group can be confidently wrong. Better fixes: follow up nonrespondents and compare them with respondents on permitted frame fields.</p>":"<p>抽样误差是随机变异，它随 √n 缩小。偏差是朝一个方向的系统性偏移，用同样方式收集的更多数据只会重复它。如果取货慢的顾客往往不回复，那么无论回复者样本多大，都仍会低估慢单占比。</p>\n          <p><b>精确度不等于代表性。</b>来自有偏群体的窄区间，可能信心十足却是错的。更好的做法：追访未应答者，并在允许使用的抽样框字段上把他们与应答者进行比较。</p>","Random sampling error shrinks, but nonresponse bias can remain":"随机抽样误差会缩小，但无应答偏差可能依然存在","Both random error and nonresponse bias shrink":"随机误差和无应答偏差都会缩小","If busy customers with slow pickups skip the email, more invitations repeat the same gap.":"如果取货慢、又很忙的顾客不理会邮件，更多的邀请只会重复同样的缺口。","Nonresponse bias, because large numbers cancel errors out":"无应答偏差，因为大数量会让误差相互抵消","Random errors average out. A systematic gap does not: it pulls every sample the same way.":"随机误差会在平均中相互抵消。系统性缺口不会：它会把每个样本都往同一个方向拉。","Nothing, because sample size never changes precision":"什么也解决不了，因为样本量从不改变精确度","The SE falls with √n, so precision does improve. The problem is bias, not precision.":"SE 随 √n 下降，所以精确度确实会提高。问题在于偏差，而不是精确度。","Are the 100 really separate?":"这 100 笔真的彼此独立吗？","Suppose the audit finds several pickups from the same daily customers, and a cluster of pickups during one system outage.":"假设核查发现，有几笔取货来自同几位每天下单的常客，还有一批取货集中发生在一次系统故障期间。","What does this do to a simple interval that treats all 100 pickups as independent?":"对于一个把全部 100 笔取货都当作独立的简单区间，这会产生什么影响？","<p>Independence asks whether records carry separate information. Pickups by the same customer, or many pickups during one outage, can move together. Treating them as 100 separate pieces of evidence makes the SE, and the interval, too narrow.</p>\n          <p>Check repeat customer IDs and service incidents with authorized, privacy-protected data. Do not export customer names into a student workbook.</p>":"<p>独立性问的是：各条记录是否携带各自独立的信息。同一位顾客的多次取货，或一次故障期间的大量取货，可能会同向变动。把它们当作 100 条彼此独立的证据，会让 SE 以及区间都过窄。</p>\n          <p>请使用经授权、受隐私保护的数据，检查重复出现的顾客 ID 和服务事故。不要把顾客姓名导出到学生工作簿中。</p>","It can be too narrow, because related pickups add less separate information":"区间可能过窄，因为相互关联的取货提供的独立信息更少","Nothing, because each pickup has its own ID":"没有影响，因为每笔取货都有自己的 ID","Unique IDs stop literal duplicates. Pickups by the same customer or during one outage can still move together.":"唯一 ID 只能防止完全重复的记录。同一位顾客的取货，或同一次故障期间的取货，仍可能同向变动。","It makes the interval too wide":"它会让区间过宽","Related records carry less new information than their count suggests. The real uncertainty is larger, not smaller.":"相互关联的记录所携带的新信息，比它们的数量看起来要少。真实的不确定性更大，而不是更小。","It is fixed by deleting the outage night":"删掉故障那一晚的数据就能解决","Deleting data to remove a pattern changes the population. Report it and use a method that allows for it.":"为消除某种模式而删除数据，会改变总体。应如实报告，并使用能考虑这种情况的方法。","Find t* in the table":"在表中查找 t*","For a mean with an unknown population SD, a 95% interval uses t* with n − 1 degrees of freedom. Each row is a df. Each column is the total area in both tails.":"当总体 SD 未知时，均值的 95% 置信区间使用自由度为 n − 1 的 t*。每一行是一个 df，每一列是两个尾部的总面积。","Cedar Loop has n = 100 usable pickups. Tap the cell for its df and a 95% interval.":"Cedar Loop 有 n = 100 笔有效取货。点击与其 df 和 95% 置信区间对应的格子。","<p>Row 99, column 0.05 gives t* = 1.984, the cut-off that leaves 2.5% in each tail. Excel gives more decimals: <code>=T.INV.2T(0.05, 99)</code> = 1.9842.</p>\n          <p>Compare the ∞ row: 1.960, the z value. With 99 df, t* is only a little larger than z, because the sample SD comes from many pickups.</p>":"<p>第 99 行、0.05 列给出 t* = 1.984，这个临界值让每个尾部各留下 2.5%。Excel 给出的小数位更多：<code>=T.INV.2T(0.05, 99)</code> = 1.9842。</p>\n          <p>对比 ∞ 这一行：1.960，也就是 z 值。df 为 99 时，t* 只比 z 稍大一点，因为样本 SD 来自很多笔取货。</p>","Build the 95% interval for the mean":"构建均值的 95% 置信区间","Mean 42 minutes, SE 1.20 minutes, t* = 1.9842.":"均值 42 分钟，SE 1.20 分钟，t* = 1.9842。","Compute the margin, then both ends. Use two decimals for the ends.":"先算误差范围，再算两个端点。端点保留两位小数。","<p>The 95% interval is 42 ± 2.38, or <b>39.62 to 44.38 minutes</b>, for the mean pickup time of eligible pickups in the period. It assumes a defensible sampling and response process, which Cedar Loop has not yet shown.</p>\n          <p>Excel: <code>=E3-T.INV.2T(0.05,E2-1)*E4/SQRT(E2)</code>, and the same with + for the upper end. SPSS: <code>EXAMINE VARIABLES=duration /STATISTICS=DESCRIPTIVES /CINTERVAL 95.</code> and read \"95% Confidence Interval for Mean\".</p>":"<p>这一时期合格取货的平均取货时长，其 95% 置信区间为 42 ± 2.38，即 <b>39.62 到 44.38 分钟</b>。它假设抽样和应答过程站得住脚，而 Cedar Loop 尚未证明这一点。</p>\n          <p>Excel：<code>=E3-T.INV.2T(0.05,E2-1)*E4/SQRT(E2)</code>，上端点用 + 代替减号，其余相同。SPSS：<code>EXAMINE VARIABLES=duration /STATISTICS=DESCRIPTIVES /CINTERVAL 95.</code>，然后读取“95% Confidence Interval for Mean”（均值置信区间）。</p>","margin M = 1.9842 × 1.20 = {{m}} minutes":"误差范围 M = 1.9842 × 1.20 = {{m}} 分钟","lower end = 42 − M = {{lo}} minutes":"下端点 = 42 − M = {{lo}} 分钟","upper end = 42 + M = {{hi}} minutes":"上端点 = 42 + M = {{hi}} 分钟","1.9842 × 1.20 ≈ 2.381 minutes.":"1.9842 × 1.20 ≈ 2.381 分钟。","Margin of error":"误差范围","42 − 2.381 = 39.619, about 39.62.":"42 − 2.381 = 39.619，约为 39.62。","Lower end":"下端点","42 + 2.381 = 44.381, about 44.38.":"42 + 2.381 = 44.381，约为 44.38。","Upper end":"上端点","39.62 to 44.38 min":"39.62 到 44.38 分钟","What does 95% promise?":"95% 承诺了什么？","Each line below is a 95% interval from a new simulated sample of 100 pickups. Green lines cover the true mean of the imagined population. Amber lines miss it.":"下面每条线都是一个 95% 置信区间，来自一个新的模拟样本，每个样本含 100 笔取货。绿色线覆盖了设想总体的真实均值，琥珀色线没有覆盖。","Draw a few batches. Which sentence about Cedar Loop’s interval, 39.62 to 44.38 minutes, is correct?":"抽几批看看。关于 Cedar Loop 的区间（39.62 到 44.38 分钟），哪句话是正确的？","<p>\"95%\" describes the <b>procedure</b>: across many samples, about 95% of intervals built this way cover the fixed true mean. In this simulation, 95 of the first 100 do.</p>\n          <p>Once it is computed, Cedar Loop’s interval either covers the true mean or it does not, and we cannot tell which. It is also not a range for single pickups, which vary with an SD of 12 minutes.</p>":"<p>“95%”描述的是<b>方法</b>：在许多样本中，用这种方法构建的区间约有 95% 会覆盖固定的真实均值。在这个模拟中，前 100 个区间里有 95 个覆盖了。</p>\n          <p>一旦算出来，Cedar Loop 的区间要么覆盖真实均值，要么没有，而我们无法知道是哪一种。它也不是单笔取货的范围，单笔取货的 SD 是 12 分钟。</p>","The method captures the true mean in about 95% of repeated samples":"在重复抽样中，这种方法约有 95% 的次数能捕捉到真实均值","There is a 95% chance the true mean is in this interval":"真实均值有 95% 的概率落在这个区间内","The true mean is fixed. This one interval either covers it or not. The 95% describes the method.":"真实均值是固定的。这一个区间要么覆盖它，要么没有。95% 描述的是方法。","95% of pickups take between 39.62 and 44.38 minutes":"95% 的取货用时在 39.62 到 44.38 分钟之间","Single pickups vary with an SD of 12 minutes. The interval is for the mean, not for single pickups.":"单笔取货的 SD 是 12 分钟。这个区间针对的是均值，而不是单笔取货。","The true mean is 42 minutes":"真实均值就是 42 分钟","42 is the sample mean, one estimate. The interval shows the other plausible values.":"42 是样本均值，只是一个估计值。区间显示的是其他合理的可能值。","More confidence, wider window":"置信度越高，区间越宽","The manager says, \"Give me 99% confidence instead of 95%.\" Slide the confidence level and watch the interval.":"经理说：“给我 99% 的置信度，而不是 95%。”拖动置信水平，观察区间的变化。","What happens to Cedar Loop’s mean interval at 99%?":"在 99% 时，Cedar Loop 的均值区间会怎样？","<p>At 99%, t* = 2.626 and the margin is about 2.626 × 1.20 = 3.15, giving 38.85 to 45.15 minutes. At 90%, t* = 1.660 and the interval is 40.01 to 43.99.</p>\n          <p>Higher confidence buys a wider, less actionable window. Only more good data, or less variable data, buys both confidence and a narrow window.</p>":"<p>在 99% 时，t* = 2.626，误差范围约为 2.626 × 1.20 = 3.15，得到 38.85 到 45.15 分钟。在 90% 时，t* = 1.660，区间为 40.01 到 43.99。</p>\n          <p>更高的置信度换来的是更宽、更难据以行动的区间。只有更多的优质数据，或变异更小的数据，才能同时换来高置信度和窄区间。</p>","It widens, to about 38.85 to 45.15 minutes":"变宽，约为 38.85 到 45.15 分钟","It narrows, because 99% is more precise":"变窄，因为 99% 更精确","More confidence needs a bigger multiplier. t* rises from 1.98 to 2.63, so the margin grows.":"更高的置信度需要更大的乘数。t* 从 1.98 升到 2.63，所以误差范围变大。","It stays 39.62 to 44.38; only the label changes":"仍是 39.62 到 44.38；只是标签变了","The confidence level and the width move together. Slide to 99% and watch the ends.":"置信水平和区间宽度同向变化。拖到 99%，观察两个端点。","It widens, because the sample gets smaller":"变宽，因为样本变小了","n stays 100. Only the multiplier t* changes.":"n 仍是 100。变的只有乘数 t*。","Where does 1.96 come from?":"1.96 是从哪里来的？","The interval for a share uses the normal multiplier z*. A 95% interval leaves 2.5% in each tail, so z* has 97.5% of the area to its left.":"占比的区间使用正态乘数 z*。95% 置信区间在每个尾部各留下 2.5%，所以 z* 左侧的面积为 97.5%。","Hunt inside the z-table: tap the cell that holds 0.9750. Its row and column give z*.":"在 z 表里寻找：点击数值为 0.9750 的格子。它所在的行和列给出 z*。","<p>0.9750 sits in row 1.9, column 0.06, so z* = 1.96. It is the multiplier in the slow-share interval, 0.24 ± 1.96 × 0.04271.</p>\n          <p>The t-table agrees: its ∞ row, 95% column, reads 1.960. For the mean you used t* = 1.984 instead, because the SD was estimated from the sample.</p>":"<p>0.9750 位于 1.9 行、0.06 列，所以 z* = 1.96。它就是慢单占比区间 0.24 ± 1.96 × 0.04271 中的乘数。</p>\n          <p>t 表的结果一致：它的 ∞ 行、95% 列的数值是 1.960。对于均值，你用的是 t* = 1.984，因为 SD 是根据样本估计的。</p>","Build the 95% interval for the slow share":"构建慢单占比的 95% 置信区间","p̂ = 0.24, SE = 0.04271 and z* = 1.96. The counts suit this simple method: 24 slow and 76 not slow, both well above 10.":"p̂ = 0.24，SE = 0.04271，z* = 1.96。这些计数适合用这种简单方法：24 笔慢单、76 笔非慢单，都远高于 10。","Compute the margin and both ends, as shares.":"计算误差范围和两个端点，以占比表示。","<p>The margin is 0.0837, or <b>8.37 percentage points</b>. The 95% interval is 0.1563 to 0.3237: about <b>15.6% to 32.4%</b> slow.</p>\n          <p>Excel: <code>=E5-1.96*SQRT(E5*(1-E5)/E2)</code>, and the same with + for the upper end. This interval covers chance variation only. It does not include the risk from the 25 missing confirmations.</p>":"<p>误差范围是 0.0837，即 <b>8.37 个百分点</b>。95% 置信区间为 0.1563 到 0.3237：慢单约占 <b>15.6% 到 32.4%</b>。</p>\n          <p>Excel：<code>=E5-1.96*SQRT(E5*(1-E5)/E2)</code>，上端点用 + 代替减号，其余相同。这个区间只涵盖随机变异，不包括 25 份缺失确认带来的风险。</p>","M = 1.96 × 0.04271 = {{m}}":"M = 1.96 × 0.04271 = {{m}}","lower end = 0.24 − M = {{lo}}":"下端点 = 0.24 − M = {{lo}}","upper end = 0.24 + M = {{hi}}":"上端点 = 0.24 + M = {{hi}}","15.6% to 32.4% (±8.37 points)":"15.6% 到 32.4%（±8.37 个百分点）","Does it clear the target?":"它越过目标线了吗？","The violet bar is the 95% interval for the slow share. The gold bar shows the nonresponse bounds for the 125 selected. Drag the target line to explore.":"紫色条是慢单占比的 95% 置信区间。金色条显示 125 笔抽中取货的无应答界限。拖动目标线来探索。","Does this evidence show that the true slow share is above the 20% target?":"这些证据能否表明真实慢单占比高于 20% 的目标？","<p>Both the 95% interval (15.6% to 32.4%) and the nonresponse bounds (19.2% to 39.2%) cross 20%. The evidence does not show a share above the target, and it does not show that the target is met.</p>\n          <p>Drag the target line: only a target below 15.6% would sit fully under the interval.</p>":"<p>95% 置信区间（15.6% 到 32.4%）和无应答界限（19.2% 到 39.2%）都跨过了 20%。这些证据既不能表明占比高于目标，也不能表明目标已经达成。</p>\n          <p>拖动目标线：只有低于 15.6% 的目标，才会完全位于区间下方。</p>","No. Plausible shares run from 15.6% to 32.4%, on both sides of 20%.":"不能。合理的占比范围是 15.6% 到 32.4%，横跨 20% 的两侧。","Yes. The estimate, 24%, is above 20%.":"能。估计值 24% 高于 20%。","24% is one plausible value. The interval reaches down to 15.6%, below the target.":"24% 只是一个合理的可能值。区间向下延伸到 15.6%，低于目标。","No. It proves the 20% target is met.":"不能。它证明了 20% 的目标已经达成。","The interval also reaches 32.4%. Not showing a problem is not proof that there is none.":"区间也延伸到 32.4%。没有显示出问题，不等于证明没有问题。","Yes. The nonresponse bounds reach 39.2%.":"能。无应答界限高达 39.2%。","They also reach down to 19.2%. Both ranges cross the target.":"它们也向下延伸到 19.2%。两个范围都跨过了目标。","Points, not percent":"是百分点，不是百分比","A teammate drafts one line for the manager’s memo.":"一位队友为经理的备忘录起草了一句话。","Which line reports the result correctly?":"哪一句正确地报告了结果？","<p>The margin of a share is in <b>percentage points</b>: 24% ± 8.37 points. \"±8.37%\" can read as a relative change, 0.0837 × 24% ≈ 2 points, which hides most of the uncertainty.</p>\n          <p>Also name the parameter, the period and the main limitation: the respondents may not represent all 2,400 pickups.</p>":"<p>占比的误差范围以<b>百分点</b>为单位：24% ± 8.37 个百分点。\"±8.37%\" 可能被理解为相对变化，即 0.0837 × 24% ≈ 2 个百分点，这会掩盖大部分不确定性。</p>\n          <p>还要写明参数、时期和主要局限：应答者可能无法代表全部 2,400 笔取货。</p>","24% slow; 95% CI 15.6% to 32.4% (margin 8.37 percentage points)":"慢单 24%；95% 置信区间为 15.6% 到 32.4%（误差范围 8.37 个百分点）","24% slow, plus or minus 8.37%":"慢单 24%，上下浮动 8.37%","A reader may take 8.37% of 24%, which is about 2 points. Say percentage points.":"读者可能会理解为 24% 的 8.37%，也就是约 2 个百分点。要说“百分点”。","24% slow, plus or minus 4.27 points at 95% confidence":"慢单 24%，在 95% 置信度下上下浮动 4.27 个百分点","4.27 points is one standard error. The 95% margin is 1.96 × 4.27 ≈ 8.37 points.":"4.27 个百分点是一个标准误。95% 的误差范围是 1.96 × 4.27 ≈ 8.37 个百分点。","24% of all 2,400 pickups are slow":"全部 2,400 笔取货中有 24% 是慢单","That reports a respondent share as a population fact. It drops the interval and the 25 missing confirmations.":"这把应答者中的占比当成了总体事实来报告。它丢掉了区间，也忽略了 25 份缺失的确认。","Plan the next audit":"规划下一次核查","Before collecting more data, the manager wants a 95% interval no wider than ±5 percentage points. Use the current estimate, 0.24, as the planning share.":"在收集更多数据之前，经理希望 95% 置信区间不超过 ±5 个百分点。用当前估计值 0.24 作为规划比例。","Drag n. What is the smallest number of usable pickups that brings the margin to 5 points or less?":"拖动 n。至少需要多少笔有效取货，才能让误差范围不超过 5 个百分点？","<p>n = (1.96 / 0.05)² × 0.24 × 0.76 = 280.28. Always round <b>up</b>, to 281 usable pickups: at 280 the margin is 5.003 points, just over the goal.</p>\n          <p>Switch the planning share to 0.50 and the answer becomes 385. A share of 0.50 gives the largest p(1 − p), so it is the safe choice when no credible estimate exists.</p>":"<p>n = (1.96 / 0.05)² × 0.24 × 0.76 = 280.28。始终<b>向上</b>取整，得到 281 笔有效取货：在 280 时，误差范围是 5.003 个百分点，刚好超出目标。</p>\n          <p>把规划比例换成 0.50，答案就变成 385。占比为 0.50 时 p(1 − p) 最大，所以在没有可信估计值时，它是稳妥的选择。</p>","281 usable for ±5 points":"281 笔有效取货，对应 ±5 个百分点","From usable pickups to invitations":"从有效取货到邀请数","The plan counts usable confirmations, but Cedar Loop can only send invitations. Last time, 80% of invitations gave usable responses.":"计划统计的是有效确认，但 Cedar Loop 只能发出邀请。上一次，80% 的邀请得到了有效应答。","Fill in each plan. Round up every time.":"填写每个计划。每次都向上取整。","<p>Without a credible planning share, 0.50 gives 385. To get 281 usable responses at an 80% response rate, plan about 352 invitations. Halving the margin needs four times the sample, 1,122.</p>\n          <p>Inviting more people fixes the <b>count</b>, not the <b>pattern</b> of who responds. 352 invitations are not 352 representative observations.</p>":"<p>没有可信的规划比例时，用 0.50 得到 385。在 80% 的应答率下，要得到 281 份有效应答，应计划发出约 352 份邀请。误差范围减半需要四倍的样本，即 1,122。</p>\n          <p>邀请更多人解决的是<b>数量</b>问题，而不是谁会应答的<b>模式</b>问题。352 份邀请并不等于 352 个有代表性的观测值。</p>","planning share 0.50: 1.96² × 0.25 / 0.05² = 384.16, so n = {{n50}}":"规划比例 0.50：1.96² × 0.25 / 0.05² = 384.16，所以 n = {{n50}}","invitations for 281 usable at 80%: 281 / 0.80 = 351.25, so invite {{inv}}":"应答率 80% 下获得 281 份有效应答所需的邀请数：281 / 0.80 = 351.25，所以邀请 {{inv}} 份","margin halved to ±2.5 points: 4 × 280.28 = 1,121.13, so n = {{n25}}":"误差范围减半至 ±2.5 个百分点：4 × 280.28 = 1,121.13，所以 n = {{n25}}","Round 384.16 up to 385. Rounding down would leave the margin just over 5 points.":"把 384.16 向上取整为 385。向下取整会让误差范围略超过 5 个百分点。","Usable pickups with planning share 0.50":"规划比例为 0.50 时的有效取货数","281 ÷ 0.80 = 351.25. Round up to 352: you cannot send part of an invitation.":"281 ÷ 0.80 = 351.25。向上取整为 352：邀请不能只发出一部分。","Invitations":"邀请数","Halving the margin multiplies n by 4: 4 × 280.28 = 1,121.13, rounded up to 1,122.":"误差范围减半，n 要乘以 4：4 × 280.28 = 1,121.13，向上取整为 1,122。","Usable pickups for a margin of 2.5 points":"误差范围为 2.5 个百分点时的有效取货数","281 usable (±5 points), about 352 invitations":"281 笔有效取货（±5 个百分点），约 352 份邀请","Make the call":"做出判断","You are the analyst. The manager wants one recommendation for the staffing meeting.":"你是分析师。经理需要你为人员配置会议给出一条建议。","What do you recommend?":"你建议怎么做？","<p>The respondent share is above 20%, but the 95% interval (15.6% to 32.4%) and the nonresponse bounds (19.2% to 39.2%) both cross the target. The snapshot is observational, so it cannot show what extra staff would do.</p>\n          <p>A bounded next step: audit the frame, follow up nonrespondents, then pilot evening staffing with a labor-cost guardrail and a sample planned for ±5 points.</p>":"<p>应答者中的占比高于 20%，但 95% 置信区间（15.6% 到 32.4%）和无应答界限（19.2% 到 39.2%）都跨过了目标。这份快照是观察性数据，因此无法表明增加人手会带来什么效果。</p>\n          <p>限定范围的下一步：核查抽样框，追访未应答者，然后在人工成本护栏指标下试点晚间排班，并按 ±5 个百分点规划样本。</p>","Audit and follow up nonrespondents, then pilot evening staff with a cost guardrail":"先核查并追访未应答者，再在成本护栏指标下试点晚班人员","Hire permanent evening staff now, because 24% is above the 20% target":"现在就招聘长期晚班人员，因为 24% 高于 20% 的目标","The 24% is one estimate from respondents. The interval and the nonresponse bounds both reach below 20%.":"24% 只是来自应答者的一个估计值。区间和无应答界限都延伸到 20% 以下。","Change nothing, because the interval includes values below 20%":"什么都不变，因为区间包含低于 20% 的值","The interval also reaches 32.4%. Not showing a problem is not proof that the target is met.":"区间也延伸到 32.4%。没有显示出问题，不等于证明目标已经达成。","Email 1,000 more customers the same way, then decide":"用同样的方式再给 1,000 位顾客发邮件，然后再决定","More of the same narrows chance error, but the same nonresponse pattern could still bias the share.":"用同样方式收集更多数据，可以缩小随机误差，但同样的无应答模式仍可能让占比产生偏差。","Audit and follow up, then a bounded evening pilot":"先核查并追访，再开展限定范围的晚间试点","Your audit bench":"你的核查工作台","Name the population first. The SE shrinks with √n, but bias does not. A 95% interval describes the procedure, and it can still cross the target.":"先明确总体。SE 随 √n 缩小，但偏差不会。95% 置信区间描述的是方法，而且它仍可能跨过目标。","Change the inputs to invent your own audit. The checks update as you drag.":"修改输入，设计你自己的核查。拖动时，各项检查会随之更新。","Open this page from the class site to see the dataset.":"请从课程网站打开此页面以查看数据集。","Mini frame sorted by its random number":"按随机数排序的迷你抽样框","Selected?":"抽中？","Edit any cell (Excel recalculates)":"编辑任意单元格（Excel 会重新计算）","Paste RAND as values":"把 RAND 粘贴为数值","Start over":"重新开始","A mini frame: 10 IDs, keep the 3 with the smallest random numbers. The real draw keeps 125 of 2,400.":"迷你抽样框：10 个 ID，保留随机数最小的 3 个。真实抽样从 2,400 个中保留 125 个。","Selected":"已抽中","Selected IDs":"抽中的 ID","RAND column":"RAND 列","Frozen values":"已固定的数值","Live formula":"实时公式","After the last edit":"最近一次编辑后","Selection changed":"抽中结果已改变","Selection kept":"抽中结果保持不变","Imagined population of pickup times, with the latest sample as dots":"设想的取货时长总体，圆点表示最新样本","pickup time (minutes)":"取货时长（分钟）","population: mean 42, SD 12, long right tail":"总体：均值 42，SD 12，右侧长尾","Histogram of sample means":"样本均值直方图","sample mean (minutes)":"样本均值（分钟）","Sample means":"样本均值","Normal curve with SD 12 / √n":"SD 为 12 / √n 的正态曲线","Pickups per sample, n":"每个样本的取货数 n","Draw 1 sample":"抽 1 个样本","Draw 100 samples":"抽 100 个样本","Clear this n":"清除此 n 的结果","this sample’s mean":"本样本的均值","Samples drawn":"已抽样本数","Mean of the means":"均值的均值","min":"分钟","SD of the means":"均值的 SD","Formula: 12 / √n":"公式：12 / √n","The 125 selected pickups: known slow, known not slow, and missing":"125 笔抽中的取货：已知慢单、已知非慢单和缺失","Known slow":"已知慢单","Known not slow":"已知非慢单","Missing":"缺失","Missing, assumed slow":"缺失，假设为慢单","Share of the 125 selected pickups that are slow":"125 笔抽中取货中的慢单占比","slow share of the 125 selected":"125 笔抽中取货的慢单占比","target 20%":"目标 20%","Slow among the 25 missing":"25 笔缺失中的慢单","Slow among the 125":"125 笔中的慢单","Share of the 125":"占 125 笔的比例","Target: at most 20%":"目标：不超过 20%","Meets target":"达到目标","Above target":"高于目标","95% intervals from repeated samples of 100 pickups":"来自重复样本（每个 100 笔取货）的 95% 置信区间","mean pickup time (minutes)":"平均取货时长（分钟）","true mean in this simulation: 42":"本模拟中的真实均值：42","Interval covers the true mean":"区间覆盖真实均值","Interval misses it":"区间未覆盖","Draw 20 more samples":"再抽 20 个样本","Intervals drawn":"已生成区间数","Cover 42":"覆盖 42","Share that cover":"覆盖的比例","Interval for the mean pickup time at the chosen confidence level":"所选置信水平下平均取货时长的区间","Confidence":"置信度","Margin":"误差范围","Interval":"定距","Confidence level":"置信水平","t distribution for the picked row":"所选行对应的 t 分布","Two tails":"双尾","Tap a cell":"点击一个格子","conf.":"置信度","two tails":"双尾","t-table of critical values":"t 临界值表","Standard normal curve with the area to the left of z":"标准正态曲线，标出 z 左侧的面积","How close?":"有多接近？","Bullseye":"正中靶心","Very warm":"很热了","Warm":"有点热","Cold":"冷冰冰","z-table of areas to the left of z":"z 表：z 左侧的面积","95% interval and nonresponse bounds for the slow share, with a target line":"慢单占比的 95% 置信区间和无应答界限，含目标线","share of pickups that are slow":"慢单占比","95% interval":"95% 置信区间","nonresponse bounds":"无应答界限","Yes":"是","No":"否","Target":"目标","Interval wholly above the target?":"区间完全高于目标？","Bounds wholly above the target?":"界限完全高于目标？","target":"目标","Target share":"目标占比","Standard error of the mean by sample size":"不同样本量下均值的标准误","usable pickups (n)":"有效取货数（n）","SE of the mean (minutes)":"均值的 SE（分钟）","goal: SE at most 0.60":"目标：SE 不超过 0.60","Compared with n = 100":"与 n = 100 相比","Goal met?":"达到目标？","Not yet":"尚未","Usable pickups":"有效取货数","95% margin of error by number of usable pickups":"不同有效取货数下的 95% 误差范围","95% margin (percentage points)":"95% 误差范围（百分点）","goal: ±5 points":"目标：±5 个百分点","Planning share":"规划比例","pts":"百分点","Goal ±5 points":"目标 ±5 个百分点","Met":"已达到","The respondent share is above 20%":"应答者中的占比高于 20%","The 95% interval sits wholly above 20%":"95% 置信区间完全高于 20%","The nonresponse bounds sit wholly above 20%":"无应答界限完全高于 20%","The data show what extra staff would do":"数据能表明增加人手的效果","observational snapshot":"观察性快照","Evidence checks":"证据检查","Right call.":"判断正确。","Right call. Your gut call at the start was “{call}”. Now you can back your answer with evidence.":"判断正确。你一开始的直觉判断是“{call}”。现在你可以用证据支持你的答案了。","Checks for your audit":"你的核查：检查项","Interval wholly above the target":"区间完全高于目标","Interval wholly at or below the target":"区间完全处于目标或以下","Nonresponse bounds on one side of the target":"无应答界限位于目标的同一侧","Evidence of a problem: plan a bounded pilot":"有问题的证据：规划限定范围的试点","Target looks met":"目标看起来已达成","Gather more evidence first":"先收集更多证据","Verdict":"结论","Slow share of respondents":"应答者中的慢单占比","Usable-response rate":"有效应答率","Target, at most":"目标上限","Lesson complete":"课程完成","You earned {pts} points: {firsts} first-try answers across {graded} questions.":"你获得了 {pts} 分：{graded} 道题中有 {firsts} 道一次答对。","Your evidence file stays in the case panel. Use Back or the part bar to revisit any screen before the midterm on October 21.":"你的证据档案会保留在案例面板中。在 10 月 21 日期中考试之前，你可以用“返回”或部分导航栏重新查看任意一屏。","The SE is still above 0.60 minutes. Add pickups.":"SE 仍高于 0.60 分钟。增加取货数。","That works, but a smaller sample does too. Find the first n where the SE reaches 0.60.":"这样可以，但更小的样本也行。找到 SE 首次达到 0.60 的 n。","At 1, the share is 25 / 125 = 20.0%, which still meets \"at most 20%\". Try one more.":"为 1 时，占比是 25 / 125 = 20.0%，仍符合“不超过 20%”。再加一笔试试。","At 0, the share is 19.2%, under the target. Add slow nonrespondents.":"为 0 时，占比是 19.2%，低于目标。增加慢单未应答者。","That is above the target, but fewer slow nonrespondents already get there. Find the first count that does.":"这已高于目标，但更少的慢单未应答者就已经能做到。找到第一个能超过目标的数量。","Found it: t* = 1.984. Excel gives =T.INV.2T(0.05, 99) = 1.9842.":"找到了：t* = 1.984。Excel 给出 =T.INV.2T(0.05, 99) = 1.9842。","Close. df = n − 1 = 100 − 1 = 99. Move up one row.":"很接近了。df = n − 1 = 100 − 1 = 99。往上移一行。","The ∞ row gives the z value. Use t with df = 99, because the population SD is unknown.":"∞ 行给出的是 z 值。由于总体 SD 未知，要用 df = 99 的 t。","Use df = n − 1 = 99. Scroll down to row 99.":"使用 df = n − 1 = 99。向下滚动到第 99 行。","That column is a 90% interval. A 95% interval leaves 0.05 in the two tails together.":"这一列对应 90% 置信区间。95% 置信区间在两个尾部合计留下 0.05。","Right row. Now use the column headed 0.05, which gives a 95% interval.":"行对了。现在用表头为 0.05 的那一列，它对应 95% 置信区间。","Bullseye: z* = 1.9 + 0.06 = 1.96.":"正中靶心：z* = 1.9 + 0.06 = 1.96。","Warm, but that area is more than 0.9750. Move up or to the left.":"有点热了，但这个面积大于 0.9750。往上或往左移。","That area is less than 0.9750. Move down or to the right.":"这个面积小于 0.9750。往下或往右移。","Switch the planning share back to 0.24, the current estimate, for this task.":"本题请把规划比例切换回当前估计值 0.24。","The margin is still above 5 points. Add usable pickups.":"误差范围仍高于 5 个百分点。增加有效取货数。","That meets the goal, but a smaller sample does too. Find the first n where the margin reaches 5 points or less.":"这达到了目标，但更小的样本也能做到。找到误差范围首次降到 5 个百分点或以下的 n。"},"es":{"Is Cedar Loop Too Slow?":"¿Es Cedar Loop demasiado lento?","GC1015 · Session 5 · Sampling, bias, confidence intervals, precision":"GC1015 · Sesión 5 · Muestreo, sesgo, intervalos de confianza, precisión","Finish":"Terminar","Evidence so far":"Evidencia hasta ahora","Sampling distributions and the CLT":"Distribuciones muestrales y el teorema central del límite","Standard error and precision":"Error estándar y precisión","Confidence intervals":"Intervalos de confianza","Case file: Cedar Loop":"Expediente del caso: Cedar Loop","Fictional grocery pickup service. KPI: the share of pickups that take more than 50 minutes from the order-ready message to handoff. Target: at most 20%.":"Servicio ficticio de recogida de compras de supermercado. KPI: la proporción de recogidas que tardan más de 50 minutos desde el mensaje de pedido listo hasta la entrega. Meta: como máximo 20%.","Audit step":"Paso de la auditoría","Count":"Conteo","Eligible pickups in the frame (four weeks)":"Recogida

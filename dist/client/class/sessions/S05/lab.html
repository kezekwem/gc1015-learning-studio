<mo>=</mo><mn>99</mn></mrow><annotation encoding=\"application/x-tex\">100-1=99</annotation></semantics></math></span> degrees of freedom. The two-sided 95% critical value is approximately <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>t</mi><mo>∗</mo></msup><mo>=</mo><mn>1.9842</mn></mrow><annotation encoding=\"application/x-tex\">t^*=1.9842</annotation></semantics></math></span>. Calculate each endpoint:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>=</mo><mn>1.9842</mn><mo stretchy=\"false\">(</mo><mn>1.20</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>2.3810</mn><mtext> minutes</mtext><mo separator=\"true\">;</mo><mspace width=\"2em\"/><mn>42</mn><mo>−</mo><mn>2.3810</mn><mo>=</mo><mn>39.6190</mn><mo separator=\"true\">;</mo><mspace width=\"2em\"/><mn>42</mn><mo>+</mo><mn>2.3810</mn><mo>=</mo><mn>44.3810.</mn></mrow><annotation encoding=\"application/x-tex\">M=1.9842(1.20)=2.3810\\text{ minutes};\n\\qquad\n42-2.3810=39.6190;\n\\qquad\n42+2.3810=44.3810.</annotation></semantics></math></span></div></p>\n<p>Rounded to reporting precision, the <b>illustrative 95% interval is 39.62 to 44.38 minutes</b>. Conditional on a defensible sampling and response process, it estimates the mean duration of eligible pickups in the stated period. It does not say that 95% of <i>individual</i> pickups lasted between those endpoints. Because Cedar Loop has unresolved nonresponse, report the interval alongside that limitation rather than presenting it as fully validated population coverage. (The Pennsylvania State University, n.d.-c).</p>\n<p><b>Excel 365, after the calculation.</b> If an audited sheet has one numeric duration per usable pickup in <code>B2:B101</code>, first check that <code>=COUNT(B2:B101)</code> returns <code>100</code>, <code>=AVERAGE(B2:B101)</code> returns <code>42</code>, and <code>=STDEV.S(B2:B101)</code> returns <code>12</code>. If it does not, investigate rows or rounding rather than forcing the result. For this exercise’s stipulated summaries, place <code>100</code>, <code>42</code>, and <code>12</code> in <code>E2:E4</code>. Then use <code>=E4/SQRT(E2)</code> for the SE, <code>=T.INV.2T(0.05,E2-1)</code> for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>t</mi><mo>∗</mo></msup></mrow><annotation encoding=\"application/x-tex\">t^*</annotation></semantics></math></span>, and <code>=E3-T.INV.2T(0.05,E2-1)*E4/SQRT(E2)</code> and the corresponding <code>+</code> formula for endpoints. <code>STDEV.S</code> estimates a sample standard deviation; Microsoft documents the statistical functions used here. A summary-only sheet checks arithmetic but cannot validate the missing row-level data. (Microsoft, n.d.).</p>\n<p><b>SPSS, when an authorized row-level file exists.</b> Verify that it has one usable row per pickup, numeric <code>minutes</code>, and the same missing-value rule. Run <code>EXAMINE VARIABLES=minutes /STATISTICS=DESCRIPTIVES /CINTERVAL 95.</code> and compare its valid <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>, mean, standard deviation, and <b>95% CI for Mean</b> with the hand calculation. Do not claim the stipulated aggregates are reproducible in SPSS without those rows. IBM documents <code>EXAMINE</code>’s descriptive output and its confidence-level option. (IBM, n.d.-a, n.d.-b).</p>\n<p><b>[KEY] An interval measures uncertainty from a specified procedure, conditional on its assumptions; it is not a cure for missing or wrongly measured pickups.</b></p>\n<p><b>Failure mode:</b> Reporting “42 ± 2.38 minutes” without identifying the parameter, confidence level, dates, or nonresponse limitation makes the number look more general than it is.</p>\n<p><b>Try it — ungraded.</b> For a separate illustrative mean of 30 minutes with SE 2 minutes and a supplied 95% critical value of 2, find the interval.</p>\n<p><b>Answer.</b> The margin is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mo stretchy=\"false\">(</mo><mn>2</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">2(2)=4</annotation></semantics></math></span> minutes, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30</mn><mo>±</mo><mn>4</mn><mo>=</mo><mo stretchy=\"false\">[</mo><mn>26</mn><mo separator=\"true\">,</mo><mn>34</mn><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">30\\pm4=[26,34]</annotation></semantics></math></span> minutes. This is an interval for a <i>population mean</i> only if the procedure’s sampling assumptions hold.</p>"},{"id":"5","level":2,"title":"5. Estimate a proportion and plan useful precision","short":"5. Estimate a proportion and pla…","html":""},{"id":"5.1","level":3,"title":"5.1 Slow-pickup interval and sample-size plan","short":"5.1. Slow-pickup interval and sa…","html":"<p>A <b>proportion</b> is a share of units with a defined attribute: Cedar Loop’s <code>slow=1</code> means <i>more than</i> 50 minutes, so exactly 50 is not slow. The simple normal-approximation, or <b>Wald</b>, interval is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover><mo>±</mo><msup><mi>z</mi><mo>∗</mo></msup><mi>S</mi><msub><mi>E</mi><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover></msub></mrow><annotation encoding=\"application/x-tex\">\\hat p\\pm z^*SE_{\\hat p}</annotation></semantics></math></span>. For a two-sided 95% interval, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>z</mi><mo>∗</mo></msup><mo>≈</mo><mn>1.96</mn></mrow><annotation encoding=\"application/x-tex\">z^*\\approx1.96</annotation></semantics></math></span>. It is a useful introductory calculation when observations are suitable and expected counts are not small; with sparse successes or failures, a more appropriate proportion procedure is needed. Cedar Loop has 24 slow and 76 not-slow responses, so neither observed count is sparse. Its unresolved response process remains the more serious limitation. (The Pennsylvania State University, n.d.-c).</p>\n<p><b>Worked example.</b> Section 3 found <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><msub><mi>E</mi><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover></msub><mo>≈</mo><mn>0.04271</mn></mrow><annotation encoding=\"application/x-tex\">SE_{\\hat p}\\approx0.04271</annotation></semantics></math></span>. Complete the calculation without rounding the SE prematurely:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>=</mo><mn>1.96</mn><msqrt><mfrac><mrow><mn>0.24</mn><mo stretchy=\"false\">(</mo><mn>0.76</mn><mo stretchy=\"false\">)</mo></mrow><mn>100</mn></mfrac></msqrt><mo>≈</mo><mn>1.96</mn><mo stretchy=\"false\">(</mo><mn>0.042708</mn><mo stretchy=\"false\">)</mo><mo>≈</mo><mn>0.08371</mn><mo separator=\"true\">;</mo></mrow><annotation encoding=\"application/x-tex\">M=1.96\\sqrt{\\frac{0.24(0.76)}{100}}\n\\approx1.96(0.042708)\n\\approx0.08371;</annotation></semantics></math></span></div>\n<div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mn>0.24</mn><mo>−</mo><mn>0.08371</mn><mo>=</mo><mn>0.15629</mn><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mn>0.24</mn><mo>+</mo><mn>0.08371</mn><mo>=</mo><mn>0.32371.</mn></mrow><annotation encoding=\"application/x-tex\">0.24-0.08371=0.15629,\\qquad\n0.24+0.08371=0.32371.</annotation></semantics></math></span></div></p>\n<p>The <b>illustrative 95% interval is 15.6% to 32.4%</b>, rounded to one decimal percentage point. The 20% managerial target lies inside it. Thus these responses and this interval do not isolate a population slow share above 20%; they also do not establish that the target is met. More fundamentally, the interval does not incorporate the possible nonresponse bias demonstrated in Section 2. A bounded recommendation is to audit the frame and follow up nonrespondents, then plan an evening-focused staffing pilot with a labor-cost guardrail. The snapshot alone cannot establish a staffing effect. (The Pennsylvania State University, n.d.-b, n.d.-c).</p>\n<p><b>Excel 365 check.</b> With audited binary values in <code>C2:C101</code>, check <code>=COUNT(C2:C101)</code> is <code>100</code>, <code>=SUM(C2:C101)</code> is <code>24</code>, and every value is 0 or 1. Compute <code>=SUM(C2:C101)/COUNT(C2:C101)</code> for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\hat p</annotation></semantics></math></span>. If <code>E5</code> holds that share and <code>E2</code> holds <code>100</code>, compute <code>=SQRT(E5*(1-E5)/E2)</code> for SE; subtract and add <code>1.96</code> times that cell for endpoints. For a summary-only check, enter <code>=24/100</code> in <code>E5</code>. Excel verifies the arithmetic, not the selection mechanism. Microsoft documents the Excel statistical-function reference used for related checks. (Microsoft, n.d.).</p>\n<p>For <b>advance sample-size planning</b>, specify an acceptable half-width <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span> <i>before</i> collection. For an approximate 95% one-proportion interval, with planning share <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\tilde p</annotation></semantics></math></span>,</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>n</mi><mtext>usable</mtext></msub><mo>≈</mo><msup><mrow><mo fence=\"true\">(</mo><mfrac><mn>1.96</mn><mi>M</mi></mfrac><mo fence=\"true\">)</mo></mrow><mn>2</mn></msup><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">.</mi></mrow><annotation encoding=\"application/x-tex\">n_{\\text{usable}}\\approx\n\\left(\\frac{1.96}{M}\\right)^2\\tilde p(1-\\tilde p).</annotation></semantics></math></span></div></p>\n<p>If Cedar Loop wants roughly <b>±5 percentage points</b> and uses the current <b>respondent estimate</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo>=</mo><mn>0.24</mn></mrow><annotation encoding=\"application/x-tex\">\\tilde p=0.24</annotation></semantics></math></span> as a planning input, then</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>n</mi><mtext>usable</mtext></msub><mo>≈</mo><mo stretchy=\"false\">(</mo><mn>1.96</mn><mi mathvariant=\"normal\">/</mi><mn>0.05</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup><mo stretchy=\"false\">(</mo><mn>0.24</mn><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mn>0.76</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>280.283136</mn><mo separator=\"true\">,</mo></mrow><annotation encoding=\"application/x-tex\">n_{\\text{usable}}\\approx\n(1.96/0.05)^2(0.24)(0.76)\n=280.283136,</annotation></semantics></math></span></div></p>\n<p>so round <b>up to 281 usable pickups</b>. This is an approximate planning calculation, not a guarantee of exactly five points in the eventual interval. If no credible planning share exists, using <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo>=</mo><mn>0.50</mn></mrow><annotation encoding=\"application/x-tex\">\\tilde p=0.50</annotation></semantics></math></span> gives the largest value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mover accent=\"true\"><mi>p</mi><mo>~</mo></mover><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\tilde p(1-\\tilde p)</annotation></semantics></math></span>: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.9</mn><msup><mn>6</mn><mn>2</mn></msup><mo stretchy=\"false\">(</mo><mn>0.25</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>0.0</mn><msup><mn>5</mn><mn>2</mn></msup><mo>=</mo><mn>384.16</mn></mrow><annotation encoding=\"application/x-tex\">1.96^2(0.25)/0.05^2=384.16</annotation></semantics></math></span>, rounded up to <b>385 usable pickups</b>. At an assumed 80% usable-response rate, obtaining 281 usable pickups requires planning about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>281</mn><mi mathvariant=\"normal\">/</mi><mn>0.80</mn><mo>=</mo><mn>351.25</mn></mrow><annotation encoding=\"application/x-tex\">281/0.80=351.25</annotation></semantics></math></span>, or <b>352 invitations</b> after rounding up. Inviting more people addresses count, not differential response. Sample-size plans for a mean instead require a planning standard deviation in minutes and a target margin in minutes. (The Pennsylvania State University, n.d.-c).</p>\n<p><b>Failure mode:</b> Reporting “±5%” when the intended margin is <b>five percentage points</b>, or treating 352 invitations as equivalent to 352 usable, representative observations.</p>\n<p><b>Try it — ungraded.</b> With the same planning share and confidence level, what happens to the approximate required usable sample size if the desired margin falls from 0.05 to 0.025?</p>\n<p><b>Answer.</b> The margin is halved and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> depends on <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><msup><mi>M</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">1/M^2</annotation></semantics></math></span>, so the unrounded requirement becomes four times as large: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo stretchy=\"false\">(</mo><mn>280.283136</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>1121.132544</mn></mrow><annotation encoding=\"application/x-tex\">4(280.283136)=1121.132544</annotation></semantics></math></span>. Round up to <b>1,122 usable pickups</b>. This is a precision plan, not a nonresponse fix.</p>"},{"id":"5.2","level":3,"title":"5.2 Optional bridge: differences between periods","short":"5.2. Optional bridge: difference…","html":"<p>A <i>difference</i> needs a defined order and unit. If Cedar Loop’s 100 respondents included 50 morning pickups with 10 slow and 50 evening pickups with 14 slow, those counts would agree with the case’s total of 24. The observed <b>evening minus morning</b> difference would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>14</mn><mi mathvariant=\"normal\">/</mi><mn>50</mn><mo>−</mo><mn>10</mn><mi mathvariant=\"normal\">/</mi><mn>50</mn><mo>=</mo><mn>0.28</mn><mo>−</mo><mn>0.20</mn><mo>=</mo><mn>0.08</mn></mrow><annotation encoding=\"application/x-tex\">14/50-10/50=0.28-0.20=0.08</annotation></semantics></math></span>, or <b>8 percentage points</b>. For independent groups, the illustrative SE of that difference is</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msqrt><mrow><mfrac><mrow><mn>0.28</mn><mo stretchy=\"false\">(</mo><mn>0.72</mn><mo stretchy=\"false\">)</mo></mrow><mn>50</mn></mfrac><mo>+</mo><mfrac><mrow><mn>0.20</mn><mo stretchy=\"false\">(</mo><mn>0.80</mn><mo stretchy=\"false\">)</mo></mrow><mn>50</mn></mfrac></mrow></msqrt><mo>=</mo><msqrt><mn>0.007232</mn></msqrt><mo>≈</mo><mn>0.08504.</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt{\\frac{0.28(0.72)}{50}+\\frac{0.20(0.80)}{50}}\n=\\sqrt{0.007232}\\approx0.08504.</annotation></semantics></math></span></div></p>\n<p>An introductory 95% normal interval is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.08</mn><mo>±</mo><mn>1.96</mn><mo stretchy=\"false\">(</mo><mn>0.08504</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">0.08\\pm1.96(0.08504)</annotation></semantics></math></span>, or approximately <b>−8.7 to 24.7 percentage points</b>. With only 10 morning slow pickups, check whether a normal approximation is suitable before relying on it. The interval includes zero; neither its width nor an observed group difference makes time of day a causal explanation. Comparing mean minutes instead would estimate an <i>evening-minus-morning mean in minutes</i>, using both groups’ standard deviations and sample sizes. These are bridges to later comparison and testing sessions, not a staffing-effect analysis. (The Pennsylvania State University, n.d.-d).</p>\n<p><b>Failure mode:</b> Applying a one-proportion SE to a difference of two independent proportions, or describing an observational difference as the effect of adding staff.</p>\n<p><b>Try it — ungraded.</b> If two independent period estimates were 0.30 and 0.22, what is <i>first minus second</i>, and is that alone a causal result?</p>\n<p><b>Answer.</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.30</mn><mo>−</mo><mn>0.22</mn><mo>=</mo><mn>0.08</mn></mrow><annotation encoding=\"application/x-tex\">0.30-0.22=0.08</annotation></semantics></math></span>, or 8 percentage points. It is an observed contrast. Without a suitable design and uncertainty assessment, it is neither a demonstrated population difference nor a causal effect.</p>"},{"id":"5.3","level":3,"title":"5.3 Optional bridge: interval for a difference between mean minutes","short":"5.3. Optional bridge: interval f…","html":"<p>The previous bridge compared <b>proportions of slow pickups</b> in percentage points. A different question compares <b>mean pickup durations</b> in minutes. Suppose the same 100 responding pickups split into 50 morning and 50 evening responses. The morning mean is 40 minutes with sample standard deviation 11 minutes; the evening mean is 44 minutes with sample standard deviation 13 minutes. These fictional group summaries are compatible with the case's rounded overall mean of 42 minutes and standard deviation of about 12 minutes.</p>\n<p><b>Worked example.</b> Define the comparison direction before calculating: evening minus morning. The observed difference is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>44</mn><mo>−</mo><mn>40</mn><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">44-40=4</annotation></semantics></math></span> minutes. For two <i>independent</i> groups, Welch's estimated standard error uses each group's variance separately:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>S</mi><msub><mi>E</mi><mrow><msub><mover accent=\"true\"><mi>x</mi><mo>ˉ</mo></mover><mi>E</mi></msub><mo>−</mo><msub><mover accent=\"true\"><mi>x</mi><mo>ˉ</mo></mover><mi>M</mi></msub></mrow></msub><mo>=</mo><msqrt><mrow><mfrac><mrow><mn>1</mn><msup><mn>3</mn><mn>2</mn></msup></mrow><mn>50</mn></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn><msup><mn>1</mn><mn>2</mn></msup></mrow><mn>50</mn></mfrac></mrow></msqrt><mo>=</mo><msqrt><mn>5.8</mn></msqrt><mo>≈</mo><mn>2.408</mn><mtext> minutes</mtext><mi mathvariant=\"normal\">.</mi></mrow><annotation encoding=\"application/x-tex\">SE_{\\bar x_E-\\bar x_M}\n=\\sqrt{\\frac{13^2}{50}+\\frac{11^2}{50}}\n=\\sqrt{5.8}\\approx2.408\\text{ minutes}.</annotation></semantics></math></span></div></p>\n<p>Welch's degrees of freedom are about 95 here, so the two-sided 95% critical value is about 1.985. The margin is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.985</mn><mo stretchy=\"false\">(</mo><mn>2.408</mn><mo stretchy=\"false\">)</mo><mo>≈</mo><mn>4.78</mn></mrow><annotation encoding=\"application/x-tex\">1.985(2.408)\\approx4.78</annotation></semantics></math></span> minutes. The interval for the <i>evening-minus-morning population mean difference</i> is therefore about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo>±</mo><mn>4.78</mn></mrow><annotation encoding=\"application/x-tex\">4\\pm4.78</annotation></semantics></math></span>, or <b>−0.78 to 8.78 minutes</b>. It includes zero: these responses do not distinguish a positive population difference from zero at this interval's nominal level, even if sampling and response assumptions were satisfied. The unresolved nonresponse also limits that interpretation. Compare the groups' distributions and check for influential duration errors before reporting the interval. The comparison is observational; staffing was not varied, so it cannot estimate a staffing effect (The Pennsylvania State University, n.d.-d).</p>\n<p><b>Excel 365 route.</b> With audited morning minutes in one range and evening minutes in another, obtain each <code>COUNT</code>, <code>AVERAGE</code>, and <code>STDEV.S</code>; calculate <code>=SQRT(s_evening^2/n_evening+s_morning^2/n_morning)</code> from those summaries. Use a verified two-sided Welch critical value and record its degrees of freedom. <b>SPSS route.</b> An independent-samples t-test output can show an unequal-variances row and a confidence interval, but first confirm group coding, valid counts, and direction; do not copy the equal-variances row by habit (IBM, n.d.-c). The hand-calculated <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.408</mn></mrow><annotation encoding=\"application/x-tex\">2.408</annotation></semantics></math></span> SE and approximately <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">[</mo><mo>−</mo><mn>0.78</mn><mo separator=\"true\">,</mo><mn>8.78</mn><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">[-0.78,8.78]</annotation></semantics></math></span> interval are independent checks. Full test selection and effect interpretation belong to S08.</p>\n<p><b>Try it — ungraded.</b> If a colleague reports “morning minus evening = +4 minutes” from these summaries, what is wrong, and what happens to the interval when the subtraction order is reversed?</p>\n<p><b>Answer.</b> Morning minus evening is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn><mo>−</mo><mn>44</mn><mo>=</mo><mo>−</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">40-44=-4</annotation></semantics></math></span> minutes. Reversing the direction changes the signs of both interval endpoints, yielding approximately <b>−8.78 to 0.78 minutes</b>. It does not change the underlying evidence or remove the nonresponse limitation.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>Name the population, period, unit, KPI, target, and decision before estimating anything.</li><li>Audit the sampling frame and preserve one record per eligible pickup.</li><li>Random selection of invitations does not guarantee representative responses.</li><li>Standard deviation describes unit-to-unit spread; standard error describes estimate-to-estimate spread.</li><li>A 95% interval is a repeated-procedure statement, conditional on its assumptions.</li><li>Calculate and report a mean interval in minutes; report a proportion interval in percentage points.</li><li>More usable independent observations usually improve random precision, but do not erase bias.</li><li>Choose sample size from a desired margin and a defensible planning value; round up.</li><li>Cedar Loop’s respondent evidence does not establish that the population exceeds its target or that staffing would change it.</li><li>Check arithmetic in Excel and, when authorized rows exist, SPSS; check provenance and missingness separately.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<div class=\"tbl\"><table><thead><tr><th>Term</th><th>Plain-language meaning</th></tr></thead><tbody><tr><td><b>Population</b></td><td>Every eligible unit covered by the stated question, such as the period’s 2,400 pickups.</td></tr><tr><td><b>Unit</b></td><td>One thing counted or measured; here, one completed pickup.</td></tr><tr><td><b>Sampling frame</b></td><td>The actual list of eligible units available for selection.</td></tr><tr><td><b>Simple random sample</b></td><td>A selection in which every same-sized set of distinct frame units has the same chance.</td></tr><tr><td><b>Stratified sample</b></td><td>Random samples drawn separately within specified, nonoverlapping groups such as morning and evening pickups.</td></tr><tr><td><b>Cluster sample</b></td><td>Randomly selected groups of units, such as pickup waves, with several units observed within each group.</td></tr><tr><td><b>Systematic sample</b></td><td>Selection at a fixed interval on a list after a random start; list cycles can matter.</td></tr><tr><td><b>Parameter</b></td><td>A fixed population quantity of interest, such as the true slow-pickup share.</td></tr><tr><td><b>Statistic</b></td><td>A quantity calculated from a sample, such as 24 slow pickups out of 100 responses.</td></tr><tr><td><b>Point estimate</b></td><td>One sample statistic used to estimate a parameter.</td></tr><tr><td><b>Bias</b></td><td>A systematic tendency for the data process to favor some results.</td></tr><tr><td><b>Nonresponse</b></td><td>A selected unit’s outcome being unavailable for the analysis.</td></tr><tr><td><b>Independence</b></td><td>Observations supplying sufficiently separate information for the stated method.</td></tr><tr><td><b>Standard deviation</b></td><td>A measure of spread among observed values, in the variable’s units.</td></tr><tr><td><b>Sampling distribution</b></td><td>The pattern a statistic would show across repeated samples of the same design.</td></tr><tr><td><b>Standard error</b></td><td>A measure of the spread of that sampling distribution.</td></tr><tr><td><b>Confidence interval</b></td><td>An estimate range produced by a procedure with a stated long-run coverage level.</td></tr><tr><td><b>Welch interval</b></td><td>A two-independent-means interval that estimates each group's variance separately.</td></tr><tr><td><b>Margin of error</b></td><td>Half an interval’s width when the interval is centered on its estimate.</td></tr><tr><td><b>Precision</b></td><td>How narrowly an estimate is reported under its stated procedure; it is not the same as freedom from bias.</td></tr></tbody></table></div>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>IBM. (n.d.-a). <i>CINTERVAL subcommand (EXAMINE command)</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=examine-cinterval-subcommand-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=examine-cinterval-subcommand-command</a></p>\n<p>IBM. (n.d.-b). <i>Overview (EXAMINE command)</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=examine-overview-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=examine-overview-command</a></p>\n<p>IBM. (n.d.-c). <i>Independent-samples T test</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=tests-independent-samples-t-test\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=tests-independent-samples-t-test</a></p>\n<p>Microsoft. (n.d.). <i>Statistical functions (reference)</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/statistical-functions-reference\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/statistical-functions-reference</a></p>\n<p>The Pennsylvania State University. (n.d.-a). <i>Lesson 1: Collecting data</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson01\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson01</a></p>\n<p>The Pennsylvania State University. (n.d.-b). <i>Lesson 4: Confidence intervals</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson04\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson04</a></p>\n<p>The Pennsylvania State University. (n.d.-c). <i>Lesson 8: Inference for one sample</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson08\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson08</a></p>\n<p>The Pennsylvania State University. (n.d.-d). <i>Lesson 9: Inference for two samples</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson09\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson09</a></p>\n<p>The Pennsylvania State University. (n.d.-e). <i>Lesson 1: Estimating population mean and total under SRS</i>. STAT 506: Sampling Theory and Methods. <a href=\"https://online.stat.psu.edu/stat506/Lesson01\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat506/Lesson01</a></p>\n<p>The Pennsylvania State University. (n.d.-f). <i>Lesson 11: Applied problems for survey sampling</i>. STAT 506: Sampling Theory and Methods. <a href=\"https://online.stat.psu.edu/stat506/Lesson11\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat506/Lesson11</a></p>"}]};
globalThis.LESSON_I18N = {"zh":{"S05P Lab Checkpoints":"S05P 实验检查点","GC1015 · Session 5 · Build it in Excel or SPSS, check it here":"GC1015 · 第 5 课 · 在 Excel 或 SPSS 中完成，在这里核对","Finish":"完成","Your lab results":"你的实验结果","Get set":"准备就绪","Part A: frame and nonresponse":"A 部分：抽样框与无应答","Part B: mean duration":"B 部分：平均时长","Part C: share and sample size":"C 部分：占比与样本量","Lab files":"实验文件","Work in your saved copy of <code>S05P_Learning_Workbook.xlsx</code>. Yellow cells are yours to build. Each Part has a \"Check your work\" box.":"在你保存的 <code>S05P_Learning_Workbook.xlsx</code> 副本中操作。黄色单元格由你来完成。每个部分都有一个“Check your work”框。","Part":"部分","Start at":"起点","Finish check":"完成检查","A":"A","Part A, B7":"A 部分，B7","B10 to B12: 24.0%, 19.2%, 39.2%":"B10 到 B12：24.0%、19.2%、39.2%","B":"B","Part B, B7":"B 部分，B7","B10 to B11: 39.62, 44.38 min":"B10 到 B11：39.62、44.38 分钟","C":"C","Part C, B7":"C 部分，B7","B12: 438 completed pickups":"B12：438 笔已完成观测的取货","Dataset: cedar_loop_pickups.csv, 2,400 rows, one per pickup ID in the frame.":"数据集：cedar_loop_pickups.csv，2,400 行，抽样框中每个取货单 ID 一行。","SPSS: set the CD line to your lab folder, run H0 once, then H1, H2 and H3.":"SPSS：把 CD 行（the CD line）设为你的实验文件夹，先运行一次 H0，再运行 H1、H2 和 H3。","Part A: counts":"A 部分：计数","Checkpoint A":"检查点 A","Part A: rate and bounds":"A 部分：比率与界限","Part B: 95% mean interval":"B 部分：均值的 95% 置信区间","Checkpoint B":"检查点 B","Part C: share interval and plan":"C 部分：占比区间与计划","Checkpoint C":"检查点 C","Take-home choice":"课后任务选择","Meet your dataset":"认识你的数据集","Count first, then calculate. A blank cell is a missing outcome, not a zero.":"先计数，再计算。空白单元格是缺失的结果，不是零。","This is <code>cedar_loop_pickups.csv</code>: one row for each of the 2,400 pickup IDs in the audited frame. <code>delay_flag</code> and <code>slow_flag</code> are the same 0/1 indicator: 1 means more than 50 minutes.":"这是 <code>cedar_loop_pickups.csv</code>：核查的抽样框中 2,400 个取货单 ID 各占一行。<code>delay_flag</code> 和 <code>slow_flag</code> 是同一个 0/1 指示变量：1 表示超过 50 分钟。","Which blanks matter?":"哪些空白值重要？","Most rows have blank outcome columns. Only some of those blanks belong to invited pickups.":"大多数行的结果列是空白的。这些空白中只有一部分属于受邀取货。","Use the explorer. Fill in both counts.":"使用数据浏览器。填写两个计数。","<p>2,300 rows have no outcome, but 2,275 of them were never invited. Only the 25 nonresponse rows belong in the nonresponse bounds. Treating all 2,300 blanks as invited nonrespondents is the most common slip in Part A.</p>":"<p>有 2,300 行没有结果，但其中 2,275 行从未被邀请。只有那 25 个无应答行属于无应答界限。把全部 2,300 个空白都当作受邀的未应答者，是 A 部分最常见的失误。</p>","rows with a blank delay_flag = {{blank}}":"delay_flag 为空白的行 = {{blank}}","blank rows that were invited (nonresponse) = {{miss}}":"受邀的空白行（nonresponse） = {{miss}}","Set delay_flag to (blank). That gives 2,275 not invited plus 25 nonresponse rows.":"把 delay_flag 设为 (blank)。这样会得到 2,275 个未受邀行，加上 25 个 nonresponse 行。","Rows with a blank delay flag":"延误标记为空白的行","Keep delay_flag = (blank) and add invitation_status = nonresponse. Only these rows were selected but gave no outcome.":"保持 delay_flag = (blank)，再加上 invitation_status = nonresponse。只有这些行被抽中但没有给出结果。","Invited rows with a blank flag":"标记为空白的受邀行","Checkpoint A: the counts":"检查点 A：计数","In <code>IN-CLASS_Lab Part A</code>, B7 to B9 count rows in the Pickups table.":"在 <code>IN-CLASS_Lab Part A</code> 中，B7 到 B9 统计 Pickups 表中的行数。","Type what your workbook shows in B7 to B9.":"输入你的工作簿在 B7 到 B9 中显示的数值。","<p>125 invited, 100 eligible respondents, 24 delayed. SPSS H1 shows the same: invitation_status counts of 2,275, 25 and 100, and among respondents 76 zeros and 24 ones in delay_flag.</p>":"<p>受邀 125，合格应答者 100，延误 24。SPSS H1 显示的结果相同：invitation_status 的计数为 2,275、25 和 100；在应答者中，delay_flag 有 76 个值为零、24 个值为一。</p>","B7   invited pickups = {{inv}}":"B7   受邀取货单 = {{inv}}","B8   eligible respondents = {{resp}}":"B8   合格应答者 = {{resp}}","B9   delayed respondents = {{slow}}":"B9   延误的应答者 = {{slow}}","B7 counts responded plus nonresponse rows. If you see 100, you counted respondents only and left out the 25 invited nonrespondents.":"B7 统计 responded 行加上 nonresponse 行。如果你看到 100，说明你只统计了应答者，漏掉了 25 位受邀的未应答者。","B7 invited pickups":"B7 受邀取货单","B8 counts responded rows with a flag of 0 or 1. If your count is above 100, blank flags were counted as zeros. Missing outcomes are not on-time pickups.":"B8 统计标记为 0 或 1 的 responded 行。如果你的计数超过 100，说明空白标记被当成了零。缺失的结果不等于准时取货。","B8 eligible respondents":"B8 合格应答者","B9 = COUNTIFS(Pickups[invitation_status], \"responded\", Pickups[delay_flag], 1). Keep the responded criterion.":"B9 = COUNTIFS(Pickups[invitation_status], \"responded\", Pickups[delay_flag], 1)。保留 responded 这个条件。","B9 delayed respondents":"B9 延误的应答者","125 invited, 100 respondents, 24 delayed":"受邀 125，应答者 100，延误 24","Checkpoint A: rate and bounds":"检查点 A：比率与界限","B10 to B12 are formatted as percentages with one decimal.":"B10 到 B12 的格式为保留一位小数的百分比。","Type what your workbook shows in B10 to B12.":"输入你的工作簿在 B10 到 B12 中显示的数值。","<p>24.0% describes respondents. The invitation bounds, 19.2% and 39.2%, show where the share among all 125 selected would land if none, or all, of the 25 missing pickups were slow. The range crosses the 20% target.</p>":"<p>24.0% 描述的是应答者。邀请口径界限 19.2% 和 39.2% 显示：如果 25 笔缺失取货中没有一笔是慢单，或全部是慢单，全部 125 笔抽中取货的占比会落在哪里。这个范围跨过了 20% 的目标。</p>","B10  respondent delay rate = {{r}}":"B10  应答者延误率 = {{r}}","B11  best-case invitation bound = {{lo}}":"B11  最好情况的邀请口径界限 = {{lo}}","B12  worst-case invitation bound = {{hi}}":"B12  最坏情况的邀请口径界限 = {{hi}}","B10 = B9 / B8 = 24 / 100. If you see 19.2%, you divided by invitations. If you see 2400%, you multiplied by 100 before the % format.":"B10 = B9 / B8 = 24 / 100。如果你看到 19.2%，说明你除以的是邀请数。如果你看到 2400%，说明你在设置 % 格式之前先乘了 100。","B10 respondent delay rate":"B10 应答者延误率","B11 = B9 / B7 = 24 / 125. Divide by the 125 invitations, not by the 100 responses.":"B11 = B9 / B7 = 24 / 125。要除以 125 份邀请，而不是 100 份应答。","B11 best-case bound":"B11 最好情况界限","B12 = (B9 + B7 − B8) / B7 = (24 + 25) / 125. Only the 25 invited nonrespondents can be slow, not all 2,300 blank rows.":"B12 = (B9 + B7 − B8) / B7 = (24 + 25) / 125。只有 25 位受邀的未应答者可能是慢单，而不是全部 2,300 个空白行。","B12 worst-case bound":"B12 最坏情况界限","24.0%; bounds 19.2% to 39.2%":"24.0%；界限 19.2% 到 39.2%","What goes in B14?":"B14 中应填什么？","Your rate in B10 is 24.0%. Your bounds in B11 and B12 are 19.2% and 39.2%.":"你在 B10 中的比率是 24.0%。你在 B11 和 B12 中的界限是 19.2% 和 39.2%。","Which dropdown statement belongs in B14?":"B14 应该选下拉列表中的哪一项陈述？","<p>Pick the first statement in B14. In B15, name both denominators (100 respondents and 125 invitations) and what remains unobserved (the 25 missing outcomes).</p>":"<p>在 B14 中选择第一项陈述。在 B15 中写明两个分母（100 位应答者和 125 份邀请），以及仍未观察到的部分（25 个缺失的结果）。</p>","The respondent rate describes observed outcomes; the bounds show how missing outcomes could change it":"应答者比率描述的是已观察到的结果；界限显示缺失的结果可能如何改变它","The respondent rate alone establishes the delay share for every pickup in the frame":"仅凭应答者比率就能确定抽样框中所有取货的延误占比","The 24.0% covers the 100 respondents only. The 25 missing outcomes could move the share from 19.2% to 39.2%.":"24.0% 只涵盖 100 位应答者。25 个缺失的结果可能让占比在 19.2% 到 39.2% 之间变动。","The invitation bounds assign known probabilities to the missing outcomes":"邀请口径界限为缺失的结果赋予了已知概率","The bounds are extreme scenarios: none slow or all slow. They carry no probability.":"界限是两种极端情景：全都不是慢单，或全是慢单。它们不带有任何概率。","Not-invited pickups should be counted as nonrespondents in the invitation bounds":"在邀请口径界限中，未受邀的取货应算作未应答者","Not-invited pickups were never selected, so they cannot be nonrespondents. Only the 25 count.":"未受邀的取货从未被抽中，因此不可能是未应答者。只有那 25 笔才算。","Audit the durations first":"先核查时长","Before B7, check the metric for impossible or missing values. Respondent rows hold <code>duration</code> in minutes.":"在做 B7 之前，先检查这个指标有没有不可能的值或缺失值。应答者行中的 <code>duration</code> 以分钟为单位。","Open the duration filter and look at its values. What do you find?":"打开 duration 筛选器，查看其中的值。你发现了什么？","<p>All 100 respondent durations are positive and plausible. This fictional teaching file was built to match the case summaries, so durations repeat: every delayed pickup shows 63.25 minutes and every other one 35.29. Real pickup times would vary more. The mean and SD still match the case: 42 and 12 minutes.</p>\n          <p>Never replace blanks with 0. Averaged over all 2,400 rows, the mean would drop to 1.75 minutes.</p>":"<p>全部 100 个应答者时长都是正数且合理。这份虚构的教学文件是为匹配案例摘要而构建的，所以时长会重复：每笔延误取货都显示 63.25 分钟，其余每笔都是 35.29 分钟。真实的取货时长变异会更大。均值和 SD 仍与案例一致：42 分钟和 12 分钟。</p>\n          <p>绝不要用 0 替换空白。如果对全部 2,400 行求平均，均值会降到 1.75 分钟。</p>","Two repeated values, about 35.29 and 63.25 minutes, plus blanks; nothing impossible":"两个重复出现的值，约 35.29 和 63.25 分钟，外加空白；没有不可能的值","Some negative durations that must be removed first":"一些必须先删除的负时长","The filter lists no negative values. Check before you delete anything.":"筛选器中没有列出负值。删除任何数据之前先检查。","Blank durations should be entered as 0 minutes":"空白时长应填为 0 分钟","Blanks are missing outcomes. As zeros they would pull the mean far below 42.":"空白是缺失的结果。若当作零，会把均值拉到远低于 42。","Durations above 300 minutes that look like typing errors":"超过 300 分钟、看起来像输入错误的时长","The largest value is about 63.25 minutes. Nothing looks impossible.":"最大值约为 63.25 分钟。没有看起来不可能的值。","Checkpoint B: mean, SD, SE and t*":"检查点 B：均值、SD、SE 和 t*","In <code>IN-CLASS_Lab Part B</code>, build B7, B8 and B9, then B12, the t multiplier. B12 shows four decimals.":"在 <code>IN-CLASS_Lab Part B</code> 中，先完成 B7、B8 和 B9，再完成 B12，即 t 乘数。B12 显示四位小数。","Type what your workbook shows.":"输入你的工作簿显示的值。","<p>Mean 42.00, SD 12.00, SE 1.20 minutes, and t* = 1.9842 with df = 99. SPSS H2 Descriptives shows the same mean, SD and standard error.</p>":"<p>均值 42.00，SD 12.00，SE 1.20 分钟，df = 99 时 t* = 1.9842。SPSS H2 的 Descriptives 输出显示了相同的均值、SD 和标准误。</p>","B7   mean = {{m}} minutes":"B7   均值 = {{m}} 分钟","B8   sample SD = {{s}} minutes":"B8   样本 SD = {{s}} 分钟","B9   SE = {{se}} minutes":"B9   SE = {{se}} 分钟","B12  t* = {{t}}":"B12  t* = {{t}}","B7 = AVERAGE(Pickups[duration]), which skips blanks. If you see 1.75, blanks were turned into zeros.":"B7 = AVERAGE(Pickups[duration])，它会跳过空白。如果你看到 1.75，说明空白被变成了零。","B7 mean duration":"B7 平均时长","B8 = STDEV.S(Pickups[duration]). If you see 11.94, you used STDEV.P.":"B8 = STDEV.S(Pickups[duration])。如果你看到 11.94，说明你用的是 STDEV.P。","B8 sample standard deviation":"B8 样本标准差","B9 = B8 / SQRT(COUNT(Pickups[duration])) = 12 / 10. If you see 0.12, you divided by n instead of √n.":"B9 = B8 / SQRT(COUNT(Pickups[duration])) = 12 / 10。如果你看到 0.12，说明你除以的是 n 而不是 √n。","B9 standard error":"B9 标准误","B12 = T.INV.2T(0.05, 99) = 1.9842. If you see 1.9840, you used df = 100 instead of n − 1 = 99. If you see 1.6604, you used a one-tailed value.":"B12 = T.INV.2T(0.05, 99) = 1.9842。如果你看到 1.9840，说明你用了 df = 100，而不是 n − 1 = 99。如果你看到 1.6604，说明你用的是单尾值。","B12 t multiplier":"B12 t 乘数","Checkpoint B: the interval":"检查点 B：区间","B10 and B11 combine B7, B9 and B12.":"B10 和 B11 结合了 B7、B9 和 B12。","Type your 95% limits from B10 and B11.":"输入 B10 和 B11 中的 95% 上下限。","<p>39.62 to 44.38 minutes, the same as the SPSS H2 \"95% Confidence Interval for Mean\". It is a range for the population mean, not for single pickups.</p>":"<p>39.62 到 44.38 分钟，与 SPSS H2 中的“95% Confidence Interval for Mean”（均值置信区间）相同。这是总体均值的范围，而不是单笔取货的范围。</p>","B10  lower = {{lo}} minutes":"B10  下限 = {{lo}} 分钟","B11  upper = {{hi}} minutes":"B11  上限 = {{hi}} 分钟","B10 = B7 − B12 * B9 = 42 − 1.9842 × 1.20. If you see 40.01, B12 used a one-tailed value.":"B10 = B7 − B12 * B9 = 42 − 1.9842 × 1.20。如果你看到 40.01，说明 B12 用的是单尾值。","B10 lower limit":"B10 下限","B11 = B7 + B12 * B9 = 42 + 1.9842 × 1.20.":"B11 = B7 + B12 * B9 = 42 + 1.9842 × 1.20。","B11 upper limit":"B11 上限","39.62 to 44.38 min":"39.62 到 44.38 分钟","Your interval in B10 and B11 runs from 39.62 to 44.38 minutes.":"你在 B10 和 B11 中的区间是 39.62 到 44.38 分钟。","<p>Pick the statement about the population mean in B14. In B15, describe what the SE measures, compare the mean interval with the target, and state one limitation, such as the 25 missing confirmations.</p>":"<p>在 B14 中选择关于总体均值的那项陈述。在 B15 中说明 SE 衡量的是什么，把均值区间与目标进行比较，并指出一项局限，例如 25 份缺失的确认。</p>","It estimates a population mean, not where 95% of single durations fall":"它估计的是总体均值，而不是 95% 的单笔时长落在哪里","It proves that hiring more staff will reduce duration":"它证明增加人手会缩短时长","The data are an observational snapshot. Staffing never changed, so no staffing effect can be shown.":"这些数据是观察性快照。人员配置从未改变，因此无法显示人员配置的效果。","It contains 95% of recorded individual durations":"它包含了 95% 的已记录单笔时长","In this file, no single duration falls between 39.62 and 44.38. The interval is about the mean.":"在这个文件中，没有任何一笔时长落在 39.62 到 44.38 之间。这个区间针对的是均值。","It is a range for the 2,400-row count, not for duration":"它是 2,400 行计数的范围，而不是时长的范围","The interval is in minutes. It estimates mean duration, not a count of rows.":"这个区间以分钟为单位。它估计的是平均时长，而不是行数。","Checkpoint C: the share":"检查点 C：占比","In <code>IN-CLASS_Lab Part C</code>, B7 to B9 rebuild the observed share from the completed outcomes.":"在 <code>IN-CLASS_Lab Part C</code> 中，B7 到 B9 根据已完成的观测结果重新计算观察到的占比。","<p>100 completed outcomes, 24 delays, a share of 24.0%. SPSS H3 shows the same valid 0 and 1 counts: 76 and 24.</p>":"<p>100 个已完成的观测结果，24 次延误，占比 24.0%。SPSS H3 显示了相同的有效 0 和 1 计数：76 和 24。</p>","B7   eligible recorded outcomes = {{n}}":"B7   合格的已记录结果 = {{n}}","B8   recorded delay outcomes = {{x}}":"B8   已记录的延误结果 = {{x}}","B9   observed delay share = {{p}}":"B9   观察到的延误占比 = {{p}}","B7 counts responded rows with a flag of 0 or 1, as in Part A B8. Do not use the 125 invitations.":"B7 统计标记为 0 或 1 的 responded 行，与 A 部分的 B8 相同。不要使用 125 份邀请。","B7 eligible recorded outcomes":"B7 合格的已记录结果","Keep the case definition: delay_flag = 1 means more than 50 minutes. Do not count missing outcomes as on-time.":"保持案例定义：delay_flag = 1 表示超过 50 分钟。不要把缺失的结果算作准时。","B8 recorded delay outcomes":"B8 已记录的延误结果","B9 = B8 / B7. If you see 2400%, you multiplied by 100 before the % format.":"B9 = B8 / B7。如果你看到 2400%，说明你在设置 % 格式之前先乘了 100。","B9 observed delay share":"B9 观察到的延误占比","Checkpoint C: interval and sample size":"检查点 C：区间与样本量","B10 and B11 use z* = 1.96. B12 plans for a margin of ±4 percentage points, using the observed share.":"B10 和 B11 使用 z* = 1.96。B12 用观察到的占比，按 ±4 个百分点的误差范围做规划。","<p>The interval runs from 15.63% to 32.37%, and a ±4-point margin needs 438 completed pickups. With no planning share, 0.50 would give 601. At an 80% response rate, 438 completed pickups need about 548 invitations.</p>":"<p>区间为 15.63% 到 32.37%，±4 个百分点的误差范围需要 438 笔已完成观测的取货。如果没有规划比例，用 0.50 会得到 601。在 80% 的应答率下，438 笔已完成观测的取货需要约 548 份邀请。</p>","B10  lower = {{lo}}":"B10  下限 = {{lo}}","B11  upper = {{hi}}":"B11  上限 = {{hi}}","B12  completed pickups needed = {{n}}":"B12  所需已完成观测的取货数 = {{n}}","B10 = B9 − 1.96 * SQRT(B9 * (1 − B9) / B7). Use B7 = 100 completed outcomes, not 125 invitations.":"B10 = B9 − 1.96 * SQRT(B9 * (1 − B9) / B7)。使用 B7 = 100 个已完成的观测结果，而不是 125 份邀请。","B11 = B9 + 1.96 * SQRT(B9 * (1 − B9) / B7).":"B11 = B9 + 1.96 * SQRT(B9 * (1 − B9) / B7)。","B12 = CEILING.MATH(1.96^2 * B9 * (1 − B9) / 0.04^2): 437.94 rounds up to 438. If you see 437, you rounded down. If you see about 7,604, you treated 4 points as 4% of 24%.":"B12 = CEILING.MATH(1.96^2 * B9 * (1 − B9) / 0.04^2)：437.94 向上取整为 438。如果你看到 437，说明你向下取整了。如果你看到约 7,604，说明你把 4 个百分点当成了 24% 的 4%。","B12 completed pickups needed":"B12 所需已完成观测的取货数","15.63% to 32.37%; plan 438 completed":"15.63% 到 32.37%；计划 438 笔已完成观测","What goes in B13?":"B13 里填什么？","Your plan in B12 asks for 438 completed pickups.":"你在 B12 中的计划需要 438 笔已完成观测的取货。","Which dropdown statement belongs in B13?":"B13 应该选下拉列表中的哪一句？","<p>Pick the precision statement in B13. In B14, separate completed outcomes from invitations, and say what a bigger sample cannot repair: the pattern of who responds.</p>":"<p>在 B13 中选择关于精确度的那项陈述。在 B14 中区分已完成的观测结果和邀请，并说明更大的样本无法弥补什么：谁会应答的模式。</p>","A completed-sample precision target does not by itself correct missing-outcome bias":"完成样本的精确度目标本身并不能纠正缺失结果造成的偏差","The planned sample size is automatically the number of invitations needed":"计划的样本量自然就等于所需的邀请数","438 counts completed outcomes. At 80% response you would invite about 548, and response could still be uneven.":"438 统计的是已完成的观测结果。在 80% 的应答率下，你需要邀请约 548 人，而且应答仍可能不均衡。","A percentage-point margin is a percent change relative to the respondent share":"以百分点表示的误差范围，是相对于应答者占比的百分比变化","A margin of ±4 points means 24% ± 4 points, not 4% of 24%.":"±4 个百分点的误差范围是指 24% ± 4 个百分点，而不是 24% 的 4%。","The observed event share proves permanent staffing changes pickup outcomes":"观察到的事件占比证明长期人员配置会改变取货结果","Staffing was not changed in this audit. A share alone cannot show a staffing effect.":"这次核查中人员配置没有改变。单凭一个占比无法显示人员配置的效果。","Take-home: Option A or Option B?":"课后任务：方案 A 还是方案 B？","Option A is permanent evening staff now. Option B is a bounded audit pilot before any permanent spending.":"方案 A 是现在就增加长期晚班人员。方案 B 是在任何长期支出之前，先开展限定范围的核查试点。","Which choice does your evidence support best? Then write your own version in B15.":"你的证据最支持哪个选择？然后在 B15 中写出你自己的版本。","<p>Option B fits the evidence. The invitation bounds (19.2% to 39.2%) and the 95% interval (15.63% to 32.37%) both cross 20%, and the snapshot cannot show a staffing effect. Write B15 in your own words: cite both ranges, the 438 target, one limitation, and what would change your mind.</p>":"<p>方案 B 与证据相符。邀请口径界限（19.2% 到 39.2%）和 95% 置信区间（15.63% 到 32.37%）都跨过了 20%，而且这份快照无法显示人员配置的效果。用你自己的话写 B15：引用这两个范围、438 这个目标、一项局限，以及什么会改变你的想法。</p>","Option B: both the bounds and the interval cross the 20% target":"方案 B：界限和区间都跨过了 20% 的目标","Option A: the respondent rate of 24.0% is above 20%":"方案 A：应答者比率 24.0% 高于 20%","One estimate is not enough. 19.2% to 39.2% and 15.63% to 32.37% both reach below 20%.":"一个估计值不够。19.2% 到 39.2% 和 15.63% 到 32.37% 都延伸到 20% 以下。","Option A: collecting 438 completed pickups would take too long":"方案 A：收集 438 笔已完成观测的取货太耗时","Time pressure does not change the evidence. Weigh a permanent cost against a short, bounded pilot.":"时间压力不会改变证据。请权衡长期成本与一次短期、限定范围的试点。","Neither: the 15.63% lower limit proves the target is met":"都不选：15.63% 的下限证明目标已经达成","The interval also reaches 32.37%. It shows neither a breach nor compliance.":"区间也延伸到 32.37%。它既没有显示超标，也没有显示达标。","Option B: a bounded audit pilot":"方案 B：限定范围的核查试点","Take-home: write B15":"课后任务：撰写 B15","Your checkpoints are saved in this browser. At home, spend 15 minutes on <code>IN-CLASS_Lab Part C</code>, cell B15.":"你的检查点已保存在这个浏览器中。回家后，花 15 分钟完成 <code>IN-CLASS_Lab Part C</code> 的 B15 单元格。","Recommend Option A or Option B in your own words.":"用你自己的话推荐方案 A 或方案 B。","Cite the invitation bounds (Part A, B11 and B12), both 95% intervals (Part B and Part C) and the completed-sample target (Part C, B12).":"引用邀请口径界限（A 部分，B11 和 B12）、两个 95% 置信区间（B 部分和 C 部分），以及完成样本目标（C 部分，B12）。","Name one limitation and one result that would change your choice. For example: follow-up shows that most of the 25 missing pickups were slow.":"指出一项局限，以及一个会改变你选择的结果。例如：追访显示 25 笔缺失取货中大多数是慢单。","Open this page from the class site to see the dataset.":"请从课程网站打开此页面以查看数据集。","Lab checkpoints complete":"实验检查点已完成","Your checkpoint answers are saved. Finish the take-home recommendation in your workbook.":"你的检查点答案已保存。请在工作簿中完成课后任务的建议。"},"es":{"S05P Lab Checkpoints":"Puntos de control del laboratorio S05P","GC1015 · Session 5 · Build it in Excel or SPSS, check it here":"GC1015 · Sesión 5 · Constrúyelo en Excel o SPSS, compruébalo aquí","Finish":"Terminar","Your lab results":"Tus resultados del laboratorio","Get set":"Prepárate","Part A: frame and nonresponse":"Parte A: marco y no respuesta","Part B: mean duration":"Parte B: duración media","Part C: share and sample size":"Parte C: proporción y tamaño de muestra","Lab files":"Archivos del laboratorio","Work in your saved copy of <code>S05P_Learning_Workbook.xlsx</code>. Yellow cells are yours to build. Each Part has a \"Check your work\" box.":"Trabaja en tu copia guardada de <code>S05P_Learning_Workbook.xlsx</code>. Las celdas amarillas son las que tú construyes. Cada Parte tiene un cuadro \"Check your work\" (revisa tu trabajo).","Part":"Parte","Start at":"Empieza en","Finish check":"Comprobación final","A":"A","Part A, B7":"Parte A, B7","B10 to B12: 24.0%, 19.2%, 39.2%":"B10 a B12: 24.0%, 19.2%, 39.2%","B":"B","Part B, B7":"Parte B, B7","B10 to B11: 39.62, 44.38 min":"B10 a B11: 39.62, 44.38 min","C":"C","Part C, B7":"Parte C, B7","B12: 438 completed pickups":"B12: 438 recogidas completadas","Dataset: cedar_loop_pickups.csv, 2,400 rows, one per pickup ID in the frame.":"Conjunto de datos: cedar_loop_pickups.csv, 2,400 filas, una por cada ID de recogida del marco.","SPSS: set the CD line to your lab folder, run H0 once, then H1, H2 and H3.":"SPSS: apunta la línea CD a tu carpeta del laboratorio, ejecuta H0 una vez y luego H1, H2 y H3.","Part A: counts":"Parte A: conteos","Checkpoint A":"Punto de control A","Part A: rate and bounds":"Parte A: tasa y límites","Part B: 95% mean interval":"Parte B: intervalo del 95% para la media","Checkpoint B":"Punto de control B","Part C: share interval and plan":"Parte C: intervalo de la proporción y plan","Checkpoint C":"Punto de control C","Take-home choice":"Decisión de la tarea para casa","Meet your dataset":"Conoce tu conjunto de datos","Count first, then calculate. A blank cell is a missing outcome, not a zero.":"Primero cuenta, luego calcula. Una celda en blanco es un resultado faltante, no un cero.","This is <code>cedar_loop_pickups.csv</code>: one row for each of the 2,400 pickup IDs in the audited frame. <code>delay_flag</code> and <code>slow_flag</code> are the same 0/1 indicator: 1 means more than 50 minutes.":"Este es <code>cedar_loop_pickups.csv</code>: una fila por cada uno de los 2,400 ID de recogida del marco auditado. <code>delay_flag</code> y <code>slow_flag</code> son el mismo indicador 0/1: 1 significa más de 50 minutos.","Which blanks matter?":"¿Qué celdas en blanco importan?","Most rows have blank outcome columns. Only some of those blanks belong to invited pickups.":"La mayoría de las filas tiene columnas de resultado en blanco. Solo algunas de esas celdas en blanco corresponden a recogidas invitadas.","Use the explorer. Fill in both counts.":"Usa el explorador. Completa ambos conteos.","<p>2,300 rows have no outcome, but 2,275 of them were never invited. Only the 25 nonresponse rows belong in the nonresponse bounds. Treating all 2,300 blanks as invited nonrespondents is the most common slip in Part A.</p>":"<p>2,300 filas no tienen resultado, pero 2,275 de ellas nunca fueron invitadas. Solo las 25 filas de no respuesta entran en los límites por no respuesta. Tratar las 2,300 filas en blanco como no respondientes invitados es el error más común de la Parte A.</p>","rows with a blank delay_flag = {{blank}}":"filas con delay_flag en blanco = {{blank}}","blank rows that were invited (nonresponse) = {{miss}}":"filas en blanco que fueron invitadas (nonresponse) = {{miss}}","Set delay_flag to (blank). That gives 2,275 not invited plus 25 nonresponse rows.":"Pon delay_flag en (blank). Eso da 2,275 filas no invitadas más 25 filas de no respuesta.","Rows with a blank delay flag":"Filas con el indicador de retraso en blanco","Keep delay_flag = (blank) and add invitation_status = nonresponse. Only these rows were selected but gave no outcome.":"Mantén delay_flag = (blank) y agrega invitation_status = nonresponse. Solo estas filas fueron seleccionadas pero no dieron resultado.","Invited rows with a blank flag":"Filas invitadas con el indicador en blanco","Checkpoint A: the counts":"Punto de control A: los conteos","In <code>IN-CLASS_Lab Part A</code>, B7 to B9 count rows in the Pickups table.":"En <code>IN-CLASS_Lab Part A</code>, B7 a B9 cuentan filas de la tabla Pickups.","Type what your workbook shows in B7 to B9.":"Escribe lo que muestra tu libro de trabajo en B7 a B9.","<p>125 invited, 100 eligible respondents, 24 delayed. SPSS H1 shows the same: invitation_status counts of 2,275, 25 and 100, and among respondents 76 zeros and 24 ones in delay_flag.</p>":"<p>125 invitadas, 100 respondientes elegibles, 24 con retraso. SPSS H1 muestra lo mismo: conteos de invitation_status de 2,275, 25 y 100, y entre los respondientes, 76 ceros y 24 unos en delay_flag.</p>","B7   invited pickups = {{inv}}":"B7   recogidas invitadas = {{inv}}","B8   eligible respondents = {{resp}}":"B8   respondientes elegibles = {{resp}}","B9   delayed respondents = {{slow}}":"B9   respondientes con retraso = {{slow}}","B7 counts responded plus nonresponse rows. If you see 100, you counted respondents only and left out the 25 invited nonrespondents.":"B7 cuenta las filas responded más las nonresponse. Si ves 100, contaste solo a los respondientes y dejaste fuera a los 25 no respondientes invitados.","B7 invited pickups":"B7 recogidas invitadas","B8 counts responded rows with a flag of 0 or 1. If your count is above 100, blank flags were counted as zeros. Missing outcomes are not on-time pickups.":"B8 cuenta las filas responded con un indicador de 0 o 1. Si tu conteo es mayor que 100, los indicadores en blanco se contaron como ceros. Los resultados faltantes no son recogidas a tiempo.","B8 eligible respondents":"B8 respondientes elegibles","B9 = COUNTIFS(Pickups[invitation_status], \"responded\", Pickups[delay_flag], 1). Keep the responded criterion.":"B9 = COUNTIFS(Pickups[invitation_status], \"responded\", Pickups[delay_flag], 1). Mantén el criterio responded.","B9 delayed respondents":"B9 respondientes con retraso","125 invited, 100 respondents, 24 delayed":"125 invitadas, 100 respondientes, 24 con retraso","Checkpoint A: rate and bounds":"Punto de control A: tasa y límites","B10 to B12 are formatted as percentages with one decimal.":"B10 a B12 tienen formato de porcentaje con un decimal.","Type what your workbook shows in B10 to B12.":"Escribe lo que muestra tu libro de trabajo en B10 a B12.","<p>24.0% describes respondents. The invitation bounds, 19.2% and 39.2%, show where the share among all 125 selected would land if none, or all, of the 25 missing pickups were slow. The range crosses the 20% target.</p>":"<p>24.0% describe a los respondientes. Los límites sobre las invitaciones, 19.2% y 39.2%, muestran dónde quedaría la proporción entre las 125 seleccionadas si ninguna, o todas, de las 25 recogidas faltantes fueran lentas. El rango cruza la meta del 20%.</p>","B10  respondent delay rate = {{r}}":"B10  tasa de retraso de los respondientes = {{r}}","B11  best-case invitation bound = {{lo}}":"B11  límite sobre las invitaciones, mejor caso = {{lo}}","B12  worst-case invitation bound = {{hi}}":"B12  límite sobre las invitaciones, peor caso = {{hi}}","B10 = B9 / B8 = 24 / 100. If you see 19.2%, you divided by invitations. If you see 2400%, you multiplied by 100 before the % format.":"B10 = B9 / B8 = 24 / 100. Si ves 19.2%, dividiste entre las invitaciones. Si ves 2400%, multiplicaste por 100 antes de aplicar el formato %.","B10 respondent delay rate":"B10 tasa de retraso de los respondientes","B11 = B9 / B7 = 24 / 125. Divide by the 125 invitations, not by the 100 responses.":"B11 = B9 / B7 = 24 / 125. Divide entre las 125 invitaciones, no entre las 100 respuestas.","B11 best-case bound":"B11 límite del mejor caso","B12 = (B9 + B7 − B8) / B7 = (24 + 25) / 125. Only the 25 invited nonrespondents can be slow, not all 2,300 blank rows.":"B12 = (B9 + B7 − B8) / B7 = (24 + 25) / 125. Solo las recogidas de los 25 no respondientes invitados pueden ser lentas, no las 2,300 filas en blanco.","B12 worst-case bound":"B12 límite del peor caso","24.0%; bounds 19.2% to 39.2%":"24.0%; límites de 19.2% a 39.2%","What goes in B14?":"¿Qué va en B14?","Your rate in B10 is 24.0%. Your bounds in B11 and B12 are 19.2% and 39.2%.":"Tu tasa en B10 es 24.0%. Tus límites en B11 y B12 son 19.2% y 39.2%.","Which dropdown statement belongs in B14?":"¿Qué afirmación de la lista desplegable va en B14?","<p>Pick the first statement in B14. In B15, name both denominators (100 respondents and 125 invitations) and what remains unobserved (the 25 missing outcomes).</p>":"<p>Elige la primera afirmación en B14. En B15, nombra ambos denominadores (100 respondientes y 125 invitaciones) y lo que sigue sin observarse (los 25 resultados faltantes).</p>","The respondent rate describes observed outcomes; the bounds show how missing outcomes could change it":"La tasa de los respondientes describe resultados observados; los límites muestran cómo podrían cambiarla los resultados faltantes","The respondent rate alone establishes the delay share for every pickup in the frame":"La tasa de los respondientes, por sí sola, establece la proporción de retrasos para cada recogida del marco","The 24.0% covers the 100 respondents only. The 25 missing outcomes could move the share from 19.2% to 39.2%.":"El 24.0% cubre solo a los 100 respondientes. Los 25 resultados faltantes podrían situar la proporción entre 19.2% y 39.2%.","The invitation bounds assign known probabilities to the missing outcomes":"Los límites sobre las invitaciones asignan probabilidades conocidas a los resultados faltantes","The bounds are extreme scenarios: none slow or all slow. They carry no probability.":"Los límites son escenarios extremos: ninguna lenta o todas lentas. No llevan ninguna probabilidad asociada.","Not-invited pickups should be counted as nonrespondents in the invitation bounds":"Las recogidas no invitadas deberían contarse como no respondientes en los límites sobre las invitaciones","Not-invited pickups were never selected, so they cannot be nonrespondents. Only the 25 count.":"Las recogidas no invitadas nunca fueron seleccionadas, así que no pueden ser no respondientes. Solo cuentan las 25.","Audit the durations first":"Primero audita las duraciones","Before B7, check the metric for impossible or missing values. Respondent rows hold <code>duration</code> in minutes.":"Antes de B7, revisa si la métrica tiene valores imposibles o faltantes. Las filas de respondientes contienen <code>duration</code> en minutos.","Open the duration filter and look at its values. What do you find?":"Abre el filtro de duration y mira sus valores. ¿Qué encuentras?","<p>All 100 respondent durations are positive and plausible. This fictional teaching file was built to match the case summaries, so durations repeat: every delayed pickup shows 63.25 minutes and every other one 35.29. Real pickup times would vary more. The mean and SD still match the case: 42 and 12 minutes.</p>\n          <p>Never replace blanks with 0. Averaged over all 2,400 rows, the mean would drop to 1.75 minutes.</p>":"<p>Las 100 duraciones de los respondientes son positivas y plausibles. Este archivo didáctico ficticio se construyó para coincidir con los resúmenes del caso, así que las duraciones se repiten: cada recogida con retraso muestra 63.25 minutos y cada una de las demás, 35.29. Los tiempos reales de recogida variarían más. La media y la SD aun así coinciden con el caso: 42 y 12 minutos.</p>\n          <p>Nunca reemplaces las celdas en blanco con 0. Promediada sobre las 2,400 filas, la media bajaría a 1.75 minutos.</p>","Two repeated values, about 35.29 and 63.25 minutes, plus blanks; nothing impossible":"Dos valores repetidos, cerca de 35.29 y 63.25 minutos, más celdas en blanco; nada imposible","Some negative durations that must be removed first":"Algunas duraciones negativas que hay que eliminar primero","The filter lists no negative values. Check before you delete anything.":"El filtro no muestra valores negativos. Revisa antes de borrar cualquier cosa.","Blank durations should be entered as 0 minutes":"Las duraciones en blanco deberían registrarse como 0 minutos","Blanks are missing outcomes. As zeros they would pull the mean far below 42.":"Las celdas en blanco son resultados faltantes. Como ceros, bajarían la media muy por debajo de 42.","Durations above 300 minutes that look like typing errors":"Duraciones de más de 300 minutos que parecen errores de captura","The largest value is about 63.25 minutes. Nothing looks impossible.":"El valor más grande es cerca de 63.25 minutos. Nada parece imposible.","Checkpoint B: mean, SD, SE and t*":"Punto de control B: media, SD, SE y t*","In <code>IN-CLASS_Lab Part B</code>, build B7, B8 and B9, then B12, the t multiplier. B12 shows four decimals.":"En <code>IN-CLASS_Lab Part B</code>, construye B7, B8 y B9, y luego B12, el multiplicador t. B12 muestra cuatro decimales.","Type what your workbook shows.":"Escribe lo que muestra tu libro.","<p>Mean 42.00, SD 12.00, SE 1.20 minutes, and t* = 1.9842 with df = 99. SPSS H2 Descriptives shows the same mean, SD and standard error.</p>":"<p>Media 42.00, SD 12.00, SE 1.20 minutos, y t* = 1.9842 con df = 99. La salida Descriptives de SPSS H2 muestra la misma media, la misma SD y el mismo error estándar.</p>","B7   mean = {{m}} minutes":"B7   media = {{m}} minutos","B8   sample SD = {{s}} minutes":"B8   SD muestral = {{s}} minutos","B9   SE = {{se}} minutes":"B9   SE = {{se}} minutos","B12  t* = {{t}}":"B12  t* = {{t}}","B7 = AVERAGE(Pickups[duration]), which skips blanks. If you see 1.75, blanks were turned into zeros.":"B7 = AVERAGE(Pickups[duration]), que omite las celdas en blanco. Si ves 1.75, las celdas en blanco se convirtieron en ceros.","B7 mean duration":"B7 duración media","B8 = STDEV.S(Pickups[duration]). If you see 11.94, you used STDEV.P.":"B8 = STDEV.S(Pickups[duration]). Si ves 11.94, usaste STDEV.P.","B8 sample standard deviation":"B8 desviación estándar muestral","B9 = B8 / SQRT(COUNT(Pickups[duration])) = 12 / 10. If you see 0.12, you divided by n instead of √n.":"B9 = B8 / SQRT(COUNT(Pickups[duration])) = 12 / 10. Si ves 0.12, dividiste entre n en vez de √n.","B9 standard error":"B9 error estándar","B12 = T.INV.2T(0.05, 99) = 1.9842. If you see 1.9840, you used df = 100 instead of n − 1 = 99. If you see 1.6604, you used a one-tailed value.":"B12 = T.INV.2T(0.05, 99) = 1.9842. Si ves 1.9840, usaste df = 100 en vez de n − 1 = 99. Si ves 1.6604, usaste un valor de una cola.","B12 t multiplier":"B12 multiplicador t","Checkpoint B: the interval":"Punto de control B: el intervalo","B10 and B11 combine B7, B9 and B12.":"B10 y B11 combinan B7, B9 y B12.","Type your 95% limits from B10 and B11.":"Escribe tus límites del 95% de B10 y B11.","<p>39.62 to 44.38 minutes, the same as the SPSS H2 \"95% Confidence Interval for Mean\". It is a range for the population mean, not for single pickups.</p>":"<p>39.62 a 44.38 minutos, lo mismo que el \"95% Confidence Interval for Mean\" (intervalo de confianza para la media) de SPSS H2. Es un rango para la media poblacional, no para recogidas individuales.</p>","B10  lower = {{lo}} minutes":"B10  inferior = {{lo}} minutos","B11  upper = {{hi}} minutes":"B11  superior = {{hi}} minutos","B10 = B7 − B12 * B9 = 42 − 1.9842 × 1.20. If you see 40.01, B12 used a one-tailed value.":"B10 = B7 − B12 * B9 = 42 − 1.9842 × 1.20. Si ves 40.01, B12 usó un valor de una cola.","B10 lower limit":"B10 límite inferior","B11 = B7 + B12 * B9 = 42 + 1.9842 × 1.20.":"B11 = B7 + B12 * B9 = 42 + 1.9842 × 1.20.","B11 upper limit":"B11 límite superior","39.62 to 44.38 min":"39.62 a 44.38 min","Your interval in B10 and B11 runs from 39.62 to 44.38 minutes.":"Tu intervalo en B10 y B11 va de 39.62 a 44.38 minutos.","<p>Pick the statement about the population mean in B14. In B15, describe what the SE measures, compare the mean interval with the target, and state one limitation, such as the 25 missing confirmations.</p>":"<p>Elige en B14 la afirmación sobre la media poblacional. En B15, describe qué mide el SE, compara el intervalo para la media con la meta e indica una limitación, como las 25 confirmaciones faltantes.</p>","It estimates a population mean, not where 95% of single durations fall":"Estima una media poblacional, no dónde cae el 95% de las duraciones individuales","It proves that hiring more staff will reduce duration":"Prueba que contratar más personal reducirá la duración","The data are an observational snapshot. Staffing never changed, so no staffing effect can be shown.":"Los datos son una instantánea observacional. El personal nunca cambió, así que no se puede mostrar ningún efecto del personal.","It contains 95% of recorded individual durations":"Contiene el 95% de las duraciones individuales registradas","In this file, no single duration falls between 39.62 and 44.38. The interval is about the mean.":"En este archivo, ninguna duración individual cae entre 39.62 y 44.38. El intervalo se refiere a la media.","It is a range for the 2,400-row count, not for duration":"Es un rango para el conteo de 2,400 filas, no para la duración","The interval is in minutes. It estimates mean duration, not a count of rows.":"El intervalo está en minutos. Estima la duración media, no un conteo de filas.","Checkpoint C: the share":"Punto de control C: la proporción","In <code>IN-CLASS_Lab Part C</code>, B7 to B9 rebuild the observed share from the completed outcomes.":"En <code>IN-CLASS_Lab Part C</code>, B7 a B9 reconstruyen la proporción observada a partir de los resultados completados.","<p>100 completed outcomes, 24 delays, a share of 24.0%. SPSS H3 shows the same valid 0 and 1 counts: 76 and 24.</p>":"<p>100 resultados completados, 24 retrasos, una proporción de 24.0%. SPSS H3 muestra los mismos conteos válidos de 0 y 1: 76 y 24.</p>","B7   eligible recorded outcomes = {{n}}":"B7   resultados registrados elegibles = {{n}}","B8   recorded delay outcomes = {{x}}":"B8   resultados de retraso registrados = {{x}}","B9   observed delay share = {{p}}":"B9   proporción de retrasos observada = {{p}}","B7 counts responded rows with a flag of 0 or 1, as in Part A B8. Do not use the 125 invitations.":"B7 cuenta las filas responded con un indicador de 0 o 1, como en la Parte A, B8. No uses las 125 invitaciones.","B7 eligible recorded outcomes":"B7 resultados registrados elegibles","Keep the case definition: delay_flag = 1 means more than 50 minutes. Do not count missing outcomes as on-time.":"Mantén la definición del caso: delay_flag = 1 significa más de 50 minutos. No cuentes los resultados faltantes como a tiempo.","B8 recorded delay outcomes":"B8 resultados de retraso registrados","B9 = B8 / B7. If you see 2400%, you multiplied by 100 before the % format.":"B9 = B8 / B7. Si ves 2400%, multiplicaste por 100 antes de aplicar el formato %.","B9 observed delay share":"B9 proporción de retrasos observada","Checkpoint C: interval and sample size":"Punto de control C: intervalo y tamaño de muestra","B10 and B11 use z* = 1.96. B12 plans for a margin of ±4 percentage points, using the observed share.":"B10 y B11 usan z* = 1.96. B12 planifica para un margen de ±4 puntos porcentuales, usando la proporción observada.","<p>The interval runs from 15.63% to 32.37%, and a ±4-point margin needs 438 completed pickups. With no planning share, 0.50 would give 601. At an 80% response rate, 438 completed pickups need about 548 invitations.</p>":"<p>El intervalo va de 15.63% a 32.37%, y un margen de ±4 puntos requiere 438 recogidas completadas. Sin una proporción de planificación, 0.50 daría 601. Con una tasa de respuesta del 80%, 438 recogidas completadas requieren cerca de 548 invitaciones.</p>","B10  lower = {{lo}}":"B10  inferior = {{lo}}","B11  upper = {{hi}}":"B11  superior = {{hi}}","B12  completed pickups needed = {{n}}":"B12  recogidas completadas necesarias = {{n}}","B10 = B9 − 1.96 * SQRT(B9 * (1 − B9) / B7). Use B7 = 100 completed outcomes, not 125 invitations.":"B10 = B9 − 1.96 * SQRT(B9 * (1 − B9) / B7). Usa B7 = 100 resultados completados, no 125 invitaciones.","B11 = B9 + 1.96 * SQRT(B9 * (1 − B9) / B7).":"B11 = B9 + 1.96 * SQRT(B9 * (1 − B9) / B7).","B12 = CEILING.MATH(1.96^2 * B9 * (1 − B9) / 0.04^2): 437.94 rounds up to 438. If you see 437, you rounded down. If you see about 7,604, you treated 4 points as 4% of 24%.":"B12 = CEILING.MATH(1.96^2 * B9 * (1 − B9) / 0.04^2): 437.94 se redondea hacia arriba a 438. Si ves 437, redondeaste hacia abajo. Si ves cerca de 7,604, tomaste 4 puntos como 4% de 24%.","B12 completed pickups needed":"B12 recogidas completadas necesarias","15.63% to 32.37%; plan 438 completed":"15.63% a 32.37%; plan de 438 completadas","What goes in B13?":"¿Qué va en B13?","Your plan in B12 asks for 438 completed pickups.":"Tu plan en B12 pide 438 recogidas completadas.","Which dropdown statement belongs in B13?":"¿Qué enunciado de la lista desplegable va en B13?","<p>Pick the precision statement in B13. In B14, separate completed outcomes from invitations, and say what a bigger sample cannot repair: the pattern of who responds.</p>":"<p>Elige en B13 la afirmación sobre la precisión. En B14, distingue los resultados completados de las invitaciones, y di lo que una muestra más grande no puede reparar: el patrón de quién responde.</p>","A completed-sample precision target does not by itself correct missing-outcome bias":"Un objetivo de precisión para la muestra completada no corrige por sí solo el sesgo por resultados faltantes","The planned sample size is automatically the number of invitations needed":"El tamaño de muestra planificado es automáticamente el número de invitaciones necesarias","438 counts completed outcomes. At 80% response you would invite about 548, and response could still be uneven.":"438 cuenta resultados completados. Con 80% de respuesta invitarías a cerca de 548, y la respuesta aún podría ser desigual.","A percentage-point margin is a percent change relative to the respondent share":"Un margen en puntos porcentuales es un cambio porcentual relativo a la proporción de los respondientes","A margin of ±4 points means 24% ± 4 points, not 4% of 24%.":"Un margen de ±4 puntos significa 24% ± 4 puntos, no 4% de 24%.","The observed event share proves permanent staffing changes pickup outcomes":"La proporción de eventos observada prueba que el personal permanente cambia los resultados de las recogidas","Staffing was not changed in this audit. A share alone cannot show a staffing effect.":"En esta auditoría no se cambió el personal. Una proporción por sí sola no puede mostrar un efecto del personal.","Take-home: Option A or Option B?":"Tarea para casa: ¿Opción A u Opción B?","Option A is permanent evening staff now. Option B is a bounded audit pilot before any permanent spending.":"La Opción A es sumar ahora personal permanente en el turno de la tarde. La Opción B es un piloto de auditoría acotado antes de cualquier gasto permanente.","Which choice does your evidence support best? Then write your own version in B15.":"¿Qué opción respalda mejor tu evidencia? Luego escribe tu propia versión en B15.","<p>Option B fits the evidence. The invitation bounds (19.2% to 39.2%) and the 95% interval (15.63% to 32.37%) both cross 20%, and the snapshot cannot show a staffing effect. Write B15 in your own words: cite both ranges, the 438 target, one limitation, and what would change your mind.</p>":"<p>La Opción B se ajusta a la evidencia. Los límites sobre las invitaciones (19.2% a 39.2%) y el intervalo del 95% (15.63% a 32.37%) cruzan ambos el 20%, y la instantánea no puede mostrar un efecto del personal. Escribe B15 con tus propias palabras: cita ambos rangos, el objetivo de 438, una limitación y lo que te haría cambiar de opinión.</p>","Option B: both the bounds and the interval cross the 20% target":"Opción B: tanto los límites como el intervalo cruzan la meta del 20%","Option A: the respondent rate of 24.0% is above 20%":"Opción A: la tasa de los respondientes, 24.0%, está por encima del 20%","One estimate is not enough. 19.2% to 39.2% and 15.63% to 32.37% both reach below 20%.":"Una sola estimación no basta. 19.2% a 39.2% y 15.63% a 32.37% bajan ambos por debajo del 20%.","Option A: collecting 438 completed pickups would take too long":"Opción A: reunir 438 recogidas completadas tomaría demasiado tiempo","Time pressure does not change the evidence. Weigh a permanent cost against a short, bounded pilot.":"La presión del tiempo no cambia la evidencia. Compara un costo permanente con un piloto corto y acotado.","Neither: the 15.63% lower limit proves the target is met":"Ninguna: el límite inferior de 15.63% prueba que se cumple la meta","The interval also reaches 32.37%. It shows neither a breach nor compliance.":"El intervalo también llega a 32.37%. No muestra ni un incumplimiento ni el cumplimiento.","Option B: a bounded audit pilot":"Opción B: un piloto de auditoría acotado","Take-home: write B15":"Tarea para casa: escribe B15","Your checkpoints are saved in this browser. At home, spend 15 minutes on <code>IN-CLASS_Lab Part C</code>, cell B15.":"Tus puntos de control se guardan en este navegador. En casa, dedica 15 minutos a <code>IN-CLASS_Lab Part C</code>, celda B15.","Recommend Option A or Option B in your own words.":"Recomienda la Opción A o la Opción B con tus propias palabras.","Cite the invitation bounds (Part A, B11 and B12), both 95% intervals (Part B and Part C) and the completed-sample target (Part C, B12).":"Cita los límites sobre las invitaciones (Parte A, B11 y B12), ambos intervalos del 95% (Parte B y Parte C) y el objetivo de muestra completada (Parte C, B12).","Name one limitation and one result that would change your choice. For example: follow-up shows that most of the 25 missing pickups were slow.":"Nombra una limitación y un resultado que cambiaría tu elección. Por ejemplo: el seguimiento muestra que la mayoría de las 25 recogidas faltantes fueron lentas.","Open this page from the class site to see the dataset.":"Abre esta página desde el sitio de la clase para ver el conjunto de datos.","Lab checkpoints complete":"Puntos de control del laboratorio completados","Your checkpoint answers are saved. Finish the take-home recommendation in your workbook.":"Tus respuestas de los puntos de control están guardadas. Termina la recomendación de la tarea para casa en tu libro de trabajo."}};

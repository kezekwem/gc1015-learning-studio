r eso, \"no significativo\" con n = 16 nunca significó \"sin diferencia\".</p>","Count the right people":"Cuenta a las personas correctas","Imagine B confuses some users, and they leave before they reach the payment page.":"Imagina que B confunde a algunos usuarios y que estos se van antes de llegar a la página de pago.","To measure B's purchase rate fairly, what goes in the denominator?":"Para medir la tasa de compra de B de forma justa, ¿qué va en el denominador?","<p>The randomized unit is the user. Random assignment makes the two groups of 400 comparable.</p>\n          <p>Filtering after assignment, such as keeping only users who reached checkout, can break that balance and bias the result in B's favour.</p>":"<p>La unidad aleatorizada es el usuario. La asignación aleatoria hace que los dos grupos de 400 sean comparables.</p>\n          <p>Filtrar después de la asignación, por ejemplo quedarse solo con los usuarios que llegaron a la pantalla de pago, puede romper ese equilibrio y sesgar el resultado a favor de B.</p>","All 400 users randomly assigned to B":"Los 400 usuarios asignados al azar a B","Only the B users who reached the payment page":"Solo los usuarios de B que llegaron a la página de pago","The users B drove away disappear from that count, which flatters B.":"Los usuarios que B ahuyentó desaparecen de ese conteo, y eso favorece a B.","The number of orders B received":"El número de pedidos que recibió B","Orders count events, not people. One user can place several orders.":"Los pedidos cuentan eventos, no personas. Un usuario puede hacer varios pedidos.","From counts to rates":"De conteos a tasas","A: 160 of 400 assigned users bought. B: 200 of 400 bought.":"A: compraron 160 de 400 usuarios asignados. B: compraron 200 de 400.","Write each rate as a decimal, then the gap in percentage points.":"Escribe cada tasa como decimal y luego la diferencia en puntos porcentuales.","<p>40% of A users and 50% of B users bought. The absolute effect is 0.10, or 10 percentage points. This is an observation about these 800 users; the test comes next.</p>":"<p>Compró el 40% de los usuarios de A y el 50% de los de B. El efecto absoluto es 0.10, o 10 puntos porcentuales. Esto es una observación sobre estos 800 usuarios; la prueba viene después.</p>","p̂<sub>A</sub> = 160 / 400 = {{pa}}":"p̂<sub>A</sub> = 160 / 400 = {{pa}}","p̂<sub>B</sub> = 200 / 400 = {{pb}}":"p̂<sub>B</sub> = 200 / 400 = {{pb}}","gap = p̂<sub>B</sub> − p̂<sub>A</sub> = {{gap}} percentage points":"diferencia = p̂<sub>B</sub> − p̂<sub>A</sub> = {{gap}} puntos porcentuales","Rate A":"Tasa A","Rate B":"Tasa B","Write the gap in points: 0.50 − 0.40 = 0.10, which is 10 percentage points.":"Escribe la diferencia en puntos: 0.50 − 0.40 = 0.10, es decir, 10 puntos porcentuales.","Gap in points":"Diferencia en puntos","40% → 50%: +10 pts":"40% → 50%: +10 pts","Points or percent?":"¿Puntos o por ciento?","A teammate drafts three sentences for the launch memo.":"Un compañero de equipo redacta tres oraciones para el memorando de lanzamiento.","Which sentence is wrong?":"¿Qué oración es incorrecta?","<p>Percentage points subtract two percentages. Percent change divides by the starting rate. Both true statements here describe the same gap; mixing their units, as in \"25 points\", is the error. CedarCart's 8-point target is in points.</p>":"<p>Los puntos porcentuales restan dos porcentajes. El cambio porcentual divide entre la tasa inicial. Las dos afirmaciones verdaderas describen la misma diferencia; mezclar sus unidades, como en \"25 puntos\", es el error. La meta de 8 puntos de CedarCart está en puntos.</p>","B's purchase rate is 25 percentage points higher than A's.":"La tasa de compra de B es 25 puntos porcentuales más alta que la de A.","Right. 50% − 40% is 10 points. The 25% figure is the relative change.":"Correcto. 50% − 40% son 10 puntos. La cifra de 25% es el cambio relativo.","B's purchase rate is 10 percentage points higher than A's.":"La tasa de compra de B es 10 puntos porcentuales más alta que la de A.","That one is correct: 50% − 40% = 10 points.":"Esa es correcta: 50% − 40% = 10 puntos.","B's purchase rate is 25% higher than A's, in relative terms.":"La tasa de compra de B es 25% más alta que la de A, en términos relativos.","That one is correct: 10 ÷ 40 = 0.25, a 25% relative rise.":"Esa es correcta: 10 ÷ 40 = 0.25, un aumento relativo del 25%.","How rare is a 10-point gap?":"¿Qué tan rara es una diferencia de 10 puntos?","Pretend B is no different from A. Random assignment alone would still create small gaps. The curve shows how big those chance gaps usually are with 400 users per arm.":"Imagina que B no es diferente de A. La asignación aleatoria por sí sola seguiría creando pequeñas diferencias. La curva muestra qué tan grandes suelen ser esas diferencias por azar con 400 usuarios por grupo.","Drag the marker to the real gap, 10 points. About how often would chance alone produce a gap at least that large?":"Arrastra el marcador hasta la diferencia real, 10 puntos. ¿Con qué frecuencia, aproximadamente, el azar por sí solo produciría una diferencia al menos así de grande?","<p>With 400 users per arm, chance gaps have a standard error of about 3.5 points. A 10-point gap is about 2.84 standard errors from zero, and only about 0.45% of no-difference worlds go that far in either direction. That share is the p-value.</p>":"<p>Con 400 usuarios por grupo, las diferencias por azar tienen un error estándar de unos 3.5 puntos. Una diferencia de 10 puntos está a unos 2.84 errores estándar de cero, y solo alrededor del 0.45% de los mundos sin diferencia llegan tan lejos en cualquier dirección. Esa proporción es el valor p.</p>","About 45% of the time":"Alrededor del 45% de las veces","That matches a gap of only 2 or 3 points. Drag the marker to 10.":"Eso corresponde a una diferencia de solo 2 o 3 puntos. Arrastra el marcador hasta 10.","About 5% of the time":"Alrededor del 5% de las veces","That matches a gap near 7 points. Keep dragging to 10.":"Eso corresponde a una diferencia de cerca de 7 puntos. Sigue arrastrando hasta 10.","Less than 1% of the time":"Menos del 1% de las veces","Put a number on it":"Ponle un número","If H₀ is true, both screens share one purchase rate, so you pool all the buyers to estimate it.":"Si H₀ es verdadera, ambas pantallas comparten una misma tasa de compra, así que combinas a todos los compradores para estimarla.","Fill in the two-proportion z-test.":"Completa la prueba z para dos proporciones.","<p>z ≈ 2.843, and the two-sided p = 2 × (1 − Φ(2.843)) ≈ 0.0045. In Excel: <code>=2*(1-NORM.S.DIST(ABS(I7),TRUE))</code>.</p>\n          <p>Because 0.0045 &lt; 0.05, reject H₀: these data are not consistent with zero difference.</p>":"<p>z ≈ 2.843, y el valor p bilateral = 2 × (1 − Φ(2.843)) ≈ 0.0045. En Excel: <code>=2*(1-NORM.S.DIST(ABS(I7),TRUE))</code>.</p>\n          <p>Como 0.0045 &lt; 0.05, rechaza H₀: estos datos no son consistentes con una diferencia de cero.</p>","pooled p̂<sub>0</sub> = (160 + 200) / 800 = {{p0}}":"p̂<sub>0</sub> combinada = (160 + 200) / 800 = {{p0}}","SE<sub>0</sub> = √( p̂<sub>0</sub>(1 − p̂<sub>0</sub>)(1/400 + 1/400) ) ≈ 0.0352":"SE<sub>0</sub> = √( p̂<sub>0</sub>(1 − p̂<sub>0</sub>)(1/400 + 1/400) ) ≈ 0.0352","z = 0.10 / 0.0352 = {{z}}":"z = 0.10 / 0.0352 = {{z}}","360 buyers ÷ 800 users = 0.45.":"360 compradores ÷ 800 usuarios = 0.45.","Pooled rate":"Tasa combinada","Divide the gap, 0.10, by SE₀, 0.0352.":"Divide la diferencia, 0.10, entre SE₀, 0.0352.","z statistic":"Estadístico z","z ≈ 2.84, p ≈ 0.0045: reject H₀":"z ≈ 2.84, p ≈ 0.0045: se rechaza H₀","Read the z-table":"Lee la tabla z","The body of a z-table holds Φ(z), the area to the left of z. Rows give z to one decimal. Columns add the second decimal.":"El cuerpo de una tabla z contiene Φ(z), el área a la izquierda de z. Las filas dan z con un decimal. Las columnas agregan el segundo decimal.","Your z was 2.84. Tap the cell that holds Φ(2.84).":"Tu z fue 2.84. Toca la celda que contiene Φ(2.84).","<p>Row 2.8 plus column 0.04 gives z = 2.84, and the cell holds Φ(2.84) = 0.9977: 99.77% of the standard normal lies to its left.</p>\n          <p>The upper tail is 1 − 0.9977 = 0.0023. A two-sided test counts both tails, which you do next.</p>":"<p>La fila 2.8 más la columna 0.04 da z = 2.84, y la celda contiene Φ(2.84) = 0.9977: el 99.77% de la normal estándar queda a su izquierda.</p>\n          <p>La cola superior es 1 − 0.9977 = 0.0023. Una prueba bilateral cuenta las dos colas; eso lo haces a continuación.</p>","From the table to p":"De la tabla a p","Two-sided means both tails count: a gap at least this big in either direction.":"Bilateral significa que cuentan las dos colas: una diferencia al menos así de grande en cualquier dirección.","Turn the table value into a two-sided p-value.":"Convierte el valor de la tabla en un valor p bilateral.","<p>The table gives p ≈ 0.0046. Software gives 0.0045, because the table rounds Φ to four decimals. Both are far below 0.05, so the decision is the same: reject H₀.</p>":"<p>La tabla da p ≈ 0.0046. El software da 0.0045, porque la tabla redondea Φ a cuatro decimales. Ambos están muy por debajo de 0.05, así que la decisión es la misma: rechazar H₀.</p>","upper tail = 1 − 0.9977 = {{tail}}":"cola superior = 1 − 0.9977 = {{tail}}","p = 2 × upper tail = {{p}}":"p = 2 × cola superior = {{p}}","Upper tail":"Cola superior","Double the upper tail: 2 × 0.0023.":"Duplica la cola superior: 2 × 0.0023.","Two-sided p-value":"Valor p bilateral","Where does 1.96 come from?":"¿De dónde sale 1.96?","A 95% interval leaves 2.5% in each tail, so it needs the z with 97.5% of the area to its left.":"Un intervalo del 95% deja 2.5% en cada cola, así que necesita el z que tiene el 97.5% del área a su izquierda.","Hunt inside the table: tap the cell that holds 0.9750. Its row and column give the z.":"Busca dentro de la tabla: toca la celda que contiene 0.9750. Su fila y su columna te dan el z.","<p>0.9750 sits in row 1.9, column 0.06, so z = 1.96. That is the multiplier in every 95% interval in this lesson, for example 0.10 ± 1.96 × 0.035.</p>\n          <p>The t-table agrees: its ∞ row, column 0.05, also reads 1.960.</p>":"<p>0.9750 está en la fila 1.9, columna 0.06, así que z = 1.96. Ese es el multiplicador de todos los intervalos del 95% de esta lección, por ejemplo 0.10 ± 1.96 × 0.035.</p>\n          <p>La tabla t coincide: en su fila ∞, columna 0.05, también aparece 1.960.</p>","Two standard errors, two jobs":"Dos errores estándar, dos funciones","Your z used a pooled SE. Now you need a 95% interval for the true uplift.":"Tu z usó un SE combinado. Ahora necesitas un intervalo del 95% para el aumento real.","Drag each standard error to the job it belongs to.":"Arrastra cada error estándar a la función que le corresponde.","<p>Test with the null-based SE; estimate with the unpooled SE. The interval is 0.10 ± 1.96 × 0.035 = 0.0314 to 0.1686, or +3.14 to +16.86 percentage points.</p>":"<p>Para la prueba, usa el SE basado en la hipótesis nula; para estimar, usa el SE no combinado. El intervalo es 0.10 ± 1.96 × 0.035 = 0.0314 a 0.1686, o de +3.14 a +16.86 puntos porcentuales.</p>","Unpooled: √(0.50 × 0.50/400 + 0.40 × 0.60/400) = 0.0350":"No combinado: √(0.50 × 0.50/400 + 0.40 × 0.60/400) = 0.0350","Pooled: √(0.45 × 0.55 × (1/400 + 1/400)) ≈ 0.0352":"Combinado: √(0.45 × 0.55 × (1/400 + 1/400)) ≈ 0.0352","Test statistic z<br><small>assumes H₀ is true</small>":"Estadístico de prueba z<br><small>supone que H₀ es verdadera</small>","95% interval for the uplift<br><small>no assumption of equal rates</small>":"Intervalo del 95% para el aumento<br><small>no supone tasas iguales</small>","The pooled SE assumes the two rates are equal. An interval estimates how different they are, so it uses each arm’s own rate.":"El SE combinado supone que las dos tasas son iguales. Un intervalo estima qué tan diferentes son, así que usa la tasa propia de cada grupo.","+3.14 to +16.86 pts":"+3.14 a +16.86 pts","Does it clear the bar?":"¿Supera la meta?","The point estimate is +10 points and the target is +8. The violet bar is the 95% interval. Drag the target line to explore.":"La estimación puntual es +10 puntos y la meta es +8. La barra violeta es el intervalo del 95%. Arrastra la línea de la meta para explorar.","Does this experiment establish that B's true uplift is at least 8 points?":"¿Demuestra este experimento que el aumento real de B es de al menos 8 puntos?","<p>The test rules out zero. It does not rule out uplifts below 8. Drag the target and you will see that only targets at or below 3.14 points sit fully under the interval. Statistically significant does not mean big enough.</p>":"<p>La prueba descarta el cero. No descarta aumentos menores que 8. Arrastra la meta y verás que solo las metas de 3.14 puntos o menos quedan completamente por debajo del intervalo. Estadísticamente significativo no significa suficientemente grande.</p>","No. Plausible uplifts run as low as 3.14 points.":"No. Los aumentos plausibles pueden ser tan bajos como 3.14 puntos.","Yes. The point estimate of 10 is above 8.":"Sí. La estimación puntual de 10 está por encima de 8.","The point estimate is one plausible value. The interval says the truth could be as low as 3.14.":"La estimación puntual es un valor plausible. El intervalo dice que el valor real podría ser tan bajo como 3.14.","Yes. p ≈ 0.0045 is far below 0.05.":"Sí. p ≈ 0.0045 está muy por debajo de 0.05.","The p-value tests against zero, not against 8. It says B differs from A, not by how much.":"El valor p compara contra cero, no contra 8. Dice que B difiere de A, pero no por cuánto.","Check the harm":"Revisa el daño","Complaints within seven days: 8 of 400 A users and 32 of 400 B users.":"Quejas dentro de siete días: 8 de 400 usuarios de A y 32 de 400 usuarios de B.","Fill in the complaint rates and the increase.":"Completa las tasas de quejas y el aumento.","<p>B raises complaints by 6 points, six times the 1-point limit. A 95% interval for that increase runs from about 3.0 to 9.0 points, so even its low end breaks the rule.</p>":"<p>B aumenta las quejas en 6 puntos, seis veces el límite de 1 punto. Un intervalo del 95% para ese aumento va de unos 3.0 a 9.0 puntos, así que incluso su extremo inferior incumple la regla.</p>","complaint rate A = 8 / 400 = {{ca}} %":"tasa de quejas A = 8 / 400 = {{ca}} %","complaint rate B = 32 / 400 = {{cb}} %":"tasa de quejas B = 32 / 400 = {{cb}} %","increase = {{inc}} percentage points (limit: 1)":"aumento = {{inc}} puntos porcentuales (límite: 1)","8 ÷ 400 = 0.02, which is 2%.":"8 ÷ 400 = 0.02, es decir, 2%.","Complaint rate A in percent":"Tasa de quejas A en porcentaje","32 ÷ 400 = 0.08, which is 8%.":"32 ÷ 400 = 0.08, es decir, 8%.","Complaint rate B in percent":"Tasa de quejas B en porcentaje","8% − 2% = 6 percentage points.":"8% − 2% = 6 puntos porcentuales.","Increase in points":"Aumento en puntos","2% → 8%: +6 pts (limit +1): fails":"2% → 8%: +6 pts (límite +1): no cumple","Where is the line?":"¿Dónde está el límite?","Imagine a rerun where A again has 8 complaints in 400 users.":"Imagina que repites la prueba y A vuelve a tener 8 quejas en 400 usuarios.","Drag B's complaints to the highest count that still meets the 1-point limit.":"Arrastra las quejas de B hasta el número más alto que todavía cumple el límite de 1 punto.","<p>12 of 400 is 3%, exactly 1 point above A’s 2%, so an inclusive \"no more than 1 point\" rule passes. A real decision would still weigh the uncertainty around that point estimate.</p>":"<p>12 de 400 es 3%, exactamente 1 punto por encima del 2% de A, así que una regla inclusiva de \"no más de 1 punto\" se cumple. Una decisión real todavía tendría que considerar la incertidumbre alrededor de esa estimación puntual.</p>","Follow the money":"Sigue el dinero","Use the rough assumptions: $12 margin per extra purchase, $0.60 per user shown B, and $25 support cost per extra complaint. Per 400 users, B brought 40 extra purchases and 24 extra complaints.":"Usa los supuestos aproximados: $12 de margen por compra adicional, $0.60 por usuario que ve B y $25 de costo de soporte por queja adicional. Por cada 400 usuarios, B trajo 40 compras adicionales y 24 quejas adicionales.","At $12, B loses $360 per 400 users. Drag the margin. At what margin per purchase does B break even?":"Con $12, B pierde $360 por cada 400 usuarios. Arrastra el margen. ¿Con qué margen por compra B alcanza el punto de equilibrio?","<p>Break-even margin = (240 + 600) ÷ 40 = $21. At the assumed $12, net = 480 − 240 − 600 = −$360 per 400 B users, or −$0.90 per user. These dollars are assumptions, not estimates, and complaint costs could be larger once reputation is counted.</p>":"<p>Margen de equilibrio = (240 + 600) ÷ 40 = $21. Con los $12 supuestos, neto = 480 − 240 − 600 = −$360 por cada 400 usuarios de B, o −$0.90 por usuario. Estos montos en dólares son supuestos, no estimaciones, y los costos de las quejas podrían ser mayores si se toma en cuenta la reputación.</p>","−$360 per 400 B users at $12 margin":"−$360 por cada 400 usuarios de B con margen de $12","Make the call":"Toma la decisión","You are the analyst. The product manager wants one recommendation for Friday’s meeting.":"Tienes el rol de analista. El gerente de producto quiere una sola recomendación para la reunión del viernes.","What do you recommend?":"¿Qué recomiendas?","<p>Two gates fail on their own: the guardrail (+6 against +1) and the target (the interval’s low end, 3.14, is below 8). Net impact is negative under the stated assumptions.</p>\n          <p>\"Do not roll out B as tested\" does not mean B is bad forever. Fix the likely cause, check the logging, and test again with the same gates written in advance.</p>":"<p>Dos criterios fallan por sí solos: la métrica de salvaguarda (+6 frente a +1) y la meta (el extremo inferior del intervalo, 3.14, está por debajo de 8). El impacto neto es negativo con los supuestos indicados.</p>\n          <p>\"No lanzar B tal como se probó\" no significa que B sea mala para siempre. Corrige la causa probable, revisa los registros y vuelve a probar con los mismos criterios escritos de antemano.</p>","Hold B. Study the complaints, fix the screen, and rerun a properly sized test.":"Pausar B. Estudiar las quejas, corregir la pantalla y repetir una prueba con el tamaño adecuado.","Ship B now, because the purchase lift is statistically significant.":"Lanzar B ahora, porque el aumento en compras es estadísticamente significativo.","Significance filters out noise. It cannot override a broken guardrail or a missed target.":"La significancia filtra el ruido. No puede anular una salvaguarda incumplida ni una meta no alcanzada.","Ship B, and raise the complaint limit to 6 points.":"Lanzar B y subir el límite de quejas a 6 puntos.","Changing a guardrail after seeing results is moving the goalposts.":"Cambiar una salvaguarda después de ver los resultados es cambiar las reglas del juego a mitad del partido.","Ship B to half of all users and see what happens.":"Lanzar B a la mitad de todos los usuarios y ver qué pasa.","Half a rollout still exposes thousands of users to a 6-point jump in complaints.":"Un lanzamiento a la mitad igual expone a miles de usuarios a un salto de 6 puntos en las quejas.","Hold B. Fix, then rerun a sized test.":"Pausar B. Corregir y luego repetir una prueba bien dimensionada.","Trust, then publish":"Primero la confianza, luego la publicación","Before you send the memo, SPSS shows A n = 400 and B n = 399. The assignment log says 400 users went to B.":"Antes de enviar el memorando, SPSS muestra A n = 400 y B n = 399. El registro de asignación dice que 400 usuarios fueron a B.","What do you do?":"¿Qué haces?","<p>A gap between planned and recorded group sizes is a data-quality alarm, sometimes called a sample-ratio mismatch. Trace eligibility rules, duplicate keys, missing values and time windows first. A new p-value cannot fix uncertain data.</p>":"<p>Una diferencia entre los tamaños de grupo planeados y los registrados es una alarma de calidad de datos, a veces llamada desajuste en la proporción de la muestra. Primero revisa las reglas de elegibilidad, las claves duplicadas, los valores faltantes y las ventanas de tiempo. Un nuevo valor p no puede corregir datos inciertos.</p>","Stop. Find the missing B record, document why, then rerun the KPI and guardrail checks.":"Detenerse. Encontrar el registro faltante de B, documentar la causa y luego repetir las verificaciones del KPI y de la salvaguarda.","Publish. One user out of 800 cannot change the result.":"Publicar. Un usuario de 800 no puede cambiar el resultado.","Maybe not, but a missing row can signal a logging or eligibility bug that affects other rows too.":"Quizás no, pero una fila faltante puede indicar un error de registro o de elegibilidad que también afecta otras filas.","Delete one A user at random so both groups have 399.":"Eliminar un usuario de A al azar para que ambos grupos tengan 399.","That throws away valid data and hides the problem instead of explaining it.":"Eso descarta datos válidos y oculta el problema en lugar de explicarlo.","Excel and SPSS should agree":"Excel y SPSS deberían coincidir","SPSS CROSSTABS reports a Pearson chi-square of 8.081 for group by purchase. Your Excel z was 2.843.":"SPSS CROSSTABS reporta un chi cuadrado de Pearson de 8.081 para grupo por compra. Tu z en Excel fue 2.843.","Square your z.":"Eleva tu z al cuadrado.","<p>For a 2 × 2 table without continuity correction, the Pearson chi-square equals z², so both give p ≈ 0.0045. Read the Pearson line, not the continuity-corrected line. If the numbers do not match, check the counts before trusting either tool.</p>":"<p>En una tabla de 2 × 2 sin corrección por continuidad, el chi cuadrado de Pearson es igual a z², así que ambos dan p ≈ 0.0045. Lee la línea de Pearson, no la línea con corrección por continuidad. Si los números no coinciden, revisa los conteos antes de confiar en cualquiera de las dos herramientas.</p>","z² = 2.843² = {{z2}}":"z² = 2.843² = {{z2}}","z squared":"z al cuadrado","Your test bench":"Tu banco de pruebas","Write the rules first. \"Significant\" means \"not zero\", not \"big enough\". A broken guardrail stops a rollout even when the KPI wins.":"Escribe las reglas primero. \"Significativo\" quiere decir \"distinto de cero\", no \"suficientemente grande\". Una salvaguarda incumplida detiene un lanzamiento aunque el KPI mejore.","Change the inputs to invent your own experiment. The gates update as you drag.":"Cambia los datos de entrada para inventar tu propio experimento. Los criterios se actualizan mientras arrastras.","gap, B minus A (percentage points)":"diferencia, B menos A (puntos porcentuales)","If B equals A (H₀)":"Si B es igual a A (H₀)","If B is truly 8 points better":"Si B en verdad es 8 puntos mejor","False-alarm area (α)":"Área de falsa alarma (α)","Missed-win area (β)":"Área de mejora no detectada (β)","Power area":"Área de potencia","cut-off":"umbral","pts":"pts","False alarm (α)":"Falsa alarma (α)","Missed win (β)":"Mejora no detectada (β)","Power (1 − β)":"Potencia (1 − β)","α, false-alarm risk":"α, riesgo de falsa alarma","Users per arm":"Usuarios por grupo","complaint rate":"tasa de quejas","A, standard":"A, estándar","B, shorter":"B, más corta","limit: A + 1 point = 3%":"límite: A + 1 punto = 3%","t distribution for the picked row":"Distribución t de la fila elegida","Two-tailed α":"α de dos colas","Each tail":"Cada cola","Tap a cell":"Toca una celda","one tail":"una cola","two tails":"dos colas","t-table of critical values":"Tabla t de valores críticos","Standard normal curve with the area to the left of z":"Curva normal estándar con el área a la izquierda de z","How close?":"¿Qué tan cerca?","Bullseye":"¡En el blanco!","Very warm":"Muy caliente","Warm":"Caliente","Cold":"Frío","z-table of areas to the left of z":"Tabla z de áreas a la izquierda de z","satisfaction index (points)":"índice de satisfacción (puntos)","goal 70":"meta 70","mean 72":"media 72","Illustrative scores that match the survey summary: n = 16, mean 72, s = 8.":"Puntuaciones ilustrativas que coinciden con el resumen de la encuesta: n = 16, media 72, s = 8.","respondents (n)":"encuestados (n)","p-value":"valor p","At α = 0.05":"Con α = 0.05","Significant":"Significativo","Not significant":"No significativo","Sample size":"Tamaño de muestra","Assigned to B: 400 users":"Asignados a B: 400 usuarios","Reached the payment page: fewer":"Llegaron a la página de pago: menos","Bought: 200 users":"Compraron: 200 usuarios","Gap":"Diferencia","Chance worlds at least this extreme":"Resultados por azar al menos así de extremos","under 0.1%":"menos del 0.1%","Observed gap":"Diferencia observada","uplift (percentage points)":"aumento (puntos porcentuales)","Target":"Meta","Whole interval above the target?":"¿Todo el intervalo por encima de la meta?","Yes":"Sí","No":"No","target":"meta","Target uplift":"Aumento meta","B complaints":"Quejas de B","Increase":"Aumento","Guardrail":"Salvaguarda","Meets limit":"Cumple el límite","Breaks limit":"Excede el límite","Extra margin":"Margen adicional","Screen cost":"Costo de la pantalla","Complaint cost":"Costo de quejas","Net":"Neto","Margin":"Margen","Net per 400 B users":"Neto por 400 usuarios de B","Per B user":"Por usuario de B","Margin per extra purchase":"Margen por compra adicional","The purchase gap is statistically significant":"La diferencia en compras es estadísticamente significativa","The interval clears the 8-point target":"El intervalo supera la meta de 8 puntos","low end +3.14":"extremo inferior +3.14","Complaints rise by at most 1 point":"Las quejas suben como máximo 1 punto","+6 points":"+6 puntos","Net impact is positive under the assumptions":"El impacto neto es positivo con los supuestos","Pass":"Cumple","Fail":"No cumple","Right call.":"Buena decisión.","Right call. Your gut call at the start was “{call}”. Now you can back your answer with evidence.":"Buena decisión. Tu intuición al inicio fue “{call}”. Ahora puedes respaldar tu respuesta con evidencia.","Uplift":"Aumento","95% interval":"Intervalo del 95%","Statistically significant at 0.05":"Estadísticamente significativo al 0.05","Interval clears the 8-point target":"El intervalo supera la meta de 8 puntos","Verdict":"Veredicto","Roll out":"Lanzar","Hold and revise":"Pausar y revisar","A purchase rate":"Tasa de compra A","B purchase rate":"Tasa de compra B","A complaint rate":"Tasa de quejas A","B complaint rate":"Tasa de quejas B","Lesson complete":"Lección completada","You earned {pts} points: {firsts} first-try answers across {graded} questions.":"Ganaste {pts} puntos: {firsts} respuestas acertadas al primer intento en {graded} preguntas.","Your evidence file stays in the case panel. Use Back or the part bar to revisit any screen before the midterm on October 21.":"Tu expediente de evidencia queda en el panel del caso. Usa Atrás o la barra de partes para volver a cualquier pantalla antes del examen parcial del 21 de octubre.","Set α back to 0.05, the level CedarCart wrote down.":"Vuelve a poner α en 0.05, el nivel que CedarCart fijó por escrito.","Power is still below 80%. Add users.":"La potencia sigue por debajo del 80%. Agrega usuarios.","That reaches 80%, but a smaller sample does too. Try fewer users.":"Así llegas al 80%, pero una muestra más pequeña también lo logra. Prueba con menos usuarios.","Found it: t* = 2.131. Every 95% survey interval uses it.":"¡Lo encontraste!: t* = 2.131. Todos los intervalos del 95% de la encuesta lo usan.","Close. df is n − 1, so 16 − 1 = 15. Move up one row.":"Casi. df es n − 1, así que 16 − 1 = 15. Sube una fila.","Use df = n − 1 = 16 − 1 = 15. Find row 15.":"Usa df = n − 1 = 16 − 1 = 15. Busca la fila 15.","That column is two-tailed 0.10. Two-sided α = 0.05 means 0.025 in each tail, so use the 0.05 column.":"Esa columna es de dos colas 0.10. Un α bilateral de 0.05 deja 0.025 en cada cola, así que usa la columna 0.05.","Right row. Now use the column headed 0.05, the total of both tails.":"Fila correcta. Ahora usa la columna con encabezado 0.05, el total de ambas colas.","p is still above 0.05. Add respondents.":"p sigue por encima de 0.05. Agrega participantes.","Significant, yes. But a smaller sample gets there too. Find the first n where p drops below 0.05.":"Sí, es significativo. Pero una muestra más pequeña también lo logra. Encuentra el primer n en el que p baja de 0.05.","Bullseye: Φ(2.84) = 0.9977.":"¡En el blanco!: Φ(2.84) = 0.9977.","Right row. The column adds the second decimal: 2.84 = 2.8 + 0.04.":"Fila correcta. La columna agrega el segundo decimal: 2.84 = 2.8 + 0.04.","Right column. The row is z to one decimal: 2.8.":"Columna correcta. La fila es z con un decimal: 2.8.","Split 2.84 into 2.8 (the row) and 0.04 (the column).":"Divide 2.84 en 2.8 (la fila) y 0.04 (la columna).","Bullseye: z = 1.9 + 0.06 = 1.96.":"¡En el blanco!: z = 1.9 + 0.06 = 1.96.","Warm, but that area is more than 0.9750. Move up or to the left.":"Caliente, pero esa área es mayor que 0.9750. Sube o muévete a la izquierda.","That area is less than 0.9750. Move down or to the right.":"Esa área es menor que 0.9750. Baja o muévete a la derecha.","That passes, but B could have a few more complaints and still pass. Find the highest.":"Eso pasa, pero B podría tener algunas quejas más y aun así pasar. Encuentra el máximo.","Still over the limit. Lower the count of B complaints.":"Sigue por encima del límite. Reduce las quejas de B.","Net is still negative. Raise the margin.":"El neto sigue siendo negativo. Sube el margen.","B makes money there, but break-even is lower. Find where net first reaches $0.":"B gana dinero ahí, pero el punto de equilibrio es más bajo. Encuentra dónde el neto llega por primera vez a $0."}};

<script>
/* GC1015 Session 6 interactive lesson: hypothesis tests, effects, practical significance, A/B guardrails.
   Source: S06_Expanded_Toolkit.md and SESSION_OUTLINE.md (CedarCart, fictional). All figures verified in Python. */
(function () {
  'use strict';
  const K = LessonKit;
  const St = K.Stats;
  const pts = (v, d = 1) => St.fmt(v * 100, d);

  /* ---------- Shared models ---------- */
  // Power to detect a true 8-point lift from a 40% baseline, two-sided, n users per arm.
  function powerModel(alpha, n) {
    const p1 = 0.40, d = 0.08, p2 = p1 + d, pb = (p1 + p2) / 2;
    const se0 = Math.sqrt(pb * (1 - pb) * 2 / n);
    const se1 = Math.sqrt((p1 * (1 - p1) + p2 * (1 - p2)) / n);
    const c = St.normInv(1 - alpha / 2) * se0;
    const power = St.normCdf((d - c) / se1) + St.normCdf((-d - c) / se1);
    return { se0, se1, c, power, beta: 1 - power };
  }
  const SE0 = Math.sqrt(0.45 * 0.55 * (1 / 400 + 1 / 400));
  const SCORES = [58, 60, 64, 65, 66, 68, 70, 72, 74, 74, 77, 78, 78, 81, 83, 84];
  const pSurvey = (n) => St.tTwoSided(2 / (8 / Math.sqrt(n)), n - 1);

  /* ---------- Figures ---------- */
  function powerExplorer(el, a, opts = {}) {
    const st = { a: 0.05, n: opts.n || 400 };
    const C = a.Charts;
    const f = C.frame(el, { x: [-0.12, 0.22], y: [0, 1.14], h: 250, pad: { l: 18, r: 18, t: 30 }, label: 'Gaps you would see if B equals A, and if B is 8 points better' });
    C.axisX(f, [-0.1, -0.05, 0, 0.05, 0.1, 0.15, 0.2], (v) => St.fmt(v * 100, 0), K.tr('gap, B minus A (percentage points)'));
    C.legend(el, [[K.tr('If B equals A (H₀)'), 'var(--arm-a)'], [K.tr('If B is truly 8 points better'), 'var(--arm-b)'], [K.tr('False-alarm area (α)'), 'var(--warn)', false, 0.4], [K.tr('Missed-win area (β)'), 'var(--guard)', false, 0.45], [K.tr('Power area'), 'var(--ok)', false, 0.4]]);
    const ctrls = a.h('div', { class: 'lk-controls' });
    el.append(ctrls);
    const out = a.readout(el);
    const draw = () => {
      const m = powerModel(st.a, st.n);
      const g0 = (x) => Math.exp(-0.5 * (x / m.se0) ** 2);
      const g1 = (x) => Math.exp(-0.5 * ((x - 0.08) / m.se1) ** 2);
      f.clear('data');
      f.add('data', 'path', { d: C.area(g1, f.x[0], m.c, f), class: 'f-guard' });
      f.add('data', 'path', { d: C.area(g1, m.c, f.x[1], f), class: 'f-ok' });
      f.add('data', 'path', { d: C.area(g0, m.c, f.x[1], f), class: 'f-warn' });
      f.add('data', 'path', { d: C.area(g0, f.x[0], -m.c, f), class: 'f-warn' });
      f.add('data', 'path', { d: C.curve(g0, f.x[0], f.x[1], f), class: 'c-a' });
      f.add('data', 'path', { d: C.curve(g1, f.x[0], f.x[1], f), class: 'c-b' });
      for (const x of [m.c, -m.c]) f.add('data', 'line', { x1: f.X(x), x2: f.X(x), y1: f.Y(0), y2: f.Y(1.1), class: 's-ink', 'stroke-dasharray': '5 4' });
      f.add('data', 'text', { x: f.X(m.c) + 6, y: f.Y(1.08), class: 'strong' }, `${K.tr('cut-off')} ±${pts(m.c)} ${K.tr('pts')}`);
      out([
        [K.tr('False alarm (α)'), `${(st.a * 100).toFixed(0)}%`],
        [K.tr('Missed win (β)'), `${(m.beta * 100).toFixed(1)}%`],
        [K.tr('Power (1 − β)'), `${(m.power * 100).toFixed(1)}%`, m.power >= 0.8 ? 'ok' : null],
      ]);
    };
    const sa = a.slider(ctrls, { label: K.tr('α, false-alarm risk'), min: 0.01, max: 0.1, step: 0.01, value: st.a, fmt: (v) => v.toFixed(2), onInput: (v) => { st.a = +v.toFixed(2); draw(); opts.onChange?.(st); } });
    const sn = a.slider(ctrls, { label: K.tr('Users per arm'), min: 100, max: 1500, step: 50, value: st.n, onInput: (v) => { st.n = v; draw(); opts.onChange?.(st); } });
    draw();
    return { st, set(av, nv) { sa.set(av, false); sn.set(nv, false); st.a = av; st.n = nv; draw(); } };
  }

  function complaintBars(el, a, cB) {
    const C = a.Charts;
    const f = C.frame(el, { x: [0, 2], y: [0, 0.11], h: 220, pad: { l: 50, t: 26, b: 40 }, label: 'Complaint rates for A and B with the guardrail limit' });
    C.axisY(f, [0, 0.02, 0.04, 0.06, 0.08, 0.1], (v) => `${(v * 100).toFixed(0)}%`, K.tr('complaint rate'));
    const bw = f.X(0.72) - f.X(0.28);
    f.add('grid', 'text', { x: f.X(0.5), y: f.H - f.P.b + 18, 'text-anchor': 'middle', class: 'strong' }, K.tr('A, standard'));
    f.add('grid', 'text', { x: f.X(1.5), y: f.H - f.P.b + 18, 'text-anchor': 'middle', class: 'strong' }, K.tr('B, shorter'));
    f.add('data', 'rect', { x: f.X(0.28), width: bw, y: f.Y(0.02), height: f.Y(0) - f.Y(0.02), rx: 4, class: 'f-a' });
    f.add('data', 'text', { x: f.X(0.5), y: f.Y(0.02) - 6, 'text-anchor': 'middle', class: 'strong' }, '2%');
    const barB = f.add('data', 'rect', { x: f.X(1.28), width: bw, rx: 4, class: 'f-b' });
    const labB = f.add('data', 'text', { x: f.X(1.5), 'text-anchor': 'middle', class: 'strong' });
    f.add('top', 'line', { x1: f.X(0.05), x2: f.X(1.95), y1: f.Y(0.03), y2: f.Y(0.03), class: 's-guard' });
    f.add('top', 'text', { x: f.X(0.05), y: f.Y(0.03) - 6, class: 't-guard' }, K.tr('limit: A + 1 point = 3%'));
    const set = (count) => {
      const r = count / 400;
      barB.setAttribute('y', f.Y(r)); barB.setAttribute('height', Math.max(0, f.Y(0) - f.Y(r)));
      labB.setAttribute('y', f.Y(r) - 6); labB.textContent = `${(r * 100).toFixed(2).replace(/\.?0+$/, '')}%`;
    };
    set(cB);
    return { set };
  }

  // t-table: rows are df, columns are two-tailed alpha. A t curve above it shades the tails for the picked cell.
  const T_ALPHAS = [0.2, 0.1, 0.05, 0.02, 0.01, 0.001];
  const T_DFS = [...Array(30)].map((_, i) => i + 1).concat([40, 60, 120, Infinity]);
  function tTable(el, a, opts = {}) {
    const C = a.Charts;
    const f = C.frame(el, { x: [-4.5, 4.5], y: [0, 0.44], h: 180, pad: { l: 18, r: 18, t: 30, b: 34 }, label: K.tr('t distribution for the picked row') });
    C.axisX(f, [-4, -3, -2, -1, 0, 1, 2, 3, 4], (v) => St.fmt(v, 0), 't');
    const out = a.readout(el);
    const draw = (df, alpha) => {
      const pdf = (x) => (Number.isFinite(df) ? St.tPdf(x, df) : St.normPdf(x));
      f.clear('data');
      if (opts.obs != null) {
        const o = opts.obs;
        f.add('data', 'path', { d: C.area(pdf, o, 4.5, f), class: 'f-warn' });
        f.add('data', 'path', { d: C.area(pdf, -4.5, -o, f), class: 'f-warn' });
        for (const x of [o, -o]) f.add('data', 'line', { x1: f.X(x), x2: f.X(x), y1: f.Y(0), y2: f.Y(0.4), class: 's-violet' });
        f.add('data', 'text', { x: f.X(o) + 5, y: f.Y(0.4), class: 't-violet' }, `t = ${o.toFixed(2)}`);
      }
      if (alpha != null) {
        const c = St.tCrit(alpha, df);
        if (opts.obs == null) {
          f.add('data', 'path', { d: C.area(pdf, c, 4.5, f), class: 'f-guard' });
          f.add('data', 'path', { d: C.area(pdf, -4.5, -c, f), class: 'f-guard' });
        }
        for (const x of [c, -c]) if (Math.abs(x) < 4.5) f.add('data', 'line', { x1: f.X(x), x2: f.X(x), y1: f.Y(0), y2: f.Y(0.3), class: 's-ink', 'stroke-dasharray': '5 4' });
        if (c < 4.5) f.add('data', 'text', { x: f.X(c), y: f.Y(0.3) - 6, 'text-anchor': 'middle', class: 'strong' }, `±${c.toFixed(3)}`);
        out([['df', Number.isFinite(df) ? String(df) : '∞'], [K.tr('Two-tailed α'), String(alpha)], [K.tr('Each tail'), String(+(alpha / 2).toFixed(4))], ['t*', c.toFixed(3), 'ok']]);
      } else {
        out([['df', Number.isFinite(df) ? String(df) : '∞'], [K.tr('Tap a cell'), '…']]);
      }
      f.add('data', 'path', { d: C.curve(pdf, -4.5, 4.5, f), class: 'c-b' });
    };
    const lk = a.lookup(el, {
      rows: T_DFS.map((d) => ({ key: d, label: Number.isFinite(d) ? String(d) : '∞' })),
      cols: T_ALPHAS.map((x) => ({ key: x, label: String(x), sub: `${K.tr('one tail')} ${+(x / 2).toFixed(4)}` })),
      corner: `df ↓   ${K.tr('two tails')} →`,
      value: (r, c) => St.tCrit(c.key, r.key).toFixed(3),
      label: K.tr('t-table of critical values'),
      onPick: (r, c) => { draw(r.key, c.key); opts.onPick?.(r, c); },
    });
    draw(opts.df ?? 15, null);
    if (opts.focusRow != null) requestAnimationFrame(() => lk.highlightRow(T_DFS.indexOf(opts.focusRow)));
    return lk;
  }

  // z-table: rows give z to one decimal, columns add the second decimal, the body holds Phi(z).
  const Z_ROWS = [...Array(35)].map((_, i) => +(i / 10).toFixed(1));
  const Z_COLS = [...Array(10)].map((_, j) => +(j / 100).toFixed(2));
  function zTable(el, a, opts = {}) {
    const C = a.Charts;
    const f = C.frame(el, { x: [-3.6, 3.6], y: [0, 0.46], h: 180, pad: { l: 18, r: 18, t: 30, b: 34 }, label: K.tr('Standard normal curve with the area to the left of z') });
    C.axisX(f, [-3, -2, -1, 0, 1, 2, 3], (v) => St.fmt(v, 0), 'z');
    const out = a.readout(el);
    const draw = (z) => {
      f.clear('data');
      if (z != null) {
        const phi = St.normCdf(z);
        f.add('data', 'path', { d: C.area(St.normPdf, -3.6, z, f), class: 'f-ok' });
        f.add('data', 'path', { d: C.area(St.normPdf, z, 3.6, f), class: 'f-warn' });
        f.add('data', 'line', { x1: f.X(z), x2: f.X(z), y1: f.Y(0), y2: f.Y(0.42), class: 's-ink' });
        f.add('data', 'text', { x: f.X(z), y: f.Y(0.42) - 6, 'text-anchor': 'middle', class: 'strong' }, `z = ${z.toFixed(2)}`);
        f.add('data', 'text', { x: f.X(-1.2), y: f.Y(0.12), 'text-anchor': 'middle', class: 't-ok' }, `Φ = ${phi.toFixed(4)}`);
        const items = [['z', z.toFixed(2)], ['Φ(z)', phi.toFixed(4), 'ok'], ['1 − Φ(z)', (1 - phi).toFixed(4)]];
        if (opts.target != null) {
          const gap = Math.abs(+phi.toFixed(4) - opts.target);
          items.push([K.tr('How close?'), gap < 1e-9 ? K.tr('Bullseye') : gap < 0.002 ? K.tr('Very warm') : gap < 0.01 ? K.tr('Warm') : K.tr('Cold'), gap < 1e-9 ? 'ok' : gap < 0.002 ? null : 'warn']);
        }
        out(items);
      } else out([[K.tr('Tap a cell'), '…']]);
      f.add('data', 'path', { d: C.curve(St.normPdf, -3.6, 3.6, f), class: 'c-b' });
    };
    const lk = a.lookup(el, {
      rows: Z_ROWS.map((z) => ({ key: z, label: z.toFixed(1) })),
      cols: Z_COLS.map((c) => ({ key: c, label: c.toFixed(2) })),
      corner: `z ↓   +`,
      value: (r, c) => St.normCdf(r.key + c.key).toFixed(4),
      label: K.tr('z-table of areas to the left of z'),
      onPick: (r, c) => { draw(r.key + c.key); opts.onPick?.(r, c); },
    });
    draw(null);
    return lk;
  }
  const near = (x, y) => Math.abs(x - y) < 1e-9;

            const top = Math.max(y0, y1), bot = Math.min(y0, y1);
            f.add('data', 'rect', { x: f.X(i + 0.2), width: f.X(0.6) - f.X(0), y: f.Y(top), height: Math.max(1, f.Y(bot) - f.Y(top)), rx: 4, class: cls });
            f.add('data', 'text', { x: f.X(i + 0.5), y: f.Y(top) - 6, 'text-anchor': 'middle', class: 'strong' }, label);
          };
          const draw = () => {
            f.clear('data');
            const g = 40 * m, s1 = g - 240, net = s1 - 600;
            bar(0, 0, g, 'f-ok-solid', '+' + money(g));
            bar(1, g, s1, 'f-warn-solid', money(-240));
            bar(2, s1, net, 'f-warn-solid', money(-600));
            bar(3, 0, net, net >= 0 ? 'f-ok-solid' : 'f-warn-solid', money(net));
            for (const [i, y] of [[0, g], [1, s1], [2, net]]) f.add('data', 'line', { x1: f.X(i + 0.8), x2: f.X(i + 1.2), y1: f.Y(y), y2: f.Y(y), class: 's-muted' });
            out([[K.tr('Margin'), `$${m}`], [K.tr('Net per 400 B users'), money(net), net >= 0 ? 'ok' : 'warn'], [K.tr('Per B user'), `${net < 0 ? '−' : ''}$${Math.abs(net / 400).toFixed(2)}`]]);
          };
          const sl = a.slider(q, { label: K.tr('Margin per extra purchase'), min: 5, max: 40, step: 1, value: 12, fmt: (v) => `$${v}`, onInput: (v) => { m = v; draw(); a.changed(); } });
          out = a.readout(q);
          draw();
          return {
            ready: () => m !== 12,
            check() {
              if (m === 21) return { ok: true };
              if (m < 21) return { ok: false, hint: 'Net is still negative. Raise the margin.' };
              return { ok: false, hint: 'B makes money there, but break-even is lower. Find where net first reaches $0.' };
            },
            reveal() { sl.set(21); },
            reset() {},
          };
        },
        key: '$21 per purchase: (240 + 600) / 40.',
        why: '<p>Break-even margin = (240 + 600) ÷ 40 = $21. At the assumed $12, net = 480 − 240 − 600 = −$360 per 400 B users, or −$0.90 per user. These dollars are assumptions, not estimates, and complaint costs could be larger once reputation is counted.</p>',
        ledger: { id: 'net', value: '−$360 per 400 B users at $12 margin' },
      },
      {
        id: 'decision', part: 2, type: 'choice',
        title: 'Make the call',
        figure(el, a) {
          const rows = [
            [K.tr('The purchase gap is statistically significant'), 'p ≈ 0.0045', true],
            [K.tr('The interval clears the 8-point target'), K.tr('low end +3.14'), false],
            [K.tr('Complaints rise by at most 1 point'), K.tr('+6 points'), false],
            [K.tr('Net impact is positive under the assumptions'), '−$360', false],
          ];
          el.append(a.h('ul', { class: 'lk-checklist', 'aria-label': 'Decision gates' },
            rows.map(([t, ev, ok]) => a.h('li', null, a.h('span', null, t, a.h('small', null, ev)), a.chip(ok ? K.tr('Pass') : K.tr('Fail'), ok ? 'ok' : 'warn')))));
        },
        scene: 'You are the analyst. The product manager wants one recommendation for Friday’s meeting.',
        prompt: 'What do you recommend?',
        options: [
          { t: 'Hold B. Study the complaints, fix the screen, and rerun a properly sized test.', ok: true },
          { t: 'Ship B now, because the purchase lift is statistically significant.', hint: 'Significance filters out noise. It cannot override a broken guardrail or a missed target.' },
          { t: 'Ship B, and raise the complaint limit to 6 points.', hint: 'Changing a guardrail after seeing results is moving the goalposts.' },
          { t: 'Ship B to half of all users and see what happens.', hint: 'Half a rollout still exposes thousands of users to a 6-point jump in complaints.' },
        ],
        praise: (S) => {
          const calls = ['Yes, ship B', 'No, keep A', 'I need more information'];
          const g = S.polls.hook;
          return g == null ? K.tr('Right call.') : K.tr('Right call. Your gut call at the start was “{call}”. Now you can back your answer with evidence.').replace('{call}', K.tr(calls[g]));
        },
        why: `<p>Two gates fail on their own: the guardrail (+6 against +1) and the target (the interval’s low end, 3.14, is below 8). Net impact is negative under the stated assumptions.</p>
          <p>"Do not roll out B as tested" does not mean B is bad forever. Fix the likely cause, check the logging, and test again with the same gates written in advance.</p>`,
        ledger: { id: 'decision', value: 'Hold B. Fix, then rerun a sized test.' },
      },
      {
        id: 'srm', refs: ['4.1', '5.1'], part: 2, tier: 'Stretch', type: 'choice',
        title: 'Trust, then publish',
        scene: 'Before you send the memo, SPSS shows A n = 400 and B n = 399. The assignment log says 400 users went to B.',
        prompt: 'What do you do?',
        options: [
          { t: 'Stop. Find the missing B record, document why, then rerun the KPI and guardrail checks.', ok: true },
          { t: 'Publish. One user out of 800 cannot change the result.', hint: 'Maybe not, but a missing row can signal a logging or eligibility bug that affects other rows too.' },
          { t: 'Delete one A user at random so both groups have 399.', hint: 'That throws away valid data and hides the problem instead of explaining it.' },
        ],
        why: '<p>A gap between planned and recorded group sizes is a data-quality alarm, sometimes called a sample-ratio mismatch. Trace eligibility rules, duplicate keys, missing values and time windows first. A new p-value cannot fix uncertain data.</p>',
      },
      {
        id: 'chi-square', refs: ['5.1'], part: 2, tier: 'Stretch', type: 'blanks',
        title: 'Excel and SPSS should agree',
        scene: 'SPSS CROSSTABS reports a Pearson chi-square of 8.081 for group by purchase. Your Excel z was 2.843.',
        prompt: 'Square your z.',
        lines: ['z² = 2.843² = {{z2}}'],
        blanks: { z2: { accept: St.accept.near(8.08, 0.02), answer: 8.08, label: 'z squared', hint: '2.843 × 2.843 ≈ 8.08.' } },
        why: '<p>For a 2 × 2 table without continuity correction, the Pearson chi-square equals z², so both give p ≈ 0.0045. Read the Pearson line, not the continuity-corrected line. If the numbers do not match, check the counts before trusting either tool.</p>',
      },
      {
        id: 'wrap', refs: ['recap'], part: 2, type: 'read',
        title: 'Your test bench',
        callout: 'Write the rules first. "Significant" means "not zero", not "big enough". A broken guardrail stops a rollout even when the KPI wins.',
        body: ['Change the inputs to invent your own experiment. The gates update as you drag.'],
        figure(el, a) {
          const st = { n: 400, bA: 40, bB: 50, cA: 2, cB: 8 };
          const ctrls = a.h('div', { class: 'lk-controls' });
          el.append(ctrls);
          const out = a.readout(el);
          const list = a.h('ul', { class: 'lk-checklist', 'aria-label': 'Gates for your experiment' });
          el.append(list);
          const draw = () => {
            const xa = Math.round(st.n * st.bA / 100), xb = Math.round(st.n * st.bB / 100);
            const r = St.twoProp(xa, st.n, xb, st.n);
            const inc = (st.cB - st.cA) / 100;
            out([[K.tr('Uplift'), `${St.fmt(r.diff * 100, 1)} ${K.tr('pts')}`], ['z', r.z.toFixed(2)], ['p', r.p < 0.0001 ? '<0.0001' : r.p.toFixed(4)], [K.tr('95% interval'), `${St.fmt(r.lo * 100, 1)} … ${St.fmt(r.hi * 100, 1)} ${K.tr('pts')}`]]);
            const gates = [
              [K.tr('Statistically significant at 0.05'), r.p < 0.05],
              [K.tr('Interval clears the 8-point target'), r.lo >= 0.08],
              [K.tr('Complaints rise by at most 1 point'), inc <= 0.01 + 1e-9],
            ];
            const all = gates.every((g) => g[1]);
            list.replaceChildren(...gates.map(([t, ok]) => a.h('li', null, a.h('span', null, t), a.chip(ok ? K.tr('Pass') : K.tr('Fail'), ok ? 'ok' : 'warn'))),
              a.h('li', null, a.h('span', null, a.h('b', null, K.tr('Verdict'))), a.chip(all ? K.tr('Roll out') : K.tr('Hold and revise'), all ? 'ok' : 'warn')));
          };
          const add = (label, key, min, max, step, fmt) => a.slider(ctrls, { label, min, max, step, value: st[key], fmt, onInput: (v) => { st[key] = v; draw(); } });
          add(K.tr('Users per arm'), 'n', 100, 3000, 50);
          add(K.tr('A purchase rate'), 'bA', 10, 70, 1, (v) => `${v}%`);
          add(K.tr('B purchase rate'), 'bB', 10, 80, 1, (v) => `${v}%`);
          add(K.tr('A complaint rate'), 'cA', 0, 10, 0.5, (v) => `${v}%`);
          add(K.tr('B complaint rate'), 'cB', 0, 12, 0.5, (v) => `${v}%`);
          draw();
        },
      },
    ],
    onFinish(S, a) {
      const graded = Object.keys(S.res).length;
      const firsts = Object.values(S.res).filter((v) => v === 'first').length;
      K.confetti();
      K.sheet(K.tr('Lesson complete'), [
        a.h('p', null, K.tr('You earned {pts} points: {firsts} first-try answers across {graded} questions.').replace('{pts}', S.pts).replace('{firsts}', firsts).replace('{graded}', graded)),
        a.h('p', null, K.tr('Your evidence file stays in the case panel. Use Back or the part bar to revisit any screen before the midterm on October 21.')),
      ]);
    },
  });

  // complaintBars needs the chart API outside a screen render.
  function K_api() { return { Charts: K.Charts, h: K.h, s: K.s }; }
})();

</script>

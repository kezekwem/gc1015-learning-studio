ng=\"application/x-tex\">0.4975-0.40=0.0975</annotation></semantics></math></span>, or <b>9.75 percentage points</b>. The pooled estimate and standard error must also be recalculated before retesting.</p>"},{"id":"4","level":2,"title":"4. Weigh effect size, business value, and A/B guardrails","short":"4. Weigh effect size, business v…","html":""},{"id":"4.1","level":3,"title":"4.1 Apply a prespecified decision gate","short":"4.1. Apply a prespecified decisi…","html":"<p>An <b>effect size</b> expresses magnitude: here, the purchase difference is 10 percentage points, while the complaint difference is another effect on another outcome. <b>Practical significance</b> asks whether those magnitudes matter under CedarCart’s costs and priorities. A <b>guardrail</b> is an outcome that must not degrade beyond an agreed limit. A <b>data-quality diagnostic</b>, such as a group-count check, instead asks whether the experiment can be trusted at all. These are different jobs. Online-experiment practice distinguishes success metrics, guardrails, and data-quality metrics. (The Pennsylvania State University, n.d.-c; Microsoft Research, 2021).</p>\n<p><b>Worked guardrail and business calculation.</b></p>\n<ol><li>Complaint rates are <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>32</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>0.08</mn></mrow><annotation encoding=\"application/x-tex\">32/400=0.08</annotation></semantics></math></span> in B and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>0.02</mn></mrow><annotation encoding=\"application/x-tex\">8/400=0.02</annotation></semantics></math></span> in A. The observed B-minus-A increase is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.06</mn></mrow><annotation encoding=\"application/x-tex\">0.06</annotation></semantics></math></span>, or <b>6 percentage points</b>, against a maximum allowed increase of <b>1 percentage point</b>.</li><li>A descriptive 95% normal interval for that difference uses  \n<div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>S</mi><mi>E</mi><mo>=</mo><msqrt><mrow><mn>0.08</mn><mo stretchy=\"false\">(</mo><mn>0.92</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>+</mo><mn>0.02</mn><mo stretchy=\"false\">(</mo><mn>0.98</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>400</mn></mrow></msqrt><mo>≈</mo><mn>0.01526.</mn></mrow><annotation encoding=\"application/x-tex\">SE=\\sqrt{0.08(0.92)/400+0.02(0.98)/400}\\approx0.01526.</annotation></semantics></math></span></div>\nThe interval is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.06</mn><mo>±</mo><mn>1.96</mn><mo stretchy=\"false\">(</mo><mn>0.01526</mn><mo stretchy=\"false\">)</mo><mo>≈</mo><mo stretchy=\"false\">[</mo><mn>0.0301</mn><mo separator=\"true\">,</mo><mn>0.0899</mn><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">0.06\\pm1.96(0.01526)\\approx[0.0301,0.0899]</annotation></semantics></math></span>: about <b>3.01 to 8.99 percentage points</b>. Both groups have at least eight complaint events; this approximation is illustrative, and a lower-count or high-stakes safety analysis merits a method and review chosen in advance. Even the interval’s lower end exceeds the proposed 1-point limit.</li><li>For a transparent <i>rough scenario</i>, B has 40 more purchases per 400 assigned users. At an assumed $12 margin each, that is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">$</mi><mn>12</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>480</mn></mrow><annotation encoding=\"application/x-tex\">40(\\$12)=\\$480</annotation></semantics></math></span>. B’s assumed operating cost is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>400</mn><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">$</mi><mn>0.60</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>240</mn></mrow><annotation encoding=\"application/x-tex\">400(\\$0.60)=\\$240</annotation></semantics></math></span>. Its 24 additional observed complaints imply <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>24</mn><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">$</mi><mn>25</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>600</mn></mrow><annotation encoding=\"application/x-tex\">24(\\$25)=\\$600</annotation></semantics></math></span> of assumed support cost. The scenario’s incremental net is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">$</mi><mn>480</mn><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>240</mn><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>600</mn><mo>=</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>360</mn></mrow><annotation encoding=\"application/x-tex\">\\$480-\\$240-\\$600=-\\$360</annotation></semantics></math></span> per 400 exposed B users, or <b>−$0.90 per B user</b>. This is not an estimated long-run profit interval: the dollar inputs are assumptions, and complaint consequences may be larger.</li></ol>\n<p><b>Recommendation:</b> <b>Do not roll out B as tested.</b> Investigate the complaint types and the user journey; fix the likely cause, validate logging, and plan a new, adequately sized experiment with the same explicit gates. The purchase test is significant and its <i>point estimate</i> exceeds the 8-point target, but its interval does not establish an uplift of at least 8 points. More decisively, the observed complaint increase breaches the guardrail. Do not quietly relax that limit after seeing the result. (American Statistical Association, 2016; Microsoft Research, 2021).</p>\n<p>Check assignment balance too: 400/400 matches the planned 1:1 split. This does <b>not</b> prove clean randomization or complete logging; a serious imbalance would prompt investigation of a possible <b>sample-ratio mismatch</b> before trusting either KPI. Privacy-aware review should use access-controlled records and report counts rather than expose user identities. (Microsoft Research, 2021).</p>\n<p><b>Failure mode:</b> Looking at many outcomes, dates, or user segments and presenting only a favorable <i>p</i>-value raises false-positive risk. Prespecify the primary outcome and review plan. Formal multiple-comparison methods are an optional bridge, not permission to conceal adverse outcomes. Bayes factors are another way to compare model evidence, but no Bayes factor is computed from—or implied by—the <i>p</i>-values here. (American Statistical Association, 2016).</p>\n<p><b>Try it — ungraded.</b> Imagine that the same experiment had shown 12 complaints in B rather than 32, with A still at 8. What would the observed complaint-rate increase be, and would its <i>point estimate</i> meet the 1-point limit?</p>\n<p><b>Answer.</b> B’s rate would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>3</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">12/400=3\\%</annotation></semantics></math></span>, versus A’s <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">8/400=2\\%</annotation></semantics></math></span>. The increase would be <b>1 percentage point</b>, exactly the stated maximum, so the point estimate would meet an inclusive “no more than” rule. That alone would not settle rollout: examine uncertainty, measurement quality, the primary effect, and the rule set in advance.</p>"},{"id":"5","level":2,"title":"5. Reproduce, check, and report the decision","short":"5. Reproduce, check, and report…","html":""},{"id":"5.1","level":3,"title":"5.1 Run the same analysis in Excel 365 and SPSS","short":"5.1. Run the same analysis in Ex…","html":"<p><b>First specify the inputs.</b> On an access-controlled, cleaned user-level file, <code>variant</code> is A or B; <code>purchase</code> and <code>complaint</code> are numeric 0/1; there is exactly one complete seven-day row per eligible assigned user. Rates have units of <b>users per assigned user</b>. Retain a data dictionary, exclusion counts, assignment dates, and a versioned copy of the formulas or syntax. Do not share the user-level file in a slide deck. Excel’s distribution functions and IBM’s <code>T-TEST</code> and <code>CROSSTABS</code> commands are documented by their vendors. (Microsoft, n.d.-a, n.d.-b, n.d.-c; IBM, n.d.).</p>\n<p><b>Excel 365 route.</b> Suppose the <i>validated</i> 800 user rows occupy rows 2:801, with variant in <code>B</code>, purchase in <code>C</code>, and complaint in <code>D</code>. Build an inspectable summary:</p>\n<div class=\"tbl\"><table><thead><tr><th>Cell</th><th>Formula</th><th>Expected result</th></tr></thead><tbody><tr><td><code>G2</code></td><td><code>=COUNTIF(B2:B801,\"A\")</code></td><td>400 users</td></tr><tr><td><code>G3</code></td><td><code>=COUNTIF(B2:B801,\"B\")</code></td><td>400 users</td></tr><tr><td><code>H2</code></td><td><code>=COUNTIFS(B2:B801,\"A\",C2:C801,1)</code></td><td>160 purchasers</td></tr><tr><td><code>H3</code></td><td><code>=COUNTIFS(B2:B801,\"B\",C2:C801,1)</code></td><td>200 purchasers</td></tr><tr><td><code>I2</code></td><td><code>=H2/G2</code></td><td>0.40</td></tr><tr><td><code>I3</code></td><td><code>=H3/G3</code></td><td>0.50</td></tr><tr><td><code>J2</code></td><td><code>=COUNTIFS(B2:B801,\"A\",D2:D801,1)</code></td><td>8 complaints</td></tr><tr><td><code>J3</code></td><td><code>=COUNTIFS(B2:B801,\"B\",D2:D801,1)</code></td><td>32 complaints</td></tr></tbody></table></div>\n<p>In <code>I4</code>, calculate the purchase difference with <code>=I3-I2</code> → <code>0.10</code>. In <code>I5</code>, pool under the null with <code>=(H2+H3)/(G2+G3)</code> → <code>0.45</code>. In <code>I6</code>, enter <code>=SQRT(I5*(1-I5)*(1/G2+1/G3))</code> → about <code>0.035178</code>. In <code>I7</code>, enter <code>=I4/I6</code> → about <code>2.842676</code>. In <code>I8</code>, enter <code>=2*(1-NORM.S.DIST(ABS(I7),TRUE))</code> → about <code>0.0045</code>. For the effect interval, <code>I9</code> is <code>=SQRT(I3*(1-I3)/G3+I2*(1-I2)/G2)</code> → <code>0.035</code>; lower and upper cells are <code>=I4-1.96*I9</code> and <code>=I4+1.96*I9</code> → <code>0.0314</code>, <code>0.1686</code>. These functions and their arguments are documented by Microsoft. (Microsoft, n.d.-c).</p>\n<p>For the <b>separate survey</b>, if its 16 individual index scores occupy <code>L2:L17</code>, verify <code>=COUNT(L2:L17)</code> → 16, <code>=AVERAGE(L2:L17)</code> → 72, and <code>=STDEV.S(L2:L17)</code> → 8 before using <code>=(AVERAGE(L2:L17)-70)/(STDEV.S(L2:L17)/SQRT(COUNT(L2:L17)))</code> → <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">t=1</annotation></semantics></math></span>. Then <code>=T.DIST.2T(ABS(1),15)</code> gives approximately 0.333; <code>=T.INV.2T(0.05,15)</code> gives the approximately 2.131 interval multiplier. The aggregate table alone cannot validate the unseen survey scores. (Microsoft, n.d.-a, n.d.-b).</p>\n<p><b>SPSS route.</b> After importing and checking the actual 800-row user file, code <code>group</code> as <code>0=A, 1=B</code>, with numeric <code>purchase</code> and <code>complaint</code> indicators. Run the following on that user-level file, <b>without case weights</b>:</p>\n<pre><code>CROSSTABS\n  /TABLES=group BY purchase\n  /STATISTIC=CHISQ\n  /CELLS=COUNT ROW EXPECTED.\nCROSSTABS\n  /TABLES=group BY complaint\n  /STATISTIC=CHISQ\n  /CELLS=COUNT ROW EXPECTED.</code></pre>\n<p>Check the first table’s group totals of 400 each, purchase counts of 160 and 200, and row purchase percentages of 40% and 50%. With a two-by-two Pearson chi-square test <b>without a continuity correction</b>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>z</mi><mn>2</mn></msup><mo>≈</mo><mn>2.84267</mn><msup><mn>6</mn><mn>2</mn></msup><mo>≈</mo><mn>8.081</mn></mrow><annotation encoding=\"application/x-tex\">z^2\\approx2.842676^2\\approx8.081</annotation></semantics></math></span>, so its two-sided significance agrees with the approximately 0.0045 two-proportion <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">z</annotation></semantics></math></span> test. Distinguish the Pearson line from any differently corrected line in the output. The second table must reproduce complaint counts 8 and 32; the business guardrail remains the <b>difference in rates</b>, not just a significance entry. For the separate survey’s individual scores, SPSS’s documented one-sample command is <code>T-TEST TESTVAL=70 /VARIABLES=satisfaction.</code>; inspect <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>, mean, standard deviation, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">df</annotation></semantics></math></span>, and the two-sided significance. (IBM, n.d.).</p>\n<div class=\"key\"><b>Independently reconcile raw user counts, hand calculations, spreadsheet formulas, and SPSS output before writing the recommendation.</b> If totals differ, stop and trace eligibility, duplicate keys, missing values, and measurement windows.</div>\n<p><b>Failure mode:</b> Excel <code>COUNTIFS</code> treats a blank purchase cell differently from a verified zero. A missing outcome must be investigated, not silently classified as a non-purchase. SPSS and Excel can agree perfectly on a wrongly filtered file.</p>\n<p><b>Try it — ungraded.</b> Your purchase table shows A <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>400</mn></mrow><annotation encoding=\"application/x-tex\">n=400</annotation></semantics></math></span> and B <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>399</mn></mrow><annotation encoding=\"application/x-tex\">n=399</annotation></semantics></math></span>, but the assignment log records 400 B users. Can you publish the recalculated test?</p>\n<p><b>Answer.</b> Not yet. Locate the missing B record; determine whether it reflects an import error, duplicate handling, eligibility rule, or incomplete follow-up. Document any exclusion and rerun both KPI and guardrail checks on a consistent, defensible denominator. A fresh <i>p</i>-value cannot fix uncertain provenance.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>Frame the stakeholder’s population, decision, KPI, target, harm limit, and testable claim <b>before</b> looking at outcomes.</li><li>A <i>p</i>-value assesses compatibility with a specified null model; it is neither the probability the null is true nor the size of an effect.</li><li>For the separate CedarCart survey, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>1.00</mn></mrow><annotation encoding=\"application/x-tex\">t=1.00</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>f</mi><mo>=</mo><mn>15</mn></mrow><annotation encoding=\"application/x-tex\">df=15</annotation></semantics></math></span>, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>≈</mo><mn>0.333</mn></mrow><annotation encoding=\"application/x-tex\">p\\approx0.333</annotation></semantics></math></span>; its 72-point mean does not establish a population mean different from 70.</li><li>A and B purchase rates are 40% and 50%. The observed uplift is <b>10 percentage points</b>, with a 95% interval of about <b>3.14–16.86 points</b>.</li><li>The purchase difference is statistically detectable, but its interval does not establish that the true gain reaches the <b>8-point</b> business target.</li><li>Complaint rates are 2% and 8%. The <b>6-point</b> observed increase violates the <b>1-point</b> guardrail.</li><li>Under the stated illustrative dollar assumptions, the simple incremental scenario is <b>−$360 per 400 B users</b>; it is not a forecast with quantified uncertainty.</li><li><b>Do not roll out B as tested.</b> Investigate complaints and data quality, revise the design, and plan a new experiment.</li><li>Reconcile user-level denominators and event counts across the source file, Excel, and SPSS; report limitations and the next action alongside the test result.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<ul><li><b>A/B test:</b> A comparison in which eligible units, here users, are assigned to alternative versions.</li><li><b>Alternative hypothesis (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">H_1</annotation></semantics></math></span>):</b> The population difference a test evaluates as an alternative to the null.</li><li><b>Effect size:</b> A measure of a difference’s magnitude, such as a 10-percentage-point purchase uplift.</li><li><b>Guardrail:</b> A prespecified limit on an outcome that must not worsen unacceptably.</li><li><b>Null hypothesis (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">H_0</annotation></semantics></math></span>):</b> The reference population claim used to calculate a test result; here, no purchase-rate difference.</li><li><b>Parameter:</b> A value describing a population, such as its purchase probability <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">p_B</annotation></semantics></math></span>.</li><li><b>Percentage point:</b> The arithmetic difference between two percentages; 50% minus 40% is 10 points.</li><li><b>Power:</b> The probability that a test detects a specified real effect under its assumptions.</li><li>***P<i>-value:</i>* Under a specified null model, the probability of a result at least as extreme as the observed one.</li><li><b>Practical significance:</b> Whether an effect is large enough to matter for a defined decision.</li><li><b>Sample-ratio mismatch:</b> A discrepancy between planned and recorded assignment proportions that warrants investigation.</li><li><b>Standard error:</b> A measure of how much an estimator would vary across repeated samples under a model.</li><li><b>Statistical significance:</b> A result meeting a prespecified test threshold; not a judgment of value.</li><li><b>Type I error:</b> Rejecting a null hypothesis that is true.</li><li><b>Type II error:</b> Failing to reject a null hypothesis when the specified alternative is true.</li></ul>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>American Statistical Association. (2016). <i>American Statistical Association releases statement on statistical significance and p-values</i>. <a href=\"https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf\" target=\"_blank\" rel=\"noopener\">https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf</a></p>\n<p>IBM. (n.d.). <i>IBM SPSS Statistics 31 command syntax reference</i>. <a href=\"https://www.ibm.com/docs/en/SSLVMB_31.0.0/pdf/IBM_SPSS_Statistics_Command_Syntax_Reference.pdf\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/SSLVMB_31.0.0/pdf/IBM_SPSS_Statistics_Command_Syntax_Reference.pdf</a></p>\n<p>Microsoft. (n.d.-a). <i>T.DIST.2T function</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/functions/t-dist-2t-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/functions/t-dist-2t-function</a></p>\n<p>Microsoft. (n.d.-b). <i>T.INV.2T function</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/functions/t-inv-2t-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/functions/t-inv-2t-function</a></p>\n<p>Microsoft. (n.d.-c). <i>NORM.S.DIST function</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/functions/norm-s-dist-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/functions/norm-s-dist-function</a></p>\n<p>Microsoft Research. (2021, January 25). <i>Patterns of trustworthy experimentation: During-experiment stage</i>. <a href=\"https://www.microsoft.com/en-us/research/articles/patterns-of-trustworthy-experimentation-during-experiment-stage/\" target=\"_blank\" rel=\"noopener\">https://www.microsoft.com/en-us/research/articles/patterns-of-trustworthy-experimentation-during-experiment-stage/</a></p>\n<p>The Pennsylvania State University. (n.d.-a). <i>Collecting data</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson01\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson01</a></p>\n<p>The Pennsylvania State University. (n.d.-b). <i>Hypothesis testing, part 1</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson05\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson05</a></p>\n<p>The Pennsylvania State University. (n.d.-c). <i>Hypothesis testing, part 2</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson06\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson06</a></p>\n<p>The Pennsylvania State University. (n.d.-d). <i>Inference for one sample</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson08\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson08</a></p>\n<p>The Pennsylvania State University. (n.d.-e). <i>Inference for two samples</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson09\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson09</a></p>"}]};
globalThis.LESSON_I18N = {"zh":{"Should CedarCart Ship B?":"CedarCart 应该上线 B 吗？","GC1015 · Session 6 · Hypothesis tests, effects and guardrails":"GC1015 · 第 6 课 · 假设检验、效应与护栏指标","Finish":"完成","Evidence so far":"目前的证据","Claims and errors":"主张与错误","The A/B test":"A/B 测试","Worth shipping?":"值得上线吗？","Case file: CedarCart":"案例档案：CedarCart","Fictional app retailer. Each eligible user was randomly assigned once. Outcomes counted within 7 days.":"虚构的应用零售商。每位符合条件的用户只被随机分配一次。结果按 7 天内发生的行为计数。","A standard":"A 标准版","B shorter":"B 精简版","Assigned users":"分配用户数","Bought":"购买","Complained":"投诉","Survey of B users only: n = 16, mean 72, s = 8. Goal 70.":"仅针对 B 组用户的调查：n = 16，均值 72，s = 8。目标为 70。","Assumptions: $12 margin per extra purchase, $0.60 per user shown B, $25 per extra complaint.":"假设：每多一笔购买带来 $12 利润，每位看到 B 的用户成本 $0.60，每多一起投诉成本 $25。","Decision rules":"决策规则","Set on screen 2":"在第 2 屏设定","Primary test":"主要检验","Survey t-test":"调查 t 检验","Purchase uplift":"购买提升","z-test":"z 检验","95% interval for uplift":"提升的 95% 置信区间","Complaint guardrail":"投诉护栏指标","Net impact":"净影响","Recommendation":"建议","Should CedarCart ship checkout B?":"CedarCart 应该上线结账页面 B 吗？","Your gut call, before any math: should CedarCart roll out B?":"先别算，凭直觉判断：CedarCart 应该推出 B 吗？","CedarCart, a fictional app that sells household supplies, built a shorter checkout screen, B, to replace its standard screen, A.":"CedarCart 是一款虚构的应用，销售家居用品。它做了一个更短的结账页面 B，用来替代标准页面 A。","The team randomly assigned 800 users: 400 saw A and 400 saw B. More B users bought something.":"团队随机分配了 800 名用户：400 人看到 A，400 人看到 B。B 组中购买的用户更多。","Noted. We will check your call against the evidence at the end.":"已记录。最后我们会用证据来检验你的判断。","Yes, ship B":"是，上线 B","No, keep A":"否，保留 A","I need more information":"我需要更多信息","Write the rules before you look":"先定规则，再看结果","You are the analyst. The product manager asks you to set the decision rules before anyone opens the results.":"你是分析师。产品经理请你在任何人打开结果之前，先设定决策规则。","Drag each rule into its place. Two tiles do not belong anywhere.":"把每条规则拖到对应的位置。有两张卡片不属于任何位置。","<p>Rules written first stop anyone from moving the goalposts after seeing results.</p>\n          <ul><li><b>KPI:</b> divide by every user who was randomly assigned, whether or not they bought. If you divide by users who reached the payment page, the users B drove away vanish from the count.</li>\n          <li><b>Target:</b> the uplift that makes the change worth it for the business, here 8 percentage points.</li>\n          <li><b>Guardrail:</b> a harm that must not grow past a limit, even when the KPI improves.</li>\n          <li><b>α:</b> the false-alarm risk you accept, fixed before the test.</li></ul>":"<p>事先写好规则，可以防止任何人在看到结果后临时改变标准。</p>\n          <ul><li><b>KPI：</b>除以所有被随机分配的用户，无论他们是否购买。如果除以到达付款页面的用户，被 B 劝退的用户就会从计数中消失。</li>\n          <li><b>目标：</b>让这项改动对业务来说值得的提升幅度，这里是 8 个百分点。</li>\n          <li><b>护栏指标：</b>一种不能超过上限的损害，即使 KPI 改善了也不行。</li>\n          <li><b>α：</b>你愿意接受的误报风险，在检验之前就固定下来。</li></ul>","Buyers ÷ users who reached the payment page":"购买者 ÷ 到达付款页面的用户","Complaint rate rises by at most 1 point":"投诉率最多上升 1 个百分点","0.05, two-sided, fixed in advance":"0.05，双侧，事先固定","Buyers ÷ all assigned users":"购买者 ÷ 所有被分配的用户","Whatever p-value the data gives":"数据给出什么 p 值就用什么","Uplift of at least 8 percentage points":"提升至少 8 个百分点","Primary KPI":"主要 KPI","Rollout target":"上线目标","Guardrail (harm limit)":"护栏指标（损害上限）","False-alarm tolerance, α":"误报容忍度，α","Users whom B drove away never reach the payment page, so that count hides them. Use every assigned user.":"被 B 劝退的用户根本到不了付款页面，所以这个计数会把他们藏起来。请使用所有被分配的用户。","α is chosen before the data. A p-value only exists after the data.":"α 要在看数据之前选定。p 值只有在拿到数据之后才存在。","KPI per assigned user; target +8 pts; complaints +1 pt max; α 0.05 two-sided":"KPI 按每位被分配用户计算；目标 +8 个百分点；投诉最多 +1 个百分点；α 0.05，双侧","State the test":"写出检验","Your rules say the test is two-sided, so it should catch B being better or worse than A.":"你的规则规定检验是双侧的，所以它应该能发现 B 比 A 更好或更差。","Which pair states CedarCart's primary test?":"哪一组表述是 CedarCart 的主要检验？","<p>p<sub>A</sub> and p<sub>B</sub> are the purchase probabilities for future eligible users. H₀ says there is no difference; H₁ says there is one, in either direction.</p>\n          <p>A one-sided test is fine only if it is chosen before results and harm is handled some other way. It is never a way to halve an awkward p-value afterwards.</p>":"<p>p<sub>A</sub> 和 p<sub>B</sub> 是未来符合条件用户的购买概率。H₀ 表示没有差异；H₁ 表示存在差异，方向不限。</p>\n          <p>只有在看结果之前就选定，并且用其他方式处理损害风险，才可以使用单侧检验。它绝不能用来在事后把一个不理想的 p 值减半。</p>","H₀: p<sub>B</sub> − p<sub>A</sub> = 0, and H₁: p<sub>B</sub> − p<sub>A</sub> ≠ 0":"H₀: p<sub>B</sub> − p<sub>A</sub> = 0；H₁: p<sub>B</sub> − p<sub>A</sub> ≠ 0","H₀: p<sub>B</sub> − p<sub>A</sub> = 0, and H₁: p<sub>B</sub> − p<sub>A</sub> &gt; 0":"H₀: p<sub>B</sub> − p<sub>A</sub> = 0；H₁: p<sub>B</sub> − p<sub>A</sub> &gt; 0","That alternative is one-sided. CedarCart chose two-sided in advance, and B could also hurt sales.":"这个备择假设是单侧的。CedarCart 事先选择了双侧检验，而且 B 也可能拉低销量。","H₀: p<sub>B</sub> − p<sub>A</sub> ≠ 0, and H₁: p<sub>B</sub> − p<sub>A</sub> = 0":"H₀: p<sub>B</sub> − p<sub>A</sub> ≠ 0；H₁: p<sub>B</sub> − p<sub>A</sub> = 0","These are reversed. The null is the \"no difference\" claim that we test against.":"这两个写反了。原假设是“没有差异”这一主张，我们以它为基准进行检验。","H₀: p̂<sub>B</sub> = 0.50, and H₁: p̂<sub>B</sub> ≠ 0.50":"H₀: p̂<sub>B</sub> = 0.50；H₁: p̂<sub>B</sub> ≠ 0.50","Hypotheses are about population values (p), not the sample rate you already saw (p̂).":"假设针对的是总体参数（p），而不是你已经看到的样本比例（p̂）。","H₀: p<sub>B</sub> − p<sub>A</sub> = 0 vs H₁: ≠ 0":"H₀: p<sub>B</sub> − p<sub>A</sub> = 0 对 H₁: ≠ 0","Two ways to be wrong":"两种出错方式","Every test ends in a decision, but the truth stays hidden. That gives four possible outcomes.":"每次检验都以一个决策结束，但真相始终是隐藏的。因此有四种可能的结果。","Drag each label into the matching cell.":"把每个标签拖到对应的格子里。","<p>α is the chance of a Type I error when H₀ is true. β is the chance of a Type II error when a real effect of a stated size exists. Power is 1 − β.</p>\n          <p>For CedarCart, a false alarm means paying to roll out a screen that does nothing. A miss means leaving a real improvement on the table.</p>":"<p>α 是 H₀ 为真时犯第一类错误的概率。β 是存在某个设定大小的真实效应时犯第二类错误的概率。统计功效等于 1 − β。</p>\n          <p>对 CedarCart 来说，误报意味着花钱推出一个毫无作用的页面。漏报意味着白白放弃一个真实的改进。</p>","Correct decision":"正确决策","Type II error: missed win":"第二类错误：错失真实提升","Type I error: false alarm":"第一类错误：误报","Truth ↓   Decision →":"真相 ↓   决策 →","B is truly no better<br><small>H₀ true</small>":"B 实际上并不更好<br><small>H₀ 为真</small>","B is truly better<br><small>H₀ false</small>":"B 实际上更好<br><small>H₀ 为假</small>","Roll out B<br><small>reject H₀</small>":"推出 B<br><small>拒绝 H₀</small>","Keep A<br><small>fail to reject H₀</small>":"保留 A<br><small>不拒绝 H₀</small>","A Type I error is a false alarm: you roll out B, but B does nothing.":"第一类错误就是误报：你推出了 B，但 B 毫无作用。","A Type II error is a miss: B really is better, but you keep A.":"第二类错误就是漏报：B 确实更好，但你保留了 A。","A correct decision matches the truth: roll out when B is better, keep A when it is not.":"正确决策与真相一致：B 更好时推出 B，B 不更好时保留 A。","Tighten α and watch β":"收紧 α，观察 β","Suppose B truly lifts purchases by 8 points. Slide α and the sample size and watch the shaded areas.":"假设 B 确实让购买率提升了 8 个百分点。拖动 α 和样本量滑块，观察阴影区域的变化。","CedarCart keeps 400 users per arm but tightens α from 0.05 to 0.01. What happens to β, the chance of missing a real 8-point lift?":"CedarCart 保持每组 400 名用户，但把 α 从 0.05 收紧到 0.01。β，也就是错过真实 8 个百分点提升的概率，会怎样变化？","<p>At 400 users per arm, power for an 8-point lift is about 63% at α = 0.05 and about 38% at α = 0.01. With a fixed sample, fewer false alarms cost you more misses.</p>\n          <p>The way to cut both risks is a bigger sample, which you plan before the test.</p>":"<p>每组 400 名用户时，检测 8 个百分点提升的统计功效在 α = 0.05 时约为 63%，在 α = 0.01 时约为 38%。样本量固定时，减少误报的代价是更多漏报。</p>\n          <p>想同时降低两种风险，就要增大样本量，而这需要在检验之前规划好。</p>","β rises: fewer false alarms, but more real wins slip through":"β 上升：误报更少，但会漏掉更多真实提升","β falls: a stricter test also catches more real wins":"β 下降：更严格的检验也能发现更多真实提升","Set α to 0.01 and watch the β readout. A stricter cut-off moves right, so more of the violet curve falls below it.":"把 α 设为 0.01，看看 β 的读数。更严格的临界值会右移，所以紫色曲线有更多部分落在临界值以下。","β stays the same, because α and β are unrelated":"β 不变，因为 α 和 β 互不相关","Move the α slider and watch β. With a fixed sample size they trade off.":"移动 α 滑块，观察 β。样本量固定时，两者此消彼长。","Buy power with sample size":"用样本量换取统计功效","The product manager wants at least an 80% chance of detecting a true 8-point lift, with α = 0.05.":"产品经理希望在 α = 0.05 下，至少有 80% 的概率检测到真实的 8 个百分点提升。","Drag the sample size. What is the smallest number of users per arm, in steps of 50, that reaches 80% power?":"拖动样本量。以 50 为步长，达到 80% 统计功效所需的每组最少用户数是多少？","<p>At 600 per arm, power is 79.8%. At 650 it is 82.9%. The exact answer is about 604 per arm.</p>\n          <p>CedarCart's 400 per arm gave only about 63% power to detect an 8-point lift, so the study was small for its own target. Plan the sample size before the test, not after.</p>":"<p>每组 600 人时，统计功效为 79.8%。每组 650 人时为 82.9%。精确答案约为每组 604 人。</p>\n          <p>CedarCart 每组 400 人，检测 8 个百分点提升的统计功效只有约 63%，所以相对于它自己的目标，这项研究的样本偏小。样本量要在检验之前规划，而不是事后。</p>","A survey against a goal":"将调查结果与目标比较","Separately, 16 B users rated their satisfaction on a 0 to 100 index. The team goal is 70 points. Only B users took this survey.":"另外，16 名 B 组用户用 0 到 100 的指数给满意度打分。团队目标是 70 分。只有 B 组用户参加了这项调查。","Fill in the one-sample t-test.":"填写单样本 t 检验。","<p>SE measures how much the sample mean would move from one sample to the next. t counts how many SEs the mean sits from the goal.</p>\n          <p>Here the mean is just one SE above 70, with df = n − 1 = 15. In Excel: <code>=(AVERAGE(L2:L17)-70)/(STDEV.S(L2:L17)/SQRT(COUNT(L2:L17)))</code>.</p>":"<p>SE 衡量样本均值在不同样本之间会变动多少。t 计算均值离目标有几个 SE。</p>\n          <p>这里均值只比 70 高出一个 SE，df = n − 1 = 15。在 Excel 中：<code>=(AVERAGE(L2:L17)-70)/(STDEV.S(L2:L17)/SQRT(COUNT(L2:L17)))</code>。</p>","SE = s / √n = 8 / √16 = {{se}} points":"SE = s / √n = 8 / √16 = {{se}} 分","t = (x̄ − 70) / SE = (72 − 70) / SE = {{t}}":"t = (x̄ − 70) / SE = (72 − 70) / SE = {{t}}","√16 = 4, so SE = 8 ÷ 4.":"√16 = 4，所以 SE = 8 ÷ 4。","Standard error":"标准误","Subtract the goal from the mean, then divide by SE: 2 ÷ 2.":"先用均值减去目标，再除以 SE：2 ÷ 2。","t statistic":"t 统计量","t = 1.00, df = 15":"t = 1.00, df = 15","Read the t-table":"查 t 表","No software in the exam room? A printed t-table gives the same cut-offs. Each row is a df. Each column is the total tail area.":"考场里没有软件？纸质 t 表也能给出同样的临界值。每一行对应一个 df。每一列是尾部的总面积。","Find the critical t for the survey test: df = 15, two-sided α = 0.05. Tap that cell.":"找出调查检验的临界 t 值：df = 15，双侧 α = 0.05。点击那个格子。","<p>Row 15, column 0.05 gives t* = 2.131, the cut-off that leaves 2.5% in each tail. In Excel: <code>=T.INV.2T(0.05, 15)</code>.</p>\n          <p>It is the same 2.131 in the survey's 95% interval, 72 ± 2.131 × 2. The survey's t = 1.00 sits well inside ±2.131, so the test fails to reject H₀.</p>":"<p>第 15 行、0.05 列给出 t* = 2.131，这个临界值在每侧尾部各留下 2.5%。在 Excel 中：<code>=T.INV.2T(0.05, 15)</code>。</p>\n          <p>调查的 95% 置信区间 72 ± 2.131 × 2 用的也是这个 2.131。调查的 t = 1.00 远在 ±2.131 之内，所以检验不拒绝 H₀。</p>","Trap the p-value":"把 p 值夹住","A table cannot give the exact p-value, but it can trap it between two columns. The survey gave t = 1.00 with df = 15.":"表格给不出精确的 p 值，但能把它夹在两列之间。调查得到 t = 1.00，df = 15。","Read along the df = 15 row. Where does t = 1.00 fall, and what does that say about p?":"沿着 df = 15 这一行读。t = 1.00 落在哪里？这对 p 意味着什么？","<p>Every cut-off on row 15 is bigger than 1.00, even the 0.20 column (1.341), so the two-tailed p-value is bigger than 0.20. Excel gives the exact value, <code>=T.DIST.2T(1, 15)</code> ≈ 0.333, which agrees.</p>\n          <p>Moving right along a row, cut-offs grow and tail areas shrink. A bigger |t| always means a smaller p.</p>":"<p>第 15 行的每个临界值都大于 1.00，连 0.20 列（1.341）也是，所以双尾 p 值大于 0.20。Excel 给出的精确值 <code>=T.DIST.2T(1, 15)</code> ≈ 0.333 与此一致。</p>\n          <p>沿着一行向右移动，临界值变大，尾部面积变小。|t| 越大，p 总是越小。</p>","p > 0.20, because 1.00 is smaller than 1.341, the smallest cut-off in the row":"p > 0.20，因为 1.00 小于 1.341，也就是这一行中最小的临界值","p is between 0.05 and 0.10":"p 在 0.05 和 0.10 之间","That needs |t| between 1.753 and 2.131. A t of 1.00 is far smaller.":"那需要 |t| 在 1.753 和 2.131 之间。t = 1.00 要小得多。","p < 0.05, because t is positive":"p < 0.05，因为 t 是正数","The sign does not matter in a two-sided test. Compare |t| with the cut-offs: 1.00 is below all of them.":"在双侧检验中，符号不重要。把 |t| 与临界值比较：1.00 比它们都小。","What does p ≈ 0.333 allow you to say?":"p ≈ 0.333 能让你得出什么结论？","Excel returns =T.DIST.2T(1, 15) ≈ 0.333. Your α is 0.05.":"Excel 返回 =T.DIST.2T(1, 15) ≈ 0.333。你的 α 是 0.05。","What can CedarCart honestly say about satisfaction?":"关于满意度，CedarCart 能如实说些什么？","<p>p ≈ 0.333 is far above 0.05, so we fail to reject. The 95% interval, 72 ± 2.131 × 2 = 67.74 to 76.26 points, includes 70.</p>\n          <p>That means \"not shown to differ\", never \"equal\". Also ask who answered: if unhappy users skipped the survey, no formula can fix that bias.</p>":"<p>p ≈ 0.333 远高于 0.05，所以我们不拒绝原假设。95% 置信区间为 72 ± 2.131 × 2 = 67.74 到 76.26 分，包含 70。</p>\n          <p>这意味着“未显示出差异”，绝不是“相等”。还要问问是谁作答的：如果不满意的用户跳过了调查，任何公式都无法修正这种偏差。</p>","Fail to reject H₀. This sample does not show the mean differs from 70.":"不拒绝 H₀。这个样本没有显示均值不同于 70。","Satisfaction equals 70, so the goal is exactly met.":"满意度等于 70，所以目标恰好达成。","Failing to reject is not proof of equality. A small sample can miss a real gap.":"不拒绝并不能证明相等。小样本可能错过真实的差距。","Reject H₀. The mean of 72 beats the goal of 70.":"拒绝 H₀。均值 72 超过了目标 70。","72 is above 70 in this sample, but p ≈ 0.33 means a gap this size is common by chance with 16 people.":"在这个样本中 72 高于 70，但 p ≈ 0.33 说明，只有 16 人时，仅凭偶然出现这么大的差距很常见。","B users are more satisfied than A users.":"B 组用户比 A 组用户更满意。","Only B users took this survey. There is no A group to compare with.":"只有 B 组用户参加了这项调查。没有 A 组可以比较。","t = 1.00, df 15, p ≈ 0.333: not shown to differ":"t = 1.00，df 15，p ≈ 0.333：未显示出差异","Same gap, more people":"差距不变，人数更多","Keep the same 2-point gap and the same spread, s = 8. Only the number of respondents changes.":"保持同样 2 分的差距和同样的离散程度 s = 8。只改变受访人数。","Drag n along the curve. What is the smallest sample that makes the same 2-point gap significant at 0.05?":"沿曲线拖动 n。要让同样 2 分的差距在 0.05 水平上显著，最小样本量是多少？","<p>At n = 64, SE = 8 / √64 = 1 and t = 2.00 with df = 63, so p ≈ 0.0498. At n = 63, p ≈ 0.052.</p>\n          <p>The gap never changed; only the precision did. So \"not significant\" at n = 16 never meant \"no difference\".</p>":"<p>n = 64 时，SE = 8 / √64 = 1，t = 2.00，df = 63，所以 p ≈ 0.0498。n = 63 时，p ≈ 0.052。</p>\n          <p>差距从未改变，改变的只是精确度。所以 n = 16 时的“不显著”从来不意味着“没有差异”。</p>","Count the right people":"数对人","Imagine B confuses some users, and they leave before they reach the payment page.":"设想 B 让一些用户感到困惑，他们在到达付款页面之前就离开了。","To measure B's purchase rate fairly, what goes in the denominator?":"要公平地衡量 B 的购买率，分母应该是什么？","<p>The randomized unit is the user. Random assignment makes the two groups of 400 comparable.</p>\n          <p>Filtering after assignment, such as keeping only users who reached checkout, can break that balance and bias the result in B's favour.</p>":"<p>随机化的单位是用户。随机分配让两个 400 人的组可以相互比较。</p>\n          <p>在分配之后再筛选，比如只保留到达结账环节的用户，可能会破坏这种平衡，让结果偏向 B。</p>","All 400 users randomly assigned to B":"被随机分配到 B 的全部 400 名用户","Only the B users who reached the payment page":"只算到达付款页面的 B 组用户","The users B drove away disappear from that count, which flatters B.":"被 B 劝退的用户会从这个计数中消失，这会让 B 显得更好。","The number of orders B received":"B 收到的订单数","Orders count events, not people. One user can place several orders.":"订单统计的是事件，不是人。一位用户可以下多个订单。","From counts to rates":"从计数到比率","A: 160 of 400 assigned users bought. B: 200 of 400 bought.":"A：400 名被分配用户中有 160 人购买。B：400 人中有 200 人购买。","Write each rate as a decimal, then the gap in percentage points.":"把每个比率写成小数，再写出以百分点表示的差距。","<p>40% of A users and 50% of B users bought. The absolute effect is 0.10, or 10 percentage points. This is an observation about these 800 users; the test comes next.</p>":"<p>A 组 40% 的用户和 B 组 50% 的用户进行了购买。绝对效应是 0.10，即 10 个百分点。这是对这 800 名用户的观察，检验在下一步。</p>","p̂<sub>A</sub> = 160 / 400 = {{pa}}":"p̂<sub>A</sub> = 160 / 400 = {{pa}}","p̂<sub>B</sub> = 200 / 400 = {{pb}}":"p̂<sub>B</sub> = 200 / 400 = {{pb}}","gap = p̂<sub>B</sub> − p̂<sub>A</sub> = {{gap}} percentage points":"差距 = p̂<sub>B</sub> − p̂<sub>A</sub> = {{gap}} 个百分点","Rate A":"A 组比率","Rate B":"B 组比率","Write the gap in points: 0.50 − 0.40 = 0.10, which is 10 percentage points.":"用百分点写出差距：0.50 − 0.40 = 0.10，即 10 个百分点。","Gap in points":"差距（百分点）","40% → 50%: +10 pts":"40% → 50%：+10 个百分点","Points or percent?":"百分点还是百分比？","A teammate drafts three sentences for the launch memo.":"一位同事为上线备忘录起草了三句话。","Which sentence is wrong?":"哪句话是错的？","<p>Percentage points subtract two percentages. Percent change divides by the starting rate. Both true statements here describe the same gap; mixing their units, as in \"25 points\", is the error. CedarCart's 8-point target is in points.</p>":"<p>百分点是两个百分比直接相减。百分比变化是除以起始比率。这里两个正确的表述描述的是同一个差距；把它们的单位混用，比如说“25 个百分点”，就是错误所在。CedarCart 的 8 个百分点目标以百分点为单位。</p>","B's purchase rate is 25 percentage points higher than A's.":"B 的购买率比 A 高 25 个百分点。","Right. 50% − 40% is 10 points. The 25% figure is the relative change.":"对。50% − 40% 是 10 个百分点。25% 这个数字是相对变化。","B's purchase rate is 10 percentage points higher than A's.":"B 的购买率比 A 高 10 个百分点。","That one is correct: 50% − 40% = 10 points.":"这句是正确的：50% − 40% = 10 个百分点。","B's purchase rate is 25% higher than A's, in relative terms.":"按相对值计算，B 的购买率比 A 高 25%。","That one is correct: 10 ÷ 40 = 0.25, a 25% relative rise.":"这句是正确的：10 ÷ 40 = 0.25，即相对提升 25%。","How rare is a 10-point gap?":"10 个百分点的差距有多罕见？","Pretend B is no different from A. Random assignment alone would still create small gaps. The curve shows how big those chance gaps usually are with 400 users per arm.":"假设 B 与 A 没有任何差别。仅凭随机分配，仍会产生小的差距。曲线显示了每组 400 名用户时，这些偶然差距通常有多大。","Drag the marker to the real gap, 10 points. About how often would chance alone produce a gap at least that large?":"把标记拖到真实差距 10 个百分点处。仅凭偶然，出现至少这么大差距的频率大约是多少？","<p>With 400 users per arm, chance gaps have a standard error of about 3.5 points. A 10-point gap is about 2.84 standard errors from zero, and only about 0.45% of no-difference worlds go that far in either direction. That share is the p-value.</p>":"<p>每组 400 名用户时，偶然差距的标准误约为 3.5 个百分点。10 个百分点的差距距离零约 2.84 个标准误，在没有差异的世界中，只有约 0.45% 会在任一方向上偏离这么远。这个比例就是 p 值。</p>","About 45% of the time":"大约 45% 的情况","That matches a gap of only 2 or 3 points. Drag the marker to 10.":"这只对应 2 到 3 个百分点的差距。把标记拖到 10。","About 5% of the time":"大约 5% 的情况","That matches a gap near 7 points. Keep dragging to 10.":"这对应约 7 个百分点的差距。继续拖到 10。","Less than 1% of the time":"不到 1% 的情况","Put a number on it":"用数字说话","If H₀ is true, both screens share one purchase rate, so you pool all the buyers to estimate it.":"如果 H₀ 为真，两个页面的购买率相同，所以你把所有购买者合并起来估计这个比率。","Fill in the two-proportion z-test.":"填写两比例 z 检验。","<p>z ≈ 2.843, and the two-sided p = 2 × (1 − Φ(2.843)) ≈ 0.0045. In Excel: <code>=2*(1-NORM.S.DIST(ABS(I7),TRUE))</code>.</p>\n          <p>Because 0.0045 &lt; 0.05, reject H₀: these data are not consistent with zero difference.</p>":"<p>z ≈ 2.843，双侧 p = 2 × (1 − Φ(2.843)) ≈ 0.0045。在 Excel 中：<code>=2*(1-NORM.S.DIST(ABS(I7),TRUE))</code>。</p>\n          <p>因为 0.0045 &lt; 0.05，所以拒绝 H₀：这些数据与零差异不一致。</p>","pooled p̂<sub>0</sub> = (160 + 200) / 800 = {{p0}}":"合并 p̂<sub>0</sub> = (160 + 200) / 800 = {{p0}}","SE<sub>0</sub> = √( p̂<sub>0</sub>(1 − p̂<sub>0</sub>)(1/400 + 1/400) ) ≈ 0.0352":"SE<sub>0</sub> = √( p̂<sub>0</sub>(1 − p̂<sub>0</sub>)(1/400 + 1/400) ) ≈ 0.0352","z = 0.10 / 0.0352 = {{z}}":"z = 0.10 / 0.0352 = {{z}}","360 buyers ÷ 800 users = 0.45.":"360 名购买者 ÷ 800 名用户 = 0.45。","Pooled rate":"合并比例","Divide the gap, 0.10, by SE₀, 0.0352.":"用差距 0.10 除以 SE₀，即 0.0352。","z statistic":"z 统计量","z ≈ 2.84, p ≈ 0.0045: reject H₀":"z ≈ 2.84，p ≈ 0.0045：拒绝 H₀","Read the z-table":"查 z 表","The body of a z-table holds Φ(z), the area to the left of z. Rows give z to one decimal. Columns add the second decimal.":"z 表的主体是 Φ(z)，也就是 z 左侧的面积。各行给出精确到一位小数的 z。各列补上第二位小数。","Your z was 2.84. Tap the cell that holds Φ(2.84).":"你的 z 是 2.84。点击 Φ(2.84) 所在的格子。","<p>Row 2.8 plus column 0.04 gives z = 2.84, and the cell holds Φ(2.84) = 0.9977: 99.77% of the standard normal lies to its left.</p>\n          <p>The upper tail is 1 − 0.9977 = 0.0023. A two-sided test counts both tails, which you do next.</p>":"<p>2.8 行加上 0.04 列得到 z = 2.84，这个格子里是 Φ(2.84) = 0.9977：标准正态分布有 99.77% 位于它的左侧。</p>\n          <p>上尾面积是 1 − 0.9977 = 0.0023。双侧检验要把两侧尾部都算上，这是你下一步要做的。</p>","From the table to p":"从表格到 p 值","Two-sided means both tails count: a gap at least this big in either direction.":"双侧意味着两侧尾部都要算：任一方向上至少这么大的差距。","Turn the table value into a two-sided p-value.":"把查表得到的数值换算成双侧 p 值。","<p>The table gives p ≈ 0.0046. Software gives 0.0045, because the table rounds Φ to four decimals. Both are far below 0.05, so the decision is the same: reject H₀.</p>":"<p>查表得到 p ≈ 0.0046。软件给出 0.0045，因为表格把 Φ 四舍五入到四位小数。两者都远低于 0.05，所以决策相同：拒绝 H₀。</p>","upper tail = 1 − 0.9977 = {{tail}}":"上尾面积 = 1 − 0.9977 = {{tail}}","p = 2 × upper tail = {{p}}":"p = 2 × 上尾面积 = {{p}}","Upper tail":"上尾面积","Double the upper tail: 2 × 0.0023.":"把上尾面积乘以 2：2 × 0.0023。","Two-sided p-value":"双侧 p 值","Where does 1.96 come from?":"1.96 是从哪里来的？","A 95% interval leaves 2.5% in each tail, so it needs the z with 97.5% of the area to its left.":"95% 置信区间在每侧尾部各留下 2.5%，所以需要左侧面积为 97.5% 的那个 z。","Hunt inside the table: tap the cell that holds 0.9750. Its row and column give the z.":"在表格里找一找：点击 0.9750 所在的格子。它的行和列给出 z。","<p>0.9750 sits in row 1.9, column 0.06, so z = 1.96. That is the multiplier in every 95% interval in this lesson, for example 0.10 ± 1.96 × 0.035.</p>\n          <p>The t-table agrees: its ∞ row, column 0.05, also reads 1.960.</p>":"<p>0.9750 位于 1.9 行、0.06 列，所以 z = 1.96。这就是本课每个 95% 置信区间里的乘数，例如 0.10 ± 1.96 × 0.035。</p>\n          <p>t 表也一致：它的 ∞ 行、0.05 列同样是 1.960。</p>","Two standard errors, two jobs":"两种标准误，两种用途","Your z used a pooled SE. Now you need a 95% interval for the true uplift.":"你的 z 用的是合并 SE。现在你需要真实提升的 95% 置信区间。","Drag each standard error to the job it belongs to.":"把每种标准误拖到它对应的用途上。","<p>Test with the null-based SE; estimate with the unpooled SE. The interval is 0.10 ± 1.96 × 0.035 = 0.0314 to 0.1686, or +3.14 to +16.86 percentage points.</p>":"<p>做检验用基于原假设的 SE；做估计用非合并 SE。区间为 0.10 ± 1.96 × 0.035 = 0.0314 到 0.1686，即 +3.14 到 +16.86 个百分点。</p>","Unpooled: √(0.50 × 0.50/400 + 0.40 × 0.60/400) = 0.0350":"非合并：√(0.50 × 0.50/400 + 0.40 × 0.60/400) = 0.0350","Pooled: √(0.45 × 0.55 × (1/400 + 1/400)) ≈ 0.0352":"合并：√(0.45 × 0.55 × (1/400 + 1/400)) ≈ 0.0352","Test statistic z<br><small>assumes H₀ is true</small>":"检验统计量 z<br><small>假定 H₀ 为真</small>","95% interval for the uplift<br><small>no assumption of equal rates</small>":"提升的 95% 置信区间<br><small>不假定两个比率相等</small>","The pooled SE assumes the two rates are equal. An interval estimates how different they are, so it uses each arm’s own rate.":"合并 SE 假定两个比率相等。区间估计的是它们相差多少，所以要用各组自己的比率。","+3.14 to +16.86 pts":"+3.14 到 +16.86 个百分点","Does it clear the bar?":"达到门槛了吗？","The point estimate is +10 points and the target is +8. The violet bar is the 95% interval. Drag the target line to explore.":"点估计是 +10 个百分点，目标是 +8。紫色条是 95% 置信区间。拖动目标线来探索。","Does this experiment establish that B's true uplift is at least 8 points?":"这项实验能否确定 B 的真实提升至少为 8 个百分点？","<p>The test rules out zero. It does not rule out uplifts below 8. Drag the target and you will see that only targets at or below 3.14 points sit fully under the interval. Statistically significant does not mean big enough.</p>":"<p>检验排除了零，但没有排除低于 8 的提升。拖动目标线，你会看到只有不超过 3.14 个百分点的目标才完全位于区间下方。统计显著不等于幅度足够大。</p>","No. Plausible uplifts run as low as 3.14 points.":"不能。合理的提升可能低至 3.14 个百分点。","Yes. The point estimate of 10 is above 8.":"能。点估计 10 高于 8。","The point estimate is one plausible value. The interval says the truth could be as low as 3.14.":"点估计只是一个合理的数值。区间表明真实值可能低至 3.14。","Yes. p ≈ 0.0045 is far below 0.05.":"能。p ≈ 0.0045 远低于 0.05。","The p-value tests against zero, not against 8. It says B differs from A, not by how much.":"p 值是相对于零进行检验，而不是相对于 8。它说明 B 与 A 不同，但没有说明差多少。","Check the harm":"检查损害","Complaints within seven days: 8 of 400 A users and 32 of 400 B users.":"七天内的投诉：400 名 A 组用户中有 8 人，400 名 B 组用户中有 32 人。","Fill in the complaint rates and the increase.":"填写投诉率和增幅。","<p>B raises complaints by 6 points, six times the 1-point limit. A 95% interval for that increase runs from about 3.0 to 9.0 points, so even its low end breaks the rule.</p>":"<p>B 让投诉率上升了 6 个百分点，是 1 个百分点上限的六倍。这一增幅的 95% 置信区间约为 3.0 到 9.0 个百分点，所以连它的下限也违反了规则。</p>","complaint rate A = 8 / 400 = {{ca}} %":"A 组投诉率 = 8 / 400 = {{ca}} %","complaint rate B = 32 / 400 = {{cb}} %":"B 组投诉率 = 32 / 400 = {{cb}} %","increase = {{inc}} percentage points (limit: 1)":"增幅 = {{inc}} 个百分点（上限：1）","8 ÷ 400 = 0.02, which is 2%.":"8 ÷ 400 = 0.02，即 2%。","Complaint rate A in percent":"A 组投诉率（百分比）","32 ÷ 400 = 0.08, which is 8%.":"32 ÷ 400 = 0.08，即 8%。","Complaint rate B in percent":"B 组投诉率（百分比）","8% − 2% = 6 percentage points.":"8% − 2% = 6 个百分点。","Increase in points":"增幅（百分点）","2% → 8%: +6 pts (limit +1): fails":"2% → 8%：+6 个百分点（上限 +1）：未通过","Where is the line?":"界线在哪里？","Imagine a rerun where A again has 8 complaints in 400 users.":"设想重新做一次实验，A 组同样是 400 名用户中有 8 起投诉。","Drag B's complaints to the highest count that still meets the 1-point limit.":"把 B 组的投诉数拖到仍满足 1 个百分点上限的最高值。","<p>12 of 400 is 3%, exactly 1 point above A’s 2%, so an inclusive \"no more than 1 point\" rule passes. A real decision would still weigh the uncertainty around that point estimate.</p>":"<p>400 人中 12 起是 3%，正好比 A 组的 2% 高 1 个百分点，所以按包含边界的“不超过 1 个百分点”规则，它能通过。真实的决策仍需权衡这个点估计周围的不确定性。</p>","Follow the money":"算一算经济账","Use the rough assumptions: $12 margin per extra purchase, $0.60 per user shown B, and $25 support cost per extra complaint. Per 400 users, B brought 40 extra purchases and 24 extra complaints.":"使用这些粗略假设：每多一笔购买带来 $12 利润，每位看到 B 的用户成本 $0.60，每多一起投诉的客服成本 $25。每 400 名用户中，B 多带来了 40 笔购买和 24 起投诉。","At $12, B loses $360 per 400 users. Drag the margin. At what margin per purchase does B break even?":"利润为 $12 时，B 每 400 名用户亏损 $360。拖动利润滑块。每笔购买的利润达到多少时，B 才能盈亏平衡？","<p>Break-even margin = (240 + 600) ÷ 40 = $21. At the assumed $12, net = 480 − 240 − 600 = −$360 per 400 B users, or −$0.90 per user. These dollars are assumptions, not estimates, and complaint costs could be larger once reputation is counted.</p>":"<p>盈亏平衡利润 = (240 + 600) ÷ 40 = $21。在假设的 $12 下，净额 = 480 − 240 − 600 = −$360（每 400 名 B 组用户），即每位用户 −$0.90。这些金额是假设，不是估计值；如果把声誉损失也算进去，投诉成本可能更高。</p>","−$360 per 400 B users at $12 margin":"利润 $12 时，每 400 名 B 组用户 −$360","Make the call":"做出判断","You are the analyst. The product manager wants one recommendation for Friday’s meeting.":"你是分析师。产品经理希望你为周五的会议给出一条建议。","What do you recommend?":"你建议怎么做？","<p>Two gates fail on their own: the guardrail (+6 against +1) and the target (the interval’s low end, 3.14, is below 8). Net impact is negative under the stated assumptions.</p>\n          <p>\"Do not roll out B as tested\" does not mean B is bad forever. Fix the likely cause, check the logging, and test again with the same gates written in advance.</p>":"<p>有两道关卡各自就未通过：护栏指标（+6 对比上限 +1）和目标（区间下限 3.14 低于 8）。在既定假设下，净影响为负。</p>\n          <p>“不按测试版本推出 B”并不意味着 B 永远不行。找出可能的原因并修复，检查日志记录，然后事先写好同样的关卡，再测一次。</p>","Hold B. Study the complaints, fix the screen, and rerun a properly sized test.":"暂缓 B。研究投诉，修复页面，再做一次样本量合理的测试。","Ship B now, because the purchase lift is statistically significant.":"现在就上线 B，因为购买提升在统计上显著。","Significance filters out noise. It cannot override a broken guardrail or a missed target.":"显著性能过滤掉噪声，但不能推翻未通过的护栏指标或未达成的目标。","Ship B, and raise the complaint limit to 6 points.":"上线 B，并把投诉上限提高到 6 个百分点。","Changing a guardrail after seeing results is moving the goalposts.":"看到结果后再改护栏指标，就是事后挪动标准。","Ship B to half of all users and see what happens.":"先把 B 推给一半用户，看看会发生什么。","Half a rollout still exposes thousands of users to a 6-point jump in complaints.":"即使只推出一半，仍会让数千名用户面临投诉率上升 6 个百分点的问题。","Hold B. Fix, then rerun a sized test.":"暂缓 B。先修复，再做一次样本量合理的测试。","Trust, then publish":"先确认可信，再发布","Before you send the memo, SPSS shows A n = 400 and B n = 399. The assignment log says 400 users went to B.":"在你发送备忘录之前，SPSS 显示 A 组 n = 400，B 组 n = 399。分配日志却显示有 400 名用户被分到 B。","What do you do?":"你会怎么做？","<p>A gap between planned and recorded group sizes is a data-quality alarm, sometimes called a sample-ratio mismatch. Trace eligibility rules, duplicate keys, missing values and time windows first. A new p-value cannot fix uncertain data.</p>":"<p>计划的组规模与记录的组规模不一致，是一种数据质量警报，有时称为样本比例不匹配。先排查资格规则、重复键、缺失值和时间窗口。新的 p 值无法修复不可靠的数据。</p>","Stop. Find the missing B record, document why, then rerun the KPI and guardrail checks.":"停下。找到缺失的 B 组记录，写明原因，然后重新运行 KPI 和护栏指标检查。","Publish. One user out of 800 cannot change the result.":"发布。800 人中少一位用户不可能改变结果。","Maybe not, but a missing row can signal a logging or eligibility bug that affects other rows too.":"也许不会，但缺失的一行可能说明日志或资格判定存在漏洞，也会影响其他行。","Delete one A user at random so both groups have 399.":"从 A 组随机删除一位用户，让两组都是 399 人。","That throws away valid data and hides the problem instead of explaining it.":"这样会丢掉有效数据，掩盖问题而不是解释问题。","Excel and SPSS should agree":"Excel 和 SPSS 的结果应该一致","SPSS CROSSTABS reports a Pearson chi-square of 8.081 for group by purchase. Your Excel z was 2.843.":"SPSS CROSSTABS 报告组别与购买的 Pearson 卡方值为 8.081。你在 Excel 中算出的 z 是 2.843。","Square your z.":"把你的 z 平方。","<p>For a 2 × 2 table without continuity correction, the Pearson chi-square equals z², so both give p ≈ 0.0045. Read the Pearson line, not the continuity-corrected line. If the numbers do not match, check the counts before trusting either tool.</p>":"<p>对于不做连续性校正的 2 × 2 表，Pearson 卡方等于 z²，所以两者给出的都是 p ≈ 0.0045。请看 Pearson 那一行，而不是连续性校正那一行。如果数字对不上，在信任任何一个工具之前，先检查计数。</p>","z² = 2.843² = {{z2}}":"z² = 2.843² = {{z2}}","z squared":"z 的平方","Your test bench":"你的检验工作台","Write the rules first. \"Significant\" means \"not zero\", not \"big enough\". A broken guardrail stops a rollout even when the KPI wins.":"先写规则。“显著”意味着“不为零”，而不是“足够大”。即使 KPI 胜出，护栏指标未通过也会阻止上线。","Change the inputs to invent your own experiment. The gates update as you drag.":"修改输入，设计你自己的实验。拖动时，各项关卡会随之更新。","gap, B minus A (percentage points)":"差距，B 减 A（百分点）","If B equals A (H₀)":"如果 B 等于 A（H₀）","If B is truly 8 points better":"如果 B 真的好 8 个百分点","False-alarm area (α)":"误报区域（α）","Missed-win area (β)":"错失提升区域（β）","Power area":"功效区域","cut-off":"临界值","pts":"百分点","False alarm (α)":"误报（α）","Missed win (β)":"错失提升（β）","Power (1 − β)":"统计功效（1 − β）","α, false-alarm risk":"α，误报风险","Users per arm":"每组用户数","complaint rate":"投诉率","A, standard":"A，标准版","B, shorter":"B，精简版","limit: A + 1 point = 3%":"上限：A + 1 个百分点 = 3%","t distribution for the picked row":"所选行对应的 t 分布","Two-tailed α":"双尾 α","Each tail":"每侧尾部","Tap a cell":"点击一个格子","one tail":"单尾","two tails":"双尾","t-table of critical values":"t 临界值表","Standard normal curve with the area to the left of z":"标准正态曲线，标出 z 左侧的面积","How close?":"有多接近？","Bullseye":"正中靶心","Very warm":"很热了","Warm":"有点热","Cold":"冷冰冰","z-table of areas to the left of z":"z 表：z 左侧的面积","satisfaction index (points)":"满意度指数（分）","goal 70":"目标 70","mean 72":"均值 72","Illustrative scores that match the survey summary: n = 16, mean 72, s = 8.":"与调查汇总相符的示例分数：n = 16，均值 72，s = 8。","respondents (n)":"受访人数（n）","p-value":"p 值","At α = 0.05":"α = 0.05 时","Significant":"显著","Not significant":"不显著","Sample size":"样本量","Assigned to B: 400 users":"分配到 B：400 名用户","Reached the payment page: fewer":"到达付款页面：更少","Bought: 200 users":"购买：200 名用户","Gap":"差距","Chance worlds at least this extreme":"至少这么极端的偶然世界","under 0.1%":"低于 0.1%","Observed gap":"观察到的差距","uplift (percentage points)":"提升（百分点）","Target":"目标","Whole interval above the target?":"整个区间都高于目标？","Yes":"是","No":"否","target":"目标","Target uplift":"目标提升","B complaints":"B 组投诉","Increase":"增幅","Guardrail":"护栏指标","Meets limit":"符合上限","Breaks limit":"超出上限","Extra margin":"额外利润","Screen cost":"页面成本","Complaint cost":"投诉成本","Net":"净额","Margin":"误差范围","Net per 400 B users":"每 400 名 B 组用户的净额","Per B user":"每位 B 组用户","Margin per extra purchase":"每笔额外购买的利润","The purchase gap is statistically significant":"购买差距在统计上显著","The interval clears the 8-point target":"区间完全高于 8 个百分点的目标","low end +3.14":"下限 +3.14","Complaints rise by at most 1 point":"投诉最多上升 1 个百分点","+6 points":"+6 个百分点","Net impact is positive under the assumptions":"在假设条件下，净影响为正","Pass":"通过","Fail":"未通过","Right call.":"判断正确。","Right call. Your gut call at the start was “{call}”. Now you can back your answer with evidence.":"判断正确。你一开始的直觉判断是“{call}”。现在你可以用证据支持你的答案了。","Uplift":"提升","95% interval":"95% 置信区间","Statistically significant at 0.05":"在 0.05 水平上统计显著","Interval clears the 8-point target":"区间完全高于 8 个百分点的目标","Verdict":"结论","Roll out":"推出","Hold and revise":"暂缓并修改","A purchase rate":"A 组购买率","B purchase rate":"B 组购买率","A complaint rate":"A 组投诉率","B complaint rate":"B 组投诉率","Lesson complete":"课程完成","You earned {pts} points: {firsts} first-try answers across {graded} questions.":"你获得了 {pts} 分：{graded} 道题中有 {firsts} 道一次答对。","Your evidence file stays in the case panel. Use Back or the part bar to revisit any screen before the midterm on October 21.":"你的证据档案会保留在案例面板中。在 10 月 21 日期中考试之前，你可以用“返回”或部分导航栏重新查看任意一屏。","Set α back to 0.05, the level CedarCart wrote down.":"把 α 调回 0.05，这是 CedarCart 事先定下的水平。","Power is still below 80%. Add users.":"统计功效仍低于 80%。增加用户数。","That reaches 80%, but a smaller sample does too. Try fewer users.":"这样能达到 80%，但更小的样本也可以。试试更少的用户。","Found it: t* = 2.131. Every 95% survey interval uses it.":"找到了：t* = 2.131。调查的每个 95% 置信区间都用它。","Close. df is n − 1, so 16 − 1 = 15. Move up one row.":"很接近了。df 是 n − 1，所以 16 − 1 = 15。往上移一行。","Use df = n − 1 = 16 − 1 = 15. Find row 15.":"用 df = n − 1 = 16 − 1 = 15。找到第 15 行。","That column is two-tailed 0.10. Two-sided α = 0.05 means 0.025 in each tail, so use the 0.05 column.":"那一列是双尾 0.10。双侧 α = 0.05 表示每侧尾部 0.025，所以要用 0.05 那一列。","Right row. Now use the column headed 0.05, the total of both tails.":"行对了。现在用表头为 0.05 的那一列，也就是两侧尾部的总和。","p is still above 0.05. Add respondents.":"p 仍高于 0.05。增加受访者。","Significant, yes. But a smaller sample gets there too. Find the first n where p drops below 0.05.":"确实显著。但更小的样本也能做到。找出 p 第一次低于 0.05 的 n。","Bullseye: Φ(2.84) = 0.9977.":"正中靶心：Φ(2.84) = 0.9977。","Right row. The column adds the second decimal: 2.84 = 2.8 + 0.04.":"行对了。列补上第二位小数：2.84 = 2.8 + 0.04。","Right column. The row is z to one decimal: 2.8.":"列对了。行是精确到一位小数的 z：2.8。","Split 2.84 into 2.8 (the row) and 0.04 (the column).":"把 2.84 拆成 2.8（行）和 0.04（列）。","Bullseye: z = 1.9 + 0.06 = 1.96.":"正中靶心：z = 1.9 + 0.06 = 1.96。","Warm, but that area is more than 0.9750. Move up or to the left.":"有点热了，但这个面积大于 0.9750。往上或往左移。","That area is less than 0.9750. Move down or to the right.":"这个面积小于 0.9750。往下或往右移。","That passes, but B could have a few more complaints and still pass. Find the highest.":"这样能通过，但 B 再多几起投诉也仍能通过。找出最高的那个数。","Still over the limit. Lower the count of B complaints.":"仍然超过上限。减少 B 的投诉数。","Net is still negative. Raise the margin.":"净值仍为负。提高利润。","B makes money there, but break-even is lower. Find where net first reaches $0.":"B 在这里能赚钱，但盈亏平衡点更低。找出净值第一次达到 $0 的位置。"},"es":{"Should CedarCart Ship B?":"¿Debería CedarCart lanzar B?","GC1015 · Session 6 · Hypothesis tests, effects and guardrails":"GC1015 · Sesión 6 · Pruebas de hipótesis, efectos y métricas de salvaguarda","Finish":"Terminar","Evidence so far":"Evidencia hasta ahora","Claims and errors":"Afirmaciones y errores","The A/B test":"La prueba A/B","Worth shipping?":"¿Vale la pena lanzarlo?","Case file: CedarCart":"Expediente del caso: CedarCart","Fictional app retailer. Each eligible user was randomly assigned once. Outcomes counted within 7 days.":"Minorista ficticio que vende por app. Cada usuario elegible se asignó al azar una sola vez. Los resultados se contaron en un plazo de 7 días.","A standard":"A estándar","B shorter":"B más corta","Assigned users":"Usuarios asignados","Bought":"Compraron","Complained":"Se quejaron","Survey of B users only: n = 16, mean 72, s = 8. Goal 70.":"Encuesta solo a usuarios de B: n = 16, media 72, s = 8. Meta 70.","Assumptions: $12 margin per extra purchase, $0.60 per user shown B, $25 per extra complaint.":"Supuestos: $12 de margen por compra adicional, $0.60 por usuario que ve B, $25 por queja adicional.","Decision rules":"Reglas de decisión","Set on screen 2":"Se definen en la pantalla 2","Primary test":"Prueba principal","Survey t-test":"Prueba t de la encuesta","Purchase uplift":"Aumento en compras","z-test":"Prueba z","95% interval for uplift":"Intervalo del 95% para el aumento","Complaint guardrail":"Salvaguarda de quejas","Net impact":"Impacto neto","Recommendation":"Recomendación","Should CedarCart ship checkout B?":"¿Debería CedarCart lanzar la pantalla de pago B?","Your gut call, before any math: should CedarCart roll out B?":"Tu intuición, antes de cualquier cálculo: ¿debería CedarCart lanzar B?","CedarCart, a fictional app that sells household supplies, built a shorter checkout screen, B, to replace its standard screen, A.":"CedarCart, una app ficticia que vende artículos para el hogar, creó una pantalla de pago más corta, B, para reemplazar su pantalla estándar, A.","The team randomly assigned 800 users: 400 saw A and 400 saw B. More B users bought something.":"El equipo asignó al azar a 800 usuarios: 400 vieron A y 400 vieron B. Más usuarios de B compraron algo.","Noted. We will check your call against the evidence at the end.":"Anotado. Al final compararemos tu respuesta con la evidencia.","Yes, ship B":"Sí, lanzar B","No, keep A":"No, mantener A","I need more information":"Necesito más información","Write the rules before you look":"Escribe las reglas antes de mirar","You are the analyst. The product manager asks you to set the decision rules before anyone opens the results.":"Tienes el rol de analista. El gerente de producto te pide definir las reglas de decisión antes de que alguien abra los resultados.","Drag each rule into its place. Two tiles do not belong anywhere.":"Arrastra cada regla a su lugar. Dos fichas no van en ningún lugar.","<p>Rules written first stop anyone from moving the goalposts after seeing results.</p>\n          <ul><li><b>KPI:</b> divide by every user who was randomly assigned, whether or not they bought. If you divide by users who reached the payment page, the users B drove away vanish from the count.</li>\n          <li><b>Target:</b> the uplift that makes the change worth it for the business, here 8 percentage points.</li>\n          <li><b>Guardrail:</b> a harm that must not grow past a limit, even when the KPI improves.</li>\n          <li><b>α:</b> the false-alarm risk you accept, fixed before the test.</li></ul>":"<p>Escribir las reglas primero evita que alguien cambie las reglas del juego después de ver los resultados.</p>\n          <ul><li><b>KPI:</b> divide entre todos los usuarios asignados al azar, hayan comprado o no. Si divides entre los usuarios que llegaron a la página de pago, los usuarios que B ahuyentó desaparecen del conteo.</li>\n          <li><b>Meta:</b> el aumento que hace que el cambio valga la pena para el negocio, aquí 8 puntos porcentuales.</li>\n          <li><b>Métrica de salvaguarda:</b> un daño que no debe crecer más allá de un límite, aunque el KPI mejore.</li>\n          <li><b>α:</b> el riesgo de falsa alarma que aceptas, fijado antes de la prueba.</li></ul>","Buyers ÷ users who reached the payment page":"Compradores ÷ usuarios que llegaron a la página de pago","Complaint rate rises by at most 1 point":"La tasa de quejas sube como máximo 1 punto","0.05, two-sided, fixed in advance":"0.05, bilateral, fijado de antemano","Buyers ÷ all assigned users":"Compradores ÷ todos los usuarios asignados","Whatever p-value the data gives":"El valor p que den los datos, sea cual sea","Uplift of at least 8 percentage points":"Aumento de al menos 8 puntos porcentuales","Primary KPI":"KPI principal","Rollout target":"Meta para el lanzamiento","Guardrail (harm limit)":"Salvaguarda (límite de daño)","False-alarm tolerance, α":"Tolerancia a falsas alarmas, α","Users whom B drove away never reach the payment page, so that count hides them. Use every assigned user.":"Los usuarios que B ahuyentó nunca llegan a la página de pago, así que ese conteo los oculta. Usa todos los usuarios asignados.","α is chosen before the data. A p-value only exists after the data.":"α se elige antes de ver los datos. Un valor p solo existe después de tener los datos.","KPI per assigned user; target +8 pts; complaints +1 pt max; α 0.05 two-sided":"KPI por usuario asignado; meta +8 pts; quejas +1 pt máx.; α 0.05 bilateral","State the test":"Plantea la prueba","Your rules say the test is two-sided, so it should catch B being better or worse than A.":"Tus reglas dicen que la prueba es bilateral, así que debe detectar si B es mejor o peor que A.","Which pair states CedarCart's primary test?":"¿Qué par plantea la prueba principal de CedarCart?","<p>p<sub>A</sub> and p<sub>B</sub> are the purchase probabilities for future eligible users. H₀ says there is no difference; H₁ says there is one, in either direction.</p>\n          <p>A one-sided test is fine only if it is chosen before results and harm is handled some other way. It is never a way to halve an awkward p-value afterwards.</p>":"<p>p<sub>A</sub> y p<sub>B</sub> son las probabilidades de compra de los futuros usuarios elegibles. H₀ dice que no hay diferencia; H₁ dice que sí la hay, en cualquier dirección.</p>\n          <p>Una prueba unilateral solo es válida si se elige antes de ver los resultados y el posible daño se controla de otra forma. Nunca es una forma de reducir a la mitad un valor p incómodo después.</p>","H₀: p<sub>B</sub> − p<sub>A</sub> = 0, and H₁: p<sub>B</sub> − p<sub>A</sub> ≠ 0":"H₀: p<sub>B</sub> − p<sub>A</sub> = 0, y H₁: p<sub>B</sub> − p<sub>A</sub> ≠ 0","H₀: p<sub>B</sub> − p<sub>A</sub> = 0, and H₁: p<sub>B</sub> − p<sub>A</sub> &gt; 0":"H₀: p<sub>B</sub> − p<sub>A</sub> = 0, y H₁: p<sub>B</sub> − p<sub>A</sub> &gt; 0","That alternative is one-sided. CedarCart chose two-sided in advance, and B could also hurt sales.":"Esa alternativa es unilateral. CedarCart eligió una prueba bilateral de antemano, y B también podría perjudicar las ventas.","H₀: p<sub>B</sub> − p<sub>A</sub> ≠ 0, and H₁: p<sub>B</sub> − p<sub>A</sub> = 0":"H₀: p<sub>B</sub> − p<sub>A</sub> ≠ 0, y H₁: p<sub>B</sub> − p<sub>A</sub> = 0","These are reversed. The null is the \"no difference\" claim that we test against.":"Están al revés. La hipótesis nula es la afirmación de \"no hay diferencia\" contra la que hacemos la prueba.","H₀: p̂<sub>B</sub> = 0.50, and H₁: p̂<sub>B</sub> ≠ 0.50":"H₀: p̂<sub>B</sub> = 0.50, y H₁: p̂<sub>B</sub> ≠ 0.50","Hypotheses are about population values (p), not the sample rate you already saw (p̂).":"Las hipótesis tratan sobre valores de la población (p), no sobre la tasa muestral que ya viste (p̂).","H₀: p<sub>B</sub> − p<sub>A</sub> = 0 vs H₁: ≠ 0":"H₀: p<sub>B</sub> − p<sub>A</sub> = 0 vs. H₁: ≠ 0","Two ways to be wrong":"Dos formas de equivocarse","Every test ends in a decision, but the truth stays hidden. That gives four possible outcomes.":"Toda prueba termina en una decisión, pero la verdad sigue oculta. Eso da cuatro resultados posibles.","Drag each label into the matching cell.":"Arrastra cada etiqueta a la celda que le corresponde.","<p>α is the chance of a Type I error when H₀ is true. β is the chance of a Type II error when a real effect of a stated size exists. Power is 1 − β.</p>\n          <p>For CedarCart, a false alarm means paying to roll out a screen that does nothing. A miss means leaving a real improvement on the table.</p>":"<p>α es la probabilidad de un error tipo I cuando H₀ es verdadera. β es la probabilidad de un error tipo II cuando existe un efecto real de un tamaño dado. La potencia es 1 − β.</p>\n          <p>Para CedarCart, una falsa alarma significa pagar por lanzar una pantalla que no hace nada. No detectar un efecto significa desaprovechar una mejora real.</p>","Correct decision":"Decisión correcta","Type II error: missed win":"Error tipo II: mejora no detectada","Type I error: false alarm":"Error tipo I: falsa alarma","Truth ↓   Decision →":"Realidad ↓   Decisión →","B is truly no better<br><small>H₀ true</small>":"En realidad B no es mejor<br><small>H₀ verdadera</small>","B is truly better<br><small>H₀ false</small>":"En realidad B es mejor<br><small>H₀ falsa</small>","Roll out B<br><small>reject H₀</small>":"Lanzar B<br><small>rechazar H₀</small>","Keep A<br><small>fail to reject H₀</small>":"Mantener A<br><small>no rechazar H₀</small>","A Type I error is a false alarm: you roll out B, but B does nothing.":"Un error tipo I es una falsa alarma: lanzas B, pero B no hace nada.","A Type II error is a miss: B really is better, but you keep A.":"Un error tipo II es una mejora no detectada: B sí es mejor, pero mantienes A.","A correct decision matches the truth: roll out when B is better, keep A when it is not.":"Una decisión correcta coincide con la realidad: lanzas B cuando es mejor y mantienes A cuando no lo es.","Tighten α and watch β":"Reduce α y observa β","Suppose B truly lifts purchases by 8 points. Slide α and the sample size and watch the shaded areas.":"Supón que B en verdad aumenta las compras en 8 puntos. Mueve α y el tamaño de muestra, y observa las áreas sombreadas.","CedarCart keeps 400 users per arm but tightens α from 0.05 to 0.01. What happens to β, the chance of missing a real 8-point lift?":"CedarCart mantiene 400 usuarios por grupo, pero reduce α de 0.05 a 0.01. ¿Qué pasa con β, la probabilidad de no detectar un aumento real de 8 puntos?","<p>At 400 users per arm, power for an 8-point lift is about 63% at α = 0.05 and about 38% at α = 0.01. With a fixed sample, fewer false alarms cost you more misses.</p>\n          <p>The way to cut both risks is a bigger sample, which you plan before the test.</p>":"<p>Con 400 usuarios por grupo, la potencia para detectar un aumento de 8 puntos es de alrededor del 63% con α = 0.05 y de alrededor del 38% con α = 0.01. Con una muestra fija, menos falsas alarmas te cuestan más efectos no detectados.</p>\n          <p>La forma de reducir ambos riesgos es una muestra más grande, que planificas antes de la prueba.</p>","β rises: fewer false alarms, but more real wins slip through":"β sube: menos falsas alarmas, pero se escapan más mejoras reales","β falls: a stricter test also catches more real wins":"β baja: una prueba más estricta también detecta más mejoras reales","Set α to 0.01 and watch the β readout. A stricter cut-off moves right, so more of the violet curve falls below it.":"Fija α en 0.01 y observa el valor de β. Un umbral más estricto se mueve a la derecha, así que una parte mayor de la curva violeta queda por debajo de él.","β stays the same, because α and β are unrelated":"β no cambia, porque α y β no están relacionados","Move the α slider and watch β. With a fixed sample size they trade off.":"Mueve el control deslizante de α y observa β. Con un tamaño de muestra fijo, cuando uno baja, el otro sube.","Buy power with sample size":"Gana potencia con el tamaño de muestra","The product manager wants at least an 80% chance of detecting a true 8-point lift, with α = 0.05.":"El gerente de producto quiere al menos un 80% de probabilidad de detectar un aumento real de 8 puntos, con α = 0.05.","Drag the sample size. What is the smallest number of users per arm, in steps of 50, that reaches 80% power?":"Arrastra el tamaño de muestra. ¿Cuál es el menor número de usuarios por grupo, en pasos de 50, que alcanza una potencia del 80%?","<p>At 600 per arm, power is 79.8%. At 650 it is 82.9%. The exact answer is about 604 per arm.</p>\n          <p>CedarCart's 400 per arm gave only about 63% power to detect an 8-point lift, so the study was small for its own target. Plan the sample size before the test, not after.</p>":"<p>Con 600 por grupo, la potencia es del 79.8%. Con 650 es del 82.9%. La respuesta exacta es de unos 604 por grupo.</p>\n          <p>Los 400 por grupo de CedarCart daban solo alrededor del 63% de potencia para detectar un aumento de 8 puntos, así que el estudio era pequeño para su propia meta. Planifica el tamaño de muestra antes de la prueba, no después.</p>","A survey against a goal":"Una encuesta frente a una meta","Separately, 16 B users rated their satisfaction on a 0 to 100 index. The team goal is 70 points. Only B users took this survey.":"Por separado, 16 usuarios de B calificaron su satisfacción en un índice de 0 a 100. La meta del equipo es 70 puntos. Solo los usuarios de B respondieron esta encuesta.","Fill in the one-sample t-test.":"Completa la prueba t para una muestra.","<p>SE measures how much the sample mean would move from one sample to the next. t counts how many SEs the mean sits from the goal.</p>\n          <p>Here the mean is just one SE above 70, with df = n − 1 = 15. In Excel: <code>=(AVERAGE(L2:L17)-70)/(STDEV.S(L2:L17)/SQRT(COUNT(L2:L17)))</code>.</p>":"<p>El SE mide cuánto cambiaría la media muestral de una muestra a otra. t cuenta a cuántos SE está la media de la meta.</p>\n          <p>Aquí la media está solo un SE por encima de 70, con df = n − 1 = 15. En Excel: <code>=(AVERAGE(L2:L17)-70)/(STDEV.S(L2:L17)/SQRT(COUNT(L2:L17)))</code>.</p>","SE = s / √n = 8 / √16 = {{se}} points":"SE = s / √n = 8 / √16 = {{se}} puntos","t = (x̄ − 70) / SE = (72 − 70) / SE = {{t}}":"t = (x̄ − 70) / SE = (72 − 70) / SE = {{t}}","√16 = 4, so SE = 8 ÷ 4.":"√16 = 4, así que SE = 8 ÷ 4.","Standard error":"Error estándar","Subtract the goal from the mean, then divide by SE: 2 ÷ 2.":"Resta la meta a la media y luego divide entre SE: 2 ÷ 2.","t statistic":"Estadístico t","t = 1.00, df = 15":"t = 1.00, df = 15","Read the t-table":"Lee la tabla t","No software in the exam room? A printed t-table gives the same cut-offs. Each row is a df. Each column is the total tail area.":"¿No hay software en el salón del examen? Una tabla t impresa da los mismos valores críticos. Cada fila es un valor de grados de libertad (df). Cada columna es el área total de las colas.","Find the critical t for the survey test: df = 15, two-sided α = 0.05. Tap that cell.":"Encuentra el valor crítico de t para la prueba de la encuesta: df = 15, α bilateral = 0.05. Toca esa celda.","<p>Row 15, column 0.05 gives t* = 2.131, the cut-off that leaves 2.5% in each tail. In Excel: <code>=T.INV.2T(0.05, 15)</code>.</p>\n          <p>It is the same 2.131 in the survey's 95% interval, 72 ± 2.131 × 2. The survey's t = 1.00 sits well inside ±2.131, so the test fails to reject H₀.</p>":"<p>La fila 15, columna 0.05, da t* = 2.131, el valor crítico que deja 2.5% en cada cola. En Excel: <code>=T.INV.2T(0.05, 15)</code>.</p>\n          <p>Es el mismo 2.131 del intervalo del 95% de la encuesta, 72 ± 2.131 × 2. El t = 1.00 de la encuesta queda muy dentro de ±2.131, así que la prueba no rechaza H₀.</p>","Trap the p-value":"Acorrala el valor p","A table cannot give the exact p-value, but it can trap it between two columns. The survey gave t = 1.00 with df = 15.":"Una tabla no puede darte el valor p exacto, pero sí puede acorralarlo entre dos columnas. La encuesta dio t = 1.00 con df = 15.","Read along the df = 15 row. Where does t = 1.00 fall, and what does that say about p?":"Recorre la fila de df = 15. ¿Dónde cae t = 1.00 y qué te dice eso sobre p?","<p>Every cut-off on row 15 is bigger than 1.00, even the 0.20 column (1.341), so the two-tailed p-value is bigger than 0.20. Excel gives the exact value, <code>=T.DIST.2T(1, 15)</code> ≈ 0.333, which agrees.</p>\n          <p>Moving right along a row, cut-offs grow and tail areas shrink. A bigger |t| always means a smaller p.</p>":"<p>Todos los valores críticos de la fila 15 son mayores que 1.00, incluso el de la columna 0.20 (1.341), así que el valor p de dos colas es mayor que 0.20. Excel da el valor exacto, <code>=T.DIST.2T(1, 15)</code> ≈ 0.333, que coincide.</p>\n          <p>Al avanzar hacia la derecha en una fila, los valores críticos crecen y las áreas de las colas se reducen. Un |t| más grande siempre significa un p más pequeño.</p>","p > 0.20, because 1.00 is smaller than 1.341, the smallest cut-off in the row":"p > 0.20, porque 1.00 es menor que 1.341, el valor crítico más pequeño de la fila","p is between 0.05 and 0.10":"p está entre 0.05 y 0.10","That needs |t| between 1.753 and 2.131. A t of 1.00 is far smaller.":"Para eso se necesita un |t| entre 1.753 y 2.131. Un t de 1.00 es mucho menor.","p < 0.05, because t is positive":"p < 0.05, porque t es positivo","The sign does not matter in a two-sided test. Compare |t| with the cut-offs: 1.00 is below all of them.":"En una prueba bilateral, el signo no importa. Compara |t| con los valores críticos: 1.00 está por debajo de todos.","What does p ≈ 0.333 allow you to say?":"¿Qué te permite decir p ≈ 0.333?","Excel returns =T.DIST.2T(1, 15) ≈ 0.333. Your α is 0.05.":"Excel devuelve =T.DIST.2T(1, 15) ≈ 0.333. Tu α es 0.05.","What can CedarCart honestly say about satisfaction?":"¿Qué puede decir CedarCart con honestidad sobre la satisfacción?","<p>p ≈ 0.333 is far above 0.05, so we fail to reject. The 95% interval, 72 ± 2.131 × 2 = 67.74 to 76.26 points, includes 70.</p>\n          <p>That means \"not shown to differ\", never \"equal\". Also ask who answered: if unhappy users skipped the survey, no formula can fix that bias.</p>":"<p>p ≈ 0.333 está muy por encima de 0.05, así que no rechazamos la hipótesis nula. El intervalo del 95%, 72 ± 2.131 × 2 = 67.74 a 76.26 puntos, incluye 70.</p>\n          <p>Eso significa \"no se demostró que sea diferente\", nunca \"igual\". Pregúntate también quién respondió: si los usuarios insatisfechos no respondieron la encuesta, ninguna fórmula puede corregir ese sesgo.</p>","Fail to reject H₀. This sample does not show the mean differs from 70.":"No rechazar H₀. Esta muestra no demuestra que la media sea diferente de 70.","Satisfaction equals 70, so the goal is exactly met.":"La satisfacción es igual a 70, así que la meta se cumple exactamente.","Failing to reject is not proof of equality. A small sample can miss a real gap.":"No rechazar no es prueba de igualdad. Una muestra pequeña puede pasar por alto una diferencia real.","Reject H₀. The mean of 72 beats the goal of 70.":"Rechazar H₀. La media de 72 supera la meta de 70.","72 is above 70 in this sample, but p ≈ 0.33 means a gap this size is common by chance with 16 people.":"72 está por encima de 70 en esta muestra, pero p ≈ 0.33 significa que una diferencia de este tamaño es común por azar con 16 personas.","B users are more satisfied than A users.":"Los usuarios de B están más satisfechos que los de A.","Only B users took this survey. There is no A group to compare with.":"Solo los usuarios de B respondieron esta encuesta. No hay un grupo A con el cual comparar.","t = 1.00, df 15, p ≈ 0.333: not shown to differ":"t = 1.00, df 15, p ≈ 0.333: no se demostró diferencia","Same gap, more people":"Misma diferencia, más personas","Keep the same 2-point gap and the same spread, s = 8. Only the number of respondents changes.":"Mantén la misma diferencia de 2 puntos y la misma dispersión, s = 8. Solo cambia el número de encuestados.","Drag n along the curve. What is the smallest sample that makes the same 2-point gap significant at 0.05?":"Arrastra n a lo largo de la curva. ¿Cuál es la muestra más pequeña con la que la misma diferencia de 2 puntos es significativa al 0.05?","<p>At n = 64, SE = 8 / √64 = 1 and t = 2.00 with df = 63, so p ≈ 0.0498. At n = 63, p ≈ 0.052.</p>\n          <p>The gap never changed; only the precision did. So \"not significant\" at n = 16 never meant \"no difference\".</p>":"<p>Con n = 64, SE = 8 / √64 = 1 y t = 2.00 con df = 63, así que p ≈ 0.0498. Con n = 63, p ≈ 0.052.</p>\n          <p>La diferencia nunca cambió; solo cambió la precisión. Po

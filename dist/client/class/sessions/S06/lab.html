th a satisfaction score = {{n}}":"usuarios con puntuación de satisfacción = {{n}}","Filter satisfaction to (blank): that shows 784 rows. 800 − 784 = 16.":"Filtra satisfaction por (blank): eso muestra 784 filas. 800 − 784 = 16.","Users with a score":"Usuarios con puntuación","Checkpoint A: your yellow cells":"Punto de control A: tus celdas amarillas","In <code>IN-CLASS_Lab Part A</code>, B7 holds n = 16, B8 the mean 72, C7 the spread s = 8 and D7 the goal 70.":"En <code>IN-CLASS_Lab Part A</code>, B7 contiene n = 16, B8 la media 72, C7 la dispersión s = 8 y D7 la meta 70.","Type what your workbook shows in B9 to B12.":"Escribe lo que muestra tu libro de trabajo en B9 a B12.","<p>SE = 8/√16 = 2, t = (72 − 70)/2 = 1.000, df = 15, and the two-sided p = 0.333. SPSS H1 shows the same t, df and two-tailed significance.</p>":"<p>SE = 8/√16 = 2, t = (72 − 70)/2 = 1.000, df = 15, y el valor p bilateral = 0.333. SPSS H1 muestra el mismo t, los mismos df y la misma significancia de dos colas.</p>","B9   SE = {{se}}":"B9   SE = {{se}}","B10  t = {{t}}":"B10  t = {{t}}","B11  p = {{p}}":"B11  p = {{p}}","B12  df = {{df}}":"B12  df = {{df}}","B9 = C7 / SQRT(B7) = 8 / 4 = 2. If you see 0.5, you divided by n instead of √n.":"B9 = C7 / SQRT(B7) = 8 / 4 = 2. Si ves 0.5, dividiste entre n en lugar de √n.","B9 standard error":"B9 error estándar","B10 = (B8 − D7) / B9 = (72 − 70) / 2.":"B10 = (B8 − D7) / B9 = (72 − 70) / 2.","B10 t statistic":"B10 estadístico t","B11 = T.DIST.2T(ABS(B10), B12). If you see 0.167, you used a one-tailed function.":"B11 = T.DIST.2T(ABS(B10), B12). Si ves 0.167, usaste una función de una cola.","B11 p-value":"B11 valor p","B12 = B7 − 1 = 15.":"B12 = B7 − 1 = 15.","B12 degrees of freedom":"B12 grados de libertad","t = 1.000, df 15, p = 0.333":"t = 1.000, df 15, p = 0.333","What goes in B13?":"¿Qué va en B13?","Your p-value in B11 is 0.333 and α is 0.05.":"Tu valor p en B11 es 0.333 y α es 0.05.","Which decision belongs in B13?":"¿Qué decisión va en B13?","<p>B  porque el intervalo es amplio","The interval excludes 0 and p = 0.0045, so a difference is shown. Width is a separate question.":"El intervalo excluye el 0 y p = 0.0045, así que sí se demuestra una diferencia. El ancho es otra cuestión.","Checkpoint C: complaint rates":"Punto de control C: tasas de quejas","In <code>IN-CLASS_Lab Part C</code>, C7 and D7 hold the complaint counts, B12 the limit 0.01.":"En <code>IN-CLASS_Lab Part C</code>, C7 y D7 contienen los conteos de quejas, y B12 el límite 0.01.","Type what your workbook shows in B9 to B11, as shares.":"Escribe lo que muestra tu libro de trabajo en B9 a B11, como proporciones.","<p>Complaints rise from 0.02 to 0.08, a gap of 0.06 (6 points), six times the 0.01 limit in B12.</p>":"<p>Las quejas suben de 0.02 a 0.08, una diferencia de 0.06 (6 puntos), seis veces el límite de 0.01 de B12.</p>","B9   rₐ = {{ra}}":"B9   rₐ = {{ra}}","B10  r_B = {{rb}}":"B10  r_B = {{rb}}","B11  Δc = {{dc}}":"B11  Δc = {{dc}}","B9 = C7 / B7 = 8 / 400. Filter group = A and complaint = 1 to count them.":"B9 = C7 / B7 = 8 / 400. Filtra group = A y complaint = 1 para contarlas.","B9 complaint rate A":"B9 tasa de quejas A","B10 = D7 / B8 = 32 / 400.":"B10 = D7 / B8 = 32 / 400.","B10 complaint rate B":"B10 tasa de quejas B","B11 = B10 − B9. As a share that is 0.06, which is 6 percentage points.":"B11 = B10 − B9. Como proporción es 0.06, es decir, 6 puntos porcentuales.","B11 complaint gap":"B11 diferencia en quejas","+0.06 vs limit 0.01: breaks the guardrail":"+0.06 frente al límite de 0.01: incumple la salvaguarda","Checkpoint C: net impact":"Punto de control C: impacto neto","Margin $12 per extra purchase, rollout $0.60 per B user, $25 per excess complaint.":"Margen de $12 por compra adicional, costo de lanzamiento de $0.60 por usuario de B, $25 por queja adicional.","Type what your workbook shows in B13.":"Escribe lo que muestra tu libro de trabajo en B13.","<p>V = 40 × $12 − 400 × $0.60 − 24 × $25 = $480 − $240 − $600 = −$360.</p>":"<p           z: { accept: St.accept.near(2.843, 0.004), answer: 2.843, width: 6, label: 'B11 z statistic', hint: 'If you see 2.857, you divided by the unpooled SE (0.035). The test uses the pooled SE₀ in B10.' },
          p: { accept: St.accept.near(0.0045, 0.0002), answer: 0.0045, width: 7, label: 'B12 p-value', hint: 'B12 = 2 * (1 − NORM.S.DIST(ABS(B11), TRUE)). If you see 0.0022, you used one tail.' },
        },
        why: '<p>p̂₀ = 0.45, SE₀ ≈ 0.0352, z ≈ 2.843 and p ≈ 0.0045. SPSS H2 shows an uncorrected Pearson χ² of 8.081, which is 2.843².</p>',
        ledger: { id: 'b', value: 'z = 2.843, p = 0.0045' },
      },
      {
        id: 'b-interval', part: 2, type: 'blanks', refs: ['3.1'],
        title: 'Checkpoint B: the interval',
        scene: 'The supplied unpooled SE<sub>Δ</sub> is 0.035. The observed gap Δ in B16 is 0.10.',
        prompt: 'Type your 95% bounds from B14 and B15, as shares.',
        lines: ['B14  lower = {{lo}}', 'B15  upper = {{hi}}'],
        blanks: {
          lo: { accept: St.accept.rate(0.0314, 0.0006), answer: 0.0314, width: 7, label: 'B14 lower bound', hint: 'B14 = B16 − 1.96 * SEΔ = 0.10 − 1.96 × 0.035.' },
          hi: { accept: St.accept.rate(0.1686, 0.0006), answer: 0.1686, width: 7, label: 'B15 upper bound', hint: 'B15 = B16 + 1.96 * SEΔ = 0.10 + 1.96 × 0.035.' },
        },
        why: '<p>The interval runs from 0.0314 to 0.1686, or +3.14 to +16.86 percentage points. Its low end is below the 8-point hurdle, so B18 should say the hurdle is not established.</p>',
        ledger: { id: 'ci', value: '0.0314 to 0.1686' },
      },
      {
        id: 'b-hurdle', part: 2, type: 'choice', refs: ['3.1', '4.1'],
        title: 'What goes in B18?',
        scene: 'Your p-value is 0.0045 and your interval is 0.0314 to 0.1686. The business hurdle is 0.08.',
        prompt: 'Which statement belongs in B18?',
        options: [
          { t: 'A difference is shown, but the interval does not establish the 0.08 hurdle', ok: true },
          { t: 'The hurdle is met because the observed gap of 0.10 is above 0.08', hint: 'The gap is one estimate. The interval says the true gap could be as low as 0.0314.' },
          { t: 'No difference is shown because the interval is wide', hint: 'The interval excludes 0 and p = 0.0045, so a difference is shown. Width is a separate question.' },
        ],
        why: '<p>Two separate claims: the test shows a difference from zero; the interval shows that gains below 8 points are still plausible.</p>',
      },

      /* Part C */
      {
        id: 'c-rates', part: 3, type: 'blanks', refs: ['4.1'],
        title: 'Checkpoint C: complaint rates',
        scene: 'In <code>IN-CLASS_Lab Part C</code>, C7 and D7 hold the complaint counts, B12 the limit 0.01.',
        figure: (el, a) => { dataExplorer(el, a); },
        prompt: 'Type what your workbook shows in B9 to B11, as shares.',
        lines: ['B9   rₐ = {{ra}}', 'B10  r_B = {{rb}}', 'B11  Δc = {{dc}}'],
        blanks: {
          ra: { accept: St.accept.rate(0.02, 0.0005), answer: 0.02, show: '0.02', width: 6, label: 'B9 complaint rate A', hint: 'B9 = C7 / B7 = 8 / 400. Filter group = A and complaint = 1 to count them.' },
          rb: { accept: St.accept.rate(0.08, 0.0005), answer: 0.08, show: '0.08', width: 6, label: 'B10 complaint rate B', hint: 'B10 = D7 / B8 = 32 / 400.' },
          dc: { accept: St.accept.rate(0.06, 0.0005), answer: 0.06, show: '0.06', width: 6, label: 'B11 complaint gap', hint: 'B11 = B10 − B9. As a share that is 0.06, which is 6 percentage points.' },
        },
        why: '<p>Complaints rise from 0.02 to 0.08, a gap of 0.06 (6 points), six times the 0.01 limit in B12.</p>',
        ledger: { id: 'c', value: '+0.06 vs limit 0.01: breaks the guardrail' },
      },
      {
        id: 'c-net', part: 3, type: 'blanks', refs: ['4.1'],
        title: 'Checkpoint C: net impact',
        scene: 'Margin $12 per extra purchase, rollout $0.60 per B user, $25 per excess complaint.',
        prompt: 'Type what your workbook shows in B13.',
        lines: ['B13  V = $ {{v}}'],
        blanks: { v: { accept: St.accept.near(-360, 0.5), answer: -360, show: '−360', width: 7, label: 'B13 net impact in dollars', hint: 'V = (200 − 160) × 12 − 400 × 0.60 − (32 − 8) × 25. If you see +240, you left out the complaint cost; if you see −120, check the rollout cost.' } },
        why: '<p>V = 40 × $12 − 400 × $0.60 − 24 × $25 = $480 − $240 − $600 = −$360.</p>',
        ledger: { id: 'v', value: '−$360' },
      },
      {
        id: 'c-decision', part: 3, type: 'choice', refs: ['4.1'],
        title: 'Your provisional sentence for B15',
        scene: 'You now have all three pieces: purchase evidence, the complaint guardrail and the economics.',
        prompt: 'Which sentence is the best starting point for B15? Then write it in your own words.',
        options: [
          { t: 'Hold B: purchases rose, but complaints broke the limit and net impact is −$360', ok: true },
          { t: 'Launch B: the purchase increase is statistically significant', hint: 'One p-value cannot carry the decision. The guardrail and the economics both fail.' },
          { t: 'Launch B to half of users while complaints are studied', hint: 'Half a launch still exposes users to a 6-point complaint jump that broke the agreed limit.' },
        ],
        why: '<p>B15 needs the decision, the purchase and complaint evidence with net impact, and one limit on what the experiment shows. Write it in your own words; the lab is practice, so there is no answer to copy.</p>',
        ledger: { id: 'd', value: 'Hold B; revise and retest' },
      },
      {
        id: 'takehome', part: 3, type: 'read', refs: ['5.1'],
        title: 'Take-home: audit your decision',
        callout: 'Your checkpoints are saved. At home, spend 15 minutes on <code>Part C!B15</code>: two reasons, three captions, and a three-sentence decision.',
        body: [
          'Part A: compare B10 and B11 with SPSS H1, and check that B14 does not turn 16 respondents into a claim about all 800 users.',
          'Part B: compare your z with H2’s uncorrected Pearson row (z² = χ²), and explain the interval-versus-hurdle comparison in B19.',
          'Part C: caption H3 in B19 and revise B15 in your own words. Change an explanation that does not match its evidence; keep a sound decision.',
        ],
      },
    ],
    onFinish(S, a) {
      K.confetti();
      K.sheet(K.tr('Lab checkpoints complete'), [a.h('p', null, K.tr('Your checkpoint answers are saved. Finish the take-home audit in your workbook.'))]);
    },
  });
})();

    els.secondary = h('button', { type: 'button', class: 'lk-btn ghost', hidden: true });
    els.primary = h('button', { type: 'button', class: 'lk-btn' });
    els.card = h('section', { class: 'lk-card', 'aria-label': strip(tr(L.title)) }, els.head, els.body,
      h('div', { class: 'lk-foot' }, els.bubble, h('div', { class: 'lk-actions' }, els.secondary, els.primary)));
    els.rail = h('aside', { class: 'lk-rail', 'aria-label': ui('caseFile') });
    root.append(h('div', { class: 'lk-app' }, top, h('main', { class: 'lk-stage' }, els.card, els.rail)));
    if (!els.keyBound) { document.addEventListener('keydown', onKey); els.keyBound = true; }
    rail();
    renderPill();
  }

  function onKey(e) {
    if (e.key === 'Escape' && els.sheet) { closeSheet(); return; }
    if (e.key !== 'Enter' || els.sheet) return;
    const t = e.target;
    if (t.closest && t.closest('button, a, textarea, select, [role="slider"], [role="button"]')) return;
    if (t.tagName === 'INPUT' && t.type !== 'text') return;
    if (!els.primary.disabled && !els.primary.hidden) { e.preventDefault(); els.primary.click(); }
  }

  function go(i, initial, keep) {
    i = clamp(i, 0, L.screens.length - 1);
    const dir = cur && i < cur.sc._i ? 'back' : 'fwd';
    S.i = i; save({ nav: true });
    const sc = L.screens[i];
    const a = api(sc);
    els.head.replaceChildren(...[
      h('button', { type: 'button', class: 'lk-back', disabled: i === 0, onclick: () => go(i - 1) }, ui('back')),
      h('span', null, strip(tr(L.parts[sc.part]))),
      h('span', { class: 'lk-tier', 'data-tier': sc.tier }, sc.tier),
      LANG !== 'en' ? h('span', { class: 'lk-ai' }, ui('aiNote')) : null,
      h('span', { class: 'lk-count' }, `${i + 1} / ${L.screens.length}`)].filter(Boolean));
    const col = h('div', { class: `lk-col${initial ? '' : ` enter-${dir}`}`, tabindex: -1 });
    els.body.replaceChildren(col);
    if (sc.title) col.append(h('h2', null, ...said(sc.title)));
    if (sc.refs && L.toolkit) col.append(h('div', { class: 'lk-refs' }, sc.refs.map((r) => refChip(r, i))));
    if (sc.art) col.append(h('div', { class: 'lk-art', html: sc.art }));
    if (sc.scene) col.append(h('div', { class: 'lk-scene', 'data-label': ui('scene') }, h('p', null, ...said(sc.scene))));
    for (const p of [].concat(sc.body || [])) col.append(h('p', null, ...said(p)));
    if (sc.callout) col.append(h('div', { class: 'lk-callout' }, ...said(sc.callout)));
    let fig = null;
    if (sc.figure) { const fe = h('div', { class: 'lk-figure' }); col.append(fe); fig = sc.figure(fe, a) || null; }
    if (sc.prompt) col.append(h('p', { class: 'lk-prompt' }, ...said(sc.prompt)));
    const q = h('div', { class: 'lk-q' });
    col.append(q);
    for (const p of [].concat(sc.after || [])) col.append(h('p', { class: 'lk-caption' }, ...said(p)));

    let ctrl = null;
    if (sc.type === 'choice') ctrl = choiceWidget(q, sc, a);
    else if (sc.type === 'tiles') ctrl = tilesWidget(q, sc, a);
    else if (sc.type === 'blanks') ctrl = blanksWidget(q, sc, a);
    else if (sc.type === 'custom') ctrl = sc.render(q, a, fig);
    else if (sc.type === 'poll') ctrl = pollWidget(q, sc, a);
    cur = { sc, ctrl, q, fig, mode: null, api: a };
    if (EMBED) post({ type: 'lk:screen', i, id: sc.id, title: strip(tr(sc.title || '')), refs: sc.refs || [], part: sc.part, tier: sc.tier, done: !!S.res[sc.id] });

    bubble(null);
    if (graded(sc) && S.res[sc.id]) { ctrl.reveal(); lock(); setMode('done'); }
    else if (sc.type === 'poll') {
      if (S.polls[sc.id] != null) { ctrl.mark(S.polls[sc.id]); const o = sc.options[S.polls[sc.id]]; bubble(said(o.reply || sc.reply || ui('noted')), 'neutral'); setMode('read', { keepBubble: true }); }
      else setMode('poll');
    } else {
      setMode(graded(sc) ? 'idle' : 'read');
      if (keep !== undefined && ctrl?.restore) { ctrl.restore(keep); refreshPrimary(); }
    }
    progress();
    rail();
    if (!initial) {
      col.focus({ preventScroll: true });
      els.card.scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' });
    }
  }

  function lock() { cur.q.inert = true; cur.q.classList.add('locked'); }

  // Accepts an English lesson string (translated here), a list of nodes, or null to hide.
  function bubble(content, tone) {
    if (!content) { els.bubble.hidden = true; els.bubble.replaceChildren(); return; }
    els.bubble.hidden = false;
    els.bubble.dataset.tone = tone || 'neutral';
    els.bubble.replaceChildren(...(Array.isArray(content) ? content : rich(content)));
    restart(els.bubble, 'pop-in');
  }

  function btn(el, label, fn, tone, disabled) {
    if (!label) { el.hidden = true; el.onclick = null; return; }
    el.hidden = false;
    el.textContent = label;
    el.onclick = fn;
    el.disabled = !!disabled;
    if (tone) el.dataset.tone = tone; else el.removeAttribute('data-tone');
  }

  function refreshPrimary() { if (cur.mode === 'idle') els.primary.disabled = !(cur.ctrl && cur.ctrl.ready()); }

  function setMode(m, info = {}) {
    cur.mode = m;
    const sc = cur.sc;
    els.card.dataset.state = m === 'ok' ? 'ok' : m === 'warn' ? 'warn' : 'idle';
    const last = sc._i === L.screens.length - 1;
    const nextLabel = last ? (L.finishLabel ? tr(L.finishLabel) : ui('finish')) : ui('continue');
    const why = sc.why ? ui('why') : null;
    if (!info.keepBubble && !['ok', 'warn', 'revealed'].includes(m)) bubble(null);
    switch (m) {
      case 'read': btn(els.primary, nextLabel, next); btn(els.secondary, null); break;
      case 'poll': btn(els.primary, ui('continue'), null, null, true); btn(els.secondary, null); break;
      case 'idle': btn(els.primary, ui('check'), check, null, !cur.ctrl.ready()); btn(els.secondary, null); break;
      case 'ok': bubble(info.nodes, 'ok'); btn(els.primary, nextLabel, next, 'ok'); btn(els.secondary, why, openWhy); break;
      case 'warn': bubble(info.nodes, 'warn'); btn(els.primary, ui('tryAgain'), tryAgain, 'warn'); btn(els.secondary, ui('seeAnswer'), seeAnswer); break;
      case 'revealed': bubble(ui('revealed'), 'neutral'); btn(els.primary, sc.why ? ui('why') : nextLabel, sc.why ? openWhy : next); btn(els.secondary, sc.why ? ui('skipWhy') : null, next); break;
      case 'done': btn(els.primary, nextLabel, next); btn(els.secondary, why, openWhy); break;
    }
  }

  function award(kind) {
    const sc = cur.sc;
    const partDone = () => L.screens.filter((x) => x.part === sc.part && graded(x)).every((x) => S.res[x.id]);
    const wasDone = partDone();
    S.res[sc.id] = kind;
    const gained = kind === 'first' ? 10 : kind === 'retry' ? 5 : 0;
    S.pts += gained;
    if (sc.ledger) S.ledger[sc.ledger.id] = typeof sc.ledger.value === 'function' ? sc.ledger.value(S) : sc.ledger.value;
    save(); progress(); rail();
    floatPoints(gained);
    if (!wasDone && partDone()) setTimeout(() => toast(`<b>✓</b> ${ui('partDone', { n: sc.part + 1, name: strip(tr(L.parts[sc.part])) })}`), 450);
    return gained;
  }

  function check() {
    const sc = cur.sc;
    const r = cur.ctrl.check();
    if (r.ok) {
      syncEvent('correct', { first: !S.tries[sc.id], tries: (S.tries[sc.id] || 0) + 1 });
      award(S.tries[sc.id] ? 'retry' : 'first');
      lock();
      let praise = r.praise || sc.praise;
      if (typeof praise === 'function') praise = praise(S);
      const praiseList = ui('praise');
      setMode('ok', { nodes: praise ? said(praise) : rich(praiseList[sc._i % praiseList.length]) });
      burst(els.primary);
    } else {
      S.tries[sc.id] = (S.tries[sc.id] || 0) + 1;
      syncEvent('wrong', { tries: S.tries[sc.id], hint: r.hint ? strip(r.hint).slice(0, 160) : '' });
      save();
      setMode('warn', { nodes: r.hint ? said(r.hint) : rich(r.uiHint || ui('notQuite')) });
      if (!reduced()) restart(cur.q, 'shake');
    }
  }
  function tryAgain() { cur.ctrl.reset?.(); setMode('idle'); cur.ctrl.focus?.(); }
  function seeAnswer() { syncEvent('revealed', {}); cur.ctrl.reveal(); award('revealed'); lock(); setMode('revealed'); }
  function next() {
    const i = cur.sc._i;
    if (i < L.screens.length - 1) go(i + 1);
    else { syncEvent('finish', { points: S.pts }); if (L.onFinish) L.onFinish(S, api(cur.sc)); }
    syncNow();
  }

  function progress() {
    els.pts.querySelector('.n').textContent = S.pts;
    L.parts.forEach((p, pi) => {
      const list = L.screens.filter((sc) => sc.part === pi);
      const done = list.filter((sc) => (graded(sc) ? S.res[sc.id] : sc._i < S.i || (sc.type === 'poll' && S.polls[sc.id] != null))).length;
      els.segs[pi].querySelector('i').style.width = `${Math.round(100 * done / list.length)}%`;
      if (cur && cur.sc.part === pi) els.segs[pi].setAttribute('aria-current', 'step'); else els.segs[pi].removeAttribute('aria-current');
    });
  }

  function railContent() {
    const cf = L.caseFile || {};
    const panels = [];
    if (cf.title) {
      const p = h('section', { class: 'lk-panel' }, h('h3', null, strip(tr(cf.title))));
      for (const line of [].concat(cf.intro || [])) p.append(h('p', null, ...rich(tr(line))));
      if (cf.table) {
        p.append(h('table', { class: 'lk-facts' },
          h('thead', null, h('tr', null, cf.table.head.map((c) => h('th', null, ...rich(tr(c)))))),
          h('tbody', null, cf.table.rows.map((r) => h('tr', null, r.map((c) => h('td', null, ...rich(tr(c)))))))));
      }
      if (cf.notes) p.append(h('ul', { class: 'lk-notes' }, cf.notes.map((n) => h('li', null, ...rich(tr(n))))));
      panels.push(p);
    }
    if (L.ledger) {
      panels.push(h('section', { class: 'lk-panel' }, h('h3', null, strip(tr(L.ledgerTitle || 'Evidence so far'))),
        h('ul', { class: 'lk-ledger' }, L.ledger.map((it) => {
          const v = S.ledger[it.id];
          return h('li', null, h('span', { class: 'k' }, ...rich(tr(it.label))), h('span', { class: 'v' + (v ? '' : ' pending') }, ...rich(v ? tr(v) : (it.pending ? tr(it.pending) : ui('notYet')))));
        }))));
    }
    const gradedList = L.screens.filter(graded);
    const firsts = gradedList.filter((sc) => S.res[sc.id] === 'first').length;
    const done = gradedList.filter((sc) => S.res[sc.id]).length;
    const restartBtn = h('button', { type: 'button', class: 'lk-restart' }, ui('restart'));
    restartBtn.addEventListener('click', () => {
      if (restartBtn.dataset.armed) { S = fresh(); Sync.reset = true; save(); closeSheet(); shell(); go(0); }
      else { restartBtn.dataset.armed = '1'; restartBtn.textContent = ui('restartConfirm'); }
    });
    panels.push(h('section', { class: 'lk-panel' }, h('h3', null, ui('progressTitle')),
      h('p', null, ui('progressLine', { done, total: gradedList.length, first: firsts })), restartBtn));
    return panels;
  }
  function rail() { if (els.rail) els.rail.replaceChildren(...railContent()); }

  function sheet(title, nodes, onClose, opts = {}) {
    closeSheet();
    const x = h('button', { type: 'button', class: 'x', 'aria-label': ui('close') }, '×');
    const card = h('div', { class: 'lk-sheet-card' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': strip(title) },
      h('header', null, h('h3', null, ...rich(title)), x), h('div', { class: 'lk-sheet-body' }, nodes));
    const wrap = h('div', { class: 'lk-sheet' }, card);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) closeSheet(); });
    x.addEventListener('click', closeSheet);
    els.sheet = wrap;
    els.sheetClose = onClose;
    els.sheetReturn = document.activeElement;
    document.body.append(wrap);
    x.focus();
  }
  function closeSheet() {
    if (!els.sheet) return;
    els.sheet.remove();
    els.sheet = null;
    const cb = els.sheetClose; els.sheetClose = null;
    if (cb) cb();
    els.sheetReturn?.focus?.({ preventScroll: true });
  }
  function openWhy() {
    const sc = cur.sc;
    const en = typeof sc.why === 'function' ? sc.why(S) : sc.why;
    const t = tr(en);
    const nodes = rich(t);
    if (LANG !== 'en' && SHOW_EN && t !== en) nodes.push(h('details', { class: 'lk-en-block', lang: 'en' }, h('summary', null, ui('english')), ...rich(en)));
    if (sc.refs && L.toolkit) nodes.push(h('div', { class: 'lk-why-more' }, ui('readMore'), sc.refs.map((r) => refChip(r, sc._i))));
    sheet(ui('whyTitle'), nodes, () => { if (cur.mode === 'revealed') setMode('done'); });
  }
  function openCase() {
    const r = h('div', { class: 'lk-rail' }, railContent());
    sheet(strip(tr(L.caseFile?.title)) || ui('caseFile'), [r]);
  }

  globalThis.LessonKit = { define, h, s, rich, strip, tr, ui, Stats, Charts, slider, readout, chip, lookup, explorer, accept, sheet, toast, confetti, burst, openToolkit };
})();

</script>
<script>
globalThis.LESSON_TOOLKIT = {"title":"Hypothesis tests, effects, practical significance, A/B guardrails","sections":[{"id":"how-to-use-this-toolkit","level":2,"title":"How to use this toolkit","short":"How to use this toolkit","html":"<p>Read Sections 1–4 in order, then use Section 5 to reproduce and communicate the analysis. The <b>core</b> is hypothesis-test logic, a one-mean test, a two-group A/B comparison, effect size, practical significance, and guardrails. The <b>optional bridge</b> is experimental-design vocabulary, multiple comparisons, and Bayes-factor reporting. ANOVA and regression calculations belong to later work, not this session.</p>\n<p>The course has <b>no required textbook</b>. The Albright and Winston and Field headings in the outline coverage table are <i>scope cues</i>, not a claim that those chapters have been assigned or read. This chapter is an original synthesis grounded in the open and primary sources actually cited below. It has no stable PDF page numbers: use its numbered section headings for future slide or PNP cross-references after pagination.</p>\n<p>You need S05’s distinction between a sample estimate and uncertainty around a population value. Keep four statements separate throughout: <b>observation</b> (what these users did), <b>inference</b> (what a model supports beyond them), <b>assumption</b> (what that inference needs), and <b>recommendation</b> (what to do).</p>"},{"id":"case","level":3,"title":"The single running case: fictional CedarCart","short":"Case: fictional CedarCart","html":"<p><b>CedarCart is entirely fictional.</b> It sells household supplies through an app. Its product manager must decide whether to replace the standard checkout screen (<b>A</b>) with a shorter screen (<b>B</b>) for eligible U.S. app users. Each eligible user is randomly assigned once to A or B. The planned analysis uses one row per assigned user, whether or not that user buys. A purchase and a checkout-related complaint are each measured within seven days of assignment.</p>\n<div class=\"tbl\"><table><thead><tr><th>Decision input</th><th>A: standard</th><th>B: shorter</th><th>Definition or proposed rule</th></tr></thead><tbody><tr><td>Assigned users</td><td>400</td><td>400</td><td>Population of interest: comparable eligible U.S. app users in a future rollout; these 800 are the experiment sample.</td></tr><tr><td>Users purchasing</td><td>160</td><td>200</td><td>Primary KPI: purchasers ÷ assigned users. Target: an uplift of at least <b>8 percentage points</b>.</td></tr><tr><td>Users with a complaint</td><td>8</td><td>32</td><td>Guardrail: complaint-rate increase must be no more than <b>1 percentage point</b>.</td></tr><tr><td>Illustrative margin assumption</td><td>—</td><td>$12 per additional purchase</td><td>An assumption for a rough decision calculation, not an observed profit estimate.</td></tr><tr><td>Illustrative rollout cost</td><td>—</td><td>$0.60 per exposed user</td><td>Assumed incremental screen and operating cost.</td></tr><tr><td>Illustrative complaint cost</td><td>—</td><td>$25 per additional complaint</td><td>Assumed support cost; it excludes reputational harm.</td></tr><tr><td>Separate B-user survey</td><td>—</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>16</mn><mo separator=\"true\">,</mo><mtext> </mtext><mover accent=\"true\"><mi>x</mi><mo>ˉ</mo></mover><mo>=</mo><mn>72</mn><mo separator=\"true\">,</mo><mtext> </mtext><mi>s</mi><mo>=</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">n=16,\\ \\bar x=72,\\ s=8</annotation></semantics></math></span></td><td>Satisfaction index, 0–100 points; compare with a fixed goal of 70. This is <b>not</b> a second randomized A/B outcome for all 800 users.</td></tr></tbody></table></div>\n<p>The underlying file would require a unique, privacy-protected <code>user_id</code>, assigned variant, assignment timestamp, eligibility flag, seven-day observation-complete flag, purchase indicator, and complaint indicator. The table gives marginal totals, not individual records or the overlap between purchasers and complainants. Before inference, confirm one assignment per user, consistent time windows, no missing outcomes mistaken for zeroes, and that the assignment and recorded group counts match. Even good randomization does not make these 800 users representative of every country, season, or customer type. (Microsoft Research, 2021; The Pennsylvania State University, n.d.-a).</p>"},{"id":"1","level":2,"title":"1. Turn a decision into testable claims","short":"1. Turn a decision into testable…","html":""},{"id":"1.1","level":3,"title":"1.1 Specify the comparison, errors, and decision rules","short":"1.1. Specify the comparison, err…","html":"<p>A <b>parameter</b> describes the population of interest. Let <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>A</mi></msub></mrow><annotation encoding=\"application/x-tex\">p_A</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">p_B</annotation></semantics></math></span> be future eligible users’ purchase probabilities under A and B. The primary <b>null hypothesis</b>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>0</mn></msub><mo>:</mo><msub><mi>p</mi><mi>B</mi></msub><mo>−</mo><msub><mi>p</mi><mi>A</mi></msub><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">H_0:p_B-p_A=0</annotation></semantics></math></span>, states no population difference; the <b>alternative</b>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>1</mn></msub><mo>:</mo><msub><mi>p</mi><mi>B</mi></msub><mo>−</mo><msub><mi>p</mi><mi>A</mi></msub><mo mathvariant=\"normal\">≠</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">H_1:p_B-p_A\\ne0</annotation></semantics></math></span>, states a difference. A two-sided test permits either improvement or harm. A one-sided alternative, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>B</mi></msub><mo>−</mo><msub><mi>p</mi><mi>A</mi></msub><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">p_B-p_A&gt;0</annotation></semantics></math></span>, is appropriate only if chosen before results and if harm will be handled explicitly. It is not a device for halving an inconvenient <i>p</i>-value afterward. The complaint guardrail is a separate question; purchase success cannot answer it. (The Pennsylvania State University, n.d.-b).</p>\n<p><b>Worked decision specification.</b> CedarCart sets a two-sided primary test at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi><mo>=</mo><mn>0.05</mn></mrow><annotation encoding=\"application/x-tex\">\\alpha=0.05</annotation></semantics></math></span>, an 8-percentage-point purchase target, and a maximum 1-percentage-point complaint increase <i>before assignment</i>. Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span> is the long-run probability of a <b>Type I error</b>—rejecting a true null—under the test’s assumptions. If B truly has the same purchase rate, a false positive could trigger a costly rollout. A <b>Type II error</b> means failing to reject when a genuine effect exists; it could cause CedarCart to miss a useful improvement. <b>Power</b> is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">1-\\beta</annotation></semantics></math></span>, the probability of detecting a specified effect when that effect exists. For planning, the team would specify the effect worth detecting and a sample size before collecting data; a small <i>p</i>-value observed afterward is not proof that the study had high power for its business target. (The Pennsylvania State University, n.d.-c).</p>\n<p>The test threshold and the rollout threshold do different jobs. For example, a measured uplift of 2 percentage points might be statistically detectable with a huge sample but still miss CedarCart’s 8-point target. Conversely, an estimated 10-point uplift may be too uncertain to establish that the <i>true</i> uplift reaches 8 points. The guardrail is a third, independent reason to withhold rollout.</p>\n<div class=\"key\"><b>Write the population claim, error tolerance, worthwhile effect, and harm limit before examining group outcomes.</b> A <i>p</i>-value cannot set those priorities for a manager.</div>\n<p><b>Failure mode:</b> “Fail to reject <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">H_0</annotation></semantics></math></span>” is not “prove A and B equal.” A weak or noisy test can miss a consequential difference. Nor does a significant randomized result automatically describe users outside the tested population. (The Pennsylvania State University, n.d.-b, n.d.-c).</p>\n<p><b>Try it — ungraded.</b> Suppose CedarCart had instead set <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>1</mn></msub><mo>:</mo><msub><mi>p</mi><mi>B</mi></msub><mo>−</mo><msub><mi>p</mi><mi>A</mi></msub><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">H_1:p_B-p_A&gt;0</annotation></semantics></math></span> in advance. If the sample showed B below A, would a small <i>two-sided</i> <i>p</i>-value support that directional claim?</p>\n<p><b>Answer.</b> No. Direction matters. Evidence that B is <i>different because it is worse</i> does not support “B is better.” Report the observed direction, use the prespecified analysis, and examine the harm guardrail.</p>"},{"id":"2","level":2,"title":"2. Test one mean without confusing a goal with a control group","short":"2. Test one mean without confusi…","html":""},{"id":"2.1","level":3,"title":"2.1 Calculate and interpret a one-sample <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span> test","short":"2.1. Calculate and interpret a o…","html":"<p>Use a <b>one-sample mean test</b> when one quantitative measurement per independent sampled unit is compared with a fixed benchmark. For CedarCart’s <i>separate</i> survey, let <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span> be the mean satisfaction index among the population represented by surveyed B users. Test <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>0</mn></msub><mo>:</mo><mi>μ</mi><mo>=</mo><mn>70</mn></mrow><annotation encoding=\"application/x-tex\">H_0:\\mu=70</annotation></semantics></math></span> against <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>1</mn></msub><mo>:</mo><mi>μ</mi><mo mathvariant=\"normal\">≠</mo><mn>70</mn></mrow><annotation encoding=\"application/x-tex\">H_1:\\mu\\ne70</annotation></semantics></math></span>. The index is in <b>points</b>, not percent; 70 is a fixed managerial goal, not the observed mean for A. A <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span> distribution accounts for estimating population spread with the sample standard deviation <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s</mi></mrow><annotation encoding=\"application/x-tex\">s</annotation></semantics></math></span>. (The Pennsylvania State University, n.d.-d).</p>\n<p><b>Worked calculation, with inputs and units.</b> The 16 surveyed B users have <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>x</mi><mo>ˉ</mo></mover><mo>=</mo><mn>72</mn></mrow><annotation encoding=\"application/x-tex\">\\bar x=72</annotation></semantics></math></span> points and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s</mi><mo>=</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">s=8</annotation></semantics></math></span> points.</p>\n<ol><li>Estimate the standard error of the mean: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>E</mi><mo>=</mo><mi>s</mi><mi mathvariant=\"normal\">/</mi><msqrt><mi>n</mi></msqrt><mo>=</mo><mn>8</mn><mi mathvariant=\"normal\">/</mi><msqrt><mn>16</mn></msqrt><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">SE=s/\\sqrt n=8/\\sqrt{16}=2</annotation></semantics></math></span> points.</li><li>Compare the observed mean with the null: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mo stretchy=\"false\">(</mo><mover accent=\"true\"><mi>x</mi><mo>ˉ</mo></mover><mo>−</mo><msub><mi>μ</mi><mn>0</mn></msub><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mi>S</mi><mi>E</mi><mo>=</mo><mo stretchy=\"false\">(</mo><mn>72</mn><mo>−</mo><mn>70</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>2</mn><mo>=</mo><mn>1.00</mn></mrow><annotation encoding=\"application/x-tex\">t=(\\bar x-\\mu_0)/SE=(72-70)/2=1.00</annotation></semantics></math></span>.</li><li>Use <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>f</mi><mo>=</mo><mi>n</mi><mo>−</mo><mn>1</mn><mo>=</mo><mn>15</mn></mrow><annotation encoding=\"application/x-tex\">df=n-1=15</annotation></semantics></math></span> degrees of freedom. A two-sided <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span> probability for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">∣</mi><mi>t</mi><mi mathvariant=\"normal\">∣</mi><mo>≥</mo><mn>1.00</mn></mrow><annotation encoding=\"application/x-tex\">|t|\\ge1.00</annotation></semantics></math></span> is about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>0.333</mn></mrow><annotation encoding=\"application/x-tex\">p=0.333</annotation></semantics></math></span>.</li><li>At <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi><mo>=</mo><mn>0.05</mn></mrow><annotation encoding=\"application/x-tex\">\\alpha=0.05</annotation></semantics></math></span>, fail to reject <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">H_0</annotation></semantics></math></span>. The observed mean is <b>2 points above</b> the goal, but this sample does not provide strong evidence that the represented population mean differs from 70.</li><li>A 95% interval, using a <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span> critical value of about 2.131, is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>72</mn><mo>±</mo><mn>2.131</mn><mo stretchy=\"false\">(</mo><mn>2</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mo stretchy=\"false\">[</mo><mn>67.74</mn><mo separator=\"true\">,</mo><mn>76.26</mn><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">72\\pm2.131(2)=[67.74,76.26]</annotation></semantics></math></span> points. Its inclusion of 70 independently agrees with the two-sided test decision. The standardized observed difference is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>72</mn><mo>−</mo><mn>70</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>0.25</mn></mrow><annotation encoding=\"application/x-tex\">(72-70)/8=0.25</annotation></semantics></math></span> sample standard deviations; this does not tell us whether 2 index points are valuable to customers.</li></ol>\n<p>These calculations assume independent respondents and a reasonably appropriate mean model. Sixteen observations warrant inspection for severe skew or influential outliers. More importantly, if dissatisfied users disproportionately ignored the survey, its population claim is restricted by nonresponse; a correct <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span> calculation cannot repair selection bias. The survey cannot replace the A/B purchase and complaint analysis. (The Pennsylvania State University, n.d.-d; American Statistical Association, 2016).</p>\n<div class=\"key\"><b>A benchmark test compares a sample with a fixed value; an A/B test compares outcomes under two assignments. Do not substitute one for the other.</b></div>\n<p><b>Failure mode:</b> Reporting “B beats A on satisfaction” from these numbers invents an A-group satisfaction measurement. Reporting “the goal is met” because <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>72</mn><mo>&gt;</mo><mn>70</mn></mrow><annotation encoding=\"application/x-tex\">72&gt;70</annotation></semantics></math></span> ignores the interval and the survey’s coverage.</p>\n<p><b>Try it — ungraded.</b> Keep the same <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>16</mn></mrow><annotation encoding=\"application/x-tex\">n=16</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s</mi><mo>=</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">s=8</annotation></semantics></math></span>, but imagine a survey mean of 68 points. What are the standard error and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span> statistic against 70?</p>\n<p><b>Answer.</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>E</mi><mo>=</mo><mn>8</mn><mi mathvariant=\"normal\">/</mi><msqrt><mn>16</mn></msqrt><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">SE=8/\\sqrt{16}=2</annotation></semantics></math></span> points; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mo stretchy=\"false\">(</mo><mn>68</mn><mo>−</mo><mn>70</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>2</mn><mo>=</mo><mo>−</mo><mn>1.00</mn></mrow><annotation encoding=\"application/x-tex\">t=(68-70)/2=-1.00</annotation></semantics></math></span>. The minus sign records direction. A two-sided test has the same approximate <i>p</i>-value, 0.333, as for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mo>+</mo><mn>1.00</mn></mrow><annotation encoding=\"application/x-tex\">t=+1.00</annotation></semantics></math></span>; it still does not establish equality with the goal.</p>"},{"id":"3","level":2,"title":"3. Test the A/B purchase difference","short":"3. Test the A/B purchase differe…","html":""},{"id":"3.1","level":3,"title":"3.1 Work from denominators to a two-proportion result","short":"3.1. Work from denominators to a…","html":"<p>A <b>proportion</b> is a count of users with an event divided by the number of relevant assigned users. The unit—not a visit or an order—is an assigned user. With independent user assignments and sufficiently many event and non-event counts, a normal-approximation <b>two-proportion <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">z</annotation></semantics></math></span> test</b> compares purchase probabilities. CedarCart has at least 160 purchasers and 200 non-purchasers in each arm, comfortably above the usual small-count warning threshold. If one user appears repeatedly, or post-assignment exclusions differ by arm, this simple test no longer describes the stated design. (The Pennsylvania State University, n.d.-e).</p>\n<p><b>Worked calculation.</b> Write the order of subtraction as B minus A throughout.</p>\n<ol><li>Observed rates: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover><mi>B</mi></msub><mo>=</mo><mn>200</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>0.50</mn></mrow><annotation encoding=\"application/x-tex\">\\hat p_B=200/400=0.50</annotation></semantics></math></span>; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover><mi>A</mi></msub><mo>=</mo><mn>160</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>0.40</mn></mrow><annotation encoding=\"application/x-tex\">\\hat p_A=160/400=0.40</annotation></semantics></math></span>. The <b>absolute effect</b> is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.50</mn><mo>−</mo><mn>0.40</mn><mo>=</mo><mn>0.10</mn></mrow><annotation encoding=\"application/x-tex\">0.50-0.40=0.10</annotation></semantics></math></span>, or <b>10 percentage points</b>. A relative description is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.10</mn><mi mathvariant=\"normal\">/</mi><mn>0.40</mn><mo>=</mo><mn>25</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">0.10/0.40=25\\%</annotation></semantics></math></span> higher than A’s observed rate; “25 percentage points” would be wrong.</li><li>Under <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>0</mn></msub><mo>:</mo><msub><mi>p</mi><mi>B</mi></msub><mo>=</mo><msub><mi>p</mi><mi>A</mi></msub></mrow><annotation encoding=\"application/x-tex\">H_0:p_B=p_A</annotation></semantics></math></span>, estimate their common probability by pooling successes: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover><mn>0</mn></msub><mo>=</mo><mo stretchy=\"false\">(</mo><mn>200</mn><mo>+</mo><mn>160</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mn>400</mn><mo>+</mo><mn>400</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>360</mn><mi mathvariant=\"normal\">/</mi><mn>800</mn><mo>=</mo><mn>0.45</mn></mrow><annotation encoding=\"application/x-tex\">\\hat p_0=(200+160)/(400+400)=360/800=0.45</annotation></semantics></math></span>.</li><li>Compute the <b>null standard error</b>:  \n<div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>S</mi><msub><mi>E</mi><mn>0</mn></msub><mo>=</mo><msqrt><mrow><msub><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover><mn>0</mn></msub><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><msub><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover><mn>0</mn></msub><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>+</mo><mn>1</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo stretchy=\"false\">)</mo></mrow></msqrt><mo>=</mo><msqrt><mrow><mn>0.45</mn><mo stretchy=\"false\">(</mo><mn>0.55</mn><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mn>0.005</mn><mo stretchy=\"false\">)</mo></mrow></msqrt><mo>≈</mo><mn>0.03518.</mn></mrow><annotation encoding=\"application/x-tex\">SE_0=\\sqrt{\\hat p_0(1-\\hat p_0)(1/400+1/400)}\n=\\sqrt{0.45(0.55)(0.005)}\n\\approx0.03518.</annotation></semantics></math></span></div>\nThis is a fraction of users, equivalent to about 3.518 percentage points.</li><li>Standardize the observed difference: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi><mo>=</mo><mo stretchy=\"false\">(</mo><mn>0.10</mn><mo>−</mo><mn>0</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>0.03518</mn><mo>≈</mo><mn>2.843</mn></mrow><annotation encoding=\"application/x-tex\">z=(0.10-0)/0.03518\\approx2.843</annotation></semantics></math></span>.</li><li>For a prespecified two-sided test, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>2</mn><mo stretchy=\"false\">[</mo><mn>1</mn><mo>−</mo><mi mathvariant=\"normal\">Φ</mi><mo stretchy=\"false\">(</mo><mn>2.843</mn><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">]</mo><mo>≈</mo><mn>0.0045</mn></mrow><annotation encoding=\"application/x-tex\">p=2[1-\\Phi(2.843)]\\approx0.0045</annotation></semantics></math></span>, where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Φ</mi></mrow><annotation encoding=\"application/x-tex\">\\Phi</annotation></semantics></math></span> is the standard-normal cumulative probability. Reject <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">H_0</annotation></semantics></math></span> at 0.05.</li><li>For a <b>95% interval for the difference</b>, do <i>not</i> reuse the pooled null standard error. Use each arm’s observed rate:  \n<div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>S</mi><msub><mi>E</mi><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">I</mi></mrow></msub><mo>=</mo><msqrt><mrow><mn>0.50</mn><mo stretchy=\"false\">(</mo><mn>0.50</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>+</mo><mn>0.40</mn><mo stretchy=\"false\">(</mo><mn>0.60</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>400</mn></mrow></msqrt><mo>=</mo><msqrt><mn>0.001225</mn></msqrt><mo>=</mo><mn>0.035.</mn></mrow><annotation encoding=\"application/x-tex\">SE_{\\mathrm{CI}}=\\sqrt{0.50(0.50)/400+0.40(0.60)/400}\n=\\sqrt{0.001225}=0.035.</annotation></semantics></math></span></div>\nThus <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.10</mn><mo>±</mo><mn>1.96</mn><mo stretchy=\"false\">(</mo><mn>0.035</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mo stretchy=\"false\">[</mo><mn>0.0314</mn><mo separator=\"true\">,</mo><mn>0.1686</mn><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">0.10\\pm1.96(0.035)=[0.0314,0.1686]</annotation></semantics></math></span>, or approximately <b>3.14 to 16.86 percentage points</b>.</li></ol>\n<p><b>Observation:</b> 50% of assigned B users and 40% of assigned A users purchased. <b>Inference:</b> under the stated sampling and randomization assumptions, the data are inconsistent with a zero purchase difference; the interval describes plausible differences for comparable eligible users. <b>Not established:</b> that the uplift reaches 8 points—the interval includes values below 8—or that it persists in every future market. The randomized assignment supports a causal interpretation for the tested eligible users <i>if</i> assignment, exposure, measurement, and follow-up operated as stated. The <i>p</i>-value alone neither proves causation nor measures business value. (The Pennsylvania State University, n.d.-e; American Statistical Association, 2016).</p>\n<div class=\"key\"><b>Test with the null-based standard error; estimate an unpooled interval for the effect. Report both the absolute difference and its uncertainty.</b></div>\n<p><b>Failure mode:</b> Dividing purchases by visitors who reached the last checkout step rather than by all assigned eligible users can make B look better merely by excluding users whom B drove away. Changing the denominator changes the KPI and possibly introduces post-assignment bias.</p>\n<p><b>Try it — ungraded.</b> If one purchase in B were found to be a duplicate, what would the corrected B rate and observed B-minus-A effect be? Do not infer a revised <i>p</i>-value from the old one.</p>\n<p><b>Answer.</b> With 199 distinct B purchasers among 400 assigned users, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover accent=\"true\"><mi>p</mi><mo>^</mo></mover><mi>B</mi></msub><mo>=</mo><mn>199</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>0.4975</mn></mrow><annotation encoding=\"application/x-tex\">\\hat p_B=199/400=0.4975</annotation></semantics></math></span>. The corrected absolute effect is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.4975</mn><mo>−</mo><mn>0.40</mn><mo>=</mo><mn>0.0975</mn></mrow><annotation encoding=\"application/x-tex\">0.4975-0.40=0.0975</annotation></semantics></math></span>, or <b>9.75 percentage points</b>. The pooled estimate and standard error must also be recalculated before retesting.</p>"},{"id":"4","level":2,"title":"4. Weigh effect size, business value, and A/B guardrails","short":"4. Weigh effect size, business v…","html":""},{"id":"4.1","level":3,"title":"4.1 Apply a prespecified decision gate","short":"4.1. Apply a prespecified decisi…","html":"<p>An <b>effect size</b> expresses magnitude: here, the purchase difference is 10 percentage points, while the complaint difference is another effect on another outcome. <b>Practical significance</b> asks whether those magnitudes matter under CedarCart’s costs and priorities. A <b>guardrail</b> is an outcome that must not degrade beyond an agreed limit. A <b>data-quality diagnostic</b>, such as a group-count check, instead asks whether the experiment can be trusted at all. These are different jobs. Online-experiment practice distinguishes success metrics, guardrails, and data-quality metrics. (The Pennsylvania State University, n.d.-c; Microsoft Research, 2021).</p>\n<p><b>Worked guardrail and business calculation.</b></p>\n<ol><li>Complaint rates are <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>32</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>0.08</mn></mrow><annotation encoding=\"application/x-tex\">32/400=0.08</annotation></semantics></math></span> in B and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>0.02</mn></mrow><annotation encoding=\"application/x-tex\">8/400=0.02</annotation></semantics></math></span> in A. The observed B-minus-A increase is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.06</mn></mrow><annotation encoding=\"application/x-tex\">0.06</annotation></semantics></math></span>, or <b>6 percentage points</b>, against a maximum allowed increase of <b>1 percentage point</b>.</li><li>A descriptive 95% normal interval for that difference uses  \n<div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>S</mi><mi>E</mi><mo>=</mo><msqrt><mrow><mn>0.08</mn><mo stretchy=\"false\">(</mo><mn>0.92</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>+</mo><mn>0.02</mn><mo stretchy=\"false\">(</mo><mn>0.98</mn><mo stretchy=\"false\">)</mo><mi mathvariant=\"normal\">/</mi><mn>400</mn></mrow></msqrt><mo>≈</mo><mn>0.01526.</mn></mrow><annotation encoding=\"application/x-tex\">SE=\\sqrt{0.08(0.92)/400+0.02(0.98)/400}\\approx0.01526.</annotation></semantics></math></span></div>\nThe interval is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.06</mn><mo>±</mo><mn>1.96</mn><mo stretchy=\"false\">(</mo><mn>0.01526</mn><mo stretchy=\"false\">)</mo><mo>≈</mo><mo stretchy=\"false\">[</mo><mn>0.0301</mn><mo separator=\"true\">,</mo><mn>0.0899</mn><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">0.06\\pm1.96(0.01526)\\approx[0.0301,0.0899]</annotation></semantics></math></span>: about <b>3.01 to 8.99 percentage points</b>. Both groups have at least eight complaint events; this approximation is illustrative, and a lower-count or high-stakes safety analysis merits a method and review chosen in advance. Even the interval’s lower end exceeds the proposed 1-point limit.</li><li>For a transparent <i>rough scenario</i>, B has 40 more purchases per 400 assigned users. At an assumed $12 margin each, that is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">$</mi><mn>12</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>480</mn></mrow><annotation encoding=\"application/x-tex\">40(\\$12)=\\$480</annotation></semantics></math></span>. B’s assumed operating cost is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>400</mn><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">$</mi><mn>0.60</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>240</mn></mrow><annotation encoding=\"application/x-tex\">400(\\$0.60)=\\$240</annotation></semantics></math></span>. Its 24 additional observed complaints imply <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>24</mn><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">$</mi><mn>25</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>600</mn></mrow><annotation encoding=\"application/x-tex\">24(\\$25)=\\$600</annotation></semantics></math></span> of assumed support cost. The scenario’s incremental net is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">$</mi><mn>480</mn><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>240</mn><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>600</mn><mo>=</mo><mo>−</mo><mi mathvariant=\"normal\">$</mi><mn>360</mn></mrow><annotation encoding=\"application/x-tex\">\\$480-\\$240-\\$600=-\\$360</annotation></semantics></math></span> per 400 exposed B users, or <b>−$0.90 per B user</b>. This is not an estimated long-run profit interval: the dollar inputs are assumptions, and complaint consequences may be larger.</li></ol>\n<p><b>Recommendation:</b> <b>Do not roll out B as tested.</b> Investigate the complaint types and the user journey; fix the likely cause, validate logging, and plan a new, adequately sized experiment with the same explicit gates. The purchase test is significant and its <i>point estimate</i> exceeds the 8-point target, but its interval does not establish an uplift of at least 8 points. More decisively, the observed complaint increase breaches the guardrail. Do not quietly relax that limit after seeing the result. (American Statistical Association, 2016; Microsoft Research, 2021).</p>\n<p>Check assignment balance too: 400/400 matches the planned 1:1 split. This does <b>not</b> prove clean randomization or complete logging; a serious imbalance would prompt investigation of a possible <b>sample-ratio mismatch</b> before trusting either KPI. Privacy-aware review should use access-controlled records and report counts rather than expose user identities. (Microsoft Research, 2021).</p>\n<p><b>Failure mode:</b> Looking at many outcomes, dates, or user segments and presenting only a favorable <i>p</i>-value raises false-positive risk. Prespecify the primary outcome and review plan. Formal multiple-comparison methods are an optional bridge, not permission to conceal adverse outcomes. Bayes factors are another way to compare model evidence, but no Bayes factor is computed from—or implied by—the <i>p</i>-values here. (American Statistical Association, 2016).</p>\n<p><b>Try it — ungraded.</b> Imagine that the same experiment had shown 12 complaints in B rather than 32, with A still at 8. What would the observed complaint-rate increase be, and would its <i>point estimate</i> meet the 1-point limit?</p>\n<p><b>Answer.</b> B’s rate would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>3</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">12/400=3\\%</annotation></semantics></math></span>, versus A’s <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn><mi mathvariant=\"normal\">/</mi><mn>400</mn><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">8/400=2\\%</annotation></semantics></math></span>. The increase would be <b>1 percentage point</b>, exactly the stated maximum, so the point estimate would meet an inclusive “no more than” rule. That alone would not settle rollout: examine uncertainty, measurement quality, the primary effect, and the rule set in advance.</p>"},{"id":"5","level":2,"title":"5. Reproduce, check, and report the decision","short":"5. Reproduce, check, and report…","html":""},{"id":"5.1","level":3,"title":"5.1 Run the same analysis in Excel 365 and SPSS","short":"5.1. Run the same analysis in Ex…","html":"<p><b>First specify the inputs.</b> On an access-controlled, cleaned user-level file, <code>variant</code> is A or B; <code>purchase</code> and <code>complaint</code> are numeric 0/1; there is exactly one complete seven-day row per eligible assigned user. Rates have units of <b>users per assigned user</b>. Retain a data dictionary, exclusion counts, assignment dates, and a versioned copy of the formulas or syntax. Do not share the user-level file in a slide deck. Excel’s distribution functions and IBM’s <code>T-TEST</code> and <code>CROSSTABS</code> commands are documented by their vendors. (Microsoft, n.d.-a, n.d.-b, n.d.-c; IBM, n.d.).</p>\n<p><b>Excel 365 route.</b> Suppose the <i>validated</i> 800 user rows occupy rows 2:801, with variant in <code>B</code>, purchase in <code>C</code>, and complaint in <code>D</code>. Build an inspectable summary:</p>\n<div class=\"tbl\"><table><thead><tr><th>Cell</th><th>Formula</th><th>Expected result</th></tr></thead><tbody><tr><td><code>G2</code></td><td><code>=COUNTIF(B2:B801,\"A\")</code></td><td>400 users</td></tr><tr><td><code>G3</code></td><td><code>=COUNTIF(B2:B801,\"B\")</code></td><td>400 users</td></tr><tr><td><code>H2</code></td><td><code>=COUNTIFS(B2:B801,\"A\",C2:C801,1)</code></td><td>160 purchasers</td></tr><tr><td><code>H3</code></td><td><code>=COUNTIFS(B2:B801,\"B\",C2:C801,1)</code></td><td>200 purchasers</td></tr><tr><td><code>I2</code></td><td><code>=H2/G2</code></td><td>0.40</td></tr><tr><td><code>I3</code></td><td><code>=H3/G3</code></td><td>0.50</td></tr><tr><td><code>J2</code></td><td><code>=COUNTIFS(B2:B801,\"A\",D2:D801,1)</code></td><td>8 complaints</td></tr><tr><td><code>J3</code></td><td><code>=COUNTIFS(B2:B801,\"B\",D2:D801,1)</code></td><td>32 complaints</td></tr></tbody></table></div>\n<p>In <code>I4</code>, calculate the purchase difference with <code>=I3-I2</code> → <code>0.10</code>. In <code>I5</code>, pool under the null with <code>=(H2+H3)/(G2+G3)</code> → <code>0.45</code>. In <code>I6</code>, enter <code>=SQRT(I5*(1-I5)*(1/G2+1/G3))</code> → about <code>0.035178</code>. In <code>I7</code>, enter <code>=I4/I6</code> → about <code>2.842676</code>. In <code>I8</code>, enter <code>=2*(1-NORM.S.DIST(ABS(I7),TRUE))</code> → about <code>0.0045</code>. For the effect interval, <code>I9</code> is <code>=SQRT(I3*(1-I3)/G3+I2*(1-I2)/G2)</code> → <code>0.035</code>; lower and upper cells are <code>=I4-1.96*I9</code> and <code>=I4+1.96*I9</code> → <code>0.0314</code>, <code>0.1686</code>. These functions and their arguments are documented by Microsoft. (Microsoft, n.d.-c).</p>\n<p>For the <b>separate survey</b>, if its 16 individual index scores occupy <code>L2:L17</code>, verify <code>=COUNT(L2:L17)</code> → 16, <code>=AVERAGE(L2:L17)</code> → 72, and <code>=STDEV.S(L2:L17)</code> → 8 before using <code>=(AVERAGE(L2:L17)-70)/(STDEV.S(L2:L17)/SQRT(COUNT(L2:L17)))</code> → <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">t=1</annotation></semantics></math></span>. Then <code>=T.DIST.2T(ABS(1),15)</code> gives approximately 0.333; <code>=T.INV.2T(0.05,15)</code> gives the approximately 2.131 interval multiplier. The aggregate table alone cannot validate the unseen survey scores. (Microsoft, n.d.-a, n.d.-b).</p>\n<p><b>SPSS route.</b> After importing and checking the actual 800-row user file, code <code>group</code> as <code>0=A, 1=B</code>, with numeric <code>purchase</code> and <code>complaint</code> indicators. Run the following on that user-level file, <b>without case weights</b>:</p>\n<pre><code>CROSSTABS\n  /TABLES=group BY purchase\n  /STATISTIC=CHISQ\n  /CELLS=COUNT ROW EXPECTED.\nCROSSTABS\n  /TABLES=group BY complaint\n  /STATISTIC=CHISQ\n  /CELLS=COUNT ROW EXPECTED.</code></pre>\n<p>Check the first table’s group totals of 400 each, purchase counts of 160 and 200, and row purchase percentages of 40% and 50%. With a two-by-two Pearson chi-square test <b>without a continuity correction</b>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>z</mi><mn>2</mn></msup><mo>≈</mo><mn>2.84267</mn><msup><mn>6</mn><mn>2</mn></msup><mo>≈</mo><mn>8.081</mn></mrow><annotation encoding=\"application/x-tex\">z^2\\approx2.842676^2\\approx8.081</annotation></semantics></math></span>, so its two-sided significance agrees with the approximately 0.0045 two-proportion <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">z</annotation></semantics></math></span> test. Distinguish the Pearson line from any differently corrected line in the output. The second table must reproduce complaint counts 8 and 32; the business guardrail remains the <b>difference in rates</b>, not just a significance entry. For the separate survey’s individual scores, SPSS’s documented one-sample command is <code>T-TEST TESTVAL=70 /VARIABLES=satisfaction.</code>; inspect <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>, mean, standard deviation, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">df</annotation></semantics></math></span>, and the two-sided significance. (IBM, n.d.).</p>\n<div class=\"key\"><b>Independently reconcile raw user counts, hand calculations, spreadsheet formulas, and SPSS output before writing the recommendation.</b> If totals differ, stop and trace eligibility, duplicate keys, missing values, and measurement windows.</div>\n<p><b>Failure mode:</b> Excel <code>COUNTIFS</code> treats a blank purchase cell differently from a verified zero. A missing outcome must be investigated, not silently classified as a non-purchase. SPSS and Excel can agree perfectly on a wrongly filtered file.</p>\n<p><b>Try it — ungraded.</b> Your purchase table shows A <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>400</mn></mrow><annotation encoding=\"application/x-tex\">n=400</annotation></semantics></math></span> and B <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>399</mn></mrow><annotation encoding=\"application/x-tex\">n=399</annotation></semantics></math></span>, but the assignment log records 400 B users. Can you publish the recalculated test?</p>\n<p><b>Answer.</b> Not yet. Locate the missing B record; determine whether it reflects an import error, duplicate handling, eligibility rule, or incomplete follow-up. Document any exclusion and rerun both KPI and guardrail checks on a consistent, defensible denominator. A fresh <i>p</i>-value cannot fix uncertain provenance.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>Frame the stakeholder’s population, decision, KPI, target, harm limit, and testable claim <b>before</b> looking at outcomes.</li><li>A <i>p</i>-value assesses compatibility with a specified null model; it is neither the probability the null is true nor the size of an effect.</li><li>For the separate CedarCart survey, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>1.00</mn></mrow><annotation encoding=\"application/x-tex\">t=1.00</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>f</mi><mo>=</mo><mn>15</mn></mrow><annotation encoding=\"application/x-tex\">df=15</annotation></semantics></math></span>, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>≈</mo><mn>0.333</mn></mrow><annotation encoding=\"application/x-tex\">p\\approx0.333</annotation></semantics></math></span>; its 72-point mean does not establish a population mean different from 70.</li><li>A and B purchase rates are 40% and 50%. The observed uplift is <b>10 percentage points</b>, with a 95% interval of about <b>3.14–16.86 points</b>.</li><li>The purchase difference is statistically detectable, but its interval does not establish that the true gain reaches the <b>8-point</b> business target.</li><li>Complaint rates are 2% and 8%. The <b>6-point</b> observed increase violates the <b>1-point</b> guardrail.</li><li>Under the stated illustrative dollar assumptions, the simple incremental scenario is <b>−$360 per 400 B users</b>; it is not a forecast with quantified uncertainty.</li><li><b>Do not roll out B as tested.</b> Investigate complaints and data quality, revise the design, and plan a new experiment.</li><li>Reconcile user-level denominators and event counts across the source file, Excel, and SPSS; report limitations and the next action alongside the test result.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<ul><li><b>A/B test:</b> A comparison in which eligible units, here users, are assigned to alternative versions.</li><li><b>Alternative hypothesis (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">H_1</annotation></semantics></math></span>):</b> The population difference a test evaluates as an alternative to the null.</li><li><b>Effect size:</b> A measure of a difference’s magnitude, such as a 10-percentage-point purchase uplift.</li><li><b>Guardrail:</b> A prespecified limit on an outcome that must not worsen unacceptably.</li><li><b>Null hypothesis (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>H</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">H_0</annotation></semantics></math></span>):</b> The reference population claim used to calculate a test result; here, no purchase-rate difference.</li><li><b>Parameter:</b> A value describing a population, such as its purchase probability <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">p_B</annotation></semantics></math></span>.</li><li><b>Percentage point:</b> The arithmetic difference between two percentages; 50% minus 40% is 10 points.</li><li><b>Power:</b> The probability that a test detects a specified real effect under its assumptions.</li><li><b><i>p</i>-value:</b> Under a specified null model, the probability of a result at least as extreme as the observed one.</li><li><b>Practical significance:</b> Whether an effect is large enough to matter for a defined decision.</li><li><b>Sample-ratio mismatch:</b> A discrepancy between planned and recorded assignment proportions that warrants investigation.</li><li><b>Standard error:</b> A measure of how much an estimator would vary across repeated samples under a model.</li><li><b>Statistical significance:</b> A result meeting a prespecified test threshold; not a judgment of value.</li><li><b>Type I error:</b> Rejecting a null hypothesis that is true.</li><li><b>Type II error:</b> Failing to reject a null hypothesis when the specified alternative is true.</li></ul>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>American Statistical Association. (2016). <i>American Statistical Association releases statement on statistical significance and p-values</i>. <a href=\"https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf\" target=\"_blank\" rel=\"noopener\">https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf</a></p>\n<p>IBM. (n.d.). <i>IBM SPSS Statistics 31 command syntax reference</i>. <a href=\"https://www.ibm.com/docs/en/SSLVMB_31.0.0/pdf/IBM_SPSS_Statistics_Command_Syntax_Reference.pdf\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/SSLVMB_31.0.0/pdf/IBM_SPSS_Statistics_Command_Syntax_Reference.pdf</a></p>\n<p>Microsoft. (n.d.-a). <i>T.DIST.2T function</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/functions/t-dist-2t-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/functions/t-dist-2t-function</a></p>\n<p>Microsoft. (n.d.-b). <i>T.INV.2T function</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/functions/t-inv-2t-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/functions/t-inv-2t-function</a></p>\n<p>Microsoft. (n.d.-c). <i>NORM.S.DIST function</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/functions/norm-s-dist-function\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/functions/norm-s-dist-function</a></p>\n<p>Microsoft Research. (2021, January 25). <i>Patterns of trustworthy experimentation: During-experiment stage</i>. <a href=\"https://www.microsoft.com/en-us/research/articles/patterns-of-trustworthy-experimentation-during-experiment-stage/\" target=\"_blank\" rel=\"noopener\">https://www.microsoft.com/en-us/research/articles/patterns-of-trustworthy-experimentation-during-experiment-stage/</a></p>\n<p>The Pennsylvania State University. (n.d.-a). <i>Collecting data</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson01\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson01</a></p>\n<p>The Pennsylvania State University. (n.d.-b). <i>Hypothesis testing, part 1</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson05\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson05</a></p>\n<p>The Pennsylvania State University. (n.d.-c). <i>Hypothesis testing, part 2</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson06\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson06</a></p>\n<p>The Pennsylvania State University. (n.d.-d). <i>Inference for one sample</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson08\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson08</a></p>\n<p>The Pennsylvania State University. (n.d.-e). <i>Inference for two samples</i>. STAT 200: Elementary Statistics. <a href=\"https://online.stat.psu.edu/stat200/Lesson09\" target=\"_blank\" rel=\"noopener\">https://online.stat.psu.edu/stat200/Lesson09</a></p>"}]};
globalThis.LESSON_I18N = {"zh":{"S06P Lab Checkpoints":"S06P 实验检查点","GC1015 · Session 6 · Build it in Excel or SPSS, check it here":"GC1015 · 第 6 课 · 在 Excel 或 SPSS 中完成，在这里核对","Finish":"完成","Your lab results":"你的实验结果","Get set":"准备就绪","Part A: survey vs goal":"A 部分：调查结果对比目标","Part B: purchase evidence":"B 部分：购买证据","Part C: harm and money":"C 部分：损害与金钱","Lab files":"实验文件","Work in your saved copy <code>S06P_FirstName_LastName_NetID.xlsx</code>. Yellow cells are yours to build; purple cells are supplied.":"在你保存的副本 <code>S06P_FirstName_LastName_NetID.xlsx</code> 中操作。黄色单元格由你来完成；紫色单元格已提供。","Part":"部分","Start at":"起点","Finish check":"完成检查","A":"A","Part A!B7":"Part A!B7","B11 = 0.333":"B11 = 0.333","B":"B","Part B!B7":"Part B!B7","B11 = 2.843":"B11 = 2.843","C":"C","Part C!B7":"Part C!B7","B13 = −$360":"B13 = −$360","Dataset: cedarcart_ab_test.csv, one row per randomized user (800 rows).":"数据集：cedarcart_ab_test.csv，每位随机分配的用户占一行（共 800 行）。","SPSS: run the supplied .sps once, then read H1, H2 and H3.":"SPSS：运行一次提供的 .sps 文件，然后查看 H1、H2 和 H3。","Part A: survey t-test":"A 部分：调查 t 检验","Checkpoint A":"检查点 A","Part B: z-test":"B 部分：z 检验","Checkpoint B":"检查点 B","Part B: 95% interval":"B 部分：95% 置信区间","Part C: complaint gap":"C 部分：投诉差距","Part C: net impact":"C 部分：净影响","Provisional decision (B15)":"初步决策（B15）","Meet your dataset":"认识你的数据集","Count first, then calculate. If your workbook disagrees with a simple count, the formula is wrong.":"先计数，再计算。如果你的工作簿与简单计数的结果不一致，那就是公式错了。","This is <code>cedarcart_ab_test.csv</code>: one row per randomized user. Use the filters to count rows before you trust any formula or pivot table.":"这是 <code>cedarcart_ab_test.csv</code>：每位随机分配的用户占一行。在信任任何公式或数据透视表之前，先用筛选器数一数行数。","Who answered the survey?":"谁回答了调查？","Satisfaction scores exist only for users who answered the survey. Blank cells are not zeros.":"只有回答了调查的用户才有满意度分数。空白单元格不是零。","Use the explorer. How many of the 800 users have a recorded satisfaction score?":"使用数据浏览器。800 名用户中有多少人有记录在案的满意度分数？","<p>Only 16 of 800 users have a score, all from checkout B. A t-test on these 16 says something about people like them, not automatically about every user. That is why Part A asks you to say whether the respondents can speak for all 800 users.</p>":"<p>800 名用户中只有 16 人有分数，而且全部来自结账页面 B。对这 16 人做的 t 检验只能说明与他们类似的人，不能自动推广到每一位用户。所以 A 部分要求你说明这些受访者能否代表全部 800 名用户。</p>","users with a satisfaction score = {{n}}":"有满意度分数的用户 = {{n}}","Filter satisfaction to (blank): that shows 784 rows. 800 − 784 = 16.":"把 satisfaction 筛选为 (blank)：会显示 784 行。800 − 784 = 16。","Users with a score":"有分数的用户","Checkpoint A: your yellow cells":"检查点 A：你的黄色单元格","In <code>IN-CLASS_Lab Part A</code>, B7 holds n = 16, B8 the mean 72, C7 the spread s = 8 and D7 the goal 70.":"在 <code>IN-CLASS_Lab Part A</code> 中，B7 是 n = 16，B8 是均值 72，C7 是离散程度 s = 8，D7 是目标 70。","Type what your workbook shows in B9 to B12.":"输入你的工作簿在 B9 到 B12 中显示的值。","<p>SE = 8/√16 = 2, t = (72 − 70)/2 = 1.000, df = 15, and the two-sided p = 0.333. SPSS H1 shows the same t, df and two-tailed significance.</p>":"<p>SE = 8/√16 = 2，t = (72 − 70)/2 = 1.000，df = 15，双侧 p = 0.333。SPSS H1 显示相同的 t、df 和双尾显著性。</p>","B9   SE = {{se}}":"B9   SE = {{se}}","B10  t = {{t}}":"B10  t = {{t}}","B11  p = {{p}}":"B11  p = {{p}}","B12  df = {{df}}":"B12  df = {{df}}","B9 = C7 / SQRT(B7) = 8 / 4 = 2. If you see 0.5, you divided by n instead of √n.":"B9 = C7 / SQRT(B7) = 8 / 4 = 2。如果你看到 0.5，说明你除以的是 n 而不是 √n。","B9 standard error":"B9 标准误","B10 = (B8 − D7) / B9 = (72 − 70) / 2.":"B10 = (B8 − D7) / B9 = (72 − 70) / 2。","B10 t statistic":"B10 t 统计量","B11 = T.DIST.2T(ABS(B10), B12). If you see 0.167, you used a one-tailed function.":"B11 = T.DIST.2T(ABS(B10), B12)。如果你看到 0.167，说明你用了单尾函数。","B11 p-value":"B11 p 值","B12 = B7 − 1 = 15.":"B12 = B7 − 1 = 15。","B12 degrees of freedom":"B12 自由度","t = 1.000, df 15, p = 0.333":"t = 1.000, df 15, p = 0.333","What goes in B13?":"B13 里填什么？","Your p-value in B11 is 0.333 and α is 0.05.":"你在 B11 中的 p 值是 0.333，α 是 0.05。","Which decision belongs in B13?":"哪个决策应该填入 B13？","<p>B13 records \"fail to reject H₀\". At home, B14 must also say that the 16 respondents may not represent all 800 users.</p>":"<p>B13 记录“不拒绝 H₀”。在家完成时，B14 还必须说明这 16 名受访者可能无法代表全部 800 名用户。</p>","Fail to reject H₀: these scores do not show a mean different from 70":"不拒绝 H₀：这些分数没有显示均值不同于 70","Reject H₀: the mean of 72 is above the goal":"拒绝 H₀：均值 72 高于目标","p = 0.333 is far above 0.05. A 2-point gap is easy to get by chance with 16 scores.":"p = 0.333 远高于 0.05。只有 16 个分数时，2 分的差距很容易仅凭偶然出现。","Accept H₀: the population mean is exactly 70":"接受 H₀：总体均值恰好是 70","Failing to reject never proves the mean equals 70. It only says the evidence is not strong enough.":"不拒绝永远不能证明均值等于 70。它只说明证据不够强。","Count the buyers":"数一数购买者","Every assigned user is in the denominator: 400 per arm, whether or not they bought.":"每位被分配的用户都在分母中：每组 400 人，无论他们是否购买。","Use the explorer to count buyers in each arm. They should match C7 and D7 in Part B.":"用数据浏览器数出每组的购买者。结果应与 B 部分的 C7 和 D7 一致。","<p>160 of 400 A users and 200 of 400 B users bought. In Excel: <code>=COUNTIFS(B:B,\"B\",C:C,1)</code>. A pivot table that counts sessions instead of users would give a different, wrong denominator.</p>":"<p>400 名 A 组用户中有 160 人购买，400 名 B 组用户中有 200 人购买。在 Excel 中：<code>=COUNTIFS(B:B,\"B\",C:C,1)</code>。如果数据透视表统计的是会话而不是用户，就会得到一个不同的、错误的分母。</p>","A buyers (C7) = {{xa}}":"A 组购买者（C7）= {{xa}}","B buyers (D7) = {{xb}}":"B 组购买者（D7）= {{xb}}","Filter group = A and purchase = 1.":"筛选 group = A 且 purchase = 1。","A buyers":"A 组购买者","Filter group = B and purchase = 1.":"筛选 group = B 且 purchase = 1。","B buyers":"B 组购买者","Checkpoint B: the z-test":"检查点 B：z 检验","In <code>IN-CLASS_Lab Part B</code>, B7 and B8 hold the arm sizes, C7 and D7 the buyers.":"在 <code>IN-CLASS_Lab Part B</code> 中，B7 和 B8 是各组人数，C7 和 D7 是购买者人数。","<p>p̂₀ = 0.45, SE₀ ≈ 0.0352, z ≈ 2.843 and p ≈ 0.0045. SPSS H2 shows an uncorrected Pearson χ² of 8.081, which is 2.843².</p>":"<p>p̂₀ = 0.45，SE₀ ≈ 0.0352，z ≈ 2.843，p ≈ 0.0045。SPSS H2 显示未校正的 Pearson χ² 为 8.081，即 2.843²。</p>","B9   pooled p̂₀ = {{p0}}":"B9   合并 p̂₀ = {{p0}}","B10  SE₀ = {{se0}}":"B10  SE₀ = {{se0}}","B11  z = {{z}}":"B11  z = {{z}}","B12  p = {{p}}":"B12  p = {{p}}","B9 = (C7 + D7) / (B7 + B8) = 360 / 800.":"B9 = (C7 + D7) / (B7 + B8) = 360 / 800。","B9 pooled rate":"B9 合并比例","B10 = SQRT(B9 * (1 − B9) * (1/B7 + 1/B8)).":"B10 = SQRT(B9 * (1 − B9) * (1/B7 + 1/B8))。","B10 pooled standard error":"B10 合并标准误","If you see 2.857, you divided by the unpooled SE (0.035). The test uses the pooled SE₀ in B10.":"如果你看到 2.857，说明你除以的是非合并 SE（0.035）。检验使用的是 B10 中的合并 SE₀。","B11 z statistic":"B11 z 统计量","B12 = 2 * (1 − NORM.S.DIST(ABS(B11), TRUE)). If you see 0.0022, you used one tail.":"B12 = 2 * (1 − NORM.S.DIST(ABS(B11), TRUE))。如果你看到 0.0022，说明你只用了单尾。","B12 p-value":"B12 p 值","z = 2.843, p = 0.0045":"z = 2.843, p = 0.0045","Checkpoint B: the interval":"检查点 B：区间","The supplied unpooled SE<sub>Δ</sub> is 0.035. The observed gap Δ in B16 is 0.10.":"已提供的非合并 SE<sub>Δ</sub> 为 0.035。B16 中观察到的差距 Δ 为 0.10。","Type your 95% bounds from B14 and B15, as shares.":"输入 B14 和 B15 中 95% 置信区间的下限和上限，用比例表示。","<p>The interval runs from 0.0314 to 0.1686, or +3.14 to +16.86 percentage points. Its low end is below the 8-point hurdle, so B18 should say the hurdle is not established.</p>":"<p>区间从 0.0314 到 0.1686，即 +3.14 到 +16.86 个百分点。它的下限低于 8 个百分点的门槛，所以 B18 应说明未能证实达到该门槛。</p>","B14  lower = {{lo}}":"B14  下限 = {{lo}}","B15  upper = {{hi}}":"B15  上限 = {{hi}}","B14 = B16 − 1.96 * SEΔ = 0.10 − 1.96 × 0.035.":"B14 = B16 − 1.96 * SEΔ = 0.10 − 1.96 × 0.035。","B14 lower bound":"B14 下限","B15 = B16 + 1.96 * SEΔ = 0.10 + 1.96 × 0.035.":"B15 = B16 + 1.96 * SEΔ = 0.10 + 1.96 × 0.035。","B15 upper bound":"B15 上限","0.0314 to 0.1686":"0.0314 到 0.1686","What goes in B18?":"B18 里填什么？","Your p-value is 0.0045 and your interval is 0.0314 to 0.1686. The business hurdle is 0.08.":"你的 p 值是 0.0045，区间是 0.0314 到 0.1686。业务门槛是 0.08。","Which statement belongs in B18?":"哪个陈述属于 B18？","<p>Two separate claims: the test shows a difference from zero; the interval shows that gains below 8 points are still plausible.</p>":"<p>这是两个独立的结论：检验显示差异不为零；区间显示低于 8 个百分点的提升仍然是合理的可能。</p>","A difference is shown, but the interval does not establish the 0.08 hurdle":"显示出差异，但区间未能证实达到 0.08 的门槛","The hurdle is met because the observed gap of 0.10 is above 0.08":"门槛已达到，因为观察到的差距 0.10 高于 0.08","The gap is one estimate. The interval says the true gap could be as low as 0.0314.":"这个差距只是一个估计值。区间表明真实差距可能低至 0.0314。","No difference is shown because the interval is wide":"未显示出差异，因为区间很宽","The interval excludes 0 and p = 0.0045, so a difference is shown. Width is a separate question.":"区间不包含 0，且 p = 0.0045，所以显示出了差异。宽度是另一个问题。","Checkpoint C: complaint rates":"检查点 C：投诉率","In <code>IN-CLASS_Lab Part C</code>, C7 and D7 hold the complaint counts, B12 the limit 0.01.":"在 <code>IN-CLASS_Lab Part C</code> 中，C7 和 D7 是投诉数，B12 是上限 0.01。","Type what your workbook shows in B9 to B11, as shares.":"输入你的工作簿在 B9 到 B11 中显示的值，用比例表示。","<p>Complaints rise from 0.02 to 0.08, a gap of 0.06 (6 points), six times the 0.01 limit in B12.</p>":"<p>投诉率从 0.02 升到 0.08，差距为 0.06（6 个百分点），是 B12 中 0.01 上限的六倍。</p>","B9   rₐ = {{ra}}":"B9   rₐ = {{ra}}","B10  r_B = {{rb}}":"B10  r_B = {{rb}}","B11  Δc = {{dc}}":"B11  Δc = {{dc}}","B9 = C7 / B7 = 8 / 400. Filter group = A and complaint = 1 to count them.":"B9 = C7 / B7 = 8 / 400。筛选 group = A 且 complaint = 1 来数出这些投诉。","B9 complaint rate A":"B9 A 组投诉率","B10 = D7 / B8 = 32 / 400.":"B10 = D7 / B8 = 32 / 400。","B10 complaint rate B":"B10 B 组投诉率","B11 = B10 − B9. As a share that is 0.06, which is 6 percentage points.":"B11 = B10 − B9。用比例表示是 0.06，也就是 6 个百分点。","B11 complaint gap":"B11 投诉差距","+0.06 vs limit 0.01: breaks the guardrail":"+0.06 对比上限 0.01：违反护栏指标","Checkpoint C: net impact":"检查点 C：净影响","Margin $12 per extra purchase, rollout $0.60 per B user, $25 per excess complaint.":"每笔额外购买利润 $12，每位 B 组用户的上线成本 $0.60，每起额外投诉成本 $25。","Type what your workbook shows in B13.":"输入你的工作簿在 B13 中显示的值。","<p>V = 40 × $12 − 400 × $0.60 11 与 SPSS H1 进行比较，并检查 B14 没有把 16 名受访者的结果变成关于全部 800 名用户的结论。","Part B: compare your z with H2’s uncorrected Pearson row (z² = χ²), and explain the interval-versus-hurdle comparison in B19.":"B 部分：将你的 z 与 H2 中未校正的 Pearson 那一行进行比较（z² = χ²），并在 B19 中解释区间与门槛的比较。","Part C: caption H3 in B19 and revise B15 in your own words. Change an explanation that does not match its evidence; keep a sound decision.":"C 部分：在 B19 中为 H3 写说明文字，并用你自己的话修改 B15。修改与证据不符的解释；保留合理的决策。","Open this page from the class site to see the dataset.":"请从课程网站打开此页面以查看数据集。","Lab checkpoints complete":"实验检查点已完成","Your checkpoint answers are saved. Finish the take-home audit in your workbook.":"你的检查点答案已保存。请在工作簿中完成课后审查任务。"},"es":{"S06P Lab Checkpoints":"Puntos de control del laboratorio S06P","GC1015 · Session 6 · Build it in Excel or SPSS, check it here":"GC1015 · Sesión 6 · Constrúyelo en Excel o SPSS y compruébalo aquí","Finish":"Terminar","Your lab results":"Tus resultados del laboratorio","Get set":"Prepárate","Part A: survey vs goal":"Parte A: encuesta frente a meta","Part B: purchase evidence":"Parte B: evidencia de compras","Part C: harm and money":"Parte C: daño y dinero","Lab files":"Archivos del laboratorio","Work in your saved copy <code>S06P_FirstName_LastName_NetID.xlsx</code>. Yellow cells are yours to build; purple cells are supplied.":"Trabaja en tu copia guardada <code>S06P_FirstName_LastName_NetID.xlsx</code>. Las celdas amarillas las construyes tú; las celdas moradas ya vienen dadas.","Part":"Parte","Start at":"Empieza en","Finish check":"Comprobación final","A":"A","Part A!B7":"Part A!B7","B11 = 0.333":"B11 = 0.333","B":"B","Part B!B7":"Part B!B7","B11 = 2.843":"B11 = 2.843","C":"C","Part C!B7":"Part C!B7","B13 = −$360":"B13 = −$360","Dataset: cedarcart_ab_test.csv, one row per randomized user (800 rows).":"Conjunto de datos: cedarcart_ab_test.csv, una fila por usuario aleatorizado (800 filas).","SPSS: run the supplied .sps once, then read H1, H2 and H3.":"SPSS: ejecuta una vez el archivo .sps

ecords":"Total de registros","Every order_id is different, so this also returns 120. A smaller number would mean a repeated order ID.":"Cada order_id es distinto, así que esto también devuelve 120. Un número menor significaría un ID de pedido repetido.","Distinct order IDs":"ID de pedido distintos","Step 2: the five-row demo table":"Paso 2: la tabla de demostración de cinco filas","In <code>tblDemoDelivery</code> you entered 32, 38, a blank, 45 and 65 minutes. Known answers check your formulas before you use them on 120 rows.":"En <code>tblDemoDelivery</code> ingresaste 32, 38, un vacío, 45 y 65 minutos. Las respuestas conocidas comprueban tus fórmulas antes de usarlas en 120 filas.","Type what your formulas return. Give the standard deviation to two decimals.":"Escribe lo que devuelven tus fórmulas. Da la desviación estándar con dos decimales.","<p>Valid count 4, missing 1, mean 45, median 41.5, sample SD 14.35 minutes. A blank is excluded, never counted as zero, and the sample SD divides by n − 1.</p>":"<p>Conteo válido 4, faltante 1, media 45, mediana 41.5, SD muestral 14.35 minutos. Un vacío se excluye, nunca se cuenta como cero, y la SD muestral divide entre n − 1.</p>","COUNT = {{n}}   missing = {{m}}":"COUNT = {{n}}   faltantes = {{m}}","AVERAGE = {{mean}} minutes   MEDIAN = {{med}} minutes":"AVERAGE = {{mean}} minutos   MEDIAN = {{med}} minutos","STDEV.S = {{sd}} minutes":"STDEV.S = {{sd}} minutos","COUNT counts numbers only, so the blank is skipped: 4.":"COUNT solo cuenta números, así que se salta el vacío: 4.","Valid count":"Conteo válido","ROWS minus COUNT: 5 − 4 = 1.":"ROWS menos COUNT: 5 − 4 = 1.","Missing count":"Conteo de faltantes","If you see 36, the blank was treated as zero. AVERAGE skips blanks: 180 ÷ 4 = 45.":"Si ves 36, el vacío se trató como cero. AVERAGE se salta los vacíos: 180 ÷ 4 = 45.","Mean":"Media","Order the four values: 32, 38, 45, 65. The middle two average to 41.5.":"Ordena los cuatro valores: 32, 38, 45, 65. El promedio de los dos del medio es 41.5.","Median":"Mediana","If you see 12.43, you used STDEV.P. The lab uses STDEV.S, which divides by n − 1.":"Si ves 12.43, usaste STDEV.P. El laboratorio usa STDEV.S, que divide entre n − 1.","Sample standard deviation":"Desviación estándar muestral","What goes in Data Audit B6?":"¿Qué va en Data Audit B6?","B6 asks for the observational unit and table grain. The file has 120 rows, 120 distinct order IDs and 76 distinct customers.":"B6 pide la unidad de observación y la granularidad de la tabla. El archivo tiene 120 filas, 120 ID de pedido distintos y 76 clientes distintos.","Which grain statement is right?":"¿Qué enunciado de granularidad es correcto?","<p>One row per customer order, August 1 to 28, 2026. Every count and summary therefore describes <b>orders</b>, not customers. <code>order_id</code> identifies a row (B7), and B9 holds the 120 records.</p>":"<p>Una fila por pedido de cliente, del 1 al 28 de agosto de 2026. Por lo tanto, cada conteo y cada resumen describe <b>pedidos</b>, no clientes. <code>order_id</code> identifica una fila (B7), y B9 contiene los 120 registros.</p>","One row per customer order in the four-week window":"Una fila por pedido de cliente en la ventana de cuatro semanas","One row per customer":"Una fila por cliente","There are 76 customers but 120 rows. Some customers placed two orders.":"Hay 76 clientes pero 120 filas. Algunos clientes hicieron dos pedidos.","One row per delivery day":"Una fila por día de entrega","The window has 28 days but 120 rows. One day holds several orders.":"La ventana tiene 28 días pero 120 filas. Un día contiene varios pedidos.","One row per fulfillment hub":"Una fila por centro de distribución","There are four hubs with 30 orders each. The hub is a category on each row.":"Hay cuatro centros con 30 pedidos cada uno. El centro es una categoría en cada fila.","One row per order (120); order_id identifies it; 76 customers":"Una fila por pedido (120); order_id lo identifica; 76 clientes","Repeated customers: error or expected?":"Clientes repetidos: ¿error o algo esperado?","B8 asks whether a repeated <code>customer_id</code> is a duplicate. B10 asks whether any row has more unfulfilled items than ordered items.":"B8 pregunta si un <code>customer_id</code> repetido es un duplicado. B10 pregunta si alguna fila tiene más artículos no entregados que artículos pedidos.","Filter customer_id to C-001. Then type your B10 check.":"Filtra customer_id por C-001. Luego escribe tu comprobación de B10.","<p>C-001 placed two separate orders on different dates. When the grain is orders, a repeated <code>customer_id</code> is expected; a repeated <code>order_id</code> would be the alarm. Decide the grain first, then what counts as a duplicate.</p>\n          <p>No row has more unfulfilled items than ordered items, so B10 records that the rule holds.</p>":"<p>C-001 hizo dos pedidos distintos en fechas diferentes. Cuando la granularidad es el pedido, un <code>customer_id</code> repetido es lo esperado; la alarma sería un <code>order_id</code> repetido. Primero decide la granularidad y después qué cuenta como duplicado.</p>\n          <p>Ninguna fila tiene más artículos no entregados que artículos pedidos, así que B10 registra que la regla se cumple.</p>","rows for customer C-001 = {{c}}":"filas del cliente C-001 = {{c}}","rows where items_unfulfilled > items_ordered = {{v}}":"filas donde items_unfulfilled > items_ordered = {{v}}","Filter customer_id = C-001: two rows, MF-0001 and MF-0077, with different order IDs and dates.":"Filtra customer_id = C-001: dos filas, MF-0001 y MF-0077, con distintos ID de pedido y fechas.","Rows for customer C-001":"Filas del cliente C-001","A helper formula such as =SUMPRODUCT(--(tblMetroFresh[items_unfulfilled]>tblMetroFresh[items_ordered])) returns 0.":"Una fórmula auxiliar como =SUMPRODUCT(--(tblMetroFresh[items_unfulfilled]>tblMetroFresh[items_ordered])) devuelve 0.","Rows that break the items rule":"Filas que incumplen la regla de artículos","Measurement levels, B15 to B19":"Niveles de medición, de B15 a B19","Numbers can be labels, ranks or measured amounts. The level decides which summaries make sense.":"Los números pueden ser etiquetas, rangos de orden o cantidades medidas. El nivel decide qué resúmenes tienen sentido.","Drag a level onto each field. One tile is a trap.":"Arrastra un nivel a cada campo. Una ficha es una trampa.","<p><code>fulfillment_hub</code> is nominal: count the categories, never average them. <code>delivery_minutes</code>, <code>order_value</code> and <code>spoilage_units</code> are ratio, so means and standard deviations are meaningful. <code>customer_rating</code> is ordinal: treat it as ordered ratings, not exact distances.</p>":"<p><code>fulfillment_hub</code> es nominal: cuenta las categorías, nunca las promedies. <code>delivery_minutes</code>, <code>order_value</code> y <code>spoilage_units</code> son de razón, así que las medias y las desviaciones estándar tienen sentido. <code>customer_rating</code> es ordinal: trátala como calificaciones ordenadas, no como distancias exactas.</p>","Ratio":"De razón","Ordinal":"Ordinal","Interval":"De intervalo","Nominal":"Nominal","<code>fulfillment_hub</code>":"<code>fulfillment_hub</code>","<code>delivery_minutes</code>":"<code>delivery_minutes</code>","<code>order_value</code>":"<code>order_value</code>","<code>spoilage_units</code>":"<code>spoilage_units</code>","<code>customer_rating</code>":"<code>customer_rating</code>","Interval has no true zero. Zero minutes, zero dollars and zero spoiled units all mean none, so these are ratio.":"El nivel de intervalo no tiene un cero absoluto. Cero minutos, cero dólares y cero unidades echadas a perder significan \"nada\", así que estos son de razón.","Ratings have an order, but the step from 3 to 4 may not equal the step from 4 to 5. That is ordinal.":"Las calificaciones tienen un orden, pero el salto de 3 a 4 puede no ser igual al de 4 a 5. Eso es ordinal.","Hub names have no order. Newark is not more than Richmond. That is nominal.":"Los nombres de los centros no tienen orden. Newark no es más que Richmond. Eso es nominal.","Ratings 1 to 5 do have an order. That makes them ordinal, not nominal.":"Las calificaciones de 1 a 5 sí tienen un orden. Eso las hace ordinales, no nominales.","Count before you average":"Cuenta antes de promediar","Descriptive Statistics row 6 is <code>delivery_minutes</code>. Blank cells are missing, not zero.":"La fila 6 de Descriptive Statistics es <code>delivery_minutes</code>. Las celdas vacías son faltantes, no cero.","Filter delivery_minutes to (blank), then type C6 to E6.":"Filtra delivery_minutes por (vacío) y luego escribe de C6 a E6.","<p>118 of 120 orders have a valid delivery time. The two blanks (MF-0017 and MF-0092) are left out of every delivery statistic and reported in E6, so a reader can see which summaries use fewer than 120 records.</p>":"<p>118 de 120 pedidos tienen un tiempo de entrega válido. Los dos vacíos (MF-0017 y MF-0092) quedan fuera de todas las estadísticas de entrega y se informan en E6, para que quien lea vea qué resúmenes usan menos de 120 registros.</p>","C6 total records = {{c6}}":"C6 total de registros = {{c6}}","D6 valid N = {{d6}}":"D6 N válido = {{d6}}","E6 missing N = {{e6}}":"E6 N faltante = {{e6}}","=ROWS(tblMetroFresh[delivery_minutes]) counts every row: 120.":"=ROWS(tblMetroFresh[delivery_minutes]) cuenta todas las filas: 120.","C6 total records":"C6 total de registros","If you see 120, you used ROWS or COUNTA. COUNT counts numbers only: 118.":"Si ves 120, usaste ROWS o COUNTA. COUNT solo cuenta números: 118.","D6 valid N":"D6 N válido","E6 = ROWS − COUNT = 120 − 118 = 2. The explorer shows the two blank rows, MF-0017 and MF-0092.":"E6 = ROWS − COUNT = 120 − 118 = 2. El explorador muestra las dos filas vacías, MF-0017 y MF-0092.","E6 missing N":"E6 N faltante","Checkpoint B: delivery_minutes":"Punto de control B: delivery_minutes","Your formulas in F6 to K6 all point at <code>tblMetroFresh[delivery_minutes]</code>.":"Todas tus fórmulas de F6 a K6 apuntan a <code>tblMetroFresh[delivery_minutes]</code>.","Type what F6 to K6 show, to two decimals.":"Escribe lo que muestran F6 a K6, con dos decimales.","<p>Mean 43.67, median 43.50, minimum 24, maximum 142, range 118 and sample SD 14.17 minutes, all from 118 valid records. The mean and median are close; the 142-minute record stretches the range and the SD more than the center.</p>":"<p>Media 43.67, mediana 43.50, mínimo 24, máximo 142, rango 118 y SD muestral 14.17 minutos, todo a partir de 118 registros válidos. La media y la mediana están cerca; el registro de 142 minutos estira el rango y la SD más que el centro.</p>","F6 mean = {{f6}}   G6 median = {{g6}}":"F6 media = {{f6}}   G6 mediana = {{g6}}","H6 minimum = {{h6}}   I6 maximum = {{i6}}":"H6 mínimo = {{h6}}   I6 máximo = {{i6}}","J6 range = {{j6}}   K6 sample SD = {{k6}}":"J6 rango = {{j6}}   K6 SD muestral = {{k6}}","If you see 42.94, the blanks were counted as zero. AVERAGE on the table column skips them: 43.67.":"Si ves 42.94, los vacíos se contaron como cero. AVERAGE sobre la columna de la tabla los salta: 43.67.","F6 mean":"F6 media","=MEDIAN(tblMetroFresh[delivery_minutes]) returns 43.50.":"=MEDIAN(tblMetroFresh[delivery_minutes]) devuelve 43.50.","G6 median":"G6 mediana","The shortest recorded delivery is 24 minutes.":"La entrega más corta registrada es de 24 minutos.","H6 minimum":"H6 mínimo","The maximum is 142 minutes (MF-0074). Keep it; it is a value to check, not to delete.":"El máximo es 142 minutos (MF-0074). Consérvalo; es un valor que hay que revisar, no borrar.","I6 maximum":"I6 máximo","J6 = I6 − H6 = 142 − 24 = 118 minutes.":"J6 = I6 − H6 = 142 − 24 = 118 minutos.","J6 range":"J6 rango","If you see 14.11, you used STDEV.P. If you see 15.13, blanks became zeros. Use STDEV.S on the table column.":"Si ves 14.11, usaste STDEV.P. Si ves 15.13, los vacíos se convirtieron en ceros. Usa STDEV.S sobre la columna de la tabla.","K6 sample standard deviation":"K6 desviación estándar muestral","n 118 (2 missing); mean 43.67; median 43.50; SD 14.17 minutes":"n 118 (2 faltantes); media 43.67; mediana 43.50; SD 14.17 minutos","Rows 7 and 8: order value and spoilage":"Filas 7 y 8: valor del pedido y producto echado a perder","Copy the row 6 pattern to <code>order_value</code> (US dollars) and <code>spoilage_units</code> (units).":"Copia el patrón de la fila 6 a <code>order_value</code> (dólares estadounidenses) y <code>spoilage_units</code> (unidades).","Type the cells your workbook shows.":"Escribe las celdas que muestra tu libro.","<p>Order value: 119 valid, mean $142.07, median $141.41, range $43.05 to $279.74, SD $57.27. Spoilage: 120 valid, mean 0.65, median 0, maximum 4, SD 1.29 units. Valid N plus missing N equals 120 in every row.</p>":"<p>Valor del pedido: 119 válidos, media $142.07, mediana $141.41, rango de $43.05 a $279.74, SD $57.27. Producto echado a perder: 120 válidos, media 0.65, mediana 0, máximo 4, SD 1.29 unidades. N válido más N faltante es igual a 120 en todas las filas.</p>","D7 valid N = {{d7}}   F7 mean = $ {{f7}}   K7 SD = $ {{k7}}":"D7 N válido = {{d7}}   F7 media = $ {{f7}}   K7 SD = $ {{k7}}","D8 valid N = {{d8}}   F8 mean = {{f8}} units   I8 maximum = {{i8}} units":"D8 N válido = {{d8}}   F8 media = {{f8}} unidades   I8 máximo = {{i8}} unidades","One order value is blank (MF-0059), so COUNT returns 119.":"Un valor de pedido está vacío (MF-0059), así que COUNT devuelve 119.","D7 valid N":"D7 N válido","If you see 140.89, the blank became $0.00. Never fill a blank with zero.":"Si ves 140.89, el vacío se convirtió en $0.00. Nunca rellenes un vacío con cero.","F7 mean order value":"F7 valor medio del pedido","Use STDEV.S. STDEV.P gives 57.03, which fails the parity check.":"Usa STDEV.S. STDEV.P da 57.03, que no pasa la comprobación de paridad.","K7 sample standard deviation":"K7 desviación estándar muestral","Spoilage has no blanks: 120. Zero is a real value here; it means nothing spoiled.":"El producto echado a perder no tiene vacíos: 120. Aquí el cero es un valor real; significa que no se echó a perder nada.","D8 valid N":"D8 N válido","=AVERAGE(tblMetroFresh[spoilage_units]) returns 0.65 units.":"=AVERAGE(tblMetroFresh[spoilage_units]) devuelve 0.65 unidades.","F8 mean spoilage":"F8 media de producto echado a perder","The largest spoilage count is 4 units. Ten orders have it.":"La mayor cantidad de producto echado a perder es 4 unidades. Diez pedidos la tienen.","I8 maximum spoilage":"I8 máximo de producto echado a perder","Value: n 119, mean $142.07. Spoilage: n 120, mean 0.65, max 4":"Valor: n 119, media $142.07. Producto echado a perder: n 120, media 0.65, máx. 4","Checkpoint C: SPSS N and parity":"Punto de control C: N de SPSS y paridad","SPSS Descriptives shows one N for each variable, plus a last row called Valid N (listwise).":"Descriptives de SPSS muestra un N por cada variable, más una última fila llamada Valid N (listwise).","Type the SPSS values for D6 and D11, then your PASS count.":"Escribe los valores de SPSS para D6 y D11 y luego tu conteo de PASS.","<p>Each variable has its own valid N: 118, 119 and 120. <b>Valid N (listwise)</b> is 117, the rows with no blank in any of the three, so it matches no single variable. With matching rules, all 15 comparisons pass.</p>\n          <p>PASS shows the two tools processed the same records the same way. It does not show that the records are accurate.</p>":"<p>Cada variable tiene su propio N válido: 118, 119 y 120. <b>Valid N (listwise)</b> es 117, las filas sin ningún vacío en las tres, así que no coincide con ninguna variable por separado. Con reglas coincidentes, las 15 comparaciones pasan.</p>\n          <p>PASS muestra que las dos herramientas procesaron los mismos registros de la misma manera. No muestra que los registros sean exactos.</p>","D6 SPSS N for delivery_minutes = {{n1}}":"D6 N de SPSS para delivery_minutes = {{n1}}","D11 SPSS N for order_value = {{n2}}":"D11 N de SPSS para order_value = {{n2}}","PASS rows in G6:G20 = {{p}} of 15":"filas PASS en G6:G20 = {{p}} de 15","Use the N on the delivery_minutes row. If you typed 117, you copied Valid N (listwise), which counts rows with no blanks in any variable.":"Usa el N de la fila de delivery_minutes. Si escribiste 117, copiaste Valid N (listwise), que cuenta las filas sin vacíos en ninguna variable.","D6 SPSS N for delivery_minutes":"D6 N de SPSS para delivery_minutes","order_value has its own N: 119. Valid N (listwise) is 117 and belongs to no single variable.":"order_value tiene su propio N: 119. Valid N (listwise) es 117 y no pertenece a ninguna variable por separado.","D11 SPSS N for order_value":"D11 N de SPSS para order_value","When both tools use only valid values and the sample SD, all 15 rows pass within 0.01.":"Cuando ambas herramientas usan solo valores válidos y la SD muestral, las 15 filas pasan con una tolerancia de 0.01.","PASS rows":"Filas PASS","15 of 15 PASS within 0.01":"15 de 15 PASS con tolerancia de 0.01","A row says CHECK":"Una fila dice CHECK","Row 10, the delivery SD, shows Excel 14.11 and SPSS 14.17. The difference, 0.06, fails the 0.01 tolerance.":"La fila 10, la SD de entrega, muestra 14.11 en Excel y 14.17 en SPSS. La diferencia, 0.06, supera la tolerancia de 0.01.","What is the most likely cause?":"¿Cuál es la causa más probable?","<p>STDEV.P divides by n, so it is slightly smaller: 14.11 instead of 14.17. SPSS Descriptives reports the sample SD, which divides by n − 1. A CHECK usually means different rules, not an arithmetic bug.</p>\n          <p>If every SD used STDEV.P, delivery (0.06) and order value (0.24) would fail, but spoilage would still pass (0.005). So one PASS does not prove the rule is right.</p>":"<p>STDEV.P divide entre n, así que da un poco menos: 14.11 en lugar de 14.17. Descriptives de SPSS informa la SD muestral, que divide entre n − 1. Un CHECK suele significar reglas distintas, no un error aritmético.</p>\n          <p>Si todas las SD usaran STDEV.P, entrega (0.06) y valor del pedido (0.24) fallarían, pero el producto echado a perder seguiría pasando (0.005). Así que un PASS no demuestra que la regla sea correcta.</p>","Excel used STDEV.P, which divides by n instead of n − 1":"Excel usó STDEV.P, que divide entre n en lugar de n − 1","SPSS rounds differently, so type 14.11 into column D":"SPSS redondea distinto, así que escribe 14.11 en la columna D","Never edit a value to force PASS. Column D must show what SPSS displays.":"Nunca edites un valor para forzar un PASS. La columna D debe mostrar lo que muestra SPSS.","The 142-minute order should be deleted from the table":"El pedido de 142 minutos debería eliminarse de la tabla","Deleting data does not fix a formula. Both tools already use the same 118 records.":"Borrar datos no arregla una fórmula. Ambas herramientas ya usan los mismos 118 registros.","Raise the tolerance to 0.1 so the row passes":"Subir la tolerancia a 0.1 para que la fila pase","Moving the tolerance hides a real rule difference. Fix the rule instead.":"Mover la tolerancia oculta una diferencia real de regla. Corrige la regla.","Find the records to log":"Encuentra los registros que hay que anotar","The Quality Log needs a row for each blank field, the largest delivery time, a large spoilage count and the items rule. Keep every value as recorded.":"El Quality Log necesita una fila por cada campo vacío, el mayor tiempo de entrega, una cantidad grande de producto echado a perder y la regla de artículos. Conserva cada valor tal como se registró.","Use the filters. Type each count.":"Usa los filtros. Escribe cada conteo.","<p>Log MF-0017 and MF-0092 (no delivery time), MF-0059 (no order value), MF-0074 (142 minutes), at least one 4-unit spoilage order such as MF-0003, and one row saying no record breaks the items rule. A flagged value is a question to ask, not proof of an error.</p>":"<p>Anota MF-0017 y MF-0092 (sin tiempo de entrega), MF-0059 (sin valor del pedido), MF-0074 (142 minutos), al menos un pedido con 4 unidades echadas a perder, como MF-0003, y una fila que diga que ningún registro incumple la regla de artículos. Un valor señalado es una pregunta que hacer, no la prueba de un error.</p>","blank delivery_minutes = {{a}} rows":"delivery_minutes vacío = {{a}} filas","blank order_value = {{b}} row":"order_value vacío = {{b}} fila","spoilage_units = 4 in {{c}} rows":"spoilage_units = 4 en {{c}} filas","Filter delivery_minutes to (blank): MF-0017 and MF-0092.":"Filtra delivery_minutes por (vacío): MF-0017 y MF-0092.","Rows with a blank delivery time":"Filas con el tiempo de entrega vacío","Filter order_value to (blank): MF-0059.":"Filtra order_value por (vacío): MF-0059.","Rows with a blank order value":"Filas con el valor del pedido vacío","Filter spoilage_units to 4: ten orders, starting with MF-0003.":"Filtra spoilage_units por 4: diez pedidos, empezando por MF-0003.","Rows with 4 spoiled units":"Filas con 4 unidades echadas a perder","Blank: MF-0017, MF-0092, MF-0059. Check: MF-0074 (142 min), 4-unit spoilage. Items rule holds.":"Vacíos: MF-0017, MF-0092, MF-0059. Revisar: MF-0074 (142 min), producto echado a perder de 4 unidades. La regla de artículos se cumple.","What do you do with 142 minutes?":"¿Qué haces con 142 minutos?","MF-0074 records a 142-minute delivery. The next largest is 63 minutes.":"MF-0074 registra una entrega de 142 minutos. La siguiente más larga es de 63 minutos.","What goes in the Action taken column?":"¿Qué va en la columna Action taken?","<p>An unusual value is an investigation item, not a confirmed error. Keep it, log it, and ask the source team whether 142 minutes was a real delivery. The note should say it is unverified.</p>":"<p>Un valor inusual es algo que investigar, no un error confirmado. Consérvalo, anótalo y pregúntale al equipo de la fuente si 142 minutos fue una entrega real. La nota debe decir que no está verificado.</p>","Keep 142 as recorded, and ask whether it is valid or a recording issue":"Conservar 142 tal como se registró y preguntar si es válido o un problema de registro","Delete the row, because it distorts the mean":"Borrar la fila, porque distorsiona la media","Start Here says never delete unusual values. Log the issue and ask.":"Start Here dice que nunca se borran los valores inusuales. Anota el problema y pregunta.","Replace it with the median, 43.5 minutes":"Reemplazarlo por la mediana, 43.5 minutos","That alters a source record and hides the question. Keep the value.":"Eso altera un registro de la fuente y oculta la pregunta. Conserva el valor.","Record it as missing, like a blank":"Registrarlo como faltante, igual que un vacío","A recorded value is not missing. Changing it to blank alters the source.":"Un valor registrado no es un faltante. Cambiarlo a vacío altera la fuente.","Optional: how much does one record move?":"Opcional: ¿cuánto mueve un solo registro?","Section D, not graded: on a separate sheet, recompute the delivery statistics without MF-0074 and label the result hypothetical. <code>tblMetroFresh</code> stays unchanged.":"Sección D, sin calificación: en una hoja aparte, recalcula las estadísticas de entrega sin MF-0074 y etiqueta el resultado como hipotético. <code>tblMetroFresh</code> queda sin cambios.","Type the hypothetical results for the other 117 delivery times.":"Escribe los resultados hipotéticos para los otros 117 tiempos de entrega.","<p>Without MF-0074, the mean drops by 0.84 minutes and the SD by about 3.3, while the median moves only 0.5. One extreme value pulls the mean and the SD more than the median. This comparison does <b>not</b> justify deleting the record; only source evidence can.</p>":"<p>Sin MF-0074, la media baja 0.84 minutos y la SD unos 3.3, mientras que la mediana se mueve solo 0.5. Un valor extremo arrastra la media y la SD más que la mediana. Esta comparación <b>no</b> justifica borrar el registro; solo la evidencia de la fuente puede hacerlo.</p>","mean = {{m}} minutes (was 43.67)":"media = {{m}} minutos (antes 43.67)","median = {{md}} minutes (was 43.50)":"mediana = {{md}} minutos (antes 43.50)","sample SD = {{sd}} minutes (was 14.17)":"SD muestral = {{sd}} minutos (antes 14.17)","AVERAGE of the 117 valid values other than 142 gives 42.83.":"AVERAGE de los 117 valores válidos distintos de 142 da 42.83.","Hypothetical mean":"Media hipotética","The middle of 117 ordered values is the 59th value: 43.":"El centro de 117 valores ordenados es el valor número 59: 43.","Hypothetical median":"Mediana hipotética","STDEV.S of the same 117 values gives 10.89.":"STDEV.S de esos mismos 117 valores da 10.89.","Hypothetical sample standard deviation":"Desviación estándar muestral hipotética","Synthesis A5: use or pause?":"Synthesis A5: ¿usar o pausar?","Leadership asked whether this file can serve as initial descriptive evidence, or whether the review should pause for clarification.":"La dirección preguntó si este archivo puede servir como evidencia descriptiva inicial, o si la revisión debe pausarse para pedir aclaraciones.","Which opening sentence for the evidence-sufficiency note is strongest?":"¿Qué frase inicial de la nota de suficiencia de la evidencia es la más sólida?","<p>A strong note makes a clear use-or-pause call with at least three traceable numbers. It says what the records can describe (the center, range and spread of these orders in August 2026), what they cannot establish (why delays or spoilage happened), and the main limitation (missing values and the unverified 142-minute record). Write it in your own words.</p>":"<p>Una nota sólida toma una decisión clara de usar o pausar, con al menos tres números rastreables. Dice qué pueden describir los registros (el centro, el rango y la dispersión de estos pedidos en agosto de 2026), qué no pueden establecer (por qué ocurrieron los retrasos o las pérdidas de producto) y la limitación principal (los valores faltantes y el registro de 142 minutos sin verificar). Escríbela con tus propias palabras.</p>","Use as initial descriptive evidence: 118 valid delivery times, mean 43.67 minutes, one 142-minute record unverified":"Usar como evidencia descriptiva inicial: 118 tiempos de entrega válidos, media de 43.67 minutos, un registro de 142 minutos sin verificar","Pause: two blank delivery times make the file unusable":"Pausar: dos tiempos de entrega vacíos hacen que el archivo no sirva","Two of 120 missing is a limitation to disclose, not a reason to discard the file.":"Que falten dos de 120 es una limitación que hay que declarar, no un motivo para descartar el archivo.","Use it: long deliveries caused the spoilage":"Usarlo: las entregas largas causaron las pérdidas de producto","The records show values, not causes. The note must make no causal claim.":"Los registros muestran valores, no causas. La nota no debe hacer ninguna afirmación causal.","Change service next month, because mean delivery is 43.67 minutes":"Cambiar el servicio el próximo mes, porque la entrega media es de 43.67 minutos","The request asks use or pause, not what to change. Answer the question that was asked.":"La solicitud pregunta si usar o pausar, no qué cambiar. Responde la pregunta que te hicieron.","Use as initial descriptive evidence, with the limits stated":"Usar como evidencia descriptiva inicial, indicando los límites","Memo Evidence Map: every number has a home":"Memo Evidence Map: cada número tiene su lugar","Each number in your note needs its own row in the Memo Evidence Map, with a workbook cell and an SPSS source.":"Cada número de tu nota necesita su propia fila en el Memo Evidence Map, con una celda del libro y una fuente de SPSS.","Drag each workbook source to the number it supports. One tile is not a source.":"Arrastra cada fuente del libro al número que respalda. Una ficha no es una fuente.","<p>The map lets a reader trace each number to a labeled result and to the matching SPSS output: D6 to the Descriptives N, F6 to the Mean, I6 to the Maximum, and G6:G20 to the parity table. Type Yes in the last column only after you reopen both files.</p>":"<p>El mapa permite a quien lee rastrear cada número hasta un resultado etiquetado y hasta el resultado correspondiente de SPSS: D6 con el N de Descriptives, F6 con Mean, I6 con Maximum y G6:G20 con la tabla de paridad. Escribe Yes en la última columna solo después de volver a abrir ambos archivos.</p>","Descriptive Statistics!I6":"Descriptive Statistics!I6","A number I rounded by hand":"Un número que redondeé a mano","Descriptive Statistics!D6":"Descriptive Statistics!D6","Excel-SPSS Parity!G6:G20":"Excel-SPSS Parity!G6:G20","Descriptive Statistics!F6":"Descriptive Statistics!F6","118 valid delivery times":"118 tiempos de entrega válidos","43.67-minute mean":"media de 43.67 minutos","142-minute maximum":"máximo de 142 minutos","15 of 15 parity checks passed":"15 de 15 comprobaciones de paridad pasaron","If it is in the note, it needs a cell. A number worked out by hand cannot be traced or rechecked.":"Si está en la nota, necesita una celda. Un número calculado a mano no se puede rastrear ni volver a comprobar.","F6 holds the mean. The valid count is in D6.":"F6 contiene la media. El conteo válido está en D6.","D6 holds the valid count. The mean is in F6.":"D6 contiene el conteo válido. La media está en F6.","I6 holds the maximum. The mean is in F6.":"I6 contiene el máximo. La media está en F6.","F6 holds the mean. The maximum is in I6.":"F6 contiene la media. El máximo está en I6.","Before you call it done":"Antes de darlo por terminado","Valid plus missing equals 120 in every row. All 15 parity rows pass. Every number in the note has a cell. No source value was changed.":"Válidos más faltantes es igual a 120 en todas las filas. Las 15 filas de paridad pasan. Cada número de la nota tiene una celda. No se cambió ningún valor de la fuente.","Save the workbook and the SPSS output (.spv) under the required names, close both, reopen them, and confirm the results still appear.":"Guarda el libro y los resultados de SPS

    els.secondary = h('button', { type: 'button', class: 'lk-btn ghost', hidden: true });
    els.primary = h('button', { type: 'button', class: 'lk-btn' });
    els.card = h('section', { class: 'lk-card', 'aria-label': strip(tr(L.title)) }, els.head, els.body,
      h('div', { class: 'lk-foot' }, els.bubble, h('div', { class: 'lk-actions' }, els.secondary, els.primary)));
    els.rail = h('aside', { class: 'lk-rail', 'aria-label': ui('caseFile') });
    root.append(h('div', { class: 'lk-app' }, top, h('main', { class: 'lk-stage' }, els.card, els.rail)));
    if (!els.keyBound) { document.addEventListener('keydown', onKey); els.keyBound = true; }
    rail();
    renderPill();
  }

  function onKey(e) {
    if (e.key === 'Escape' && els.sheet) { closeSheet(); return; }
    if (e.key !== 'Enter' || els.sheet) return;
    const t = e.target;
    if (t.closest && t.closest('button, a, textarea, select, [role="slider"], [role="button"]')) return;
    if (t.tagName === 'INPUT' && t.type !== 'text') return;
    if (!els.primary.disabled && !els.primary.hidden) { e.preventDefault(); els.primary.click(); }
  }

  function go(i, initial, keep) {
    i = clamp(i, 0, L.screens.length - 1);
    const dir = cur && i < cur.sc._i ? 'back' : 'fwd';
    S.i = i; save({ nav: true });
    const sc = L.screens[i];
    const a = api(sc);
    els.head.replaceChildren(...[
      h('button', { type: 'button', class: 'lk-back', disabled: i === 0, onclick: () => go(i - 1) }, ui('back')),
      h('span', null, strip(tr(L.parts[sc.part]))),
      h('span', { class: 'lk-tier', 'data-tier': sc.tier }, sc.tier),
      LANG !== 'en' ? h('span', { class: 'lk-ai' }, ui('aiNote')) : null,
      h('span', { class: 'lk-count' }, `${i + 1} / ${L.screens.length}`)].filter(Boolean));
    const col = h('div', { class: `lk-col${initial ? '' : ` enter-${dir}`}`, tabindex: -1 });
    els.body.replaceChildren(col);
    if (sc.title) col.append(h('h2', null, ...said(sc.title)));
    if (sc.refs && L.toolkit) col.append(h('div', { class: 'lk-refs' }, sc.refs.map((r) => refChip(r, i))));
    if (sc.art) col.append(h('div', { class: 'lk-art', html: sc.art }));
    if (sc.scene) col.append(h('div', { class: 'lk-scene', 'data-label': ui('scene') }, h('p', null, ...said(sc.scene))));
    for (const p of [].concat(sc.body || [])) col.append(h('p', null, ...said(p)));
    if (sc.callout) col.append(h('div', { class: 'lk-callout' }, ...said(sc.callout)));
    let fig = null;
    if (sc.figure) { const fe = h('div', { class: 'lk-figure' }); col.append(fe); fig = sc.figure(fe, a) || null; }
    if (sc.prompt) col.append(h('p', { class: 'lk-prompt' }, ...said(sc.prompt)));
    const q = h('div', { class: 'lk-q' });
    col.append(q);
    for (const p of [].concat(sc.after || [])) col.append(h('p', { class: 'lk-caption' }, ...said(p)));

    let ctrl = null;
    if (sc.type === 'choice') ctrl = choiceWidget(q, sc, a);
    else if (sc.type === 'tiles') ctrl = tilesWidget(q, sc, a);
    else if (sc.type === 'blanks') ctrl = blanksWidget(q, sc, a);
    else if (sc.type === 'custom') ctrl = sc.render(q, a, fig);
    else if (sc.type === 'poll') ctrl = pollWidget(q, sc, a);
    cur = { sc, ctrl, q, fig, mode: null, api: a };
    if (EMBED) post({ type: 'lk:screen', i, id: sc.id, title: strip(tr(sc.title || '')), refs: sc.refs || [], part: sc.part, tier: sc.tier, done: !!S.res[sc.id] });

    bubble(null);
    if (graded(sc) && S.res[sc.id]) { ctrl.reveal(); lock(); setMode('done'); }
    else if (sc.type === 'poll') {
      if (S.polls[sc.id] != null) { ctrl.mark(S.polls[sc.id]); const o = sc.options[S.polls[sc.id]]; bubble(said(o.reply || sc.reply || ui('noted')), 'neutral'); setMode('read', { keepBubble: true }); }
      else setMode('poll');
    } else {
      setMode(graded(sc) ? 'idle' : 'read');
      if (keep !== undefined && ctrl?.restore) { ctrl.restore(keep); refreshPrimary(); }
    }
    progress();
    rail();
    if (!initial) {
      col.focus({ preventScroll: true });
      els.card.scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' });
    }
  }

  function lock() { cur.q.inert = true; cur.q.classList.add('locked'); }

  // Accepts an English lesson string (translated here), a list of nodes, or null to hide.
  function bubble(content, tone) {
    if (!content) { els.bubble.hidden = true; els.bubble.replaceChildren(); return; }
    els.bubble.hidden = false;
    els.bubble.dataset.tone = tone || 'neutral';
    els.bubble.replaceChildren(...(Array.isArray(content) ? content : rich(content)));
    restart(els.bubble, 'pop-in');
  }

  function btn(el, label, fn, tone, disabled) {
    if (!label) { el.hidden = true; el.onclick = null; return; }
    el.hidden = false;
    el.textContent = label;
    el.onclick = fn;
    el.disabled = !!disabled;
    if (tone) el.dataset.tone = tone; else el.removeAttribute('data-tone');
  }

  function refreshPrimary() { if (cur.mode === 'idle') els.primary.disabled = !(cur.ctrl && cur.ctrl.ready()); }

  function setMode(m, info = {}) {
    cur.mode = m;
    const sc = cur.sc;
    els.card.dataset.state = m === 'ok' ? 'ok' : m === 'warn' ? 'warn' : 'idle';
    const last = sc._i === L.screens.length - 1;
    const nextLabel = last ? (L.finishLabel ? tr(L.finishLabel) : ui('finish')) : ui('continue');
    const why = sc.why ? ui('why') : null;
    if (!info.keepBubble && !['ok', 'warn', 'revealed'].includes(m)) bubble(null);
    switch (m) {
      case 'read': btn(els.primary, nextLabel, next); btn(els.secondary, null); break;
      case 'poll': btn(els.primary, ui('continue'), null, null, true); btn(els.secondary, null); break;
      case 'idle': btn(els.primary, ui('check'), check, null, !cur.ctrl.ready()); btn(els.secondary, null); break;
      case 'ok': bubble(info.nodes, 'ok'); btn(els.primary, nextLabel, next, 'ok'); btn(els.secondary, why, openWhy); break;
      case 'warn': bubble(info.nodes, 'warn'); btn(els.primary, ui('tryAgain'), tryAgain, 'warn'); btn(els.secondary, ui('seeAnswer'), seeAnswer); break;
      case 'revealed': bubble(ui('revealed'), 'neutral'); btn(els.primary, sc.why ? ui('why') : nextLabel, sc.why ? openWhy : next); btn(els.secondary, sc.why ? ui('skipWhy') : null, next); break;
      case 'done': btn(els.primary, nextLabel, next); btn(els.secondary, why, openWhy); break;
    }
  }

  function award(kind) {
    const sc = cur.sc;
    const partDone = () => L.screens.filter((x) => x.part === sc.part && graded(x)).every((x) => S.res[x.id]);
    const wasDone = partDone();
    S.res[sc.id] = kind;
    const gained = kind === 'first' ? 10 : kind === 'retry' ? 5 : 0;
    S.pts += gained;
    if (sc.ledger) S.ledger[sc.ledger.id] = typeof sc.ledger.value === 'function' ? sc.ledger.value(S) : sc.ledger.value;
    save(); progress(); rail();
    floatPoints(gained);
    if (!wasDone && partDone()) setTimeout(() => toast(`<b>✓</b> ${ui('partDone', { n: sc.part + 1, name: strip(tr(L.parts[sc.part])) })}`), 450);
    return gained;
  }

  function check() {
    const sc = cur.sc;
    const r = cur.ctrl.check();
    if (r.ok) {
      syncEvent('correct', { first: !S.tries[sc.id], tries: (S.tries[sc.id] || 0) + 1 });
      award(S.tries[sc.id] ? 'retry' : 'first');
      lock();
      let praise = r.praise || sc.praise;
      if (typeof praise === 'function') praise = praise(S);
      const praiseList = ui('praise');
      setMode('ok', { nodes: praise ? said(praise) : rich(praiseList[sc._i % praiseList.length]) });
      burst(els.primary);
    } else {
      S.tries[sc.id] = (S.tries[sc.id] || 0) + 1;
      syncEvent('wrong', { tries: S.tries[sc.id], hint: r.hint ? strip(r.hint).slice(0, 160) : '' });
      save();
      setMode('warn', { nodes: r.hint ? said(r.hint) : rich(r.uiHint || ui('notQuite')) });
      if (!reduced()) restart(cur.q, 'shake');
    }
  }
  function tryAgain() { cur.ctrl.reset?.(); setMode('idle'); cur.ctrl.focus?.(); }
  function seeAnswer() { syncEvent('revealed', {}); cur.ctrl.reveal(); award('revealed'); lock(); setMode('revealed'); }
  function next() {
    const i = cur.sc._i;
    if (i < L.screens.length - 1) go(i + 1);
    else { syncEvent('finish', { points: S.pts }); if (L.onFinish) L.onFinish(S, api(cur.sc)); }
    syncNow();
  }

  function progress() {
    els.pts.querySelector('.n').textContent = S.pts;
    L.parts.forEach((p, pi) => {
      const list = L.screens.filter((sc) => sc.part === pi);
      const done = list.filter((sc) => (graded(sc) ? S.res[sc.id] : sc._i < S.i || (sc.type === 'poll' && S.polls[sc.id] != null))).length;
      els.segs[pi].querySelector('i').style.width = `${Math.round(100 * done / list.length)}%`;
      if (cur && cur.sc.part === pi) els.segs[pi].setAttribute('aria-current', 'step'); else els.segs[pi].removeAttribute('aria-current');
    });
  }

  function railContent() {
    const cf = L.caseFile || {};
    const panels = [];
    if (cf.title) {
      const p = h('section', { class: 'lk-panel' }, h('h3', null, strip(tr(cf.title))));
      for (const line of [].concat(cf.intro || [])) p.append(h('p', null, ...rich(tr(line))));
      if (cf.table) {
        p.append(h('table', { class: 'lk-facts' },
          h('thead', null, h('tr', null, cf.table.head.map((c) => h('th', null, ...rich(tr(c)))))),
          h('tbody', null, cf.table.rows.map((r) => h('tr', null, r.map((c) => h('td', null, ...rich(tr(c)))))))));
      }
      if (cf.notes) p.append(h('ul', { class: 'lk-notes' }, cf.notes.map((n) => h('li', null, ...rich(tr(n))))));
      panels.push(p);
    }
    if (L.ledger) {
      panels.push(h('section', { class: 'lk-panel' }, h('h3', null, strip(tr(L.ledgerTitle || 'Evidence so far'))),
        h('ul', { class: 'lk-ledger' }, L.ledger.map((it) => {
          const v = S.ledger[it.id];
          return h('li', null, h('span', { class: 'k' }, ...rich(tr(it.label))), h('span', { class: 'v' + (v ? '' : ' pending') }, ...rich(v ? tr(v) : (it.pending ? tr(it.pending) : ui('notYet')))));
        }))));
    }
    const gradedList = L.screens.filter(graded);
    const firsts = gradedList.filter((sc) => S.res[sc.id] === 'first').length;
    const done = gradedList.filter((sc) => S.res[sc.id]).length;
    const restartBtn = h('button', { type: 'button', class: 'lk-restart' }, ui('restart'));
    restartBtn.addEventListener('click', () => {
      if (restartBtn.dataset.armed) { S = fresh(); Sync.reset = true; save(); closeSheet(); shell(); go(0); }
      else { restartBtn.dataset.armed = '1'; restartBtn.textContent = ui('restartConfirm'); }
    });
    panels.push(h('section', { class: 'lk-panel' }, h('h3', null, ui('progressTitle')),
      h('p', null, ui('progressLine', { done, total: gradedList.length, first: firsts })), restartBtn));
    return panels;
  }
  function rail() { if (els.rail) els.rail.replaceChildren(...railContent()); }

  function sheet(title, nodes, onClose, opts = {}) {
    closeSheet();
    const x = h('button', { type: 'button', class: 'x', 'aria-label': ui('close') }, '×');
    const card = h('div', { class: 'lk-sheet-card' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': strip(title) },
      h('header', null, h('h3', null, ...rich(title)), x), h('div', { class: 'lk-sheet-body' }, nodes));
    const wrap = h('div', { class: 'lk-sheet' }, card);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) closeSheet(); });
    x.addEventListener('click', closeSheet);
    els.sheet = wrap;
    els.sheetClose = onClose;
    els.sheetReturn = document.activeElement;
    document.body.append(wrap);
    x.focus();
  }
  function closeSheet() {
    if (!els.sheet) return;
    els.sheet.remove();
    els.sheet = null;
    const cb = els.sheetClose; els.sheetClose = null;
    if (cb) cb();
    els.sheetReturn?.focus?.({ preventScroll: true });
  }
  function openWhy() {
    const sc = cur.sc;
    const en = typeof sc.why === 'function' ? sc.why(S) : sc.why;
    const t = tr(en);
    const nodes = rich(t);
    if (LANG !== 'en' && SHOW_EN && t !== en) nodes.push(h('details', { class: 'lk-en-block', lang: 'en' }, h('summary', null, ui('english')), ...rich(en)));
    if (sc.refs && L.toolkit) nodes.push(h('div', { class: 'lk-why-more' }, ui('readMore'), sc.refs.map((r) => refChip(r, sc._i))));
    sheet(ui('whyTitle'), nodes, () => { if (cur.mode === 'revealed') setMode('done'); });
  }
  function openCase() {
    const r = h('div', { class: 'lk-rail' }, railContent());
    sheet(strip(tr(L.caseFile?.title)) || ui('caseFile'), [r]);
  }

  globalThis.LessonKit = { define, h, s, rich, strip, tr, ui, Stats, Charts, slider, readout, chip, lookup, explorer, accept, sheet, toast, confetti, burst, openToolkit };
})();

</script>
<script>
globalThis.LESSON_TOOLKIT = {"title":"Orientation; readiness; business-question framing","sections":[{"id":"how-to-use-this-toolkit","level":2,"title":"How to use this toolkit","short":"How to use this toolkit","html":"<p>This is a self-study chapter for the first session. Work through the five numbered sections in order. First identify the decision and define what would count as success. Then inspect the evidence, reproduce a small calculation in Excel 365 and SPSS, and write a bounded recommendation. The <b>Try it</b> questions are ungraded; attempt each before reading its answer.</p>\n<p>The course has <b>no required textbook</b>. The supplied crosswalk headings from Albright and Winston, Field, and Knaflic are <b>scope cues</b>, not a claim that you have read those chapters. Core cues here concern the role of business analytics, spreadsheet practice, and getting oriented in SPSS. Measurement, research design, and communication headings serve as brief optional bridges. This chapter is an original synthesis grounded in the open and primary sources actually cited below; its case and exercises are fictional and original.</p>\n<p>This source has <b>no stable PDF page numbers</b>. Future slides, speaker notes, PNP materials, or paginated versions should cross-reference stable numbered section headings such as <b>§3.2</b>, then add page numbers <i>after</i> pagination. Later sessions develop displays, distributions, probability, sampling, tests, and regression. Those methods are signposts here, not prerequisites.</p>"},{"id":"case","level":2,"title":"The running case: Cedar Cup pickup orders","short":"The running case: Cedar Cup pick…","html":"<p><b>Cedar Cup is entirely fictional.</b> Its campus café manager is deciding whether to <b>pilot a staffed handoff point</b> for mobile pickup orders. The manager worries that customers reach the counter but do not receive their drinks promptly. The stakeholder is the manager, who controls staffing; customers and staff are also affected stakeholders.</p>\n<p>Define the <b>population of interest</b> as all Cedar Cup mobile pickup orders placed during a proposed two-week pilot, rather than all café purchases. Exclude canceled orders only under a rule stated before analysis. An order does not become ineligible merely because a timestamp is missing. The <b>unit of analysis</b> is one order. Eight orders from two recent morning shifts form a small, conveniently selected readiness extract—not a random sample of the proposed pilot population. Each <code>order_id</code> should identify one order. Waiting time is handoff time minus recorded arrival time, in minutes. “Within five minutes” means <b>at most</b> five minutes, including exactly five. Report missing outcomes separately and predefine how they affect any all-order KPI.</p>\n<div class=\"tbl\"><table><thead><tr><th>Order ID</th><th>Morning shift</th><th>Wait (minutes)</th><th>Within 5 minutes?</th></tr></thead><tbody><tr><td>C101</td><td>Tuesday</td><td>2</td><td>1</td></tr><tr><td>C102</td><td>Tuesday</td><td>4</td><td>1</td></tr><tr><td>C103</td><td>Tuesday</td><td>6</td><td>0</td></tr><tr><td>C104</td><td>Tuesday</td><td>8</td><td>0</td></tr><tr><td>C105</td><td>Wednesday</td><td>3</td><td>1</td></tr><tr><td>C106</td><td>Wednesday</td><td>5</td><td>1</td></tr><tr><td>C107</td><td>Wednesday</td><td>7</td><td>0</td></tr><tr><td>C108</td><td>Wednesday</td><td>9</td><td>0</td></tr></tbody></table></div>\n<p>These eight rows are the <b>checked analysis table</b>. The illustrative source export initially contained nine rows because it repeated C104. An analyst confirmed that the second C104 row was a duplicate export record, retained one source record, and documented that decision. Never remove repeated IDs automatically: two genuine events could require a different data definition.</p>\n<p><b>Observed evidence:</b> four of eight checked orders met the five-minute definition. <b>Limitations:</b> the extract covers only two mornings; recorded arrival may differ from when a customer actually reached the pickup point; and it contains no handoff-point pilot or labor-cost observations. It can describe these eight orders. It cannot estimate the intervention’s effect or prove its cost is acceptable.</p>"},{"id":"1","level":2,"title":"1. Turn a concern into a decision question","short":"1. Turn a concern into a decisio…","html":"<p><b>Why these scores:</b> A precise decision, measure, and claim determine whether any subsequent analysis is useful.</p>"},{"id":"1.1","level":3,"title":"1.1 Stakeholder, action, KPI, target, and guardrail","short":"1.1. Stakeholder, action, KPI, t…","html":"<p>“Pickup is slow” is a <b>managerial concern</b>, not yet an analysis question. A usable question names the action and the evidence that would inform it: <i>Should Cedar Cup keep the staffed handoff point after a defined two-week pilot?</i> The <b>KPI</b> (key performance indicator) is the proportion of eligible mobile pickup orders handed over within five minutes of recorded arrival. Its unit is a percentage of <b>orders</b>, not minutes or customers. A <b>target</b> says what result the manager seeks: at least <b>75%</b> within five minutes. A <b>guardrail</b> limits an unwanted trade-off: additional handoff labor cost no greater than <b>$1.50 per eligible order</b>. These thresholds are fictional planning choices, not established industry benchmarks.</p>\n<div class=\"key\"><b>Write the denominator and boundary rule before calculating a rate.</b> Here, each eligible order enters the denominator once, and a five-minute wait counts as meeting the KPI.</div>\n<p>Work the baseline by hand. The eight waits are 2, 4, 6, 8, 3, 5, 7, and 9 minutes. Four—2, 4, 3, and 5—are at most five. Therefore:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mtext>Observed within-five-minute rate</mtext><mo>=</mo><mfrac><mrow><mn>4</mn><mtext> eligible orders within five minutes</mtext></mrow><mrow><mn>8</mn><mtext> eligible orders</mtext></mrow></mfrac><mo>=</mo><mn>0.50</mn><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi><mi mathvariant=\"normal\">.</mi></mrow><annotation encoding=\"application/x-tex\">\\text{Observed within-five-minute rate}\n=\\frac{4\\text{ eligible orders within five minutes}}\n{8\\text{ eligible orders}}\n=0.50=50\\%.</annotation></semantics></math></span></div></p>\n<p>The observed rate is <b>25 percentage points</b> below the 75% target: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>75</mn><mi mathvariant=\"normal\">%</mi><mo>−</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi><mo>=</mo><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">75\\%-50\\%=25</annotation></semantics></math></span> percentage points. Reaching 75% <i>among eight orders</i> would require six successes, or two more than observed. That arithmetic does <b>not</b> say the proposed staffing change will produce two extra successes.</p>\n<p>A <b>testable claim</b> for the proposed pilot is: <i>During the two-week pilot, the eligible-order KPI will be at least 75%, while additional handoff labor cost will be at most $1.50 per eligible order.</i> To test it, the team must define pilot dates, count every eligible order under the same time rule, and record incremental labor cost. A claim about <i>improvement caused by</i> staffing needs a credible comparison design as well; a before-and-after difference alone can reflect changes in demand or shift conditions. Distinguishing observational evidence from an intervention is central to sound research design (Illowsky &amp; Dean, 2023b).</p>\n<p><b>Failure mode:</b> Reporting “four fast pickups” without the eight-order denominator, or silently changing “within five” to “under five,” changes the meaning of the evidence. Calling 50% “the pilot result” is also wrong: no pilot has occurred in the case.</p>\n<p><b>Try it — ungraded.</b> In the same eight-order extract, suppose the manager instead defines success as <b>under</b> five minutes. What rate results, and why is this not the original KPI?</p>\n<p><b>Explained answer.</b> Only waits of 2, 3, and 4 are under five. The rate becomes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>0.375</mn><mo>=</mo><mn>37.5</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">3/8=0.375=37.5\\%</annotation></semantics></math></span>. The five-minute order changes category. This is a new boundary rule, not a recalculation of the previously agreed “at most five” KPI.</p>"},{"id":"1.2","level":3,"title":"1.2 Define the population and the evidence needed","short":"1.2. Define the population and t…","html":"<p>A <b>population</b> is the complete set of units to which a claim is meant to apply; a <b>sample</b> is the units actually observed. In this case, the proposed two-week pilot’s eligible mobile pickup orders are the decision population. The eight historical orders are observed units from a different period. A <b>variable</b> records a property of each unit: <code>wait_min</code> is quantitative, whereas <code>within_5</code> is a categorical yes/no outcome coded 1 or 0. Giving categories numeric codes does not turn them into measured minutes. These distinctions help prevent a convenient extract from being mistaken for the full population (Illowsky &amp; Dean, 2023a).</p>\n<p>For a complete example, suppose the pilot later records 40 eligible orders, 30 within five minutes, and $48 in <b>additional</b> handoff labor. The KPI would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30</mn><mi mathvariant=\"normal\">/</mi><mn>40</mn><mo>=</mo><mn>75</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">30/40=75\\%</annotation></semantics></math></span>. Additional cost per eligible order would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">$</mi><mn>48</mn><mi mathvariant=\"normal\">/</mi><mn>40</mn><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>1.20</mn></mrow><annotation encoding=\"application/x-tex\">\\$48/40=\\$1.20</annotation></semantics></math></span>. Those invented pilot figures would meet both stated thresholds <i>for those 40 orders</i>. They would not, by themselves, establish that staffing <b>caused</b> the result: day, volume, and order mix might differ. The calculation also depends on using the same 40 eligible orders as each denominator. This hypothetical calculation is practice, <b>not</b> a second observed Cedar Cup dataset.</p>\n<p><b>Failure mode:</b> Using all café transactions to divide a count of timely <i>mobile pickups</i> makes the rate artificially small. Conversely, excluding inconvenient eligible orders without a documented rule can make it look artificially large.</p>\n<p><b>Try it — ungraded.</b> A manager reports 12 timely handoffs among 15 orders with timestamps. There were also three mobile orders whose arrival times were not recorded. Can you report “12 of 18 within five minutes”?</p>\n<p><b>Explained answer.</b> No. All 18 mobile orders remain eligible, but three outcomes are unknown under this definition. Report <b>12 of 15 timestamp-complete orders</b>, or 80% among measured orders, alongside <b>three eligible orders with missing measurement</b>. Investigate why they are missing and apply a prespecified missing-outcome rule before claiming a rate for all 18.</p>"},{"id":"2","level":2,"title":"2. Check what each row means","short":"2. Check what each row means","html":"<p><b>Why these scores:</b> A correct formula cannot repair duplicated units, missing timestamps, or an undocumented export.</p>"},{"id":"2.1","level":3,"title":"2.1 Grain, provenance, and measurement checks","short":"2.1. Grain, provenance, and meas…","html":"<p><b>Grain</b> means what one row represents. The checked Cedar Cup table has <b>one row per eligible order</b>. Its key is <code>order_id</code>. <b>Provenance</b> is the record of where data came from and how they changed: for example, a dated mobile-order export, the timestamp fields used, the duplicate C104 investigation, and the resulting checked table. Keep the unchanged source export separately from the analysis copy. This makes a correction inspectable rather than invisible.</p>\n<p>Before opening software, set out the calculation. Let <code>arrival_time</code> and <code>handoff_time</code> be recorded clock times for the same order. Compute <code>wait_min</code> as their difference in minutes, provided both exist and handoff follows arrival. Then set <code>within_5</code> to 1 if <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>≤</mo><mtext>wait_min</mtext><mo>≤</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">0\\leq\\text{wait\\_min}\\leq5</annotation></semantics></math></span>, otherwise 0 for a valid wait. For C106, an arrival at 09:10 and handoff at 09:15 give <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>09</mn><mo lspace=\"0em\" rspace=\"0em\">:</mo><mn>15</mn><mo>−</mo><mn>09</mn><mo lspace=\"0em\" rspace=\"0em\">:</mo><mn>10</mn><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">09{:}15-09{:}10=5</annotation></semantics></math></span> minutes, so <code>within_5 = 1</code>. If arrival is blank, the outcome is <b>missing</b>, not 0. Confirm timestamp time zones and whether an order can cross a date boundary before calculating a larger file.</p>\n<div class=\"key\"><b>Validate the unit count independently of the KPI.</b> The initial export has nine rows but eight distinct order IDs. Investigating the repeated C104 yields eight checked orders; counting its extra export row as another order would change the denominator without adding a customer decision unit.</div>\n<p>A compact check record for this case is:</p>\n<div class=\"tbl\"><table><thead><tr><th>Check</th><th>Expected in this teaching extract</th><th>If it fails</th></tr></thead><tbody><tr><td>Checked rows</td><td>8</td><td>Reconcile additions or exclusions</td></tr><tr><td>Distinct <code>order_id</code> values</td><td>8</td><td>Inspect repeated keys against source events</td></tr><tr><td>Valid, nonmissing waits</td><td>8</td><td>Investigate timestamp coverage and ordering</td></tr><tr><td><code>within_5</code> successes</td><td>4</td><td>Recheck the five-minute boundary and calculations</td></tr></tbody></table></div>\n<p>The extract’s two mornings are convenient, not randomly chosen. Even perfectly entered values could poorly represent evenings, busy days, or the proposed pilot. Selection and measurement problems are different: correcting C104 addresses duplication but not generalizability. Sampling and data variation are developed later in the course (Illowsky &amp; Dean, 2023a).</p>\n<p><b>Failure mode:</b> “Remove duplicates” is not a complete cleaning rule. A repeated order ID might represent an erroneous repeated export, two status events, or an ID-system defect. Determine which occurred and preserve the decision trail.</p>\n<p><b>Try it — ungraded.</b> Suppose the source has one additional row for C109, but its handoff timestamp is blank. Should C109 be coded <code>within_5 = 0</code>?</p>\n<p><b>Explained answer.</b> No. A missing handoff timestamp does not establish a wait longer than five minutes. Mark its outcome missing, report the missing-record count, and investigate it. A policy for eligible orders with missing outcomes must be stated before using their data in a performance claim.</p>"},{"id":"3","level":2,"title":"3. Reproduce the small result in Excel 365","short":"3. Reproduce the small result in…","html":"<p><b>Why these scores:</b> A small, auditable workbook is a practical readiness check and a foundation for later analyses.</p>"},{"id":"3.1","level":3,"title":"3.1 Set up the workbook and calculate the rate","short":"3.1. Set up the workbook and cal…","html":"<p>Start with <b>inputs, units, and expected result</b>. Enter the eight checked rows in columns <code>order_id</code>, <code>shift</code>, and <code>wait_min</code>; create an empty <code>within_5</code> column for a formula. <code>wait_min</code> uses minutes; <code>within_5</code> will use 1 for yes and 0 for no. Expect eight orders, four successes, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">4/8=50\\%</annotation></semantics></math></span>. Keep a separate note identifying the source export and the C104 resolution. Do not type over the original export.</p>\n<p>In Excel 365, select the four headers, three populated input columns, and eight rows; create an Excel table named <code>Pickup</code>, leaving <code>within_5</code> cells blank. Tables support <b>structured references</b> such as <code>Pickup[wait_min]</code>, which identify a column by name and adjust when table rows change (Microsoft, n.d.-a). Enter this formula in the first data cell under <code>within_5</code> and confirm Excel fills the calculated column:</p>\n<pre><code>=IF([@wait_min]&lt;=5,1,0)</code></pre>\n<p><code>[@wait_min]</code> means the wait in <b>this row</b>. <code>IF</code> returns 1 when the condition is true and 0 otherwise. With the eight <b>already validated, nonnegative, nonmissing</b> waits supplied here, the results are <code>1, 1, 0, 0, 1, 1, 0, 0</code>. This formula is <b>not</b> a safe missing-value policy for an unclean file: validate waits and handle missing inputs explicitly before extending it.</p>\n<p>Calculate outside the table:</p>\n<pre><code>=COUNT(Pickup[wait_min])\n=SUM(Pickup[within_5])\n=SUM(Pickup[within_5])/COUNT(Pickup[wait_min])</code></pre>\n<p>The first formula returns <b>8 numeric waits</b>; the second returns <b>4 successes</b>; the third returns <b>0.5</b>, displayed as <b>50%</b> when formatted as a percentage. <code>COUNT</code> here checks how many waits are numeric; it is an appropriate denominator <b>only because all eight checked eligible orders have valid waits</b>. If that check fails, stop and resolve eligibility and missingness rather than quietly changing the denominator.</p>\n<p>Make an independent check with a different route:</p>\n<pre><code>=COUNTIF(Pickup[wait_min],\"&lt;=5\")</code></pre>\n<p>It should return <b>4</b>. <code>COUNTIF</code> counts cells meeting one stated condition (Microsoft, n.d.-b). Check that <code>COUNTIF</code>’s four agrees with <code>SUM</code>’s four, then inspect C106’s boundary value of five by eye. Agreement is reassuring, but two formulas can share a mistaken definition; the written KPI is the final check.</p>\n<p><b>Failure mode:</b> A percentage formatted as <code>50%</code> may conceal a bad denominator. If nine exported rows include the duplicate C104, a formula over that range answers a different question. Verify the grain and row count before trusting the display.</p>\n<p><b>Try it — ungraded.</b> After checking the source, an analyst corrects C103’s wait from six minutes to five. What should the success count and rate become for the <i>same eight orders</i>?</p>\n<p><b>Explained answer.</b> C103 changes from 0 to 1 because five meets “at most five.” Successes become <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo>+</mo><mn>1</mn><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">4+1=5</annotation></semantics></math></span>; the denominator remains eight; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>0.625</mn><mo>=</mo><mn>62.5</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">5/8=0.625=62.5\\%</annotation></semantics></math></span>. The 12.5-percentage-point change from a one-minute correction shows why boundary records merit attention. It does not make the intervention effective.</p>"},{"id":"3.2","level":3,"title":"3.2 Make the workbook inspectable","short":"3.2. Make the workbook inspectable","html":"<p>Separate <b>raw source</b>, <b>checked order table</b>, and <b>summary</b> in clearly named sheets or files. Add a short readme giving the as-of date, who supplied the export, the unit, definitions, the C104 decision, and unresolved questions. Preserve formulas so another analyst can trace 50% back to four individual orders. A spreadsheet is a model when its inputs, rules, and outputs encode a business question—not merely when it has many formulas.</p>\n<p>For example, a reviewer can trace C106 through <code>wait_min = 5</code>, <code>within_5 = 1</code>, the success sum of 4, and the denominator of 8. Then the reviewer can independently count the four waits at or below five in the source table. If a later export has 80 rows, that same trail should reveal whether the added rows are eligible and whether the definitions stayed fixed. Structured references can make expanding tables easier, but they do not validate the new rows for you (Microsoft, n.d.-a).</p>\n<p><b>Failure mode:</b> Pasting a screenshot of “50%” into a presentation without the definition, count, and source date makes it hard to audit or responsibly reuse. Do not put customer identifiers in a broadly shared presentation merely because they appear in an operational export.</p>\n<p><b>Try it — ungraded.</b> Which is the stronger summary label: “Pickup success: 50%” or “4 of 8 checked mobile pickup orders handed over within five minutes; two morning shifts”? Explain.</p>\n<p><b>Explained answer.</b> The second states the count, denominator, rule, and coverage. The first could be mistaken for an all-orders, all-hours, or pilot-wide result.</p>"},{"id":"4","level":2,"title":"4. Get oriented in SPSS without losing the question","short":"4. Get oriented in SPSS without…","html":"<p><b>Why these scores:</b> Tool readiness matters, but knowing where results came from matters more than memorizing menus.</p>"},{"id":"4.1","level":3,"title":"4.1 Import, inspect, and produce one check","short":"4.1. Import, inspect, and produc…","html":"<p>Before tool clicks, know the input: <b>eight checked order rows</b>, with <code>order_id</code> as an identifier, <code>shift</code> as a category, <code>wait_min</code> in minutes, and <code>within_5</code> as 0/1. The expected frequency output is four 0s and four 1s; the business interpretation is <b>four of eight</b> within five minutes. The Excel result supplies an independent comparison, not a reason to ignore SPSS warnings.</p>\n<p>Save a copy of the checked table as an Excel workbook with one header row. In SPSS, use <b>File → Import Data → Excel</b>, choose the intended worksheet, and set the first row as variable names. IBM notes that the first worksheet is read by default unless another is selected, so inspect the choice before proceeding (IBM, n.d.-a). In <b>Data View</b>, check eight cases—SPSS’s term for rows—and inspect C106. In <b>Variable View</b>, check names, types, labels, missing-value settings, and measurement levels. Set the order ID as a string identifier; describe <code>shift</code> and <code>within_5</code> as categorical, and <code>wait_min</code> as a numeric minute measure. Variable View stores these descriptions with the data file (IBM, n.d.-b).</p>\n<p>For a reproducible check, open a <b>Syntax Editor</b> and run this command against the active checked dataset:</p>\n<pre><code>FREQUENCIES VARIABLES=within_5.</code></pre>\n<p>Read it one step at a time: <code>FREQUENCIES</code> requests counts; <code>VARIABLES=within_5</code> selects the outcome column; the period ends the SPSS command. Expect <b>0: four cases; 1: four cases; valid total: eight</b>. Divide the count coded 1 by the valid total: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">4/8=50\\%</annotation></semantics></math></span>. The <b>Viewer</b> holds the resulting table; it is output, not the underlying data. IBM documents both the distinct Data Editor, Viewer, and Syntax Editor roles and the <code>FREQUENCIES</code> command (IBM, n.d.-c, n.d.-d).</p>\n<p><b>Failure mode:</b> An import can look successful while reading the wrong worksheet or interpreting a code as text. A frequency table showing only seven valid outcomes calls for investigation, not immediate celebration that the software “ran.”</p>\n<p><b>Try it — ungraded.</b> SPSS shows four 1s, three 0s, and one missing <code>within_5</code>. Does its “50% of all eight cases” match the originally checked dataset?</p>\n<p><b>Explained answer.</b> No. The original dataset has four 1s <b>and four 0s</b>, with no missing outcomes. Although <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">4/8=50\\%</annotation></semantics></math></span> uses eight cases, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi mathvariant=\"normal\">/</mi><mn>7</mn><mo>≈</mo><mn>57.1</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">4/7\\approx57.1\\%</annotation></semantics></math></span> of the seven valid outcomes gives another possible percentage. Neither discrepancy should be accepted until the missing value and import are reconciled against the checked eight rows.</p>"},{"id":"4.2","level":3,"title":"4.2 Save distinct data, syntax, and output artifacts","short":"4.2. Save distinct data, syntax,…","html":"<p>SPSS has several artifacts with different purposes. Save the <b>data file</b> so the checked cases and variable definitions can be reopened; save the <b>syntax</b> so a colleague can rerun the frequency request; save the <b>Viewer output</b> so a colleague can inspect what that run displayed. If an accessible report is needed, export selected output and also supply its small count table as text. An exported image alone is not a substitute for data and syntax. IBM describes saving SPSS data with its variable dictionary and exporting Viewer output to other formats (IBM, n.d.-e, n.d.-f).</p>\n<p>For this case, sensible names might be <code>cedar_checked_orders.sav</code>, <code>cedar_readiness.sps</code>, and <code>cedar_readiness_output.spv</code>. Reopen the saved data and rerun the syntax. The check succeeds if the Viewer again reports <b>four zeros, four ones, eight valid cases</b>. Record the extract date and duplicate decision outside the numeric output. Never use the sample file names as evidence that customer-level data are approved for unrestricted sharing.</p>\n<p><b>Failure mode:</b> Saving only the output preserves a result without a reliable route back to its inputs. Saving only data preserves inputs without documenting which result was produced or how.</p>\n<p><b>Try it — ungraded.</b> A teammate sends an output screenshot reading “50%” and a syntax file, but no checked data or source description. What can you verify?</p>\n<p><b>Explained answer.</b> You can inspect what the syntax <i>asks</i> SPSS to calculate and read the displayed number. You cannot rerun it or verify the eight rows, eligibility rule, C104 correction, or provenance. Request the appropriately shareable checked data and its source-and-cleaning record.</p>"},{"id":"5","level":2,"title":"5. Communicate a bounded next step","short":"5. Communicate a bounded next step","html":"<p><b>Why these scores:</b> Managers need a decision-ready statement that separates what was seen from what is proposed.</p>"},{"id":"5.1","level":3,"title":"5.1 Observation, inference, assumption, recommendation","short":"5.1. Observation, inference, ass…","html":"<p>Use four labels to prevent a small extract from carrying a claim it cannot support.</p>\n<ul><li><b>Descriptive observation:</b> In the eight checked orders from two morning shifts, four met the five-minute rule: <b>50%</b>.</li><li><b>Inference:</b> The extract does <b>not</b> establish the rate for all future eligible orders. A population claim needs an appropriate sampling or study plan; that work begins in later sessions.</li><li><b>Assumption to check:</b> Recorded arrival is a useful start time for customer waiting, and the proposed staff member can be assigned without unacceptable disruption elsewhere.</li><li><b>Recommendation:</b> Do <b>not</b> approve permanent staffing from this extract alone. Prepare a time-bounded pilot that records eligibility, waits, source quality, and incremental labor cost, then evaluate its target and guardrail.</li></ul>\n<p>This is a <b>bounded recommendation</b>: it says what to do next without claiming that the staffed point works. For the pilot, predefine the date range and treatment, keep the five-minute boundary fixed, log all eligible orders and missing timestamps, and compare like with like where feasible. Consider effects on staff workload and on customers who do not use mobile pickup. Later units address uncertainty, comparison designs, practical effects, and A/B guardrails in depth; a “statistically significant” result, even if one were calculated, would not alone prove causal or business impact (Illowsky &amp; Dean, 2023b).</p>\n<div class=\"key\"><b>Lead with the decision and its evidential boundary, not an unqualified percentage.</b> A suitable manager-facing line is: “Two checked morning shifts show 4 of 8 mobile pickups handed over within five minutes; this is a reason to measure a pilot, not evidence that extra staffing will fix the delay.”</div>\n<p>A compact text display can carry the present evidence without relying on color:</p>\n<div class=\"tbl\"><table><thead><tr><th>Checked morning orders</th><th>Within 5 minutes</th><th>Over 5 minutes</th><th>What it supports</th></tr></thead><tbody><tr><td>8</td><td>4 (50%)</td><td>4 (50%)</td><td>Description of these checked orders only</td></tr></tbody></table></div>\n<p>For a later chart, label categories and counts directly and accompany it with the data table or equivalent text. Do not make its visual emphasis imply that an intervention effect was measured. Protect operational identifiers when sharing beyond the authorized team.</p>\n<p><b>Failure mode:</b> “Staffing will lift pickup performance from 50% to 75%” converts a <b>target</b> into a <b>forecast</b> without evidence. “Most customers waited too long” is also unsupported: the unit here is orders, and four of eight—not most—exceeded five minutes.</p>\n<p><b>Try it — ungraded.</b> Rewrite this sentence for a manager: “Our data prove the staffed point will hit the target because the baseline is 50%.”</p>\n<p><b>Explained answer.</b> One sound version is: “In two checked morning shifts, 4 of 8 eligible orders met the five-minute rule. We have not observed a staffed handoff point, so we recommend a measured pilot before deciding whether to retain one.” It retains the useful observation and removes the unsupported causal prediction.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>Define the <b>stakeholder and decision</b> before choosing a method.</li><li>State the <b>population, one-row unit, eligibility rule, and denominator</b>.</li><li>A KPI needs an exact boundary: Cedar Cup’s “within five minutes” includes five.</li><li>Separate a desired <b>target</b> from an observed result and a cost <b>guardrail</b>.</li><li>In the checked fictional extract, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">4/8=50\\%</annotation></semantics></math></span>; it describes eight orders, not a staffing effect.</li><li>Trace source rows, keys, missing values, and corrections before calculating.</li><li>Check Excel’s answer by another calculation and against individual rows.</li><li>In SPSS, distinguish data, syntax, and Viewer output; save what another analyst needs to rerun the check.</li><li>Tell managers what was observed, what remains uncertain, and the next defensible action.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<ul><li><b>Case:</b> SPSS term for an observed row; here, one checked order.</li><li><b>Categorical variable:</b> A recorded group or class; <code>shift</code> is Tuesday or Wednesday.</li><li><b>Convenience extract:</b> Readily available observations not selected by a probability rule; the eight orders were pulled from two mornings.</li><li><b>Denominator:</b> The count of eligible units used beneath a rate; eight checked orders in the baseline calculation.</li><li><b>Grain:</b> What one row represents; one eligible order in this table.</li><li><b>Guardrail:</b> A limit on a possible downside of a decision; at most $1.50 additional labor per eligible order.</li><li><b>Inference:</b> A claim extending beyond observed units; the eight orders alone do not justify a pilot-wide rate.</li><li><b>Key:</b> A field intended to identify a unit uniquely; <code>order_id</code> should identify one order.</li><li><b>KPI:</b> A specified measure of performance; the share of eligible orders handed over within five minutes.</li><li><b>Measurement rule:</b> The operational way a value is obtained; wait is recorded handoff time minus recorded arrival time.</li><li><b>Missing value:</b> An outcome that cannot be determined from available data; a blank arrival time does not mean failure.</li><li><b>Population:</b> All units the intended claim concerns; here, eligible orders during the proposed two-week pilot.</li><li><b>Provenance:</b> A record of data origin and changes; the export source and C104 resolution are part of it.</li><li><b>Sample:</b> Units observed rather than the whole population; the historical eight orders are not the proposed pilot population.</li><li><b>Stakeholder:</b> A person affected by or responsible for a decision; the café manager, customers, and staff qualify.</li><li><b>Target:</b> A desired KPI level; at least 75% within five minutes.</li><li><b>Testable claim:</b> A statement with defined observations that could support or contradict it; the pilot target plus labor guardrail.</li><li><b>Variable:</b> A property recorded for each unit; <code>wait_min</code> records minutes for each checked order.</li></ul>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>International Business Machines Corporation. (n.d.-a). <i>Reading Excel files</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=files-reading-excel\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=files-reading-excel</a></p>\n<p>International Business Machines Corporation. (n.d.-b). <i>Variable View</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=editor-variable-view\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=editor-variable-view</a></p>\n<p>International Business Machines Corporation. (n.d.-c). <i>Windows</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=overview-windows\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=overview-windows</a></p>\n<p>International Business Machines Corporation. (n.d.-d). <i>FREQUENCIES</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=reference-frequencies\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=reference-frequencies</a></p>\n<p>International Business Machines Corporation. (n.d.-e). <i>Overview (SAVE command)</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=save-overview-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=save-overview-command</a></p>\n<p>International Business Machines Corporation. (n.d.-f). <i>Overview (OUTPUT EXPORT command)</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=export-overview-output-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=export-overview-output-command</a></p>\n<p>Microsoft. (n.d.-a). <i>Using structured references with Excel tables</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/using-structured-references-with-excel-tables\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/using-structured-references-with-excel-tables</a></p>\n<p>Microsoft. (n.d.-b). <i>Use the COUNTIF function in Microsoft Excel</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/get-started/use-the-countif-function-in-microsoft-excel\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/get-started/use-the-countif-function-in-microsoft-excel</a></p>\n<p>Illowsky, B., &amp; Dean, S. (2023a). <i>1.2 Data, sampling, and variation in data and sampling</i>. In <i>Introductory statistics 2e</i>. <a href=\"https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling</a></p>\n<p>Illowsky, B., &amp; Dean, S. (2023b). <i>1.4 Experimental design and ethics</i>. In <i>Introductory statistics 2e</i>. <a href=\"https://openstax.org/books/introductory-statistics-2e/pages/1-4-experimental-design-and-ethics\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/introductory-statistics-2e/pages/1-4-experimental-design-and-ethics</a></p>"}]};
globalThis.LESSON_I18N = {"zh":{"Lab 01 Checkpoints":"Lab 01 检查点","GC1015 · Session 1 · Build it in Excel and SPSS, check it here":"GC1015 · 第 1 节课 · 在 Excel 和 SPSS 中完成，在这里核对","Finish":"完成","Your lab results":"你的实验结果","Get set":"准备就绪","Data Audit":"Data Audit","Statistics and parity":"统计量与一致性核对","Quality, note and map":"质量、说明与映射","Lab files":"实验文件","Lab 01, MetroFresh Logistics (synthetic data). Work in your saved copy <code>Lab01_FirstName_LastName_NYUNetID_Analysis.xlsx</code>; the lavender cells are yours to build.":"Lab 01，MetroFresh Logistics（合成数据）。请在你保存的副本 <code>Lab01_FirstName_LastName_NYUNetID_Analysis.xlsx</code> 中操作；淡紫色单元格由你来完成。","Sheet":"工作表","Your cells":"你的单元格","Finish check":"完成检查","B6:B11, B15:D19":"B6:B11, B15:D19","B9 = 120":"B9 = 120","Descriptive Statistics":"Descriptive Statistics","C6:K8":"C6:K8","D6 = 118, K6 = 14.17":"D6 = 118, K6 = 14.17","Excel-SPSS Parity":"Excel-SPSS Parity","C6:D20":"C6:D20","15 rows show PASS":"15 行显示 PASS","Quality Log":"Quality Log","A6:F13":"A6:F13","source values unchanged":"源数据值未改动","Synthesis":"Synthesis","A5":"A5","150 to 200 words":"150 到 200 词","Memo Evidence Map":"Memo Evidence Map","A6:G13":"A6:G13","Yes after reopening":"重新打开后填 Yes","Dataset: MetroFresh_Lab01_OrderRecords.csv, 120 order records from August 1 to 28, 2026, 12 fields.":"数据集：MetroFresh_Lab01_OrderRecords.csv，120 条订单记录，时间为 2026 年 8 月 1 日至 28 日，共 12 个字段。","SPSS: run the supplied syntax, confirm 120 cases, then use Analyze, Descriptive Statistics, Descriptives.":"SPSS：运行提供的语法，确认有 120 个个案，然后使用 Analyze, Descriptive Statistics, Descriptives。","Data Audit: grain":"Data Audit：粒度","Checkpoint A":"检查点 A","Row 6: delivery_minutes":"第 6 行：delivery_minutes","Checkpoint B":"检查点 B","Rows 7 and 8":"第 7 行和第 8 行","Excel-SPSS parity":"Excel-SPSS 一致性核对","Synthesis call":"综合判断","Meet the order records":"认识订单记录","Count first, then calculate. If your workbook disagrees with a simple count, check the formula, not the data.":"先计数，再计算。如果你的工作簿和简单计数对不上，要检查的是公式，而不是数据。","These are the 120 MetroFresh order records from Lab 01, the same rows as the workbook’s <b>Data</b> sheet. Use the filters to count rows before you trust any formula.":"这是 Lab 01 中 MetroFresh 的 120 条订单记录，和工作簿 <b>Data</b> 工作表中的行完全相同。在相信任何公式之前，先用筛选器数一数行数。","Step 0: smoke tests":"第 0 步：冒烟测试","You copied the CSV into the workbook and named the table <code>tblMetroFresh</code>.":"你把 CSV 复制进工作簿，并把表命名为 <code>tblMetroFresh</code>。","Type what your two smoke-test formulas return.":"输入你的两个冒烟测试公式返回的结果。","<p>120 rows and 120 distinct <code>order_id</code> values support the documented grain, one row per customer order. They do not prove it on their own; the data dictionary and the source rules do. Do not add, remove or change rows to force 120.</p>":"<p>120 行和 120 个不同的 <code>order_id</code> 值，支持文档中记载的粒度：每行一笔客户订单。但它们本身并不能证明这一点，能证明的是数据字典和源数据规则。不要为了凑出 120 而添加、删除或修改行。</p>","<code>=ROWS(tblMetroFresh[order_id])</code> returns {{rows}}":"<code>=ROWS(tblMetroFresh[order_id])</code> 返回 {{rows}}","<code>=ROWS(UNIQUE(tblMetroFresh[order_id]))</code> returns {{uniq}}":"<code>=ROWS(UNIQUE(tblMetroFresh[order_id]))</code> 返回 {{uniq}}","Expect 120. If you see 121, the header was copied as a data row. If fewer, the table is missing the last rows.":"预期是 120。如果你看到 121，说明表头被当成数据行复制进来了。如果更少，说明表缺了最后几行。","Total records":"记录总数","Every order_id is different, so this also returns 120. A smaller number would mean a repeated order ID.":"每个 order_id 都不同，所以这里也返回 120。数字更小就意味着有重复的订单 ID。","Distinct order IDs":"不同订单 ID 的数量","Step 2: the five-row demo table":"第 2 步：五行演示表","In <code>tblDemoDelivery</code> you entered 32, 38, a blank, 45 and 65 minutes. Known answers check your formulas before you use them on 120 rows.":"你在 <code>tblDemoDelivery</code> 中输入了 32、38、一个空白、45 和 65 分钟。已知答案可以先检验你的公式，再把它们用到 120 行上。","Type what your formulas return. Give the standard deviation to two decimals.":"输入你的公式返回的结果。标准差保留两位小数。","<p>Valid count 4, missing 1, mean 45, median 41.5, sample SD 14.35 minutes. A blank is excluded, never counted as zero, and the sample SD divides by n − 1.</p>":"<p>有效计数 4，缺失 1，均值 45，中位数 41.5，样本标准差 (SD) 14.35 分钟。空白要排除，绝不能当作零来计数；样本标准差除以的是 n − 1。</p>","COUNT = {{n}}   missing = {{m}}":"COUNT = {{n}}   缺失 = {{m}}","AVERAGE = {{mean}} minutes   MEDIAN = {{med}} minutes":"AVERAGE = {{mean}} 分钟   MEDIAN = {{med}} 分钟","STDEV.S = {{sd}} minutes":"STDEV.S = {{sd}} 分钟","COUNT counts numbers only, so the blank is skipped: 4.":"COUNT 只统计数字，所以会跳过空白：4。","Valid count":"有效计数","ROWS minus COUNT: 5 − 4 = 1.":"ROWS 减 COUNT：5 − 4 = 1。","Missing count":"缺失计数","If you see 36, the blank was treated as zero. AVERAGE skips blanks: 180 ÷ 4 = 45.":"如果你看到 36，说明空白被当成了零。AVERAGE 会跳过空白：180 ÷ 4 = 45。","Mean":"均值","Order the four values: 32, 38, 45, 65. The middle two average to 41.5.":"把四个值排序：32、38、45、65。中间两个值的平均数是 41.5。","Median":"中位数","If you see 12.43, you used STDEV.P. The lab uses STDEV.S, which divides by n − 1.":"如果你看到 12.43，说明你用了 STDEV.P。本实验使用 STDEV.S，它除以 n − 1。","Sample standard deviation":"样本标准差","What goes in Data Audit B6?":"Data Audit B6 应该填什么？","B6 asks for the observational unit and table grain. The file has 120 rows, 120 distinct order IDs and 76 distinct customers.":"B6 要求填写观测单位和表的粒度。这个文件有 120 行、120 个不同的订单 ID 和 76 位不同的客户。","Which grain statement is right?":"哪种粒度描述是正确的？","<p>One row per customer order, August 1 to 28, 2026. Every count and summary therefore describes <b>orders</b>, not customers. <code>order_id</code> identifies a row (B7), and B9 holds the 120 records.</p>":"<p>每行一笔客户订单，时间为 2026 年 8 月 1 日至 28 日。因此，每个计数和汇总描述的都是<b>订单</b>，而不是客户。<code>order_id</code> 用来标识一行（B7），B9 记录的是 120 条记录。</p>","One row per customer order in the four-week window":"在这四周内，每行一笔客户订单","One row per customer":"每行一位客户","There are 76 customers but 120 rows. Some customers placed two orders.":"有 76 位客户，却有 120 行。有些客户下了两笔订单。","One row per delivery day":"每行一个配送日","The window has 28 days but 120 rows. One day holds several orders.":"这个时间段有 28 天，却有 120 行。一天里有好几笔订单。","One row per fulfillment hub":"每行一个履约中心","There are four hubs with 30 orders each. The hub is a category on each row.":"共有四个履约中心，每个各 30 笔订单。履约中心是每一行上的一个类别。","One row per order (120); order_id identifies it; 76 customers":"每行一笔订单（120）；由 order_id 标识；76 位客户","Repeated customers: error or expected?":"重复的客户：是错误还是正常？","B8 asks whether a repeated <code>customer_id</code> is a duplicate. B10 asks whether any row has more unfulfilled items than ordered items.":"B8 问的是重复的 <code>customer_id</code> 是否算重复记录。B10 问的是有没有哪一行的未履约件数多于订购件数。","Filter customer_id to C-001. Then type your B10 check.":"把 customer_id 筛选为 C-001。然后输入你在 B10 的检查结果。","<p>C-001 placed two separate orders on different dates. When the grain is orders, a repeated <code>customer_id</code> is expected; a repeated <code>order_id</code> would be the alarm. Decide the grain first, then what counts as a duplicate.</p>\n          <p>No row has more unfulfilled items than ordered items, so B10 records that the rule holds.</p>":"<p>C-001 在不同日期下了两笔不同的订单。当粒度是订单时，重复的 <code>customer_id</code> 是正常的；重复的 <code>order_id</code> 才是警报。先确定粒度，再决定什么算重复记录。</p>\n          <p>没有任何一行的未履约件数多于订购件数，所以 B10 记录这条规则成立。</p>","rows for customer C-001 = {{c}}":"客户 C-001 的行数 = {{c}}","rows where items_unfulfilled > items_ordered = {{v}}":"items_unfulfilled > items_ordered 的行数 = {{v}}","Filter customer_id = C-001: two rows, MF-0001 and MF-0077, with different order IDs and dates.":"筛选 customer_id = C-001：有两行，MF-0001 和 MF-0077，订单 ID 和日期都不同。","Rows for customer C-001":"客户 C-001 的行数","A helper formula such as =SUMPRODUCT(--(tblMetroFresh[items_unfulfilled]>tblMetroFresh[items_ordered])) returns 0.":"像 =SUMPRODUCT(--(tblMetroFresh[items_unfulfilled]>tblMetroFresh[items_ordered])) 这样的辅助公式会返回 0。","Rows that break the items rule":"违反件数规则的行数","Measurement levels, B15 to B19":"测量尺度，B15 到 B19","Numbers can be labels, ranks or measured amounts. The level decides which summaries make sense.":"数字可以是标签、排名，也可以是测量出来的数量。测量尺度决定了哪些汇总方式有意义。","Drag a level onto each field. One tile is a trap.":"把一个测量尺度拖到每个字段上。有一张卡片是陷阱。","<p><code>fulfillment_hub</code> is nominal: count the categories, never average them. <code>delivery_minutes</code>, <code>order_value</code> and <code>spoilage_units</code> are ratio, so means and standard deviations are meaningful. <code>customer_rating</code> is ordinal: treat it as ordered ratings, not exact distances.</p>":"<p><code>fulfillment_hub</code> 是定类尺度：统计各类别的数量，绝不要求平均值。<code>delivery_minutes</code>、<code>order_value</code> 和 <code>spoilage_units</code> 是定比尺度，所以均值和标准差有意义。<code>customer_rating</code> 是定序尺度：把它当作有先后顺序的评分，而不是精确的距离。</p>","Ratio":"定比","Ordinal":"定序","Interval":"定距","Nominal":"定类","<code>fulfillment_hub</code>":"<code>fulfillment_hub</code>","<code>delivery_minutes</code>":"<code>delivery_minutes</code>","<code>order_value</code>":"<code>order_value</code>","<code>spoilage_units</code>":"<code>spoilage_units</code>","<code>customer_rating</code>":"<code>customer_rating</code>","Interval has no true zero. Zero minutes, zero dollars and zero spoiled units all mean none, so these are ratio.":"定距尺度没有绝对零点。零分钟、零美元和零件损耗都表示“没有”，所以这些是定比尺度。","Ratings have an order, but the step from 3 to 4 may not equal the step from 4 to 5. That is ordinal.":"评分有顺序，但从 3 到 4 的差距不一定等于从 4 到 5 的差距。这是定序尺度。","Hub names have no order. Newark is not more than Richmond. That is nominal.":"履约中心的名称没有顺序。Newark 并不比 Richmond “多”。这是定类尺度。","Ratings 1 to 5 do have an order. That makes them ordinal, not nominal.":"1 到 5 的评分确实有顺序。这让它们属于定序尺度，而不是定类尺度。","Count before you average":"先计数，再求平均","Descriptive Statistics row 6 is <code>delivery_minutes</code>. Blank cells are missing, not zero.":"Descriptive Statistics 的第 6 行是 <code>delivery_minutes</code>。空白单元格表示缺失，不是零。","Filter delivery_minutes to (blank), then type C6 to E6.":"把 delivery_minutes 筛选为 (空白)，然后输入 C6 到 E6。","<p>118 of 120 orders have a valid delivery time. The two blanks (MF-0017 and MF-0092) are left out of every delivery statistic and reported in E6, so a reader can see which summaries use fewer than 120 records.</p>":"<p>120 笔订单中有 118 笔有有效的配送时间。两个空白（MF-0017 和 MF-0092）不计入任何配送统计量，并在 E6 中报告，这样读者就能看出哪些汇总用到的记录少于 120 条。</p>","C6 total records = {{c6}}":"C6 记录总数 = {{c6}}","D6 valid N = {{d6}}":"D6 有效 N = {{d6}}","E6 missing N = {{e6}}":"E6 缺失 N = {{e6}}","=ROWS(tblMetroFresh[delivery_minutes]) counts every row: 120.":"=ROWS(tblMetroFresh[delivery_minutes]) 统计每一行：120。","C6 total records":"C6 记录总数","If you see 120, you used ROWS or COUNTA. COUNT counts numbers only: 118.":"如果你看到 120，说明你用了 ROWS 或 COUNTA。COUNT 只统计数字：118。","D6 valid N":"D6 有效 N","E6 = ROWS − COUNT = 120 − 118 = 2. The explorer shows the two blank rows, MF-0017 and MF-0092.":"E6 = ROWS − COUNT = 120 − 118 = 2。数据浏览器里能看到这两行空白：MF-0017 和 MF-0092。","E6 missing N":"E6 缺失 N","Checkpoint B: delivery_minutes":"检查点 B：delivery_minutes","Your formulas in F6 to K6 all point at <code>tblMetroFresh[delivery_minutes]</code>.":"你在 F6 到 K6 中的公式都指向 <code>tblMetroFresh[delivery_minutes]</code>。","Type what F6 to K6 show, to two decimals.":"输入 F6 到 K6 显示的结果，保留两位小数。","<p>Mean 43.67, median 43.50, minimum 24, maximum 142, range 118 and sample SD 14.17 minutes, all from 118 valid records. The mean and median are close; the 142-minute record stretches the range and the SD more than the center.</p>":"<p>均值 43.67，中位数 43.50，最小值 24，最大值 142，极差 118，样本标准差 (SD) 14.17 分钟，全部基于 118 条有效记录。均值和中位数很接近；那条 142 分钟的记录对极差和标准差的拉伸，比对中心的影响更大。</p>","F6 mean = {{f6}}   G6 median = {{g6}}":"F6 均值 = {{f6}}   G6 中位数 = {{g6}}","H6 minimum = {{h6}}   I6 maximum = {{i6}}":"H6 最小值 = {{h6}}   I6 最大值 = {{i6}}","J6 range = {{j6}}   K6 sample SD = {{k6}}":"J6 极差 = {{j6}}   K6 样本标准差 (SD) = {{k6}}","If you see 42.94, the blanks were counted as zero. AVERAGE on the table column skips them: 43.67.":"如果你看到 42.94，说明空白被当成了零。对表格列使用 AVERAGE 会跳过空白：43.67。","F6 mean":"F6 均值","=MEDIAN(tblMetroFresh[delivery_minutes]) returns 43.50.":"=MEDIAN(tblMetroFresh[delivery_minutes]) 返回 43.50。","G6 median":"G6 中位数","The shortest recorded delivery is 24 minutes.":"记录到的最短配送时间是 24 分钟。","H6 minimum":"H6 最小值","The maximum is 142 minutes (MF-0074). Keep it; it is a value to check, not to delete.":"最大值是 142 分钟（MF-0074）。保留它；这是一个需要核查的值，不是要删除的值。","I6 maximum":"I6 最大值","J6 = I6 − H6 = 142 − 24 = 118 minutes.":"J6 = I6 − H6 = 142 − 24 = 118 分钟。","J6 range":"J6 极差","If you see 14.11, you used STDEV.P. If you see 15.13, blanks became zeros. Use STDEV.S on the table column.":"如果你看到 14.11，说明你用了 STDEV.P。如果你看到 15.13，说明空白变成了零。请对表格列使用 STDEV.S。","K6 sample standard deviation":"K6 样本标准差","n 118 (2 missing); mean 43.67; median 43.50; SD 14.17 minutes":"n 118（缺失 2）；均值 43.67；中位数 43.50；SD 14.17 分钟","Rows 7 and 8: order value and spoilage":"第 7 行和第 8 行：订单金额与损耗","Copy the row 6 pattern to <code>order_value</code> (US dollars) and <code>spoilage_units</code> (units).":"把第 6 行的做法复制到 <code>order_value</code>（美元）和 <code>spoilage_units</code>（件）。","Type the cells your workbook shows.":"输入你的工作簿中显示的单元格值。","<p>Order value: 119 valid, mean $142.07, median $141.41, range $43.05 to $279.74, SD $57.27. Spoilage: 120 valid, mean 0.65, median 0, maximum 4, SD 1.29 units. Valid N plus missing N equals 120 in every row.</p>":"<p>订单金额：有效 119，均值 $142.07，中位数 $141.41，范围 $43.05 到 $279.74，SD $57.27。损耗：有效 120，均值 0.65，中位数 0，最大值 4，SD 1.29 件。每一行的有效 N 加缺失 N 都等于 120。</p>","D7 valid N = {{d7}}   F7 mean = $ {{f7}}   K7 SD = $ {{k7}}":"D7 有效 N = {{d7}}   F7 均值 = $ {{f7}}   K7 SD = $ {{k7}}","D8 valid N = {{d8}}   F8 mean = {{f8}} units   I8 maximum = {{i8}} units":"D8 有效 N = {{d8}}   F8 均值 = {{f8}} 件   I8 最大值 = {{i8}} 件","One order value is blank (MF-0059), so COUNT returns 119.":"有一个订单金额是空白（MF-0059），所以 COUNT 返回 119。","D7 valid N":"D7 有效 N","If you see 140.89, the blank became $0.00. Never fill a blank with zero.":"如果你看到 140.89，说明空白变成了 $0.00。绝不要用零填补空白。","F7 mean order value":"F7 订单金额均值","Use STDEV.S. STDEV.P gives 57.03, which fails the parity check.":"使用 STDEV.S。STDEV.P 得到的是 57.03，无法通过一致性核对。","K7 sample standard deviation":"K7 样本标准差","Spoilage has no blanks: 120. Zero is a real value here; it means nothing spoiled.":"损耗没有空白：120。这里的零是真实值，表示没有任何损耗。","D8 valid N":"D8 有效 N","=AVERAGE(tblMetroFresh[spoilage_units]) returns 0.65 units.":"=AVERAGE(tblMetroFresh[spoilage_units]) 返回 0.65 件。","F8 mean spoilage":"F8 损耗均值","The largest spoilage count is 4 units. Ten orders have it.":"最大的损耗数量是 4 件。有十笔订单是这个值。","I8 maximum spoilage":"I8 损耗最大值","Value: n 119, mean $142.07. Spoilage: n 120, mean 0.65, max 4":"金额：n 119，均值 $142.07。损耗：n 120，均值 0.65，最大值 4","Checkpoint C: SPSS N and parity":"检查点 C：SPSS 的 N 与一致性核对","SPSS Descriptives shows one N for each variable, plus a last row called Valid N (listwise).":"SPSS 的 Descriptives 会为每个变量显示一个 N，最后还有一行叫 Valid N (listwise)。","Type the SPSS values for D6 and D11, then your PASS count.":"输入 D6 和 D11 的 SPSS 值，然后输入你的 PASS 数量。","<p>Each variable has its own valid N: 118, 119 and 120. <b>Valid N (listwise)</b> is 117, the rows with no blank in any of the three, so it matches no single variable. With matching rules, all 15 comparisons pass.</p>\n          <p>PASS shows the two tools processed the same records the same way. It does not show that the records are accurate.</p>":"<p>每个变量都有自己的有效 N：118、119 和 120。<b>Valid N (listwise)</b> 是 117，即三个变量都没有空白的行数，所以它和任何单个变量都对不上。规则一致时，全部 15 项比较都会通过。</p>\n          <p>PASS 说明两个工具以同样的方式处理了同样的记录。它并不能说明这些记录是准确的。</p>","D6 SPSS N for delivery_minutes = {{n1}}":"D6 delivery_minutes 的 SPSS N = {{n1}}","D11 SPSS N for order_value = {{n2}}":"D11 order_value 的 SPSS N = {{n2}}","PASS rows in G6:G20 = {{p}} of 15":"G6:G20 中的 PASS 行数 = {{p}} / 15","Use the N on the delivery_minutes row. If you typed 117, you copied Valid N (listwise), which counts rows with no blanks in any variable.":"使用 delivery_minutes 那一行的 N。如果你填了 117，说明你复制的是 Valid N (listwise)，它统计的是所有变量都没有空白的行。","D6 SPSS N for delivery_minutes":"D6 delivery_minutes 的 SPSS N","order_value has its own N: 119. Valid N (listwise) is 117 and belongs to no single variable.":"order_value 有自己的 N：119。Valid N (listwise) 是 117，不属于任何单个变量。","D11 SPSS N for order_value":"D11 order_value 的 SPSS N","When both tools use only valid values and the sample SD, all 15 rows pass within 0.01.":"当两个工具都只使用有效值和样本标准差 (SD) 时，全部 15 行都会在 0.01 的容差内通过。","PASS rows":"PASS 行数","15 of 15 PASS within 0.01":"15 / 15 PASS，容差 0.01","A row says CHECK":"有一行显示 CHECK","Row 10, the delivery SD, shows Excel 14.11 and SPSS 14.17. The difference, 0.06, fails the 0.01 tolerance.":"第 10 行是配送时间的 SD，Excel 显示 14.11，SPSS 显示 14.17。两者相差 0.06，超出了 0.01 的容差。","What is the most likely cause?":"最可能的原因是什么？","<p>STDEV.P divides by n, so it is slightly smaller: 14.11 instead of 14.17. SPSS Descriptives reports the sample SD, which divides by n − 1. A CHECK usually means different rules, not an arithmetic bug.</p>\n          <p>If every SD used STDEV.P, delivery (0.06) and order value (0.24) would fail, but spoilage would still pass (0.005). So one PASS does not prove the rule is right.</p>":"<p>STDEV.P 除以 n，所以结果略小：14.11，而不是 14.17。SPSS 的 Descriptives 报告的是样本 SD，除以 n − 1。出现 CHECK 通常意味着规则不同，而不是算术错误。</p>\n          <p>如果所有 SD 都用 STDEV.P，配送时间（0.06）和订单金额（0.24）会不通过，但损耗仍会通过（0.005）。所以一个 PASS 并不能证明规则是对的。</p>","Excel used STDEV.P, which divides by n instead of n − 1":"Excel 用了 STDEV.P，它除以 n 而不是 n − 1","SPSS rounds differently, so type 14.11 into column D":"SPSS 的四舍五入方式不同，所以在 D 列填 14.11","Never edit a value to force PASS. Column D must show what SPSS displays.":"绝不要为了凑出 PASS 而修改数值。D 列必须如实填写 SPSS 显示的值。","The 142-minute order should be deleted from the table":"应该从表中删除那笔 142 分钟的订单","Deleting data does not fix a formula. Both tools already use the same 118 records.":"删除数据修不好公式。两个工具用的已经是同样的 118 条记录。","Raise the tolerance to 0.1 so the row passes":"把容差调到 0.1，让这一行通过","Moving the tolerance hides a real rule difference. Fix the rule instead.":"调整容差会掩盖真实存在的规则差异。应该修正规则。","Find the records to log":"找出需要记录的记录","The Quality Log needs a row for each blank field, the largest delivery time, a large spoilage count and the items rule. Keep every value as recorded.":"Quality Log 需要为每个空白字段、最长的配送时间、一个较大的损耗数量以及件数规则各记一行。每个值都要保持原样。","Use the filters. Type each count.":"使用筛选器。输入每个计数。","<p>Log MF-0017 and MF-0092 (no delivery time), MF-0059 (no order value), MF-0074 (142 minutes), at least one 4-unit spoilage order such as MF-0003, and one row saying no record breaks the items rule. A flagged value is a question to ask, not proof of an error.</p>":"<p>记录 MF-0017 和 MF-0092（无配送时间）、MF-0059（无订单金额）、MF-0074（142 分钟）、至少一笔损耗 4 件的订单（例如 MF-0003），再加一行说明没有记录违反件数规则。被标记的值是一个需要追问的问题，而不是出错的证据。</p>","blank delivery_minutes = {{a}} rows":"delivery_minutes 为空白 = {{a}} 行","blank order_value = {{b}} row":"order_value 为空白 = {{b}} 行","spoilage_units = 4 in {{c}} rows":"spoilage_units = 4 的有 {{c}} 行","Filter delivery_minutes to (blank): MF-0017 and MF-0092.":"把 delivery_minutes 筛选为 (空白)：MF-0017 和 MF-0092。","Rows with a blank delivery time":"配送时间为空白的行数","Filter order_value to (blank): MF-0059.":"把 order_value 筛选为 (空白)：MF-0059。","Rows with a blank order value":"订单金额为空白的行数","Filter spoilage_units to 4: ten orders, starting with MF-0003.":"把 spoilage_units 筛选为 4：共十笔订单，第一笔是 MF-0003。","Rows with 4 spoiled units":"损耗 4 件的行数","Blank: MF-0017, MF-0092, MF-0059. Check: MF-0074 (142 min), 4-unit spoilage. Items rule holds.":"空白：MF-0017、MF-0092、MF-0059。待核查：MF-0074（142 分钟）、4 件损耗。件数规则成立。","What do you do with 142 minutes?":"142 分钟该怎么处理？","MF-0074 records a 142-minute delivery. The next largest is 63 minutes.":"MF-0074 记录了一次 142 分钟的配送。第二长的是 63 分钟。","What goes in the Action taken column?":"Action taken 列应该填什么？","<p>An unusual value is an investigation item, not a confirmed error. Keep it, log it, and ask the source team whether 142 minutes was a real delivery. The note should say it is unverified.</p>":"<p>异常值是需要调查的事项，不是已确认的错误。保留它、记录它，并询问源数据团队 142 分钟是否真是一次实际配送。说明中应注明该值尚未核实。</p>","Keep 142 as recorded, and ask whether it is valid or a recording issue":"按原记录保留 142，并询问它是有效值还是记录问题","Delete the row, because it distorts the mean":"删除这一行，因为它扭曲了均值","Start Here says never delete unusual values. Log the issue and ask.":"Start Here 明确说过绝不删除异常值。记录这个问题并去询问。","Replace it with the median, 43.5 minutes":"用中位数 43.5 分钟替换它","That alters a source record and hides the question. Keep the value.":"这会改动源记录，还会掩盖问题。保留这个值。","Record it as missing, like a blank":"把它记为缺失，就像空白一样","A recorded value is not missing. Changing it to blank alters the source.":"已记录的值不是缺失值。把它改成空白就改动了源数据。","Optional: how much does one record move?":"选做：一条记录能带来多大变化？","Section D, not graded: on a separate sheet, recompute the delivery statistics without MF-0074 and label the result hypothetical. <code>tblMetroFresh</code> stays unchanged.":"D 部分，不计分：在另一个工作表中，去掉 MF-0074 重新计算配送统计量，并把结果标注为假设性结果。<code>tblMetroFresh</code> 保持不变。","Type the hypothetical results for the other 117 delivery times.":"输入其余 117 个配送时间的假设性结果。","<p>Without MF-0074, the mean drops by 0.84 minutes and the SD by about 3.3, while the median moves only 0.5. One extreme value pulls the mean and the SD more than the median. This comparison does <b>not</b> justify deleting the record; only source evidence can.</p>":"<p>去掉 MF-0074 后，均值下降 0.84 分钟，SD 下降约 3.3，而中位数只变化了 0.5。一个极端值对均值和 SD 的拉动比对中位数更大。这个比较<b>并不</b>能成为删除该记录的理由；只有来自源头的证据才可以。</p>","mean = {{m}} minutes (was 43.67)":"均值 = {{m}} 分钟（原为 43.67）","median = {{md}} minutes (was 43.50)":"中位数 = {{md}} 分钟（原为 43.50）","sample SD = {{sd}} minutes (was 14.17)":"样本 SD = {{sd}} 分钟（原为 14.17）","AVERAGE of the 117 valid values other than 142 gives 42.83.":"对除 142 以外的 117 个有效值求 AVERAGE，得到 42.83。","Hypothetical mean":"假设性均值","The middle of 117 ordered values is the 59th value: 43.":"117 个排好序的值的中间位置是第 59 个值：43。","Hypothetical median":"假设性中位数","STDEV.S of the same 117 values gives 10.89.":"对同样这 117 个值求 STDEV.S，得到 10.89。","Hypothetical sample standard deviation":"假设性样本标准差","Synthesis A5: use or pause?":"Synthesis A5：使用还是暂停？","Leadership asked whether this file can serve as initial descriptive evidence, or whether the review should pause for clarification.":"管理层想知道，这个文件能否作为初步的描述性证据，还是应该暂停审查、先做澄清。","Which opening sentence for the evidence-sufficiency note is strongest?":"证据充分性说明的哪一句开头最有力？","<p>A strong note makes a clear use-or-pause call with at least three traceable numbers. It says what the records can describe (the center, range and spread of these orders in August 2026), what they cannot establish (why delays or spoilage happened), and the main limitation (missing values and the unverified 142-minute record). Write it in your own words.</p>":"<p>一份有力的说明要明确给出“使用”或“暂停”的判断，并附上至少三个可追溯的数字。它要说明这些记录能描述什么（2026 年 8 月这些订单的中心、范围和离散程度），不能确定什么（延误或损耗为什么发生），以及主要局限（缺失值和那条未经核实的 142 分钟记录）。请用你自己的话来写。</p>","Use as initial descriptive evidence: 118 valid delivery times, mean 43.67 minutes, one 142-minute record unverified":"作为初步描述性证据使用：118 个有效配送时间，均值 43.67 分钟，一条 142 分钟的记录尚未核实","Pause: two blank delivery times make the file unusable":"暂停：两个空白的配送时间让文件无法使用","Two of 120 missing is a limitation to disclose, not a reason to discard the file.":"120 条中缺了两条，是需要披露的局限，而不是丢弃整个文件的理由。","Use it: long deliveries caused the spoilage":"使用它：配送时间长导致了损耗","The records show values, not causes. The note must make no causal claim.":"记录显示的是数值，不是原因。说明中不能有任何因果论断。","Change service next month, because mean delivery is 43.67 minutes":"下个月调整服务，因为平均配送时间是 43.67 分钟","The request asks use or pause, not what to change. Answer the question that was asked.":"这个请求问的是使用还是暂停，而不是要改变什么。回答被问到的问题。","Use as initial descriptive evidence, with the limits stated":"作为初步描述性证据使用，并说明局限","Memo Evidence Map: every number has a home":"Memo Evidence Map：每个数字都有出处","Each number in your note needs its own row in the Memo Evidence Map, with a workbook cell and an SPSS source.":"你说明中的每个数字，在 Memo Evidence Map 中都需要单独一行，并对应一个工作簿单元格和一个 SPSS 来源。","Drag each workbook source to the number it supports. One tile is not a source.":"把每个工作簿来源拖到它所支持的数字上。有一张卡片不是来源。","<p>The map lets a reader trace each number to a labeled result and to the matching SPSS output: D6 to the Descriptives N, F6 to the Mean, I6 to the Maximum, and G6:G20 to the parity table. Type Yes in the last column only after you reopen both files.</p>":"<p>这张映射表让读者能把每个数字追溯到一个带标签的结果，以及对应的 SPSS 输出：D6 对应 Descriptives 的 N，F6 对应 Mean，I6 对应 Maximum，G6:G20 对应一致性核对表。只有在重新打开两个文件之后，才在最后一列填写 Yes。</p>","Descriptive Statistics!I6":"Descriptive Statistics!I6","A number I rounded by hand":"一个我手动四舍五入的数字","Descriptive Statistics!D6":"Descriptive Statistics!D6","Excel-SPSS Parity!G6:G20":"Excel-SPSS Parity!G6:G20","Descriptive Statistics!F6":"Descriptive Statistics!F6","118 valid delivery times":"118 个有效配送时间","43.67-minute mean":"均值 43.67 分钟","142-minute maximum":"最大值 142 分钟","15 of 15 parity checks passed":"15 / 15 项一致性核对通过","If it is in the note, it needs a cell. A number worked out by hand cannot be traced or rechecked.":"只要写进说明，就需要一个单元格。手算出来的数字无法追溯，也无法复核。","F6 holds the mean. The valid count is in D6.":"F6 是均值。有效计数在 D6。","D6 holds the valid count. The mean is in F6.":"D6 是有效计数。均值在 F6。","I6 holds the maximum. The mean is in F6.":"I6 是最大值。均值在 F6。","F6 holds the mean. The maximum is in I6.":"F6 是均值。最大值在 I6。","Before you call it done":"在宣布完成之前","Valid plus missing equals 120 in every row. All 15 parity rows pass. Every number in the note has a cell. No source value was changed.":"每一行的有效数加缺失数都等于 120。全部 15 行一致性核对都通过。说明中的每个数字都有对应的单元格。没有改动任何源数据值。","Save the workbook and the SPSS output (.spv) under the required names, close both, reopen them, and confirm the results still appear.":"用要求的文件名保存工作簿和 SPSS 输出 (.spv)，关闭两者，再重新打开，确认结果仍然在。","The memo separates four things: the recorded facts, your interpretation, the main limitation and the recommendation.":"备忘录要区分四件事：记录的事实、你的解读、主要局限和建议。","(blank)":"(空白)","Open this page from the class site to see the dataset.":"请从课程网站打开此页面以查看数据集。","Lab checkpoints complete":"实验检查点已完成","Your checkpoint answers are saved in this browser. Finish the note and the memo in your own words.":"你的检查点答案已保存在此浏览器中。请用你自己的话完成说明和备忘录。"},"es":{"Lab 01 Checkpoints":"Puntos de control del Lab 01","GC1015 · Session 1 · Build it in Excel and SPSS, check it here":"GC1015 · Sesión 1 · Constrúyelo en Excel y SPSS, compruébalo aquí","Finish":"Terminar","Your lab result

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Should OmniRetail Staff Weekends?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@500;600&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* LessonKit engine styles.
   Layout: one lesson card per screen on a violet-tinted ground, with the case file and evidence ledger
   in a rail beside it on wide screens. The action bar stays pinned to the foot of the card. */
:root {
  --ground: #f3eff7;
  --card: #ffffff;
  --ink: #1f1a24;
  --muted: #5e5668;
  --line: #e3d9ec;
  --tint: #f7f3fb;
  --violet: #57068c;
  --ultra: #8900e1;
  --violet-soft: #efe5f7;
  --violet-line: #c9afe0;
  --on-violet: #ffffff;
  --ok: #1f7a4d;
  --ok-soft: #e4f3ea;
  --ok-line: #8fd0ad;
  --on-ok: #ffffff;
  --warn: #9a4a00;
  --warn-soft: #fff1dc;
  --warn-line: #efbf74;
  --on-warn: #ffffff;
  --guard: #c98a00;
  --arm-a: #8a7f9c;
  --arm-b: #57068c;
  --scrim: rgb(24 16 32 / 0.48);
  --shadow: 0 1px 2px rgb(31 26 36 / 0.06), 0 10px 28px rgb(31 26 36 / 0.07);
  --f-display: "Jost", "Futura", "Avenir Next", "Noto Sans SC", "Noto Sans Devanagari", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Noto Sans SC", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans SC", "Noto Sans Devanagari", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #15111a; --card: #211b29; --ink: #efe9f5; --muted: #b4a9c2; --line: #3a3046; --tint: #2a2233;
    --violet: #bb8eea; --violet-soft: #33264a; --violet-line: #6d4f92; --on-violet: #1a1022;
    --ok: #5fd197; --ok-soft: #173326; --ok-line: #2f7a52; --on-ok: #0d2117;
    --warn: #f3a952; --warn-soft: #3a2714; --warn-line: #8a5a1e; --on-warn: #2a1a08;
    --guard: #f0b429; --arm-a: #a69cba; --arm-b: #bb8eea; --scrim: rgb(0 0 0 / 0.6);
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 10px 28px rgb(0 0 0 / 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #15111a; --card: #211b29; --ink: #efe9f5; --muted: #b4a9c2; --line: #3a3046; --tint: #2a2233;
  --violet: #bb8eea; --violet-soft: #33264a; --violet-line: #6d4f92; --on-violet: #1a1022;
  --ok: #5fd197; --ok-soft: #173326; --ok-line: #2f7a52; --on-ok: #0d2117;
  --warn: #f3a952; --warn-soft: #3a2714; --warn-line: #8a5a1e; --on-warn: #2a1a08;
  --guard: #f0b429; --arm-a: #a69cba; --arm-b: #bb8eea; --scrim: rgb(0 0 0 / 0.6);
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 10px 28px rgb(0 0 0 / 0.3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--violet-line); outline-offset: 2px; }
sub { font-size: 0.72em; }
small { font-size: 0.8em; color: var(--muted); font-weight: 500; }

.lk-app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 28px; }

/* Top bar */
.lk-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); padding-block: 12px 10px; display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.lk-brand { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lk-brand b { font: 600 16px/1.2 var(--f-display); letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lk-brand span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lk-progress { display: flex; gap: 8px; min-width: 0; }
.lk-seg { flex: var(--n, 1) 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; background: none; border: 0; padding: 4px 0; cursor: pointer; text-align: left; color: var(--muted); font: 500 11.5px/1.2 var(--f-body); letter-spacing: 0.02em; border-radius: 6px; }
.lk-seg .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.lk-seg .bar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: inherit; transition: width 0.35s ease; }
.lk-seg[aria-current="step"] { color: var(--ink); font-weight: 600; }
.lk-seg .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lk-meta { display: flex; gap: 8px; align-items: center; }
.lk-pill { display: inline-flex; align-items: center; gap: 6px; font: 600 13.5px/1 var(--f-mono); color: var(--ink); padding: 8px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--card); white-space: nowrap; }
.lk-pill svg { width: 14px; height: 14px; fill: var(--ok); }
button.lk-pill { cursor: pointer; font-family: var(--f-body); font-weight: 600; }
.lk-casebtn { display: none; }

/* Stage */
.lk-stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 1020px) {
  .lk-stage { grid-template-columns: minmax(0, 1fr); }
  .lk-rail { display: none; }
  .lk-casebtn { display: inline-flex; }
}
@media (max-width: 720px) {
  .lk-top { grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
  .lk-progress { grid-column: 1 / -1; grid-row: 2; }
  .lk-seg .lbl { font-size: 10.5px; }
}

/* Card */
.lk-card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: min(660px, calc(100vh - 120px)); transition: border-color 0.2s, box-shadow 0.2s; }
.lk-card[data-state="ok"] { border-color: var(--ok-line); box-shadow: 0 0 0 5px var(--ok-soft), var(--shadow); }
.lk-card[data-state="warn"] { border-color: var(--warn-line); box-shadow: 0 0 0 5px var(--warn-soft), var(--shadow); }
.lk-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px 0; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.lk-back { background: none; border: 0; padding: 4px 6px; margin-left: -6px; border-radius: 6px; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 12.5px; }
.lk-back:disabled { opacity: 0.35; cursor: default; }
.lk-tier { font: 700 10.5px/1 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; background: var(--tint); color: var(--muted); border: 1px solid var(--line); }
.lk-tier[data-tier="Bridge"] { background: var(--violet-soft); color: var(--violet); border-color: var(--violet-line); }
.lk-tier[data-tier="Stretch"] { background: var(--violet); color: var(--on-violet); border-color: var(--violet); }
.lk-count { margin-left: auto; font: 500 12px var(--f-mono); }
.lk-body { flex: 1; padding: 18px 20px 12px; display: flex; justify-content: center; }
.lk-col { width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 16px; }
.lk-col:focus { outline: none; }
.lk-col h2 { font: 600 clamp(24px, 3.4vw, 31px)/1.15 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.005em; }
.lk-col p { margin: 0; max-width: 64ch; }
.lk-scene { display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--tint); border: 1px solid var(--line); font-size: 15.5px; }
.lk-scene::before { content: attr(data-label); font: 700 10.5px/1 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--violet); }
.lk-prompt { font-weight: 600; font-size: 16.5px; }
.lk-callout { border: 2px solid var(--violet-line); border-radius: 14px; padding: 14px 18px; background: var(--violet-soft); font: 500 18px/1.45 var(--f-display); }
.lk-art { display: flex; justify-content: center; }
.lk-art svg { width: 100%; max-width: 420px; height: auto; }
.lk-q.locked { opacity: 1; }

/* Foot */
.lk-foot { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--card); border-radius: 0 0 18px 18px; padding: 12px 20px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lk-bubble { flex: 1 1 240px; min-width: 0; font-size: 14.5px; line-height: 1.45; padding: 10px 14px; border-radius: 14px 14px 14px 4px; background: var(--tint); color: var(--ink); border: 1px solid var(--line); }
.lk-bubble[data-tone="ok"] { background: var(--ok-soft); border-color: var(--ok-line); }
.lk-bubble[data-tone="warn"] { background: var(--warn-soft); border-color: var(--warn-line); }
.lk-bubble b { font-weight: 700; }
.lk-actions { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.lk-btn { font: 600 15px/1 var(--f-body); padding: 14px 22px; border-radius: 12px; border: 0; cursor: pointer; min-width: 128px; background: var(--violet); color: var(--on-violet); box-shadow: 0 3px 0 rgb(0 0 0 / 0.22); transition: transform 0.08s, box-shadow 0.08s; }
.lk-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgb(0 0 0 / 0.22); }
.lk-btn[data-tone="ok"] { background: var(--ok); color: var(--on-ok); }
.lk-btn[data-tone="warn"] { background: var(--warn); color: var(--on-warn); }
.lk-btn.ghost { background: var(--tint); color: var(--ink); box-shadow: 0 3px 0 var(--line); border: 1px solid var(--line); }
.lk-btn:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: default; }
@media (max-width: 560px) { .lk-btn { min-width: 0; flex: 1; } .lk-actions { width: 100%; } }

/* Choice */
.lk-options { display: flex; flex-wrap: wrap; gap: 10px; }
.lk-options.stack { flex-direction: column; }
.lk-opt { font: 500 15px/1.4 var(--f-body); text-align: left; padding: 12px 16px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; background: var(--card); color: var(--ink); cursor: pointer; }
.lk-opt:hover { border-color: var(--violet-line); }
.lk-opt[aria-checked="true"] { border-color: var(--violet); background: var(--violet-soft); }
.lk-opt[data-mark="ok"] { border-color: var(--ok); background: var(--ok-soft); }
.lk-opt[data-mark="warn"] { border-color: var(--warn); background: var(--warn-soft); }
.lk-opt[data-dim] { opacity: 0.45; }

/* Tiles */
.lk-tiles { display: flex; flex-direction: column; gap: 14px; }
.lk-slots { display: grid; gap: 10px; }
.lk-slot { display: grid; grid-template-columns: minmax(0, 11.5rem) minmax(0, 1fr); gap: 12px; align-items: center; }
.lk-slot .name { font: 600 14px/1.3 var(--f-body); }
.lk-drop { min-height: 54px; border: 2px dashed var(--violet-line); border-radius: 12px; padding: 5px; display: flex; align-items: stretch; background: var(--tint); cursor: pointer; }
.lk-drop:empty::before { content: attr(data-ph); align-self: center; color: var(--muted); font-size: 13px; padding-inline: 8px; }
.lk-drop.hover { border-color: var(--violet); background: var(--violet-soft); }
.lk-drop[data-mark="ok"] { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.lk-drop[data-mark="warn"] { border-style: solid; border-color: var(--warn); background: var(--warn-soft); }
.lk-bank { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-radius: 14px; border: 1.5px solid var(--line); min-height: 66px; align-content: flex-start; }
.lk-bank.hover { border-color: var(--violet); }
.lk-bank:empty::before { content: attr(data-empty); color: var(--muted); font-size: 13px; align-self: center; }
.lk-tile { font: 500 14px/1.35 var(--f-body); padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--line); border-bottom-width: 3px; background: var(--card); color: var(--ink); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; text-align: left; }
.lk-tile[aria-pressed="true"] { border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-soft); }
.lk-tile.lifting { opacity: 0.35; }
.lk-drop .lk-tile { flex: 1; }
.lk-ghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -60%) rotate(-2deg); box-shadow: 0 12px 28px rgb(0 0 0 / 0.22); cursor: grabbing; max-width: 280px; }
.lk-matrix { display: grid; gap: 8px; align-items: stretch; }
.lk-matrix .mx-col, .lk-matrix .mx-row, .lk-matrix .mx-corner { font: 600 13px/1.3 var(--f-body); display: flex; align-items: center; }
.lk-matrix .mx-col { justify-content: center; text-align: center; padding: 4px; }
.lk-matrix .mx-corner { color: var(--muted); font-weight: 500; font-size: 12px; }
.lk-matrix .lk-drop { min-height: 64px; }
@media (max-width: 560px) { .lk-slot { grid-template-columns: 1fr; gap: 4px; } .lk-matrix { font-size: 12px; } }

/* Blanks */
.lk-lines { display: flex; flex-direction: column; gap: 12px; font: 500 16.5px/1.6 var(--f-mono); }
.lk-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lk-blank { font: 600 16.5px var(--f-mono); text-align: center; padding: 6px; border: 2px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); max-width: 100%; }
.lk-blank:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-soft); }
.lk-blank[data-mark="ok"] { border-color: var(--ok); background: var(--ok-soft); }
.lk-blank[data-mark="warn"] { border-color: var(--warn); background: var(--warn-soft); }

/* Controls and readouts */
.lk-controls { display: grid; gap: 10px; }
.lk-range { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr) 4.5rem; gap: 12px; align-items: center; }
.lk-range label { font: 600 13px/1.25 var(--f-body); color: var(--muted); }
.lk-range output { font: 600 14px var(--f-mono); text-align: right; }
.lk-range input[type="range"] { width: 100%; accent-color: var(--violet); }
.lk-readout { display: flex; flex-wrap: wrap; gap: 8px; }
.lk-stat { padding: 8px 12px; border-radius: 10px; background: var(--tint); border: 1px solid var(--line); font: 500 12px/1.3 var(--f-body); color: var(--muted); display: flex; flex-direction: column; gap: 3px; min-width: 6.5rem; }
.lk-stat b { font: 600 16px/1.1 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.lk-stat[data-tone="ok"] { border-color: var(--ok-line); background: var(--ok-soft); }
.lk-stat[data-tone="warn"] { border-color: var(--warn-line); background: var(--warn-soft); }
.lk-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font: 600 12.5px/1.3 var(--f-body); border: 1px solid var(--line); background: var(--tint); color: var(--ink); }
.lk-chip[data-tone="ok"] { background: var(--ok-soft); border-color: var(--ok-line); }
.lk-chip[data-tone="warn"] { background: var(--warn-soft); border-color: var(--warn-line); }
.lk-caption { font-size: 12.5px; color: var(--muted); }

/* Figures */
.lk-figure { display: flex; flex-direction: column; gap: 12px; }
.lk-fig { width: 100%; }
.lk-fig svg { width: 100%; height: auto; display: block; overflow: visible; touch-action: pan-y; }
.lk-fig text { font: 500 11px var(--f-body); fill: var(--muted); }
.lk-fig text.strong { fill: var(--ink); font-weight: 600; }
.lk-fig .ax { stroke: var(--line); stroke-width: 1.2; }
.lk-fig .gridline { stroke: var(--line); stroke-dasharray: 2 4; }
/* Chart and illustration paint classes (shared by figures and story art) */
svg .c-a { fill: none; stroke: var(--arm-a); stroke-width: 2.2; }
svg .c-b { fill: none; stroke: var(--arm-b); stroke-width: 2.4; }
svg .f-a { fill: var(--arm-a); }
svg .f-b, svg .dot-b { fill: var(--arm-b); }
svg .f-warn { fill: var(--warn); opacity: 0.3; }
svg .f-ok { fill: var(--ok); opacity: 0.26; }
svg .f-guard { fill: var(--guard); opacity: 0.32; }
svg .f-ok-solid { fill: var(--ok); }
svg .f-warn-solid { fill: var(--warn); }
svg .f-soft { fill: var(--violet-soft); stroke: var(--violet); stroke-width: 1.5; }
svg .f-card { fill: var(--card); stroke: var(--line); stroke-width: 2; }
svg .f-line { fill: var(--line); }
svg .f-tint { fill: var(--tint); }
svg .f-ink { fill: var(--ink); }
svg .s-guard { stroke: var(--guard); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
svg .s-ink { stroke: var(--ink); stroke-width: 1.6; fill: none; }
svg .s-muted { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
svg .s-violet { stroke: var(--violet); stroke-width: 2.5; fill: none; }
svg text.t-warn { fill: var(--warn); font-weight: 600; }
svg text.t-ok { fill: var(--ok); font-weight: 600; }
svg text.t-violet { fill: var(--violet); font-weight: 600; }
svg text.t-guard { fill: var(--guard); font-weight: 600; }
svg text.t-on { fill: var(--on-violet); font-weight: 600; }
.lk-art text { font: 600 12px var(--f-body); fill: var(--ink); }
.lk-checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lk-checklist li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: 14.5px; }
.lk-checklist li > span:first-child { min-width: 0; }
.lk-checklist li small { display: block; font-family: var(--f-mono); }
.lk-checklist .lk-chip { flex: none; }
.lk-funnel { display: grid; gap: 6px; }
.lk-funnel div { margin-inline: auto; padding: 9px 12px; border-radius: 10px; background: var(--violet-soft); border: 1px solid var(--violet-line); text-align: center; font-size: 14px; font-weight: 600; max-width: 100%; }
.lk-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.lk-legend span { display: inline-flex; align-items: center; gap: 6px; }
.lk-legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.lk-handle { cursor: ew-resize; touch-action: none; outline: none; }
.lk-handle .hl { stroke: var(--ink); stroke-width: 2; }
.lk-handle .hk { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.lk-handle .ha { fill: var(--ink); }
.lk-handle .ht { font: 600 12px var(--f-mono); fill: var(--ink); }
.lk-handle:hover .hk, .lk-handle.drag .hk { fill: var(--violet-soft); }
.lk-handle:focus-visible .hk { stroke: var(--violet); stroke-width: 3.5; }

/* Rail */
.lk-rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); display: flex; flex-direction: column; gap: 14px; }
.lk-panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.lk-panel h3 { font: 700 11px/1.2 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.lk-panel p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.lk-facts { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.lk-facts th, .lk-facts td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.lk-facts th { font-weight: 600; color: var(--muted); font-size: 12px; }
.lk-facts th:first-child, .lk-facts td:first-child { text-align: left; }
.lk-notes { margin: 8px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
.lk-ledger { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.lk-ledger li { display: grid; gap: 1px; }
.lk-ledger .k { color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em; }
.lk-ledger .v { font: 600 13px/1.35 var(--f-mono); }
.lk-ledger .v.pending { color: var(--muted); font: italic 400 12.5px/1.35 var(--f-body); }
.lk-restart { margin-top: 2px; background: none; border: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 4px 0; text-align: left; }

/* Sheet */
.lk-sheet { position: fixed; inset: 0; z-index: 80; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.lk-sheet-card { background: var(--card); color: var(--ink); border-radius: 20px; max-width: 640px; width: 100%; max-height: min(84vh, 760px); overflow: auto; padding: 22px 24px 24px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.lk-sheet-card header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- v2: cross-references, toolkit reader, motion ---------- */
.lk-card { scroll-margin-top: 84px; }
.lk-foot { box-shadow: 0 -10px 18px -16px rgb(31 26 36 / 0.35); }

.lk-ref svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }
.lk-ref:hover { background: var(--violet); color: var(--on-violet); }
.lk-sheet-card.wide { max-width: 860px; max-height: min(90vh, 900px); padding: 0; display: flex; flex-direction: column; overflow: hidden; }

.lk-tk-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; top: -14px; background: var(--card); padding-block: 8px; z-index: 1; border-bottom: 1px solid var(--line); }

.lk-tk-sec { scroll-margin-top: 64px; border-radius: 12px; padding: 6px 8px; margin-inline: -8px; }
.lk-tk-sec h3 { font: 600 21px/1.25 var(--f-display); margin: 10px 0 6px; text-wrap: balance; }

.lk-tk-practise { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.lk-tk-content { display: grid; gap: 10px; font-size: 15px; line-height: 1.6; }
.lk-tk-content p, .lk-tk-content ul, .lk-tk-content ol { margin: 0; }
.lk-tk-content ul, .lk-tk-content ol { padding-left: 22px; display: grid; gap: 4px; }
.lk-tk-content .tbl { overflow-x: auto; }
.lk-tk-content table { border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; min-width: 100%; }
.lk-tk-content th, .lk-tk-content td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.lk-tk-content th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.lk-tk-content pre { background: var(--tint); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font: 500 13px/1.5 var(--f-mono); margin: 0; }
.lk-tk-content .key { border: 2px solid var(--violet-line); background: var(--violet-soft); border-radius: 12px; padding: 10px 14px; font-weight: 500; }
.lk-tk-content .key::before { content: "Key idea"; display: block; font: 700 10.5px/1.4 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--violet); }
.lk-tk-content .mblock { overflow-x: auto; text-align: center; padding: 4px 0; }
.lk-tk-content math { font-size: 1.08em; }
.lk-tk-content a { color: var(--violet); overflow-wrap: anywhere; }
.lk-why-more { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 6px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

/* Motion */
@keyframes lk-in-fwd { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes lk-in-back { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
@keyframes lk-pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
@keyframes lk-shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes lk-bump { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
@keyframes lk-float { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -46px); } }

@keyframes lk-fall { from { transform: translate(0, -20px) rotate(0); opacity: 1; } to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); opacity: 0.9; } }
@keyframes lk-toast-in { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }

@keyframes lk-flash { 0%, 40% { background: var(--violet-soft); } 100% { background: transparent; } }
@keyframes lk-glow { 0% { box-shadow: 0 0 0 0 var(--ok-soft), var(--shadow); } 100% { box-shadow: 0 0 0 5px var(--ok-soft), var(--shadow); } }
.lk-col.enter-fwd { animation: lk-in-fwd 0.32s cubic-bezier(.2,.7,.2,1) both; }
.lk-col.enter-back { animation: lk-in-back 0.32s cubic-bezier(.2,.7,.2,1) both; }
.lk-card[data-state="ok"] { animation: lk-glow 0.4s ease; }
.lk-q.shake { animation: lk-shake 0.38s ease; }
.lk-pill.bump { animation: lk-bump 0.45s ease; }
.lk-opt, .lk-tile { transition: transform 0.12s ease, border-color 0.15s, background 0.15s; position: relative; }
.lk-opt:hover:not([data-mark]), .lk-tile:hover { transform: translateY(-1px); }
.lk-opt[aria-checked="true"]:not([data-mark]) { animation: lk-pop 0.22s ease; }
.lk-opt[data-mark]::after, .lk-drop[data-mark]::after { position: absolute; top: -9px; right: -9px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--f-body); animation: lk-pop 0.3s ease both; }
.lk-opt[data-mark="ok"]::after, .lk-drop[data-mark="ok"]::after { content: "\2713"; background: var(--ok); color: var(--on-ok); }
.lk-opt[data-mark="warn"]::after, .lk-drop[data-mark="warn"]::after { content: "!"; background: var(--warn); color: var(--on-warn); }
.lk-drop { position: relative; }
.lk-float { position: fixed; z-index: 90; pointer-events: none; font: 700 15px var(--f-mono); color: var(--ok); animation: lk-float 1s ease-out forwards; }
.lk-burst { position: fixed; z-index: 90; pointer-events: none; width: 0; height: 0; }
.lk-burst i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; background: var(--ok); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: lk-spark 0.8s cubic-bezier(.15,.7,.3,1) forwards; }
.lk-burst i:nth-child(3n) { background: var(--violet); }
.lk-burst i:nth-child(3n+1) { background: var(--guard); }
.lk-confetti { position: fixed; inset: 0; z-index: 95; pointer-events: none; overflow: hidden; }
.lk-confetti i { position: absolute; top: 0; width: 9px; height: 14px; border-radius: 2px; animation: lk-fall var(--t) cubic-bezier(.3,.5,.4,1) var(--d) forwards; }
.lk-toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); z-index: 92; transform: translateX(-50%); background: var(--ink); color: var(--card); font: 600 14px/1.3 var(--f-body); padding: 12px 18px; border-radius: 14px; box-shadow: var(--shadow); animation: lk-toast-in 0.3s ease both; transition: opacity 0.4s, transform 0.4s; display: flex; gap: 10px; align-items: center; max-width: calc(100vw - 32px); }
.lk-toast.out { opacity: 0; transform: translate(-50%, 10px); }
.lk-toast b { color: var(--ok-line); }
svg .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: lk-draw 0.9s ease forwards; }
svg .pop { transform-box: fill-box; transform-origin: center; animation: lk-pop 0.35s ease both; }
@media (prefers-reduced-motion: reduce) {
  svg .draw { stroke-dasharray: none; stroke-dashoffset: 0; }
  .lk-float, .lk-burst, .lk-confetti { display: none; }
}

/* ---------- v2: languages ---------- */
.lk-en { display: block; margin-top: 3px; font: 400 0.8em/1.4 var(--f-body); color: var(--muted); letter-spacing: 0; }
.lk-col h2 .lk-en { font-size: 15px; font-weight: 500; margin-top: 6px; }
.lk-opt .lk-en { font-size: 12.5px; }
.lk-bubble .lk-en { font-size: 12.5px; }
.lk-en-block { border-top: 1px solid var(--line); padding-top: 8px; color: var(--muted); font-size: 14px; display: grid; gap: 6px; }
.lk-en-block summary { cursor: pointer; font-weight: 600; color: var(--violet); }
.lk-lang { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--card); }
.lk-lang select { border: 0; background: transparent; font: 600 13px var(--f-body); color: var(--ink); padding: 4px 2px; cursor: pointer; max-width: 9rem; }
.lk-globe svg { width: 15px; height: 15px; fill: none; stroke: var(--violet); stroke-width: 1.8; display: block; }
.lk-echo { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); padding-right: 6px; border-left: 1px solid var(--line); padding-left: 8px; white-space: nowrap; }
.lk-echo input { accent-color: var(--violet); margin: 0; }
.lk-ai { font-size: 11.5px; color: var(--muted); font-style: italic; }
.lk-meta { flex-wrap: wrap; justify-content: flex-end; }
.lk-bubble.pop-in { animation: lk-rise 0.25s ease both; }
@keyframes lk-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 720px) { .lk-echo { display: none; } .lk-ai { display: none; } }

.lk-pill svg.book, .lk-ref svg.book { fill: none; stroke: currentColor; stroke-width: 2; width: 14px; height: 14px; }
.lk-line > span { white-space: pre-wrap; }
.lk-tk-bar { flex-wrap: nowrap; }
.lk-tk-bar .lk-btn { flex: none; }
.lk-tk-toc { flex-wrap: nowrap; overflow-x: auto; min-width: 0; scrollbar-width: thin; padding-bottom: 2px; }
.lk-tk-toc button { flex: none; white-space: nowrap; }
.lk-tk-sec { scroll-margin-top: 78px; }

/* ---------- Lookup tables (t, z, chi-square) ---------- */
.lk-lookup-wrap { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--card); max-width: 100%; overscroll-behavior: contain; }
.lk-lookup { border-collapse: separate; border-spacing: 0; font: 500 13.5px/1 var(--f-mono); font-variant-numeric: tabular-nums; width: 100%; }
.lk-lookup th { position: sticky; background: var(--tint); color: var(--muted); font: 600 12px/1.2 var(--f-body); padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; transition: background 0.15s, color 0.15s; white-space: nowrap; }
.lk-lookup thead th { top: 0; z-index: 2; }
.lk-lookup thead th small { display: block; font: 500 10px/1.3 var(--f-body); margin-top: 2px; color: inherit; opacity: 0.85; }
.lk-lookup tbody th { left: 0; z-index: 1; text-align: right; border-right: 1px solid var(--line); font: 600 12.5px var(--f-mono); }
.lk-lookup thead th.corner { left: 0; z-index: 3; text-align: left; font-size: 11px; }
.lk-lookup th.on { background: var(--violet); color: var(--on-violet); }
.lk-lookup td { padding: 2px; border-bottom: 1px solid var(--line); }
.lk-lookup .cell { width: 100%; min-width: 4.4em; border: 0; border-radius: 6px; background: transparent; font: inherit; color: var(--ink); padding: 6px 6px; cursor: pointer; text-align: center; transition: background 0.12s; }
.lk-lookup .cell.row, .lk-lookup .cell.col { background: var(--violet-soft); }

.lk-lookup .cell:focus-visible { outline: 2px solid var(--violet); outline-offset: -2px; }
.lk-lookup .cell.picked { background: var(--violet); color: var(--on-violet); font-weight: 700; animation: lk-pop 0.3s ease; }
.lk-lookup .cell[data-mark="ok"] { background: var(--ok); color: var(--on-ok); }
.lk-lookup .cell[data-mark="warn"] { background: var(--warn); color: var(--on-warn); }
.lk-lookup .cell.picked, .lk-lookup .cell.picked.row, .lk-lookup .cell.picked.col, .lk-lookup .cell.picked.row.col { background: var(--violet); color: var(--on-violet); font-weight: 700; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--violet); }

.lk-lookup .cell.picked[data-mark="warn"] { background: var(--warn); color: var(--on-warn); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--warn); }
.lk-lookup-wrap { isolation: isolate; }
.lk-foot { z-index: 5; }
.lk-lookup { font-size: 12.5px; }
.lk-lookup .cell { min-width: 0; padding: 6px 3px; }
.lk-lookup th { padding: 6px 5px; }

/* ---------- Class sync: status pill and PIN sign-in ---------- */
.lk-sync { display: inline-flex; align-items: center; gap: 7px; font: 600 12.5px/1 var(--f-body); padding: 8px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; white-space: nowrap; }
.lk-sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.lk-sync[data-status="saving"]::before, .lk-sync[data-status="pending"]::before { background: var(--guard); animation: lk-bump 0.9s ease infinite; }
.lk-sync[data-status="offline"] { border-color: var(--warn-line); background: var(--warn-soft); }
.lk-sync[data-status="offline"]::before { background: var(--warn); }
.lk-sync[data-status="guest"] { color: var(--muted); }
.lk-sync[data-status="guest"]::before { background: var(--line); }
.lk-pin-form { display: grid; gap: 10px; }
.lk-pin-form label { font-weight: 600; font-size: 14px; }
.lk-pin { font: 600 28px/1 var(--f-mono); letter-spacing: 0.3em; text-align: center; padding: 14px 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); width: 100%; }
.lk-pin:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 4px var(--violet-soft); }
.lk-pin.shake { animation: lk-shake 0.38s ease; }
.lk-pin-msg { min-height: 1.3em; color: var(--warn); font-size: 13.5px; margin: 0; }
.lk-pin-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
@media (max-width: 720px) { .lk-sync { max-width: 9.5rem; overflow: hidden; text-overflow: ellipsis; } }

/* ---------- Dataset explorer ---------- */
.lk-x { display: grid; gap: 10px; }
.lk-x-wrap { overflow: auto; max-height: 260px; border: 1px solid var(--line); border-radius: 12px; isolation: isolate; }
.lk-x-table { border-collapse: collapse; width: 100%; font: 500 13px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.lk-x-table th { position: sticky; top: 0; background: var(--tint); color: var(--muted); font: 600 12px var(--f-body); text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); z-index: 1; }
.lk-x-table td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lk-x-table tr.more td { color: var(--muted); font-family: var(--f-body); font-style: italic; background: var(--tint); }
.lk-x-count { justify-self: center; font: 600 15px var(--f-mono); padding: 8px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.lk-x-filters { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 12px; margin: 0; display: flex; flex-wrap: wrap; gap: 10px 16px; }
.lk-x-filters legend { font: 700 11px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
.lk-x-filter { display: grid; gap: 4px; font-size: 12.5px; }
.lk-x-filter label { font-family: var(--f-mono); color: var(--muted); }
.lk-x-filter select { font: 500 14px var(--f-body); padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-width: 7rem; }

/* Study mode: the site's bar already names the lesson, so the frame drops its own title. */
.lk-embed .lk-brand { display: none; }
.lk-embed .lk-top { grid-template-columns: minmax(0, 1fr) auto; }

  // A printed statistical table (t, z, chi-square...) read by tapping a cell. Hover or focus draws a

  // o: { rows: [{key, label}], cols: [{key, label, sub}], value(row, col) -> string, corner, label, maxHeight, onPick(row, col, i, j) }
  function lookup(el, o) {

    const cells = [], colHeads = [], rowHeads = [];
    const hr = h('tr', null, h('th', { class: 'corner', scope: 'col' }, ...rich(o.corner || '')));
    o.cols.forEach((c) => { const th = h('th', { scope: 'col' }, h('span', null, ...rich(c.label)), c.sub ? h('small', null, ...rich(c.sub)) : null); colHeads.push(th); hr.append(th); });
    const tbody = h('tbody');
    o.rows.forEach((r, i) => {

      rowHeads.push(th);
      const tr = h('tr', null, th);
      cells[i] = [];
      o.cols.forEach((c, j) => {

        const b = h('button', { type: 'button', class: 'cell', tabindex: i === 0 && j === 0 ? 0 : -1, 'aria-label': `${strip(r.label)}, ${strip(c.label)}: ${v}` }, v);

        b.addEventListener('click', () => pick(i, j));
        b.addEventListener('keydown', (e) => {
          const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
          if (!d) return;

          b.tabIndex = -1; cells[ni][nj].tabIndex = 0; cells[ni][nj].focus();

    table.addEventListener('pointerleave', () => cross(picked ? picked.r : -1, picked ? picked.c : -1));

    el.append(wrap);
    function cross(i, j) {
      if (hl.r >= 0) { rowHeads[hl.r].classList.remove('on'); cells[hl.r].forEach((b) => b.classList.remove('row')); }
      if (hl.c >= 0) { colHeads[hl.c].classList.remove('on'); cells.forEach((row) => row[hl.c].classList.remove('col')); }
      hl = { r: i, c: j };
      if (i >= 0) { rowHeads[i].classList.add('on'); cells[i].forEach((b) => b.classList.add('row')); }
      if (j >= 0) { colHeads[j].classList.add('on'); cells.forEach((row) => row[j].classList.add('col')); }
    }
    function pick(i, j, fire = true) {

  /* ---------- Answer helpers (shared with Node validation) ---------- */

  /* ---------- Question widgets ---------- */

  function parseNum(str) {

  /* ---------- Runtime ---------- */
  let L = null, S = null, cur = null;

    els.secondary = h('button', { type: 'button', class: 'lk-btn ghost', hidden: true });
    els.primary = h('button', { type: 'button', class: 'lk-btn' });
    els.card = h('section', { class: 'lk-card', 'aria-label': strip(tr(L.title)) }, els.head, els.body,
      h('div', { class: 'lk-foot' }, els.bubble, h('div', { class: 'lk-actions' }, els.secondary, els.primary)));
    els.rail = h('aside', { class: 'lk-rail', 'aria-label': ui('caseFile') });
    root.append(h('div', { class: 'lk-app' }, top, h('main', { class: 'lk-stage' }, els.card, els.rail)));
    if (!els.keyBound) { document.addEventListener('keydown', onKey); els.keyBound = true; }
    rail();
    renderPill();
  }

  function onKey(e) {
    if (e.key === 'Escape' && els.sheet) { closeSheet(); return; }
    if (e.key !== 'Enter' || els.sheet) return;
    const t = e.target;
    if (t.closest && t.closest('button, a, textarea, select, [role="slider"], [role="button"]')) return;
    if (t.tagName === 'INPUT' && t.type !== 'text') return;
    if (!els.primary.disabled && !els.primary.hidden) { e.preventDefault(); els.primary.click(); }
  }

  function go(i, initial, keep) {
    i = clamp(i, 0, L.screens.length - 1);
    const dir = cur && i < cur.sc._i ? 'back' : 'fwd';
    S.i = i; save({ nav: true });
    const sc = L.screens[i];
    const a = api(sc);
    els.head.replaceChildren(...[
      h('button', { type: 'button', class: 'lk-back', disabled: i === 0, onclick: () => go(i - 1) }, ui('back')),
      h('span', null, strip(tr(L.parts[sc.part]))),
      h('span', { class: 'lk-tier', 'data-tier': sc.tier }, sc.tier),
      LANG !== 'en' ? h('span', { class: 'lk-ai' }, ui('aiNote')) : null,
      h('span', { class: 'lk-count' }, `${i + 1} / ${L.screens.length}`)].filter(Boolean));
    const col = h('div', { class: `lk-col${initial ? '' : ` enter-${dir}`}`, tabindex: -1 });
    els.body.replaceChildren(col);
    if (sc.title) col.append(h('h2', null, ...said(sc.title)));
    if (sc.refs && L.toolkit) col.append(h('div', { class: 'lk-refs' }, sc.refs.map((r) => refChip(r, i))));
    if (sc.art) col.append(h('div', { class: 'lk-art', html: sc.art }));
    if (sc.scene) col.append(h('div', { class: 'lk-scene', 'data-label': ui('scene') }, h('p', null, ...said(sc.scene))));
    for (const p of [].concat(sc.body || [])) col.append(h('p', null, ...said(p)));
    if (sc.callout) col.append(h('div', { class: 'lk-callout' }, ...said(sc.callout)));
    let fig = null;
    if (sc.figure) { const fe = h('div', { class: 'lk-figure' }); col.append(fe); fig = sc.figure(fe, a) || null; }
    if (sc.prompt) col.append(h('p', { class: 'lk-prompt' }, ...said(sc.prompt)));
    const q = h('div', { class: 'lk-q' });
    col.append(q);
    for (const p of [].concat(sc.after || [])) col.append(h('p', { class: 'lk-caption' }, ...said(p)));

    let ctrl = null;
    if (sc.type === 'choice') ctrl = choiceWidget(q, sc, a);
    else if (sc.type === 'tiles') ctrl = tilesWidget(q, sc, a);
    else if (sc.type === 'blanks') ctrl = blanksWidget(q, sc, a);
    else if (sc.type === 'custom') ctrl = sc.render(q, a, fig);
    else if (sc.type === 'poll') ctrl = pollWidget(q, sc, a);
    cur = { sc, ctrl, q, fig, mode: null, api: a };
    if (EMBED) post({ type: 'lk:screen', i, id: sc.id, title: strip(tr(sc.title || '')), refs: sc.refs || [], part: sc.part, tier: sc.tier, done: !!S.res[sc.id] });

    bubble(null);
    if (graded(sc) && S.res[sc.id]) { ctrl.reveal(); lock(); setMode('done'); }
    else if (sc.type === 'poll') {
      if (S.polls[sc.id] != null) { ctrl.mark(S.polls[sc.id]); const o = sc.options[S.polls[sc.id]]; bubble(said(o.reply || sc.reply || ui('noted')), 'neutral'); setMode('read', { keepBubble: true }); }
      else setMode('poll');
    } else {
      setMode(graded(sc) ? 'idle' : 'read');
      if (keep !== undefined && ctrl?.restore) { ctrl.restore(keep); refreshPrimary(); }
    }
    progress();
    rail();
    if (!initial) {
      col.focus({ preventScroll: true });
      els.card.scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' });
    }
  }

  function lock() { cur.q.inert = true; cur.q.classList.add('locked'); }

  // Accepts an English lesson string (translated here), a list of nodes, or null to hide.
  function bubble(content, tone) {
    if (!content) { els.bubble.hidden = true; els.bubble.replaceChildren(); return; }
    els.bubble.hidden = false;
    els.bubble.dataset.tone = tone || 'neutral';
    els.bubble.replaceChildren(...(Array.isArray(content) ? content : rich(content)));
    restart(els.bubble, 'pop-in');
  }

  function btn(el, label, fn, tone, disabled) {
    if (!label) { el.hidden = true; el.onclick = null; return; }
    el.hidden = false;
    el.textContent = label;
    el.onclick = fn;
    el.disabled = !!disabled;
    if (tone) el.dataset.tone = tone; else el.removeAttribute('data-tone');
  }

  function refreshPrimary() { if (cur.mode === 'idle') els.primary.disabled = !(cur.ctrl && cur.ctrl.ready()); }

  function setMode(m, info = {}) {
    cur.mode = m;
    const sc = cur.sc;
    els.card.dataset.state = m === 'ok' ? 'ok' : m === 'warn' ? 'warn' : 'idle';
    const last = sc._i === L.screens.length - 1;
    const nextLabel = last ? (L.finishLabel ? tr(L.finishLabel) : ui('finish')) : ui('continue');
    const why = sc.why ? ui('why') : null;
    if (!info.keepBubble && !['ok', 'warn', 'revealed'].includes(m)) bubble(null);
    switch (m) {
      case 'read': btn(els.primary, nextLabel, next); btn(els.secondary, null); break;
      case 'poll': btn(els.primary, ui('continue'), null, null, true); btn(els.secondary, null); break;
      case 'idle': btn(els.primary, ui('check'), check, null, !cur.ctrl.ready()); btn(els.secondary, null); break;
      case 'ok': bubble(info.nodes, 'ok'); btn(els.primary, nextLabel, next, 'ok'); btn(els.secondary, why, openWhy); break;
      case 'warn': bubble(info.nodes, 'warn'); btn(els.primary, ui('tryAgain'), tryAgain, 'warn'); btn(els.secondary, ui('seeAnswer'), seeAnswer); break;
      case 'revealed': bubble(ui('revealed'), 'neutral'); btn(els.primary, sc.why ? ui('why') : nextLabel, sc.why ? openWhy : next); btn(els.secondary, sc.why ? ui('skipWhy') : null, next); break;
      case 'done': btn(els.primary, nextLabel, next); btn(els.secondary, why, openWhy); break;
    }
  }

  function award(kind) {
    const sc = cur.sc;
    const partDone = () => L.screens.filter((x) => x.part === sc.part && graded(x)).every((x) => S.res[x.id]);
    const wasDone = partDone();
    S.res[sc.id] = kind;
    const gained = kind === 'first' ? 10 : kind === 'retry' ? 5 : 0;
    S.pts += gained;
    if (sc.ledger) S.ledger[sc.ledger.id] = typeof sc.ledger.value === 'function' ? sc.ledger.value(S) : sc.ledger.value;
    save(); progress(); rail();
    floatPoints(gained);
    if (!wasDone && partDone()) setTimeout(() => toast(`<b>✓</b> ${ui('partDone', { n: sc.part + 1, name: strip(tr(L.parts[sc.part])) })}`), 450);
    return gained;
  }

  function check() {
    const sc = cur.sc;
    const r = cur.ctrl.check();
    if (r.ok) {
      syncEvent('correct', { first: !S.tries[sc.id], tries: (S.tries[sc.id] || 0) + 1 });
      award(S.tries[sc.id] ? 'retry' : 'first');
      lock();
      let praise = r.praise || sc.praise;
      if (typeof praise === 'function') praise = praise(S);
      const praiseList = ui('praise');
      setMode('ok', { nodes: praise ? said(praise) : rich(praiseList[sc._i % praiseList.length]) });
      burst(els.primary);
    } else {
      S.tries[sc.id] = (S.tries[sc.id] || 0) + 1;
      syncEvent('wrong', { tries: S.tries[sc.id], hint: r.hint ? strip(r.hint).slice(0, 160) : '' });
      save();
      setMode('warn', { nodes: r.hint ? said(r.hint) : rich(r.uiHint || ui('notQuite')) });
      if (!reduced()) restart(cur.q, 'shake');
    }
  }
  function tryAgain() { cur.ctrl.reset?.(); setMode('idle'); cur.ctrl.focus?.(); }
  function seeAnswer() { syncEvent('revealed', {}); cur.ctrl.reveal(); award('revealed'); lock(); setMode('revealed'); }
  function next() {
    const i = cur.sc._i;
    if (i < L.screens.length - 1) go(i + 1);
    else { syncEvent('finish', { points: S.pts }); if (L.onFinish) L.onFinish(S, api(cur.sc)); }
    syncNow();
  }

  function progress() {
    els.pts.querySelector('.n').textContent = S.pts;
    L.parts.forEach((p, pi) => {
      const list = L.screens.filter((sc) => sc.part === pi);
      const done = list.filter((sc) => (graded(sc) ? S.res[sc.id] : sc._i < S.i || (sc.type === 'poll' && S.polls[sc.id] != null))).length;
      els.segs[pi].querySelector('i').style.width = `${Math.round(100 * done / list.length)}%`;
      if (cur && cur.sc.part === pi) els.segs[pi].setAttribute('aria-current', 'step'); else els.segs[pi].removeAttribute('aria-current');
    });
  }

  function railContent() {
    const cf = L.caseFile || {};
    const panels = [];
    if (cf.title) {
      const p = h('section', { class: 'lk-panel' }, h('h3', null, strip(tr(cf.title))));
      for (const line of [].concat(cf.intro || [])) p.append(h('p', null, ...rich(tr(line))));
      if (cf.table) {
        p.append(h('table', { class: 'lk-facts' },
          h('thead', null, h('tr', null, cf.table.head.map((c) => h('th', null, ...rich(tr(c)))))),
          h('tbody', null, cf.table.rows.map((r) => h('tr', null, r.map((c) => h('td', null, ...rich(tr(c)))))))));
      }
      if (cf.notes) p.append(h('ul', { class: 'lk-notes' }, cf.notes.map((n) => h('li', null, ...rich(tr(n))))));
      panels.push(p);
    }
    if (L.ledger) {
      panels.push(h('section', { class: 'lk-panel' }, h('h3', null, strip(tr(L.ledgerTitle || 'Evidence so far'))),
        h('ul', { class: 'lk-ledger' }, L.ledger.map((it) => {
          const v = S.ledger[it.id];
          return h('li', null, h('span', { class: 'k' }, ...rich(tr(it.label))), h('span', { class: 'v' + (v ? '' : ' pending') }, ...rich(v ? tr(v) : (it.pending ? tr(it.pending) : ui('notYet')))));
        }))));
    }
    const gradedList = L.screens.filter(graded);
    const firsts = gradedList.filter((sc) => S.res[sc.id] === 'first').length;
    const done = gradedList.filter((sc) => S.res[sc.id]).length;
    const restartBtn = h('button', { type: 'button', class: 'lk-restart' }, ui('restart'));
    restartBtn.addEventListener('click', () => {
      if (restartBtn.dataset.armed) { S = fresh(); Sync.reset = true; save(); closeSheet(); shell(); go(0); }
      else { restartBtn.dataset.armed = '1'; restartBtn.textContent = ui('restartConfirm'); }
    });
    panels.push(h('section', { class: 'lk-panel' }, h('h3', null, ui('progressTitle')),
      h('p', null, ui('progressLine', { done, total: gradedList.length, first: firsts })), restartBtn));
    return panels;
  }
  function rail() { if (els.rail) els.rail.replaceChildren(...railContent()); }

  function sheet(title, nodes, onClose, opts = {}) {
    closeSheet();
    const x = h('button', { type: 'button', class: 'x', 'aria-label': ui('close') }, '×');
    const card = h('div', { class: 'lk-sheet-card' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': strip(title) },
      h('header', null, h('h3', null, ...rich(title)), x), h('div', { class: 'lk-sheet-body' }, nodes));
    const wrap = h('div', { class: 'lk-sheet' }, card);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) closeSheet(); });
    x.addEventListener('click', closeSheet);
    els.sheet = wrap;
    els.sheetClose = onClose;
    els.sheetReturn = document.activeElement;
    document.body.append(wrap);
    x.focus();
  }
  function closeSheet() {
    if (!els.sheet) return;
    els.sheet.remove();
    els.sheet = null;
    const cb = els.sheetClose; els.sheetClose = null;
    if (cb) cb();
    els.sheetReturn?.focus?.({ preventScroll: true });
  }
  function openWhy() {
    const sc = cur.sc;
    const en = typeof sc.why === 'function' ? sc.why(S) : sc.why;
    const t = tr(en);
    const nodes = rich(t);
    if (LANG !== 'en' && SHOW_EN && t !== en) nodes.push(h('details', { class: 'lk-en-block', lang: 'en' }, h('summary', null, ui('english')), ...rich(en)));
    if (sc.refs && L.toolkit) nodes.push(h('div', { class: 'lk-why-more' }, ui('readMore'), sc.refs.map((r) => refChip(r, sc._i))));
    sheet(ui('whyTitle'), nodes, () => { if (cur.mode === 'revealed') setMode('done'); });
  }
  function openCase() {
    const r = h('div', { class: 'lk-rail' }, railContent());
    sheet(strip(tr(L.caseFile?.title)) || ui('caseFile'), [r]);
  }

  globalThis.LessonKit = { define, h, s, rich, strip, tr, ui, Stats, Charts, slider, readout, chip, lookup, explorer, accept, sheet, toast, confetti, burst, openToolkit };
})();

</script>
<script>
globalThis.LESSON_TOOLKIT = {"title":"Orientation; readiness; business-question framing","sections":[{"id":"how-to-use-this-toolkit","level":2,"title":"How to use this toolkit","short":"How to use this toolkit","html":"<p>This is a self-study chapter for the first session. Work through the five numbered sections in order. First identify the decision and define what would count as success. Then inspect the evidence, reproduce a small calculation in Excel 365 and SPSS, and write a bounded recommendation. The <b>Try it</b> questions are ungraded; attempt each before reading its answer.</p>\n<p>The course has <b>no required textbook</b>. The supplied crosswalk headings from Albright and Winston, Field, and Knaflic are <b>scope cues</b>, not a claim that you have read those chapters. Core cues here concern the role of business analytics, spreadsheet practice, and getting oriented in SPSS. Measurement, research design, and communication headings serve as brief optional bridges. This chapter is an original synthesis grounded in the open and primary sources actually cited below; its case and exercises are fictional and original.</p>\n<p>This source has <b>no stable PDF page numbers</b>. Future slides, speaker notes, PNP materials, or paginated versions should cross-reference stable numbered section headings such as <b>§3.2</b>, then add page numbers <i>after</i> pagination. Later sessions develop displays, distributions, probability, sampling, tests, and regression. Those methods are signposts here, not prerequisites.</p>"},{"id":"case","level":2,"title":"The running case: Cedar Cup pickup orders","short":"The running case: Cedar Cup pick…","html":"<p><b>Cedar Cup is entirely fictional.</b> Its campus café manager is deciding whether to <b>pilot a staffed handoff point</b> for mobile pickup orders. The manager worries that customers reach the counter but do not receive their drinks promptly. The stakeholder is the manager, who controls staffing; customers and staff are also affected stakeholders.</p>\n<p>Define the <b>population of interest</b> as all Cedar Cup mobile pickup orders placed during a proposed two-week pilot, rather than all café purchases. Exclude canceled orders only under a rule stated before analysis. An order does not become ineligible merely because a timestamp is missing. The <b>unit of analysis</b> is one order. Eight orders from two recent morning shifts form a small, conveniently selected readiness extract—not a random sample of the proposed pilot population. Each <code>order_id</code> should identify one order. Waiting time is handoff time minus recorded arrival time, in minutes. “Within five minutes” means <b>at most</b> five minutes, including exactly five. Report missing outcomes separately and predefine how they affect any all-order KPI.</p>\n<div class=\"tbl\"><table><thead><tr><th>Order ID</th><th>Morning shift</th><th>Wait (minutes)</th><th>Within 5 minutes?</th></tr></thead><tbody><tr><td>C101</td><td>Tuesday</td><td>2</td><td>1</td></tr><tr><td>C102</td><td>Tuesday</td><td>4</td><td>1</td></tr><tr><td>C103</td><td>Tuesday</td><td>6</td><td>0</td></tr><tr><td>C104</td><td>Tuesday</td><td>8</td><td>0</td></tr><tr><td>C105</td><td>Wednesday</td><td>3</td><td>1</td></tr><tr><td>C106</td><td>Wednesday</td><td>5</td><td>1</td></tr><tr><td>C107</td><td>Wednesday</td><td>7</td><td>0</td></tr><tr><td>C108</td><td>Wednesday</td><td>9</td><td>0</td></tr></tbody></table></div>\n<p>These eight rows are the <b>checked analysis table</b>. The illustrative source export initially contained nine rows because it repeated C104. An analyst confirmed that the second C104 row was a duplicate export record, retained one source record, and documented that decision. Never remove repeated IDs automatically: two genuine events could require a different data definition.</p>\n<p><b>Observed evidence:</b> four of eight checked orders met the five-minute definition. <b>Limitations:</b> the extract covers only two mornings; recorded arrival may differ from when a customer actually reached the pickup point; and it contains no handoff-point pilot or labor-cost observations. It can describe these eight orders. It cannot estimate the intervention’s effect or prove its cost is acceptable.</p>"},{"id":"1","level":2,"title":"1. Turn a concern into a decision question","short":"1. Turn a concern into a decisio…","html":"<p><b>Why these scores:</b> A precise decision, measure, and claim determine whether any subsequent analysis is useful.</p>"},{"id":"1.1","level":3,"title":"1.1 Stakeholder, action, KPI, target, and guardrail","short":"1.1. Stakeholder, action, KPI, t…","html":"<p>“Pickup is slow” is a <b>managerial concern</b>, not yet an analysis question. A usable question names the action and the evidence that would inform it: <i>Should Cedar Cup keep the staffed handoff point after a defined two-week pilot?</i> The <b>KPI</b> (key performance indicator) is the proportion of eligible mobile pickup orders handed over within five minutes of recorded arrival. Its unit is a percentage of <b>orders</b>, not minutes or customers. A <b>target</b> says what result the manager seeks: at least <b>75%</b> within five minutes. A <b>guardrail</b> limits an unwanted trade-off: additional handoff labor cost no greater than <b>$1.50 per eligible order</b>. These thresholds are fictional planning choices, not established industry benchmarks.</p>\n<div class=\"key\"><b>Write the denominator and boundary rule before calculating a rate.</b> Here, each eligible order enters the denominator once, and a five-minute wait counts as meeting the KPI.</div>\n<p>Work the baseline by hand. The eight waits are 2, 4, 6, 8, 3, 5, 7, and 9 minutes. Four—2, 4, 3, and 5—are at most five. Therefore:</p>\n<p><div class=\"mblock\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mtext>Observed within-five-minute rate</mtext><mo>=</mo><mfrac><mrow><mn>4</mn><mtext> eligible orders within five minutes</mtext></mrow><mrow><mn>8</mn><mtext> eligible orders</mtext></mrow></mfrac><mo>=</mo><mn>0.50</mn><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi><mi mathvariant=\"normal\">.</mi></mrow><annotation encoding=\"application/x-tex\">\\text{Observed within-five-minute rate}\n=\\frac{4\\text{ eligible orders within five minutes}}\n{8\\text{ eligible orders}}\n=0.50=50\\%.</annotation></semantics></math></span></div></p>\n<p>The observed rate is <b>25 percentage points</b> below the 75% target: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>75</mn><mi mathvariant=\"normal\">%</mi><mo>−</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi><mo>=</mo><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">75\\%-50\\%=25</annotation></semantics></math></span> percentage points. Reaching 75% <i>among eight orders</i> would require six successes, or two more than observed. That arithmetic does <b>not</b> say the proposed staffing change will produce two extra successes.</p>\n<p>A <b>testable claim</b> for the proposed pilot is: <i>During the two-week pilot, the eligible-order KPI will be at least 75%, while additional handoff labor cost will be at most $1.50 per eligible order.</i> To test it, the team must define pilot dates, count every eligible order under the same time rule, and record incremental labor cost. A claim about <i>improvement caused by</i> staffing needs a credible comparison design as well; a before-and-after difference alone can reflect changes in demand or shift conditions. Distinguishing observational evidence from an intervention is central to sound research design (Illowsky &amp; Dean, 2023b).</p>\n<p><b>Failure mode:</b> Reporting “four fast pickups” without the eight-order denominator, or silently changing “within five” to “under five,” changes the meaning of the evidence. Calling 50% “the pilot result” is also wrong: no pilot has occurred in the case.</p>\n<p><b>Try it — ungraded.</b> In the same eight-order extract, suppose the manager instead defines success as <b>under</b> five minutes. What rate results, and why is this not the original KPI?</p>\n<p><b>Explained answer.</b> Only waits of 2, 3, and 4 are under five. The rate becomes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>0.375</mn><mo>=</mo><mn>37.5</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">3/8=0.375=37.5\\%</annotation></semantics></math></span>. The five-minute order changes category. This is a new boundary rule, not a recalculation of the previously agreed “at most five” KPI.</p>"},{"id":"1.2","level":3,"title":"1.2 Define the population and the evidence needed","short":"1.2. Define the population and t…","html":"<p>A <b>population</b> is the complete set of units to which a claim is meant to apply; a <b>sample</b> is the units actually observed. In this case, the proposed two-week pilot’s eligible mobile pickup orders are the decision population. The eight historical orders are observed units from a different period. A <b>variable</b> records a property of each unit: <code>wait_min</code> is quantitative, whereas <code>within_5</code> is a categorical yes/no outcome coded 1 or 0. Giving categories numeric codes does not turn them into measured minutes. These distinctions help prevent a convenient extract from being mistaken for the full population (Illowsky &amp; Dean, 2023a).</p>\n<p>For a complete example, suppose the pilot later records 40 eligible orders, 30 within five minutes, and $48 in <b>additional</b> handoff labor. The KPI would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30</mn><mi mathvariant=\"normal\">/</mi><mn>40</mn><mo>=</mo><mn>75</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">30/40=75\\%</annotation></semantics></math></span>. Additional cost per eligible order would be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">$</mi><mn>48</mn><mi mathvariant=\"normal\">/</mi><mn>40</mn><mo>=</mo><mi mathvariant=\"normal\">$</mi><mn>1.20</mn></mrow><annotation encoding=\"application/x-tex\">\\$48/40=\\$1.20</annotation></semantics></math></span>. Those invented pilot figures would meet both stated thresholds <i>for those 40 orders</i>. They would not, by themselves, establish that staffing <b>caused</b> the result: day, volume, and order mix might differ. The calculation also depends on using the same 40 eligible orders as each denominator. This hypothetical calculation is practice, <b>not</b> a second observed Cedar Cup dataset.</p>\n<p><b>Failure mode:</b> Using all café transactions to divide a count of timely <i>mobile pickups</i> makes the rate artificially small. Conversely, excluding inconvenient eligible orders without a documented rule can make it look artificially large.</p>\n<p><b>Try it — ungraded.</b> A manager reports 12 timely handoffs among 15 orders with timestamps. There were also three mobile orders whose arrival times were not recorded. Can you report “12 of 18 within five minutes”?</p>\n<p><b>Explained answer.</b> No. All 18 mobile orders remain eligible, but three outcomes are unknown under this definition. Report <b>12 of 15 timestamp-complete orders</b>, or 80% among measured orders, alongside <b>three eligible orders with missing measurement</b>. Investigate why they are missing and apply a prespecified missing-outcome rule before claiming a rate for all 18.</p>"},{"id":"2","level":2,"title":"2. Check what each row means","short":"2. Check what each row means","html":"<p><b>Why these scores:</b> A correct formula cannot repair duplicated units, missing timestamps, or an undocumented export.</p>"},{"id":"2.1","level":3,"title":"2.1 Grain, provenance, and measurement checks","short":"2.1. Grain, provenance, and meas…","html":"<p><b>Grain</b> means what one row represents. The checked Cedar Cup table has <b>one row per eligible order</b>. Its key is <code>order_id</code>. <b>Provenance</b> is the record of where data came from and how they changed: for example, a dated mobile-order export, the timestamp fields used, the duplicate C104 investigation, and the resulting checked table. Keep the unchanged source export separately from the analysis copy. This makes a correction inspectable rather than invisible.</p>\n<p>Before opening software, set out the calculation. Let <code>arrival_time</code> and <code>handoff_time</code> be recorded clock times for the same order. Compute <code>wait_min</code> as their difference in minutes, provided both exist and handoff follows arrival. Then set <code>within_5</code> to 1 if <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>≤</mo><mtext>wait_min</mtext><mo>≤</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">0\\leq\\text{wait\\_min}\\leq5</annotation></semantics></math></span>, otherwise 0 for a valid wait. For C106, an arrival at 09:10 and handoff at 09:15 give <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>09</mn><mo lspace=\"0em\" rspace=\"0em\">:</mo><mn>15</mn><mo>−</mo><mn>09</mn><mo lspace=\"0em\" rspace=\"0em\">:</mo><mn>10</mn><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">09{:}15-09{:}10=5</annotation></semantics></math></span> minutes, so <code>within_5 = 1</code>. If arrival is blank, the outcome is <b>missing</b>, not 0. Confirm timestamp time zones and whether an order can cross a date boundary before calculating a larger file.</p>\n<div class=\"key\"><b>Validate the unit count independently of the KPI.</b> The initial export has nine rows but eight distinct order IDs. Investigating the repeated C104 yields eight checked orders; counting its extra export row as another order would change the denominator without adding a customer decision unit.</div>\n<p>A compact check record for this case is:</p>\n<div class=\"tbl\"><table><thead><tr><th>Check</th><th>Expected in this teaching extract</th><th>If it fails</th></tr></thead><tbody><tr><td>Checked rows</td><td>8</td><td>Reconcile additions or exclusions</td></tr><tr><td>Distinct <code>order_id</code> values</td><td>8</td><td>Inspect repeated keys against source events</td></tr><tr><td>Valid, nonmissing waits</td><td>8</td><td>Investigate timestamp coverage and ordering</td></tr><tr><td><code>within_5</code> successes</td><td>4</td><td>Recheck the five-minute boundary and calculations</td></tr></tbody></table></div>\n<p>The extract’s two mornings are convenient, not randomly chosen. Even perfectly entered values could poorly represent evenings, busy days, or the proposed pilot. Selection and measurement problems are different: correcting C104 addresses duplication but not generalizability. Sampling and data variation are developed later in the course (Illowsky &amp; Dean, 2023a).</p>\n<p><b>Failure mode:</b> “Remove duplicates” is not a complete cleaning rule. A repeated order ID might represent an erroneous repeated export, two status events, or an ID-system defect. Determine which occurred and preserve the decision trail.</p>\n<p><b>Try it — ungraded.</b> Suppose the source has one additional row for C109, but its handoff timestamp is blank. Should C109 be coded <code>within_5 = 0</code>?</p>\n<p><b>Explained answer.</b> No. A missing handoff timestamp does not establish a wait longer than five minutes. Mark its outcome missing, report the missing-record count, and investigate it. A policy for eligible orders with missing outcomes must be stated before using their data in a performance claim.</p>"},{"id":"3","level":2,"title":"3. Reproduce the small result in Excel 365","short":"3. Reproduce the small result in…","html":"<p><b>Why these scores:</b> A small, auditable workbook is a practical readiness check and a foundation for later analyses.</p>"},{"id":"3.1","level":3,"title":"3.1 Set up the workbook and calculate the rate","short":"3.1. Set up the workbook and cal…","html":"<p>Start with <b>inputs, units, and expected result</b>. Enter the eight checked rows in columns <code>order_id</code>, <code>shift</code>, and <code>wait_min</code>; create an empty <code>within_5</code> column for a formula. <code>wait_min</code> uses minutes; <code>within_5</code> will use 1 for yes and 0 for no. Expect eight orders, four successes, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">4/8=50\\%</annotation></semantics></math></span>. Keep a separate note identifying the source export and the C104 resolution. Do not type over the original export.</p>\n<p>In Excel 365, select the four headers, three populated input columns, and eight rows; create an Excel table named <code>Pickup</code>, leaving <code>within_5</code> cells blank. Tables support <b>structured references</b> such as <code>Pickup[wait_min]</code>, which identify a column by name and adjust when table rows change (Microsoft, n.d.-a). Enter this formula in the first data cell under <code>within_5</code> and confirm Excel fills the calculated column:</p>\n<pre><code>=IF([@wait_min]&lt;=5,1,0)</code></pre>\n<p><code>[@wait_min]</code> means the wait in <b>this row</b>. <code>IF</code> returns 1 when the condition is true and 0 otherwise. With the eight <b>already validated, nonnegative, nonmissing</b> waits supplied here, the results are <code>1, 1, 0, 0, 1, 1, 0, 0</code>. This formula is <b>not</b> a safe missing-value policy for an unclean file: validate waits and handle missing inputs explicitly before extending it.</p>\n<p>Calculate outside the table:</p>\n<pre><code>=COUNT(Pickup[wait_min])\n=SUM(Pickup[within_5])\n=SUM(Pickup[within_5])/COUNT(Pickup[wait_min])</code></pre>\n<p>The first formula returns <b>8 numeric waits</b>; the second returns <b>4 successes</b>; the third returns <b>0.5</b>, displayed as <b>50%</b> when formatted as a percentage. <code>COUNT</code> here checks how many waits are numeric; it is an appropriate denominator <b>only because all eight checked eligible orders have valid waits</b>. If that check fails, stop and resolve eligibility and missingness rather than quietly changing the denominator.</p>\n<p>Make an independent check with a different route:</p>\n<pre><code>=COUNTIF(Pickup[wait_min],\"&lt;=5\")</code></pre>\n<p>It should return <b>4</b>. <code>COUNTIF</code> counts cells meeting one stated condition (Microsoft, n.d.-b). Check that <code>COUNTIF</code>’s four agrees with <code>SUM</code>’s four, then inspect C106’s boundary value of five by eye. Agreement is reassuring, but two formulas can share a mistaken definition; the written KPI is the final check.</p>\n<p><b>Failure mode:</b> A percentage formatted as <code>50%</code> may conceal a bad denominator. If nine exported rows include the duplicate C104, a formula over that range answers a different question. Verify the grain and row count before trusting the display.</p>\n<p><b>Try it — ungraded.</b> After checking the source, an analyst corrects C103’s wait from six minutes to five. What should the success count and rate become for the <i>same eight orders</i>?</p>\n<p><b>Explained answer.</b> C103 changes from 0 to 1 because five meets “at most five.” Successes become <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo>+</mo><mn>1</mn><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">4+1=5</annotation></semantics></math></span>; the denominator remains eight; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>0.625</mn><mo>=</mo><mn>62.5</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">5/8=0.625=62.5\\%</annotation></semantics></math></span>. The 12.5-percentage-point change from a one-minute correction shows why boundary records merit attention. It does not make the intervention effective.</p>"},{"id":"3.2","level":3,"title":"3.2 Make the workbook inspectable","short":"3.2. Make the workbook inspectable","html":"<p>Separate <b>raw source</b>, <b>checked order table</b>, and <b>summary</b> in clearly named sheets or files. Add a short readme giving the as-of date, who supplied the export, the unit, definitions, the C104 decision, and unresolved questions. Preserve formulas so another analyst can trace 50% back to four individual orders. A spreadsheet is a model when its inputs, rules, and outputs encode a business question—not merely when it has many formulas.</p>\n<p>For example, a reviewer can trace C106 through <code>wait_min = 5</code>, <code>within_5 = 1</code>, the success sum of 4, and the denominator of 8. Then the reviewer can independently count the four waits at or below five in the source table. If a later export has 80 rows, that same trail should reveal whether the added rows are eligible and whether the definitions stayed fixed. Structured references can make expanding tables easier, but they do not validate the new rows for you (Microsoft, n.d.-a).</p>\n<p><b>Failure mode:</b> Pasting a screenshot of “50%” into a presentation without the definition, count, and source date makes it hard to audit or responsibly reuse. Do not put customer identifiers in a broadly shared presentation merely because they appear in an operational export.</p>\n<p><b>Try it — ungraded.</b> Which is the stronger summary label: “Pickup success: 50%” or “4 of 8 checked mobile pickup orders handed over within five minutes; two morning shifts”? Explain.</p>\n<p><b>Explained answer.</b> The second states the count, denominator, rule, and coverage. The first could be mistaken for an all-orders, all-hours, or pilot-wide result.</p>"},{"id":"4","level":2,"title":"4. Get oriented in SPSS without losing the question","short":"4. Get oriented in SPSS without…","html":"<p><b>Why these scores:</b> Tool readiness matters, but knowing where results came from matters more than memorizing menus.</p>"},{"id":"4.1","level":3,"title":"4.1 Import, inspect, and produce one check","short":"4.1. Import, inspect, and produc…","html":"<p>Before tool clicks, know the input: <b>eight checked order rows</b>, with <code>order_id</code> as an identifier, <code>shift</code> as a category, <code>wait_min</code> in minutes, and <code>within_5</code> as 0/1. The expected frequency output is four 0s and four 1s; the business interpretation is <b>four of eight</b> within five minutes. The Excel result supplies an independent comparison, not a reason to ignore SPSS warnings.</p>\n<p>Save a copy of the checked table as an Excel workbook with one header row. In SPSS, use <b>File → Import Data → Excel</b>, choose the intended worksheet, and set the first row as variable names. IBM notes that the first worksheet is read by default unless another is selected, so inspect the choice before proceeding (IBM, n.d.-a). In <b>Data View</b>, check eight cases—SPSS’s term for rows—and inspect C106. In <b>Variable View</b>, check names, types, labels, missing-value settings, and measurement levels. Set the order ID as a string identifier; describe <code>shift</code> and <code>within_5</code> as categorical, and <code>wait_min</code> as a numeric minute measure. Variable View stores these descriptions with the data file (IBM, n.d.-b).</p>\n<p>For a reproducible check, open a <b>Syntax Editor</b> and run this command against the active checked dataset:</p>\n<pre><code>FREQUENCIES VARIABLES=within_5.</code></pre>\n<p>Read it one step at a time: <code>FREQUENCIES</code> requests counts; <code>VARIABLES=within_5</code> selects the outcome column; the period ends the SPSS command. Expect <b>0: four cases; 1: four cases; valid total: eight</b>. Divide the count coded 1 by the valid total: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">4/8=50\\%</annotation></semantics></math></span>. The <b>Viewer</b> holds the resulting table; it is output, not the underlying data. IBM documents both the distinct Data Editor, Viewer, and Syntax Editor roles and the <code>FREQUENCIES</code> command (IBM, n.d.-c, n.d.-d).</p>\n<p><b>Failure mode:</b> An import can look successful while reading the wrong worksheet or interpreting a code as text. A frequency table showing only seven valid outcomes calls for investigation, not immediate celebration that the software “ran.”</p>\n<p><b>Try it — ungraded.</b> SPSS shows four 1s, three 0s, and one missing <code>within_5</code>. Does its “50% of all eight cases” match the originally checked dataset?</p>\n<p><b>Explained answer.</b> No. The original dataset has four 1s <b>and four 0s</b>, with no missing outcomes. Although <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">4/8=50\\%</annotation></semantics></math></span> uses eight cases, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi mathvariant=\"normal\">/</mi><mn>7</mn><mo>≈</mo><mn>57.1</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">4/7\\approx57.1\\%</annotation></semantics></math></span> of the seven valid outcomes gives another possible percentage. Neither discrepancy should be accepted until the missing value and import are reconciled against the checked eight rows.</p>"},{"id":"4.2","level":3,"title":"4.2 Save distinct data, syntax, and output artifacts","short":"4.2. Save distinct data, syntax,…","html":"<p>SPSS has several artifacts with different purposes. Save the <b>data file</b> so the checked cases and variable definitions can be reopened; save the <b>syntax</b> so a colleague can rerun the frequency request; save the <b>Viewer output</b> so a colleague can inspect what that run displayed. If an accessible report is needed, export selected output and also supply its small count table as text. An exported image alone is not a substitute for data and syntax. IBM describes saving SPSS data with its variable dictionary and exporting Viewer output to other formats (IBM, n.d.-e, n.d.-f).</p>\n<p>For this case, sensible names might be <code>cedar_checked_orders.sav</code>, <code>cedar_readiness.sps</code>, and <code>cedar_readiness_output.spv</code>. Reopen the saved data and rerun the syntax. The check succeeds if the Viewer again reports <b>four zeros, four ones, eight valid cases</b>. Record the extract date and duplicate decision outside the numeric output. Never use the sample file names as evidence that customer-level data are approved for unrestricted sharing.</p>\n<p><b>Failure mode:</b> Saving only the output preserves a result without a reliable route back to its inputs. Saving only data preserves inputs without documenting which result was produced or how.</p>\n<p><b>Try it — ungraded.</b> A teammate sends an output screenshot reading “50%” and a syntax file, but no checked data or source description. What can you verify?</p>\n<p><b>Explained answer.</b> You can inspect what the syntax <i>asks</i> SPSS to calculate and read the displayed number. You cannot rerun it or verify the eight rows, eligibility rule, C104 correction, or provenance. Request the appropriately shareable checked data and its source-and-cleaning record.</p>"},{"id":"5","level":2,"title":"5. Communicate a bounded next step","short":"5. Communicate a bounded next step","html":"<p><b>Why these scores:</b> Managers need a decision-ready statement that separates what was seen from what is proposed.</p>"},{"id":"5.1","level":3,"title":"5.1 Observation, inference, assumption, recommendation","short":"5.1. Observation, inference, ass…","html":"<p>Use four labels to prevent a small extract from carrying a claim it cannot support.</p>\n<ul><li><b>Descriptive observation:</b> In the eight checked orders from two morning shifts, four met the five-minute rule: <b>50%</b>.</li><li><b>Inference:</b> The extract does <b>not</b> establish the rate for all future eligible orders. A population claim needs an appropriate sampling or study plan; that work begins in later sessions.</li><li><b>Assumption to check:</b> Recorded arrival is a useful start time for customer waiting, and the proposed staff member can be assigned without unacceptable disruption elsewhere.</li><li><b>Recommendation:</b> Do <b>not</b> approve permanent staffing from this extract alone. Prepare a time-bounded pilot that records eligibility, waits, source quality, and incremental labor cost, then evaluate its target and guardrail.</li></ul>\n<p>This is a <b>bounded recommendation</b>: it says what to do next without claiming that the staffed point works. For the pilot, predefine the date range and treatment, keep the five-minute boundary fixed, log all eligible orders and missing timestamps, and compare like with like where feasible. Consider effects on staff workload and on customers who do not use mobile pickup. Later units address uncertainty, comparison designs, practical effects, and A/B guardrails in depth; a “statistically significant” result, even if one were calculated, would not alone prove causal or business impact (Illowsky &amp; Dean, 2023b).</p>\n<div class=\"key\"><b>Lead with the decision and its evidential boundary, not an unqualified percentage.</b> A suitable manager-facing line is: “Two checked morning shifts

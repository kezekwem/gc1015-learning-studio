show 4 of 8 mobile pickups handed over within five minutes; this is a reason to measure a pilot, not evidence that extra staffing will fix the delay.”</div>\n<p>A compact text display can carry the present evidence without relying on color:</p>\n<div class=\"tbl\"><table><thead><tr><th>Checked morning orders</th><th>Within 5 minutes</th><th>Over 5 minutes</th><th>What it supports</th></tr></thead><tbody><tr><td>8</td><td>4 (50%)</td><td>4 (50%)</td><td>Description of these checked orders only</td></tr></tbody></table></div>\n<p>For a later chart, label categories and counts directly and accompany it with the data table or equivalent text. Do not make its visual emphasis imply that an intervention effect was measured. Protect operational identifiers when sharing beyond the authorized team.</p>\n<p><b>Failure mode:</b> “Staffing will lift pickup performance from 50% to 75%” converts a <b>target</b> into a <b>forecast</b> without evidence. “Most customers waited too long” is also unsupported: the unit here is orders, and four of eight—not most—exceeded five minutes.</p>\n<p><b>Try it — ungraded.</b> Rewrite this sentence for a manager: “Our data prove the staffed point will hit the target because the baseline is 50%.”</p>\n<p><b>Explained answer.</b> One sound version is: “In two checked morning shifts, 4 of 8 eligible orders met the five-minute rule. We have not observed a staffed handoff point, so we recommend a measured pilot before deciding whether to retain one.” It retains the useful observation and removes the unsupported causal prediction.</p>"},{"id":"recap","level":2,"title":"Recap","short":"Recap","html":"<ul><li>Define the <b>stakeholder and decision</b> before choosing a method.</li><li>State the <b>population, one-row unit, eligibility rule, and denominator</b>.</li><li>A KPI needs an exact boundary: Cedar Cup’s “within five minutes” includes five.</li><li>Separate a desired <b>target</b> from an observed result and a cost <b>guardrail</b>.</li><li>In the checked fictional extract, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi mathvariant=\"normal\">/</mi><mn>8</mn><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">4/8=50\\%</annotation></semantics></math></span>; it describes eight orders, not a staffing effect.</li><li>Trace source rows, keys, missing values, and corrections before calculating.</li><li>Check Excel’s answer by another calculation and against individual rows.</li><li>In SPSS, distinguish data, syntax, and Viewer output; save what another analyst needs to rerun the check.</li><li>Tell managers what was observed, what remains uncertain, and the next defensible action.</li></ul>"},{"id":"glossary","level":2,"title":"Glossary","short":"Glossary","html":"<ul><li><b>Case:</b> SPSS term for an observed row; here, one checked order.</li><li><b>Categorical variable:</b> A recorded group or class; <code>shift</code> is Tuesday or Wednesday.</li><li><b>Convenience extract:</b> Readily available observations not selected by a probability rule; the eight orders were pulled from two mornings.</li><li><b>Denominator:</b> The count of eligible units used beneath a rate; eight checked orders in the baseline calculation.</li><li><b>Grain:</b> What one row represents; one eligible order in this table.</li><li><b>Guardrail:</b> A limit on a possible downside of a decision; at most $1.50 additional labor per eligible order.</li><li><b>Inference:</b> A claim extending beyond observed units; the eight orders alone do not justify a pilot-wide rate.</li><li><b>Key:</b> A field intended to identify a unit uniquely; <code>order_id</code> should identify one order.</li><li><b>KPI:</b> A specified measure of performance; the share of eligible orders handed over within five minutes.</li><li><b>Measurement rule:</b> The operational way a value is obtained; wait is recorded handoff time minus recorded arrival time.</li><li><b>Missing value:</b> An outcome that cannot be determined from available data; a blank arrival time does not mean failure.</li><li><b>Population:</b> All units the intended claim concerns; here, eligible orders during the proposed two-week pilot.</li><li><b>Provenance:</b> A record of data origin and changes; the export source and C104 resolution are part of it.</li><li><b>Sample:</b> Units observed rather than the whole population; the historical eight orders are not the proposed pilot population.</li><li><b>Stakeholder:</b> A person affected by or responsible for a decision; the café manager, customers, and staff qualify.</li><li><b>Target:</b> A desired KPI level; at least 75% within five minutes.</li><li><b>Testable claim:</b> A statement with defined observations that could support or contradict it; the pilot target plus labor guardrail.</li><li><b>Variable:</b> A property recorded for each unit; <code>wait_min</code> records minutes for each checked order.</li></ul>"},{"id":"references","level":2,"title":"References","short":"References","html":"<p>International Business Machines Corporation. (n.d.-a). <i>Reading Excel files</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=files-reading-excel\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/30.0.0?topic=files-reading-excel</a></p>\n<p>International Business Machines Corporation. (n.d.-b). <i>Variable View</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=editor-variable-view\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=editor-variable-view</a></p>\n<p>International Business Machines Corporation. (n.d.-c). <i>Windows</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=overview-windows\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=overview-windows</a></p>\n<p>International Business Machines Corporation. (n.d.-d). <i>FREQUENCIES</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=reference-frequencies\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=reference-frequencies</a></p>\n<p>International Business Machines Corporation. (n.d.-e). <i>Overview (SAVE command)</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=save-overview-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=save-overview-command</a></p>\n<p>International Business Machines Corporation. (n.d.-f). <i>Overview (OUTPUT EXPORT command)</i>. IBM Documentation. <a href=\"https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=export-overview-output-command\" target=\"_blank\" rel=\"noopener\">https://www.ibm.com/docs/en/spss-statistics/31.0.0?topic=export-overview-output-command</a></p>\n<p>Microsoft. (n.d.-a). <i>Using structured references with Excel tables</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/using-structured-references-with-excel-tables\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/using-structured-references-with-excel-tables</a></p>\n<p>Microsoft. (n.d.-b). <i>Use the COUNTIF function in Microsoft Excel</i>. Microsoft Support. <a href=\"https://support.microsoft.com/en-us/excel/get-started/use-the-countif-function-in-microsoft-excel\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/excel/get-started/use-the-countif-function-in-microsoft-excel</a></p>\n<p>Illowsky, B., &amp; Dean, S. (2023a). <i>1.2 Data, sampling, and variation in data and sampling</i>. In <i>Introductory statistics 2e</i>. <a href=\"https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/introductory-statistics-2e/pages/1-2-data-sampling-and-variation-in-data-and-sampling</a></p>\n<p>Illowsky, B., &amp; Dean, S. (2023b). <i>1.4 Experimental design and ethics</i>. In <i>Introductory statistics 2e</i>. <a href=\"https://openstax.org/books/introductory-statistics-2e/pages/1-4-experimental-design-and-ethics\" target=\"_blank\" rel=\"noopener\">https://openstax.org/books/introductory-statistics-2e/pages/1-4-experimental-design-and-ethics</a></p>"}]};
globalThis.LESSON_I18N = {"zh":{"Should OmniRetail Staff Weekends?":"OmniRetail 该不该增设周末客服？","GC1015 · Session 1 · Decisions, bounded questions and decision rules":"GC1015 · 第 1 讲 · 决策、有明确边界的问题与决策规则","Finish":"完成","Your framing canvas":"你的问题框定画布","Decision before tools":"先决策，后工具","From concern to question":"从担忧到问题","KPIs and the decision rule":"KPI 与决策规则","Case file: OmniRetail":"案例档案：OmniRetail","A simulated subscription retailer from the Session 01 slides. None of it is real company data.":"这是第 01 讲幻灯片中的一家模拟订阅制零售商。所有内容都不是真实的公司数据。","Fact":"事实","Value":"数值","Active accounts":"活跃账户","2.4 million":"2.4 million","Quarterly cancellations":"季度取消量","up 14 percent":"上升 14%","Proposal":"提案","40 weekend representatives":"40 名周末客服代表","Yearly cost":"年度成本","Monday backlog":"周一积压工单","4,200 unresolved tickets":"4,200 张未解决的工单","Decision owner":"决策负责人","Vice President of Customer Operations":"客户运营副总裁","Agreed threshold, δ":"约定阈值 δ","5 percentage points":"5 个百分点","Class illustrations, not results: a gap of 1.2 points, and a gap of 0.3 points that is significant at p < 0.001 and worth about $24,000 a year.":"以下是课堂示例，不是实际结果：一个是 1.2 个百分点的差距；另一个是 0.3 个百分点的差距，它在 p < 0.001 时显著，每年价值约 $24,000。","Toolkit transfer case: Cedar Cup café, 8 checked pickup orders that waited 2, 4, 6, 8, 3, 5, 7 and 9 minutes.":"工具包 (Toolkit) 迁移案例：Cedar Cup 咖啡馆，8 笔经过核查的自取订单，等待时间分别为 2、4、6、8、3、5、7 和 9 分钟。","Owner and decision":"负责人与决策","Set on screen 4":"在第 4 屏设定","Inspect first":"先检查","Tool readiness":"工具就绪度","Scope":"范围","Bounded question":"有明确边界的问题","Claim wording":"论断措辞","Assumptions and limits":"假设与局限","KPI":"KPI","Decision rule":"决策规则","Recommendation":"建议","Should OmniRetail fund weekend support?":"OmniRetail 应该为周末客服投入资金吗？","Your gut call, before any analysis: should OmniRetail commit the $450,000?":"先别分析，凭直觉判断：OmniRetail 应该投入这 $450,000 吗？","OmniRetail is a simulated subscription retailer with 2.4 million active accounts. Cancellations rose 14 percent this quarter.":"OmniRetail 是一家模拟订阅制零售商，拥有 2.4 million 个活跃账户。本季度取消订阅量增加了 14%。","The Vice President of Customer Operations proposes 40 weekend support representatives for $450,000 a year. The reason: every Monday, 4,200 unresolved tickets are waiting.":"客户运营副总裁提议以每年 $450,000 的成本配备 40 名周末客服代表。理由是：每到周一，都有 4,200 张未解决的工单在等待处理。","Noted. We will come back to your call at the end, with evidence.":"记下了。最后我们会带着证据，回头再看你的判断。","Yes, commit now":"是，现在就投入","No, keep weekday-only support":"否，维持仅工作日客服","Not yet, I need a clearer question":"先不，我需要一个更清晰的问题","Four levels in one request":"一个请求，四个层次","The request mixes four different things. Only one of them commits money or staff.":"这个请求把四种不同的东西混在了一起。其中只有一种会动用资金或人员。","Drag each sentence to its level. One tile does not belong anywhere.":"把每个句子拖到它所属的层次。有一张卡片哪里都不属于。","<p>Only the stakeholder decision commits budget or policy. The analytic question names the evidence that would reduce uncertainty about that decision. The software task comes last.</p>\n          <p>Opening SPSS before the decision is clear is the <b>tool-first trap</b>: an accurate calculation can still answer the wrong question.</p>":"<p>只有利益相关者的决策才会动用预算或确定政策。分析问题指明哪些证据能减少这项决策的不确定性。软件任务排在最后。</p>\n          <p>在决策还没明确时就打开 SPSS，就是<b>“工具优先”陷阱</b>：计算再准确，也可能回答了错误的问题。</p>","Filter and summarize ticket records in SPSS":"在 SPSS 中筛选并汇总工单记录","Quarterly cancellations rose 14 percent":"季度取消量上升了 14%","Weekend staff will stop churn":"增加周末客服就能止住客户流失","Do subscribers with unresolved weekend tickets cancel more often than comparable subscribers?":"有未解决周末工单的订阅用户，是否比可比的订阅用户更常取消？","Authorize $450,000 a year for 40 weekend representatives":"批准每年 $450,000，配备 40 名周末客服代表","Business problem<br><small>an observed condition</small>":"业务问题<br><small>观察到的状况</small>","Stakeholder decision<br><small>a commitment a leader owns</small>":"利益相关者的决策<br><small>由领导者负责的承诺</small>","Analytic question<br><small>the evidence needed</small>":"分析问题<br><small>所需的证据</small>","Software task<br><small>a tool operation</small>":"软件任务<br><small>一项工具操作</small>","That is a promise, not a level. Analysis cannot stop churn. It can test whether a pattern exists.":"这是一个承诺，不是一个层次。分析无法止住客户流失，但可以检验某种规律是否存在。","A rise in cancellations is a condition someone observed. Nobody has committed anything yet.":"取消量上升是有人观察到的状况。目前还没有人做出任何承诺。","A question asks for evidence. The decision is the commitment of money or staff.":"问题是在寻求证据。决策则是对资金或人员的承诺。","Authorizing $450,000 commits budget. That is the decision the evidence should serve.":"批准 $450,000 就是动用预算。这正是证据应当服务的决策。","Filtering in SPSS is a mechanical step. It comes last, after the question is clear.":"在 SPSS 中筛选只是机械操作。它排在最后，要等问题明确之后再做。","Ask this first":"先问这个","A manager emails you: \"Run SPSS on every ticket and stop churn.\" You have not opened any file yet.":"一位经理给你发邮件：“用 SPSS 把所有工单跑一遍，止住客户流失。”你还没有打开任何文件。","What is the most useful first question to send back?":"回信时，最有用的第一个问题是什么？","<p>The decision sets relevance. It tells you which uncertainty matters, and so which evidence to collect. Ask every requester: \"What specific managerial decision will change depending on the outcome of this calculation?\"</p>\n          <p>If nobody can name a decision, ask what action, budget or policy could change after the analysis.</p>":"<p>决策决定了什么是相关的。它告诉你哪种不确定性最重要，从而决定该收集哪些证据。对每一位提需求的人都问一句：“这次计算的结果会改变哪一项具体的管理决策？”</p>\n          <p>如果没人说得出具体的决策，就问分析之后有哪些行动、预算或政策可能改变。</p>","What decision will change depending on the result?":"哪项决策会根据结果而改变？","Which version of SPSS should I use?":"我该用哪个版本的 SPSS？","That is a software detail. It cannot tell you which records or which comparison matter.":"这是软件细节。它无法告诉你哪些记录、哪种比较才重要。","Can I have every ticket ever logged?":"能把有史以来记录的所有工单都给我吗？","More records are not more credible. Without a decision, you cannot tell which records are relevant.":"记录更多不等于更可信。没有明确的决策，你就无法判断哪些记录是相关的。","Which statistical test do you want?":"你想用哪种统计检验？","A method comes after the question is framed. Choosing one now is still tool-first.":"方法要在问题框定之后再选。现在就选，仍然是工具优先。","Repair the request":"修正这个请求","The email \"Run SPSS on every ticket and stop churn\" has four defects. Each one needs a repair.":"这封邮件“用 SPSS 把所有工单跑一遍，止住客户流失”有四个缺陷。每个缺陷都需要修正。","Drag each repair to the defect it fixes. One repair does not help.":"把每个修正方案拖到它所修复的缺陷上。有一个修正方案帮不上忙。","<p>The repaired question: \"Among active monthly subscribers, is an unresolved weekend support ticket associated with a meaningful increase in 60-day cancellation rates compared to weekday tickets?\"</p>\n          <p>It keeps the manager's intent, but evidence could answer it either way. The fixed 60-day window matters: without it, the meaning of churn drifts and results cannot be matched across tools.</p>":"<p>修正后的问题：“在活跃的按月订阅用户中，与工作日工单相比，未解决的周末支持工单是否与 60 天取消率有实际意义的上升相关？”</p>\n          <p>它保留了经理的意图，而且证据既可能给出肯定答案，也可能给出否定答案。固定的 60 天时间窗口很重要：没有它，客户流失的含义就会漂移，不同工具得出的结果也无法对应起来。</p>","US monthly subscribers; unresolved weekend vs resolved weekday tickets; 60 days":"美国按月订阅用户；未解决的周末工单 vs 已解决的工作日工单；60 天","Use every ticket since the company began":"使用公司成立以来的所有工单","Start from the $450,000 staffing decision":"从 $450,000 的人员配置决策出发","Ask whether a pattern is associated with cancellation":"询问某种规律是否与取消相关","Names SPSS before the problem":"先提 SPSS，后谈问题","Promises to \"stop churn\"":"承诺“止住客户流失”","No decision owner":"没有决策负责人","No population, comparison or time horizon":"没有总体、比较对象或时间范围","More tickets do not fix a missing boundary. Old, unrelated records add noise to the comparison.":"工单再多也补不上缺失的边界。陈旧、无关的记录只会给比较增加噪声。","This fixes the promise. The tool defect is fixed by starting from the decision instead of the software.":"这修正的是承诺。工具方面的缺陷，要靠从决策而不是从软件出发来修正。","Starting from the decision fixes the tool-first order. The promise is fixed by asking about an association.":"从决策出发，修正的是“工具优先”的顺序。承诺的问题要靠询问相关性来修正。","VP of Customer Operations: fund 40 weekend reps for $450,000 a year?":"客户运营 VP：是否每年出资 $450,000 配备 40 名周末客服代表？","What does a Monday queue show?":"周一的积压队列说明了什么？","Support runs Monday to Friday. Every Monday, 4,200 tickets are unresolved. Managers say this proves weekend frustration.":"客服只在周一到周五工作。每到周一，都有 4,200 张工单未解决。经理们说，这证明客户在周末很不满。","Before you support the budget, what must you check in the raw ticket logs?":"在支持这笔预算之前，你必须在原始工单日志中检查什么？","<p>A Monday queue shows when tickets were <i>waiting</i>, not when they were <i>created</i>. Check the submission timestamp, the time zone, and whether each log row is one ticket or one customer. Other explanations for a Monday surge include Friday-evening tickets, an outage or a batch import.</p>\n          <p>This is the <b>Inspect</b> step: check provenance and grain before any calculation.</p>":"<p>周一的队列显示的是工单什么时候在<i>等待</i>，而不是什么时候被<i>创建</i>。请检查提交时间戳、时区，以及每一行日志对应的是一张工单还是一位客户。周一工单激增还有其他可能的解释，比如周五晚上提交的工单、系统故障或批量导入。</p>\n          <p>这就是<b>“检查”（Inspect）</b>步骤：在做任何计算之前，先核查数据的来源和粒度。</p>","When each ticket was submitted, not just when it entered the Monday queue":"每张工单是什么时候提交的，而不只是它什么时候进入周一队列","Whether 40 representatives could clear 4,200 tickets by noon":"40 名客服代表能否在中午前处理完 4,200 张工单","That plans the solution before the problem is confirmed. First check when the tickets were created.":"这是在问题得到确认之前就规划解决方案。先检查工单是什么时候创建的。","Nothing. A backlog that large proves weekend demand.":"什么都不用查。积压这么多，就证明周末有需求。","Plausible is not proof. Monday tickets may come from Friday evening, a system outage or a batch upload.":"看似合理不等于证据。周一的工单可能来自周五晚上、系统故障或批量上传。","The average length of the text in each ticket":"每张工单文本的平均长度","Text length does not show when the customer had the problem.":"文本长度无法说明客户是什么时候遇到问题的。","Check submission timestamps, and whether a log row is a ticket or a customer":"检查提交时间戳，以及一行日志对应的是一张工单还是一位客户","A rate with the wrong parts":"组成部分出了错的比率","A manager divides the Monday backlog by all accounts: 4,200 ÷ 2,400,000 = 0.175%. The slide says \"0.175% of customers are stuck each weekend.\"":"一位经理用周一的积压工单数除以全部账户数：4,200 ÷ 2,400,000 = 0.175%。幻灯片上写着：“每个周末有 0.175% 的客户被卡住。”","What is the main problem with this rate?":"这个比率的主要问题是什么？","<p>A rate needs its top and bottom to count the same unit, over the same scope and time. Here the top counts <b>tickets</b> waiting on Monday, and the bottom counts <b>all 2.4 million accounts</b>, including people who never contacted support.</p>\n          <p>Your toolkit makes the same point with a café: dividing timely mobile pickups by all café transactions makes a rate artificially small. Write the denominator rule before you calculate.</p>":"<p>计算比率时，分子和分母需要在相同的范围和时间下统计相同的单位。这里的分子统计的是周一等待处理的<b>工单数</b>，而分母统计的则是<b>全部 2.4 million 个账户</b>，其中包括从未联系过客服的人员。</p>\n          <p>你的工具包用咖啡馆的例子说明了同样的道理：将及时的手机自提单量除以咖啡馆的所有交易量，会人为使比率偏小。计算前，请先明确分母的定义规则。</p>","It counts tickets on top and accounts below; one customer can file several tickets":"分子统计的是工单，分母统计的是账户；一位客户可能提交多张工单","Nothing. 4,200 ÷ 2,400,000 really is 0.175%.":"没有问题。4,200 ÷ 2,400,000 确实等于 0.175%。","The arithmetic is right. The meaning is not: tickets and customers are different units, and Monday queue time is not the weekend.":"算术没错，含义却不对：工单和客户是不同的单位，而周一的排队时间也不等于周末。","The denominator should be the 40 new representatives":"分母应该是新增的 40 名客服代表","Staff are not the people at risk. The denominator should be the eligible subscribers.":"员工并不是面临流失风险的人。分母应该是符合条件的订阅用户。","It should be rounded to 0.2% for the slide":"为了放进幻灯片，应四舍五入为 0.2%","Rounding does not fix a numerator and denominator that count different things.":"四舍五入修正不了统计对象不一致的分子和分母。","Evidence informs, people decide":"证据提供信息，人来做决策","Suppose the analysis is done. The records can answer some questions. Others stay with the Vice President.":"假设分析已经完成。记录能回答一部分问题，其余的仍要由副总裁来判断。","Label each statement. Who can settle it: the evidence or the leader?":"给每条陈述贴上标签。谁能下定论：证据还是领导者？","<p>Quantitative evidence reduces uncertainty: patterns, counts, missing records and consistent results across tools. Managerial judgment weighs that evidence against budget, staffing, contracts, ethics and other options.</p>\n          <p>Use the sentence frame: \"The evidence can show ___, but the decision maker must still judge ___.\"</p>":"<p>定量证据能减少不确定性：规律、计数、缺失的记录，以及不同工具之间一致的结果。管理判断则要把这些证据与预算、人员、合同、伦理和其他选项放在一起权衡。</p>\n          <p>试试这个句式：“证据可以表明 ___，但决策者仍需判断 ___。”</p>","Evidence can show":"证据可以表明","Leader must judge":"领导者必须判断","Neither: an overclaim":"都不是：过度论断","When weekend tickets occur in approved records":"在经批准的记录中，周末工单出现在什么时间","Whether $450,000 fits the budget":"$450,000 是否在预算之内","How many records are missing or unusual":"有多少记录缺失或异常","Whether a chatbot or help pages are a better use of money":"把钱花在聊天机器人或帮助页面上是否更划算","That weekend staff will end the cancellation rise":"增加周末客服就能让取消量不再上升","Records describe patterns and data quality. Budget limits and choices among options are judgments.":"记录描述的是规律和数据质量。预算上限和方案之间的取舍属于判断。","Budget tolerance and trade-offs belong to the leader. Timing patterns and missing counts are evidence work.":"预算承受度和权衡取舍归领导者判断。时间规律和缺失数量属于证据工作。","Use \"Neither\" for a promise about the future. No record can show it, and no leader can judge it true.":"对关于未来的承诺，请选“都不是”。没有记录能证明它，也没有领导者能判定它为真。","What counts as ready?":"怎样才算就绪？","Before any OmniRetail analysis, you must show Minimum Viable Readiness in Excel and SPSS. An app that opens is not enough.":"在开始任何 OmniRetail 分析之前，你必须在 Excel 和 SPSS 中证明达到了最低可行就绪度 (Minimum Viable Readiness)。软件能打开还不够。","Drag each action to the readiness pillar it proves. One tile proves nothing.":"把每项操作拖到它所证明的就绪支柱上。有一张卡片什么也证明不了。","<p>Readiness is proven by artifacts another analyst can reopen and repeat. In class, the Excel trace changed an hourly support wage from $20 to $25, checked the linked output, and changed it back. The SPSS trace ran only the named syntax block, read the log, saved each file, closed everything and reopened it.</p>":"<p>就绪要靠成果文件来证明，而且其他分析师能重新打开并重复操作。课堂上的 Excel 演示流程把每小时客服工资从 $20 改为 $25，检查关联的输出，然后再改回来。SPSS 演示流程只运行指定的语法块，查看日志，保存每个文件，关闭所有内容后再重新打开。</p>","Close both files, reopen them, and confirm the results still appear":"关闭两个文件，重新打开，确认结果仍然存在","Keep the raw file untouched and work in a named copy":"保持原始文件不动，在一个已命名的副本中操作","Paste a screenshot of the output into the memo":"把输出结果的截图粘贴到备忘录中","Change an input, watch the linked output update, and run the saved syntax":"修改一个输入，观察关联的输出随之更新，并运行已保存的语法","Source protection":"源文件保护","Dynamic execution":"动态执行","Evidence verification":"证据核验","A screenshot cannot show formulas, rerun syntax or prove the file reopens. It proves nothing about readiness.":"截图无法显示公式，无法重新运行语法，也无法证明文件能重新打开。它对就绪情况什么也证明不了。","Reopening checks that results persist. Dynamic execution is about inputs driving outputs.":"重新打开是为了确认结果仍然保留。动态执行关注的是输入驱动输出。","That shows the model responds. Verification means closing, reopening and checking again.":"这说明模型会做出响应。核验指的是关闭、重新打开并再次检查。","Raw file untouched; inputs drive outputs; files saved, closed and reopened":"原始文件未改动；输入驱动输出；文件已保存、关闭并重新打开","Three windows, three files":"三个窗口，三个文件","You ran the provided syntax in SPSS, saved the data file as a .sav, and closed SPSS.":"你在 SPSS 中运行了提供的语法，把数据文件保存为 .sav，然后关闭了 SPSS。","What did you lose?":"你丢失了什么？","<p>SPSS has three windows with three files: the <b>Data Editor</b> (.sav, with Data View and Variable View), the <b>Syntax Editor</b> (.sps) and the <b>Output Viewer</b> (.spv). Save all three, or a colleague cannot rerun or inspect your result.</p>\n          <p>In dialogs, click <b>Paste</b> rather than OK, so the command is kept as syntax.</p>":"<p>SPSS 有三个窗口，对应三个文件：<b>Data Editor</b>（数据编辑器；.sav，含 Data View 和 Variable View）、<b>Syntax Editor</b>（语法编辑器；.sps）和 <b>Output Viewer</b>（输出查看器；.spv）。三个都要保存，否则同事无法重新运行或检查你的结果。</p>\n          <p>在对话框中，点击 <b>Paste</b> 而不是 OK，这样命令就会以语法 (syntax) 的形式保留下来。</p>","The output tables and any unsaved syntax; they live in separate files":"输出表格和所有未保存的语法；它们存放在不同的文件中","Nothing. The .sav file stores data, syntax and output together.":"什么都没丢。.sav 文件会把数据、语法和输出一起保存。","Each window saves its own file: data (.sav), syntax (.sps) and output (.spv). Saving one does not save the others.":"每个窗口保存各自的文件：数据 (.sav)、语法 (.sps) 和输出 (.spv)。保存其中一个，并不会保存其他文件。","Only the variable labels":"只丢失了变量标签","Variable labels live in Variable View and are saved with the .sav file. The output is what is missing.":"变量标签位于 Variable View 中，会随 .sav 文件一起保存。真正丢失的是输出。","The raw source file":"原始源文件","Saving a working .sav does not touch the raw source, which you kept untouched.":"保存工作用的 .sav 文件不会影响原始源文件，你一直没有改动它。","Fill the frame before the data":"先填好框架，再碰数据","You meet the Vice President to bound the question. Every cell must be filled before anyone extracts a record.":"你和副总裁开会，为问题划定边界。在任何人提取记录之前，每一格都必须填好。","Drag each entry into the OmniRetail frame. Two tiles do not belong.":"把每个条目拖进 OmniRetail 的框架中。有两张卡片不属于这里。","<p>The three tiers: <b>decision context</b> (who decides what), <b>evidence scope</b> (whose experience, which period) and <b>measurement plan</b> (what is observed, against what). Without resolved weekday tickets to compare with, you cannot tell whether a cancellation rate is high.</p>\n          <p>Every exclusion narrows the finding. Leaving out enterprise accounts makes the comparison cleaner, and it also means the result cannot justify enterprise support policy.</p>":"<p>三个层级：<b>决策背景</b>（谁来决定什么）、<b>证据范围</b>（谁的经历、哪个时期）和<b>测量计划</b>（观察什么、与什么比较）。如果没有已解决的工作日工单作对比，你就无法判断某个取消率算不算高。</p>\n          <p>每一个排除对象都会缩小结论的适用范围。把企业账户排除在外能让比较更干净，但这也意味着结果不能用来支持企业客户的客服政策。</p>","Trailing 12 months; 60-day outcome window":"过去 12 个月；60 天结果时间窗口","Every customer who ever contacted support":"所有曾经联系过客服的客户","Resolved weekday tickets":"已解决的工作日工单","Active US monthly subscribers":"活跃的美国按月订阅用户","The analytics team":"分析团队","Enterprise accounts":"企业账户","Allocate $450,000 a year for weekend support":"每年拨款 $450,000 用于周末客服","Stakeholder<br><small>decision context</small>":"利益相关者<br><small>决策背景</small>","Pending decision<br><small>decision context</small>":"待定决策<br><small>决策背景</small>","Population<br><small>evidence scope</small>":"总体<br><small>证据范围</small>","Exclusion<br><small>evidence scope</small>":"排除对象<br><small>证据范围</small>","Time horizon<br><small>evidence scope</small>":"时间范围<br><small>证据范围</small>","Reference point<br><small>measurement plan</small>":"参照点<br><small>测量计划</small>","No boundary at all. It mixes plans, countries and years, so the answer would describe nobody in particular.":"完全没有边界。它把不同套餐、国家和年份混在一起，得出的答案描述不了任何具体人群。","Analysts help frame the question, but the stakeholder is the leader who owns the budget.":"分析师帮助框定问题，但利益相关者是掌握预算的那位领导者。","That is the comparison group, not the population.":"这是比较组，不是总体。","Enterprise accounts are left out on purpose. They are the exclusion.":"企业账户是被刻意排除的。它们是排除对象。","Active US monthly subscribers are the people studied. The exclusion is who is left out.":"活跃的美国按月订阅用户是研究对象。排除对象指的是被排除在外的人。","Active US monthly subscribers, enterprise excluded; trailing 12 months; vs resolved weekday tickets":"活跃的美国按月订阅用户，排除企业账户；过去 12 个月；对比已解决的工作日工单","Replace the vague words":"替换模糊的措辞","A director rewrites the request: \"Do recent weekend problems make our customers less loyal?\" Two people could read four parts of it differently.":"一位总监把请求改写成：“最近的周末问题是否让我们的客户忠诚度下降了？”其中有四处，两个人可能会理解得不一样。","Drag a bounded replacement onto each vague phrase. One tile is still vague.":"把有明确边界的替换说法拖到每个模糊短语上。有一张卡片仍然模糊。","<p>The bounded question: \"Among active US monthly consumer subscribers over the trailing twelve months, is an unresolved weekend support ticket <b>associated with</b> a higher 60-day cancellation rate compared to resolved weekday tickets?\"</p>\n          <p>Notice the verb as well. \"Make\" claims a cause. \"Associated with\" stays inside what records can show.</p>":"<p>有明确边界的问题：“在过去十二个月的活跃美国按月消费者订阅用户中，与已解决的工作日工单相比，未解决的周末支持工单与更高的 60 天取消率之间是否<b>存在相关性</b>？”</p>\n          <p>也要留意动词。“让”（make）是在断言因果；“与…相关”（associated with）则没有超出记录所能说明的范围。</p>","Cancelled within 60 days of the ticket":"工单提交后 60 天内取消","Trailing 12 months":"过去 12 个月","Over the last little while":"最近这段时间","Active US monthly subscribers, enterprise excluded":"活跃的美国按月订阅用户，排除企业账户","Unresolved weekend support tickets":"未解决的周末支持工单","\"recent\"":"“最近的”","\"weekend problems\"":"“周末问题”","\"our customers\"":"“我们的客户”","\"less loyal\"":"“忠诚度下降”","Still vague. One person reads a week, another a year. Name the period.":"仍然模糊。有人理解为一周，有人理解为一年。请写明具体时期。","Cancelling is the outcome. The weekend problem is the unresolved ticket.":"取消是结果。周末问题指的是未解决的工单。","The ticket is the exposure. \"Less loyal\" becomes an outcome you can observe: cancelling within 60 days.":"工单是暴露因素。“忠诚度下降”要变成一个可以观察的结果：60 天内取消。","Is an unresolved weekend ticket associated with a higher 60-day cancellation rate than a resolved weekday ticket?":"与已解决的工作日工单相比，未解决的周末工单是否与更高的 60 天取消率相关？","Triage the extra requests":"对额外需求进行分流","Stakeholders ask to add shipping, pricing and loyalty data, with the same deadline. Adding shipping carrier delays alone would push the staffing decision back eight weeks.":"利益相关者要求加入物流、定价和会员忠诚度数据，而截止日期不变。仅加入承运商延误这一项，就会让人员配置决策推迟八周。","Drag each request to its triage lane. One tile is not a triage choice.":"把每个需求拖到对应的分流通道。有一张卡片不是分流选项。","<p>Triage is not refusal. Deliver the comparison that serves the pending decision now, phase the useful extras, and give a different decision its own charter. Show the timeline cost of each addition so the stakeholder can choose.</p>":"<p>分流不是拒绝。现在就交付服务于待定决策的比较分析，把有用的附加内容放到后续分期，并为另一项决策单独制定立项章程。说明每项新增内容的时间代价，让利益相关者自己做选择。</p>","Shipping carrier delays, which add eight weeks":"承运商延误，会增加八周","Accept every addition and keep the deadline":"接受所有新增需求，并保持截止日期不变","Unresolved weekend vs resolved weekday cancellation comparison":"未解决周末工单 vs 已解决工作日工单的取消率比较","Enterprise support policy, with its own owner and budget":"企业客服政策，有自己的负责人和预算","Deliver now":"现在交付","Phase later":"后续分期","Separate charter<br><small>different data, owner or budget</small>":"单独立项章程<br><small>数据、负责人或预算不同</small>","That is uncontrolled scope drift. The study stalls and the $450,000 decision stays open. Triage each addition and show its cost in time.":"这就是失控的范围蔓延。研究会停滞，$450,000 的决策也迟迟定不下来。对每项新增需求进行分流，并说明它的时间成本。","Adding it now delays the staffing decision by eight weeks. Record it as a Phase 2 study.":"现在加入会让人员配置决策推迟八周。把它记录为第 2 阶段的研究。","A different owner and budget means a different decision. It needs its own charter.":"负责人和预算不同，就意味着是另一项决策。它需要单独的立项章程。","This comparison is what the pending $450,000 decision needs. Deliver it now.":"这项比较正是待定的 $450,000 决策所需要的。现在就交付。","How strong can the claim be?":"论断可以有多强？","OmniRetail’s evidence will be observed ticket and cancellation records, not an experiment.":"OmniRetail 的证据将是观察到的工单和取消记录，而不是实验。","Sort each claim by how much these records could support. One claim cannot be sorted yet.":"按这些记录能提供多少支持，对每条论断进行归类。有一条论断目前还无法归类。","<p>Claim strength cannot exceed the design and scope of the evidence. A claim audit checks scope, comparison, direction, time horizon and decision relevance, and flags causal words (caused, drove, led to) and certainty words (will, every, eliminate).</p>\n          <p>A claim is testable when an observation could count against it. Before querying, finish the sentence: \"My claim would be challenged if...\"</p>":"<p>论断强度不能超出证据的设计和范围。论断审查会检查范围、比较对象、方向、时间范围和决策相关性，并标出因果词（导致、推动、引发）和确定性词（将会、每一个、消除）。</p>\n          <p>如果某个观察结果可能与论断相矛盾，这个论断就是可检验的。在查询数据之前，先把这句话补完整：“如果出现……，我的论断就会受到挑战。”</p>","Weekend delays caused the extra cancellations":"周末延误导致了额外的取消","Customer service quality matters":"客户服务质量很重要","Approved records show a difference within the stated period":"经批准的记录显示，在规定时期内存在差异","Weekend staff will stop churn for every customer":"周末客服将阻止每一位客户流失","Supportable":"可支持","Needs qualification":"需要限定","Unsupported":"无法支持","It cannot be sorted: no outcome, comparison or threshold, so no observation could ever count against it. Rewrite it as a testable claim first.":"它无法归类：没有结果、比较对象或阈值，所以任何观察结果都不可能与它相矛盾。先把它改写成可检验的论断。","Close. \"Caused\" outruns observed records, but it can be rescued: reword it as \"associated with\", or test it with a pilot.":"接近了。“导致”超出了观察性记录能说明的范围，但还可以补救：把措辞改成“与…相关”，或者用试点来检验。","Observed records show who had which ticket and who cancelled, not why.":"观察到的记录能显示谁有哪张工单、谁取消了，但不能说明原因。","\"Will\" and \"every customer\" promise certainty for everyone. No wording fix rescues that.":"“将”和“每一位客户”是在对所有人承诺确定性。怎么改措辞都救不回来。","This one already matches what observed records can show. It is supportable as written.":"这条论断已经与观察到的记录所能说明的内容相符。按现在的写法就是可支持的。","Check it or disclose it?":"检验它，还是披露它？","Your log has two columns. An assumption can be checked later. A limitation cannot be removed with these data, so it must be disclosed.":"你的日志有两列。假设可以之后再检验。局限无法用这些数据消除，所以必须披露。","Label each statement as an assumption or a limitation.":"把每条陈述标记为假设或局限。","<p>You audit assumptions in a log; you disclose limitations up front, in the summary rather than a footnote. A limitation narrows a valid conclusion without making it worthless.</p>":"<p>假设记在日志里逐一审查；局限要在一开始就披露，写在摘要中，而不是放在脚注里。局限会缩小一个有效结论的适用范围，但不会让它变得毫无价值。</p>","Assumption to validate":"待验证的假设","Limitation to disclose":"需披露的局限","Ticket timestamps record when customers felt the problem":"工单时间戳记录的是客户遇到问题的时间","Only US consumer subscribers are studied":"只研究美国的消费者订阅用户","Cancellations are recorded the same way in web and mobile billing":"网页端和移动端的账单系统以相同方式记录取消","The evidence comes from observational records":"证据来自观察性记录","No calculation can add enterprise or non-US subscribers. Disclose it: the result cannot justify enterprise policy.":"任何计算都无法补上企业或非美国的订阅用户。请披露这一点：结果不能用来支持企业客户政策。","The design is fixed. Observational records show associations, not causes, and no check changes that.":"研究设计是固定的。观察性记录显示的是相关性，而不是因果，任何检验都改变不了这一点。","Timestamps can be checked against server error logs, batch queues and time zones. Checkable means assumption.":"时间戳可以和服务器错误日志、批处理队列和时区进行核对。能检验的，就是假设。","You can check this by comparing the two billing systems. Checkable means assumption.":"你可以通过比较两个计费系统来检验这一点。能检验的，就是假设。","Validate: timestamps, billing sync. Disclose: US consumers only; observational design.":"待验证：时间戳、计费同步。需披露：仅限美国消费者；观察性设计。","A third variable":"第三个变量","Subscribers who joined with a discount code show 35 percent higher cancellation. An executive wants to stop all discounts.":"使用折扣码注册的订阅用户，取消率高出 35%。一位高管想停掉所有折扣。","What is the strongest concern with that plan?":"这个计划最大的问题是什么？","<p>Price-sensitive customers both seek coupons and cancel when full billing begins. Price sensitivity is a <b>confounder</b>: a third variable that affects both the supposed cause and the outcome. Removing discounts would not make these customers loyal.</p>\n          <p>Before presenting an observational pattern, list at least two other explanations.</p>":"<p>对价格敏感的客户既会去找优惠券，也会在开始按原价计费时取消订阅。价格敏感度就是一个<b>混杂变量</b>：它是同时影响所谓原因和结果的第三个变量。取消折扣并不会让这些客户变得忠诚。</p>\n          <p>在展示一个观察性规律之前，至少列出另外两种解释。</p>","Price sensitivity may drive both coupon use and cancelling":"价格敏感度可能同时导致使用优惠券和取消订阅","None. The pattern shows that discounts cause cancellations.":"没有问题。这个规律说明折扣导致了取消。","Observed records show who used a code and who cancelled, not why. Something else may drive both.":"观察性记录显示的是谁用了折扣码、谁取消了，而不是原因。可能有别的因素同时影响这两者。","A 35 percent gap is too small to matter":"35% 的差距太小，无关紧要","Size is not the issue here. The design is: removing discounts may not change who cancels.":"这里的问题不在于大小，而在于设计：取消折扣未必会改变哪些人取消。","More discount records would prove the cause":"更多的折扣记录就能证明因果","More observational records repeat the same confounding. A design such as a pilot is needed.":"更多的观察性记录只会重复同样的混杂问题。需要像试点这样的设计。","Say only what the evidence can carry":"只说证据撑得住的话","A draft slide reads: \"Hiring weekend agents will eliminate the 14% increase in cancellations.\"":"一张幻灯片草稿写着：“招聘周末客服将消除取消率 14% 的增长。”","Which rewrite stays inside what observed records can support?":"哪种改写没有超出观察性记录能支持的范围？","<p>For observed records, use wording such as \"was associated with\", \"co-occurred with\" or \"differed between groups\". Replacing \"caused\" with \"drove\" or \"impacted\" still implies cause.</p>\n          <p>When a decision needs a causal answer, the session's middle path is a <b>controlled operational pilot</b>, with its window and method fixed before launch.</p>":"<p>对于观察性记录，请使用“与……相关”“与……同时出现”或“在各组之间存在差异”这样的说法。把“导致”换成“推动”或“影响”，仍然暗示因果。</p>\n          <p>当决策需要因果答案时，本节课给出的折中方案是<b>受控运营试点</b>，并在启动前固定时间窗口和方法。</p>","If weekend tickets are associated with cancellation, test weekend support in a 90-day pilot":"如果周末工单与取消相关，就用 90 天试点来测试周末客服","Weekend agents drove the rise and will reverse it":"周末客服推动了增长，也会扭转它","\"Drove\" still claims a cause, and \"will reverse\" guarantees a result.":"“推动”仍然在断言因果，“会扭转”则是在保证结果。","Weekend support impacted cancellations, so hire 40 agents now":"周末客服影响了取消率，所以现在就招 40 名客服","\"Impacted\" is causal language in disguise. Swapping verbs does not change what the design can show.":"“影响”是换了说法的因果语言。换个动词，并不会改变设计所能说明的内容。","Weekend agents will eliminate most of the increase":"周末客服将消除大部分增长","Softer, but still a promise of cause and effect that observed records cannot make.":"语气缓和了，但仍然是在承诺观察性记录无法证明的因果关系。","\"Associated with\", not \"caused\"; a causal answer needs a pilot":"说“与……相关”，不说“导致”；因果答案需要试点","Build the KPI":"构建 KPI","The outcome is the 60-day cancellation rate. Each part of the rate needs a written rule before anyone calculates.":"结果指标是 60 天取消率。在任何人开始计算之前，比率的每个部分都需要一条书面规则。","Drag the right piece into each part of the KPI. Three tiles are traps.":"把正确的部分拖到 KPI 的每个位置。有三张卡片是陷阱。","<p>KPI: <b>60-day cancellation rate</b> = eligible subscribers who cancel within 60 days of an unresolved weekend ticket ÷ eligible subscribers with an unresolved weekend ticket. Compare it with the same rate after resolved weekday tickets.</p>\n          <p>The unit is subscribers, not tickets or accounts. Write the denominator and boundary rules before you calculate any rate.</p>":"<p>KPI：<b>60 天取消率</b> = 在未解决的周末工单后 60 天内取消的合格订阅用户 ÷ 有未解决周末工单的合格订阅用户。再把它和已解决的工作日工单之后的同一比率进行比较。</p>\n          <p>单位是订阅用户，不是工单，也不是账户。在计算任何比率之前，先写下分母规则和边界规则。</p>","All 2.4 million accounts":"全部 2.4 million 个账户","Eligible subscribers who cancel within the window":"在时间窗口内取消的合格订阅用户","The number of unresolved weekend tickets":"未解决的周末工单数量","Active US monthly subscribers with an unresolved weekend ticket":"有未解决周末工单的活跃美国按月订阅用户","Any cancellation, whenever it happens":"任何取消，无论何时发生","60 days after each ticket":"每张工单之后的 60 天","The same rate after resolved weekday tickets":"已解决的工作日工单之后的同一比率","Numerator<br><small>who counts as an event</small>":"分子<br><small>谁算作一次事件</small>","Denominator<br><small>who is eligible</small>":"分母<br><small>谁符合条件</small>","Window":"时间窗口","Compared with":"比较对象","That includes enterprise accounts and people who never had a weekend ticket. It dilutes the rate, like dividing by all café sales.":"这包括了企业账户和从没有过周末工单的人。它会稀释比率，就像除以咖啡馆的全部销售额一样。","Tickets are not subscribers. One subscriber can file several tickets, so a ticket count inflates the base.":"工单不等于订阅用户。一个订阅用户可能提交多张工单，所以用工单数会把基数放大。","Without a fixed window, people with older tickets get more time to cancel, and churn means something different in each tool.":"如果没有固定的时间窗口，工单较早的人就有更多时间取消，而客户流失在每个工具里的含义也会不同。","The denominator is everyone eligible, whether or not they cancel. Cancellers go on top.":"分母是所有符合条件的人，无论他们是否取消。取消的人放在分子上。","The numerator counts only the events: subscribers who cancel within the window.":"分子只统计事件：在时间窗口内取消的订阅用户。","60-day cancellation rate per eligible subscriber, vs resolved weekday tickets":"每位合格订阅用户的 60 天取消率，对比已解决的工作日工单","Points or percent?":"百分点还是百分比？","The slides say cancellations rose 14 percent. That is a relative change. Suppose last quarter’s cancellation rate was 10 percent.":"幻灯片上说取消率上升了 14%。这是相对变化。假设上个季度的取消率是 10%。","Drag this quarter’s rate to a 14 percent relative rise. How many percentage points is that?":"把本季度的取消率拖到相对上升 14% 的位置。这相当于多少个百分点？","<p>A <b>percentage point</b> is the arithmetic difference between two percentages: 10% to 15% is 5 points. <b>Percent change</b> divides that difference by the starting rate: 5 ÷ 10 = 50%.</p>\n          <p>\"Rose 14 percent\" from 10% means 10 × 1.14 = 11.4%, only 1.4 points. OmniRetail's threshold of 5 is in <b>points</b>, so always say which unit you mean.</p>":"<p><b>百分点</b>是两个百分比之间的算术差：从 10% 到 15% 是 5 个百分点。<b>百分比变化</b>是用这个差除以起始比率：5 ÷ 10 = 50%。</p>\n          <p>从 10% “上升 14%”意味着 10 × 1.14 = 11.4%，只多了 1.4 个百分点。OmniRetail 的阈值 5 是以<b>百分点</b>计的，所以一定要说清楚你用的是哪种单位。</p>","Write the rule before the data":"先写规则，再看数据","Leadership agreed in writing, before any query: the budget is justified only if Δ, the gap in 60-day cancellation rates, is at least 5 percentage points.":"管理层在任何查询之前就以书面形式约定：只有当 Δ（60 天取消率的差距）至少达到 5 个百分点时，这笔预算才算合理。","Drag Δ. What is the smallest gap, in steps of 0.1 point, that supports the commitment?":"拖动 Δ。以 0.1 个百分点为步长，能支持这项投入的最小差距是多少？","<p>As a rule: Δ = p<sub>weekend, unresolved</sub> − p<sub>weekday, resolved</sub>, and the evidence supports the commitment only if Δ ≥ δ = 5. \"At least\" includes 5 itself, just as the toolkit's \"within five minutes\" includes a wait of exactly 5.</p>\n          <p>Fix δ and the reference group before the first query, and date it. Meeting the threshold still does not prove cause or make the decision.</p>":"<p>写成规则就是：Δ = p<sub>周末，未解决</sub> − p<sub>工作日，已解决</sub>，只有当 Δ ≥ δ = 5 时，证据才支持这项投入。“至少”包括 5 本身，就像工具包里的“五分钟以内”也包括正好等了 5 分钟一样。</p>\n          <p>在第一次查询之前就把 δ 和参照组定下来，并注明日期。即使达到阈值，也不能证明因果，更不能替人做决策。</p>","Support the $450,000 only if Δ ≥ 5 points, agreed before any query":"只有当 Δ ≥ 5 个百分点时才支持这 $450,000，并在任何查询之前约定","The sponsor’s idea falls short":"发起人的设想没有达标","Suppose the comparison comes back with Δ = 1.2 percentage points. The Vice President had hoped for at least 5.":"假设比较结果是 Δ = 1.2 个百分点。副总裁原本希望至少达到 5。","What do you report?":"你会怎么汇报？","<p>1.2 &lt; 5, so the rule fails. Report it plainly. Disconfirming a sponsor's hypothesis is a useful result, not a failure.</p>\n          <p>The threshold is a business agreement, not a statistical law. If costs change, leadership can set a new threshold for a <i>future</i> study, before its data are seen.</p>":"<p>1.2 &lt; 5，所以规则未通过。直接如实汇报。否定发起人的假设是有用的结果，不是失败。</p>\n          <p>阈值是一项业务约定，不是统计定律。如果成本发生变化，管理层可以为<i>将来的</i>研究设定新的阈值，但要在看到那项研究的数据之前。</p>","Under the agreed rule, weekend delays do not justify the $450,000":"按照约定的规则，周末延误不足以支持这 $450,000","Lower the threshold to 1 point, since a difference exists":"既然存在差距，就把阈值降到 1 个百分点","Changing δ after seeing results is moving the goalposts. The rule was fixed in advance for this reason.":"看到结果后再改 δ，就是临时改变标准。正因为如此，规则才要事先定好。","Add conditions and subgroups until a gap of 5 appears":"不断添加条件和子组，直到出现 5 个百分点的差距","Searching until the preferred answer appears is an integrity failure, not analysis.":"一直找到想要的答案为止，这是诚信问题，不是分析。","Delay the report, because it disappoints the sponsor":"因为结果让发起人失望，就推迟报告","A disconfirmation is a useful result. It protects $450,000 a year from a weak rationale.":"否定性结果也是有用的结果。它让每年 $450,000 免于花在站不住脚的理由上。","Significant, but worth it?":"统计显著，但值得吗？","Another illustration from class: across 2.4 million records, the gap is 0.3 points with p < 0.001. The slides value that gap at about $24,000 a year.":"课堂上的另一个例子：在 2.4 million 条记录中，差距为 0.3 个百分点，且 p < 0.001。幻灯片评估该差距每年价值约 $24,000。","Compare the value with the cost.":"把价值和成本做个比较。","<p>The value covers about 5.3% of the cost, a shortfall of $426,000 a year. The cost is 18.75 times the value, and 0.3 is far below δ = 5.</p>\n          <p><b>Statistical significance</b> says a gap is unlikely to be noise; with millions of records, even tiny gaps qualify. <b>Practical significance</b> asks whether the gap is big enough to act on. That is why δ is agreed before the results.</p>":"<p>这个价值只覆盖了成本的约 5.3%，每年缺口为 $426,000。成本是价值的 18.75 倍，而且 0.3 远低于 δ = 5。</p>\n          <p><b>统计显著性</b>说明差距不太可能只是噪声；记录有几百万条时，再小的差距也能显著。<b>实际显著性</b>问的是差距是否大到值得采取行动。这就是为什么 δ 要在看到结果之前约定好。</p>","share of the cost covered = 24,000 ÷ 450,000 = {{share}} %":"成本覆盖比例 = 24,000 ÷ 450,000 = {{share}} %","yearly shortfall = 450,000 − 24,000 = $ {{gap}}":"每年缺口 = 450,000 − 24,000 = $ {{gap}}","Divide 24,000 by 450,000, then multiply by 100: about 5.33%.":"用 24,000 除以 450,000，再乘以 100：约 5.33%。","Share of the cost covered, in percent":"成本覆盖比例（百分比）","Subtract: 450,000 − 24,000 = 426,000 dollars.":"相减：450,000 − 24,000 = 426,000 美元。","Yearly shortfall in dollars":"每年缺口（美元）","Toolkit transfer: one boundary word":"工具包迁移练习：一个边界词","Your toolkit works the same idea in a café, Cedar Cup. Eight checked pickup orders waited 2, 4, 6, 8, 3, 5, 7 and 9 minutes. The KPI counts orders handed over within five minutes.":"你的工具包在一家叫 Cedar Cup 的咖啡馆里讲了同样的道理。八笔经过核查的自取订单分别等了 2、4、6、8、3、5、7 和 9 分钟。这个 KPI 统计的是五分钟以内交付的订单。","Compute the rate under each boundary rule, then the count a 75% target needs.":"按每条边界规则算出比率，再算出达到 75% 目标所需的订单数。","<p>Changing \"at most five\" to \"under five\" moves one order, C106, and drops the rate from 50% to 37.5%. That is a new definition, not a recalculation. Write the boundary rule before calculating, and never change it silently.</p>\n          <p>Reaching 75% would need 6 of 8, two more than observed. That arithmetic does not say any staffing change will produce them.</p>":"<p>把“最多五分钟”改成“少于五分钟”，会让一笔订单 C106 换了类别，比率从 50% 降到 37.5%。这是一个新定义，而不是重新计算。先写好边界规则再计算，而且绝不要悄悄修改它。</p>\n          <p>要达到 75%，需要 8 笔中有 6 笔，比观察到的多两笔。这个算术并不能说明任何人员调整就一定能带来这些订单。</p>","at most 5 minutes (≤ 5): {{n5}} of 8 orders = {{r5}} %":"最多 5 分钟（≤ 5）：8 笔中有 {{n5}} 笔 = {{r5}} %","under 5 minutes (&lt; 5): {{n4}} of 8 orders = {{r4}} %":"少于 5 分钟（&lt; 5）：8 笔中有 {{n4}} 笔 = {{r4}} %","a 75% target among 8 orders needs {{six}} orders":"在 8 笔订单中达到 75% 的目标需要 {{six}} 笔订单","Count the waits of 5 or less: 2, 4, 3 and 5.":"数出等待 5 分钟或更短的订单：2、4、3 和 5。","Orders at most 5 minutes":"最多 5 分钟的订单数","4 ÷ 8 = 0.50, which is 50%.":"4 ÷ 8 = 0.50，也就是 50%。","Rate at most 5 minutes, in percent":"最多 5 分钟的比率（百分比）","Under 5 leaves out the order that waited exactly 5. Only 2, 3 and 4 count.":"“少于 5”不包括正好等了 5 分钟的那一笔。只有 2、3 和 4 算数。","Orders under 5 minutes":"少于 5 分钟的订单数","3 ÷ 8 = 0.375, which is 37.5%.":"3 ÷ 8 = 0.375，也就是 37.5%。","Rate under 5 minutes, in percent":"少于 5 分钟的比率（百分比）","0.75 × 8 = 6 orders, two more than observed.":"0.75 × 8 = 6 笔订单，比观察到的多两笔。","Orders needed for 75%":"达到 75% 所需的订单数","Missing is not a failure":"缺失不等于失败","A Cedar Cup manager reports 12 timely handoffs among 15 orders with timestamps. Three more mobile orders have no recorded arrival time.":"一位 Cedar Cup 经理报告：在有时间戳的 15 笔订单中，有 12 笔按时交付。另有三笔手机订单没有记录到店时间。","Which report is honest?":"哪份报告是诚实的？","<p>All 18 orders stay eligible, but 3 outcomes are unknown. Report the measured rate with its own denominator and the missing count beside it, and apply a missing-outcome rule written in advance before claiming a rate for all 18.</p>\n          <p>For OmniRetail, the same rule applies to tickets with a blank timestamp or a missing cancellation record.</p>":"<p>全部 18 笔订单都仍然符合条件，但有 3 笔的结果未知。报告实测比率时要附上它自己的分母，并在旁边注明缺失数量；在对全部 18 笔订单声称某个比率之前，先套用事先写好的缺失结果规则。</p>\n          <p>对 OmniRetail 来说，同样的规则也适用于时间戳为空或缺少取消记录的工单。</p>","12 of 15 measured orders (80%), plus 3 eligible orders with missing times":"15 笔有测量的订单中有 12 笔（80%），另有 3 笔符合条件的订单缺少时间","12 of 18 orders (66.7%) were handed over within five minutes":"18 笔订单中有 12 笔（66.7%）在五分钟以内交付","That counts the 3 unknown orders as failures. A missing time does not show a wait longer than five minutes.":"这把 3 笔结果未知的订单算成了失败。时间缺失并不说明等待超过了五分钟。","80% of all 18 eligible orders were within five minutes":"全部 18 笔符合条件的订单中有 80% 在五分钟以内交付","Nobody measured the 3 missing orders, so the 80% covers only the 15 measured ones.":"那 3 笔缺失的订单没有人测量过，所以 80% 只涵盖了有测量的 15 笔。","Drop the 3 orders and report 80% with no note":"去掉这 3 笔订单，报告 80%，不加任何说明","Silently excluding eligible orders hides a data problem. Report the missing count and investigate it.":"悄悄排除符合条件的订单，会掩盖数据问题。报告缺失数量，并调查原因。","Design the test that can show cause":"设计一个能说明因果的检验","Records can show an association. To learn whether weekend support itself reduces cancellations, the session proposed a controlled operational pilot.":"记录能说明相关性。为了弄清周末客服本身是否能减少取消，本节课提出了一个受控运营试点。","Drag each design choice into the pilot plan. One tile is not a controlled design.":"把每个设计选择拖到试点计划中。有一张卡片不是受控设计。","<p>Instead of $450,000 company-wide, fund a 90-day pilot in three representative regions, keep the other regions as a control group, and track the same measures in both. Fix the window, the sample and the method before launch.</p>":"<p>与其在全公司投入 $450,000，不如资助一个在三个代表性地区进行的 90 天试点，把其他地区作为对照组，并在两边追踪同样的指标。在启动前固定时间窗口、样本和方法。</p>","First-contact resolution, repeat contacts and 60-day cancellation":"首次联系解决率、重复联系和 60 天取消","90 days, fixed before launch":"90 天，启动前固定","Launch company-wide, then compare with last quarter":"在全公司推行，然后和上个季度比较","Three representative regions":"三个代表性地区","The other regions as a control group":"其他地区作为对照组","Length":"时长","Where":"地点","Comparison":"比较","Measures":"指标","A before-and-after comparison can reflect demand, season or price changes. Without a control group, the cause stays open.":"前后对比可能反映的是需求、季节或价格的变化。没有对照组，原因就仍然无法确定。","The control regions are the comparison. The pilot itself runs in three representative regions.":"对照地区才是比较对象。试点本身在三个代表性地区进行。","The pilot runs in these regions. The comparison is the other regions, without weekend support.":"试点在这些地区进行。比较对象是其他没有周末客服的地区。","Ready, or not yet?":"准备好了，还是还没有？","The session ends with an honest classification. A documented pause is valid professional work.":"本节课以一次诚实的分类收尾。有记录的暂停也是正当的专业工作。","Match each situation to its classification. One tile is a trap.":"把每种情况和它的分类配对。有一张卡片是陷阱。","<p><b>Ready to analyze</b>: bounded question, feasible and permitted evidence, working tools. <b>Clarification required</b>: intent, scope or claim strength is still unclear. <b>Evidence blocked</b>: the needed evidence is missing, prohibited or unsuitable for the claim. <b>Tool blocked</b>: the workflow cannot produce saved, inspectable artifacts.</p>":"<p><b>可以开始分析</b>：问题有明确边界，证据可行且获得许可，工具运行正常。<b>需要澄清</b>：意图、范围或论断强度仍不清楚。<b>证据受阻</b>：所需证据缺失、被禁止使用，或不适合支撑这个论断。<b>工具受阻</b>：工作流程无法产出已保存、可检查的成果文件。</p>","Tool blocked":"工具受阻","Ready to analyze":"可以开始分析","Ready, because SPSS opened":"已就绪，因为 SPSS 打开了","Evidence blocked":"证据受阻","Clarification required":"需要澄清","The question is bounded, the records are approved, and the workbook reopens cleanly":"问题有明确边界，记录已获批准，工作簿也能顺利重新打开","Locations, period and outcome are still unspecified":"地点、时期和结果仍未明确","The leader wants causal proof, but only observational records exist":"领导者想要因果证明，但只有观察性记录","The SPSS output will not save or reopen":"SPSS 输出无法保存或重新打开","A launched app proves access, not readiness. Readiness needs saved, reopened, inspectable artifacts.":"软件能启动只能证明有访问权限，不代表已就绪。就绪需要已保存、能重新打开、可检查的成果文件。","The evidence may be fine. What is missing is the question itself, so ask first.":"证据可能没问题。缺的是问题本身，所以先去问清楚。","The question is clear. These records simply cannot give a causal answer, so the evidence is blocked for that claim.":"问题是清楚的。只是这些记录给不出因果答案，所以对这个论断来说，证据受阻。","The evidence may be fine. The workflow cannot produce saved artifacts, so the tool is the block.":"证据可能没问题。工作流程无法产出已保存的成果文件，所以受阻的是工具。","Make the call":"做出判断","The Vice President wants one recommendation by Friday. The frame is ready, but the comparison has not been run.":"副总裁希望在周五前得到一条建议。框架已经准备好，但比较还没有运行。","What do you recommend?":"你建议怎么做？","<p>A bounded recommendation says what to do next without claiming that weekend staff will work. Run the comparison exactly as framed: same population, 60-day window, resolved weekday reference and δ = 5. If Δ reaches 5, a 90-day controlled pilot tests whether weekend support itself helps, before any company-wide commitment.</p>\n          <p>Lead with the decision and its evidence boundary, not with an unqualified number.</p>":"<p>有边界的建议会说明下一步做什么，而不会声称周末客服一定有效。完全按照框定的方式运行比较：相同的总体、60 天时间窗口、以已解决的工作日工单为参照，以及 δ = 5。如果 Δ 达到 5，就先用 90 天受控试点检验周末客服本身是否有帮助，再考虑全公司范围的投入。</p>\n          <p>先讲决策和它的证据边界，而不是先抛出一个不加限定的数字。</p>","Hold the $450,000. Run the framed comparison against Δ ≥ 5, then pilot if it passes.":"暂缓这 $450,000。按 Δ ≥ 5 运行已框定的比较，通过后再做试点。","Commit now. A 4,200-ticket Monday backlog proves weekend demand.":"现在就投入。周一积压 4,200 张工单就证明了周末有需求。","A Monday queue does not show when tickets were submitted, and a backlog is not cancellation evidence.":"周一的队列显示不出工单是什么时候提交的，而且积压也不是取消的证据。","Reject weekend support for good. Analysis cannot stop churn anyway.":"彻底否决周末客服。反正分析也止不住客户流失。","Evidence can still reduce uncertainty. Reject only if the agreed rule fails or a pilot shows no benefit.":"证据仍然可以减少不确定性。只有在约定的规则未通过，或试点显示没有好处时，才否决。","Run SPSS on every ticket first, and decide what to measure later.":"先用 SPSS 把所有工单跑一遍，之后再决定测量什么。","That is the tool-first trap. The frame already says what to measure.":"这就是“工具优先”陷阱。框架已经说明了要测量什么。","Hold the $450,000; run the framed comparison against δ = 5; pilot 90 days in 3 regions if it passes":"暂缓这 $450,000；按 δ = 5 运行已框定的比较；通过后在 3 个地区试点 90 天","Your decision-rule bench":"你的决策规则试验台","Start with the decision. Write the rule before the data. Match the claim to the design.":"从决策出发。先写规则，再看数据。让论断与设计相匹配。","Change the inputs to test other results. The gates and the verdict update as you go.":"改变输入值，测试其他结果。各项关卡和结论会随之更新。","OmniRetail support week: staffed Monday to Friday, closed at the weekend, 4,200 unresolved tickets every Monday":"OmniRetail 客服的一周：周一至周五有人值班，周末关闭，每周一有 4,200 张未解决工单","Mon":"周一","Tue":"周二","Wed":"周三","Thu":"周四","Fri":"周五","Sat":"周六","Sun":"周日","closed":"关闭","4,200 unresolved":"4,200 张未解决","Sketch. Only the 4,200 Monday backlog comes from the case; the other bar heights are not data.":"示意图。只有周一积压的 4,200 张来自案例；其他柱子的高度不是数据。","Yearly value of a 0.3-point gap compared with the yearly cost of weekend staff":"0.3 个百分点差距的年度价值与周末客服年度成本的对比","Value of a 0.3-point gap":"0.3 个百分点差距的价值","Weekend staff cost":"周末客服成本","Eight Cedar Cup waits on a minute line with the five-minute boundary":"Cedar Cup 的八次等待时间在分钟轴上的位置，以及五分钟边界","wait (minutes)":"等待时间（分钟）","5 minutes":"5 分钟","C106 waited exactly 5":"C106 正好等了 5 分钟","Done":"已完成","Open":"未完成","Gates for your result":"你的结果要过的关卡","Observed gap Δ":"观察到的差距 Δ","points":"个百分点","Agreed threshold δ":"约定阈值 δ","Δ minus δ":"Δ 减 δ","Clarify or fix the tools first":"先澄清问题或修好工具","Do not commit; report the shortfall":"不投入；报告差距不足","Run a controlled pilot before committing":"投入前先做受控试点","Evidence supports it; the leader still decides":"证据支持；最终仍由领导者决定","Δ meets the agreed δ":"Δ 达到约定的 δ","Causal wording allowed":"可以使用因果措辞","Pass":"通过","Fail":"未通过","Verdict":"结论","Agreed threshold δ (points)":"约定阈值 δ（百分点）","Observed gap Δ (points)":"观察到的差距 Δ（百分点）","Observed ticket records":"观察到的工单记录","Controlled 90-day pilot":"90 天受控试点","Evidence design":"证据设计","Yes":"是","No":"否","Question bounded and agreed":"问题有明确边界并已达成一致","Files saved and reopened":"文件已保存并重新打开","Cancellation rate last quarter and this quarter":"上季度和本季度的取消率","cancellation rate":"取消率","last quarter 10%":"上季度 10%","This quarter":"本季度","Gap":"差距","Relative change":"相对变化","Cancellation rate this quarter":"本季度取消率","Observed gap and the agreed 5-point threshold":"观察到的差距与约定的 5 个百分点阈值","Δ, gap in 60-day cancellation rates (percentage points)":"Δ，60 天取消率的差距（百分点）","δ = 5, agreed in advance":"δ = 5，事先约定","supports the commitment":"支持这项投入","Dots mark the two class illustrations: 0.3 and 1.2 points.":"圆点标出两个课堂示例：0.3 和 1.2 个百分点。","Δ at least 5?":"Δ 至少为 5？","Supports the $450,000?":"支持这 $450,000 吗？","Yes, under the rule":"是，按规则","Observed gap":"观察到的差距","Decision owner and choice named":"已指明决策负责人和选项","VP; $450,000 a year":"副总裁；每年 $450,000","Question bounded":"问题有明确边界","US monthly; 60 days; weekday reference":"美国按月订阅；60 天；工作日参照","Decision rule written before the data":"在看数据之前写好决策规则","Weekend vs weekday comparison run":"已运行周末与工作日的比较","not yet":"尚未","Causal evidence for weekend staffing":"周末客服的因果证据","needs a pilot":"需要试点","Framing gates for the OmniRetail decision":"OmniRetail 决策的问题框定关卡","Right call.":"判断正确。","Right call. Your gut call at the start was “{call}”. Now you can back your answer with a frame and a rule.":"判断正确。你一开始的直觉判断是“{call}”。现在你可以用一个框架和一条规则来支撑你的答案了。","Lesson complete":"课程完成","You earned {pts} points: {firsts} first-try answers across {graded} questions.":"你获得了 {pts} 分：{graded} 道题中有 {firsts} 道一次答对。","Your framing canvas stays in the case panel. Use Back or the part bar to revisit any screen.":"你的问题框定画布会保留在案例面板中。可以用“返回”或部分导航栏重新查看任意一屏。","Right: 10 × 1.14 = 11.4%, a gap of only 1.4 points.":"对：10 × 1.14 = 11.4%，差距只有 1.4 个百分点。","That adds 14 percentage points, a 140% rise. \"Rose 14 percent\" multiplies the old rate by 1.14.":"那是加了 14 个百分点，相当于上升 140%。“上升 14%”是把原来的比率乘以 1.14。","A 14% rate is a 4-point gap and a 40% rise. A 14 percent rise means 10 × 1.14.":"14% 的比率意味着 4 个百分点的差距和 40% 的上升。上升 14% 指的是 10 × 1.14。","That is more than a 14 percent rise. Move left until the relative change reads 14%.":"这超过了 14% 的上升。向左移动，直到相对变化显示为 14%。","Not yet a 14 percent rise. Move right a little.":"还没到 14% 的上升。再往右移一点。","Exactly. \"At least 5\" includes 5.0 itself.":"完全正确。“至少 5”包括 5.0 本身。","Close, but 4.9 is below 5. The rule says at least 5 points.":"很接近，但 4.9 低于 5。规则要求至少 5 个百分点。","Still below the agreed 5 points, so the rule fails. Move right.":"仍然低于约定的 5 个百分点，所以规则未通过。向右移动。","That supports the commitment, but a smaller gap does too. Find the first value that meets the rule.":"这能支持这项投入，但更小的差距也可以。找出第一个满足规则的值。"},"es":{"Should OmniRetail Staff Weekends?":"¿Debe OmniRetail contratar personal para los fines de semana?","GC1015 · Session 1 · Decisions, bounded questions and decision rules":"GC1015 · Sesión 1 · Decisiones, preguntas acotadas y reglas de decisión","Finish":"Terminar","Your framing canvas":"Tu lienzo de encuadre","Decision before tools":"La decisión antes que las herramientas","From concern to question":"De la preocupación a la pregunta","KPIs and the decision rule":"KPI y regla de decisión","Case file: OmniRetail":"Expediente del caso: OmniRetail","A simulated subscription retailer from the Session 01 slides. None of it is real company data.":"Un minorista de suscripción simulado, tomado de las diapositivas de la Sesión 01. Nada de esto son datos reales de una empresa.","Fact":"Dato","Value":"Valor","Active accounts":"Cuentas activas","2.4 million":"2.4 millones","Quarterly cancellations":"Cancelaciones trimestrales","up 14 percent":"suben un 14 por ciento","Proposal":"Propuesta","40 weekend representatives":"40 representantes de fin de semana","Yearly cost":"Costo anual","Monday backlog":"Acumulación del lunes","4,200 unresolved tickets":"4,200 tickets sin resolver","Decision owner":"Responsable de la decisión","Vice President of Customer Operations":"Vicepresidente de Operaciones de Clientes","Agreed threshold, δ":"Umbral acordado, δ","5 percentage points":"5 puntos porcentuales","Class illustrations, not results: a gap of 1.2 points, and a gap of 0.3 points that is significant at p < 0.001 and worth about $24,000 a year.":"Ejemplos de clase, no resultados: una diferencia de 1.2 puntos y una diferencia de 0.3 puntos que es significativa con p < 0.001 y vale unos $24,000 al año.","Toolkit transfer case: Cedar Cup café, 8 checked pickup orders that waited 2, 4, 6, 8, 3, 5, 7 and 9 minutes.":"Caso de transferencia del toolkit: la cafetería Cedar Cup, 8 pedidos para recoger revisados que esperaron 2, 4, 6, 8, 3, 5, 7 y 9 minutos.","Owner and decision":"Responsable y decisión","Set on screen 4":"Se define en la pantalla 4","Inspect first":"Revisar primero","Tool readiness":"Preparación de las herramientas","Scope":"Alcance","Bounded question":"Pregunta acotada","Claim wording":"Redacción de la afirmación","Assumptions and limits":"Supuestos y limitaciones","KPI":"KPI","Decision rule":"Regla de decisión","Recommendation":"Recomendación","Should OmniRetail fund weekend support?":"¿Debe OmniRetail financiar el soporte de fin de semana?","Your gut call, before any analysis: should OmniRetail commit the $450,000?":"Tu intuición, antes de cualquier análisis: ¿debe OmniRetail comprometer los $450,000?","OmniRetail is a simulated subscription retailer with 2.4 million active accounts. Cancellations rose 14 percent this quarter.":"OmniRetail es un minorista de suscripción simulado con 2.4 millones de cuentas activas. Las cancelaciones subieron un 14 por ciento este trimestre.","The Vice President of Customer Operations proposes 40 weekend support representatives for $450,000 a year. The reason: every Monday, 4,200 unresolved tickets are waiting.":"El vicepresidente de Operaciones de Clientes propone 40 representantes de soporte de fin de semana por $450,000 al año. El motivo: cada lunes hay 4,200 tickets sin resolver esperando.","Noted. We will come back to your call at the end, with evidence.":"Anotado. Volveremos a tu decisión al final, con evidencia.","Yes, commit now":"Sí, comprometerlo ya","No, keep weekday-only support":"No, mantener el soporte solo entre semana","Not yet, I need a clearer question":"Todavía no, necesito una pregunta más clara","Four levels in one request":"Cuatro niveles en una sola solicitud","The request mixes four different things. Only one of them commits money or staff.":"La solicitud mezcla cuatro cosas distintas. Solo una de ellas compromete dinero o personal.","Drag each sentence to its level. One tile does not belong anywhere.":"Arrastra cada frase a su nivel. Una ficha no encaja en ningún lugar.","<p>Only the stakeholder decision commits budget or policy. The analytic question names the evidence that would reduce uncertainty about that decision. The software task comes last.</p>\n          <p>Opening SPSS before the decision is clear is the <b>tool-first trap</b>: an accurate calculation can still answer the wrong question.</p>":"<p>Solo la decisión del stakeholder compromete presupuesto o políticas. La pregunta analítica nombra la evidencia que reduciría la incertidumbre sobre esa decisión. La tarea de software va al final.</p>\n          <p>Abrir SPSS antes de que la decisión esté clara es la <b>trampa de empezar por la herramienta</b>: un cálculo correcto puede responder la pregunta equivocada.</p>","Filter and summarize ticket records in SPSS":"Filtrar y resumir los registros de tickets en SPSS","Quarterly cancellations rose 14 percent":"Las cancelaciones trimestrales subieron un 14 por ciento","Weekend staff will stop churn":"El personal de fin de semana detendrá el abandono","Do subscribers with unresolved weekend tickets cancel more often than comparable subscribers?":"¿Los suscriptores con tickets de fin de semana sin resolver cancelan más a menudo que suscriptores comparables?","Authorize $450,000 a year for 40 weekend representatives":"Autorizar $450,000 al año para 40 representantes de fin de semana","Business problem<br><small>an observed condition</small>":"Problema de negocio<br><small>una situación observada</small>","Stakeholder decision<br><small>a commitment a leader owns</small>":"Decisión del stakeholder<br><small>un compromiso que asume un líder</small>","Analytic question<br><small>the evidence needed</small>":"Pregunta analítica<br><small>la evidencia necesaria</small>","Software task<br><small>a tool operation</small>":"Tarea de software<br><small>una operación con la herramienta</small>","That is a promise, not a level. Analysis cannot stop churn. It can test whether a pattern exists.":"Eso es una promesa, no un nivel. El análisis no puede detener el abandono. Puede comprobar si existe un patrón.","A rise in cancellations is a condition someone observed. Nobody has committed anything yet.":"Un aumento de las cancelaciones es una situación que alguien observó. Todavía nadie ha comprometido nada.","A question asks for evidence. The decision is the commitment of money or staff.":"Una pregunta pide evidencia. La decisión es el compromiso de dinero o personal.","Authorizing $450,000 commits budget. That is the decision the evidence should serve.":"Autorizar $450,000 compromete presupuesto. Esa es la decisión a la que debe servir la evidencia.","Filtering in SPSS is a mechanical step. It comes last, after the question is clear.":"Filtrar en SPSS es un paso mecánico. Va al final, cuando la pregunta ya está clara.","Ask this first":"Pregunta esto primero","A manager emails you: \"Run SPSS on every ticket and stop churn.\" You have not opened any file yet.":"Un gerente te escribe: \"Pasa todos los tickets por SPSS y detén el abandono\". Todavía no has abierto ningún archivo.","What is the most useful first question to send back?":"¿Cuál es la primera pregunta más útil que puedes responderle?","<p>The decision sets relevance. It tells you which uncertainty matters, and so which evidence to collect. Ask every requester: \"What specific managerial decision will change depending on the outcome of this calculation?\"</p>\n          <p>If nobody can name a decision, ask what action, budget or policy could change after the analysis.</p>":"<p>La decisión define qué es relevante. Te dice qué incertidumbre importa y, por lo tanto, qué evidencia reunir. Pregúntale a cada solicitante: \"¿Qué decisión gerencial concreta cambiará según el resultado de este cálculo?\"</p>\n          <p>Si nadie puede nombrar una decisión, pregunta qué acción, presupuesto o política podría cambiar después del análisis.</p>","What decision will change depending on the result?":"¿Qué decisión cambiará según el resultado?","Which version of SPSS should I use?":"¿Qué versión de SPSS debo usar?","That is a software detail. It cannot tell you which records or which comparison matter.":"Eso es un detalle del software. No te dice qué registros ni qué comparación importan.","Can I have every ticket ever logged?":"¿Me puedes dar todos los tickets registrados desde siempre?","More records are not more credible. Without a decision, you cannot tell which records are relevant.":"Más registros no dan más credibilidad. Sin una decisión, no puedes saber qué registros son relevantes.","Which statistical test do you want?":"¿Qué prueba estadística quieres?","A method comes after the question is framed. Choosing one now is still tool-first.":"El método llega después de plantear la pregunta. Elegir uno ahora sigue siendo empezar por la herramienta.","Repair the request":"Repara la solicitud","The email \"Run SPSS on every ticket and stop churn\" has four defects. Each one needs a repair.":"El correo \"Pasa todos los tickets por SPSS y detén el abandono\" tiene cuatro defectos. Cada uno necesita una reparación.","Drag each repair to the defect it fixes. One repair does not help.":"Arrastra cada reparación al defecto que corrige. Una reparación no sirve.","<p>The repaired question: \"Among active monthly subscribers, is an unresolved weekend support ticket associated with a meaningful increase in 60-day cancellation rates compared to weekday tickets?\"</p>\n          <p>It keeps the manager's intent, but evidence could answer it either way. The fixed 60-day window matters: without it, the meaning of churn drifts and results cannot be matched across tools.</p>":"<p>La pregunta reparada: \"Entre los suscriptores mensuales activos, ¿un ticket de soporte de fin de semana sin resolver está asociado con un aumento relevante en la tasa de cancelación a 60 días en comparación con los tickets entre semana?\"</p>\n          <p>Conserva la intención del gerente, pero la evidencia podría responderla en cualquier sentido. La ventana fija de 60 días importa: sin ella, el significado de abandono cambia y los resultados no se pueden comparar entre herramientas.</p>","US monthly subscribers; unresolved weekend vs resolved weekday tickets; 60 days":"Suscriptores mensuales de EE. UU.; tickets de fin de semana sin resolver vs. tickets entre semana resueltos; 60 días","Use every ticket since the company began":"Usar todos los tickets desde que empezó la empresa","Start from the $450,000 staffing decision":"Partir de la decisión de personal de $450,000","Ask whether a pattern is associated with cancellation":"Preguntar si un patrón está asociado con la cancelación","Names SPSS before the problem":"Nombra SPSS antes que el problema","Promises to \"stop churn\"":"Promete \"detener el abandono\"","No decision owner":"No hay responsable de la decisión","No population, comparison or time horizon":"No hay población, comparación ni horizonte temporal","More tickets do not fix a missing boundary. Old, unrelated records add noise to the comparison.":"Más tickets no arreglan un límite que falta. Los registros antiguos y no relacionados agregan ruido a la comparación.","This fixes the promise. The tool defect is fixed by starting from the decision instead of the software.":"Esto corrige la promesa. El defecto de la herramienta se corrige partiendo de la decisión en lugar del software.","Starting from the decision fixes the tool-first order. The promise is fixed by asking about an association.":"Partir de la decisión corrige el orden de empezar por la herramienta. La promesa se corrige preguntando por una asociación.","VP of Customer Operations: fund 40 weekend reps for $450,000 a year?":"VP de Operaciones de Clientes: ¿financiar 40 representantes de fin de semana por $450,000 al año?","What does a Monday queue show?":"¿Qué muestra una cola del lunes?","Support runs Monday to Friday. Every Monday, 4,200 tickets are unresolved. Managers say this proves weekend frustration.":"El soporte funciona de lunes a viernes. Cada lunes hay 4,200 tickets sin resolver. Los gerentes dicen que esto demuestra frustración durante el fin de semana.","Before you support the budget, what must you check in the raw ticket logs?":"Antes de apoyar el presupuesto, ¿qué debes revisar en los registros brutos de tickets?","<p>A Monday queue shows when tickets were <i>waiting</i>, not when they were <i>created</i>. Check the submission timestamp, the time zone, and whether each log row is one ticket or one customer. Other explanations for a Monday surge include Friday-evening tickets, an outage or a batch import.</p>\n          <p>This is the <b>Inspect</b> step: check provenance and grain before any calculation.</p>":"<p>Una cola del lunes muestra cuándo los tickets estaban <i>esperando</i>, no cuándo se <i>crearon</i>. Revisa la marca de tiempo de envío, la zona horaria y si cada fila del registro es un ticket o un cliente. Otras explicaciones de un pico el lunes son los tickets del viernes por la noche, una caída del sistema o una importación por lotes.</p>\n          <p>Este es el paso <b>Inspeccionar</b> (Inspect): revisa la procedencia y la granularidad antes de cualquier cálculo.</p>","When each ticket was submitted, not just when it entered the Monday queue":"Cuándo se envió cada ticket, no solo cuándo entró en la cola del lunes","Whether 40 representatives could clear 4,200 tickets by noon":"Si 40 representantes podrían despachar 4,200 tickets antes del mediodía","That plans the solution before the problem is confirmed. First check when the tickets were created.":"Eso planifica la solución antes de confirmar el problema. Primero revisa cuándo se crearon los tickets.","Nothing. A backlog that large proves weekend demand.":"Nada. Una acumulación tan grande demuestra demanda de fin de semana.","Plausible is not proof. Monday tickets may come from Friday evening, a system outage or a batch upload.":"Plausible no es prueba. Los tickets del lunes pueden venir del viernes por la noche, de una caída del sistema o de una carga por lotes.","The average length of the text in each ticket":"La longitud media del texto de cada ticket","Text length does not show when the customer had the problem.":"La longitud del texto no muestra cuándo tuvo el problema el cliente.","Check submission timestamps, and whether a log row is a ticket or a customer":"Revisar las marcas de tiempo de envío y si una fila del registro es un ticket o un cliente","A rate with the wrong parts":"Una tasa con las partes equivocadas","A manager divides the Monday backlog by all accounts: 4,200 ÷ 2,400,000 = 0.175%. The slide says \"0.175% of customers are stuck each weekend.\"":"Un gerente divide la acumulación del lunes entre todas las cuentas: 4,200 ÷ 2,400,000 = 0.175%. La diapositiva dice: \"El 0.175% de los clientes se queda atascado cada fin de semana\".","What is the main problem with this rate?":"¿Cuál es el problema principal de esta tasa?","<p>A rate needs its top and bottom to count the same unit, over the same scope and time. Here the top counts <b>tickets</b> waiting on Monday, and the bottom counts <b>all 2.4 million accounts</b>, including people who never contacted support.</p>\n          <p>Your toolkit makes the same point with a café: dividing timely mobile pickups by all café transactions makes a rate artificially small. Write the denominator rule before you calculate.</p>":"<p>Una tasa necesita que el numerador y el denominador cuenten la misma unidad, con el mismo alcance y en el mismo periodo. Aquí el numerador cuenta <b>tickets</b> que esperan el lunes, y el denominador cuenta <b>los 2.4 millones de cuentas</b>, incluidas personas que nunca contactaron al soporte.</p>\n          <p>Tu toolkit plantea lo mismo con una cafetería: dividir los pedidos móviles entregados a tiempo entre todas las transacciones de la cafetería hace que la tasa sea artificialmente pequeña. Escribe la regla del denominador antes de calcular.</p>","It counts tickets on top and accounts below; one customer can file several tickets":"Cuenta tickets arriba y cuentas abajo; un mismo cliente puede abrir varios tickets","Nothing. 4,200 ÷ 2,400,000 really is 0.175%.":"Nada. 4,200 ÷ 2,400,000 realmente es 0.175%.","The arithmetic is right. The meaning is not: tickets and customers are different units, and Monday queue time is not the weekend.":"La aritmética es correcta. El significado no: tickets y clientes son unidades distintas, y el tiempo en la cola del lunes no es el fin de semana.","The denominator should be the 40 new representatives":"El denominador deberían ser los 40 nuevos representantes","Staff are not the people at risk. The denominator should be the eligible subscribers.":"El personal no es el grupo en riesgo. El denominador deberían ser los suscriptores elegibles.","It should be rounded to 0.2% for the slide":"Debería redondearse a 0.2% para la diapositiva","Rounding does not fix a numerator and denominator that count different things.":"Redondear no arregla un numerador y un denominador que cuentan cosas distintas.","Evidence informs, people decide":"La evidencia informa, las personas deciden","Suppose the analysis is done. The records can answer some questions. Others stay with the Vice President.":"Supón que el análisis ya está hecho. Los registros pueden responder algunas preguntas. Otras le corresponden al vicepresidente.","Label each statement. Who can settle it: the evidence or the leader?":"Clasifica cada afirmación. ¿Quién puede resolverla: la evidencia o el líder?","<p>Quantitative evidence reduces uncertainty: patterns, counts, missing records and consistent results across tools. Managerial judgment weighs that evidence against budget, staffing, contracts, ethics and other options.</p>\n          <p>Use the sentence frame: \"The evidence can show ___, but the decision maker must still judge ___.\"</p>":"<p>La evidencia cuantitativa reduce la incertidumbre: patrones, conteos, registros faltantes y resultados coherentes entre herramientas. El juicio gerencial sopesa esa evidencia frente al presupuesto, el personal, los contratos, la ética y otras opciones.</p>\n          <p>Usa esta estructura: \"La evidencia puede mostrar ___, pero quien decide todavía debe juzgar ___\".</p>","Evidence can show":"La evidencia puede mostrar","Leader must judge":"El líder debe juzgar","Neither: an overclaim":"Ninguno: una afirmación exagerada","When weekend tickets occur in approved records":"Cuándo ocurren los tickets de fin de semana en los registros aprobados","Whether $450,000 fits the budget":"Si $450,000 caben en el presupuesto","How many records are missing or unusual":"Cuántos registros faltan o son inusuales","Whether a chatbot or help pages are a better use of money":"Si un chatbot o unas páginas de ayuda son un mejor uso del dinero","That weekend staff will end the cancellation rise":"Que el personal de fin de semana acabará con el aumento de cancelaciones","Records describe patterns and data quality. Budget limits and choices among options are judgments.":"Los registros describen patrones y la calidad de los datos. Los límites de presupuesto y la elección entre opciones son juicios.","Budget tolerance and trade-offs belong to the leader. Timing patterns and missing counts are evidence work.":"La tolerancia al presupuesto y las concesiones le corresponden al líder. Los patrones de horario y los conteos de faltantes son trabajo de evidencia.","Use \"Neither\" for a promise about the future. No record can show it, and no leader can judge it true.":"Usa \"Ninguno\" para una promesa sobre el futuro. Ningún registro puede mostrarla y ningún líder puede juzgarla como verdadera.","What counts as ready?":"¿Qué cuenta como estar listo?","Before any OmniRetail analysis, you must show Minimum Viable Readiness in Excel and SPSS. An app that opens is not enough.":"Antes de cualquier análisis de OmniRetail, debes demostrar la preparación mínima viable (Minimum Viable Readiness) en Excel y SPSS. Que la aplicación abra no basta.","Drag each action to the readiness pillar it proves. One tile proves nothing.":"Arrastra cada acción al pilar de preparación que demuestra. Una ficha no demuestra nada.","<p>Readiness is proven by artifacts another analyst can reopen and repeat. In class, the Excel trace changed an hourly support wage from $20 to $25, checked the linked output, and changed it back. The SPSS trace ran only the named syntax block, read the log, saved each file, closed everything and reopened it.</p>":"<p>La preparación se demuestra con archivos que otro analista puede volver a abrir y repetir. En clase, la prueba en Excel cambió un salario de soporte por hora de $20 a $25, revisó el resultado vinculado y lo devolvió a su valor. La prueba en SPSS ejecutó solo el bloque de sintaxis indicado, leyó el registro, guardó cada archivo, cerró todo y lo volvió a abrir.</p>","Close both files, reopen them, and confirm the results still appear":"Cerrar ambos archivos, volver a abrirlos y confirmar que los resultados siguen ahí","Keep the raw file untouched and work in a named copy":"Dejar intacto el ar
